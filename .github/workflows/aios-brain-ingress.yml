name: AIOS Brain Issue Ingress

"on":
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: aios-brain-ingress-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event.issue.title == '[AIOS BRAIN INGRESS]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11+
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact pinned AIOS-renew
        run: |
          python -m pip install --no-input -r .agents/skills/aios-worker/requirements-aios-renew.txt

      - name: Deliver immutable Issue event once
        id: ingress
        continue-on-error: true
        env:
          AIOS_RECEIPT_PATH: ${{ runner.temp }}/aios-brain-ingress-receipt.txt
        run: |
          python -m aios_renew.github_issue_ingress --event "$GITHUB_EVENT_PATH" --policy .ai/brain-ingress-carriers.yaml --repo . > "$AIOS_RECEIPT_PATH"

      - name: Post bounded transport receipt
        if: always()
        uses: actions/github-script@v7
        env:
          AIOS_RECEIPT_PATH: ${{ runner.temp }}/aios-brain-ingress-receipt.txt
          AIOS_INGRESS_OUTCOME: ${{ steps.ingress.outcome }}
        with:
          script: |
            const fs = require('fs');
            const successful = process.env.AIOS_INGRESS_OUTCOME === 'success';

            let receipt = 'AIOS BRAIN INGRESS RECEIPT\nstatus: FAIL\nreason: carrier produced no receipt';
            try {
              receipt = fs.readFileSync(process.env.AIOS_RECEIPT_PATH, 'utf8').trimEnd();
            } catch (_) {}

            receipt = receipt.replaceAll('\0', '?').slice(0, 3500);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: receipt,
            });
            if (successful) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
            }

      - name: Preserve failed delivery outcome
        if: always() && steps.ingress.outcome != 'success'
        run: exit 1
