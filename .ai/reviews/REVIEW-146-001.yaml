findings:
  - id: F1
    basis: AC2
    severity: MEDIUM
    title: discover silently accepts duplicate single-occurrence Human controls
    finding: >
      TASK-146 requires exactly one --query and exactly one --cdp-endpoint for discover,
      while only --platform is explicitly repeatable; it also defines one optional
      --shortlist-size control. The implementation uses argparse's default store action for
      --query, --cdp-endpoint, and --shortlist-size. Supplying any of those options more than
      once is therefore accepted and the last value silently overwrites the earlier Human
      value. This violates the exact Human-input boundary and allows conflicting query/CDP
      selections to be resolved implicitly by the CLI instead of failing closed.
    required_change: >
      Modify only src/product_intelligence/cli.py and focused CLI tests as needed. Make the
      discover parser reject repeated occurrences of --query and --cdp-endpoint, and reject
      repeated --shortlist-size when supplied, with argparse-style exit code 2. Preserve
      repeated --platform exactly as the sole repeatable discover control and preserve all
      existing TASK-145 behavior, orchestration composition, cleanup, error handling, docs,
      and M2/browser authorities. Add focused regression tests proving duplicate single-value
      discover options fail closed and ordered repeated --platform continues to work.
    review_scope: >
      FIX review must inspect only the F1 parser/test delta and directly introduced regression
      risk. Do not rerun or redesign the TASK-146 PRIMARY implementation and do not reopen the
      already-passing discovery/orchestration/browser semantics unless the fix changes them.
