findings:
  - id: F1
    basis: AC2
    action: CODE_FIX
    location: src/product_intelligence/cli.py:_parser discover arguments
    issue: >
      The discover parser accepts repeated occurrences of single-value Human controls
      --query, --cdp-endpoint, and --shortlist-size because argparse's default store
      action silently keeps the last supplied value. TASK-146 requires exactly one
      --query and exactly one --cdp-endpoint, allows --shortlist-size only as one
      optional control, and reserves repetition only for --platform. Silent overwrite
      therefore violates the exact Human-input and fail-closed boundary in AC2.
    expected: >
      Modify only src/product_intelligence/cli.py and
      tests/product_intelligence/test_product_intelligence_cli.py as needed. Make
      discover reject repeated --query, repeated --cdp-endpoint, and repeated
      --shortlist-size with argparse-style exit code 2. Preserve ordered repeated
      --platform as the sole repeatable discover control and preserve all other
      TASK-146 behavior and authorities unchanged. Add focused regression tests for
      these duplicate-option cases.
