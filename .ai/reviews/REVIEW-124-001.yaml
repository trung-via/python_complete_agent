findings:
  - id: F1
    basis: AC3
    action: CODE_FIX
    location: src/product_intelligence/canonical_rag_context.py:build_canonical_rag_context/render_canonical_rag_context
    issue: >
      TASK-124 correctly stops swallowing CanonicalRagContextError during supplemental
      packing, but canonical JSON serialization itself still happens outside the
      canonical error boundary. _render_canonical_rag_context_dict returns a Python
      mapping and both the builder and public renderer call json.dumps directly.
      TASK-121/TASK-123 evidence values do not validate every optional model-facing
      field as JSON-serializable (for example OriginalMediaRef.alt_text,
      variant_label, and content_type are not type-validated). A malformed retained
      supplemental value such as bytes in a whitelisted field therefore reaches
      json.dumps and raises raw TypeError instead of the required
      CanonicalRagContextError. The failure is no longer misreported as truncation,
      but the TASK-124 hard invariant that non-renderable model-facing evidence fails
      through the canonical RAG error boundary is still incomplete.
    expected: >
      Introduce one private deterministic canonical JSON serialization boundary used
      by both supplemental byte measurement and render_canonical_rag_context. It must
      use the exact existing JSON options and translate serialization/encoding
      failures for otherwise exact CanonicalRagContext inputs into
      CanonicalRagContextError without parsing exception-message text. Byte-budget
      enforcement remains separate: the private serialization step establishes
      render validity and exact bytes/text, then the caller decides whether a valid
      tentative context fits. Add a focused regression with a valid retrieval witness
      plus a supplemental whitelisted field containing a non-JSON-serializable value,
      proving build_canonical_rag_context raises CanonicalRagContextError rather than
      TypeError or truncating the block. Preserve schema/version, valid byte-for-byte
      output, ordering, identity reuse, whitelist, and all no-model/no-I/O semantics.
