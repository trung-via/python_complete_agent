findings:
  - id: F192-001
    basis: AC3
    action: CODE_FIX
    location: .ai/aios-adoption-state.yaml; tests/aios_bridge/test_aios_governance_state.py
    issue: >
      The adoption registry claims an upstream audit through authored TASK-103 and TASK-192
      requires every currently relevant AIOS architecture/correction family at that checkpoint
      to receive an explicit adoption classification so future Brain Sync cannot silently forget
      it. The registry does not satisfy that completeness claim. At the exact upstream audit
      checkpoint 7d0bbcbce4b1bfeaa47634f9069a8ae9ac44930c, canonical AIOS roadmap state records
      Admission Failure v2/TASK-081 and Correction Preflight/TASK-085 as completed items in the
      active control-plane closure sequence, and A6 automated REVIEW-to-REMEDIATION wakeup/TASK-084
      as completed parallel outer automation. None of TASK-081, TASK-085, or TASK-084 appears in
      any capability_families entry. The focused governance regression likewise asserts a selected
      subset of tasks and therefore passes while those canonical capability families are absent.
      This recreates the class of omission TASK-192 is specifically intended to prevent: a future
      Brain can read a registry marked through TASK-103 and still miss architecture that the exact
      upstream roadmap says exists.
    expected: >
      Reconcile the adoption registry against the exact upstream checkpoint and make its claimed
      coverage complete. Explicitly classify the missing active control-plane families, including
      TASK-081 Admission Failure v2 and TASK-085 Correction Preflight, as consumed through the exact
      pinned kernel when applicable; explicitly classify TASK-084/A6 under the optional/not-applicable
      outer-automation boundary unless Python Agent deliberately adopts that surface. Preserve the
      separate Python Agent Governance Foundation return target and do not copy upstream Runtime or
      outer-automation implementation downstream. Strengthen the offline governance regression so
      these checkpoint-visible families cannot silently disappear while the registry still claims
      audit coverage through TASK-103. Re-run only TASK-192 canonical verification after the narrow
      correction; do not restart PRIMARY or discard the reviewed source lineage.
