      The frozen P7.1 cohort cannot be accepted as valid real-evidence coverage because its live Shopee snapshots contain a systematic sold-count extraction anomaly: all fifteen candidates persist sold_count exactly equal to the candidate price (for example 590000/590000, 175000/175000, 999000/999000, and 302001/302001). The current ShopeeDiscoveryAdapter sold-count selector includes the generic `.truncate` fallback, so on the current Shopee DOM it can select a price-bearing element and parse that monetary text as sold volume. SnapshotNormalizer treats every non-None sold_count as OBSERVED `sold_volume`, so the frozen report consequently marks DEMAND partial for all fifteen candidates and emits STRONG_DEMAND from evidence that is not semantically trustworthy. Runtime replay is deterministic, but deterministic replay of malformed marketplace evidence does not satisfy TASK-182 AC2's fail-closed malformed-capture boundary and cannot support AC6's claim of an exact measured real-evidence baseline.
