task_id: TASK-114
revision: 1

goal: >
  Add a bounded, platform-neutral canonical product-family admission boundary that
  consumes exactly one existing TASK-112 FamilyMergeDecisionRecord with explicit
  Human APPROVE plus one explicit caller-supplied opaque family_id, and returns an
  immutable canonical family record binding that exact identity to the exact
  approved member tuple and approval provenance without generating identity,
  re-running entity resolution, assigning sellable variants, persisting catalog
  state, aggregating profile evidence, or performing any external side effect.

problem: >
  TASK-112 intentionally stops at Human approval: APPROVE authorizes only a future
  milestone to treat the exact proposal member set as one canonical product family.
  The system therefore still lacks a narrow canonical family identity boundary.
  That boundary must not infer or generate a stable ID from the current observation
  set because membership may grow later, and it must not combine family admission
  with variant resolution or persistent catalog mutation. The next milestone should
  bind one explicit externally allocated family identifier to one exact approved
  family while preserving all prior evidence and authority boundaries.

assumptions:
  - >
    Current canonical python_complete_agent main baseline is
    8b3bf2c0e13774be9e815b92a02c950b8a7ec4f9.
  - >
    TASK-108 remains the sole pairwise entity-resolution authority and distinguishes
    EXACT_VARIANT_MATCH, SAME_PRODUCT_FAMILY, DIFFERENT_PRODUCT, and UNCERTAIN.
  - >
    TASK-109 preserves complete pairwise graph evidence and consistency conflicts.
  - >
    TASK-111 projects provisional product-family groups without creating canonical
    identity.
  - >
    TASK-112 creates immutable evidence-complete FamilyMergeProposal values and
    explicit Human FamilyMergeDecisionRecord values; only APPROVE authorizes a later
    milestone to treat that exact member set as one canonical family.
  - >
    Global family-id allocation, uniqueness across a persistent catalog, reuse of an
    existing family identity when new observations arrive, singleton admission, and
    sellable-variant identity remain separate later concerns.

scope:
  inspect:
    - .ai/tasks/TASK-108.yaml
    - .ai/tasks/TASK-109.yaml
    - .ai/tasks/TASK-111.yaml
    - .ai/tasks/TASK-112.yaml
    - src/product_intelligence/entity_resolution.py
    - src/product_intelligence/entity_resolution_graph.py
    - src/product_intelligence/entity_grouping.py
    - src/product_intelligence/family_merge_approval.py
    - src/product_intelligence/__init__.py
    - tests/product_intelligence/test_family_merge_approval.py
    - docs/PHASE_6_M3_ENTITY_RESOLUTION.md

  modify:
    - src/product_intelligence/canonical_family.py
    - src/product_intelligence/__init__.py
    - tests/product_intelligence/test_canonical_family.py
    - docs/PHASE_6_M3_ENTITY_RESOLUTION.md

non_goals:
  - Modify TASK-108 pairwise entity-resolution semantics or confidence.
  - Modify TASK-109 graph construction, conflicts, or pairwise evidence.
  - Modify TASK-111 grouping semantics, ordering, or statuses.
  - Modify TASK-112 proposal or Human decision semantics.
  - Re-run pairwise resolution, multi-observation resolution, grouping, or proposal construction.
  - Generate a family_id from member identities, hashes, timestamps, random values, UUIDs, marketplace identifiers, title/model text, or evidence contents.
  - Prove global uniqueness of family_id without a catalog/store authority.
  - Canonicalize singleton provisional groups in this milestone.
  - Create, infer, group, allocate, or persist sellable variant identities.
  - Convert EXACT_VARIANT_MATCH connectivity into a variant group or transitive variant truth.
  - Merge or rewrite ProductSourcePack values, source observations, pairwise relationships, confidence, reasons, or ResolutionEvidence.
  - Choose canonical title, brand, model, GTIN, MPN, media, price, seller, category, or other canonical profile fields.
  - Add database, filesystem persistence, queue, network, browser, Drive, LLM, scoring, ranking, ingestion, retrieval, RAG, or external-service behavior.
  - Add autonomous merge policy or machine approval.

constraints:
  hard:
    - >
      The public canonical-family creation boundary must consume exactly one existing
      FamilyMergeDecisionRecord and one explicit caller-supplied family_id. It must
      not accept a graph, provisional group, ProductSourcePack collection, resolver,
      proposal substitute, or implicit/default identity source.
    - >
      Canonical family creation is permitted only when decision_record.decision is
      exactly FamilyMergeDecision.APPROVE. REJECT and any non-explicit/non-enum
      decision must fail closed; no property of proposal evidence may substitute for
      Human APPROVE.
    - >
      family_id is an opaque caller-supplied string. It must be explicit, non-empty,
      single-line, free of NUL, and contain no leading or trailing whitespace. The
      accepted value must be preserved exactly; this milestone must not normalize,
      parse, hash, prefix, suffix, generate, or otherwise reinterpret it.
    - >
      The output must be immutable and preserve exactly the approved proposal member
      tuple in its existing canonical TASK-111 order. No member may be added,
      removed, duplicated, reordered, replaced, or inferred.
    - >
      The output must retain the exact FamilyMergeDecisionRecord as approval
      provenance so actor, decided_at, proposal, pair_evidence, relationships,
      confidence, reasons, and ResolutionEvidence remain auditable through the
      preserved record without recomputation or semantic rewriting.
    - >
      The canonical family record may expose only the explicit family identity,
      exact approved member tuple, and approval provenance plus trivial derived
      read-only properties such as member_count. It must not expose product_id,
      variant_id, group_id, proposal_id, aggregate confidence, merge confidence,
      canonical profile fields, auto-merge recommendation, persistence handle, or
      catalog authority.
    - >
      Equivalent calls with the same valid family_id and the same exact approved
      decision record must be semantically identical. No wall clock, random source,
      environment state, filesystem state, process state, network state, or global
      mutable registry may affect the result.
    - >
      The boundary must perform zero entity-resolution, graph-resolution, grouping,
      proposal-construction, scoring, ranking, ingestion, persistence, network,
      browser, Drive, LLM, queue, or external-service calls.
    - >
      Family admission does not assert that all approved observations are the same
      sellable variant. Existing SAME_PRODUCT_FAMILY and UNCERTAIN pair evidence must
      remain unchanged in approval provenance; no transitive variant claim may be
      introduced.
    - >
      No operation in this task may mutate the supplied decision record, proposal,
      pair evidence, member identities, source data, catalog, or external state.

acceptance:
  - id: AC1
    condition: >
      A valid exact TASK-112 FamilyMergeDecisionRecord with decision APPROVE plus one
      explicit valid family_id produces one immutable canonical product-family record
      without requiring graph, source-pack, resolver, grouping, or proposal inputs.

  - id: AC2
    condition: >
      REJECT, wrong decision-record type, or any attempt to bypass explicit Human
      APPROVE fails closed and creates no canonical family result.

  - id: AC3
    condition: >
      family_id is required and fail-closed for empty, whitespace-only, leading or
      trailing whitespace, multiline, NUL-containing, or non-string values; a valid
      opaque family_id is preserved exactly and is never generated or normalized.

  - id: AC4
    condition: >
      The canonical family record preserves exactly decision_record.proposal.members
      in canonical order and exposes no additional inferred or rewritten members.

  - id: AC5
    condition: >
      The canonical family record retains the exact Human decision record as approval
      provenance, preserving proposal pair evidence, actor, decided_at, relationships,
      confidence, reasons, and ResolutionEvidence unchanged and auditable.

  - id: AC6
    condition: >
      The result is immutable and deterministic: equivalent valid inputs yield
      semantically identical records and no clock, random/UUID generator, hash-derived
      identity, environment, filesystem, network, or global mutable state influences
      canonical family identity.

  - id: AC7
    condition: >
      The new boundary performs zero calls to TASK-108 resolution, TASK-109
      multi-observation resolution, TASK-111 grouping, or TASK-112 proposal creation;
      it consumes existing approval lineage only.

  - id: AC8
    condition: >
      Canonical family admission does not create or imply product_id, variant_id,
      group_id, proposal_id, aggregate/merge confidence, canonical product profile,
      auto-merge recommendation, persistence, catalog mutation, or external side
      effect.

  - id: AC9
    condition: >
      Existing SAME_PRODUCT_FAMILY, EXACT_VARIANT_MATCH, and UNCERTAIN evidence inside
      the approved proposal remains unchanged; family admission never converts
      family membership into transitive sellable-variant truth.

  - id: AC10
    condition: >
      Focused regressions cover valid APPROVE admission, REJECT/wrong-type failure,
      family_id validation and exact preservation, exact member/provenance retention,
      immutability, deterministic repeated construction, zero resolver/grouping/
      proposal re-execution, no generated identity, no variant identity, and zero
      persistence/external side effects while retaining TASK-112 behavior.

verification:
  required:
    - '$env:PYTHONPATH = ".;src"; python -m pytest tests/product_intelligence/test_family_merge_approval.py tests/product_intelligence/test_canonical_family.py -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
