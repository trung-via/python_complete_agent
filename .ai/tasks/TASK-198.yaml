non_goals:
  - >
    Publish, cherry-pick, merge, rebase, rewrite, delete, repair, or otherwise
    mutate RUN-197-001 candidate
    8992e64654b1342a70ad37c9c0aa693ce537a975 or malformed review-decision
    f334312384543dd4726e83089601e375dd5da17b.
  - >
    Treat REVIEW-197-001 semantic PASS as authority to bypass the structurally
    malformed decision or current downstream publication boundary.
  - >
    Continue TASK-197 revision 1 after this migration. A later fresh TASK-197
    revision must start from post-migration canonical main if the Governance
    roadmap reconciliation remains required.
  - >
    Modify Python Agent product/domain source, Product Intelligence behavior,
    marketplace/browser/session logic, ranking, scoring, persistence,
    retrieval/RAG, evidence semantics, product truth, provider/model behavior,
    or commerce features.
  - >
    Copy AIOS-renew Runtime, authoring-ingress implementation, publication
    state machine, correction frontier, Unified State, performance collector,
    or lifecycle reducer into Python Agent.
  - >
    Expose AUTHOR_TASK, SUBMIT_REVIEW, AUTHOR_REMEDIATION, or AUTHOR_REPAIR as
    Human worker lifecycle actions under `$aios-worker` or
    `/aios-renew-worker`.
  - >
    Give the worker semantic-review, Brain, publication, roadmap-selection, or
    remediation-authoring authority.
  - >
    Introduce a floating AIOS branch/tag/main dependency, duplicate pin
    authority, automatic upstream following, retry, reroute, daemon, planner,
    second lifecycle reducer, or autonomous migration.
  - >
    Modify `.github/workflows/aios-auto-publish.yml` unless canonical inspection
    proves the existing workflow cannot consume the migrated checked-in pin.
    Scope widening requires separate Brain review.
  - >
    Pin Python Agent to upstream roadmap-only commit
    df65e3f9468d1cc408739ebd89165880ea18afd7.
  - >
    Mark the pending Python Agent Product Contract or Project Contract
    reconciliation milestones DONE.
  - >
    Push, publish, or mutate canonical main from Executor implementation
    execution.

constraints:
  hard:
    - >
      Replace the sole active downstream AIOS dependency pin and launcher
      provenance from
      2599202afedb0622e9e9bdc7b5a15f34da01cc27 to exactly
      a3b723b49cd65677f548c5694a52a6fc006a9e2a. No floating ref or second
      active pin authority may exist.
    - >
      The repository-owned worker bootstrap must continue to validate exact
      source-plus-commit provenance through the checked-in requirements pin
      before invoking AIOS. A stale or alternate runtime must fail closed or
      be deterministically rebuilt to the exact new pin under existing
      bootstrap authority.
    - >
      Preserve the existing Human-facing worker protocol exactly:
      CONTINUE TASK-N, STATUS TASK-N, RUN TASK-N, FIX TASK-N FINDING-ID,
      REPAIR RUN-N-NNN, with existing Codex and Antigravity executor-selection
      boundaries. Do not expose Brain authoring operations through these
      worker surfaces.
    - >
      Establish one repository-owned Brain-only ingress carrier that resolves
      and proves the same exact pinned AIOS distribution used as downstream
      authority, then delegates only canonical AIOS ingress operations
      AUTHOR_TASK, SUBMIT_REVIEW, AUTHOR_REMEDIATION, and AUTHOR_REPAIR.
      It must not use ambient PATH `aios`, a mutable upstream checkout,
      system/global site-packages, current AIOS-renew main, or another
      unproven runtime.
    - >
      The Brain-only carrier is transport/provenance only. It must not
      reinterpret TASK or REVIEW semantics, select lifecycle action, invoke
      an Executor, perform semantic review, decide remediation, publish
      source, advance roadmap state, retry, reroute, or create a second
      authoring state machine.
    - >
      Brain-ingress invocation must fail closed before canonical ref mutation
      when the exact pinned runtime cannot be proven. It must pass the
      repository root and caller-supplied ingress envelope to the pinned
      canonical `aios_renew.operator ingress` surface without caller-selected
      arbitrary Git destinations or raw Git mutation authority.
    - >
      Preserve Python Agent Constitution role separation: ARCHITECT/Brain
      authoring, EXECUTION_RUNTIME deterministic lifecycle, exactly one
      EXECUTOR for admitted HOW, SEMANTIC_REVIEWER independent verdict, and
      SOURCE_PUBLISHER source-only publication remain distinct authorities.
    - >
      Update `.ai/aios-adoption-state.yaml` so
      `downstream_pin.commit` becomes exactly
      a3b723b49cd65677f548c5694a52a6fc006a9e2a while separately recording the
      upstream roadmap audit checkpoint
      df65e3f9468d1cc408739ebd89165880ea18afd7 as planning evidence, never
      runtime authority.
    - >
      Reconcile downstream adoption classifications so published TASK-103
      correction-frontier hardening and TASK-101 revision-4 Performance
      Closure are ADOPTED_BY_PIN, and TASK-104/TASK-105 are represented as one
      recovered Brain Authoring Ingress capability whose safe downstream
      semantics are those after TASK-105, not the malformed historical
      pre-recovery behavior.
    - >
      Preserve optional/non-applicable outer-automation classifications and
      all previously adopted capability families unless the new exact pin
      supersedes only their source provenance.
    - >
      Update `.ai/roadmap-state.yaml` only as necessary to reconcile the
      previously BLOCKED_PENDING_UPSTREAM TASK-101/TASK-103 adoption facts
      with the new exact pin and to record that emergency downstream recovery
      is non-product control-plane work. Do not mark Governance Foundation
      Product Contract or Project Contract reconciliation complete and do not
      treat Runtime execution as automatic roadmap advancement.
    - >
      Preserve RUN-197-001, candidate
      8992e64654b1342a70ad37c9c0aa693ce537a975, REVIEW-197-001, and malformed
      decision f334312384543dd4726e83089601e375dd5da17b as immutable incident
      lineage. New code/tests must never rewrite or silently certify the
      malformed decision.
    - >
      A structurally malformed existing ingress destination must remain
      fail-closed under the migrated TASK-105 semantics; idempotency is valid
      only for an exact structurally valid existing destination.
    - >
      Existing `.github/workflows/aios-auto-publish.yml` must remain
      source-only publication authority and continue consuming the
      checked-in exact requirements pin from the triggering candidate/
      decision snapshot. It must never publish review metadata commits.
    - >
      The TASK-198 implementation candidate itself must not rely on the
      currently malformed RUN-197 decision or on a global/unpinned ingress for
      its semantic publication. Until TASK-198 is published, any required
      review-decision bootstrap is an exceptional bounded Human/Brain recovery
      step and is not new product authority.
    - >
      Verification must be deterministic and offline. No test may depend on
      live GitHub, marketplace/browser/CDP, provider/LLM, Drive, wall clock,
      random UUID values, or mutable external state.
    - >
      Do not weaken, delete, skip, xfail, duplicate, or bypass existing
      relevant worker, publication, governance, provenance, or authority
      regression coverage.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      Python Agent's only active AIOS dependency and launcher provenance are
      exactly a3b723b49cd65677f548c5694a52a6fc006a9e2a; stale pin
      2599202afedb0622e9e9bdc7b5a15f34da01cc27 is rejected as active runtime
      authority and no floating or duplicate pin exists.
  - id: AC2
    condition: >
      Existing Codex and Antigravity Human worker surfaces retain the same
      protocol and one-operation delegation semantics with no new Brain,
      review, publication, lifecycle-selection, retry, or reroute authority.
  - id: AC3
    condition: >
      A repository-owned Brain-only ingress path deterministically proves and
      uses the exact downstream pin for AUTHOR_TASK, SUBMIT_REVIEW,
      AUTHOR_REMEDIATION, and AUTHOR_REPAIR, rejects ambient/global/mutable
      AIOS authority, and adds no second semantic or lifecycle state machine.
  - id: AC4
    condition: >
      Downstream adoption state records exact pin a3b723b..., separately
      records upstream planning checkpoint df65e3f..., marks TASK-101 r4 and
      TASK-103 recovered/published capability as adopted through the pin, and
      records TASK-104/TASK-105 as recovered Brain Authoring Ingress with
      TASK-105 semantics authoritative for safe new operations.
  - id: AC5
    condition: >
      Python Agent roadmap/adoption planning no longer classifies TASK-101 or
      TASK-103 as blocked pending upstream after this exact-pin migration,
      while Governance Foundation Product Contract and Project Contract
      reconciliation remain not done and roadmap mutation remains Brain-owned.
  - id: AC6
    condition: >
      RUN-197-001 candidate, semantic review, and malformed decision remain
      immutable incident evidence; the malformed decision is not rewritten,
      certified, or published, and TASK-197 revision 1 is not resumed through
      that decision.
  - id: AC7
    condition: >
      Existing source-only auto-publication behavior remains unchanged in
      authority: only the exact reviewed source candidate may advance main,
      the workflow consumes the checked-in migrated pin, and review-decision
      metadata never becomes product/source publication.
  - id: AC8
    condition: >
      Focused deterministic regressions prove exact pin/provenance,
      stale-runtime replacement, unchanged Human worker surface, pinned
      Brain-ingress isolation/fail-closed behavior, adoption classification,
      roadmap authority preservation, and no dependency on live external
      state.
  - id: AC9
    condition: >
      Delta remains within authorized control-plane/governance integration
      files, Product Intelligence source is unchanged, required verification
      passes, `git diff --check` passes, and RESULT has zero unresolved items.

