task_id: TASK-198
revision: 1

goal: >
  Recover Python Agent downstream AIOS authority after the upstream TASK-104
  Brain Authoring Ingress structural regression by migrating the sole active
  AIOS-renew dependency from the current TASK-102-era pin to the exact
  reviewed and source-published post-TASK-105 source candidate, while also
  ensuring future Brain authoring operations for this repository are bound
  deterministically to that same exact downstream pin rather than to any
  ambient, global, mutable, or system-installed AIOS runtime.

problem: >
  Python Agent currently pins AIOS-renew at
  2599202afedb0622e9e9bdc7b5a15f34da01cc27. Upstream AIOS later introduced
  Brain Authoring Ingress in TASK-104, then production evidence proved that
  pre-recovery SUBMIT_REVIEW, AUTHOR_REMEDIATION, and AUTHOR_REPAIR could
  construct sparse Git snapshots that omitted predecessor-tree content.
  TASK-105 repaired that generic control-plane defect and TASK-101 revision 4
  subsequently completed Performance Closure on the recovered lineage.
  Python Agent RUN-197-001 independently produced valid candidate
  8992e64654b1342a70ad37c9c0aa693ce537a975 with canonical verification and
  semantic REVIEW-197-001 PASS, but its canonical review-decision
  f334312384543dd4726e83089601e375dd5da17b was materialized through an
  authoring ingress not proven to be the exact Python Agent downstream pin
  and reproduced the sparse-tree incident pattern: the decision preserved the
  reviewed candidate as parent but omitted almost the entire repository tree.
  The malformed decision contained no publication workflow, no GitHub Actions
  publication run occurred, and Python Agent main remained unchanged.
  Recover downstream execution and Brain-authoring authority without rewriting
  historical incident refs or treating mutable AIOS-renew main as downstream
  runtime authority.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-198 authoring is
    5a3d09e6192ec91cff527bf8f524da3ea1a6f8a7.
  - >
    The sole active downstream AIOS dependency and launcher provenance are
    currently bound to
    2599202afedb0622e9e9bdc7b5a15f34da01cc27.
  - >
    AIOS-renew source candidate
    a3b723b49cd65677f548c5694a52a6fc006a9e2a is the exact reviewed and
    source-published TASK-101 revision-4 implementation. It descends from the
    published TASK-103 correction-frontier hardening and TASK-104/TASK-105
    Brain Authoring Ingress recovery lineage.
  - >
    AIOS-renew commit
    df65e3f9468d1cc408739ebd89165880ea18afd7 is a later Brain-owned roadmap
    reconciliation commit and is not downstream runtime pin authority.
  - >
    RUN-197-001 candidate
    8992e64654b1342a70ad37c9c0aa693ce537a975 remains immutable verified
    implementation evidence for TASK-197 revision 1. REVIEW-197-001 is
    semantic PASS, but review-decision
    f334312384543dd4726e83089601e375dd5da17b is structurally malformed and
    must never authorize publication.
  - >
    No GitHub Actions workflow run exists for the malformed RUN-197-001
    decision and canonical Python Agent main was not modified by that decision.
  - >
    Explicit current Human intent prioritizes emergency downstream AIOS
    recovery ahead of the current Governance Foundation NEXT milestone.
    This priority override is prospective and does not rewrite prior roadmap
    or TASK-197 lineage.
  - >
    Python Agent Constitution is already published and is the highest
    enforceable downstream governance layer. Capability, installed tooling,
    repository write access, or an ambient AIOS executable does not itself
    grant canonical mutation authority.

