task_id: TASK-209
revision: 1

goal: >
  Perform the explicit reviewed downstream AIOS-renew pin migration required to consume
  upstream TASK-118 terminal-attention portability hardening before Python Agent resumes
  FULL_AIOS_DOWNSTREAM_CONFORMANCE. Move the sole active pinned AIOS runtime authority from
  26097405343150dc1b55015b94720528afad50ed to the exact reviewed and source-published
  TASK-118 source 91a177d5b96b2197a4d8223dbb727dda6201cb64, preserve all already-published
  Phase-1 and Phase-2 repository bindings and authority boundaries, record bounded migration
  provenance, and leave FULL_AIOS_DOWNSTREAM_CONFORMANCE / TASK-207 as the roadmap target to
  be resumed only after a fresh Brain reconciliation and a TASK-207 revision bound to the new
  exact pin.

problem: >
  TASK-207 revision 2 executed under exact pin 26097405343150dc1b55015b94720528afad50ed.
  RUN-207-002 reached canonical RESULT with its source candidate and deterministic verification
  passing, but semantic certification was blocked because no terminal-attention signal/Issue was
  emitted. Fresh upstream audit identified a package portability defect: exact-pin downstream
  consumers without vendored src/aios_renew source were classified terminal-attention
  UNAVAILABLE. Upstream TASK-118 repaired that causal defect without changing terminal truth,
  workflow/policy authority, Runtime, Reviewer, Publisher, or frozen Kernel semantics.
  REVIEW-118-001 is PRIMARY PASS with AC1-AC6 PASS and no findings, safe publication succeeded,
  and AIOS-renew main is now 91a177d5b96b2197a4d8223dbb727dda6201cb64. Exact-pin isolation
  means this upstream publication does not alter Python Agent runtime authority. Python Agent
  must therefore migrate its exact pin explicitly before conformance can resume. TASK-207
  revision 2 and RUN-207-001/RUN-207-002 remain immutable historical lineage bound to the old
  pin and must not be silently reinterpreted as certification under the new pin.

assumptions:
  - >
    Canonical Python Agent main at authoring is cac817737c1ec224f55ada742fb9e95da05b821a,
    which canonically authors TASK-207 revision 2 and remains pinned to
    26097405343150dc1b55015b94720528afad50ed.
  - >
    Python Agent's sole active AIOS-renew dependency and worker provenance authority are
    exactly 26097405343150dc1b55015b94720528afad50ed under
    EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
  - >
    AIOS-renew source 91a177d5b96b2197a4d8223dbb727dda6201cb64 is the exact reviewed
    TASK-118 source, REVIEW-118-001 is PRIMARY PASS, and safe source publication advanced
    AIOS-renew main to that candidate.
  - >
    TASK-118 changes only terminal-attention package portability for source-repository versus
    exact-pin downstream layouts. It does not activate or rewrite Python Agent repository
    workflows/policies, and it does not alter frozen Kernel, Runtime/Executor/Reviewer/
    Publisher authority, or product semantics.
  - >
    Python Agent Phase-1 and Phase-2 repository bindings from TASK-205/TASK-206 remain ACTIVE.
    TASK-209 consumes the new pinned package under those existing bindings; it is not a new
    binding activation phase.
  - >
    TASK-207 revision 2, RUN-207-001 verification failure, REPAIR-207-001, and RUN-207-002
    RESULT remain immutable evidence. Their exact-pin assumptions become stale for future
    certification after this migration; they are not deleted, rewritten, or promoted to
    new-pin certification evidence.
  - >
    D1, D2, and D3 remain separately deferred. None is implementation authority for this
    migration.

