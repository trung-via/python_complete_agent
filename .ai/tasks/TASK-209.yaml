non_goals:
  - >
    Execute, review, certify, or publish TASK-207, or claim FULL_AIOS_DOWNSTREAM_CONFORMANCE.
    After this migration is reviewed and published, TASK-207 requires fresh Brain sync and a
    new revision bound to 91a177d5b96b2197a4d8223dbb727dda6201cb64 before conformance resumes.
  - >
    Modify TASK-207 revision-2 history, RUN-207-001/RUN-207-002, REPAIR-207-001, or any
    immutable evidence/review lineage. Do not synthesize replacement history or treat old-pin
    evidence as new-pin certification.
  - >
    Change any Phase-1 or Phase-2 carrier policy, GitHub workflow, runner label/path,
    repository identity, actor allowlist, bootstrap script, review/publication continuation,
    remediation intent, repair wakeup, or terminal-attention repository binding.
  - >
    Copy AIOS-renew source into Python Agent, consume mutable upstream main, use a branch/tag
    pin, create a second Runtime authority, or automatically follow later AIOS-renew movement.
  - >
    Fix or redesign D1, D2, or D3; rebuild the Project Contract; close Governance Foundation;
    return to P7; or alter product/domain semantics.
  - >
    Add retry, fallback, reroute, generic lifecycle routing, scheduler, daemon, queue, broker,
    autonomous executor choice, autonomous correction, or new semantic authority.
  - Push or publish from Executor implementation execution.

constraints:
  hard:
    - >
      Replace the sole active requirements pin and worker AUTHORITATIVE_COMMIT from
      26097405343150dc1b55015b94720528afad50ed to exactly
      91a177d5b96b2197a4d8223dbb727dda6201cb64. No other active AIOS runtime pin or floating
      reference may be introduced.
    - >
      Preserve repository-local pinned runtime and PEP 610 source-plus-commit provenance.
      Stale/alternate worker runtime provenance must continue to fail closed and rebuild from
      the exact checked-in pin before kernel invocation.
    - >
      Preserve Human-facing worker protocol and executor separation exactly. Codex and
      Antigravity remain distinct Human-selected Executor identities; no Brain/Runtime/Review/
      Publisher authority moves into the worker.
    - >
      Preserve every TASK-205/TASK-206 repository binding and policy/workflow file unchanged.
      The migration only makes those already-active bindings consume TASK-118 package behavior.
    - >
      Reconcile .ai/aios-adoption-state.yaml so downstream_pin.commit and upstream audit
      checkpoint become exactly 91a177d5b96b2197a4d8223dbb727dda6201cb64; record TASK-118 /
      REVIEW-118-001 as reviewed source-published terminal-attention portability hardening;
      preserve existing capability ownership and ACTIVE/NOT_REQUIRED classifications.
    - >
      Reconcile .ai/roadmap-state.yaml only to record this second bounded prerequisite pin
      migration and its resume target TASK-207 / FULL_AIOS_DOWNSTREAM_CONFORMANCE. Keep the
      active track, FULL_AIOS_DOWNSTREAM_CONFORMANCE as sole NEXT, pending ordering, completed
      milestones, Project Contract rebuild ordering, Governance closure, and P7 return unchanged.
    - >
      Documentation that names the active AIOS pin must use the new exact commit and may record
      TASK-118 terminal-attention portability hardening while preserving exact-pin isolation and
      the existing Human-facing workflow.
    - >
      TASK-207 revision 2 and its RUN lineage remain immutable historical state. This migration
      must make clear that fresh Brain reconciliation/revision is required before future TASK-207
      execution/certification under the new pin; Executor must not edit TASK-207 artifact.
    - >
      D1, D2, and D3 remain deferred. No source change intended to fix them is permitted.
    - >
      Verification must be deterministic, offline, non-interactive, and independent of GitHub,
      provider/LLM, live runner state, marketplace/browser/CDP, Drive, wall clock, random/UUID,
      or mutable external state.

acceptance:
  - id: AC1
    condition: >
      The sole active Python Agent AIOS-renew dependency and worker provenance authority are
      exactly 91a177d5b96b2197a4d8223dbb727dda6201cb64; stale/alternate provenance remains
      fail closed through the existing exact-pin bootstrap boundary.
  - id: AC2
    condition: >
      Existing Codex and Antigravity Human-facing worker surfaces remain behaviorally compatible,
      thin, executor-distinct, and free of new lifecycle/review/publication authority.
  - id: AC3
    condition: >
      .ai/aios-adoption-state.yaml records TASK-118 / REVIEW-118-001 and the new exact pin as
      reviewed source-published terminal-attention portability hardening while preserving all
      prior package capability and repository-binding classifications.
  - id: AC4
    condition: >
      Phase-1 and Phase-2 repository policies/workflows/bindings remain unchanged and continue
      to delegate through the exact pinned package; no repository binding is newly activated,
      removed, or re-authored by this migration.
  - id: AC5
    condition: >
      .ai/roadmap-state.yaml preserves FULL_AIOS_DOWNSTREAM_CONFORMANCE as the sole NEXT and
      existing pending ordering while recording TASK-209 as the resolved prerequisite migration
      whose resume target is a fresh TASK-207 revision; it does not claim conformance completion.
  - id: AC6
    condition: >
      TASK-207 revision 2 and RUN-207-001/RUN-207-002/REPAIR-207-001 remain immutable historical
      old-pin evidence; no lineage is rewritten or synthesized, and fresh Brain revision is
      required before conformance resumes under the new pin.
  - id: AC7
    condition: >
      D1, D2, and D3 remain deferred with no implementation delta; all mutation stays inside the
      ten authorized files; focused deterministic migration/regression verification passes; and
      RESULT contains zero unresolved items.

