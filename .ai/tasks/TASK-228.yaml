task_id: TASK-228
revision: 1

goal: >
  Establish P8.2 Pre-Action Evidence Acquisition Plan for the exact Human-selected
  TikTok Shop Vietnam pilot listing without acquiring evidence, modifying collectors,
  authorizing browser/session access, authorizing spend or market action, or selecting
  any future intelligence domain. The plan must separate existing capabilities from
  capability gaps, define bounded evidence waves and stop conditions using P7.5
  Value-of-Information principles, preserve exact-listing provenance, and return the
  next live-acquisition authorization decision to Human/Brain.

problem: >
  TASK-227 / P8.1 is exactly published and records one selected listing:
  source ID 1731381331718341815 and stable listing reference
  https://shop.tiktok.com/vn/pdp/den-led-cam-bien-chuyen-dong-3-che-do-sang-sac-usb-c/1731381331718341815.
  Before any real pilot action, Python Agent needs an explicit plan for what evidence
  could materially change the Human decision, which existing authority/capability may
  supply it, which unknowns should remain uncollected until justified, what operational
  risks apply, and when acquisition must stop. Architecture audit also found that the
  selected TikTok Shop URL uses /vn/pdp/<slug>/<id>, while both current TikTok
  product-ID parsers recognize /product/<id>, /item/<id>, or query identifiers but not
  this /pdp path. Therefore exact-listing deep capture is not yet trustworthy enough to
  authorize as pilot evidence until a later separately-authorized compatibility fix
  preserves the selected source ID.

assumptions:
  - Canonical main at authoring is d2752d69c701dd2483ea30f52be3385b5137e008, the exact reviewed and published TASK-227 source candidate.
  - TASK-227 / P8.1 is DONE as PILOT_CASE_SELECTION_ONLY; real_pilot_executed is false; next_milestone is null; pending_commitments is empty.
  - Human has explicitly selected the P8.2 pre-action evidence-acquisition planning direction after architecture audit.
  - The selected pilot case remains context_id p8-pilot-001-led-motion-tiktok-vn, source ID 1731381331718341815, product selection label "Đèn LED Cảm Biến Chuyển Động Tự Động Bật Tắt Điều Chỉnh 3 Chế Độ Sáng", marketplace TikTok Shop Vietnam, channel context TikTok Shop Affiliate.
  - The selected stable listing reference is source identity only, not canonical product identity and not current marketplace truth.
  - Human has not yet authorized live evidence acquisition, authenticated browser use for this pilot, marketplace scraping, affiliate-account inspection, spend, traffic, content publication, campaign creation, or market testing.
  - Human has not yet supplied budget, exposure limits, test duration, contribution-margin threshold, success/failure criteria, audience, quality constraints, or risk acceptance.
  - P7.3 remains the sole owner of DecisionContext and OpportunityHypothesis; P7.4 remains the sole owner of TikTokAffiliateEvidenceProfile; P7.5 remains the sole owner of VOI planning; P7.6 remains the sole owner of market-test evidence; P7.7 remains the sole owner of winner validation; P8.0 remains the sole decision-loop composition owner.
  - Product Intelligence remains the sole owner of ProductCandidateSnapshot, SignalEvidence, Product Source Pack, discovery, scoring/ranking, approval, identity/catalog, persistence and product-truth semantics.
  - Existing TikTokDiscoveryAdapter can observe bounded search-card fields such as price, sold_count, rating, review_count and discount where visible, but unavailable affiliate/creator/video/competition/velocity fields remain None rather than fabricated.
  - Existing TikTokSourceExtractor can acquire typed exact-product source-pack facts/media only when product identity can be safely bound; it is not an affiliate-economics or market-test authority.
  - Current TikTok product-ID parsing in both src/product_intelligence/adapters/tiktok_parsing.py and src/product_source/platforms/tiktok.py does not recognize the selected /vn/pdp/<slug>/<id> path. This is an observed repository compatibility gap, not authorization to fix it in TASK-228.
  - Historical P6 live-capture architecture establishes that authenticated marketplace interaction, login/session preparation and CAPTCHA handling are Human/operator-owned external operations; ordinary AIOS engineering verification remains deterministic/offline.
  - Current downstream AIOS pin and conformance remain edd7d8d92d54900c56442bbfcddb8648ec4d2e09 / TASK-207 revision 8.
  - Codex remains the Human-selected default Executor.

