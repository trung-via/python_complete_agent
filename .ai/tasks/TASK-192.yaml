task_id: TASK-192
revision: 1

goal: >
  Establish one canonical downstream AIOS-adoption baseline for Python Agent, migrate the
  repository-owned worker to the latest fully published AIOS source that is currently safe
  to adopt, and port the AIOS governance patterns that do not travel through a dependency
  pin. The outcome must make future cross-chat Brain Sync deterministically answer both
  "what Python Agent roadmap item is next?" and "which AIOS capabilities have or have not
  been adopted?" without relying on Human memory or chat history. Preserve Python Agent
  Product Intelligence semantics and keep AIOS-renew as the execution substrate only.

problem: >
  Python Agent currently pins AIOS-renew at
  e72135cd5c5a1dec0d8374d9bb8994da5e458feb (TASK-092 era). Since that pin, AIOS-renew
  has published additional runtime/control-plane work including the final TASK-091 third
  Executor backend, TASK-093 through TASK-100, and TASK-102 stale-local CONTINUE
  pre-observation synchronization hardening. The exact current AIOS main additionally
  contains authored TASK-103, while TASK-101 has a semantic PASS source candidate that is
  not yet source-published. Python Agent therefore must not follow AIOS current main or an
  unpublished candidate. Separately, Python Agent missed the TASK-083 roadmap-sequencing
  governance pattern because repository planning state is not delivered by the pinned
  package. That miss allowed a previously agreed return to Governance Foundation to fall out
  of cross-chat Brain guidance after the long TASK-186 through TASK-191 prerequisite chain.
  A pin-only migration cannot prevent the same class of omission in the future. Python Agent
  needs one explicit downstream adoption registry plus one canonical roadmap bookmark, with
  Brain Sync rules that fail closed instead of guessing when either state conflicts with
  engineering lineage.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-192 authoring is
    40da098b3b0dcf3d1994fc510dd55717b81a2f67. TASK-191 RUN-191-001 has PRIMARY semantic
    PASS for that same SHA with AC1-AC8 PASS and no findings, so the P7.1 deterministic
    baseline source is already current product main.
  - >
    The authoritative downstream AIOS dependency immediately before this migration is
    exactly aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@
    e72135cd5c5a1dec0d8374d9bb8994da5e458feb, and the launcher AUTHORITATIVE_COMMIT is
    bound to the same SHA.
  - >
    AIOS-renew TASK-102 is semantically reviewed and published at exact source
    2599202afedb0622e9e9bdc7b5a15f34da01cc27. That source descends from the current
    Python Agent pin and includes the published post-pin runtime/control-plane work through
    TASK-102, including TASK-091 revision 2, TASK-093 through TASK-100, and TASK-102.
  - >
    AIOS-renew current main observed by Brain at TASK-192 authoring is
    7d0bbcbce4b1bfeaa47634f9069a8ae9ac44930c. Its roadmap still records Performance
    Closure / TASK-101 as NEXT and Downstream Adoption as PENDING. TASK-101 source candidate
    575a3d7f0060b5a74dba1b44059097355a7d8a64 has semantic PASS but is not source-published.
    TASK-103 revision 1 is authored on current AIOS main but has no established implementation
    PASS/publication. Neither TASK-101 candidate nor TASK-103 authoring commit is an admissible
    downstream runtime pin in this TASK.
  - >
    AIOS TASK-083 established a Brain-readable canonical roadmap sequencing bookmark and
    requires generic "continue roadmap" intent to resolve through one unique NEXT item after
    reconciliation with Human intent and exact engineering lineage. That planning pattern is
    repository governance, not Python package behavior, and therefore requires an explicit
    downstream port rather than dependency installation.
  - >
    Existing Python Agent TASK-177/TASK-179/TASK-183/TASK-184 remain authoritative for the
    thin worker, immutable pin/provenance bootstrap, Unified State/Human Surface delegation,
    CONTINUE_IMPLEMENTATION adoption, safe publication, and native Executor-instruction
    boundaries. This TASK extends those authorities; it does not create a second state machine.

scope:
  inspect:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md
    - docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-renew-worker.md
    - .github/workflows/aios-auto-publish.yml
    - tests/aios_bridge/test_aios_worker_control_surface.py
    - tests/aios_bridge/test_aios_auto_publish_workflow.py
    - .ai/tasks/TASK-177.yaml
    - .ai/tasks/TASK-179.yaml
    - .ai/tasks/TASK-180.yaml
    - .ai/tasks/TASK-183.yaml
    - .ai/tasks/TASK-184.yaml
    - .ai/tasks/TASK-191.yaml

  modify:
    - .ai/roadmap-state.yaml
    - .ai/aios-adoption-state.yaml
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-renew-worker.md
    - tests/aios_bridge/test_aios_worker_control_surface.py
    - tests/aios_bridge/test_aios_governance_state.py

non_goals:
  - Modify Product Intelligence production source, marketplace adapters, browser/session
    behavior, scoring/ranking, persistence, retrieval/RAG, provider/model, catalog, product
    truth, P7 baseline fixtures, or TASK-191 evidence.
  - Copy AIOS-renew Runtime, Unified State, Human Surface, correction-preflight, publication,
    correction-frontier, adapter, or performance-observation implementation into Python Agent.
  - Pin to AIOS current main, TASK-101 reviewed-but-unpublished source candidate
    575a3d7f0060b5a74dba1b44059097355a7d8a64, TASK-101 review-decision metadata, TASK-103
    authoring commit, a floating branch/tag, or any other source lacking exact published
    downstream-adoption authority.
  - Claim Python Agent has adopted TASK-101 or TASK-103 implementation before those exact
    upstream capabilities are semantically PASS and source-published.
  - Automatically expose antigravity-minimax as a new Python Agent Human-facing worker
    surface. Availability inside the pinned kernel does not itself authorize a downstream UX.
  - Copy AIOS Manifesto or AIOS Constitution verbatim as Python Agent product governance.
    Python Agent Governance Foundation remains a separate downstream product-governance
    milestone after AIOS parity closure.
  - Add a daemon, service, database, background poller, model router, planner, retry loop,
    fallback, second lifecycle reducer, local correction planner, or automatic roadmap
    advancement mechanism.
  - Change `.github/workflows/aios-auto-publish.yml`; it must continue to consume the checked-in
    immutable dependency requirement rather than acquire a second pin authority.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Replace the only active downstream AIOS dependency pin and launcher
      AUTHORITATIVE_COMMIT with exactly
      2599202afedb0622e9e9bdc7b5a15f34da01cc27. The requirements file remains the checked-in
      package source used by the auto-publisher, and no duplicate active pin authority may be
      introduced.
    - >
      Preserve the existing thin-worker architecture: Python Agent worker surfaces delegate
      exactly once to the pinned AIOS public operator surface and must not parse lifecycle prose,
      reconstruct Unified State, select correction semantics, retry, reroute, recursively
      continue, implement Git synchronization, or perform publication themselves.
    - >
      `.ai/aios-adoption-state.yaml` must be a small machine-readable Brain planning/adoption
      registry, not engineering truth. It must record the exact current downstream pin, the exact
      upstream audit checkpoint 7d0bbcbce4b1bfeaa47634f9069a8ae9ac44930c, and classify every
      currently relevant AIOS architecture/correction family through authored TASK-103 into one
      explicit state so no capability can disappear merely because a later Brain does not remember
      it.
    - >
      The adoption registry must distinguish at least these classes: ADOPTED_BY_PIN,
      PORT_GOVERNANCE, EXPLICITLY_NOT_APPLICABLE_OR_OPTIONAL, and BLOCKED_PENDING_UPSTREAM.
      It must never treat a planning classification as proof of Runtime PASS, publication, or
      downstream certification.
    - >
      The adoption registry must record K0/post-K0 Runtime authority and historical-repair,
      synchronization, safe-publication, NO_CHANGE and related established kernel behavior as
      consumed through the exact pin rather than copied locally; TASK-083 roadmap sequencing as
      PORT_GOVERNANCE; existing TASK-086/TASK-087 Unified State/Human Surface and TASK-089/TASK-090/
      TASK-092 continuation/publication/instruction semantics as adopted; TASK-091 revision 2,
      TASK-093 through TASK-100, and TASK-102 as adopted through the new exact pin; TASK-101 as
      BLOCKED_PENDING_UPSTREAM until its reviewed source is source-published and upstream roadmap
      state is reconciled; and TASK-103 as BLOCKED_PENDING_UPSTREAM until semantic PASS plus
      source publication exist.
    - >
      Optional AIOS outer-automation facilities that Python Agent does not currently need must be
      explicitly classified as optional/not-applicable rather than silently omitted. Existing Safe
      Publisher adoption remains recorded as active. No optional wakeup/approval/autonomous lane is
      introduced by this TASK.
    - >
      `.ai/roadmap-state.yaml` must establish one Python Agent planning bookmark independent from
      AIOS-renew's own roadmap. It must record TASK-191/P7.1 as the completed product checkpoint,
      AIOS downstream parity as the active Human-prioritized track, TASK-192 as the current NEXT
      item until semantic PASS/publication and Brain reconciliation, the remaining upstream-closure
      adoption work as pending, and an explicit return target of Python Agent Governance Foundation.
    - >
      The roadmap state must preserve visible not-done commitments for Python Agent Manifesto,
      Python Agent Constitution, Python Agent Product Contract, and ChatGPT Project Contract
      reconciliation. A commitment may leave the pending set only when canonical evidence marks it
      DONE or explicit Human intent canonically CANCELS or SUPERSEDES it.
    - >
      Update `docs/CHATGPT_PROJECT_CONTRACT.md` Brain Sync so a fresh chat must read current main,
      exact AIOS pin, `.ai/roadmap-state.yaml`, `.ai/aios-adoption-state.yaml`, current product/phase
      roadmap, and relevant immutable lineage before roadmap selection or TASK authoring. Generic
      "continue roadmap" must resolve from the reconciled unique NEXT pointer, never from the most
      recent TASK or remembered chat. Conflicting/missing adoption or roadmap state must fail closed
      as ROADMAP/ADOPTION SYNC BLOCKED rather than be guessed.
    - >
      Project Contract must keep authority separation explicit: Human owns intent/priority changes;
      Brain owns roadmap/adoption interpretation and semantic TASK authoring; Runtime owns deterministic
      lifecycle/verification/evidence; exactly one Executor owns HOW; Reviewer owns semantic verdict;
      Publisher owns publication. Runtime/worker state must not auto-advance roadmap/adoption planning.
    - >
      Update worker documentation and active surface descriptions only as necessary to bind the new
      exact pin and describe newly available pinned semantics. Do not duplicate upstream implementation
      details or imply that Python Agent has its own correction frontier, pre-observation sync engine,
      performance collector, or third-executor UX.
    - >
      Add focused downstream regressions proving one active requirements pin equals launcher
      AUTHORITATIVE_COMMIT, thin worker delegation remains one-operation/no-reroute, the auto-publish
      workflow still consumes the checked-in requirements file, roadmap/adoption files parse and carry
      the required authority/status fields, TASK-101/TASK-103 remain blocked pending upstream, and
      Governance Foundation remains the explicit return target.
    - >
      Do not make tests depend on live GitHub, marketplace access, browser/CDP, provider/LLM, Drive,
      wall-clock time, random/UUID values, or mutable external state.

acceptance:
  - id: AC1
    condition: >
      Python Agent's sole active AIOS dependency and launcher provenance are migrated from
      e72135cd5c5a1dec0d8374d9bb8994da5e458feb to exact published source
      2599202afedb0622e9e9bdc7b5a15f34da01cc27 with no floating or duplicate pin authority.
  - id: AC2
    condition: >
      Existing repository-owned Codex/Antigravity worker surfaces remain thin one-operation
      delegates to the pinned kernel; no downstream lifecycle, synchronization, correction,
      retry/reroute, publication, or new Executor-selection implementation is introduced.
  - id: AC3
    condition: >
      `.ai/aios-adoption-state.yaml` canonically records the upstream audit checkpoint and explicit
      adoption classification for all relevant AIOS capability families through authored TASK-103,
      including TASK-083 as PORT_GOVERNANCE, TASK-097/098/099/100/102 as available through the new
      pin, and TASK-101/TASK-103 as BLOCKED_PENDING_UPSTREAM.
  - id: AC4
    condition: >
      `.ai/roadmap-state.yaml` provides one unique current Python Agent NEXT pointer, explicit
      return_to Governance Foundation, and durable not-done Governance commitments without claiming
      that planning state itself proves implementation completion.
  - id: AC5
    condition: >
      Python Agent Brain Sync rules require fresh-chat reconciliation of main, pin, roadmap state,
      adoption state, product roadmap and relevant immutable lineage; generic roadmap continuation
      can no longer depend on Human memory, the latest TASK alone, or previous-chat context.
  - id: AC6
    condition: >
      TASK-101 and TASK-103 are not falsely adopted, their pending upstream gates are explicit, and
      future migration requires an exact reviewed and source-published upstream candidate rather than
      following current AIOS main.
  - id: AC7
    condition: >
      Product Intelligence source/behavior, TASK-191 baseline evidence, auto-publish workflow,
      publication authority, and existing Human-facing executor selection remain unchanged except
      for consuming the new exact AIOS pin.
  - id: AC8
    condition: >
      Focused deterministic downstream verification and git diff check pass with zero unresolved
      items and all changed files remain within TASK-192 scope.modify.

verification:
  required:
    - 'python -m pytest tests/aios_bridge/test_aios_worker_control_surface.py tests/aios_bridge/test_aios_auto_publish_workflow.py tests/aios_bridge/test_aios_governance_state.py -q'
    - 'git diff --check'
