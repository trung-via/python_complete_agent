non_goals:
  - Modify BrowserManager, BrowserSession, PlaywrightBrowserManager, PlaywrightBrowserSession,
    TASK-137 CDP attachment/page-selection/cache/locking/cleanup behavior, AgentController, browser
    configuration, or any generic browser API.
  - Modify TASK-162 readiness attempts, delay, first-media-ready termination, trusted-media rules,
    blocked/CAPTCHA handling, retry/exhaustion behavior, or public timing/configuration.
  - Modify _SHOPEE_EXTRACTION_SCRIPT, TASK-172/TASK-173/TASK-174 DOM scope, option-family,
    selection-marker, group-inference, exact-string, all-or-nothing, or ProductFact mapping semantics.
  - Modify ProductSourcePack, ProductFact, OriginalMediaRef, serialization schema/version,
    source_pack_id, source identity, downloader, local persistence, Google Drive, or ShopeeScrapeTool
    public result/error contracts.
  - Modify TASK-108 relationship semantics; TASK-115/TASK-116/TASK-117 variant evidence/admission;
    TASK-120 persistence; TASK-121 profile evidence; TASK-171 product truth; or retrieval/RAG/ranking/
    provider/application authorities.
  - Infer selected variant from display_model_id, rModelId, vModelId, URL query values, source_product_id,
    title, model_sku, price, media, recommendation state, or any other non-rendered heuristic.
  - Click, choose, cycle, restore, auto-select, or otherwise mutate variation controls. Do not add a
    Human wait state, variant-specific polling, second browser/page, alternate URL, external retry,
    stealth/proxy behavior, login automation, or CAPTCHA solving.
  - Treat a search page, verification/challenge page, blank page, malformed URL, unrelated Shopee
    page, or different product page as reusable merely because its query string contains the target
    item id or a nested/encoded next URL.
  - Add live Shopee/CDP verification to deterministic AIOS Runtime. Human-owned post-publication live
    recheck remains a separate checkpoint.
  - Reopen, rewrite, rerun, repair, or republish TASK-174 lineage.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Keep ShopeeSourceExtractor as the sole Shopee product-page acquisition/source/DOM extraction
      authority and preserve its public constructor and extract(product_url, run_id, observed_at)
      signature, one page/session acquisition, TASK-162 readiness, trusted media rules, output
      ProductSourcePack contract, exception classes, and all published selected-variant semantics.
    - >
      Refine only the internal post-acquisition navigation decision. One extract call must acquire
      exactly one page/session. If the acquired current page is deterministically proven to already be
      the exact target Shopee product, reuse that page in place and perform zero navigation. Otherwise
      preserve the current behavior of exactly one navigation to the exact input product_url. No path
      may perform more than one navigation.
    - >
      Same-target reuse proof must be deterministic and URL-structural, not DOM-text or query heuristic.
      Observe the acquired page's current location through the existing page/session capability without
      changing generic browser APIs. Parse current and target URLs with standard-library URL parsing;
      require HTTP(S), matching normalized host, and require the existing
      extract_shopee_product_id(...) authority to recover the target product_id from the CURRENT URL
      PATH itself. Query, fragment, nested next URL, redirect parameter, display_model_id, or any other
      query-only occurrence of the item id cannot authorize reuse.
    - >
      Equivalent direct product URLs for the same item id may reuse despite slug or query differences,
      including canonical -i.{shop_id}.{item_id}, /product/{shop_id}/{item_id}, or /item/{item_id}
      path forms already recognized by extract_shopee_product_id. Reuse identity is source product id
      plus matching Shopee host, not byte-for-byte URL equality and not variant identity.
    - >
      A current page that cannot be proven reusable because location is missing, non-string, malformed,
      non-HTTP(S), host-mismatched, path-unparseable, blank, search, verify/challenge, or a different
      product must fall back to exactly one navigation to the exact requested product_url. A failed
      side-effect-free current-location probe must not create reuse or a second browser/page; preserve
      the prior navigation path rather than silently treating an unproven page as current target.
    - >
      Same-target reuse preserves the already-rendered page exactly. It must not reload, goto, navigate,
      replace history, alter URL/query state, click controls, trigger selection, or otherwise mutate DOM
      merely to make selected-variant evidence available. After the navigation decision, run the existing
      TASK-162 readiness/extraction flow unchanged on that same page.
    - >
      Structured current-product identity remains mandatory for selected-variant ProductFact admission.
      Skipping navigation based on same-target URL proof must not itself authorize title, brand,
      selected-variant facts, or product truth. Existing structured_matches gating and TASK-172
      all-or-nothing selected state remain the evidence authority.
    - >
      Preserve the current behavior for ordinary production flows that start from about:blank, a Shopee
      search/discovery page, another product, or another host: one acquisition followed by one exact
      target navigation, then existing bounded readiness. Launch-mode callers and newly created pages
      therefore remain navigation-compatible.
    - >
      Add a focused regression reproducing the exact post-TASK-174 live continuity failure fully offline:
      the acquired page reports a current same-target K550 product URL, its extraction sample is identity
      matched and contains complete selected state [{group_label: "Model", option_label:
      "K550 Trắng Red V4"}], and any navigation would clear that sample. The extractor must perform zero
      navigation and return one ProductFact with key "variant", exact value
      "Model: K550 Trắng Red V4", source_section/provenance "selected_variant_controls", unit=None.
    - >
      Add deterministic navigation-decision regressions proving: same target with different query or slug
      performs zero navigation; a different product performs exactly one navigation to the exact input
      URL; about:blank/search/malformed location performs one navigation; and a verify/challenge or other
      current URL whose QUERY contains or nests the target product URL/item id still performs one
      navigation because path identity is not proven.
    - >
      Add a regression proving a same-target URL carrying display_model_id or another model-like query
      parameter does not create selected-variant facts when the post-decision DOM extraction sample lacks
      complete explicit selected controls. URL reuse and selected-variant truth must remain separate.
    - >
      Preserve exact one page/session acquisition across both zero-navigation reuse and one-navigation
      fallback paths. Existing BrowserManager strict run_id/evaluate forwarding, TASK-162 delayed-hydration,
      blocked, exhaustion, invalid-payload, media order/provenance, TASK-174 DOM fixtures,
      ShopeeScrapeTool compatibility, and TASK-108 relationship regressions must remain green.
    - >
      Keep verification fully offline/deterministic with no live Shopee, CDP 9222, Google Drive, model/
      provider API, Human interaction, real marketplace account data, or persisted raw HTML/cookies.
    - >
      Update lifecycle documentation consistently: TASK-171/P6.3a remains CLOSED/PUBLISHED at
      3a33748905154b4822cfc164999e5c57780e67f2; TASK-172 remains CLOSED/PUBLISHED at
      63525151e4dbb7a1c30454a301e3c0e20ae771e9; TASK-173 remains CLOSED/PUBLISHED at
      f91dfe0f900664c835fef86bdf5d6c75879dbbdc; TASK-174 is CLOSED/PUBLISHED at
      8c5a0b2a6a935c5bbecff5cde7b1a32956aa8d32 and its Human-owned raw live recheck proved selected
      DOM observation succeeds when state is preserved; TASK-175 is the current narrow P6.3b
      acquisition-continuity blocker. P6.2 remains PARKED/reopenable, P6.4-P6.6 remain deferred, and
      live ProductSourcePack/end-to-end exact-variant certification is not claimed complete until a
      separate post-publication Human checkpoint succeeds.
    - Do not push from executor execution.

acceptance:
  - id: AC1
    condition: >
      TASK-175 changes only ShopeeSourceExtractor internals, focused extractor regressions, Product
      Source Pack/P6.3 documentation, and the two canonical roadmaps; no generic browser, readiness,
      DOM-selection, schema, resolver, identity, persistence, retrieval, or truth authority is changed.
  - id: AC2
    condition: >
      One extract call acquires exactly one page/session and uses deterministic 0-or-1 navigation:
      zero navigation only when current host/path proves the same target source_product_id, otherwise
      exactly one navigation to the exact requested product_url, with no path performing more than one.
  - id: AC3
    condition: >
      The offline continuity regression proves an already-rendered same-target complete selected state
      survives extraction and produces exactly the published TASK-172 ProductFact representation
      "Model: K550 Trắng Red V4" without navigation or selection mutation.
  - id: AC4
    condition: >
      Same-item slug/query differences can reuse, while blank/search/malformed/different-product/
      host-mismatch/verify-challenge pages and target ids appearing only in query or nested redirect
      state cannot authorize reuse and retain exactly one target navigation.
  - id: AC5
    condition: >
      URL reuse does not become variant truth: model-like query parameters alone still emit zero
      selected-variant facts, and structured identity plus complete explicit rendered selection remain
      mandatory under unchanged TASK-172/TASK-174 semantics.
  - id: AC6
    condition: >
      TASK-162 bounded readiness, trusted media acceptance/order/provenance, blocked/exhaustion/error
      behavior, launch/new-page behavior, ShopeeScrapeTool contracts, ProductSourcePack schema, and
      TASK-137 browser lifecycle remain semantically unchanged.
  - id: AC7
    condition: >
      Existing TASK-174 DOM structural regressions and unchanged TASK-108 relationship regressions stay
      green; TASK-175 adds no second selected-variant mapper or local identity classification.
  - id: AC8
    condition: >
      Documentation marks TASK-174 published at 8c5a0b2a6a935c5bbecff5cde7b1a32956aa8d32,
      records the narrow post-publication live evidence and TASK-175 current continuity blocker, keeps
      P6.2 parked/reopenable and P6.4-P6.6 deferred, and does not claim live ProductSourcePack or product-
      truth certification complete.
  - id: AC9
    condition: >
      Required verification and git diff check pass with zero unresolved items and no changed files
      outside TASK-175 scope.

