task_id: TASK-175
revision: 1

goal: >
  Continue P6.3b with one narrow Shopee acquisition-continuity hardening inside the existing
  ShopeeSourceExtractor so a Human-selected variant already rendered on the exact current target
  product page is not destroyed by an unnecessary same-URL re-navigation before extraction.
  Preserve TASK-137 browser/session ownership, TASK-162 bounded readiness, TASK-172 selected-variant
  source-evidence semantics, TASK-174 live-DOM compatibility, TASK-108 relationship authority,
  TASK-116 Human sellable-variant admission, TASK-171 descriptive truth, ProductSourcePack schema,
  and ShopeeScrapeTool public behavior unchanged.

problem: >
  TASK-174 is published at candidate 8c5a0b2a6a935c5bbecff5cde7b1a32956aa8d32 and a
  post-publication Human-owned live diagnostic on Shopee listing source_product_id 10374101498
  proved the private extraction script can correctly observe explicit selected state on the already
  rendered page: selected_variants_complete=true with exactly group_label "Model" and option_label
  "K550 Trắng Red V4". However, an exact production BrowserManager -> ShopeeSourceExtractor recheck
  on the same clean single-tab, non-CAPTCHA page showed BEFORE and AFTER URLs both remained the same
  target listing, title/structured identity hydrated correctly, yet facts_count=0 and
  variant_fact_count=0. The Human directly observed Chrome reload the product page during extract(),
  after which no variation option was selected. Current ShopeeSourceExtractor always acquires one
  page/session and then navigates to product_url even when the acquired page is already the exact
  target product. That destructive re-navigation clears the Human-rendered selected-variant state
  before TASK-172/TASK-173/TASK-174 can observe it. This is an acquisition/navigation continuity
  defect inside the existing Shopee extractor boundary, not a selector, readiness, resolver,
  ProductSourcePack, BrowserManager, CAPTCHA, or product-truth defect.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-175 authoring is
    8c5a0b2a6a935c5bbecff5cde7b1a32956aa8d32, the published TASK-174 source candidate after
    RUN-174-001 Runtime PASS, REVIEW-174-001 PRIMARY PASS, and successful source-only publication.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@32ace104c5cfaa1b7affbaa40157872b1f85147f.
  - >
    TASK-137 remains the sole BrowserManager/BrowserSession/CDP lifecycle and borrowed-resource
    authority. Its manager-selected CDP endpoint, session cache/locking, first existing page
    attachment, navigation implementation, and cleanup semantics are not modified by TASK-175.
  - >
    TASK-162 remains the sole Shopee product-page bounded same-page readiness authority. Its fixed
    attempts/delay, first-trusted-media-ready termination, blocked/CAPTCHA behavior, trusted-media
    interpretation, and extraction failure semantics remain unchanged after the navigation decision.
  - >
    TASK-172 remains the selected-variant source-evidence semantic authority. TASK-173 and TASK-174
    are compatibility hardenings of the same private DOM observation path. The post-TASK-174 live
    raw-script checkpoint proved that DOM observation path succeeds when the Human-selected rendered
    state is preserved.
  - >
    TASK-108 remains the sole pairwise ProductRelationship resolver; TASK-116 remains the sole
    sellable-variant proposal/Human-decision authority; TASK-171 remains the sole descriptive
    product-truth reconciliation authority. TASK-175 introduces no new identity or truth authority.
  - >
    Human login, marketplace interaction, explicit sellable-option selection, and CAPTCHA resolution
    remain outside repository automation. TASK-175 preserves an already-rendered current-page state;
    it never clicks, chooses, restores, or infers a variant.

classification: >
  Narrow integration/regression hardening of the existing ShopeeSourceExtractor acquisition
  boundary. It does not introduce a new browser, scraper, readiness, variant, identity, or truth
  authority.

