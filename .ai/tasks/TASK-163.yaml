    - '$env:PYTHONPATH = ".;src"; python -m pytest tests/integration/test_live_real_evidence_canonical_qa.py -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - 'git diff --check; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'