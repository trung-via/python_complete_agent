non_goals:
  - Modify any production Python module, dependency, AIOS pin, worker, workflow, browser
    manager/session, discovery adapter, orchestrator, ranker, scraper, ProductSourcePack,
    intake, identity/grouping, approval/admission, catalog, SQLite, profile, retrieval, RAG,
    prompt, provider, or grounded-answer implementation.
  - Repair, rerun, publish, merge, cherry-pick, or mutate TASK-156 historical candidate or its
    REVIEW/REMEDIATION/REPAIR/RUN/FAILURE lineage.
  - Reopen TASK-162 or duplicate its product-page readiness behavior in certification code.
  - Create a second discovery, ranking, evidence, identity, family/variant, persistence,
    retrieval, provider, answer, or product-truth authority.
  - Generate a production family_id or variant_id allocation policy. Certification-local
    opaque IDs exist only in disposable pytest state.
  - Treat certification-local APPROVE values as production Human authorization or introduce
    autonomous approval behavior.
  - Infer that the two observations are one exact sellable variant, reconcile preferred facts,
    mutate evidence, extend existing identities, or implement product-truth reconciliation.
  - Certify Google Drive durability or make a live LLM/provider call.
  - Add semantic/vector retrieval, embeddings, BM25/FTS, reranking, retrieval-quality scoring,
    P6.1 benchmarks, caches, background services, watchers, queues, retry, fallback, reroute,
    CAPTCHA solving, stealth, proxying, browser restart, or Human-interactive waits.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Add exactly one certification-only module
      tests/integration/test_live_real_evidence_canonical_qa.py. It must not be imported by
      production code and must define no reusable production API. TASK-163 makes zero
      production Python changes and its candidate must descend from the TASK-163 authoring
      commit on published TASK-162 main; do not cherry-pick the historical TASK-156 candidate.
    - >
      The fixture may read only PI_LIVE_CERT_PLATFORM, PI_LIVE_CERT_QUERY, and
      PI_LIVE_CERT_CDP_ENDPOINT. Platform defaults to exact "shopee" and any explicit platform
      value must also be exact "shopee" so this successor certifies the published TASK-162
      Shopee acquisition path. Query defaults to exact "bình giữ nhiệt inox", must be non-empty
      and single-line, and is forwarded without rewriting, translation, expansion, or inference.
      CDP endpoint defaults to exact "http://127.0.0.1:9222" and is forwarded unchanged.
      Invalid explicit configuration fails before browser/network work.
    - >
      Construct exactly one PlaywrightBrowserManager and use that same manager for discovery
      and both acquisitions. Build one ShopeeDiscoveryAdapter, one DiscoveryRequest with
      max_pages=1 and max_candidates<=20, one PlatformDiscoveryPlan, capture one timezone-aware
      UTC timestamp reused as observed_at and evaluated_at, and call existing
      orchestrate_discovery exactly once with shortlist_size=1. Require a non-empty shortlist
      and use only shortlist[0].candidate without inspecting business scores/bands to decide
      whether to proceed.
    - >
      Construct exactly one ShopeeScrapeTool and execute that same tool instance exactly twice
      against the exact same discovered candidate URL. These are two planned evidence
      observations, not retries. Use distinct deterministic call_id values, one shared
      deterministic certification run_id, one deterministic non-secret dummy
      gdrive_folder_id, one shared test-only in-memory Drive sink, and two distinct output_dir
      roots confined beneath pytest tmp_path. If the first acquisition fails, fail closed
      immediately and do not perform the second merely as a retry.
    - >
      Each acquisition must return exact ToolStatus.SUCCESS with error is None and one exact
      source_pack.json manifest confined beneath its corresponding tmp_path output root.
      PARTIAL_SUCCESS or FAILURE is certification failure. Preserve bounded sanitized
      acquisition categories using only existing status/error-code classes including blocked,
      extraction empty, download failure, upload failure, partial, and unavailable. Never emit
      raw marketplace exceptions, product URLs, HTML, page text, cookies, tokens, headers,
      local user paths, source-pack contents, or downloaded filenames in canonical pytest output.
    - >
      TASK-162 readiness is exercised only through the current production
      ShopeeSourceExtractor reached by ShopeeScrapeTool. The live test must not monkeypatch,
      replace, bypass, duplicate, or manually call readiness internals. TASK-163 adds no
      certification-level sleep/retry/polling; any bounded same-page readiness sampling remains
      entirely TASK-162 production authority inside the one admitted acquisition call.
    - >
      The in-memory Drive sink must live only in the certification module, expose only the
      minimal synchronous get_or_create_folder(name, parent_id=None) and
      upload_file(file_path, folder_id=None) methods required by ShopeeScrapeTool, perform zero
      network/auth/environment/independent filesystem work, return deterministic truthy
      placeholders, and record only bounded call counts/state required by assertions.
    - >
      After both successful acquisitions, call TASK-138 intake_product_source_evidence exactly
      once with the two explicit output roots. Require exactly two manifest_paths and exactly
      two ProductSourcePack values. Do not directly parse/deserialize the manifests or build a
      shadow evidence representation in the certification fixture.
    - >
      Require the two exact SourceObservationIdentity.from_pack values to be distinct. Do not
      mutate observed_at, source_pack_id, URL, source_product_id, or any source field to
      manufacture distinctness, and do not sleep/retry solely to force a distinct timestamp.
      If existing identity semantics collapse them, fail closed.
    - >
      Call TASK-139 plan_family_knowledge_review exactly once with the exact TASK-138 inventory.
      Require exactly one actionable FamilyMergeProposal in plan.proposals and use only
      plan.proposals[0] by exact object identity. If existing grouping/resolution semantics
      produce zero/multiple/non-actionable proposals, fail closed without regrouping, rescoring,
      synthetic proposals, or identity-policy changes.
    - >
      Create exactly one empty SQLite catalog beneath pytest tmp_path only through
      create_sqlite_canonical_catalog. Record one certification-local FamilyMergeDecision.APPROVE
      through TASK-140 with actor "p6-certification" and one fixed timezone-aware certification
      timestamp, then durably admit exactly one family with opaque family_id
      "p6-cert-family-001". Require existing registration success and never call lower catalog
      registration primitives or sqlite3 directly.
    - >
      Require the admitted family to contain exactly the two intake observation identities.
      Iterate family.members in exact canonical order. For each member, call TASK-141
      prepare_sellable_variant_review exactly once with a singleton tuple containing only that
      member, record exact SellableVariantDecision.APPROVE with the same actor/fixed timestamp,
      and durably admit exactly one variant using opaque IDs "p6-cert-variant-001" and
      "p6-cert-variant-002" in member order. Do not infer EXACT_VARIANT_MATCH or treat this
      singleton partition as production variant-discovery policy.
    - >
      After durable family/variant admission, do not pass in-memory canonical family/variant
      objects into QA. Call TASK-135 answer_persisted_grounded_question exactly once with the
      tmp_path database and exact inventory.manifest_paths so TASK-135 reloads canonical SQLite
      state and persisted evidence through existing authorities.
    - >
      Use one certification-only deterministic fake LLMProvider that performs zero network
      work and records calls. Ask exact question
      "Which persisted evidence comes from shopee?" with max_hits=2. Require exact
      GroundedAnswerStatus.ANSWERED, at least one citation_id, exactly one provider generate
      call, exactly two context hits, and the set of context-hit variant IDs equals
      {"p6-cert-variant-001", "p6-cert-variant-002"}. Do not assert product-specific answer
      wording, seller, brand, price, media count, or business quality.
    - >
      Fail closed with bounded class-level diagnostics for configuration, CDP/browser,
      discovery blocked/navigation/orchestration/empty, acquisition blocked/extraction/download/
      upload/partial/unavailable, intake, duplicate observation, family planning/admission,
      variant admission, grounded QA, and cleanup. Disable traceback for the live certification
      failure boundary and never leak raw live details. No skip, xfail, retry, fallback,
      alternate query/platform, second discovery, or Human-interactive wait is permitted.
    - >
      Construct exactly one manager and attempt manager.close_all() exactly once in a finally
      boundary after the certification attempt. Cleanup failure must not mask an earlier
      primary certification failure; borrowed operator-owned Chromium/context/page resources
      remain TASK-137 authority and must not be closed by certification code.
    - >
      Offline/source-level tests may live inside the certification module only as needed to
      prove configuration validation, sanitization classifiers, in-memory Drive behavior, and
      source-level structural invariants. They must not monkeypatch the real live
      browser/discovery/scrape/intake/admission/QA path exercised by the live test.
    - >
      Update docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md and
      docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md to current history and publication-stable
      gating. They must record TASK-154/P6.0a as CLOSED, TASK-156/RUN-156-009 as preserved
      historical failed P6.0b certification evidence, TASK-162 as the published narrow Shopee
      acquisition-readiness blocker correction, and TASK-163 as the fresh current-main P6.0b
      closure gate. Wording must state that P6.0b and P6.0 are CLOSED if and only if TASK-163
      canonical Runtime verification and semantic review both PASS; otherwise P6.0 remains IN
      PROGRESS. P6.1 is NEXT only after that same gate passes. Do not use a static CURRENT /
      IN PROGRESS label that becomes false immediately upon semantic PASS.
    - >
      The roadmap update must preserve the ordered discipline CERTIFY -> EVALUATE -> IMPROVE,
      keep P6.1 as lexical retrieval-quality evaluation/baseline before semantic retrieval,
      and leave P6.2+ authorities deferred. TASK-163 must not claim both marketplaces, Google
      Drive, provider availability, product truth, identity migration, autonomous review, or
      serving infrastructure are certified.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      Candidate descends from the TASK-163 author commit on published TASK-162 main and changes
      only the certification module plus the two roadmap documents, with zero production Python,
      dependency, worker, AIOS pin, or historical TASK-156 lineage changes.
  - id: AC2
    condition: >
      The live fixture validates the three allowed configuration values, locks this successor
      to Shopee, constructs exactly one CDP manager, performs exactly one existing discovery /
      orchestration call, selects only shortlist[0], and always attempts exactly one manager
      close without retry/fallback/CAPTCHA automation.
  - id: AC3
    condition: >
      The same current ShopeeScrapeTool and manager acquire the same discovered listing exactly
      twice into two separate tmp_path roots as planned observations; each acquisition is exact
      SUCCESS with a confined source_pack.json, and a first-acquisition failure prevents the
      second acquisition.
  - id: AC4
    condition: >
      TASK-138 intake is called exactly once over the two roots, yielding exactly two persisted
      ProductSourcePack observations with distinct existing SourceObservationIdentity values;
      TASK-139 is called exactly once and yields exactly one actionable family proposal.
  - id: AC5
    condition: >
      One disposable TASK-120 SQLite catalog receives exactly one certification-local approved
      family through TASK-140 containing both observations and exactly two singleton approved
      variants through TASK-141, one per family member, with no lower-level admission bypass or
      new production ID/approval policy.
  - id: AC6
    condition: >
      TASK-135 is called exactly once from the durable SQLite database plus exact manifest paths
      using one deterministic zero-network provider and exact question/max_hits. The result is
      ANSWERED with citations, exactly one provider call, exactly two context hits, and both
      certification variant IDs represented.
  - id: AC7
    condition: >
      Live-route failure reporting remains bounded and sanitized with no raw marketplace,
      credential, filesystem, HTML, URL, cookie, token, or source-pack details; no skip, xfail,
      retry, fallback, reroute, alternate platform/query, or Human wait is introduced.
  - id: AC8
    condition: >
      TASK-162 product-page readiness is exercised only through current production acquisition
      and is not copied or redefined in the certification fixture; existing browser, extraction,
      intake, admission, persistence, and grounded-QA authorities remain unchanged.
  - id: AC9
    condition: >
      Required offline regressions, the live TASK-163 module, and git diff check all PASS under
      Runtime with zero unresolved items and no changed files outside scope.modify.
  - id: AC10
    condition: >
      Both roadmap documents accurately reconcile TASK-154 CLOSED, TASK-156 historical failed
      evidence, TASK-162 published blocker correction, and TASK-163 as the publication-stable
      P6.0b/P6.0 closure gate; P6.1 becomes NEXT only after TASK-163 Runtime plus semantic PASS.

