task_id: TASK-163
revision: 1

goal: >
  Re-establish post-P5 P6.0b Real-Evidence Canonical Knowledge + Grounded-QA
  certification from current published main after TASK-162. Using one real current Shopee
  candidate selected through the existing discovery/ranking path, acquire that exact listing
  twice as two genuine persisted observations, intake them once through TASK-138, compose
  existing Human-governed family and singleton-variant admissions through TASK-139/140/141
  into disposable TASK-120 SQLite state, and execute TASK-135 persistent grounded QA from
  that durable state plus the exact persisted manifests with one deterministic test-only
  provider. TASK-163 is certification-only: it creates no new product authority and changes
  zero production Python.

problem: >
  Published TASK-154 closed P6.0a by proving one real marketplace discovery -> acquisition
  -> persisted typed ProductSourcePack route. TASK-156 then attempted the downstream P6.0b
  composition and established substantial certification evidence, but its source was never
  published. Its historical correction lineage eventually reached RUN-156-009, where the
  offline suite passed and live discovery succeeded but Shopee acquisition failed with the
  bounded category LIVE_P6B_ACQUISITION_EXTRACTION. That evidence exposed a concrete
  product-page hydration/readiness weakness rather than a downstream canonical-knowledge
  defect. TASK-162 corrected the existing ShopeeSourceExtractor authority by adding bounded
  same-page readiness sampling and is now published. Continuing the historical TASK-156
  candidate would not include TASK-162 production code, so P6.0b must be certified afresh
  from current main. Current roadmap documents also retain stale pre-publication wording
  around TASK-154/P6.0b; this successor must make those documents publication-stable so they
  remain correct both before and after semantic review.

assumptions:
  - >
    Canonical python_complete_agent main immediately before TASK-163 authoring is
    065124f0bc414eb0222db14c07179d66ddce946c, the published TASK-162 source candidate.
  - >
    The authoritative AIOS dependency is exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@32ace104c5cfaa1b7affbaa40157872b1f85147f.
  - >
    TASK-154 is CLOSED and published at
    27ec982a96619379e8e387f0e8781b9503be2c59 after canonical Runtime plus semantic review
    established the P6.0a live discovery/acquisition/source-pack route.
  - >
    TASK-156 remains historical failed certification lineage and is not to be repaired,
    rerun, reviewed, cherry-picked, merged, or published by TASK-163. RUN-156-009 remains
    canonical failed evidence at failed_head_sha
    38e087e6925b1e7bac81c0eddc8b4dbb8992ff25 with live category
    LIVE_P6B_ACQUISITION_EXTRACTION after discovery succeeded.
  - >
    TASK-162 is CLOSED and published at current main. ShopeeSourceExtractor remains the sole
    Shopee product-page source extraction authority; its bounded same-page readiness behavior
    is production behavior exercised indirectly by this live certification, not duplicated
    in the fixture.
  - >
    TASK-137 remains the only authenticated CDP BrowserManager/BrowserSession lifecycle
    authority; TASK-146/M2 remains discovery/orchestration/ranking authority; ShopeeScrapeTool
    remains the deep-acquisition tool; ProductSourcePack serialization/TASK-125 remain
    persisted-evidence codec/typed-rehydration authorities.
  - >
    TASK-138 owns configured-root source evidence intake. TASK-139 owns family review planning.
    TASK-140 owns explicit family decision plus durable family admission composition.
    TASK-141 owns explicit sellable-variant review/decision plus durable variant admission.
    TASK-118/119/120 retain catalog integrity, codec, and SQLite durability authority.
  - >
    TASK-122 remains lexical retrieval authority; TASK-121 remains canonical profile
    projection; TASK-134 remains query planning; TASK-123 remains canonical context/retrieval
    composition; TASK-133 remains grounded answer composition; TASK-135 remains persistent
    grounded-QA startup/call-order authority.
  - >
    P4 already certified production provider transport separately. TASK-163 therefore uses a
    deterministic zero-network test provider so this task certifies real evidence and
    canonical-knowledge composition without conflating provider account/network/quota state.

