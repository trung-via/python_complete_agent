task_id: TASK-152
revision: 1

goal: >
  Re-establish P6.0a Live Marketplace Discovery -> Persisted Product Source Pack
  Certification from the published TASK-151 fixed main. Add one certification-only live
  integration fixture that uses the existing authenticated CDP browser boundary, existing
  M2 discovery/orchestration/ranking path, the published TASK-151-hardened
  ShopeeDiscoveryAdapter when Shopee is selected, and the existing platform scrape tool to
  prove that one current real marketplace route can discover a real candidate and persist a
  typed V1 ProductSourcePack locally. This successor supersedes TASK-150 only as the active
  certification attempt; TASK-150/RUN-150-001..005 remain canonical historical failure
  evidence and must not be rewritten, repaired, cherry-picked, or published.

problem: >
  TASK-150 correctly exposed the absence of real post-P5 marketplace-to-evidence
  certification but its candidate never published. RUN-150-001 failed on unavailable CDP;
  RUN-150-002..004 remained confounded by CAPTCHA/Human timing; RUN-150-005, after the Human
  confirmed a normal non-CAPTCHA Shopee surface before Runtime verification, still failed in
  Shopee discovery with LIVE_DISCOVERY_UNAVAILABLE and "No cards extracted on page 1 and no
  empty-result marker found" while all offline regressions passed. Because TASK-150 forbade
  production Python changes, that defect was corrected separately by TASK-151 revision 2.
  RUN-151-001 passed canonical Runtime verification and ChatGPT PRIMARY semantic review; the
  publication workflow then advanced main to the exact TASK-151 source candidate
  39f39df0efe23c0d18a7292a0b27f92f40a64832. P6.0a still lacks successful live evidence on
  this fixed production path. The previous TASK-150 candidate cannot be reused as current
  truth because it descends from the pre-fix baseline and its documentation/test delta was
  never published.

assumptions:
  - >
    Canonical Python Agent main immediately before TASK-152 authoring is
    39f39df0efe23c0d18a7292a0b27f92f40a64832, the published TASK-151 source candidate.
  - >
    TASK-151 revision 2 is CLOSED by RUN-151-001 Runtime PASS, REVIEW-151-001 PRIMARY PASS,
    and repository-native publication of source candidate
    39f39df0efe23c0d18a7292a0b27f92f40a64832 only.
  - >
    TASK-150 remains failed historical certification lineage. Its latest canonical failure
    is RUN-150-005 with failed_head_sha cb79b3de3c606424632764f3cc24dd2c3925f0bc.
    No TASK-150 source candidate, docs, test fixture, review decision, repair metadata, or
    failure artifact is part of current product main unless independently present there.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@67db82bf19d63f25721d06aabb82d850db8b78d4.
  - >
    TASK-137 PlaywrightBrowserManager CDP attachment remains the sole authenticated
    browser/session lifecycle authority. TASK-152 may consume it but must not modify it.
  - >
    TASK-146 DiscoveryRequest, ShopeeDiscoveryAdapter/TikTokDiscoveryAdapter,
    PlatformDiscoveryPlan, orchestrate_discovery, CandidateRanker, and OrchestrationResult
    remain the sole live discovery/orchestration/ranking path. TASK-151 hardened only the
    existing Shopee adapter readiness/extraction implementation and created no new semantic
    authority.
  - >
    ShopeeScrapeTool and TikTokScrapeTool remain the production marketplace acquisition
    tools that call existing Product Source Pack extractors/downloader/serialization.
    serialize_source_pack remains the V1 persistence authority and TASK-125
    deserialize_product_source_pack remains the sole strict typed rehydration authority.
  - >
    TASK-121 remains evidence-preserving canonical profile authority and TASK-122 remains
    deterministic lexical retrieval authority. Semantic/vector retrieval, reranking,
    product-truth reconciliation, identity evolution, caches, serving, and higher-level
    automation remain deferred until successful certification and later evaluation justify
    them.
  - >
    Human login/session/CAPTCHA preparation remains external to repository code. Before the
    admitted live verification begins, the configured operator-owned Chromium/CDP session
    must already be available and usable. TASK-151 readiness sampling is bounded page
    synchronization, not a Human CAPTCHA wait or CAPTCHA-solving capability.

