  modify:
    - tests/integration/test_live_product_source_acquisition.py
    - docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md
    - docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md
    - docs/POST_M4_P5_HUMAN_FACING_SURFACE.md

non_goals:
  - Modify any production Python module, requirements file, environment template, worker,
    AIOS pin, GitHub workflow, browser manager/session, marketplace discovery adapter,
    orchestrator, ranker, scraper tool, Product Source Pack model/serializer/downloader, or
    Drive integration.
  - Modify, repair, delete, reinterpret, republish, or cherry-pick TASK-150 candidate,
    RUN-150 failure/repair/result artifacts, TASK-151 lineage, or REVIEW-151-001.
  - Change P1-P5 semantic authorities or reopen TASK-137/TASK-138/TASK-144/TASK-146/
    TASK-149/TASK-151.
  - Add a production certify/smoke CLI command, service, daemon, watcher, queue consumer,
    scheduler, cache, registry, database, API endpoint, background process, retry loop,
    fallback, reroute, or alternate marketplace transport.
  - Automate login, CAPTCHA solving, stealth, profile creation, proxying, challenge bypass,
    browser restart, or session recovery.
  - Auto-approve, enqueue, start AgentController, execute tasks.txt/completed.txt, admit a
    family or variant, mutate SQLite catalog state, call grounded QA, or invoke an LLM.
  - Treat shortlist[0] as Human approval, winning-product truth, product truth, semantic
    truth, canonical identity, or a production purchase/content decision.
  - Certify Google Drive availability or upload durability. The certification-only Drive
    sink must make zero network/auth calls and remain test-only.
  - Add embeddings, vector databases/search, ANN, BM25/FTS, semantic reranking, query
    expansion, model-based retrieval, product-truth reconciliation, latest/majority/
    preferred-value policy, identity evolution/migrations, review automation, autonomous
    approval, caches, persistent indexes, or serving infrastructure.
  - Hard-code a marketplace product URL or require a Human to paste a candidate URL into the
    fixture. Candidate URL must come only from the exact current live discovery result.
  - Persist live certification output beneath the repository or commit live product data,
    HTML, screenshots, cookies, tokens, credentials, downloaded media, source packs, URLs,
    or other runtime evidence into Git.

constraints:
  hard:
    - >
      Add exactly one certification-only module
      tests/integration/test_live_product_source_acquisition.py. It must not be imported by
      production code and must not define a new reusable product API. TASK-152 must make zero
      production Python changes.
    - >
      Implement the successor from current main. Do not cherry-pick, merge, copy a Git tree,
      or otherwise publish the historical TASK-150 failed candidate as a shortcut. The
      executor may inspect TASK-150 contract/failure lineage for intent, but current source
      truth and all implementation must descend from the TASK-152 author commit based on the
      published TASK-151 fixed main.
    - >
      The live fixture configuration may read exactly three optional process-environment
      variables: PI_LIVE_CERT_PLATFORM, PI_LIVE_CERT_QUERY, and PI_LIVE_CERT_CDP_ENDPOINT.
      No other environment variable may affect certification routing.
      PI_LIVE_CERT_PLATFORM defaults to exact "shopee" and, when supplied, accepts only exact
      "shopee" or "tiktok" with no case-folding, aliases, fallback, or automatic cross-
      platform reroute. PI_LIVE_CERT_QUERY defaults to exact "bình giữ nhiệt inox" and must
      be a non-empty single-line string after only checking that it is not whitespace-only;
      do not rewrite, expand, normalize, translate, or infer another query.
      PI_LIVE_CERT_CDP_ENDPOINT defaults to exact "http://127.0.0.1:9222" and must be
      forwarded unchanged to the existing PlaywrightBrowserManager. Invalid explicit
      configuration fails before any browser/network work.
    - >
      The certification fixture must construct exactly one PlaywrightBrowserManager with the
      resolved CDP endpoint and use that exact manager for both discovery and the selected
      platform scrape tool. It must never launch a second manager, fall back to isolated
      launch mode, create a browser policy, automate login/CAPTCHA, or close the
      operator-owned Chromium/context/page. manager.close_all() must be attempted exactly
      once in a finally boundary after the certification attempt.
    - >
      Select exactly one existing discovery adapter from the explicit platform value:
      ShopeeDiscoveryAdapter for shopee or TikTokDiscoveryAdapter for tiktok. Construct one
      exact DiscoveryRequest for the explicit query with max_pages=1 and max_candidates no
      greater than 20, construct exactly one PlatformDiscoveryPlan, capture one timezone-
      aware UTC datetime and reuse it unchanged as both observed_at and evaluated_at, and
      call existing orchestrate_discovery exactly once with shortlist_size no greater than 5.
      No second discovery, retry, alternate query, alternate platform, browser reopen, or
      ranking call is allowed. TASK-151's internal same-page Shopee readiness sampling is
      part of the existing adapter implementation and is not a second discovery request.
    - >
      Certification requires a non-empty exact OrchestrationResult.shortlist. Use only
      shortlist[0].candidate as the live acquisition certification subject. This is a test
      fixture choice over an already-ranked result, not approval or a new ranking authority:
      the fixture must not inspect DecisionBand, score thresholds, confidence, price, sales,
      rating, commission, or other candidate fields to decide whether to proceed except the
      exact platform and URL needed to call the matching scrape tool. Make zero TASK-096
      approval/enqueue and zero AgentController/queue calls.
    - >
      Select exactly the existing ShopeeScrapeTool or TikTokScrapeTool matching the same
      explicit platform and call its execute(...) exactly once with a ToolCall containing the
      exact discovered candidate URL as url, deterministic certification-only call_id/run_id
      strings, and the tool's exact public name. The tool context must contain the exact same
      PlaywrightBrowserManager, a certification-only in-memory Drive sink, a deterministic
      non-secret dummy gdrive_folder_id, and output_dir rooted only beneath pytest tmp_path.
      No production filesystem path may be used.
    - >
      The certification-only Drive sink must live only inside the test module, expose only
      the minimum synchronous get_or_create_folder(name, parent_id=None) and
      upload_file(file_path, folder_id=None) methods required by the existing scraper tools,
      perform zero network/auth/environment work and no independent filesystem writes,
      return deterministic truthy placeholder values, and record only bounded call state for
      assertions. It must never enter src/.
    - >
      Live certification must require ToolResult.status is exact ToolStatus.SUCCESS and
      ToolResult.error is None. FAILURE or PARTIAL_SUCCESS means P6.0a is not certified.
      Result data must contain one manifest_path under the exact pytest tmp_path output root.
      The manifest must exist and be exact filename source_pack.json; no repository path,
      symlink escape, or external output path is acceptable.
    - >
      Pass the exact persisted manifest path exactly once to TASK-125
      deserialize_product_source_pack and require an exact ProductSourcePack result whose
      platform equals the explicitly selected platform, whose source_pack_id,
      source_product_id, collector, and product_url are non-empty strings, and whose
      observed_at is timezone-aware. Require at least one substantive retained evidence
      value across title, shop_name, brand, model_sku, description_text, facts, or media.
      Do not assert product-specific wording, price, seller, brand, model, fact key/value,
      media count, score, or business quality. Do not normalize/reconcile the returned pack.
    - >
      The fixture may assert that the scrape tool's returned source_pack_id equals the typed
      rehydrated pack source_pack_id and that its manifest path is the same local manifest.
      It must not require the extractor's product_url to byte-equal the discovery URL if the
      existing acquisition authority canonicalizes/redirects it; non-empty typed product_url
      is sufficient. Do not add URL canonicalization policy in certification code.
    - >
      Live fixture failures must fail closed and remain sanitized. No skip, xfail, retry,
      fallback, second request, silent pass, or alternate platform/query is allowed for
      missing CDP, login/session state, CAPTCHA/block, selector drift, empty discovery,
      extraction/download failure, persistence failure, typed rehydration failure, or other
      live-route unavailability. Catch only enough at the outer certification boundary to
      emit bounded categories such as LIVE_CDP_UNAVAILABLE, LIVE_DISCOVERY_UNAVAILABLE,
      LIVE_DISCOVERY_EMPTY, LIVE_ACQUISITION_UNAVAILABLE, or LIVE_SOURCE_PACK_INVALID with
      pytrace disabled. Do not include raw marketplace/Google exceptions, candidate/product
      URLs, HTML, page text, cookies, tokens, headers, local user paths, source-pack contents,
      or downloaded filenames in canonical pytest output.
    - >
      Explicit DiscoveryBlockedError/CAPTCHA remains a live certification failure, not a
      wait-for-Human workflow. Do not add Human-interactive sleeps, prompts, unbounded waits,
      or challenge polling to the certification fixture. TASK-151's bounded readiness behavior
      remains production adapter synchronization only.
    - >
      The Executor must not manually/ad-hoc invoke the live marketplace certification while
      editing. The only admitted live marketplace attempt for TASK-152 execution is the one
      invoked by the pinned Runtime through the exact required live verification command
      after the source candidate is committed. Offline verification must remain network-free.
    - >
      Add deterministic source-level/offline tests inside the new integration module only as
      needed to prove configuration validation and the certification-only Drive sink without
      performing network. Do not monkeypatch the real browser/discovery/scrape/serialization
      path in the live test itself and do not weaken the TASK-151 Shopee adapter.
    - >
      Update docs/POST_M4_P5_HUMAN_FACING_SURFACE.md to record published TASK-149/P5.3c and
      P5 Human-Facing Product Intelligence Surface as CLOSED. Record TASK-150 as failed
      historical certification evidence and TASK-151 as the published Shopee discovery
      blocker correction without presenting either as a new semantic authority.
    - >
      Add docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md as the canonical post-P5 audit result. It
      must explicitly classify P6 as certify -> evaluate -> improve and define: P6.0 Live
      Real-Evidence Certification as CURRENT; P6.0a TASK-152 successor live marketplace
      discovery-to-persisted-SourcePack certification as current; TASK-150 as superseded only
      for active certification by TASK-152 while its failure lineage remains evidence; P6.0b
      real-evidence canonical-knowledge + grounded-QA certification as unimplemented; P6.1
      retrieval-quality evaluation/baseline before semantic retrieval; P6.2 semantic/vector
      retrieval or reranking only if measured P6.1 evidence justifies it; P6.3 product-truth
      reconciliation as a separate Human-governed policy authority; P6.4 identity evolution/
      migrations as a separate canonical-identity authority; P6.5 higher-level Human-review
      automation without removing explicit approval authority; and P6.6 caches/background
      serving only after observed workload requires them.
    - >
      Update docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md consistently: mark P5 CLOSED by
      published TASK-149; replace the broad unordered P6 suggestion list with the audited
      ordered P6 boundaries; record TASK-151 published hardening and TASK-150 failed
      certification lineage; set P6.0 CURRENT / IN PROGRESS and TASK-152 P6.0a as the current
      certification candidate. P6.0 remains IN PROGRESS until P6.0b is separately designed
      and certified. Do not claim both marketplaces, Google Drive, Human approval/queue, M3
      admission, grounded QA, product truth, semantic retrieval, identity migration,
      automation, or serving are certified by TASK-152.
    - >
      Focused offline verification must cover current browser/discovery/orchestration,
      TASK-151 Shopee readiness regressions, platform scrape-tool compatibility, Product
      Source Pack serialization, and the certification fixture's deterministic non-live
      helpers without contacting a marketplace. The live verification command must run only
      the new certification module and is the sole live marketplace attempt admitted by
      TASK-152 Runtime verification.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      TASK-152 changes only one certification-only integration module plus the three P5/P6
      documentation files; production Python, dependencies, worker/control-plane files, and
      existing P1-P5/P6 semantic owners remain unchanged.
  - id: AC2
    condition: >
      Live configuration is bounded to exact platform/query/CDP values with documented
      defaults, validates explicit bad input before network, and performs no platform/query/
      browser fallback or secret/config discovery.
  - id: AC3
    condition: >
      The live fixture uses exactly one existing CDP manager, one matching existing platform
      discovery adapter, one DiscoveryRequest/PlatformDiscoveryPlan, one shared aware UTC
      timestamp, and exactly one orchestrate_discovery call with bounded discovery/ranking.
  - id: AC4
    condition: >
      A non-empty current shortlist is required and shortlist[0].candidate is used only as
      the certification acquisition subject; no score/DecisionBand policy, approval,
      enqueue, AgentController, or canonical identity action is introduced.
  - id: AC5
    condition: >
      The matching existing platform scrape tool is executed exactly once with the exact
      discovered URL, exact shared browser manager, tmp_path-only output, and a test-only
      zero-network Drive sink; ToolStatus.SUCCESS is required and Google Drive is not claimed
      as certified.
  - id: AC6
    condition: >
      The produced source_pack.json remains beneath tmp_path, is rehydrated exactly once only
      through TASK-125, returns an exact timezone-aware ProductSourcePack with matching
      platform/non-empty canonical identity/provenance fields and at least one substantive
      evidence value, without product-specific or truth-quality assertions.
  - id: AC7
    condition: >
      CDP, discovery, block/CAPTCHA, empty result, extraction/download, persistence, and typed
      rehydration failures fail closed as bounded high-level certification categories with no
      skip/retry/fallback and no raw marketplace/credential/URL/content leakage.
  - id: AC8
    condition: >
      P5 documentation is reconciled to CLOSED by published TASK-149; TASK-150 is preserved
      as failed certification evidence; TASK-151 is recorded as published discovery
      hardening; and TASK-152 is represented only as the current successor certification.
  - id: AC9
    condition: >
      P6 is ordered as certify -> evaluate -> improve: P6.0a current via TASK-152, P6.0b
      future, retrieval evaluation before conditional semantic retrieval, and separate later
      truth/identity/automation/serving boundaries; TASK-152 implements none of those later
      capabilities.
  - id: AC10
    condition: >
      Offline regressions pass without network, the single Runtime-owned live certification
      proves one current explicit marketplace route on the published TASK-151 fixed baseline
      can discover and persist typed real ProductSourcePack evidence, git diff check passes,
      unresolved is empty, and P6.0 remains IN PROGRESS pending separate P6.0b real-evidence
      canonical-knowledge/grounded-QA certification.

verification:
  required:
    - '$env:PYTHONPATH = ".;src"; python -m pytest tests/product_intelligence/test_orchestration.py tests/product_intelligence/test_shopee_discovery.py tests/product_intelligence/test_tiktok_discovery.py tests/product_source/test_scrape_tool_compat.py tests/product_source/test_source_pack_serialization.py tests/integration/test_browser_cdp.py -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - '$env:PYTHONPATH = ".;src"; python -m pytest tests/integration/test_live_product_source_acquisition.py -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - 'git diff --check; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
