  inspect:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md
    - docs/POST_M4_P5_HUMAN_FACING_SURFACE.md
    - docs/PHASE_6_M2_DISCOVERY.md
    - docs/PHASE_6_PRODUCT_SOURCE_PACK.md
    - .ai/tasks/TASK-121.yaml
    - .ai/tasks/TASK-122.yaml
    - .ai/tasks/TASK-125.yaml
    - .ai/tasks/TASK-137.yaml
    - .ai/tasks/TASK-144.yaml
    - .ai/tasks/TASK-146.yaml
    - .ai/tasks/TASK-149.yaml
    - .ai/tasks/TASK-150.yaml
    - .ai/tasks/TASK-151.yaml
    - src/integrations/playwright/manager.py
    - src/product_intelligence/discovery.py
    - src/product_intelligence/orchestration.py
