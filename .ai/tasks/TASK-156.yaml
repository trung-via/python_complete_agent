task_id: TASK-156
revision: 1

goal: >
  Certify post-P5 P6.0b Real-Evidence Canonical Knowledge + Grounded-QA as one
  certification-only vertical proof over already-published authorities. Starting from one
  real current marketplace candidate selected through the existing P6.0a discovery path,
  acquire that exact listing twice as two genuine persisted observations under separate
  pytest tmp_path roots, intake them exactly once through TASK-138, compose exact family
  review and disposable Human-governed family admission through TASK-139/TASK-140, admit
  two explicit singleton sellable variants through TASK-141 so every real observation is
  bound exactly once, and finally execute TASK-135 persistent grounded QA from the durable
  temporary SQLite catalog plus the exact persisted manifests using one deterministic
  test-only provider. Close no new semantic authority: TASK-156 changes zero production
  Python and exists only to certify that the already-built real-evidence -> canonical
  knowledge -> grounded-QA chain works end to end on current live evidence.

problem: >
  Published TASK-154 closed P6.0a by proving one real marketplace route can progress from
  live discovery through existing deep acquisition to a persisted typed ProductSourcePack.
  P6.0 remains open because the downstream path has only deterministic synthetic/fixture
  coverage: TASK-138 can intake persisted packs; TASK-139/140/141 can compose explicit
  Human-governed family/variant admission into TASK-120 SQLite durability; and TASK-135 can
  reconstruct registered canonical variants and answer through the existing M4 grounded-QA
  chain. No canonical run has yet proven those authorities compose successfully using real
  marketplace observations. A single real observation is insufficient for the existing
  P3 family-review path because TASK-139 deliberately leaves SINGLETON groups non-actionable.
  The narrow certification solution is therefore to observe the same real listing twice,
  producing two genuine observations distinguished by their existing observed_at identity,
  admit one family containing those observations, then create one singleton variant per
  observation so TASK-135's exact manifest-to-registered-variant completeness invariant is
  satisfied without inventing variant equivalence or product truth.

assumptions:
  - >
    Current canonical python_complete_agent main at TASK-156 authoring is
    8b551e90868301cb31ba4edac4a15c23cc59fec4, the published TASK-155 source candidate.
  - >
    The authoritative AIOS dependency is exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@14a1276d69665e7c371b6d56a95e50b992cbc7b3.
  - >
    TASK-155 is CLOSED by RUN-155-001 Runtime PASS and REVIEW-155-001 PRIMARY PASS. It
    changes only the execution substrate pin and worker certification; it creates no
    Product Intelligence semantic authority.
  - >
    TASK-154 is CLOSED and published at
    27ec982a96619379e8e387f0e8781b9503be2c59 after RUN-154-005 proved the live
    discovery/acquisition/source-pack route and RUN-154-006 fixed the AC7 documentation
    finding with DELTA PASS. P6.0a therefore no longer blocks downstream certification.
  - >
    TASK-137 PlaywrightBrowserManager remains the sole authenticated CDP/session lifecycle
    authority; TASK-146/M2 remains discovery/orchestration/ranking authority; existing
    ShopeeScrapeTool/TikTokScrapeTool remain deep-acquisition authorities; ProductSourcePack
    serialization/TASK-125 remain persisted evidence codec/typed-rehydration authorities.
  - >
    TASK-138 owns configured-root source evidence intake only. TASK-139 owns family review
    planning composition only. TASK-140 owns explicit family decision plus durable family
    admission composition only. TASK-141 owns explicit sellable-variant review/decision plus
    durable variant admission composition only. TASK-118/119/120 retain catalog integrity,
    codec, and SQLite durability authority respectively.
  - >
    SourceObservationIdentity includes source_pack_id, platform, source_product_id,
    product_url, and observed_at. Two sequential genuine acquisitions of the same listing
    may therefore remain distinct observations without creating a new identity rule. If the
    existing authorities nevertheless reject them as duplicate/conflicting/non-actionable,
    certification must fail closed rather than alter identity or resolution semantics.
  - >
    TASK-122 remains lexical retrieval authority; TASK-121 remains canonical profile
    projection; TASK-134 remains query planning; TASK-123 remains canonical context/
    retrieval composition; TASK-133 remains grounded answer composition; TASK-135 remains
    persistent startup/call-order authority.
  - >
    P4 already certified the production provider transport separately. P6.0b therefore uses
    a deterministic test-only LLMProvider implementation so this task certifies real evidence
    and canonical knowledge composition without conflating provider account/network/quota
    availability with downstream evidence correctness.

