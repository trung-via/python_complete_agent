non_goals:
  - Modify any production Python module, package dependency, AIOS pin, repository worker,
    workflow, publication mechanism, ProductSourcePack schema, browser manager, marketplace
    adapter, scraper, intake, entity resolution/grouping, approval, catalog, SQLite, profile,
    retrieval, RAG, prompt, provider, or grounded-answer implementation.
  - Reopen or rerun TASK-154 as a task, modify its fixture, review, remediation, result, or
    publication history, or copy a failed TASK-150/TASK-152 candidate.
  - Create a second discovery, ranking, identity, evidence, family/variant, catalog,
    persistence, retrieval, prompt, provider, answer, or product-truth authority.
  - Generate or infer a production family_id or variant_id allocation policy. TASK-156 may
    use deterministic opaque IDs only inside disposable tmp_path certification state.
  - Treat test-local APPROVE values as production Human authorization, persist Human
    decisions outside the temporary catalog, bypass TASK-112/TASK-116 Human-decision
    semantics, or introduce autonomous approval behavior.
  - Infer that the two observations are an exact sellable-variant match. The certification
    must use one explicit singleton variant per admitted family member and must not merge
    them into one variant unless a future task separately authorizes such behavior.
  - Reconcile preferred/latest/majority facts, mutate evidence, normalize product truth,
    extend existing persisted canonical identities, repair conflicts, or canonicalize a
    singleton family outside existing P3 semantics.
  - Certify Google Drive durability. A test-only in-memory Drive sink is used only to satisfy
    the existing scrape-tool protocol and performs zero Drive network/authentication work.
  - Make a live production LLM/provider call. P4 already owns provider certification;
    TASK-156 uses a deterministic fake provider only.
  - Add semantic/vector retrieval, embeddings, BM25/FTS, reranking, retrieval-quality
    scoring, evaluation benchmarks, caches, background services, watchers, queues, retries,
    fallback, reroute, CAPTCHA solving, stealth, proxying, or Human-interactive waits.
  - Implement P6.1 retrieval-quality evaluation or any P6.2+ capability inside TASK-156.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Add exactly one certification-only module
      tests/integration/test_live_real_evidence_canonical_qa.py. It must not be imported by
      production code and must define no reusable production API. TASK-156 makes zero
      production Python changes.
    - >
      The live fixture may read only the same three optional process-environment variables
      used by TASK-154: PI_LIVE_CERT_PLATFORM, PI_LIVE_CERT_QUERY, and
      PI_LIVE_CERT_CDP_ENDPOINT. Platform defaults to exact "shopee" and accepts only exact
      "shopee" or "tiktok". Query defaults to exact "bình giữ nhiệt inox", must be non-empty
      and single-line, and must be forwarded without rewriting/translation/expansion. CDP
      endpoint defaults to exact "http://127.0.0.1:9222" and is forwarded unchanged to one
      PlaywrightBrowserManager. Invalid explicit configuration fails before browser/network.
    - >
      Construct exactly one PlaywrightBrowserManager. Select exactly one existing platform
      adapter, build one DiscoveryRequest with max_pages=1 and max_candidates<=20, one
      PlatformDiscoveryPlan, capture one timezone-aware UTC timestamp reused as observed_at
      and evaluated_at, and call existing orchestrate_discovery exactly once with
      shortlist_size=1. Require a non-empty shortlist and use only shortlist[0].candidate.
      Do not inspect scores/bands/price/rating/sales/commission to decide whether to proceed.
    - >
      Select exactly one existing scrape tool matching the configured platform and use the
      exact same tool instance and same browser manager for the acquisition sequence. On the
      successful path execute the tool exactly twice against the exact same discovered
      candidate URL. These are two planned evidence observations, not retries. Use distinct
      deterministic call_id values, one shared deterministic certification run_id, one
      deterministic non-secret dummy gdrive_folder_id, the same test-only in-memory Drive
      sink, and two distinct output_dir roots confined beneath pytest tmp_path. If the first
      acquisition fails, fail closed immediately; never retry it merely to reach two packs.
    - >
      Each acquisition must return exact ToolStatus.SUCCESS with error is None and one
      source_pack.json manifest confined beneath its corresponding tmp_path output root.
      PARTIAL_SUCCESS or FAILURE is certification failure. Preserve bounded sanitized
      acquisition categories based only on existing ToolResult error.code/status classes
      (including extraction blocked/empty, download failed, upload failed, partial, unknown)
      and never emit raw exception messages, product URLs, HTML, cookies, tokens, local user
      paths, filenames, source-pack contents, or downloaded media names.
    - >
      The in-memory Drive sink must live only in the certification module, expose only the
      minimal synchronous get_or_create_folder(name, parent_id=None) and
      upload_file(file_path, folder_id=None) protocol required by existing scrape tools,
      perform zero network/auth/environment/independent filesystem work, return deterministic
      truthy placeholders, and record only bounded call counts/state for assertions.
    - >
      After both successful acquisitions, call TASK-138 intake_product_source_evidence
      exactly once with the two explicit acquisition output roots and retain the exact
      returned SourceEvidenceInventory. Require exactly two manifest_paths and two exact
      ProductSourcePack values. Derive no shadow evidence representation and do not directly
      deserialize/parse manifests in TASK-156. Existing TASK-138/TASK-125 failures must cause
      sanitized certification failure rather than skip/repair/rewrite evidence.
    - >
      Require the two exact SourceObservationIdentity.from_pack values to be distinct. Do
      not alter observed_at, source_pack_id, URL, source_product_id, or any source field to
      manufacture distinctness. If the real acquisitions collapse to one exact identity,
      fail closed. Do not sleep/retry solely to force a distinct timestamp.
    - >
      Call TASK-139 plan_family_knowledge_review exactly once with the exact TASK-138
      inventory. Require exactly one actionable FamilyMergeProposal in plan.proposals for
      this two-observation certification. Use only plan.proposals[0] by exact object identity.
      If current existing resolution/grouping semantics produce zero/multiple actionable
      proposals, SINGLETON, CONFLICTED, DIFFERENT_PRODUCT, or otherwise non-actionable state,
      fail closed; do not override, repair, regroup, rescore, or create a synthetic proposal.
    - >
      Create exactly one empty SQLite catalog under pytest tmp_path only through TASK-120
      create_sqlite_canonical_catalog before durable admission. Record one explicit
      certification-local family APPROVE through TASK-140 record_planned_family_decision
      using the exact plan/proposal, exact FamilyMergeDecision.APPROVE, deterministic actor
      "p6-certification", and one fixed timezone-aware certification timestamp. Then call
      TASK-140 durably_admit_planned_family exactly once with deterministic opaque
      family_id "p6-cert-family-001" and the exact tmp_path database. Require successful
      existing registration semantics; never call TASK-114/118/119 or sqlite3 directly.
    - >
      Certification-local APPROVE values and opaque IDs exist only to exercise already-
      published Human-governed APIs against disposable test state. They are not production
      Human decisions, autonomous approval policy, or ID allocation authority and must never
      be persisted outside pytest tmp_path or documented as such.
    - >
      Require the exact admitted family to contain exactly the two intake observation
      identities. Iterate family.members in exact canonical family order. For each member,
      call TASK-141 prepare_sellable_variant_review exactly once with the exact family and
      one singleton tuple containing only that exact member; record one exact
      SellableVariantDecision.APPROVE through TASK-141 with the same actor/fixed timestamp;
      then durably admit exactly one variant through TASK-141 using deterministic opaque IDs
      "p6-cert-variant-001" and "p6-cert-variant-002" in family-member order. Never call
      TASK-115/116/117/118/119/120 variant registration primitives directly from the fixture.
    - >
      The two singleton variants are certification composition only. TASK-156 must not infer
      EXACT_VARIANT_MATCH between the observations, select preferred evidence, or claim that
      singleton partitioning is a production variant-discovery policy. It is used solely so
      every supplied real observation is bound to exactly one registered variant under the
      existing TASK-135 completeness contract.
    - >
      After durable family/variant admission, do not pass in-memory canonical family/variant
      objects to the QA boundary. Call TASK-135 answer_persisted_grounded_question exactly
      once with the tmp_path database path and exact inventory.manifest_paths, forcing TASK-135
      to reload canonical SQLite state and typed persisted evidence through its existing
      TASK-120/TASK-125 startup authority.
    - >
      Use one certification-only deterministic fake LLMProvider that performs zero network
      work, records exactly one generate call, and returns one structurally valid ANSWERED
      JSON response with citation_ids ["H001-E001"] and a bounded non-product-specific answer.
      The question must be deterministically formed only from the configured platform, e.g.
      "Which persisted evidence comes from <platform>?". This is guaranteed to target the
      existing TASK-122 searchable PLATFORM field and must not inspect product values to
      synthesize truth. Use max_hits=2 so both singleton variants are eligible for context.
    - >
      Successful grounded-QA certification requires the exact returned GroundedAnswer to
      have status ANSWERED, at least one validated citation, exactly one fake-provider call,
      exactly two canonical context hits whose profile.variant_id values correspond to the
      two certification variant IDs, and no predecessor error. These assertions prove only
      real-evidence persistence/retrieval/grounding flow, not factual correctness, product
      truth, recommendation quality, semantic retrieval quality, or provider SLA.
    - >
      All live-route failures must fail closed with bounded pytrace-disabled stage categories
      such as LIVE_P6B_CONFIG_INVALID, LIVE_CDP_UNAVAILABLE, LIVE_P6B_DISCOVERY_BLOCKED,
      LIVE_P6B_DISCOVERY_UNAVAILABLE, LIVE_P6B_DISCOVERY_EMPTY,
      LIVE_P6B_ACQUISITION_EXTRACTION, LIVE_P6B_ACQUISITION_DOWNLOAD,
      LIVE_P6B_INTAKE_UNAVAILABLE, LIVE_P6B_DUPLICATE_OBSERVATION,
      LIVE_P6B_FAMILY_NOT_ACTIONABLE, LIVE_P6B_FAMILY_ADMISSION_UNAVAILABLE,
      LIVE_P6B_VARIANT_ADMISSION_UNAVAILABLE, and LIVE_P6B_GROUNDED_QA_UNAVAILABLE.
      Classification may be more specific when based only on existing safe class/error-code
      values, but must never include raw external/live data.
    - >
      Attempt manager.close_all() exactly once in a finally boundary after the certification
      attempt and preserve the primary failure if cleanup also fails. Do not launch another
      browser, reopen on failure, add certification-level polling, retry, fallback, alternate
      query/platform, CAPTCHA automation, or Human-interactive wait.
    - >
      The executor must not manually/ad-hoc invoke the live certification while editing.
      The only admitted live marketplace execution for TASK-156 is the exact Runtime-owned
      live verification command after the candidate is committed. Offline verification must
      remain network-free with respect to live marketplace/provider behavior.
    - >
      Add deterministic offline/source-level tests inside the certification module for
      configuration validation, in-memory Drive sink, fake-provider response/call counting,
      bounded diagnostic sanitization, and other pure helpers. Do not monkeypatch or replace
      real discovery/scrape/intake/P3/SQLite/TASK-135 authorities inside the live test.
    - >
      Update docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md and
      docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md to record TASK-154/P6.0a unambiguously
      CLOSED by published candidate 27ec982a96619379e8e387f0e8781b9503be2c59, record
      TASK-155 only as execution-substrate adoption rather than a Product Intelligence
      milestone, and define TASK-156 as the P6.0b certification gate. The wording must be
      publication-stable: P6.0b/P6.0 are CLOSED if and only if TASK-156 canonical Runtime
      verification and semantic review both PASS; otherwise P6.0 remains IN PROGRESS.
      P6.1 Retrieval-Quality Evaluation becomes NEXT only after that condition is satisfied.
    - >
      Documentation must preserve CERTIFY -> EVALUATE -> IMPROVE ordering and explicitly
      state TASK-156 introduces no real Human production approval, product truth,
      production ID allocation, semantic/vector retrieval, live-provider certification,
      autonomous review, cache, or serving authority.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      Candidate descends from TASK-156 authoring main, changes only the new certification
      module plus the two allowed roadmap documents, and makes zero production Python,
      dependency, AIOS worker/pin, workflow, TASK-154 artifact, or publication changes.
  - id: AC2
    condition: >
      The live route validates only the three TASK-154-compatible configuration values,
      constructs exactly one CDP manager, performs exactly one existing discovery/
      orchestration call with shortlist_size=1, selects only shortlist[0].candidate, and
      always attempts one cleanup without retry/fallback/reroute/CAPTCHA/Human wait.
  - id: AC3
    condition: >
      On the successful path the matching existing scrape tool executes exactly twice on
      the exact same discovered URL using the same browser manager, separate tmp_path output
      roots and test-only Drive sink; both results are exact SUCCESS and produce two confined
      persisted source_pack.json manifests without real Drive publication.
  - id: AC4
    condition: >
      TASK-138 is called exactly once over those two roots, returns exactly two distinct
      canonical SourceObservationIdentity values without TASK-156 mutating identity/evidence,
      and TASK-139 is called exactly once to yield exactly one actionable family proposal;
      non-actionable/conflicted/duplicate evidence fails closed without semantic override.
  - id: AC5
    condition: >
      A disposable tmp_path SQLite catalog is created only through TASK-120; exact test-local
      family APPROVE is recorded/admitted only through TASK-140 with one deterministic opaque
      family_id; the resulting family contains exactly the two real observation identities
      and no production Human/ID allocation authority is introduced.
  - id: AC6
    condition: >
      Exactly two singleton sellable-variant reviews/APPROVEs/admissions are composed only
      through TASK-141 in canonical family-member order, producing two registered variants
      with non-overlapping exact observation membership and deterministic test-only variant
      IDs, without inferring exact variant equivalence or calling lower-level variant/catalog
      authorities directly.
  - id: AC7
    condition: >
      TASK-135 is invoked exactly once using only the persisted tmp_path SQLite database and
      exact TASK-138 manifest_paths plus a deterministic zero-network fake provider; it must
      reload existing state through predecessor authorities and return one validated ANSWERED
      GroundedAnswer with at least one citation, exactly two context hits for the two
      registered singleton variants, and exactly one provider generate call.
  - id: AC8
    condition: >
      All live failures are fail-closed into bounded sanitized stage/error-code categories
      with pytrace disabled and no raw URLs, HTML, cookies, tokens, product/source contents,
      downloaded filenames, or local user paths; no skip/xfail/silent pass/retry/fallback or
      interactive recovery exists.
  - id: AC9
    condition: >
      Focused offline/source-level helper tests and all predecessor intake/P3/catalog/
      persistent-grounded-QA/scrape/browser regressions pass; the single Runtime-owned live
      certification module passes; git diff --check passes; unresolved is empty.
  - id: AC10
    condition: >
      Roadmap documentation records published TASK-154 as P6.0a CLOSED, TASK-155 as
      execution-substrate adoption only, TASK-156 as the publication-stable P6.0b/P6.0
      closure gate, and P6.1 as NEXT only after TASK-156 Runtime plus semantic PASS while
      preserving all prior authority and CERTIFY -> EVALUATE -> IMPROVE ordering.

