acceptance:
  - id: AC1
    condition: >
      docs/PYTHON_AGENT_PRODUCT_CONTRACT.md exactly implements the complete Human-approved v2
      text with only the authorized status normalization to DURABLE PRODUCT CONTRACT, preserves
      the four Governance Foundation layers, and contains exactly the approved PC1-PC8 article
      order plus Canonical Product Principle.
  - id: AC2
    condition: >
      The durable North Star defines Python Agent as a composable Commerce Intelligence system
      for better commerce decisions under uncertainty, makes Intelligence decision-relative,
      and rejects universal winner/ranking semantics independent of decision context.
  - id: AC3
    condition: >
      The contract preserves distinct Observation/Evidence/Knowledge/Product-Truth boundaries,
      first-class uncertainty and time, snapshot-versus-trend separation, and prediction-versus-
      truth separation without redefining lower evidence, identity, persistence, or truth mechanics.
  - id: AC4
    condition: >
      The contract treats opportunity as contextual hypothesis, requires disconfirmation support,
      distinguishes contextual ranking, and preserves causal honesty by separating description,
      association, prediction, causal hypothesis/estimate, and experimentally supported effect.
  - id: AC5
    condition: >
      Decision-ready Intelligence is defined around decision question, objectives, constraints,
      alternatives, evidence, unknowns, assumptions, counter-evidence, trade-offs, risk, expected
      outcomes, and decision-changing information while keeping score, recommendation, and
      Intelligence distinct from the legitimate decision boundary.
  - id: AC6
    condition: >
      Value-of-Information includes both justified acquisition and intelligent stopping; metrics,
      confidence, and expected value remain bounded decision instruments and do not acquire
      authority, certainty, or guaranteed-outcome semantics.
