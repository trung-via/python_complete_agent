task_id: TASK-167
revision: 1

goal: >
  Harden the existing ShopeeDiscoveryAdapter search-result extraction/readiness boundary so
  unrelated product anchors outside the actual Shopee search-result surface cannot be emitted
  as discovery candidates or prematurely terminate bounded readiness polling. Preserve
  TASK-151/TASK-153 as the sole Shopee discovery/mapping authority, preserve TASK-146
  orchestration and CandidateRanker/WinningProductScorer semantics unchanged, and unblock a
  fresh Human-reviewed P6.1b external capture after publication.

problem: >
  Published TASK-166 successfully moved live marketplace capture outside AIOS engineering
  verification and produced a real READY external capture bundle for the fixed P6.1b intents.
  Human semantic review rejected that bundle because the cohort for exact query
  "chuột không dây" captured an unrelated lantern listing. A subsequent read-only live
  `discover` invocation for the same exact query returned a raw candidate set and top-3
  shortlist consisting of mouse products, so the observed mismatch is timing-sensitive rather
  than a stable business-ranking preference. Current Shopee card extraction can explain this
  behavior: the fallback executes a document-global query for canonical Shopee product anchors,
  while the readiness loop terminates on any non-empty `items` result. Before the real search
  grid finishes hydrating, unrelated recommendation/advertising/other product anchors elsewhere
  on the document can therefore plausibly be treated as discovered search results and make the
  page appear ready. The same script also includes `.shopee-search-item-result` in the individual
  card selector list even though that selector represents the broader search-result surface,
  allowing one container to be interpreted as one item card. This task narrows that existing
  DOM boundary; it does not add query relevance, change ranking, or recapture evidence inside
  AIOS.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-167 authoring is
    e3b6cb090acc6bcb46268c31b3306ab1c89cd32c, the reviewed and published TASK-166 source
    candidate.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@32ace104c5cfaa1b7affbaa40157872b1f85147f.
  - >
    TASK-151 remains the sole Shopee search-surface readiness and product-anchor fallback
    authority; TASK-153 remains the same adapter's null-safe card mapping hardening. TASK-167
    is a narrow regression hardening inside that existing authority, not a second discovery
    implementation.
  - >
    TASK-146 orchestration and CandidateRanker/WinningProductScorer remain business-ranking
    authorities. They intentionally rank already-discovered candidate snapshots using canonical
    scoring signals and do not own query-title relevance or marketplace DOM eligibility.
  - >
    TASK-166 remains CLOSED and published. Its external READY capture bundle that contained the
    unrelated lantern cohort is rejected Human evidence only and must not be imported, committed,
    repaired, rewritten, or reused as P6.1b benchmark truth.
  - >
    P6.1b remains blocked until TASK-167 Runtime PASS + semantic PASS + publication and a new
    external TASK-166 capture bundle passes Human cohort review. P6.2 remains blocked until
    reviewed empirical P6.1b metrics exist.

