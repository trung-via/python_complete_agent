non_goals:
  - Modify TASK-166 live_capture.py, its checkpoint/bundle schema, candidate-selection sequence,
    resume semantics, CLI capture flags, external bundle data, or any TASK-166 tests.
  - Modify DiscoveryRequest, DiscoveryBatch, ProductCandidateSnapshot, orchestration,
    CandidateRanker, WinningProductScorer, SnapshotNormalizer, ScoringPolicy, shortlist ordering,
    score thresholds, DecisionBand, or business ranking semantics.
  - Add query-title lexical matching, search relevance scoring, keyword filtering, BM25/FTS,
    fuzzy matching, synonym expansion, semantic/vector relevance, LLM filtering/reranking,
    or any second eligibility/ranking authority.
  - Change Shopee search URL construction, query text, pagination/max-candidate limits, browser/CDP
    lifecycle, navigation count, CAPTCHA detection/handling, true-empty semantics, login behavior,
    retry/reroute, alternate query/platform, or browser restart.
  - Add live Shopee/CDP work to TASK-167 verification or keep an AIOS executor waiting for Human
    interaction. Runtime verification remains fully offline.
  - Fix the separately observed Windows redirected-stdout Unicode portability issue in the Product
    Intelligence CLI; that is independent follow-up work and must not be bundled here.
  - Import, commit, move, rewrite, or delete the rejected external READY capture bundle or its
    manifests/media.
  - Complete P6.1b, compute retrieval metrics, modify TASK-164, introduce semantic/vector retrieval,
    or authorize P6.2.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Keep ShopeeDiscoveryAdapter and SHOPEE_CARD_EXTRACTION_SCRIPT as the sole Shopee discovery
      and DOM-extraction path. No second adapter, parser, browser route, HTTP/API scraper, or
      parallel discovery authority may be introduced.
    - >
      Preserve one page/session acquisition and exactly one search navigation per requested page.
      Preserve TASK-151 fixed bounded same-page readiness behavior: no more than 10 samples at
      0.5 seconds each, no public timing controls, no automatic navigation retry, and no Human wait.
    - >
      Treat the Shopee search-result surface and individual result cards as distinct DOM concepts.
      `.shopee-search-item-result` may identify/bound the search-result surface but must not itself
      be iterated as an individual product card root. Individual primary-card extraction must use
      item-level roots only and preserve first-seen DOM order.
    - >
      Product-anchor fallback must be scoped beneath an explicit detected search-result surface.
      The fallback must never call a document-global product-anchor query equivalent to
      `document.querySelectorAll('a[href*="-i."], a[href*="/product/"]')`. Canonical `-i.` and
      `/product/` product URL forms remain supported, but anchors elsewhere in document body,
      header/footer, recommendations, advertising modules, carousels, or other non-search-result
      regions are ineligible for Shopee discovery.
    - >
      If a page contains unrelated global product anchors but the bounded search-result surface has
      not yet produced valid item-level cards or scoped fallback anchors, and no explicit block or
      true-empty state exists, the extraction sample must remain unready (`items` empty) so existing
      bounded readiness polling continues. Unrelated anchors must never be sufficient to terminate
      readiness.
    - >
      Scoped fallback must retain TASK-151 requirements: require a usable canonical product href and
      bounded title source from the anchor or its nearest single-product card context; preserve
      exact first-seen order; deduplicate by exact href; do not fabricate title, identity, price,
      sold count, rating, review count, shop data, or any missing marketplace fact.
    - >
      Preserve explicit CAPTCHA/block and true-empty detection on every readiness sample. A block
      still raises DiscoveryBlockedError immediately; a genuine true-empty search still returns the
      existing TRUE_EMPTY_SEARCH semantics; bounded unknown/unready exhaustion still raises
      DiscoveryNavigationError. Never reinterpret unrelated anchors as true search results or as
      true-empty evidence.
    - >
      Preserve Python card mapping, null handling, candidate identity, deduplication, max_candidates,
      pagination, diagnostics, borrowed-resource ownership, and cleanup semantics except for the
      minimum extraction/readiness changes required by this task.
    - >
      Do not inspect query tokens, candidate titles, score magnitude, DecisionBand, price, sales,
      rating, confidence, business rank, or retrieval results to decide whether a discovered card is
      eligible. Eligibility here is DOM search-surface provenance only; business ranking remains
      downstream TASK-146/M2 authority.
    - >
      Add deterministic offline regression proving the specific timing contamination shape: an
      initial sample representing a page where only unrelated/non-search product links are available
      must not terminate readiness; a later sample representing hydrated in-surface mouse result
      cards must succeed within the same single navigation/page acquisition. The test must prove
      multiple extraction samples but exactly one navigation and zero real sleep/network.
    - >
      Add deterministic source/contract assertions for SHOPEE_CARD_EXTRACTION_SCRIPT proving:
      (1) `.shopee-search-item-result` is used only as/beneath a search-surface boundary rather than
      an individual card selector; (2) fallback product anchors are queried from the bounded search
      surface, not from `document`; (3) both `-i.` and `/product/` canonical forms remain supported;
      and (4) existing title fallbacks such as img alt / aria-label remain available.
    - >
      Preserve and run all existing TASK-151/TASK-153 regressions for delayed hydration, delayed
      block/empty, bounded exhaustion, mapping/null safety, dedupe, pagination, malformed cards,
      one-navigation behavior and source assertions. No skip/xfail/retry behavior may be added.
    - >
      Update docs/PHASE_6_M2_DISCOVERY.md to clarify that product-anchor fallback is bounded to the
      Shopee search-result surface and unrelated product modules are not discovery candidates; keep
      ranking explicitly downstream and separate from DOM eligibility.
    - >
      Update both product roadmaps consistently: TASK-166 is CLOSED/published; one external READY
      bundle was operationally successful but Human-rejected because query `chuột không dây` mapped
      to an unrelated lantern listing; TASK-167 is the CURRENT narrow Shopee discovery blocker;
      fresh P6.1b successor remains NEXT only after TASK-167 Runtime PASS + semantic PASS +
      publication and a new Human-reviewed READY external capture bundle; P6.2 remains blocked.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      TASK-167 changes only the existing ShopeeDiscoveryAdapter authority, its focused tests and
      bounded discovery/roadmap documentation; no second discovery, relevance, ranking, browser,
      capture, persistence, or truth authority is introduced.
  - id: AC2
    condition: >
      The broad Shopee search-result surface is no longer treated as an individual product card;
      individual primary extraction remains item-level and first-seen ordered.
  - id: AC3
    condition: >
      Canonical product-anchor fallback is bounded beneath the detected search-result surface and
      document-global unrelated product anchors cannot be emitted as discovery candidates.
  - id: AC4
    condition: >
      Unrelated/non-search product anchors cannot terminate readiness; if genuine search-result
      cards hydrate later within the fixed TASK-151 bound, discovery succeeds from those cards using
      exactly one navigation and one page/session acquisition.
  - id: AC5
    condition: >
      CAPTCHA/block, true-empty, unknown-exhaustion, query, pagination, candidate identity, mapping,
      dedupe, max-candidate, browser ownership and cleanup semantics remain unchanged.
  - id: AC6
    condition: >
      No query/title relevance, lexical filtering, business-score inspection, CandidateRanker,
      WinningProductScorer, orchestration, TASK-166 live-capture, or P6.1a evaluator behavior changes.
  - id: AC7
    condition: >
      Focused offline tests prove the unrelated-anchor-before-search-hydration regression, scoped
      fallback source contract, exact one navigation, zero real sleep/network, and preservation of
      all prior TASK-151/TASK-153 discovery regressions with no skips.
  - id: AC8
    condition: >
      Discovery documentation states search-surface provenance eligibility separately from
      downstream business ranking and does not claim semantic/query relevance filtering.
  - id: AC9
    condition: >
      Roadmaps record TASK-166 CLOSED, the Human-rejected first external READY bundle as operational
      evidence only, TASK-167 as the current blocker, P6.1b still blocked pending a new reviewed
      bundle, and P6.2 still blocked pending reviewed P6.1b metrics.
  - id: AC10
    condition: >
      Required offline verification and git diff check pass with zero unresolved items and no
      changes outside TASK-167 modification scope.

