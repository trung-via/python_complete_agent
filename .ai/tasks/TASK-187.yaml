task_id: TASK-187
revision: 1

goal: >
  Harden the existing ShopeeDiscoveryAdapter current live search-result DOM recognition boundary
  after TASK-186/RUN-186-003 proved that a Human-visible authenticated Shopee search page can
  render product results normally while the adapter still reports no cards and no true-empty
  marker. Preserve ShopeeDiscoveryAdapter as the sole Shopee discovery authority; add no second
  discovery, browser, ranking, relevance, retry, persistence, approval, or product-truth owner.

problem: >
  TASK-186 is a benchmark/integration task with zero production-Python scope. RUN-186-001 failed
  before capture because the Human-owned CAPTCHA prerequisite was unresolved. RUN-186-002 then
  failed before valid discovery because a Windows subprocess argv boundary corrupted the exact
  Vietnamese query. REPAIR-186-002 removed that transport defect, but RUN-186-003 still failed on
  the first required query with the canonical diagnostic that page 1 yielded no cards and no
  true-empty marker. The Human then confirmed that the exact authenticated Shopee session displayed
  normal product search results, and also observed a previous TASK-186 attempt visibly rendering
  results for the exact query `chuột không dây`. This establishes a current live DOM/readiness
  compatibility defect inside the existing ShopeeDiscoveryAdapter boundary rather than a benchmark,
  CAPTCHA, ranking, or Product Intelligence evidence-policy defect. TASK-151 already owns bounded
  readiness and product-anchor fallback; TASK-153 owns null-safe mapping; TASK-167 owns search-result
  surface provenance scoping; TASK-185 owns sold-evidence provenance. TASK-187 must harden that same
  authority without reopening any second owner or reverting TASK-167 safety.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-187 authoring is
    d47e80be3227fa0e0c56d2cc96708d8221d3822c, containing TASK-186 revision 1. TASK-186 remains
    BLOCKED / UNPUBLISHED with latest canonical failure RUN-186-003 and no source candidate.
  - >
    The authoritative downstream AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@e72135cd5c5a1dec0d8374d9bb8994da5e458feb.
  - >
    ShopeeDiscoveryAdapter and SHOPEE_CARD_EXTRACTION_SCRIPT remain the sole Shopee search-card
    discovery and DOM extraction authority. TASK-151 readiness, TASK-153 null-safe mapping,
    TASK-167 search-surface provenance, and TASK-185 sold-evidence provenance remain authoritative.
  - >
    The current blocker is not query-title relevance or business ranking. Human inspection proves
    that visible Shopee result cards can exist while the adapter still sees no eligible cards.

scope:
  inspect:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/PHASE_6_M2_DISCOVERY.md
    - docs/PHASE_7_P7_0_WINNING_PRODUCT_EVIDENCE_QUALITY.md
    - docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md
    - docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md
    - .ai/tasks/TASK-151.yaml
    - .ai/tasks/TASK-153.yaml
    - .ai/tasks/TASK-167.yaml
    - .ai/tasks/TASK-185.yaml
    - .ai/tasks/TASK-186.yaml
    - src/product_intelligence/adapters/shopee.py
    - src/product_intelligence/adapters/shopee_parsing.py
    - src/product_intelligence/discovery.py
    - tests/product_intelligence/test_shopee_discovery.py

  modify:
    - src/product_intelligence/adapters/shopee.py
    - tests/product_intelligence/test_shopee_discovery.py
    - docs/PHASE_6_M2_DISCOVERY.md
    - docs/PHASE_7_P7_0_WINNING_PRODUCT_EVIDENCE_QUALITY.md
    - docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md
    - docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md

non_goals:
  - Modify TASK-186, its blocked candidate state, failure/repair lineage, benchmark methodology,
    query list, fixture paths, evaluator semantics, or publication state.
  - Add a second Shopee adapter, raw HTTP/API scraper, document-global product-anchor fallback,
    alternate marketplace route, alternate query, browser restart, retry/reroute loop, CAPTCHA
    automation, login automation, proxy/stealth logic, or second discovery authority.
  - Add query-title lexical relevance, semantic relevance, LLM filtering, CandidateRanker changes,
    WinningProductScorer changes, score thresholds, winner selection, approval, persistence, or
    product-truth inference.
  - Weaken TASK-167 by allowing recommendation, advertisement, carousel, header/footer, or unrelated
    global product links outside the actual search-result region to become candidates.
  - Change TASK-185 sold-evidence selectors/parsing semantics except where a structural selector move
    is strictly required to keep the same sold-specific provenance inside a newly recognized card root.
  - Add live marketplace work to ordinary Runtime verification. Verification remains offline and deterministic.

constraints:
  hard:
    - >
      Keep ShopeeDiscoveryAdapter and SHOPEE_CARD_EXTRACTION_SCRIPT as the only Shopee discovery/
      extraction path. No duplicate mapper, parser, browser route, or search-state authority.
    - >
      Preserve TASK-151 bounded same-page readiness: one page/session acquisition, exactly one
      navigation per requested page, at most 10 readiness samples at 0.5 seconds each, immediate
      terminal handling for explicit block, explicit true-empty, or extracted items, and fail-closed
      DiscoveryNavigationError on bounded unknown/unready exhaustion.
    - >
      Preserve TASK-167 provenance safety: eligibility must still come from the actual Shopee
      search-result region. Do not restore a document-global product-anchor query and do not treat
      unrelated product modules as readiness success.
    - >
      Harden current DOM recognition using the narrowest structural approach supported by source and
      bounded implementation-time observation. The implementation may add current search-surface or
      item-card structural selectors, bounded descendant recognition, or equivalent provenance-safe
      logic, but must retain a clear distinction between the broad result surface and individual cards.
    - >
      Implementation may perform one bounded Human-session structural diagnosis against the exact
      query `bình giữ nhiệt inox` solely to identify current search-surface/card structure. Diagnosis
      must be read-only, must not mutate repository evidence, must not solve or bypass challenges,
      and must not become Runtime verification. Do not store raw HTML, cookies, headers, screenshots,
      browser profiles, network traces, local absolute paths, or marketplace payload dumps in git.
    - >
      A recognized current item card must still require a canonical Shopee product href using existing
      supported product URL forms and a bounded title source. Missing optional marketplace scalars remain
      None; do not fabricate marketplace facts.
    - >
      Preserve TASK-153 null-safe card mapping, candidate identity, deduplication, max_candidates,
      pagination, diagnostics, borrowed browser ownership, cleanup, block/CAPTCHA, and true-empty semantics.
    - >
      Preserve TASK-185 sold provenance: only sold-specific DOM evidence may populate sold_count;
      generic typography/layout text remains ineligible.
    - >
      Add deterministic offline regression fixtures/tests representing the current-DOM failure shape:
      visible in-surface product cards under a current structural variant must be extracted successfully
      within the existing readiness loop, while unrelated/global product anchors remain ineligible.
    - >
      Add regression proving current-DOM recognition does not cause a return of the TASK-167 lantern/
      unrelated-anchor class: an unrelated product link outside the search-result region cannot terminate
      readiness or become a candidate, even when current valid result cards appear later.
    - >
      Add source/contract assertions proving no document-global product-anchor fallback is reintroduced,
      canonical product URL forms remain supported, and the broad search-result surface is not emitted as
      a single product card.
    - >
      Update discovery documentation and both product roadmaps consistently: TASK-186 remains BLOCKED /
      UNPUBLISHED due current Shopee live DOM compatibility; TASK-187 is the narrow prerequisite hardening;
      a fresh P7.1 successor is NEXT only after TASK-187 Runtime PASS, semantic PASS, and source-only publication.
      Preserve all existing P6 closure/deferred states and TASK-181/TASK-182/TASK-185 authority/history.
    - Do not push, merge, publish, or mutate main from Executor execution.

acceptance:
  - id: AC1
    condition: >
      Only the six authorized paths change; no second discovery, browser, relevance, ranking,
      persistence, approval, or truth authority is introduced.
  - id: AC2
    condition: >
      Current Human-visible Shopee search-result DOM variants can yield valid item-level candidates
      through the existing ShopeeDiscoveryAdapter while preserving exactly one navigation and the fixed
      TASK-151 readiness bound.
  - id: AC3
    condition: >
      TASK-167 provenance remains intact: document-global unrelated product anchors cannot terminate
      readiness or become candidates, and the broad search-result surface is never emitted as one item.
  - id: AC4
    condition: >
      TASK-153 null-safe mapping and TASK-185 sold-specific provenance remain unchanged in authority and behavior.
  - id: AC5
    condition: >
      Block/CAPTCHA, true-empty, unknown-exhaustion, query, pagination, identity, dedupe, browser ownership,
      cleanup, max-candidate, and error-class semantics remain unchanged except for the minimum current-DOM
      recognition hardening.
  - id: AC6
    condition: >
      Offline regressions prove the current-DOM extraction success case, preservation of bounded readiness,
      exclusion of unrelated/global product links, no document-global fallback, and all prior TASK-151/
      TASK-153/TASK-167/TASK-185 Shopee discovery behaviors remain green with no live network or real sleep.
  - id: AC7
    condition: >
      Documentation records TASK-186 BLOCKED / UNPUBLISHED, TASK-187 as the narrow prerequisite, and requires
      a fresh P7.1 successor after TASK-187 publication rather than continuing or rehabilitating TASK-186.
  - id: AC8
    condition: >
      Required verification and git diff --check pass with zero unresolved items and changed-files truth
      remains within the six authorized paths.

verification:
  required:
    - '$env:PYTHONPATH = ".;src"; python -m pytest tests/product_intelligence/test_shopee_discovery.py tests/product_intelligence/test_orchestration.py tests/product_intelligence/test_ranking.py tests/product_intelligence/test_live_capture.py tests/product_intelligence/test_product_intelligence_cli.py tests/integration/test_browser_cdp.py -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - '$env:PYTHONPATH = ".;src"; python -m pytest tests/product_intelligence/test_shopee_parsing.py tests/product_intelligence/test_winning_product_quality_evaluation.py -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - 'git diff --check; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
