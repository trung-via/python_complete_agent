task_id: TASK-172
revision: 1

goal: >
  Open P6.3b with one narrow Shopee source-evidence hardening that preserves explicit,
  complete selected-variant state from the already-navigated current product page into
  existing ProductFact evidence, so the already-published TASK-108 resolver can decide
  EXACT_VARIANT_MATCH when its existing rules are actually satisfied. TASK-172 must not
  change ProductSourcePack schema, TASK-108 relationship semantics, TASK-171 truth
  semantics, browser/session ownership, Human variant selection, or any downstream
  identity/catalog/retrieval authority.

problem: >
  Published TASK-171 closed the P6.3a descriptive truth contract but current accepted
  real-evidence fixtures do not contain a live multi-member exact-variant corpus. TASK-108
  proves exact sellable-variant sameness only when a family-strength match is accompanied
  by non-empty equal observed variant evidence. Current Shopee observations commonly retain
  the same platform-scoped listing identity while facts are empty and variant media describe
  the listing option catalogue rather than the currently selected sellable option; TASK-108
  therefore correctly returns SAME_PRODUCT_FAMILY with insufficient variant evidence.
  Building truth persistence, fact reconciliation, or downstream truth consumption before
  closing this acquisition evidence gap would create architecture ahead of evidence. The
  existing ShopeeSourceExtractor is already the sole product-page DOM/source authority and
  ProductFact already provides a persisted evidence carrier. TASK-172 must extend only that
  existing boundary with fail-closed selected-variant evidence.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-172 authoring is
    3a33748905154b4822cfc164999e5c57780e67f2, the published TASK-171 source candidate
    after RUN-171-001 Runtime PASS and REVIEW-171-001 PRIMARY PASS.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@32ace104c5cfaa1b7affbaa40157872b1f85147f.
  - >
    TASK-162 preserves ShopeeSourceExtractor as the sole Shopee product-page source
    extraction/DOM authority. TASK-125/Product Source Pack serialization remains the sole
    persisted ProductSourcePack codec authority. TASK-108 remains the sole pairwise
    relationship authority and its existing EXACT_VARIANT_MATCH/SAME_PRODUCT_FAMILY rules
    must remain byte-for-byte semantically unchanged.
  - >
    TASK-171 remains the sole descriptive product-truth reconciliation authority. It consumes
    only an existing CanonicalVariantProfile and must not be modified by TASK-172.
  - >
    Human/login/CAPTCHA ownership remains outside repository code. TASK-172 does not click,
    choose, or mutate marketplace variation controls; it observes only explicit selected
    state already rendered on the current product page.
  - >
    URL query values such as rModelId, vModelId, display_model_id, recommendation state, or
    other marketplace query parameters are not yet repository-proven selected-variant truth
    and must not be promoted into variant evidence by TASK-172.

