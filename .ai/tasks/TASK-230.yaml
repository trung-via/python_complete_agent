task_id: TASK-230
revision: 1

goal: >
  Implement one bounded P8 Wave-0 TikTok Shop PDP identity-compatibility correction for
  the exact Human-selected pilot path, and consolidate TikTok product-ID parsing so one
  canonical deterministic parser authority is consumed by both Product Intelligence
  discovery/candidate identity and Product Source extraction. Add support for the selected
  /vn/pdp/<slug>/<id> listing form without acquiring live marketplace evidence, changing
  extraction semantics, depending on TikTok Affiliate access, or authorizing any later
  acquisition/test/action automatically.

problem: >
  TASK-228 documented an exact-listing compatibility blocker: the selected TikTok Shop
  Vietnam stable listing
  https://shop.tiktok.com/vn/pdp/den-led-cam-bien-chuyen-dong-3-che-do-sang-sac-usb-c/1731381331718341815
  cannot currently be bound by the production TikTok ID parsers. TASK-229 later authorized
  a Human-only manual Wave-1 contribution path but acquired no evidence and left Wave 0
  unauthorized. The Human has now selected the bounded Wave-0 compatibility path before
  any automated public-PDP acquisition. Current code also contains two implementations of
  TikTok product-ID extraction: the established pure helper
  src/product_intelligence/adapters/tiktok_parsing.py::extract_tiktok_product_id and a
  private duplicate in src/product_source/platforms/tiktok.py. The correction must close
  the selected /vn/pdp identity gap and restore ONE_CAPABILITY_ONE_AUTHORITY for TikTok
  source-product ID parsing without expanding collection or semantic authority.

assumptions:
  - Canonical main at authoring is fb80022d8c977eb78b5c9e338b42820f1d23c315.
  - TASK-229 / P8.3 is DONE only as MANUAL_WAVE_1_EVIDENCE_CONTRIBUTION_AUTHORIZATION_ONLY; contribution_status and review_status remain unperformed; live_evidence_acquired is false; real_pilot_executed is false.
  - Human has now explicitly selected bounded Wave-0 PDP identity compatibility and parser-authority consolidation as the next engineering commitment.
  - The exact pilot remains context_id p8-pilot-001-led-motion-tiktok-vn, source ID 1731381331718341815, stable listing reference https://shop.tiktok.com/vn/pdp/den-led-cam-bien-chuyen-dong-3-che-do-sang-sac-usb-c/1731381331718341815.
  - Source identity remains not canonical product identity.
  - Public TikTok Shop PDP product/source evidence and authenticated Affiliate economics are distinct evidence surfaces. This task must not make public Product Intelligence depend on Affiliate eligibility or account access.
  - Product Intelligence remains the canonical owner of ProductCandidateSnapshot, SignalEvidence, product/source identity semantics, discovery, ranking/scoring, approval, catalog/persistence and product truth. Product Source Pack remains source evidence under that domain boundary.
  - The existing pure extract_tiktok_product_id helper is the canonical TikTok source-product ID parser authority for this task; no second parser authority may remain in Product Source extraction.
  - Existing /product/<id>, /item/<id>, supported query-key, and direct item-id attribute behavior must remain compatible.
  - No live TikTok browsing, scraping, API/CDP/browser execution, evidence acquisition, manual evidence freeze, P7.4/P7.5 construction, market test, spend, publication or commerce action is authorized by this task.
  - Current downstream AIOS pin and conformance remain edd7d8d92d54900c56442bbfcddb8648ec4d2e09 / TASK-207 revision 8.
  - Codex remains the Human-selected default Executor.

