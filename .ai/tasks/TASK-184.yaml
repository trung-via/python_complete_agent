      rebuild predecessor, older, alternate-source, incomplete, or unverifiable runtimes to
      exact target without creating a second runtime authority.
  - id: AC3
    condition: >
      Existing CONTINUE, STATUS, RUN, FIX, and REPAIR worker behavior remains structurally
      unchanged: one pinned kernel invocation, exact selector validation, surface-bound
