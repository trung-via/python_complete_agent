task_id: TASK-098
revision: 2

goal: >
  Add the pure deterministic TikTok discovery parsing and identity core needed
  for Phase 6 M2.2, as a bounded first production task executed through the
  Antigravity AIOS-renew path.

problem: >
  Product Intelligence already has Shopee parsing/identity primitives and TikTok
  deep-ingestion code, but no TikTok discovery parsing core. The first real
  Antigravity run should advance the product while remaining narrow enough to
  certify the migrated /aios-worker -> AIOS-renew -> Antigravity path without
  conflating executor parity with a broad browser-adapter implementation.

assumptions:
  - ProductCandidateSnapshot and the existing ProductDiscoveryAdapter contract
    remain unchanged.
  - Existing TikTok deep-ingestion code may be inspected only for stable product
    URL identity patterns.
  - The follow-up browser-backed TikTokDiscoveryAdapter will consume the pure
    helpers created here; browser navigation/extraction is deliberately deferred.
  - Missing or malformed discovery-card scalars must remain None, never zero.

scope:
  inspect:
    - src/product_intelligence/adapters/shopee_parsing.py
    - src/product_intelligence/models.py
    - src/product_source/platforms/tiktok.py
    - src/tools/tiktok_scrape_tool.py
    - tests/product_intelligence/test_shopee_parsing.py
    - docs/PHASE_6_M2_DISCOVERY.md
    - docs/PHASE_6_M2_PRODUCT_INTELLIGENCE.md
  modify:
    - src/product_intelligence/adapters/tiktok_parsing.py
    - src/product_intelligence/__init__.py
    - tests/product_intelligence/test_tiktok_parsing.py
    - docs/PHASE_6_M2_TIKTOK_DISCOVERY.md

non_goals:
  - Implement TikTokDiscoveryAdapter or any browser/page navigation in this task.
  - Modify Shopee discovery/parsing behavior.
  - Modify discovery.py, scoring, ranking, approval, or M1 queue semantics.
  - Invoke TikTokSourceExtractor, TikTokScrapeTool, downloader, Google Drive,
    AgentController, an LLM, or any network/browser operation.
  - Download images/video or perform deep ingestion.
  - Modify AIOS-renew or worker-surface integration.

constraints:
  hard:
    - All new helpers must be pure and deterministic with zero filesystem,
      network, browser, queue, Drive, LLM, scorer, ranker, or wall-clock side effects.
    - Product-ID extraction must support the stable URL forms already recognized
      by the TikTok product-source boundary: /product/<id>, /item/<id>, and
      itemId=<id> when present.
    - Candidate identity must prefer a stable TikTok product ID when available;
      otherwise it must use a deterministic cryptographic fingerprint of a
      normalized URL. Python process-randomized hash() is forbidden.
    - URL normalization used for identity must be deterministic, must preserve
      the product resource identity, and must not retain URL fragments.
    - Search/listing URL construction for the same query/page/locale inputs must
      be deterministic and URL-encode the query. Invalid empty query or invalid
      page values must fail explicitly rather than generating a malformed URL.
    - Price parsing must accept common decimal/thousands separators and common
      k/K multiplier notation when unambiguous; malformed, zero, negative, or
      non-numeric prices return None.
    - Sold/review count parsing must support plain positive integers and common
      k/K multiplier notation; malformed, zero, negative, or non-numeric counts
      return None.
    - Rating parsing must return a float only inside [0.0, 5.0]; malformed or
      out-of-range values return None.
    - Discount parsing must return a float only inside [0.0, 100.0]; malformed or
      out-of-range values return None.
    - Parsing must never fabricate unavailable market facts or convert missing
      values to zero.
    - Public Product Intelligence exports may expose only the TikTok parsing
      helpers intentionally documented as public; no second discovery/scoring
      authority may be introduced.
    - Existing Product Intelligence behavior and tests must remain unchanged.

acceptance:
  - id: AC1
    condition: >
      TikTok product ID extraction deterministically handles /product/<id>,
      /item/<id>, itemId=<id>, and missing-ID cases.
  - id: AC2
    condition: >
      TikTok candidate IDs are stable across runs, prefer stable product IDs, and
      use a cryptographic normalized-URL fallback without Python hash().
  - id: AC3
    condition: >
      Deterministic TikTok search/listing URL construction URL-encodes the query,
      handles bounded positive page input, and rejects invalid inputs.
  - id: AC4
    condition: >
      Price, sold count, review count, rating, and discount parsers handle common
      valid listing forms while malformed/out-of-range/missing data returns None.
  - id: AC5
    condition: >
      Tests prove the parsing module has zero browser/network/filesystem/queue/
      Drive/LLM/scoring/ranking/approval side effects and does not invoke existing
      TikTok deep-ingestion components.
  - id: AC6
    condition: >
      Public exports expose the documented TikTok parsing/identity helpers without
      changing Shopee or existing Product Intelligence behavior.
  - id: AC7
    condition: >
      Documentation defines the parsing/identity contract and explicitly states
      that browser-backed TikTok discovery is the next bounded adapter step.
  - id: AC8
    condition: >
      Regression tests cover supported product IDs, normalized-URL fallback,
      deterministic search URL, localized scalar parsing, invalid boundaries,
      missing-value semantics, and preservation of the existing suite.

verification:
  required:
    - '$env:PYTHONPATH = ".;src"; pytest tests/product_intelligence -q'
    - git diff --check
    - git status --porcelain
