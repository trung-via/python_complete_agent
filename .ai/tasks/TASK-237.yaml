  HUMAN_BRAIN_FRESH_ONE_SHOT_PUBLIC_PDP_DOM_DIAGNOSTIC_AUTHORIZATION. The Human has explicitly
  chosen to continue. The unique next commitment is therefore to authorize one new bounded live
  diagnostic invocation of the already-published hardened carrier; it is not an extractor repair,
  second PDP capture, or automated retry.

