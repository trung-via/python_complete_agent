  PDP DOM diagnostic published by TASK-236, against the same exact selected listing, without
  changing production code or performing the live diagnostic during engineering. Preserve the
  consumed TASK-235 diagnostic attempt and all TASK-236 hardening/history exactly, and hand
  execution to the Human operator only after exact reviewed TASK-237 publication.

problem: >
  TASK-236 is published exactly at a53510ff353cdf926a76f1dc84363b7835c5cb4d. It reconciles the
  prior TASK-235 live diagnostic attempt as executed, FAIL_CLOSED, artifact not created,
  remaining attempt zero, and live_dom_diagnostic_authority NONE. It also hardens bounded root
  discovery and safe failure observability while leaving selector repair and acquisition
