task_id: TASK-171
revision: 1

goal: >
  Open P6.3a with one pure deterministic Human-governed descriptive product-truth
  reconciliation authority over an exact TASK-121 CanonicalVariantProfile. The new
  authority must preserve every source value and canonical observation lineage,
  automatically resolve only uncontested exact descriptive evidence, require an explicit
  Human decision to select among genuinely conflicting exact values, and otherwise leave
  the field unresolved. It must remain a derivative projection only: no evidence mutation,
  identity/catalog mutation, persistence, retrieval/RAG consumption, ranking, model work,
  or live-product certification is introduced by TASK-171.

problem: >
  Published TASK-169 showed raw TASK-122 stress recall 1/6, while published TASK-170
  measured the actual production planning composition TASK-134 -> TASK-122 on the same
  six Human intents and recovered 12 TP, 0 FP, 0 FN with micro precision/recall 1/1.
  Current evidence therefore does not justify introducing a new semantic/vector retrieval
  authority, so P6.2 should be PARKED while remaining reopenable if later evidence changes.
  The next explicit roadmap capability gap is P6.3 product-truth reconciliation. TASK-121
  intentionally preserves conflicting title/shop/brand/model/description evidence and owns
  no preferred-truth semantics. TASK-171 must introduce the smallest safe first authority:
  exact descriptive-field reconciliation from one existing CanonicalVariantProfile, with
  automatic resolution only when evidence is uncontested and explicit Human governance for
  genuine conflicts.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-171 authoring is
    0781e0810d161ad1a4936c0e3ea31aada5704da1, the published TASK-170 source
    candidate after RUN-170-001 Runtime PASS and REVIEW-170-001 PRIMARY PASS.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@32ace104c5cfaa1b7affbaa40157872b1f85147f.
  - >
    P6.1a-d are now empirically complete: TASK-168/P6.1b, TASK-169/P6.1c, and
    TASK-170/P6.1d are CLOSED/PUBLISHED. P6.2 is conditional and, on current evidence,
    must be recorded as PARKED / NOT JUSTIFIED BY CURRENT EVIDENCE rather than implemented
    speculatively. Parking P6.2 is not a claim that semantic retrieval can never be useful.
  - >
    TASK-121 remains the sole CanonicalVariantProfile evidence-preserving projection
    authority. TASK-117/TASK-118 remain canonical variant/catalog identity authorities;
    TASK-120 remains SQLite durability; TASK-122 remains lexical retrieval; TASK-134 remains
    query planning; TASK-123 remains RAG-context authority; TASK-129/TASK-133/TASK-135 remain
    grounded-answer/application composition authorities.
  - >
    Current published P6.1 real-evidence fixtures do not establish a live multi-member exact
    variant conflict corpus. TASK-171 is therefore a production contract/foundation task with
    deterministic offline regressions; it must not claim live product-truth certification or
    reinterpret TASK-168 singleton benchmark variants as multi-observation truth evidence.
  - >
    Human governance means the caller supplies explicit field decisions, actor identity, and
    timezone-aware decision timestamps. Repository code must not read the system clock or infer
    Human preference from recency, majority, provenance, marketplace, ranking, retrieval,
    provider/model output, or business signals.

