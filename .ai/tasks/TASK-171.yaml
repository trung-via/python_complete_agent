non_goals:
  - Modify canonical_profile.py, canonical_catalog.py, canonical_variant.py,
    canonical_retrieval.py, grounded_query_planning.py, persistent_grounded_qa.py,
    ProductSourcePack models/serialization, entity resolution, family/variant
    approval/admission, SQLite storage, RAG, grounded-QA, provider, discovery, ranking,
    scraper, browser, CLI, worker, dependency, or AIOS runtime semantics.
  - Reconcile ProductFact values, media, hero images, seller preference, price, sold count,
    rating, commission, marketplace ranking, source reliability, diagnostics, or any field
    outside title, shop_name, brand, model_sku, and description_text.
  - Add automatic latest-observation, majority-vote, provenance/platform preference,
    confidence/business/retrieval score, fuzzy/normalized/case-folded/trimmed equivalence,
    synthesized replacement truth, LLM/model inference, or heuristic winner selection.
  - Add persistence, truth-history tables/files, mutable truth update APIs, catalog columns,
    migrations, cache, background service, API/CLI workflow, autonomous approval, or
    Human-review automation.
  - Feed reconciled truth into TASK-122 retrieval, TASK-123 RAG context, TASK-134 planning,
    grounded prompts/answers, ranking, content generation, or any downstream production path.
  - Activate P6.2 semantic/vector retrieval, embeddings, vector indexes, ANN, semantic
    reranking, or claim that P6.2 is permanently unnecessary.
  - Claim that TASK-171 certifies live multi-observation product truth, changes canonical
    family/variant identity, rewrites source evidence, or establishes objective real-world
    truth beyond the exact bounded Human-governed derivative projection returned here.
  - Open P6.4 identity evolution, P6.5 higher-level review automation, or P6.6 serving/cache.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Add exactly one new production module src/product_intelligence/canonical_truth.py as
      the sole TASK-171 descriptive truth authority. Export exactly these new public names
      from product_intelligence: CanonicalTruthError, CanonicalTruthField,
      CanonicalTruthDecisionAction, CanonicalTruthDecision,
      CanonicalTruthResolutionStatus, CanonicalTruthEvidenceOption,
      CanonicalTruthFieldResolution, CanonicalVariantTruth, and
      reconcile_canonical_variant_truth. Do not add generic truth registries, policy
      objects, persistence APIs, resolver services, or arbitrary-field APIs.
    - >
      CanonicalTruthField must contain exactly TITLE, SHOP_NAME, BRAND, MODEL_SKU, and
      DESCRIPTION_TEXT in that declaration order, mapped only to the corresponding exact
      TASK-121 CanonicalProfileObservation values. Facts and media remain outside TASK-171.
    - >
      reconcile_canonical_variant_truth(profile, *, decisions=()) must require an exact
      CanonicalVariantProfile and consume only that profile plus caller-supplied exact
      CanonicalTruthDecision values. It must not accept Catalog state, ProductSourcePack,
      raw dictionaries, candidate/ranking values, arbitrary replacement strings, or any
      alternate truth input.
    - >
      For each CanonicalTruthField, derive deterministic exact-value options from
      profile.observations in canonical observation order. Ignore only Python None as absent
      evidence. Do not strip, normalize, case-fold, accent-fold, canonicalize, parse,
      synthesize, or reinterpret strings. Distinctness is exact Python string equality.
      Repeated identical exact values collapse to one CanonicalTruthEvidenceOption whose
      supporting_members tuple contains every exact canonical member carrying that value,
      in profile observation/member order.
    - >
      CanonicalTruthEvidenceOption must be immutable and contain exactly the exact non-None
      string value and a non-empty tuple of supporting SourceObservationIdentity members
      reused from the supplied profile. Option order is first appearance of each distinct
      exact value in canonical observation order.
    - >
      Resolution semantics are fixed and exhaustive: zero options yields NO_EVIDENCE with
      resolved_value None, empty supporting_members, and no decision; exactly one option
      yields UNCONTESTED with that exact value and that option's supporting members; more
      than one option is a genuine conflict and yields UNRESOLVED with resolved_value None,
      empty supporting_members, and no decision unless one valid Human decision targets
      that field.
    - >
      CanonicalTruthDecisionAction must contain exactly SELECT_SOURCE and LEAVE_UNRESOLVED.
      CanonicalTruthDecision must be immutable and contain exactly one CanonicalTruthField,
      one action, a nonblank actor string preserved byte-for-byte, a caller-supplied
      timezone-aware datetime, and selected_member: SourceObservationIdentity | None.
      Repository code must generate no actor, timestamp, UUID, random value, default
      decision, or environment-derived decision metadata.
    - >
      SELECT_SOURCE is valid only for a genuinely conflicting field and requires a
      selected_member equal to one canonical profile member whose exact field value is
      non-None and belongs to one conflict option. HUMAN_SELECTED must resolve to that exact
      option value and expose all canonical profile members supporting the same exact value,
      not only the selected member. The caller may never supply or synthesize a replacement
      value.
    - >
      LEAVE_UNRESOLVED is valid only for a genuinely conflicting field and requires
      selected_member is None. It preserves UNRESOLVED with no resolved value and empty
      supporting_members while retaining all exact evidence options and the exact explicit
      Human decision record.
    - >
      At most one decision may target a field. Duplicate field decisions, non-exact
      decision values, decisions for NO_EVIDENCE or UNCONTESTED fields, SELECT_SOURCE with
      missing/foreign/None-valued member, LEAVE_UNRESOLVED carrying a member, invalid/blank
      actor, naive timestamp, or any incoherent decision must fail closed with
      CanonicalTruthError before returning CanonicalVariantTruth.
    - >
      CanonicalTruthResolutionStatus must contain exactly NO_EVIDENCE, UNCONTESTED,
      HUMAN_SELECTED, and UNRESOLVED. CanonicalTruthFieldResolution must be immutable and
      retain exactly: field, status, resolved_value, supporting_members, options, and
      decision. CanonicalVariantTruth must be immutable and retain exact profile variant_id,
      family_id, members, and one field resolution for every CanonicalTruthField in enum
      declaration order.
    - >
      Missing Human decisions for genuine conflicts are valid and must leave those fields
      UNRESOLVED. TASK-171 supports partial truth and must never invent a winner or fail only
      because Human review is incomplete.
    - >
      Reconciliation is pure deterministic in-memory computation: zero filesystem, SQLite,
      network, browser, environment, clock, random, UUID, subprocess, model, retrieval,
      query planning, RAG, ranking, persistence, or mutation work. It must never mutate the
      supplied CanonicalVariantProfile, observations, canonical members, facts, media, or
      any retained evidence object.
    - >
      TASK-121 evidence preservation remains authoritative and unchanged. TASK-171 truth is
      a separate derivative Human-governed projection. It does not erase, rewrite, normalize,
      collapse, or supersede source evidence and does not modify TASK-117/TASK-118 canonical
      identity/catalog semantics.
    - >
      Focused tests may construct deterministic in-memory multi-observation profiles to
      exercise conflict behavior, but must clearly distinguish contract regression from live
      evidence certification. Do not use TASK-168 singleton benchmark fixtures to claim a
      live multi-member variant truth passage.
    - >
      docs/PHASE_6_P6_1D_PLANNER_ASSISTED_RETRIEVAL_STRESS.md must be updated only for
      lifecycle: TASK-170 is CLOSED/PUBLISHED at candidate
      0781e0810d161ad1a4936c0e3ea31aada5704da1 and P6.1d/P6.1 are CLOSED; preserve its
      measured 12 TP, 0 FP, 0 FN and 1/1 micro precision/recall interpretation unchanged.
    - >
      docs/PHASE_6_P6_3_PRODUCT_TRUTH_RECONCILIATION.md must state that TASK-171 is P6.3a
      descriptive-field foundation only; it uses exact TASK-121 evidence plus explicit
      Human decisions, permits unresolved conflicts, adds no automatic recency/majority/
      provenance policy, has no persistence/downstream consumption, and is not live
      product-truth certification.
    - >
      Update both canonical roadmaps consistently: P6.1 CLOSED/PUBLISHED through TASK-170;
      P6.2 PARKED / NOT JUSTIFIED BY CURRENT EVIDENCE because raw TASK-122 stress weakness
      was fully recovered by the existing production TASK-134 -> TASK-122 composition on
      the measured corpus; P6.2 remains reopenable on new evidence. Mark P6.3 CURRENT with
      TASK-171 as P6.3a foundation and leave P6.4-P6.6 deferred/unimplemented.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      TASK-171 introduces only canonical_truth.py, bounded public exports, focused tests,
      P6.1d lifecycle/P6.3 documentation, and two roadmap updates; no prior production
      authority is modified or duplicated.
  - id: AC2
    condition: >
      Exactly five descriptive fields are supported and exact evidence options derive only
      from TASK-121 observation values, preserving canonical member lineage and first-value
      order with no string normalization or arbitrary replacement truth.
  - id: AC3
    condition: >
      NO_EVIDENCE, UNCONTESTED, HUMAN_SELECTED, and UNRESOLVED follow the fixed deterministic
      rules, including exact supporting-member retention and evidence-option preservation.
  - id: AC4
    condition: >
      Genuine conflicts remain UNRESOLVED without a Human decision; SELECT_SOURCE can choose
      only existing exact source evidence and LEAVE_UNRESOLVED records an explicit Human
      choice without fabricating or preferring truth automatically.
  - id: AC5
    condition: >
      Human decisions preserve exact field/action/actor/aware timestamp/selected member as
      applicable, and duplicate, foreign, malformed, naive-time, wrong-action/member, or
      non-conflict decision shapes fail closed before a truth value is returned.
  - id: AC6
    condition: >
      CanonicalTruthEvidenceOption, CanonicalTruthFieldResolution, and CanonicalVariantTruth
      are immutable, deterministic, retain exact variant/family/member lineage, preserve
      fixed field/option/support order, and repeated reconciliation from value-equal inputs
      returns value-equal output without mutating inputs.
  - id: AC7
    condition: >
      TASK-121 evidence remains fully intact and authoritative; TASK-171 performs zero
      fact/media reconciliation, identity/catalog mutation, persistence, retrieval,
      query-planning, RAG, ranking, provider/model, browser, network, or external work.
  - id: AC8
    condition: >
      Focused offline regressions cover all-None evidence, one value plus missing values,
      repeated identical exact values, exact-string conflicts, missing decision,
      SELECT_SOURCE, LEAVE_UNRESOLVED, duplicate decisions, foreign member, None-valued
      selected member, decision on non-conflict field, actor/timestamp validation, ordering,
      member reuse, partial truth, determinism, and input immutability without claiming live
      multi-member product-truth certification.
  - id: AC9
    condition: >
      P6.3 documentation establishes the new derivative Human-governed descriptive truth
      boundary without implying objective product truth, automatic preference, fact/media
      reconciliation, persistence, downstream consumption, or live certification.
  - id: AC10
    condition: >
      Canonical docs mark TASK-170/P6.1 CLOSED/PUBLISHED, P6.2 PARKED but reopenable from
      future evidence, P6.3 CURRENT with TASK-171 P6.3a, and P6.4-P6.6 deferred; required
      focused tests and git diff check pass with zero unresolved items and no changed files
      outside scope.

