task_id: TASK-252
revision: 1

goal: >
  Canonicalize exactly one fresh Human-operated generation-8 bounded TikTok PDP price-role
  diagnostic authorization for the already-selected exact listing, using only the reviewed and
  published TASK-251 schema-V5 diagnostic implementation. Require a non-consuming preflight that
  proves exact target/browser unambiguity, a fresh external generation-8 job root and content
  equivalence of all seven execution/interpretation-critical files to the exact TASK-251 published
  source. Preserve one-shot attempt consumption, exact V5 bounded/sanitized observation semantics,
  explicit ambiguity interpretation, mandatory post-attempt Human/Brain review and all Product
  Intelligence/evidence/acquisition/action authority boundaries. TASK-252 is authorization-only:
  it changes no production implementation and performs no TikTok/CDP operation during engineering.

problem: >
  TASK-251 / RUN-251-004 / REVIEW-251-003 is exactly reviewed and published at
  0c23b4f0530f17f8bb77e23f8199fc167a6e68b1. It reconciled the consumed post-TASK250 Human
  collector-validation operation and hardened the sole TikTok PDP DOM diagnostic to schema V5 with
  one bounded sanitized price_role_probe. Current price validation remains UNKNOWN/null while
  original_price 68220.0 remains OBSERVED_ONLY; canonical_evidence_ingested is false and
  price_role_resolution_complete is false. Generation 8 intentionally remains unauthorized with
  zero attempts and no live diagnostic authority. The next justified uncertainty-reduction step is
  therefore one bounded live V5 diagnostic observation, not a collector repair. V5 can observe
  candidate population, collector-eligibility, leaf structure, current/original structural signals,
  strike-through, unresolved role, range/multi-number ambiguity, opaque text-equivalence grouping,
  variant proximity and bounded presentation context without persisting raw price values or
  selecting a scalar. However, V5 counts are marginal rather than intersection proofs, samples are
  capped at eight and ordered by bounded DOM observation, and absence from the sample set is not
  evidence of absence when the candidate population exceeds the sample cap. A generation-8
  authorization must therefore freeze both the execution source and the interpretation rules so a
  later SUCCESS cannot be misread as Product Truth, collector defect proof or automatic repair
  authority.

assumptions:
  - Canonical main at authoring is 0c23b4f0530f17f8bb77e23f8199fc167a6e68b1.
  - TASK-251 / RUN-251-004 / REVIEW-251-003 is exact-source published at
    0c23b4f0530f17f8bb77e23f8199fc167a6e68b1.
  - TASK-251 schema-V5 diagnostic artifact contract is filename
    tiktok-pdp-dom-diagnostic-v5.json, schema_version 5, create-exclusive, evidence_authority NONE.
  - Current reconciled field state remains current_price UNKNOWN/null, original_price OBSERVED_ONLY
    at 68220.0, other optional validation fields UNKNOWN/null, canonical_evidence_ingested false,
    price_role_resolution_complete false and selector_repair_complete false.
  - Exact selected context remains p8-pilot-001-led-motion-tiktok-vn, source ID
    "1731381331718341815", and stable listing
    https://shop.tiktok.com/vn/pdp/den-led-cam-bien-chuyen-dong-3-che-do-sang-sac-usb-c/1731381331718341815.
  - Operator-owned CDP endpoint for the later authorized Human execution is
    http://127.0.0.1:9222.
  - src/product_intelligence/tiktok_pdp_dom_diagnostic.py remains the sole bounded TikTok PDP DOM
    diagnostic owner.
  - src/product_intelligence/tiktok_pdp_dom_scope.py remains the sole shared bounded PDP DOM-scope
    resolution owner.
  - TikTokPdpCollector in src/product_intelligence/adapters/tiktok_pdp.py remains the sole exact-PDP
    observation/admission owner and is not invoked by the Gen-8 diagnostic.
  - src/product_intelligence/adapters/tiktok_parsing.py remains the sole scalar-price admission
    authority including AMBIGUOUS_PRICE_IS_NOT_EXACT_PRICE behavior.
  - TASK-137 remains the sole browser/CDP lifecycle and borrowed-session authority.
  - V5 candidate_samples are bounded to at most eight sanitized samples; marginal probe counts do
    not prove that multiple properties belong to the same candidate unless the bounded sample
    itself establishes that conjunction.
  - CAPABILITY_IS_NOT_AUTHORITY, EVIDENCE_IS_NOT_PRODUCT_TRUTH,
    SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY, SNAPSHOT_IS_NOT_TREND,
    AMBIGUOUS_PRICE_IS_NOT_EXACT_PRICE, MEASUREMENT_IS_NOT_AUTHORITY,
    OPERATION_SUCCESS_IS_NOT_FIELD_VALIDATION_SUCCESS and ONE_CAPABILITY_ONE_AUTHORITY remain
    mandatory.
  - TASK-252 authoring, implementation and deterministic verification require no TikTok/CDP access.

