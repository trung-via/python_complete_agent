  - id: AC6
    condition: >
      Human invocation is one physical PowerShell line; pre-carrier shell/parser transport failure
      is non-consuming; every terminal outcome after valid carrier invocation consumes the sole
      attempt; no retry/refresh/resume/second invocation or replacement target is authorized.
  - id: AC7
    condition: >
      Mandatory post-attempt Brain review uses actual terminal/artifact evidence and explicitly
      preserves marginal-count semantics, eight-sample non-exhaustiveness, truncation
      non-exhaustiveness, descriptive-only range/multi-number hints and
      INSUFFICIENT_DIAGNOSTIC_RESOLUTION as a valid non-mutating review disposition; V5 SUCCESS
      never self-authorizes collector/parser/selector repair or Product Truth promotion.
  - id: AC8
    condition: >
      Exactly five authorized paths change; TASK-251 governance assertions are historicalized
      without weakening exact lineage/uncertainty/V5 checks; TASK-252 alone owns current
