      Exact TASK-251 / RUN-251-004 / REVIEW-251-003 publication lineage at
      0c23b4f0530f17f8bb77e23f8199fc167a6e68b1 is recorded as both the schema-V5 implementation
      source and generation-8 execution source, while TASK-251 remains immutable completed history.
  - id: AC2
    condition: >
      Current uncertainty remains unchanged during authorization engineering: current price
      UNKNOWN/null, original_price 68220.0 OBSERVED_ONLY, canonical_evidence_ingested false,
      price_role_resolution_complete false and no prior live evidence is promoted into Product
      Truth or repair authority.
  - id: AC3
    condition: >
      Exact reviewed TASK-252 publication alone grants one fresh Human-owned Gen-8 attempt with
      attempts 1/remaining 1, executed false and
      live_dom_diagnostic_authority ONE_SHOT_ATTACH_ONLY_EXACT_LISTING; all arbitrary/replacement/
      inferred/search/batch/variant/selector/collector/acquisition/market-action authorities remain
      absent.
  - id: AC4
    condition: >
      Published V5 diagnostic/root/sanitization semantics remain frozen with zero production-code
      modification: fixed schema/file, exact-listing attach-only binding, exactly one evaluate,
      TASK-137 cleanup, bounded light-DOM root and price-role observation, evidence_authority NONE
      and no scalar/role admission.
  - id: AC5
    condition: >
      Non-consuming preflight proves CDP reachability, exactly one normal page and exact selected
      PDP, a fresh V1/V2/V3/V4/V5-free external Gen-8 root and seven-file content equivalence to
      exact TASK-251 publication without requiring HEAD equality; changed bound root/browser state
