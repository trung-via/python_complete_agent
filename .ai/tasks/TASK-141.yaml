task_id: TASK-141
revision: 1

goal: >
  Implement post-M4 P3.3 Sellable-Variant Review + Durable Admission as the final
  bounded P3 application-composition boundary over existing M3 authorities. The new
  boundary must let a caller explicitly select members from one existing canonical
  family, obtain one exact TASK-116 sellable-variant proposal as an immutable Human
  review value, record an explicit Human APPROVE or REJECT only through TASK-116, and,
  in a separate explicit call, durably admit only an APPROVE through TASK-117 canonical
  variant admission and TASK-120 SQLite variant registration. TASK-141 must not
  discover or rank variant groups, recreate TASK-115 evidence semantics, validate or
  generate variant IDs independently, duplicate TASK-118 catalog integrity, call
  TASK-119 codec directly, auto-create a catalog, auto-approve, persist REJECT decisions
  independently, or add product-truth/identity-evolution semantics. A real P3 vertical
  regression must prove the published P3.1 -> P3.2 -> P3.3 path; only if the full TASK
  acceptance passes may P3 be documented CLOSED.

problem: >
  TASK-139 and TASK-140 now compose source evidence into explicit family review,
  Human family decision, canonical family admission, and durable family registration.
  Existing TASK-115/TASK-116/TASK-117 already own sellable-variant evidence,
  explicit proposal/Human decision, and canonical variant identity respectively,
  while TASK-118/TASK-119/TASK-120 own catalog integrity, canonical bytes, and SQLite
  durability. The remaining P3 gap is therefore application composition only. The
  Human must be able to inspect the exact TASK-116 proposal before deciding, and the
  later durable path must preserve the exact reviewed proposal/decision lineage
  without creating a second selection, approval, identity, catalog, codec, or
  persistence authority.

assumptions:
  - >
    Canonical Python Agent main immediately before TASK-141 authoring is
    2c158bb3de00036c97c795e32c52c2b2a5177831, the published TASK-140 source
    candidate after REVIEW-140-001 PRIMARY PASS.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@67db82bf19d63f25721d06aabb82d850db8b78d4.
  - >
    docs/POST_M4_P3_HUMAN_GOVERNED_KNOWLEDGE_UPDATE.md and
    docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md are canonical: P3.1 and P3.2 are
    closed, while sellable-variant Human review/decision plus durable admission is the
    immediate remaining P3 boundary.
  - >
    TASK-115 project_sellable_variant_evidence remains the sole sellable-variant
    evidence/diagnostic authority and exactness gaps remain diagnostics only.
  - >
    TASK-116 create_sellable_variant_proposal remains the sole selection eligibility,
    direct-exact evidence, exact-edge closure, singleton validity, proposal, and Human
    variant-decision authority. TASK-141 must delegate to it rather than reproduce
    those rules.
  - >
    TASK-117 create_canonical_sellable_variant remains the sole canonical variant
    admission authority and continues to require one explicit caller-supplied opaque
    variant_id.
  - >
    TASK-118 remains the sole catalog-integrity authority; TASK-119 remains the sole
    canonical catalog byte/rehydration authority; TASK-120
    register_sqlite_canonical_variant remains the sole durable variant-registration
    and SQLite transaction boundary.
  - >
    Family and variant ID allocation, identity evolution/membership extension,
    conflict repair, singleton family canonicalization, product-truth reconciliation,
    automatic approval, preferred/latest/majority selection, and durable REJECT history
    remain deferred.

