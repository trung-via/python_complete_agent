non_goals:
  - Modify .ai/aios-conformance-state.yaml or claim TASK-207 revision-4 certification applies to 49ad4d7.
  - Modify, rerun, repair, review, integrate, publish, or otherwise advance TASK-215 or any RUN-215 lineage inside TASK-218.
  - Modify product semantics, Commerce Opportunity Intelligence source, Product Intelligence source, roadmap milestone meaning, scoring, ranking, evidence, identity, truth, retrieval, persistence, provider, browser, marketplace, or model behavior.
  - Modify Phase-1/Phase-2 workflow implementations, policies, bootstraps, carrier titles, repository identity, runner labels/paths, actor allowlists, review transport, Publisher, Runtime, correction action semantics, or executor selection semantics.
  - Adopt mutable AIOS-renew main, TASK-144 revision-2 authoring state, or any later unreviewed/unpublished source as runtime authority.
  - Reimplement the TASK-145 fix downstream, vendor AIOS source, delete local Runtime state, bypass exact-pin provenance, or create a second lifecycle authority.
  - Create a new conformance semantic authority; TASK-207 remains the sole downstream-conformance authority and must be revised after migration publication.
  - Push, merge, publish, or mutate canonical main from Executor implementation execution.

constraints:
  hard:
    - >
      Change the sole active requirements pin and worker AUTHORITATIVE_COMMIT to exactly
      49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2. Preserve the existing source-plus-commit
      PEP-610 provenance check and fail closed on stale, alternate, floating or unverifiable runtimes.
    - >
      Human-facing Codex and Antigravity worker protocol remains unchanged. No command surface,
      action mapping, executor list, PASS parsing, bootstrap location, repository identity or
      authority boundary may change merely because the pin changes.
    - >
      Existing Phase-1 and Phase-2 repository bindings remain byte-for-byte unchanged. TASK-218
      is a package-pin migration only; capability availability does not activate a new repository binding.
    - >
      Documentation may update exact-pin provenance and record that the adopted source includes
      the TASK-145 revision-2 local/canonical REPAIR semantic-identity reconciliation fix and the
      reviewed TASK-146 verification baseline. It must not claim unfinished TASK-144 revision-2
      or mutable upstream main as adopted runtime authority.
    - >
      .ai/aios-adoption-state.yaml must set downstream_pin to 49ad4d7, record upstream provenance
      TASK-145 revision 2 / RUN-145-002 / REVIEW-145-001 and source-published status, preserve all
      existing binding classifications, and mark full downstream conformance for 49ad4d7 as
      PENDING_FRESH_CERTIFICATION. The prior TASK-207 revision-4 c96 certification must remain
      explicit historical prior-pin evidence rather than being rewritten.
    - >
      .ai/roadmap-state.yaml must preserve P7.3 as the unique product NEXT, preserve TASK-215
      product_done=false, and update the control-plane prerequisite/resume bookmark to the exact
      current correction lineage: TASK-215 revision 1, RUN-215-003, failed head
      75cbd814bf5e687c71015dfdce4e5d8a715009c5, REPAIR-215-002 authorization
      69b04072dce87c7815afdfea863cb60fde119cbf. It must not advance P7.4.
    - >
      Fresh downstream conformance after migration must be expressed as pending revision of the
      existing TASK-207 authority, not as TASK-218 completion and not as a second conformance task.
      TASK-218 must leave .ai/aios-conformance-state.yaml unchanged.
    - >
      Governance regressions must distinguish ACTIVE_PIN=49ad4d7 from the prior certified
      pin c96eb8b5 so the unchanged TASK-207 r4 conformance record is treated as historical
      prior-pin certification until fresh TASK-207 certification is published.
    - >
      Preserve the existing TASK-127 post-AUTHOR_REPAIR handoff, exact-title REPAIR carrier
      hardening, all live carrier files, and all current source/publication boundaries unchanged.
    - >
      Mutation is limited to the ten authorized modify files. Executor must leave a clean worktree
      and must not publish.
    - >
      Verification must be deterministic, offline, non-interactive and provider/network independent.
      Use a dedicated gitdir pytest basetemp so native Windows temporary cleanup does not create
      false failures.

acceptance:
  - id: AC1
    condition: >
      The sole active AIOS-renew dependency/provenance authority is exactly
      49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2 and stale/alternate provenance remains fail closed.
  - id: AC2
    condition: >
      Human-facing worker surfaces and all Phase-1/Phase-2 repository bindings remain behaviorally
      unchanged; the migration activates package capability only and creates no second lifecycle authority.
  - id: AC3
    condition: >
      Adoption state records exact reviewed/source-published TASK-145 revision-2 provenance for
      49ad4d7 and classifies the local/canonical REPAIR reconciliation fix as adopted-by-pin without
      treating mutable upstream main or TASK-144 revision-2 authoring state as runtime authority.
  - id: AC4
    condition: >
      The existing TASK-207 revision-4 / c96 certification is preserved unchanged as historical
      prior-pin evidence, while current 49ad4d7 full downstream conformance is explicitly
      PENDING_FRESH_CERTIFICATION through the existing TASK-207 semantic authority.
  - id: AC5
    condition: >
      Roadmap preserves P7.3 as NEXT and binds the post-migration resume target to exact
      TASK-215/RUN-215-003/REPAIR-215-002 lineage without rerunning TASK-215 or advancing P7.4.
  - id: AC6
    condition: >
      No workflow, carrier, product source, conformance record, or unrelated path changes; only the
      ten authorized migration/planning/provenance/test files mutate.
  - id: AC7
    condition: >
      Focused deterministic worker, ingress, Phase-1, Phase-2, publication, conformance-preservation
      and governance regressions plus git diff --check pass with zero unresolved items, leaving the
      reviewed source candidate eligible for independent PRIMARY review and safe publication.

