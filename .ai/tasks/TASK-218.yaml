task_id: TASK-218
revision: 1

goal: >
  Migrate Python Agent's sole active AIOS-renew runtime authority from exact
  c96eb8b52acd865b9453409e6598e08a8bd4e48e to exact reviewed/source-published
  49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2 so the generic Unified State
  local/canonical REPAIR semantic-identity reconciliation fix validated by upstream
  TASK-145 revision 2 becomes available downstream. Preserve every existing Python Agent
  control-plane binding and product authority unchanged, preserve the exact TASK-215
  P7.3 correction lineage, and make fresh downstream conformance under the new pin an
  explicit prerequisite before resuming the pending REPAIR.

problem: >
  Python Agent canonical main is 68c6770b3fce96b5b33f710f77ccdd73277cfcf1 and
  currently pins AIOS-renew c96eb8b52acd865b9453409e6598e08a8bd4e48e. TASK-207
  revision 4 certified the downstream control plane only for that exact c96 pin.
  P7.3 TASK-215 then reached RUN-215-003, a failed REPAIR continuation whose source
  candidate remains 75cbd814bf5e687c71015dfdce4e5d8a715009c5 and whose current
  REPAIR authorization is 69b04072dce87c7815afdfea863cb60fde119cbf. The persistent
  downstream checkout reports MALFORMED_CANONICAL_STATE because c96's
  _local_pending_runs REPAIR reconciliation leaves local review_id/finding_id unset while
  canonical remote decoding derives them from the immutable correction ancestry. A clean
  scratch checkout without the mirrored local terminal resolves the same canonical lineage,
  proving an asymmetric reconciliation defect rather than malformed TASK-215 truth.

  Upstream AIOS-renew fixed that generic defect through TASK-145 revision 2. RUN-145-002
  produced exact source candidate 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2,
  REVIEW-145-001 is PRIMARY PASS with AC1-AC6 PASS and no findings, Runtime verification
  passed 14 focused repair reconciliation tests, 42 complete Unified State tests,
  1207 full-suite tests and git diff --check, and that exact source is published in
  canonical AIOS-renew history. Its immediate base 89ac1880fed41c7237146422e2e985d98c0eeda8
  is the reviewed/source-published TASK-146 baseline. Mutable AIOS-renew main has since
  advanced to later task-authoring state, so Python Agent must adopt the exact reviewed
  source 49ad4d7 rather than mutable upstream main.

assumptions:
  - Canonical Python Agent main at authoring is 68c6770b3fce96b5b33f710f77ccdd73277cfcf1.
  - The sole active downstream AIOS-renew pin is c96eb8b52acd865b9453409e6598e08a8bd4e48e under EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
  - TASK-207 revision 4 is valid publication-gated certification only for c96eb8b52acd865b9453409e6598e08a8bd4e48e and becomes historical prior-pin evidence after TASK-218 publication.
  - Upstream TASK-145 revision 2 / RUN-145-002 / REVIEW-145-001 are canonical PASS lineage for source 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2.
  - Upstream TASK-146 / REVIEW-146-001 source 89ac1880fed41c7237146422e2e985d98c0eeda8 is the reviewed published verification baseline from which TASK-145 revision 2 was re-admitted.
  - TASK-215 revision 1 remains the unique P7.3 semantic authority. Its current correction continuation is RUN-215-003 with failed_head_sha 75cbd814bf5e687c71015dfdce4e5d8a715009c5 and current REPAIR authorization 69b04072dce87c7815afdfea863cb60fde119cbf.
  - No RUN-215-004 exists and TASK-215 must not be rerun, repaired, reviewed, integrated, or published inside this migration task.
  - Existing Human/Brain/Runtime/Executor/Reviewer/Publisher/A3/A6/REPAIR/Attention authority boundaries and all active Python Agent repository bindings remain unchanged.

