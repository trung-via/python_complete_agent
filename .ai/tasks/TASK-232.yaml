task_id: TASK-232
revision: 1

goal: >
  Implement the one currently authorized P8 public TikTok Shop PDP collector capability as
  BOUNDED_OFFLINE_FIRST_IMPLEMENTATION_ONLY. Add a narrow Product Intelligence exact-PDP
  observation adapter, strict PDP parsing/admission behavior, deterministic offline tests,
  implementation documentation, and publication-gated roadmap closure. Reuse existing browser
  session and canonical TikTok identity/parsing authorities. Do not access TikTok live, create
  evidence outside existing ProductCandidateSnapshot/SignalEvidence semantics, expand Product
  Source, use Affiliate surfaces, or authorize any live pilot, market test, ranking, approval,
  recommendation, or commerce action.

problem: >
  TASK-231 is exactly published at c533ee90201a5e0400b7973e89ab5c58677501ba
  and authorizes one unique NEXT commitment named P8_PUBLIC_PDP_COLLECTOR_IMPLEMENTATION,
  classified BOUNDED_OFFLINE_FIRST_IMPLEMENTATION_ONLY. The repository currently has TikTok
  search-card discovery and ProductSourcePack extraction, but neither is the correct semantic or
  technical owner for exact public-PDP market observations. Search-card parsing intentionally
  accepts price ranges by lower bound, which is forbidden for exact PDP evidence. Product Source
  extraction is facts/media oriented and depends on trusted media, which TASK-231 explicitly
  forbids as a dependency for PDP market metrics. The missing capability is therefore a narrow
  Product Intelligence collector that accepts an already-owned BrowserSession, observes one exact
  PDP, fails closed on identity/access ambiguity, and constructs the existing
  ProductCandidateSnapshot without introducing a second observation/evidence owner.

assumptions:
  - >-
    Canonical main at authoring is c533ee90201a5e0400b7973e89ab5c58677501ba.
  - >-
    TASK-231 is published and DONE only as PUBLIC_PDP_ACQUISITION_CONTRACT_ONLY.
  - >-
    Canonical roadmap has exactly one NEXT commitment named P8_PUBLIC_PDP_COLLECTOR_IMPLEMENTATION.
  - >-
    implementation_authorized is true, but live_public_pdp_acquisition_authority is NONE.
  - >-
    automatic_live_pilot is false, automatic_p8_4 is false, and market_test_or_action_authority is NONE.
  - >-
    ProductCandidateSnapshot remains the sole canonical public marketplace observation contract for the V1 fields it already owns.
  - >-
    SignalEvidence remains the existing Product Intelligence field-evidence contract produced downstream by existing normalization.
  - >-
    ProductSourcePack remains seller/source facts and original-media authority only.
  - >-
    src/product_intelligence/adapters/tiktok_parsing.py remains the one canonical TikTok source-product identity/parsing authority.
  - >-
    Existing parse_tiktok_price search-card behavior intentionally takes the lower bound of displayed ranges and must remain unchanged for discovery compatibility.
  - >-
    Existing PlaywrightBrowserManager and PlaywrightBrowserSession remain browser/session lifecycle authorities.
  - >-
    The implementation must consume an already-provided BrowserSession-like dependency and must not create, connect, restart, close, select, or rebind browser/CDP resources.
  - >-
    The selected P8 pilot remains context_id p8-pilot-001-led-motion-tiktok-vn and source ID 1731381331718341815, but those values are planning/live-authorization context, not a universal implementation allowlist.
  - >-
    SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY, SNAPSHOT_IS_NOT_TREND, EVIDENCE_IS_NOT_PRODUCT_TRUTH, CAPABILITY_IS_NOT_AUTHORITY, and ONE_CAPABILITY_ONE_AUTHORITY remain mandatory.
  - >-
    Current downstream AIOS pin and conformance remain edd7d8d92d54900c56442bbfcddb8648ec4d2e09 / TASK-207 revision 8.

