non_goals:
  - Modify .ai/aios-conformance-state.yaml or claim TASK-207 revision-5 certification applies to 1a68db9acb6989dfa81bf875503db62e54a4bed6.
  - Modify, rerun, repair, review, integrate, publish, or otherwise advance TASK-215 or RUN-215-004 inside TASK-219.
  - Modify Commerce Opportunity Intelligence source, Product Intelligence source, P7.3 semantics, roadmap milestone meaning, scoring, ranking, evidence, identity, truth, retrieval, persistence, provider, browser, marketplace, or model behavior.
  - Modify Phase-1/Phase-2 workflow implementations, policies, bootstraps, carrier titles, repository identity, runner labels/paths, actor allowlists, Publisher implementation, correction action semantics, or executor selection semantics.
  - Reimplement TASK-144 downstream, vendor AIOS source, delete local Runtime state, bypass exact-pin provenance, or create a second review, publication, lifecycle, or conformance authority.
  - Adopt mutable future AIOS-renew main or any source other than exact reviewed/source-published 1a68db9acb6989dfa81bf875503db62e54a4bed6.
  - Create a second conformance semantic authority; TASK-207 remains the sole downstream-conformance authority and must be revised after migration publication.
  - Push, merge, publish, or mutate canonical main from Executor implementation execution.

constraints:
  hard:
    - >
      Change the sole active requirements pin and worker AUTHORITATIVE_COMMIT to exactly
      1a68db9acb6989dfa81bf875503db62e54a4bed6. Preserve the existing source-plus-commit
      PEP-610 provenance check and fail closed on stale, alternate, floating, or unverifiable runtimes.
    - >
      Human-facing Codex and Antigravity worker protocol remains unchanged. No command surface,
      action mapping, executor list, bootstrap location, repository identity, or authority boundary
      may change merely because the pin changes.
    - >
      Existing Phase-1 and Phase-2 repository bindings remain byte-for-byte unchanged. TASK-219
      is a package-pin migration only; capability availability does not activate a new repository binding.
    - >
      Documentation may update exact-pin provenance and record that the adopted source includes
      upstream TASK-144 revision-2 canonical REPAIR-review reconstruction and publication validation.
      It must not treat mutable future AIOS-renew main as runtime authority.
    - >
      .ai/aios-adoption-state.yaml must set downstream_pin to
      1a68db9acb6989dfa81bf875503db62e54a4bed6, record upstream provenance
      TASK-144 revision 2 / RUN-144-006 / REVIEW-144-006 and source-published status,
      preserve all existing binding classifications, and mark full downstream conformance for
      1a68db9 as PENDING_FRESH_CERTIFICATION. The prior TASK-207 revision-5 49ad4d7
      certification must remain explicit historical prior-pin evidence rather than being rewritten.
    - >
      .ai/roadmap-state.yaml must preserve P7.3 as the unique product NEXT and
      TASK-215 product_done=false, while updating the control-plane prerequisite/resume bookmark
      to the exact current successful correction candidate: TASK-215 revision 1, RUN-215-004,
      candidate 142bd865f69a6636b321d3cc7a0cd4004db3fdc7, prior finding
      FINDING-215-001, predecessor RUN-215-003, and REPAIR-215-002 continuity.
      It must record that semantic review/publication remains pending fresh conformance and
      must not advance P7.4.
    - >
      Fresh downstream conformance after migration must be expressed as a pending revision of the
      existing TASK-207 authority, not as TASK-219 completion and not as a second conformance task.
      TASK-219 must leave .ai/aios-conformance-state.yaml unchanged.
    - >
      Governance regressions must distinguish ACTIVE_PIN=1a68db9 from the prior certified
      pin 49ad4d7 so the unchanged TASK-207 revision-5 conformance record is treated as historical
      prior-pin certification until a fresh TASK-207 certification is reviewed and published.
    - >
      Preserve the existing TASK-127 post-AUTHOR_REPAIR handoff, all live carrier files,
      source-only publication boundary, exact reviewed-source publication gate, and every current
      authority separation unchanged.
    - >
      The migration must not create or submit REVIEW-215-002. It only makes the canonical
      upstream capability available; review remains a separate Brain action after fresh
      downstream conformance is effective.
    - >
      Mutation is limited to the ten authorized modify files. Executor must leave a clean
      worktree and must not publish.
    - >
      Verification must be deterministic, offline, non-interactive, and provider/network independent.
      Use a dedicated gitdir pytest basetemp so native Windows temporary cleanup does not create
      false failures.

acceptance:
  - id: AC1
    condition: >
      The sole active AIOS-renew dependency/provenance authority is exactly
      1a68db9acb6989dfa81bf875503db62e54a4bed6 and stale/alternate provenance remains fail closed.
  - id: AC2
    condition: >
      Human-facing worker surfaces and all Phase-1/Phase-2 repository bindings remain behaviorally
      unchanged; the migration activates package capability only and creates no second lifecycle authority.
  - id: AC3
    condition: >
      Adoption state records exact reviewed/source-published TASK-144 revision-2 provenance for
      1a68db9 and classifies canonical successful-REPAIR review reconstruction/publication support as
      adopted-by-pin without treating mutable future upstream state as runtime authority.
  - id: AC4
    condition: >
      Existing TASK-207 revision-5 / 49ad4d7 certification is preserved unchanged as historical
      prior-pin evidence, while current 1a68db9 full downstream conformance is explicitly
      PENDING_FRESH_CERTIFICATION through the existing TASK-207 semantic authority.
  - id: AC5
    condition: >
      Roadmap preserves P7.3 as NEXT and binds the post-certification resume target to exact
      TASK-215 revision-1 / RUN-215-004 / candidate 142bd865f69a6636b321d3cc7a0cd4004db3fdc7 /
      FINDING-215-001 continuity without rerunning TASK-215 or advancing P7.4.
  - id: AC6
    condition: >
      No workflow, carrier, product source, conformance record, or unrelated path changes; only
      the ten authorized migration/planning/provenance/test files mutate.
  - id: AC7
    condition: >
      Focused deterministic worker, ingress, Phase-1, Phase-2, publication,
      conformance-preservation, and governance regressions plus git diff --check pass with
      zero unresolved items, leaving the reviewed migration source candidate eligible for
      independent PRIMARY review and safe publication.

