task_id: TASK-219
revision: 1

goal: >
  Migrate Python Agent's sole active AIOS-renew runtime authority from exact
  49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2 to exact reviewed/source-published
  1a68db9acb6989dfa81bf875503db62e54a4bed6 so canonical Brain SUBMIT_REVIEW and
  safe publication can consume the upstream TASK-144 revision-2 integrated
  REMEDIATION/REPAIR review-lineage reconstruction required by the already-successful
  TASK-215 REPAIR candidate. Preserve every existing Python Agent control-plane binding,
  product authority, and exact TASK-215 lineage unchanged, and require fresh downstream
  conformance under the new pin before resuming P7.3 semantic review/publication.

problem: >
  Python Agent canonical main is 15a3f7f8016bcb9fd58871dcd8a385b331a981d6 and
  currently pins AIOS-renew 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2.
  TASK-207 revision 5 certifies the downstream control plane only for that exact pin.
  P7.3 TASK-215 revision 1 has now progressed beyond the previously preserved failed
  RUN-215-003 lineage: REPAIR-215-002 continued successfully as RUN-215-004 and produced
  canonical candidate 142bd865f69a6636b321d3cc7a0cd4004db3fdc7. Runtime verification
  passed the focused TASK-215 suite with 45 tests and git diff --check, resolving the
  preserved FINDING-215-001 by rejecting session_token projection leakage.

  The required semantic review for RUN-215-004 is a DELTA review tied to
  FINDING-215-001. Python Agent's current 49ad4d7 control plane cannot canonicalize that
  review because its SUBMIT_REVIEW path does not reconstruct successful REPAIR lineage,
  causing DELTA prior_finding_id validation to fail before review-decision materialization.
  Upstream AIOS-renew fixed this exact self-hosting/control-plane gap through TASK-144
  revision 2. RUN-144-006 produced source candidate
  1a68db9acb6989dfa81bf875503db62e54a4bed6; REVIEW-144-006 is PRIMARY PASS with
  AC1-AC7 PASS and no findings; verification passed 6 focused operator tests, 7 focused
  authoring-ingress tests, 42 focused publication tests, 378 combined tests, the complete
  1222-test suite, and git diff --check. That exact reviewed source is published as
  canonical AIOS-renew main. Python Agent must adopt the exact reviewed source commit,
  not mutable future AIOS-renew main.

assumptions:
  - Canonical Python Agent main at authoring is 15a3f7f8016bcb9fd58871dcd8a385b331a981d6.
  - The sole active downstream AIOS-renew pin is 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2 under EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
  - TASK-207 revision 5 is effective publication-gated downstream certification only for 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2 and becomes historical prior-pin evidence after TASK-219 publication.
  - Upstream TASK-144 revision 2 / RUN-144-006 / REVIEW-144-006 are canonical PASS lineage for source 1a68db9acb6989dfa81bf875503db62e54a4bed6.
  - The upstream REVIEW-144-006 decision ref contains reviewed_sha 1a68db9acb6989dfa81bf875503db62e54a4bed6, mode PRIMARY, verdict PASS, AC1-AC7 PASS, and no findings.
  - TASK-215 revision 1 remains the unique P7.3 semantic authority and product_done remains false.
  - RUN-215-004 is the current successful repair candidate at 142bd865f69a6636b321d3cc7a0cd4004db3fdc7, preserving FINDING-215-001 from REVIEW-215-001 through RUN-215-003 / REPAIR-215-002 continuity.
  - No review-decision ref exists for RUN-215-004 at authoring time.
  - TASK-215 must not be rerun, repaired again, reviewed, integrated, or published inside this migration task.
  - Existing Human/Brain/Runtime/Executor/Reviewer/Publisher/A3/A6/REPAIR/Attention authority boundaries and all active Python Agent repository bindings remain unchanged.

