task_id: TASK-162
revision: 1

goal: >
  Harden the existing Shopee Product Source Pack acquisition boundary after canonical
  RUN-156-009 proved that a Human-confirmed normal non-CAPTCHA Shopee session can pass live
  discovery yet the existing ShopeeScrapeTool path still fail with EXTRACTION_EMPTY because
  ShopeeSourceExtractor evaluates the product page immediately after navigation with no
  bounded product-page readiness sampling. Preserve ShopeeSourceExtractor as the sole Shopee
  source-extraction authority and add no second browser, scraper, discovery, persistence,
  ProductSourcePack, retry, or product-truth owner.

problem: >
  TASK-156 is certification-only and may not modify production Python. Its preserved
  historical candidate 38e087e6925b1e7bac81c0eddc8b4dbb8992ff25 contains only the
  certification implementation plus the F1 roadmap correction. RUN-156-008 reached
  verification and failed at LIVE_P6B_DISCOVERY_NAVIGATION. Before RUN-156-009 the Human
  confirmed the authenticated Shopee surface had no CAPTCHA/challenge. RUN-156-009 then
  progressed through discovery, while the offline suite passed 106 tests with 1 skip, but
  the live certification failed specifically at LIVE_P6B_ACQUISITION_EXTRACTION.
  ShopeeScrapeTool emits that category only when ShopeeSourceExtractor raises a source
  extraction error and the tool returns EXTRACTION_EMPTY. Current ShopeeSourceExtractor
  performs one navigation and immediately evaluates the extraction script once; unlike the
  already-hardened ShopeeDiscoveryAdapter, it has no bounded same-page readiness sampling
  for client hydration. docs/PHASE_6_PRODUCT_SOURCE_PACK.md already identifies dynamic
  hydration/lazy loading as a marketplace DOM fragility and assigns platform DOM extraction
  to src/product_source/platforms. This task corrects that existing authority rather than
  changing TASK-156 certification code.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-162 authoring is
    16aca48595725941df084ec2d0f88dc8a0b148b8, the published TASK-161 source candidate.
  - >
    The authoritative downstream AIOS pin remains exactly
    32ace104c5cfaa1b7affbaa40157872b1f85147f.
  - >
    TASK-156 remains active historical certification lineage and is not to be repaired,
    rerun, reviewed, or published by TASK-162. RUN-156-009 is canonical failed evidence with
    failed_head_sha 38e087e6925b1e7bac81c0eddc8b4dbb8992ff25; its live failure category is
    LIVE_P6B_ACQUISITION_EXTRACTION after successful discovery.
  - >
    RUN-156-006 previously proved the same certification implementation could pass all
    28 live tests, while the only committed difference from d66faa95c8c03e1fe2d5f4c4c36b44b7fc9bc364
    to 38e087e6925b1e7bac81c0eddc8b4dbb8992ff25 is the two TASK-156 F1 roadmap documents.
    The new failure therefore exposes a latent live acquisition/readiness weakness rather
    than evidence that the F1 documentation correction is wrong.
  - >
    TASK-137 remains the only BrowserManager/BrowserSession/CDP lifecycle authority.
    Human authentication/session preparation and CAPTCHA handling remain outside repository code.
  - >
    ShopeeSourceExtractor in src/product_source/platforms/shopee.py remains the existing
    platform-specific Shopee source-extraction/DOM authority. ShopeeScrapeTool remains the
    production deep-acquisition tool and ProductSourcePack/model/serialization/downloader
    authorities remain unchanged.
  - >
    TASK-151 is the direct design precedent for bounded same-page readiness sampling, but it
    owns only Shopee discovery/search-card readiness. TASK-162 must not move discovery
    semantics into Product Source Pack extraction or create a shared second readiness owner.
  - >
    TASK-162 is a blocker correction only. It does not certify P6.0b and does not close
    TASK-156/F1. After this blocker is semantically reviewed and published, a separate
    current-main successor certification must re-establish P6.0b proof rather than continuing
    the historical TASK-156 candidate on stale production code.

scope:
  inspect:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/PHASE_6_PRODUCT_SOURCE_PACK.md
    - docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md
    - .ai/tasks/TASK-137.yaml
    - .ai/tasks/TASK-151.yaml
    - .ai/tasks/TASK-154.yaml
    - .ai/tasks/TASK-156.yaml
    - src/integrations/playwright/manager.py
    - src/integrations/playwright/session.py
    - src/product_source/platforms/shopee.py
    - src/product_source/models.py
    - src/tools/shopee_scrape_tool.py
    - tests/product_source/test_shopee_source_extractor.py
    - tests/product_source/test_scrape_tool_compat.py
    - tests/product_source/test_extractor_dom_fixtures.py
    - tests/integration/test_browser_cdp.py
  modify:
    - src/product_source/platforms/shopee.py
    - tests/product_source/test_shopee_source_extractor.py

non_goals:
  - Modify TASK-156 fixture, roadmap correction, REVIEW/REMEDIATION/REPAIR/RUN/FAILURE lineage,
    or candidate 38e087e6925b1e7bac81c0eddc8b4dbb8992ff25.
  - Modify Shopee discovery/search-card readiness, discovery adapters, orchestration, ranking,
    candidate mapping, business scoring, approval, queue, or Product Intelligence semantics.
  - Modify BrowserManager/BrowserSession lifecycle, CDP ownership, browser reconnect/restart,
    page creation, login automation, CAPTCHA solving, stealth, proxying, or anti-bot behavior.
  - Modify ShopeeScrapeTool public result/error contract, ProductSourcePack schema,
    serialization, downloader, Google Drive behavior, canonical identity, catalog, retrieval,
    grounded QA, provider, or answer semantics.
  - Add a second navigation, page/session acquisition, browser reopen, alternate URL, alternate
    query/platform, HTTP/API fallback, retry/reroute, unbounded polling, Human-interactive wait,
    or global untrusted DOM/media scan.
  - Weaken fail-closed media provenance, structured-product identity matching, review/UGC
    exclusion, bounded fallback, or SourcePackBlockedError/SourcePackExtractionError semantics.
  - Add live marketplace verification to TASK-162. Live certification belongs to a separate
    successor task after this blocker correction is published.
  - Modify AIOS-renew, the Python Agent AIOS pin, worker surfaces, or publication behavior.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Keep ShopeeSourceExtractor as the sole Shopee product-page source extraction
      implementation and preserve its public constructor and extract(...) signature,
      ProductSourcePack output contract, source_pack_id/product identity semantics, trusted
      media provenance/roles/order/deduplication, facts, optional metadata, and exception
      classes except for the minimum internal readiness synchronization required here.
    - >
      One extract(...) call must still acquire exactly one page/session and perform exactly
      one navigation to the exact input product URL. Replace only the immediate one-shot
      post-navigation extraction assumption with a fixed bounded same-page readiness sampling
      boundary. Multiple evaluate(...) samples may occur only on that already-navigated page;
      there must be no second navigate/goto, page/session acquisition, browser reopen, alternate
      URL, or external retry/fallback.
    - >
      Use source-owned fixed readiness bounds only. Total readiness waiting after navigation
      must be finite and no greater than 5 seconds in production behavior. Do not expose attempts,
      delay, timeout, or polling controls through the constructor, extract(...) API, scraper tool,
      environment variables, BrowserConfig, or public configuration.
    - >
      Treat a structurally valid extraction sample with no currently acceptable trusted
      seller-product media and blocked=false as an unready sample until the fixed bound is
      exhausted. Readiness must terminate immediately when the existing extraction semantics
      can accept at least one trusted media item or when blocked=true is observed. Invalid
      extraction payloads and browser/evaluate exceptions must preserve existing fail-closed
      error behavior rather than being converted into readiness retries.
    - >
      At bounded exhaustion, preserve the existing SourcePackExtractionError fail-closed result
      for no trusted seller-product media. Explicit block/CAPTCHA must continue to raise
      SourcePackBlockedError immediately and must never be waited through or automated.
    - >
      Readiness sampling must reuse the existing _SHOPEE_EXTRACTION_SCRIPT unchanged unless a
      deterministic focused regression proves a selector defect independently of timing.
      TASK-162 is not authorization for broad selector rewrites, global page scans, weaker
      product identity matching, recommendation/review media inclusion, or heuristic media
      acceptance.
    - >
      Avoid creating a second media-acceptance authority solely for readiness. Refactor the
      existing trusted-media interpretation internally if necessary so each sample is judged
      by the same identity/provenance acceptance rules that build the final ProductSourcePack.
      No duplicate or looser "ready" rule may accept a sample that final extraction would reject.
    - >
      Any delay between readiness samples must use a standard asynchronous delay primitive and
      be testable through a module-private monkeypatch boundary so focused tests run with zero
      real wall-clock sleep. Do not introduce a public timing abstraction or dependency.
    - >
      Add focused offline tests proving delayed hydration succeeds after one or more valid
      media-empty samples; first ready sample stops further evaluation; delayed blocked state
      raises SourcePackBlockedError without further sampling; bounded exhaustion raises the
      same SourcePackExtractionError; one extract call still performs exactly one navigation
      and one page/session acquisition despite multiple evaluate samples; invalid payload and
      evaluate-error behavior remain fail-closed; no real sleep/network occurs.
    - >
      Preserve existing structured identity mismatch behavior, gallery/variant/description/
      fallback media precedence, media dedupe/order, metadata/facts, strict browser-manager
      integration, and evaluate(script, product_id) argument forwarding. Existing Product
      Source Pack and browser regressions must remain green.
    - >
      TASK-162 verification must be fully offline. It must not access live Shopee, CDP 9222,
      Google Drive, models, provider APIs, or TASK-156 execution. It must not claim the live
      acquisition path is certified; publication only establishes the blocker correction.
    - Do not push from executor execution.

acceptance:
  - id: AC1
    condition: >
      Only src/product_source/platforms/shopee.py and
      tests/product_source/test_shopee_source_extractor.py change, with no new browser,
      discovery, scraper, persistence, ProductSourcePack, or product-truth authority.
  - id: AC2
    condition: >
      One ShopeeSourceExtractor.extract call performs exactly one page/session acquisition
      and exactly one navigation while using a fixed bounded same-page readiness sampling
      boundary instead of immediate one-shot media-empty failure.
  - id: AC3
    condition: >
      A valid media-empty sample is retried only within the fixed same-page bound; first
      accepted trusted media terminates sampling; explicit blocked state terminates
      immediately; bounded exhaustion remains SourcePackExtractionError; invalid payload
      and evaluate exceptions remain fail-closed.
  - id: AC4
    condition: >
      Readiness and final ProductSourcePack construction use the same existing trusted-media
      identity/provenance acceptance semantics, with no duplicate looser readiness authority
      and no global/untrusted fallback.
  - id: AC5
    condition: >
      Human authentication/CAPTCHA ownership, TASK-137 borrowed-CDP lifecycle, exact product
      URL navigation, evaluate(script, product_id) forwarding, and all existing source-pack
      schema/media/fact/metadata semantics remain unchanged.
  - id: AC6
    condition: >
      Focused deterministic tests prove delayed hydration success, immediate ready/blocked
      termination, bounded exhaustion, exact one acquisition/navigation, zero real sleep/network,
      and preservation of existing extraction/browser compatibility behavior.
  - id: AC7
    condition: >
      TASK-162 performs no live certification and does not mutate or reinterpret TASK-156
      lineage. RUN-156-009 remains canonical failed P6.0b evidence until a separately
      authorized successor certification runs on the published blocker correction.
  - id: AC8
    condition: >
      Required verification and git diff check pass with zero unresolved items and no changes
      outside TASK-162 scope.

verification:
  required:
    - '$env:PYTHONPATH = ".;src"; python -m pytest tests/product_source/test_shopee_source_extractor.py tests/product_source/test_scrape_tool_compat.py tests/product_source/test_extractor_dom_fixtures.py tests/integration/test_browser_cdp.py -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - 'git diff --check; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
