task_id: TASK-190
revision: 1

goal: >
  Add one bounded P7.1 discovery-cohort operational profile to the existing TASK-166/TASK-189
  repository-owned live-capture authority so a Human can stage a fresh three-query Shopee
  DiscoveryBatch cohort outside Git without requiring an AIOS engineering Executor to perform live
  marketplace work. Reuse TASK-137 browser/session authority, TASK-151/TASK-187 Shopee discovery
  authority, and TASK-189 Session/Access Continuity V2 semantics. Produce one immutable READY
  discovery bundle containing exact public DiscoveryBatch projections only. This task does not
  execute the P7.1 baseline, does not call TASK-181 evaluation, and captures no live evidence during
  implementation or Runtime verification.

problem: >
  TASK-188 attempted to combine live marketplace acquisition with engineering implementation and
  ended BLOCKED / UNPUBLISHED at RUN-188-004 with no source candidate. TASK-189 corrected the
  session/access boundary and current canonical main now contains its source plus the narrow AC5
  session-continuity/CLI repair. However the existing TASK-166 READY capture bundle freezes one
  selected product plus two deep ProductSourcePack observations per query; it does not preserve the
  five exact search-card ProductCandidateSnapshot observations per query required by the TASK-181
  P7.1 evidence-coverage methodology. Re-running TASK-188 inside an Executor would therefore violate
  the new operational-plane versus engineering-plane contract. The missing capability is a bounded
  Human-invoked discovery-cohort capture profile inside the existing capture owner, followed later by
  a separate frozen-evidence benchmark task.

assumptions:
  - >
    Canonical main immediately before TASK-190 authoring is
    9fa1b2583380e1b6378e5aba3d720c2e78a4b9d4. It contains TASK-189 Session/Access Continuity V2
    implementation plus the narrow AC5 session-continuity and CLI parser correction. TASK-190 treats
    that source as the published operational prerequisite and must not reopen TASK-189 semantics.
  - >
    The exact Python Agent AIOS runtime authority remains
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@e72135cd5c5a1dec0d8374d9bb8994da5e458feb.
  - >
    TASK-188/RUN-188-004 remains BLOCKED / UNPUBLISHED with no source candidate. Its diagnostic
    observations are not baseline truth and must not be copied, rehabilitated, continued, repaired,
    or used as implementation input.
  - >
    TASK-166 live_capture.py remains the sole repository-owned live-capture sequencing/checkpoint
    authority. TASK-137 BrowserSession / PlaywrightBrowserSession remain the sole CDP lifecycle,
    borrowed-resource, page-selection, binding and liveness authority. TASK-151/TASK-187
    ShopeeDiscoveryAdapter remains the sole Shopee search observation authority.
  - >
    TASK-181 evaluate_winning_product_coverage remains the sole P7 cohort-level evidence-coverage
    evaluator. ProductCandidateSnapshot and DiscoveryBatch remain marketplace observation contracts;
    ranking, scoring, approval and product truth retain their existing separate authorities.
  - >
    The P7.1 benchmark sampling intents remain exactly `bình giữ nhiệt inox`, `bàn phím cơ`, and
    `chuột không dây`. TASK-190 creates only the operational means to stage those raw observations;
    acceptance of any concrete READY bundle remains a separate Human review step after publication.

