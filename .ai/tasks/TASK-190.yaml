    - docs/PHASE_7_P7_0_WINNING_PRODUCT_EVIDENCE_QUALITY.md
    - docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md
    - docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md
    - .ai/tasks/TASK-151.yaml
    - .ai/tasks/TASK-166.yaml
    - .ai/tasks/TASK-168.yaml
    - .ai/tasks/TASK-181.yaml
    - .ai/tasks/TASK-188.yaml
    - .ai/tasks/TASK-189.yaml
    - src/browser/session.py
    - src/integrations/playwright/session.py
    - src/integrations/playwright/manager.py
    - src/product_intelligence/discovery.py
    - src/product_intelligence/models.py
    - src/product_intelligence/adapters/shopee.py
    - src/product_intelligence/live_capture.py
