    - tests/aios_bridge/test_aios_governance_state.py

non_goals:
  - Amend, rewrite, reinterpret, or reformat any Governance Foundation document.
  - Modify AIOS adoption/conformance state, the exact AIOS dependency pin, workers, workflows,
    Runtime, Reviewer, Publisher, transport, or upstream AIOS-renew.
  - Adopt upstream TASK-119 or TASK-120 downstream or claim their behavior is active at the
    current downstream pin.
  - Select, design, author, or implement a P7.2 or other post-P7.1 product capability.
  - Reopen P6.2, P6.4-P6.6, historical blocked certification lineage, TASK-210, TASK-211, or TASK-212.
  - Turn roadmap state into engineering truth or give Runtime/worker automatic planning authority.
  - Treat D3 transport/Brain-procedure observations as authority to add a planner, lifecycle router,
    daemon, memory service, retry mechanism, or duplicate persistence authority.
  - Push, publish, merge, or mutate canonical main from Executor implementation execution.

constraints:
  hard:
    - >
      Preserve roadmap authority exactly: owner BRAIN, purpose CROSS_CHAT_PLANNING_BOOKMARK,
      engineering_truth false, auto_advance_from_runtime_or_worker_state false, and
      priority_change_owner HUMAN.
    - >
      Mark AIOS_FULL_DOWNSTREAM_ADOPTION_AND_GOVERNANCE_REBUILD complete only from exact
      canonical completion evidence already recorded for its milestones; do not reinterpret
      Runtime PASS, Reviewer PASS, or planning state alone as publication.
    - >
      Record GOVERNANCE_FOUNDATION_CLOSURE_AND_P7_RETURN as DONE with TASK-213 completion
      provenance in the planning structure while removing it from pending_commitments.
    - >
      After closure there must be no fabricated global product NEXT. Preserve TASK-191 as the
      exact completed product checkpoint and represent the handoff to post-P7.1 Brain/Human
      interpretation without selecting a collector, enrichment, ranking, threshold, retrieval,
      intelligence domain, provider, or implementation direction.
    - >
      Preserve all historical completed milestone provenance, TASK-199 historical Product
      Contract lineage, TASK-210/TASK-211 current governance provenance, TASK-204 through
      TASK-209 adoption/conformance history, and historical transition fields unchanged except
      for the minimum current-track closure state required by this task.
    - >
      Preserve the exact downstream AIOS pin 91a177d5b96b2197a4d8223dbb727dda6201cb64
      and make no claim that mutable upstream main or TASK-119/TASK-120 is downstream-active.
    - >
      Extend focused deterministic governance-state regression to prove: no ACTIVE governance
      rebuild track remains after closure; no NOT_DONE governance commitment remains; no
      fabricated post-P7.1 NEXT exists; TASK-191 checkpoint is unchanged; roadmap remains
      Brain/Human-owned planning state; and exact AIOS pin/adoption/conformance provenance is
      unchanged.
    - >
      Only .ai/roadmap-state.yaml and tests/aios_bridge/test_aios_governance_state.py may change.
      Any need to alter governance documents, product roadmaps, adoption/conformance state,
      dependency pin, historical artifacts, workflows, workers, or production source fails
      closed for fresh Brain review.
    - >
      Verification is deterministic, offline, non-interactive, and independent of network,
      GitHub, marketplace/browser/CDP, providers/LLMs, Drive, wall clock, random/UUID, secrets,
      or mutable external state.
    - Do not push from Executor implementation execution.

