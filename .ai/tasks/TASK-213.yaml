    - docs/PYTHON_AGENT_CONSTITUTION.md
    - docs/PYTHON_AGENT_PRODUCT_CONTRACT.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md
    - docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md
    - .ai/roadmap-state.yaml
    - .ai/aios-adoption-state.yaml
    - .ai/aios-conformance-state.yaml
    - .ai/tasks/TASK-191.yaml
    - .ai/tasks/TASK-207.yaml
    - .ai/tasks/TASK-210.yaml
    - .ai/tasks/TASK-211.yaml
    - .ai/tasks/TASK-212.yaml
    - .agents/skills/aios-worker/requirements-aios-renew.txt
