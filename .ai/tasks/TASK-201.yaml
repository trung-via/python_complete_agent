task_id: TASK-201
revision: 1

goal: >
  Migrate Python Agent's sole active AIOS-renew runtime authority from exact pin
  a3b723b49cd65677f548c5694a52a6fc006a9e2a to the exact reviewed and
  source-published AIOS-renew source
  f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e, while preserving the thin
  downstream worker architecture, Brain/Runtime/Executor/Reviewer/Publisher
  authority separation, current Python Agent product semantics, and downstream
  Governance Foundation roadmap ownership. Reconcile downstream adoption state
  for the upstream capabilities introduced after the old pin without
  automatically activating AIOS-renew repository-specific outer-automation
  carriers in Python Agent.

problem: >
  Python Agent current canonical main
  759bbeeb67e8761d21d6b8e9fe8d23b6e734a05d still pins AIOS-renew at
  a3b723b49cd65677f548c5694a52a6fc006a9e2a. The Human now explicitly
  prioritizes an AIOS migration before the current generic Governance Foundation
  continuation. The exact desired runtime source is
  f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e, which is the reviewed and
  source-published TASK-113 source and descends from the current pin. AIOS-renew
  later main e95d12122f35bf4e224dbbb28be1866c8250c069 only canonicalizes
  TASK-109 revision 2 planning metadata and is not the reviewed runtime source
  selected for this migration. Python Agent must therefore update its exact pin
  explicitly rather than follow mutable upstream main, and must classify the
  newly available post-pin AIOS capabilities without copying upstream
  repository-specific workflows or creating duplicate control-plane authority.

assumptions:
  - >
    Canonical Python Agent main at TASK-201 authoring is
    759bbeeb67e8761d21d6b8e9fe8d23b6e734a05d. TASK-200 / RUN-200-001 has
    completed the Product Contract roadmap reconciliation and the current
    downstream roadmap records CHATGPT_PROJECT_CONTRACT_RECONCILIATION as the
    unique NEXT Governance Foundation milestone.
  - >
    The current sole active downstream AIOS dependency and launcher provenance
    are exactly a3b723b49cd65677f548c5694a52a6fc006a9e2a under policy
    EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
  - >
    AIOS-renew source f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e is exact
    REVIEW-113-001 PRIMARY PASS source with AC1-AC8 PASS and no findings and is
    source-published. It descends from the current Python Agent pin; canonical
    comparison is ahead by 23 commits and behind by 0.
  - >
    AIOS-renew current main after TASK-109 revision-2 authoring is
    e95d12122f35bf4e224dbbb28be1866c8250c069. That later commit is planning/TASK
    metadata and is deliberately not the runtime target for this migration.
  - >
    Upstream TASK-106 is package-level Human-surface presentation hardening.
    TASK-107, TASK-108, TASK-110, TASK-111, TASK-112, and TASK-113 also introduce
    repository-specific GitHub Issue/wakeup/attention outer-automation surfaces.
    Availability in the pinned package or upstream repository does not itself
    activate those repository-specific carriers in Python Agent.
  - >
    Human intent explicitly inserts this migration ahead of generic
    CHATGPT_PROJECT_CONTRACT_RECONCILIATION continuation. The migration does not
    mark that Governance Foundation commitment DONE, CANCELLED, or SUPERSEDED.

