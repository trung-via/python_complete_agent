task_id: TASK-236
revision: 1

goal: >
  Reconcile the already-consumed TASK-235 one-shot live DOM diagnostic attempt, which failed
  closed with the bounded message "the current page is not an available public PDP" and produced
  no diagnostic artifact, while Human-visible screenshot context showed the exact selected PDP
  rendering normally. Harden only the diagnostic admission/root/page-state observability so a
  later separately authorized attempt can distinguish safe failure reasons and discover a bounded
  product-detail surface on the current TikTok Shop DOM without broad page dumping or changing
  collector extraction semantics. Do not run TikTok/CDP in this engineering task and do not repair
  product-field selectors yet.

problem: >
  TASK-235 is published exactly at eedad88f5c676c647d418da62e554529ea29b161 and granted one
  Human-operated attach-only diagnostic attempt for source ID 1731381331718341815. The Human
  invoked the authorized command once against an operator-owned CDP endpoint whose TCP port was
  reachable. The carrier attached far enough to evaluate the current page and then failed closed
  with TikTokPdpDomDiagnosticError: "the current page is not an available public PDP". No
  diagnostic artifact was created. Under the TASK-235 contract, success or failure consumes the
  single attempt, so authorized_diagnostic_attempts_remaining is now 0 and
  live_dom_diagnostic_authority is no longer usable.

  The current implementation collapses four materially different gates into one message:
  blocked/challenge, login, unavailable, or no bounded PDP root. It also detects "unavailable"
  from title plus the first 500 characters of root.innerText, which can conflate incidental
  descendant/variant text with whole-listing unavailability, and it recognizes only a narrow
  set of PDP roots before falling back to main. The Human screenshot is useful diagnostic
  context showing an apparently normal exact PDP, but it is not canonical Product Intelligence
  evidence and does not prove which internal gate fired. The correct next engineering step is
  therefore to preserve the failed result exactly as unknown-safe-gate failure, improve bounded
  root discovery and safe reason observability offline, then return to Human/Brain for a fresh
  one-shot authorization decision.

assumptions:
  - Canonical main at authoring is eedad88f5c676c647d418da62e554529ea29b161.
  - TASK-235 / RUN-235-001 / REVIEW-235-001 are PASS and exact-source published.
  - The Human invoked the TASK-235 diagnostic exactly once after publication.
  - The command returned TikTokPdpDomDiagnosticError with the exact message
    "the current page is not an available public PDP".
  - No diagnostic artifact was created by that failed attempt.
  - The Human-visible screenshot showed the exact selected TikTok PDP rendered with ordinary
    product content and no visually apparent login/CAPTCHA/challenge wall, but that screenshot is
    diagnostic context only and does not establish the internal failure cause or canonical
    marketplace evidence.
  - TASK-235 defines a failed operation as consuming the one authorized attempt.
  - TASK-137 remains the sole browser/CDP lifecycle authority.
  - TASK-231 remains the sole public-PDP acquisition contract.
  - ProductCandidateSnapshot remains the marketplace observation contract; SignalEvidence remains
    the field-evidence owner; src/product_intelligence/adapters/tiktok_parsing.py remains the sole
    canonical TikTok identity/parser authority.
  - CAPABILITY_IS_NOT_AUTHORITY, EVIDENCE_IS_NOT_PRODUCT_TRUTH,
    SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY, SNAPSHOT_IS_NOT_TREND and
    ONE_CAPABILITY_ONE_AUTHORITY remain mandatory.

