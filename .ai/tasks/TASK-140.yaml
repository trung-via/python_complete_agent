task_id: TASK-140
revision: 1

goal: >
  Implement post-M4 P3.2 Family Decision + Durable Admission as one bounded
  application-composition boundary over the already-published TASK-139 and existing
  M3 Human/admission/persistence authorities. The new boundary must let a caller record
  one explicit Human family decision only for an exact actionable proposal retained by
  one existing TASK-139 FamilyKnowledgeReviewPlan, then, in a separate explicit call,
  durably admit only an APPROVE decision through TASK-114 canonical family creation and
  TASK-120 SQLite family registration. TASK-140 must not redefine Human decision
  semantics, validate or generate canonical IDs independently, duplicate TASK-118
  catalog integrity, call TASK-119 codec directly, auto-create a catalog, auto-approve,
  persist REJECT decisions independently, or implement sellable-variant P3 behavior.

problem: >
  TASK-139 closes P3.1 by producing an immutable review plan containing exact
  TASK-112 FamilyMergeProposal objects, but the caller still has to manually bridge
  proposal -> Human decision -> canonical family -> durable catalog registration.
  Those semantics already have explicit owners: TASK-112 records APPROVE/REJECT,
  TASK-114 admits one approved decision under a caller-supplied opaque family_id,
  TASK-118 owns catalog integrity, TASK-119 owns canonical bytes, and TASK-120 owns
  SQLite durability/transactions. P3.2 therefore needs only a thin application
  composition surface that binds the Human action to an exact proposal from the
  current review plan and delegates the later approved admission chain without
  creating a second approval, identity, catalog, codec, or persistence authority.

assumptions:
  - >
    Canonical Python Agent main immediately before TASK-140 authoring is
    f08b6f5ad416666e42fa04f3507b2150e07a0885, the published TASK-139 source
    candidate after REVIEW-139-001 PRIMARY PASS.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@67db82bf19d63f25721d06aabb82d850db8b78d4.
  - >
    docs/POST_M4_P3_HUMAN_GOVERNED_KNOWLEDGE_UPDATE.md and
    docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md are canonical: P3 is IN PROGRESS,
    P3.1 is closed by TASK-139, and explicit Human family decision followed by durable
    family admission is the immediate next P3 sub-boundary.
  - >
    TASK-139 FamilyKnowledgeReviewPlan remains the sole P3.1 planning value and retains
    the exact actionable FamilyMergeProposal objects presented for Human review.
  - >
    TASK-112 create_family_merge_decision_record remains the sole Human family decision
    authority. TASK-140 may verify only that the selected proposal is the exact object
    retained by the supplied plan, then must forward proposal/decision/actor/decided_at
    unchanged to TASK-112.
  - >
    TASK-114 create_canonical_family remains the sole canonical family admission
    authority and continues to require one explicit caller-supplied opaque family_id.
    TASK-140 must not pre-normalize, generate, hash, parse, reserve, or otherwise
    reinterpret that ID.
  - >
    TASK-118 remains the sole catalog-integrity authority; TASK-119 remains the sole
    canonical catalog byte/rehydration authority; TASK-120
    register_sqlite_canonical_family remains the sole durable family-registration and
    SQLite transaction boundary. TASK-140 must call TASK-120 rather than reproducing
    load/register/encode/write behavior.
  - >
    Existing M3 intentionally has no independent durable Human-decision history store.
    A REJECT decision therefore remains an in-memory exact TASK-112 record at this
    boundary and must not cause catalog mutation or introduce a new rejection store.
  - >
    Family ID allocation, identity evolution/membership extension, conflict repair,
    singleton canonicalization, product-truth reconciliation, automatic approval, and
    all sellable-variant P3 stages remain deferred.

