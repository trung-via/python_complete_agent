      fail closed and rebuilds through the existing exact-pin bootstrap boundary.
  - id: AC2
    condition: >
      Existing Codex and Antigravity Human-facing worker surfaces remain behaviorally compatible,
      thin, executor-distinct, and free of new lifecycle/review/publication authority.
  - id: AC3
    condition: >
      .ai/aios-adoption-state.yaml records TASK-117 / REVIEW-117-001 and the new exact pin as
      reviewed source-published carrier portability hardening while preserving all prior package
      capability and repository-binding classifications.
  - id: AC4
    condition: >
      Phase-1 and Phase-2 repository policies/workflows/bindings remain unchanged and continue
      to delegate through the exact pinned package; no repository binding is newly activated,
      removed, or re-authored by this migration.
  - id: AC5
    condition: >
      .ai/roadmap-state.yaml preserves FULL_AIOS_DOWNSTREAM_CONFORMANCE as the sole base NEXT and
      existing pending ordering, while recording this exact pin migration as the resolved
      prerequisite provenance whose resume target is TASK-207 / FULL_AIOS_DOWNSTREAM_CONFORMANCE;
      it does not claim conformance completion or implement D3 generic interruption semantics.
  - id: AC6
    condition: >
      TASK-207 revision 1 and its rejected live admission evidence remain immutable; no RUN-207
      is synthesized, and repository state makes clear that fresh Brain reconciliation/revision
      is required before TASK-207 execution under the new pin.
  - id: AC7
    condition: >
      D1, D2, and D3 remain deferred with no implementation delta, all mutation stays inside the
      ten authorized files, focused deterministic migration/regression verification passes, and
      RESULT contains zero unresolved items.

