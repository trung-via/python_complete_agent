task_id: TASK-208
revision: 1

goal: >
  Perform the explicit reviewed downstream AIOS-renew pin migration required before
  Python Agent can resume FULL_AIOS_DOWNSTREAM_CONFORMANCE. Move the sole active pinned
  AIOS runtime authority from 652b00b103dd50e2a550dd0ec0fe4063e69631b7 to the exact
  reviewed and source-published TASK-117 source
  26097405343150dc1b55015b94720528afad50ed, preserve all already-published Phase-1 and
  Phase-2 repository bindings and authority boundaries, record bounded migration
  provenance, and leave FULL_AIOS_DOWNSTREAM_CONFORMANCE / TASK-207 as the roadmap target
  to be resumed only after a fresh Brain reconciliation and a TASK-207 contract revision
  bound to the new exact pin.

problem: >
  Python Agent main ec3374d905ff55609e6ed6d07915b759fdcf287e canonically authored
  TASK-207 revision 1 and remains pinned to AIOS-renew
  652b00b103dd50e2a550dd0ec0fe4063e69631b7. A valid live TASK-207 PRIMARY wakeup was
  rejected before dispatch with `carrier repository identity is invalid`; no canonical
  RUN or Executor invocation exists. Upstream TASK-117 repaired the causal package
  portability defect across PRIMARY wakeup, REMEDIATION intent, REPAIR wakeup, and
  terminal-attention admission. REVIEW-117-001 is PRIMARY PASS with AC1-AC7 PASS and no
  findings, and reviewed source 26097405343150dc1b55015b94720528afad50ed is now
  AIOS-renew main. Exact-pin isolation means that upstream publication does not alter
  Python Agent runtime authority. Python Agent must therefore migrate its exact pin
  explicitly before live conformance can resume. Because TASK-207 revision 1 names the old
  pin as an exact assumption and boundary, it must not be executed unchanged after this
  migration; Brain must fresh-sync and revise TASK-207 separately.

