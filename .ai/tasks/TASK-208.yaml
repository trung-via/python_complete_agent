    exactly 652b00b103dd50e2a550dd0ec0fe4063e69631b7 under
    EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
  - >
    The live TASK-207 PRIMARY request in Python Agent Issue #7 was rejected at carrier
    admission with `carrier repository identity is invalid`. This is an admission/transport
    blocker: no RUN-207 exists and no Executor state was created.
  - >
    AIOS-renew source 26097405343150dc1b55015b94720528afad50ed is the exact
    REVIEW-117-001 PRIMARY PASS source, is source-published on AIOS-renew main, and descends
    from 652b00b103dd50e2a550dd0ec0fe4063e69631b7 by two commits with no backward
    divergence. The intervening lineage is TASK-117 authoring plus its reviewed carrier
    portability implementation.
  - >
    TASK-117 changes package carrier admission only and does not alter frozen Kernel v0.1,
    Runtime/Executor/Reviewer/Publisher authority, downstream repository policies, or
    Python Agent product semantics.
  - >
    Python Agent Phase-1 and Phase-2 repository bindings from TASK-205 and TASK-206 remain
    source-published and ACTIVE. This migration consumes the repaired pinned package under
    those existing repository-owned bindings; it is not a new binding activation phase.
  - >
    D1 remains the deferred local Human-facing worker NO_CHANGE supplied-executor defect;
    D2 remains the deferred Windows pytest-current WinError 5 cleanup defect; D3 is recorded
    separately as the deferred cross-chat roadmap interruption/resume persistence audit.
    None is implementation authority for this migration.

