      migration must make the already-active downstream PRIMARY/REMEDIATION/REPAIR/ATTENTION
      bindings consume TASK-117's generic repository-owned admission behavior without changing
      their repository-specific configuration.
    - >
      Reconcile .ai/aios-adoption-state.yaml so downstream_pin.commit and upstream audit
      checkpoint become exactly 26097405343150dc1b55015b94720528afad50ed; record TASK-117 /
      REVIEW-117-001 as reviewed source-published downstream carrier-portability hardening;
