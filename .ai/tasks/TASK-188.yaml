task_id: TASK-188
revision: 1

goal: >
  Execute a fresh P7.1 Real-Evidence Winning Product Coverage Baseline after published
  TASK-187. Capture one new bounded Shopee search-card cohort through the existing
  ShopeeDiscoveryAdapter, freeze exact public DiscoveryBatch projections, replay the
  published TASK-181 evaluator offline, and record immutable measured coverage evidence.
  This task is benchmark/integration work only and creates no new production authority.

problem: >
  TASK-182 remains BLOCKED / UNPUBLISHED because malformed sold evidence invalidated its
  attempted cohort. TASK-185 later hardened sold evidence. TASK-186 remains BLOCKED /
  UNPUBLISHED with no source candidate because current visible Shopee results were not
  recognized by the adapter. TASK-187 narrowly hardened that same adapter and was Runtime
  PASS, semantic PASS, and source-only published at
  857e6b5d0009e9327e1a92d5f62b91432e28f150. The P7.1 measurement gate is now open, but
  historical TASK-182/TASK-186 evidence is not baseline truth and must not be reused.

assumptions:
  - >
    Canonical main at authoring is 857e6b5d0009e9327e1a92d5f62b91432e28f150,
    the reviewed published TASK-187 source candidate.
  - >
    The exact Python Agent AIOS runtime authority remains
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@e72135cd5c5a1dec0d8374d9bb8994da5e458feb.
  - >
    TASK-181 evaluate_winning_product_coverage is the sole cohort-level Winning Product
    evidence-coverage evaluator. WinningProductScorer, SnapshotNormalizer, ScoringPolicy,
    CandidateRanker, and Human approval retain their existing separate authorities.
  - >
    ProductCandidateSnapshot remains the M2 marketplace observation. TASK-151, TASK-153,
    TASK-167, TASK-185, and TASK-187 harden one ShopeeDiscoveryAdapter authority only.
  - >
    TASK-182 candidate 94c4e5105e593b9136f186882daacb466c9a304d remains blocked historical
    evidence. TASK-186/RUN-186-003 remains blocked historical evidence with no source candidate.
  - >
    The Human sampling intents remain exactly `bình giữ nhiệt inox`, `bàn phím cơ`, and
    `chuột không dây`. TASK-188 must perform new live observations after TASK-187 publication.

