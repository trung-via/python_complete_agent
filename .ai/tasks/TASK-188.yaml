non_goals:
  - Modify production Python, public APIs, dependencies, AIOS pin, worker surfaces, browser/session
    implementation, discovery/parsing, normalization, scoring, ranking, approval, persistence,
    retrieval/RAG, product truth, CLI, provider/model, scheduler, or background services.
  - Continue, repair, publish, copy, import, or rehabilitate TASK-182 or TASK-186 evidence.
  - Add velocity/history, affiliate, creator/video, competition, semantic Contentability, trend,
    LLM/provider, embeddings, or any new marketplace fact.
  - Use ranking, score, decision band, approval, or evaluator output to select the live cohort.
  - Define a quality threshold, winner, recommendation, approval, or automatic enrichment priority.
  - Use sold_count == price or another cross-field coincidence as a cleanup or rejection heuristic.
  - Claim TikTok, cross-platform, all-Shopee, longitudinal, affiliate, creator, competition, or
    semantic Contentability coverage beyond the exact frozen cohort.
  - Re-fetch marketplace evidence during canonical Runtime verification.
  - Open P6.2, P6.4, P6.5, or P6.6, or pre-authorize later P7 enrichment work.
  - Push, merge, publish, or mutate main from Executor execution.

constraints:
  hard:
    - >
      TASK-188 changes zero production Python. Changed-files truth must remain within exactly the
      six paths in scope.modify; fixture/test code must never be imported by src/.
    - >
      Implementation-time capture uses the existing authenticated browser/session boundary and the
      existing ShopeeDiscoveryAdapter directly from published TASK-187 source. Human session setup
      remains external. If the required session is not usable, fail closed rather than changing
      methodology or silently retrying through a different route.
    - >
      Capture exactly three NEW DiscoveryBatch values, once each and in this exact order:
      `bình giữ nhiệt inox`, `bàn phím cơ`, `chuột không dây`. Each call uses exact
      DiscoveryRequest(query=<query>, max_candidates=5, max_pages=1, locale="vi-VN") and an explicit
      timezone-aware observed_at. Do not rewrite, translate, expand, replace, or choose easier queries.
    - >
      Each batch must have platform shopee, the exact query, pages_examined == 1, exactly five
      ProductCandidateSnapshot values, and no duplicate candidate_id. Across all batches, all fifteen
      candidate_id values and all fifteen URLs must be pairwise distinct. Any blocked, empty, short,
      duplicate, malformed, or otherwise invalid bounded result fails closed without extra pages,
      changed queries, synthetic observations, historical cohort reuse, or score-conditioned selection.
    - >
      Freeze accepted live batches only through existing public DiscoveryBatch.to_dict() projections
      in tests/fixtures/p7_1_winning_product_coverage/baseline.json. Do not hand-edit, normalize,
      enrich, fill missing values, infer facts, or copy values from TASK-182/TASK-186.
    - >
      The fixture records provenance for TASK-185 source
      6b03dc14f88ddb98baeb6ae726f0dd913b323ba1, TASK-187 source
      857e6b5d0009e9327e1a92d5f62b91432e28f150, blocked TASK-182 candidate
      94c4e5105e593b9136f186882daacb466c9a304d, and blocked TASK-186/RUN-186-003 with
      no source candidate. Provenance metadata must not alter marketplace values or evaluator output.
    - >
      baseline.json is the sole baseline descriptor. It is deterministic compact JSON, UTF-8 without
      BOM, schema p7_1_winning_product_coverage_baseline, version 1, sort_keys=True,
      separators=(",", ":"), exactly one trailing newline, and contains only fixed methodology /
      provenance metadata, the three exact DiscoveryBatch projections, one evaluated_at, and one
      exact projected TASK-181 report.
    - >
      Persist the fixture directly as UTF-8 file content. Do not use console text output as an
      intermediate serialization boundary. Offline replay must validate exact canonical fixture bytes.
    - >
      evaluated_at equals the maximum exact observed_at among the three frozen batches. Offline replay
      recomputes that maximum and requires exact equality; it must not read wall-clock time.
    - >
      A private integration-test loader reconstructs candidates only from exact frozen public fields,
      parsing only ISO observed_at back to datetime. Reconstructed candidate.to_dict() must exactly
      equal the frozen mapping before evaluation. The loader is not a reusable production codec.
    - >
      Build the cohort by concatenating all five candidates from each batch in exact query and candidate
      order. Require exactly fifteen exact ProductCandidateSnapshot values.
    - >
      Call TASK-181 evaluate_winning_product_coverage exactly once for the complete cohort with exact
      evaluated_at and policy=None. Baseline replay must not directly call scorer, normalizer, ranker,
      discovery, adapters, or private evaluator helpers.
    - >
      Project the report without recomputing score or coverage: exact evaluated_at; exact candidate_id
      and score.to_dict(); zero/partial/full categories in evaluator order; exact missing factual signal
      names; ordered category counts; and ordered decision-band counts. Offline replay requires exact
      equality with the frozen report snapshot.
    - >
      No quality threshold exists. Any valid measured distribution passes regardless of scores,
      decision bands, category coverage, sold_count availability, or missing-signal prevalence.
    - >
      Add docs/PHASE_7_P7_1_REAL_EVIDENCE_COVERAGE_BASELINE.md with exact methodology, prerequisites,
      blocked-predecessor non-reuse, measured TASK-181 report, bounded sample claims, and explicit
      separation between observed evidence prevalence and economic value.
    - >
      Update P7.0 documentation and both canonical roadmaps to record TASK-187 CLOSED/PUBLISHED at
      857e6b5d0009e9327e1a92d5f62b91432e28f150, preserve TASK-182 and TASK-186 as BLOCKED /
      UNPUBLISHED, record TASK-188 as current P7.1 work, preserve existing P6 states, and keep any
      post-baseline improvement choice as a separate Brain/Human evidence interpretation.
    - >
      Runtime verification is fully offline and deterministic: zero live marketplace/browser work,
      provider calls, wall-clock dependence, random values, mutable persistence, or external discovery.
      Existing evaluator, scoring, ranking, orchestration, Shopee parsing/discovery, and browser/CDP
      offline regressions remain green.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      Zero production Python changes; exactly one fresh post-TASK-187 three-query, fifteen-candidate
      Shopee cohort is frozen using existing discovery authority with no historical evidence reuse.
  - id: AC2
    condition: >
      Exact public batch/snapshot projections and deterministic provenance are preserved without
      synthetic enrichment, missing-value fill, retries, or methodology changes.
  - id: AC3
    condition: >
      Offline replay losslessly reconstructs all fifteen snapshots, derives exact evaluated_at, and
      calls TASK-181 evaluator exactly once with policy=None and no second scoring/evaluation authority.
  - id: AC4
    condition: >
      baseline.json freezes the exact projected TASK-181 report and deterministic replay matches it.
  - id: AC5
    condition: >
      No post-hoc anomaly cleaning, threshold, winner declaration, approval, or automatic enrichment
      selection is introduced.
  - id: AC6
    condition: >
      P7.1 documentation records the bounded measured baseline and separates prevalence from economic
      value while preserving TASK-182/TASK-186 as blocked historical evidence.
  - id: AC7
    condition: >
      P7.0 documentation and both canonical roadmaps correctly record TASK-181/182/185/186/187/188
      states and preserve existing P6 closure/deferred states.
  - id: AC8
    condition: >
      Runtime verification is offline/deterministic; focused baseline and existing regressions pass,
      git diff --check passes, unresolved is empty, and changed-files truth stays within scope.modify.
  - id: AC9
    condition: >
      The committed fixture is direct canonical UTF-8 output and exact fixture bytes are validated.

