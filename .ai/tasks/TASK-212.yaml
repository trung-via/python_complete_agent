      Preserve roadmap authority exactly: owner BRAIN, purpose CROSS_CHAT_PLANNING_BOOKMARK,
      engineering_truth false, auto_advance_from_runtime_or_worker_state false, and
      priority_change_owner HUMAN.
    - >
      Keep AIOS_FULL_DOWNSTREAM_ADOPTION_AND_GOVERNANCE_REBUILD as the sole ACTIVE track until
      the later closure task is independently completed and published.
    - >
      Reconcile PROJECT_CONTRACT_REBUILD to DONE using exact TASK-210 provenance: task_id
      TASK-210, reviewed/source-published source SHA
      399ffe4d38d31f7882d22824ba9c27781b9a0974, RUN-210-002, REVIEW-210-001 PRIMARY PASS.
      The planning record must not imply completion from candidacy or review alone; completion is
      effective because the exact reviewed candidate was published to canonical main.
    - >
      Record TASK-211 Product Contract v2 as the current Product Contract authority using exact
      source SHA 15cc092d0ea86cd9bce7baed0d32bc3575fa4b08 and REVIEW-211-001 PRIMARY PASS,
      while preserving TASK-199 as immutable historical Product Contract lineage. Do not rewrite
      the TASK-199 completed record into TASK-211 or imply TASK-199 was invalid.
    - >
      Remove PROJECT_CONTRACT_REBUILD from pending_commitments because exact canonical evidence
      now proves it complete. pending_commitments must then contain exactly one NOT_DONE item:
      GOVERNANCE_FOUNDATION_CLOSURE_AND_P7_RETURN / Governance Foundation closure and return to
      P7 product roadmap.
    - >
      Set the unique global next milestone to GOVERNANCE_FOUNDATION_CLOSURE_AND_P7_RETURN with
      status NEXT and matching title. There must remain exactly one NEXT status in planning
      state.
    - >
      Preserve TASK-191 product_checkpoint exactly, including source SHA
      40da098b3b0dcf3d1994fc510dd55717b81a2f67 and status DONE. This TASK must not choose a P7.2
      collector, enrichment strategy, business threshold, winner, implementation direction, or
      other post-baseline product work.
    - >
      Preserve all completed AIOS adoption/conformance milestones and prerequisite migration
      lineage exactly, including TASK-204 through TASK-209 semantics and the active pin
