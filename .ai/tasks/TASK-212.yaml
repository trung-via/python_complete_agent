non_goals:
  - >
    Modify, reinterpret, amend, or reformat the Manifesto, Constitution, Product Contract,
    Project Contract, product roadmap documents, TASK contracts, AIOS adoption/conformance
    state, or any historical TASK/RUN/RESULT/FAILURE/REVIEW/REMEDIATION/REPAIR artifact.
  - >
    Close GOVERNANCE_FOUNDATION_CLOSURE_AND_P7_RETURN, declare the Governance Foundation
    closed, switch the active track to P7, or select the next P7 product implementation.
    Those remain later Brain-owned work after this reconciliation is reviewed and published.
  - >
    Reopen or redesign TASK-210 or TASK-211, change their approved prose, or treat roadmap
    reconciliation as authority to alter current Governance Foundation semantics.
  - >
    Rewrite TASK-199 history or replace its historical completed provenance with TASK-211.
    Current-authority provenance and historical provenance must remain distinguishable.
  - >
    Modify the AIOS-renew dependency pin, worker surfaces, Brain ingress, GitHub carriers,
    Runtime, Executor adapters, Reviewer transport, Publisher, publication workflow, or upstream
    AIOS-renew source.
  - >
    Implement or change Product Intelligence, Commerce Opportunity Intelligence, Media/Creative
    Intelligence, Distribution Intelligence, Commerce Operations Intelligence, discovery,
    scoring, ranking, recommendation, approval, evidence, identity, catalog, persistence,
    retrieval/RAG, causal inference, experimentation, marketplace/browser/provider behavior,
    or any production commerce capability.
  - >
    Add automatic roadmap advancement, a planner, router, daemon, policy engine, lifecycle
    reducer, retry/fallback mechanism, or new canonical authority.
  - >
    Push, publish, merge, or mutate canonical main from Executor implementation execution.

