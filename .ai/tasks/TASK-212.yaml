    - >
      Verification must be deterministic, offline, non-interactive, and independent of GitHub/
      network, marketplace/browser/CDP, provider/LLM, Drive, wall-clock, random/UUID, secrets, or
      mutable external state.
    - Do not push from Executor implementation execution.

acceptance:
