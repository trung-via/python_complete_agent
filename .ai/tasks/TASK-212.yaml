    - >
      Extend the focused roadmap regression so it distinguishes historical transition provenance
      from current global planning state. The test must prove: one ACTIVE track; one global NEXT;
      pending suffix contains only GOVERNANCE_FOUNDATION_CLOSURE_AND_P7_RETURN; PROJECT_CONTRACT_REBUILD
      has exact TASK-210 completion provenance; TASK-211 is recorded as current Product Contract v2
      authority without erasing TASK-199 history; TASK-191 checkpoint is unchanged; and Runtime/
      worker state has no auto-advance authority.
    - >
      Only .ai/roadmap-state.yaml and tests/aios_bridge/test_aios_governance_state.py may change.
      Any need to alter governance documents, product roadmaps, AIOS adoption/conformance state,
      dependency pin, workers, workflows, historical artifacts, or production source fails closed
