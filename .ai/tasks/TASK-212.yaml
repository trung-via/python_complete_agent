    condition: >
      Roadmap authority remains Brain-owned/non-engineering; AIOS_FULL_DOWNSTREAM_ADOPTION_AND_GOVERNANCE_REBUILD
      remains the sole ACTIVE track; TASK-191 P7.1 checkpoint and exact active AIOS pin lineage are unchanged.
  - id: AC2
    condition: >
      PROJECT_CONTRACT_REBUILD is recorded DONE with exact TASK-210 / RUN-210-002 /
      REVIEW-210-001 and source SHA 399ffe4d38d31f7882d22824ba9c27781b9a0974 publication provenance.
  - id: AC3
    condition: >
      TASK-211 / REVIEW-211-001 and source SHA 15cc092d0ea86cd9bce7baed0d32bc3575fa4b08
      are recorded as current Product Contract v2 authority while TASK-199 historical Product Contract
      completion remains preserved and distinguishable.
  - id: AC4
    condition: >
      GOVERNANCE_FOUNDATION_CLOSURE_AND_P7_RETURN is the single global NEXT and the only remaining
      NOT_DONE pending commitment; this TASK neither closes it nor selects post-P7.1 product work.
  - id: AC5
    condition: >
      Historical AIOS transition/provenance fields remain historically accurate rather than being
      rewritten to mirror the new global NEXT; adoption/conformance state and the exact dependency pin are unchanged.
  - id: AC6
    condition: >
      Only the two authorized files change; focused deterministic roadmap regression and git diff --check
      pass with zero unresolved items.

