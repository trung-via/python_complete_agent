      Roadmap state records TASK-196 / PYTHON_AGENT_CONSTITUTION DONE with exact source SHA
      4f6d91858c93192f497342315c4650e30b0a2718, preserves TASK-194/TASK-192 completion and TASK-191
      product checkpoint, and remains explicitly Brain-owned non-engineering planning state.
  - id: AC2
    condition: >
      Governance Foundation remains the sole ACTIVE track, Python Agent Product Contract is the
      single NEXT milestone, and the remaining pending commitments are exactly Product Contract and
      ChatGPT Project Contract reconciliation in order with no duplicate completed/pending milestone.
  - id: AC3
    condition: >
      TASK-101 and TASK-103 remain visible BLOCKED_PENDING_UPSTREAM and non-blocking for the current
      track; exact-pin discipline and mutable-main rejection remain unchanged.
  - id: AC4
    condition: >
      The focused roadmap regression preserves the transition-safe completed-prefix plus
      pending-suffix partition, pins exact TASK-196/TASK-194/TASK-192 completion provenance, proves
      exactly one ACTIVE/one NEXT, and preserves the no Runtime/worker roadmap auto-advance boundary.
  - id: AC5
    condition: >
      Only `.ai/roadmap-state.yaml` and `tests/aios_bridge/test_aios_governance_state.py` change;
      required offline verification and `git diff --check` pass with zero unresolved items.

