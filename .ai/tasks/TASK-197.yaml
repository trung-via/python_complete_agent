task_id: TASK-197
revision: 1

goal: >
  Reconcile the canonical Python Agent roadmap after reviewed and source-published TASK-196,
  record the Python Agent Constitution milestone as DONE with exact source provenance, advance the
  unique Governance Foundation NEXT milestone to Python Agent Product Contract, and keep the
  transition-safe Governance sequencing regression correct without granting Runtime or workers any
  roadmap auto-advance authority.

problem: >
  TASK-196 is semantically PASS and its exact reviewed source candidate
  4f6d91858c93192f497342315c4650e30b0a2718 has been source-published to canonical main. The
  Brain-owned roadmap bookmark intentionally still shows Python Agent Constitution as NEXT because
  TASK-196 forbade Executor implementation from advancing planning state. The focused Governance
  regression introduced by TASK-195 is already transition-safe for the completed-prefix plus
  pending-suffix sequence, but it does not yet pin TASK-196 completion provenance. Perform one
  narrow Brain-authorized reconciliation that records Constitution completion, advances Product
  Contract to NEXT, and extends exact provenance checks without changing product or AIOS semantics.

assumptions:
  - >
    Canonical main at authoring is 4f6d91858c93192f497342315c4650e30b0a2718, the exact
    TASK-196 source candidate reviewed PASS by REVIEW-196-001 and source-published by the
    repository-owned publication workflow.
  - >
    TASK-196 established `docs/PYTHON_AGENT_CONSTITUTION.md` as the canonical Constitution and
    highest enforceable Python Agent governance layer after publication. This TASK does not revise
    Constitution semantics.
  - >
    `.ai/roadmap-state.yaml` is Brain-owned cross-chat planning state, explicitly not engineering
    truth, and Runtime/worker state has no auto-advance authority.
  - >
    Human has not superseded the agreed Governance Foundation order: Manifesto, Constitution,
    Python Agent Product Contract, then ChatGPT Project Contract reconciliation.
  - >
    The exact downstream AIOS runtime authority remains
    `aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@2599202afedb0622e9e9bdc7b5a15f34da01cc27`.

scope:
  inspect:
    - .ai/roadmap-state.yaml
    - tests/aios_bridge/test_aios_governance_state.py
    - docs/PYTHON_AGENT_MANIFESTO.md
    - docs/PYTHON_AGENT_CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/tasks/TASK-195.yaml
    - .ai/tasks/TASK-196.yaml
    - .agents/skills/aios-worker/requirements-aios-renew.txt
  modify:
    - .ai/roadmap-state.yaml
    - tests/aios_bridge/test_aios_governance_state.py

non_goals:
  - >
    Author, draft, or define the Python Agent Product Contract or ChatGPT Project Contract
    reconciliation in this TASK.
  - >
    Modify the Manifesto, Constitution, Product Intelligence behavior, marketplace/browser/session
    logic, scoring/ranking, approval, identity, persistence, retrieval/RAG, product-truth
    reconciliation, provider/model behavior, Media Intelligence, Distribution Intelligence,
    Commerce Operations, or any commerce feature.
  - >
    Modify AIOS adoption state, dependency pin, worker surfaces, Runtime, Unified State/Human
    Surface, correction/repair/publication semantics, Executor selection, or upstream AIOS state.
  - >
    Mark TASK-101 or TASK-103 adopted, make them block Governance Foundation, or follow mutable
    AIOS-renew main.
  - >
    Add a planner, automation loop, second lifecycle reducer, roadmap daemon, governance runtime,
    or any Runtime/worker ability to advance Brain-owned planning state.
  - >
    Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      `.ai/roadmap-state.yaml` must keep `PYTHON_AGENT_GOVERNANCE_FOUNDATION` as the sole ACTIVE
      track and preserve `authority.owner: BRAIN`, `engineering_truth: false`,
      `auto_advance_from_runtime_or_worker_state: false`, and `priority_change_owner: HUMAN`.
    - >
      Add an exact completed milestone for TASK-196 under the Governance Foundation with
      `milestone_id: PYTHON_AGENT_CONSTITUTION`, status DONE, title `Python Agent Constitution`, and
      source SHA `4f6d91858c93192f497342315c4650e30b0a2718`. Preserve the existing TASK-194 Manifesto and
      TASK-192 completion records and the TASK-191 product checkpoint unchanged.
    - >
      The unique `next` milestone must become `PYTHON_AGENT_PRODUCT_CONTRACT` / `Python Agent Product
      Contract` with status NEXT. Python Agent Constitution must leave `pending_commitments` because
      canonical evidence now marks it DONE.
    - >
      `pending_commitments` must contain exactly the remaining Governance Foundation suffix, in
      order: `PYTHON_AGENT_PRODUCT_CONTRACT`, `CHATGPT_PROJECT_CONTRACT_RECONCILIATION`, each with
      status NOT_DONE. No completed milestone may remain duplicated in the pending set.
    - >
      TASK-101 and TASK-103 remain `BLOCKED_PENDING_UPSTREAM` and explicitly non-blocking for the
      current Governance Foundation track. Their migration gate and exact-pin discipline remain
      unchanged.
    - >
      Preserve the transition-safe sequence invariant in
      `tests/aios_bridge/test_aios_governance_state.py`: ordered completed Governance milestones plus
      ordered pending commitments must form exactly
      `PYTHON_AGENT_MANIFESTO -> PYTHON_AGENT_CONSTITUTION -> PYTHON_AGENT_PRODUCT_CONTRACT ->
      CHATGPT_PROJECT_CONTRACT_RECONCILIATION`; there must be no duplicate IDs; every completed
      Governance milestone must be DONE with canonical source provenance; every pending item must be
      NOT_DONE; and `next.id` must equal the first pending Governance commitment.
    - >
      Extend the focused regression to pin the exact TASK-196 Constitution completion evidence
      (`task_id: TASK-196`, `milestone_id: PYTHON_AGENT_CONSTITUTION`, source SHA
      `4f6d91858c93192f497342315c4650e30b0a2718`) while retaining exact TASK-194 and TASK-192
      completion evidence, one ACTIVE track, one NEXT state, visible non-blocking TASK-101/TASK-103,
      and the no-auto-advance planning authority boundary.
    - >
      Do not weaken the regression into YAML parse coverage or hard-code Product Contract as a
      permanent NEXT. It must remain valid when a later fresh Brain reconciliation legitimately
      moves another Governance milestone from pending to completed using the same schema and
      invariants.
    - >
      Keep `docs/PYTHON_AGENT_MANIFESTO.md`, `docs/PYTHON_AGENT_CONSTITUTION.md`,
      `docs/CHATGPT_PROJECT_CONTRACT.md`, `.ai/aios-adoption-state.yaml`, product roadmaps,
      production source, existing domain tests, and the AIOS pin unchanged. Any discovered need to
      widen scope fails closed for separate Brain review.
    - >
      Verification must be deterministic and offline: no GitHub/network, marketplace, browser/CDP,
      provider/LLM, Drive, wall-clock, random/UUID, or mutable external state.

