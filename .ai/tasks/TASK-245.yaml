  TASK-244 completed through repair RUN-244-002 and REVIEW-244-001, and exact reviewed candidate
  bc4c48de89129583f024ab622051ea322f9ff5ea is canonical main. TASK-244 reconciled the sole
  generation-5 Human-operated diagnostic attempt as consumed FAIL_CLOSED /
  NO_BOUNDED_PDP_ROOT with the immutable schema-version-2 artifact, then advanced the active
  diagnostic contract to schema version 3 with a bounded title_local_topology_probe. V3 retains
  existing root/title/price/action selectors and root-selection semantics, adds only bounded
  local observability for at most six title ancestors and at most 300 descendant observations
  per ancestor, separates commerce-semantic action hints from generic native/role controls and
  pointer-only interaction, persists no raw marketplace values/text, remains one evaluate /
  zero interaction / light-DOM-only, and leaves generation 6 unauthorized. Canonical roadmap
  now hands control to
  HUMAN_BRAIN_FRESH_GENERATION_6_TITLE_LOCAL_COMMERCE_OBSERVABILITY_DIAGNOSTIC_AUTHORIZATION.
  The smallest justified next step is authorization-only: one fresh Human-operated generation-6
  attach-only invocation against the same exact listing using the exact reviewed/published
  TASK-244 source.

