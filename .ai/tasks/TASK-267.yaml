  inspect:
    - docs/PYTHON_AGENT_MANIFESTO.md
    - docs/PYTHON_AGENT_CONSTITUTION.md
    - docs/PYTHON_AGENT_PRODUCT_CONTRACT.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/tasks/TASK-266.yaml
    - .ai/tasks/TASK-229.yaml
    - .ai/roadmap-state.yaml
    - docs/PHASE_6_P6_1_LIVE_CAPTURE_CHECKPOINT.md
    - docs/PHASE_7_P7_3_DECISION_CONTEXT_OPPORTUNITY_HYPOTHESIS.md
    - docs/PHASE_7_P7_4_TIKTOK_AFFILIATE_EVIDENCE_PROFILE.md
    - docs/PHASE_7_P7_5_VALUE_OF_INFORMATION_PLANNING.md
    - docs/PHASE_7_P7_6_MARKET_TEST_FUNNEL_EVIDENCE.md
    - docs/PHASE_8_P8_2_PRE_ACTION_EVIDENCE_ACQUISITION_PLAN.md
    - docs/PHASE_8_P8_3_MANUAL_WAVE_1_EVIDENCE_CONTRIBUTION_AUTHORIZATION.md
