task_id: TASK-267
revision: 1

goal: >
  Canonicalize the Human-approved one-shot authorization to inspect authenticated TikTok
  Affiliate economics for exactly one selected TikTok Shop Vietnam listing. Authorize one
  Human-operated external lookup attempt for only affiliate eligibility, affiliate commission
  rate, and estimated commission value, followed by mandatory Human review. Preserve all
  evidence, truth, decision, market-test, spend, and automation boundaries. TASK-267 itself
  performs no live lookup and acquires no evidence.

problem: >
  Exact reviewed TASK-266 revision 1 is published at
  96016e7601ae5d8b45d42376b4a16686abf0e15b after RUN-266-002 and REVIEW-266-001.
  It records eight Human-approved planning inputs, keeps quality_constraints and risk_constraints
  UNSET, preserves affiliate_economics NOT_ESTABLISHED and MARKET_TEST_READINESS_NOT_ESTABLISHED,
  and hands planning only to HUMAN_BRAIN_AUTHENTICATED_AFFILIATE_ECONOMICS_ACQUISITION_AUTHORIZATION.
  Human has now explicitly approved a bounded one-shot authenticated lookup for the exact listing.
  The highest-decision-impact unresolved marketplace information gap is exact-listing affiliate
  eligibility, commission rate, and estimated commission through a legitimate authenticated
  Affiliate source. The repository needs a durable authorization boundary without creating a
  general authenticated collector, reopening broad Wave-1, or converting a Human observation
  directly into canonical evidence or market-test authority.

assumptions:
  - >
    Canonical main at TASK-267 authoring is exactly
    96016e7601ae5d8b45d42376b4a16686abf0e15b.
  - >
    TASK-266 revision 1 / RUN-266-002 / REVIEW-266-001 is the exact reviewed and published
    source authority for this authorization decision.
  - >
    The exact case remains context_id p8-pilot-001-led-motion-tiktok-vn, TikTok Shop Vietnam
    source ID 1731381331718341815, stable listing reference
    https://shop.tiktok.com/vn/pdp/den-led-cam-bien-chuyen-dong-3-che-do-sang-sac-usb-c/1731381331718341815,
    with SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY preserved.
  - >
    Human-approved planning inputs from TASK-266 remain unchanged: budget 5000000 VND hard
    ceiling; duration 14 days; initial at-risk tranche 750000 VND with mandatory Human/Brain
    review before additional exposure; creator/affiliate cumulative settled contribution margin
    threshold GT_0_VND; target audience "người trẻ có thời lượng sử dụng mạng xã hội cao";
    risk acceptance 15 percent of budget / maximum accepted economic loss 750000 VND; day-7
    checkpoint and day-14 final review. quality_constraints and risk_constraints remain UNSET.
  - >
    Affiliate eligibility, affiliate commission rate, estimated commission, actual settled
    commission, refunds, and attributable pilot costs are not established by TASK-266.
  - >
    Historical P6/P8 planning establishes that authenticated marketplace interaction is a
    Human/operator-owned external operation. AIOS engineering RUNs and Runtime verification remain
    deterministic and offline. Login/session/CAPTCHA preparation remains Human-owned.
  - >
    Historical TASK-229/P8.3 is not reopened wholesale. TASK-267 is a narrower current
    authorization for exactly three affiliate-economics observations and exactly one selected
    listing. It does not authorize the historical broader 11-field Wave-1 set.
  - >
    P7.3 remains sole owner of DecisionContext and OpportunityHypothesis; P7.4 remains sole owner
    of TikTokAffiliateEvidenceProfile; P7.5 remains sole owner of Value-of-Information planning;
    P7.6 remains sole owner of market-test evidence; P7.7 remains sole owner of winner validation;
    P8.0 remains sole owner of decision-loop composition. Product Intelligence ownership remains
    unchanged.

