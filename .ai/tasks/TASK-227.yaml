task_id: TASK-227
revision: 1

goal: >
  Canonicalize the Human-selected first real-commerce pilot case after P8.0 without
  pretending that selection is marketplace evidence, Product Intelligence approval,
  test authorization, action authority, or a completed real pilot. Freeze only the
  stable external listing reference, decision framing, falsifiable opportunity
  hypothesis framing, known unknowns, and the Human/Brain handoff required before
  any live evidence acquisition or market-test action.

problem: >
  TASK-226 / P8.0 is exactly published and canonical main is
  a9429a5db859ebc6fe7e5fea19aaf17ee11d0d3e. Its canonical handoff requires fresh
  Human/Brain selection of one actual commerce decision case before any future
  pilot work. The Human has now explicitly selected one exact TikTok Shop Vietnam
  listing for the first pilot: product label "Đèn LED Cảm Biến Chuyển Động Tự Động
  Bật Tắt Điều Chỉnh 3 Chế Độ Sáng" and TikTok Shop source product/listing ID
  1731381331718341815. The repository must durably record this selection and its
  semantic boundary before live acquisition or test authorization is designed.

assumptions:
  - Canonical main at authoring is a9429a5db859ebc6fe7e5fea19aaf17ee11d0d3e, the exact reviewed and published TASK-226 / P8.0 source candidate.
  - P8.0 is DONE; next_milestone is null; pending_commitments is empty; actual_real_decision_case is null before this Human selection is canonicalized.
  - Human explicitly selected the product concept and then supplied one exact TikTok Shop Vietnam listing URL whose stable path identity contains source product/listing ID 1731381331718341815.
  - Human has not yet authorized evidence acquisition, affiliate participation, spend, traffic, content publication, campaign creation, market testing, or any other external action.
  - Human has not supplied budget, exposure limits, success thresholds, failure thresholds, contribution-margin floor, test duration, audience, creative, or other action constraints. TASK-227 must not invent them.
  - The stable selected listing reference for planning is https://shop.tiktok.com/vn/pdp/den-led-cam-bien-chuyen-dong-3-che-do-sang-sac-usb-c/1731381331718341815. Tracking/query parameters from the Human-supplied URL are intentionally excluded from the durable planning reference because they are navigation/attribution parameters rather than the selected listing path.
  - The stable external listing reference is source identity only. SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY remains preserved.
  - The Human-supplied product label is a selection label, not independently verified live marketplace truth.
  - No current price, shop, sold count, rating, reviews, commission, creator count, video count, velocity, contentability, audience fit, competition state, stock, variant economics, or other live attribute is asserted by this task.
  - Similar or same-concept listings are not evidence for this exact selected listing.
  - Existing TikTokDiscoveryAdapter and TikTokScrapeTool are capabilities, not authority to run them for this pilot.
  - P7.3 remains the sole semantic owner of DecisionContext and OpportunityHypothesis. TASK-227 documents the intended caller-supplied real-case framing; it does not introduce another constructor or owner.
  - P7.4 remains the sole owner of TikTokAffiliateEvidenceProfile; P7.5 remains the sole owner of VOI planning; P7.6 remains the sole owner of market-test evidence; P7.7 remains the sole owner of winner validation; P8.0 remains the sole composition owner.
  - Current downstream AIOS pin and full downstream conformance remain edd7d8d92d54900c56442bbfcddb8648ec4d2e09 / TASK-207 revision 8.
  - Human has explicitly selected Codex as the current/default Executor.

