non_goals:
  - Modify any production Python module.
  - Modify TikTok URL parsing or execute Wave 0 compatibility work.
  - Run TikTokDiscoveryAdapter, TikTokSourceExtractor, TikTokScrapeTool, browser/CDP, marketplace API, scraper, provider/LLM, Drive or any external acquisition automation.
  - Create an automated collector, manual-input production API, database, evidence store, watcher, scheduler, queue, retry loop, background worker, proxy, stealth or CAPTCHA-solving mechanism.
  - Construct, mutate or persist ProductCandidateSnapshot, SignalEvidence, TikTokAffiliateEvidenceProfile, ValueOfInformationPlan, MarketTestEvidenceProfile or CommerceDecisionLoopCase.
  - Treat a Human transcription, screenshot, image, URL, note or contribution envelope as canonical product identity, canonical truth, Product Intelligence admission, P7.4 profile truth, approval or decision.
  - Accept title similarity, product concept similarity, URL slug text, similar listings or search results as exact-listing binding.
  - Authorize Wave 2 creator/content/audience/competition/velocity acquisition.
  - Authorize market testing, affiliate campaign creation, spend, traffic, content publication, pricing/inventory mutation, outreach or another commerce action.
  - Invent Human-owned economic/test/risk inputs.
  - Declare TEST_READY, winner, recommendation, score, probability, causal effect, VALIDATED_WINNER, SCALABLE_WINNER or commercial success.
  - Automatically create, authorize, mark NEXT or make pending P8.4 or any successor.
  - Modify AIOS adoption/conformance/pin, workflows, Runtime, Reviewer, Publisher or Governance Foundation.

constraints:
  hard:
    - >
      Create exactly one P8.3 Human/Brain authorization document classified
      MANUAL_WAVE_1_EVIDENCE_CONTRIBUTION_AUTHORIZATION_ONLY. The document authorizes
      only Human-operated manual observation and contribution for this exact case. It
      is not evidence itself, not evidence acceptance, not a collector, not a Product
      Intelligence ingestion surface, not P7.4/P7.5 construction, and not market-test
      or action authorization.
    - >
      Bind the authorization exactly to context_id p8-pilot-001-led-motion-tiktok-vn,
      source ID 1731381331718341815 and stable listing reference
      https://shop.tiktok.com/vn/pdp/den-led-cam-bien-chuyen-dong-3-che-do-sang-sac-usb-c/1731381331718341815.
      Preserve SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY.
    - >
      Authorize only these bounded Wave-1 observation names, with omission meaning
      unknown/unrepresented rather than zero or absence:
      variant_descriptor, current_price, original_price, discount_percent,
      affiliate_eligibility, affiliate_commission_rate, estimated_commission_value,
      sold_count, rating, review_count, and inventory_availability.
      Product/source facts or seller media are not required by this manual contribution
      authorization and remain DEFERRED unless a later VOI decision justifies them.
    - >
      Preserve P7.4 organization boundaries. current_price/original_price/discount/
      affiliate_eligibility/affiliate_commission_rate/estimated_commission_value are
      candidate observations relevant to affiliate_economics; sold_count/rating/
      review_count are candidate observations relevant to market_traction.
      variant_descriptor and inventory_availability are provenance/context helpers,
      not new P7.4 dimensions. P8.3 owns none of those semantics.
    - >
      Define a transport-only external manual contribution envelope for a later Human
      operation. It must not be implemented as production code or a repository truth
      model. The envelope must carry only: fixed schema/version identifier; exact
      context_id; exact source_id; exact stable_listing_reference; one timezone-aware
      observed_at supplied by the Human/operator; and an ordered observation list.
      Each observation carries one allowed observation name, one bounded single-line
      displayed_value copied from the visible source without interpretation, one
      source_surface, one exact-listing binding_basis, one safe artifact_ref, and
      optional bounded single-line variant_context. Omitted observations remain unknown.
    - >
      Source surfaces are limited to Human-visible TIKTOK_SHOP_PDP and
      TIKTOK_AFFILIATE_UI. The authorization does not claim that either surface will
      expose every requested observation or that this exact listing is affiliate-eligible.
    - >
      Exact-listing binding must fail closed. An observation may be considered for later
      review only when its binding_basis shows exact source identity through one of:
      exact source ID visibly present; exact stable listing URL visibly present; or a
      direct product link whose visible destination contains the exact source ID.
      Title-only, image-only, seller-only, slug-only, product-concept similarity, search
      ranking or Human memory is insufficient. If exact binding cannot be demonstrated,
      keep that observation unaccepted/unknown.
    - >
      Every observed value must have at least one safe artifact_ref. Multiple observations
      may reference the same safe artifact. Artifact references are opaque provenance
      handles only; P8.3 must not dereference or interpret them automatically.
    - >
      Manual evidence staging remains outside the repository and outside ordinary AIOS
      deterministic verification. A later Human may upload/provide safe screenshots or
      a manually prepared envelope, but conversational uploads, external files and
      staging artifacts are not canonical repository evidence until separately reviewed
      and frozen by a future explicitly-authorized deterministic task.
    - >
      Safety boundary: do not contribute cookies, tokens, headers, credentials, raw HTML,
      browser-profile paths, QR/login codes, account identifiers not needed for the case,
      private messages, exception traces or local absolute paths. Screenshots should be
      cropped/redacted to the minimum product/economics/traction content needed while
      retaining exact-listing binding and displayed value context.
    - >
      Manual CAPTCHA/security-challenge handling remains Human/operator-owned. Human may
      resolve a challenge manually outside AIOS verification. There is zero authorization
      for automated solving, automated retry, proxy, stealth, evasion or bypass. Any
      challenge resolution grants no additional acquisition, evidence, test or action authority.
    - >
      Define a Human review gate after contribution. Review must separately judge:
      exact-listing binding; observation time; displayed-value transcription fidelity;
      variant context where relevant; artifact safety; and whether each observation is
      usable only as source evidence. Review may ACCEPT individual observations, REJECT
      them, or leave them UNKNOWN. Acceptance is not canonical truth, Product Intelligence
      approval, P7.4 profile construction, VOI disposition, TEST_READY or action authorization.
    - >
      Define STOP/DEFER behavior after manual contribution: if affiliate eligibility/
      commission/economics or market-traction evidence is sufficient for Human/Brain to
      stop or defer, do not authorize Wave 0 or Wave 2 merely to complete fields. If
      further decision-changing information is still justified, Human/Brain must make a
      fresh choice among Wave 0 compatibility work, deeper/manual Wave-1 product-source
      evidence, Wave 2, or defining missing Human-owned test constraints. Nothing progresses automatically.
    - >
      Preserve Human-owned inputs as unset unless separately supplied: budget, duration,
      exposure controls, contribution-margin threshold, success/failure criteria, target
      audience, quality constraints, risk constraints, risk acceptance and decision deadline.
      Manual marketplace evidence cannot infer these values.
    - >
      State the intended successor boundary without authorizing it: only after a concrete
      Human contribution and explicit Human review may a fresh deterministic task be
      considered to freeze exactly the accepted safe evidence, bind it to existing P7.3
      semantics, and construct an existing P7.4 profile and/or P7.5 plan if separately
      justified. Rejected/unknown observations must not be repaired, inferred, filled,
      relabeled or promoted into accepted evidence.
    - >
      Update both canonical roadmaps consistently. Preserve all P1-P8.2 history, exact
      P8.0 source a9429a5db859ebc6fe7e5fea19aaf17ee11d0d3e, exact P8.1 source
      d2752d69c701dd2483ea30f52be3385b5137e008, exact P8.2 source
      eb5b09a8208771a25493fd5a68232bb2dd48c700, P6.2 PARKED and P6.4-P6.6
      DEFERRED. Record P8.3 as the explicit Human-selected manual contribution
      authorization commitment. On exact TASK-229 publication P8.3 becomes DONE only as
      authorization; real_pilot_executed remains false; no concrete evidence is claimed
      acquired by the task; next_milestone remains null; pending_commitments remains empty.
    - >
      Update .ai/roadmap-state.yaml as Brain-owned planning state only. After exact
      TASK-229 publication set the handoff destination to
      HUMAN_OPERATOR_MANUAL_WAVE_1_CONTRIBUTION_AND_REVIEW, automatic_next false,
      automatic_p8_4 false, real_pilot_executed false. Record manual contribution scope
      and authorization without embedding live values or artifact contents in roadmap state.
    - >
      Extend governance regression additively to prove exact case/source binding, fixed
      authorized observation names, transport-only external envelope, exact-binding
      fail-closed rule, safe-artifact boundary, Human-only interaction/CAPTCHA boundary,
      Human review gate, no production mutation, no P7.4/P7.5 construction, no Wave 0,
      no Wave 2, no test/action authorization, no automatic P8.4, and the exact Human
      operator handoff.
    - >
      Preserve every production Python module, P7/P8 semantic implementation, AIOS
      adoption/conformance state, downstream pin and Governance Foundation documents
      byte-for-byte. Modify only the five authorized paths.
    - >
      Verification must be deterministic, offline and non-interactive. No TikTok,
      browser/CDP, network, credentials, filesystem evidence staging, uploaded screenshot,
      provider/model, wall clock, random, UUID or mutable external state may be used.
    - >
      Executor performs bounded documentation/planning/governance-test work only,
      commits one candidate and returns one ResultPackage. Runtime retains verification
      authority. Executor must not perform the manual marketplace observation, create
      evidence values, publish, or start another operation.

acceptance:
  - id: AC1
    condition: >
      P8.3 authorizes only one exact-listing Human manual Wave-1 contribution path and
      preserves source identity, evidence ownership, decision and action boundaries.
  - id: AC2
    condition: >
      The authorized observation set is exactly bounded to variant/price/affiliate
      economics/current traction/inventory context; omitted fields remain unknown and
      Wave 2/product-source deep capture remain un-authorized.
  - id: AC3
    condition: >
      The external transport envelope and exact-binding rules are inspectable, require
      timezone-aware observation time plus safe artifact provenance, and cannot treat
      title/image/slug/similar-listing similarity as exact-listing evidence.
  - id: AC4
    condition: >
      Manual operation remains Human-only outside ordinary AIOS verification with no
      automation, parser fix, collector, API/scraper/CDP execution or automated
      CAPTCHA/retry/proxy/stealth/evasion/bypass authority.
  - id: AC5
    condition: >
      A separate Human review gate can accept/reject/leave unknown each contributed
      observation without promoting any contribution into canonical truth, Product
      Intelligence approval, P7.4/P7.5 semantics, TEST_READY or action authority.
  - id: AC6
    condition: >
      Human-owned economics/test/risk inputs remain unset, and post-contribution
      STOP/DEFER/next-evidence choices remain fresh Human/Brain decisions with no
      automatic Wave 0, Wave 2, P8.4 or market test.
  - id: AC7
    condition: >
      Roadmaps and Brain-owned roadmap state close P8.3 only on exact publication,
      preserve real_pilot_executed false and no concrete task-acquired live evidence,
      leave next_milestone null and pending_commitments empty, and hand off to
      HUMAN_OPERATOR_MANUAL_WAVE_1_CONTRIBUTION_AND_REVIEW.
  - id: AC8
    condition: >
      Only the five authorized docs/planning/governance-test paths change; focused
      governance regression and git diff --check pass with zero unresolved items,
      producing one candidate eligible for independent PRIMARY semantic review and
      exact safe publication.

verification:
  required:
    - python -m pytest tests/aios_bridge/test_aios_governance_state.py -q --basetemp=.git/aios/pytest-task229-primary
    - git diff --check
