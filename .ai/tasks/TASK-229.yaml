task_id: TASK-229
revision: 1

goal: >
  Establish P8.3 Manual Wave-1 Evidence Contribution Authorization for the exact
  Human-selected TikTok Shop Vietnam pilot case. Authorize only a bounded Human-operated
  manual observation/contribution path for the smallest Wave-1 evidence set with high
  potential decision value, while keeping the contribution outside canonical repository
  truth until separate Human review and a future deterministic freeze. Do not automate
  marketplace access, fix the TikTok /pdp parser, construct P7.4/P7.5 values, authorize a
  market test, or advance any later P8 milestone automatically.

problem: >
  TASK-228 / P8.2 is exactly published at
  eb5b09a8208771a25493fd5a68232bb2dd48c700 and hands control to
  HUMAN_BRAIN_BOUNDED_EVIDENCE_ACQUISITION_AUTHORIZATION. Human/Brain has now selected
  manual bounded Wave-1 evidence contribution before Wave 0 engineering or automated/live
  collector work because affiliate economics and current market-traction observations can
  materially change the decision without first modifying production code. The repository
  needs a durable, narrow authorization and review boundary so manual evidence can be
  contributed safely, tied to the exact listing, and later accepted or rejected without
  silently becoming product truth, P7.4 evidence profile truth, Product Intelligence
  approval, TEST_READY, or commerce-action authority.

assumptions:
  - Canonical main at authoring is eb5b09a8208771a25493fd5a68232bb2dd48c700, the exact reviewed and published TASK-228 source candidate.
  - P8.2 is DONE only as PRE_ACTION_EVIDENCE_ACQUISITION_PLAN_ONLY; real_pilot_executed is false; live_evidence_acquired is false; next_milestone is null; pending_commitments is empty.
  - Human explicitly selected the manual bounded Wave-1 contribution path before Wave 0 compatibility engineering or automated acquisition.
  - The exact case remains context_id p8-pilot-001-led-motion-tiktok-vn, TikTok Shop Vietnam source ID 1731381331718341815, stable listing reference https://shop.tiktok.com/vn/pdp/den-led-cam-bien-chuyen-dong-3-che-do-sang-sac-usb-c/1731381331718341815.
  - Source identity remains not canonical product identity. Similar listings, title similarity, URL slug text, search-card proxies, historical cohorts and synthetic fixtures cannot substitute for this exact listing.
  - The Human has not authorized Wave 0 parser changes, browser/CDP automation, API/scraper collection, recurring capture, Wave 2, campaign/test execution, spend, traffic, content publication, Product Intelligence approval, or any other commerce action.
  - P7.3 remains sole owner of DecisionContext and OpportunityHypothesis; P7.4 remains sole owner of TikTokAffiliateEvidenceProfile; P7.5 remains sole owner of VOI planning; P7.6 remains sole owner of market-test evidence; P7.7 remains sole owner of winner validation; P8.0 remains sole composition owner.
  - Product Intelligence remains sole owner of ProductCandidateSnapshot, SignalEvidence, discovery, scoring/ranking, approval, identity/catalog, persistence and product-truth semantics.
  - A manual contribution envelope is only an external operational carrier for Human-observed source evidence. It is not a new evidence semantic owner, ProductCandidateSnapshot, SignalEvidence, P7.4 profile, canonical identity, truth store, approval record or decision object.
  - Manual observation means ordinary Human interaction with TikTok Shop/TikTok Affiliate surfaces. It does not authorize AIOS, Codex, browser automation, CDP, scraper/API code, scripts, background workers, retries, proxies, stealth or automated CAPTCHA handling.
  - Human/operator may manually resolve a CAPTCHA/security challenge outside ordinary AIOS verification; resolution itself grants no evidence, collector, test or action authority.
  - Current /vn/pdp/<slug>/<id> parser incompatibility remains unchanged and does not block purely manual exact-listing observation when the Human can directly verify exact source identity.
  - Human-owned budget, duration, exposure limits, contribution-margin threshold, success/failure criteria, target audience, quality constraints, risk constraints, risk acceptance and decision deadline remain unset unless the Human separately supplies them.
  - Current downstream AIOS pin and conformance remain edd7d8d92d54900c56442bbfcddb8648ec4d2e09 / TASK-207 revision 8.
  - Codex remains the Human-selected default Executor.

