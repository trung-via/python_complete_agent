non_goals:
  - >
    Treat RUN-270-001 or its candidate as reviewed, published, canonical, or retrospectively
    authorized by the Human's later approval.
  - >
    Submit REVIEW-270 against the revision-1 candidate, repair RUN-270-001, or hide the
    r1 authority defect inside review/correction.
  - >
    Implement Media/Creative Intelligence production code, create a new domain package,
    generate/transform media, construct creative briefs, select provider/model/storage,
    score creatives, or call LLM/image/video providers.
  - >
    Implement Distribution Intelligence, Commerce Operations Intelligence, a generic
    cross-domain agent, universal commerce score, or cross-domain decision authority.
  - >
    Reopen P8, retry Affiliate access, acquire marketplace evidence, execute market tests,
    spend, publish content, run traffic, or perform commerce action.
  - >
    Reopen Product Intelligence or Commerce Opportunity enrichment merely for completeness.
  - >
    Treat src/images, ProductSourcePack media, or Derived AI Assets precedent as already
    satisfying Media/Creative Intelligence semantics.
  - >
    Modify AIOS pin/adoption/conformance, Brain audit registries, ingress, Runtime, Reviewer,
    Publisher, workflows, or locally patch the deferred audit-enforcement gap.
  - >
    Author TASK-271, implement MCI.0, or commit any MCI.1+ candidate as mandatory work.
  - >
    Import Research Assurance or any other roadmap from noncanonical memory/history.

