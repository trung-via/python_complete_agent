    condition: >
      TASK-270 r2 records the revision-1 Stage-2 authority blocker and unpublished candidate
      accurately, then binds the new explicit Human approval prospectively without retroactive review.
  - id: AC2
    condition: >
      MEDIA_CREATIVE_INTELLIGENCE and MCI.0_DOMAIN_SEMANTIC_FOUNDATION are selected under
      explicit Human authority, while P8 closure and all non-selected roadmap alternatives retain
      their correct bounded semantics.
  - id: AC3
    condition: >
      The required six-way qualitative architecture/value comparison remains present and does
      not use a universal numeric score or imply permanent rejection of deferred domains.
  - id: AC4
    condition: >
      The AIOS Brain two-stage audit authoring-enforcement gap is recorded exactly once as
      non-blocking DEFERRED maintenance with exact downstream pin and upstream-only resolution policy.
  - id: AC5
    condition: >
      MCI.0 is the sole NEXT commitment and defines semantic ownership boundaries without
      treating src/images/ProductSourcePack/Derived AI Assets precedent as existing MCI authority.
  - id: AC6
    condition: >
      No MCI production code, generation/transformation, provider/model selection, scoring,
      Distribution/Operations implementation, enrichment, market test, or commerce action occurs.
  - id: AC7
    condition: >
      Exact reviewed TASK-270 r2 publication leaves pending_commitments exactly
      [MCI.0_DOMAIN_SEMANTIC_FOUNDATION], next_milestone MCI.0_DOMAIN_SEMANTIC_FOUNDATION,
      task_271_preselected false, post_run_engineering_successor null, automatic_progression false,
      priority_owner HUMAN, and handoff HUMAN_BRAIN_MCI_0_TASK_AUTHORING.
  - id: AC8
    condition: >
      Candidate changes exactly the five authorized paths, zero production code, preserves unique
      direct-child YAML keys and immutable prior lineage, is clean, descends from the canonical
      TASK-270 r2 base, and contains no outside-scope mutation.

