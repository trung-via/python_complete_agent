non_goals:
  - Execute TikTok/CDP, rerun the consumed TASK-250 carrier, navigate/refresh/click/type/scroll/search,
    switch variants, create a live diagnostic artifact, authorize or execute generation 8, or
    perform any marketplace operation during TASK-251 engineering.
  - Modify TikTokPdpCollector, exact-PDP parsing/reconciliation, ProductCandidateSnapshot,
    SignalEvidence, the shared DOM-scope resolver, live-pilot carrier, CLI, Playwright
    manager/session lifecycle or any production price admission behavior.
  - Treat operation SUCCESS as current-price validation success, Product Truth, canonical evidence,
    recommendation, ranking, approval, TEST_READY, market-test readiness or commerce-action evidence.
  - Promote original_price 68220.0, null current price, a live class token, data-testid, style,
    font size, font weight, DOM depth, relation, candidate count or diagnostic sample into a runtime
    selector, parser rule, product scalar, price-role authority or hard-coded expected future value.
  - Persist raw price text, full DOM, HTML, arbitrary innerText, cookies, credentials, auth tokens,
    network response bodies or unbounded marketplace content in repository state or V5 artifacts.
  - Copy the external TASK-250 marker/result wholesale into the repository.
  - Create a second diagnostic owner, second price parser, second product observation owner,
    generic crawler framework, duplicate browser lifecycle owner or alternate evidence authority.
  - Repair shop_name, discount_percent, sold_count, rating, review_count, action extraction,
    variants, inventory, Affiliate economics, ranking, recommendation or any field outside bounded
    diagnostic price-role observability.
  - Authorize a new live pilot, automatic retry, automatic validation, generation-8 diagnostic,
    automated public-PDP acquisition, market test, commerce action or successor engineering run.

