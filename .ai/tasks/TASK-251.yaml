task_id: TASK-251
revision: 1

goal: >
  Reconcile the already-completed Human-operated post-TASK250 live TikTok public-PDP validation
  attempt as one consumed OPERATION_SUCCESS / OBSERVED / SESSION_RELEASE_SUCCESS event with exact
  external V2 marker/result provenance and field-level uncertainty, then harden only the existing
  TikTok PDP DOM diagnostic owner from schema V4 to schema V5 with bounded price-role observability.
  Preserve the shared V4 bounded-root semantics, TikTokPdpCollector observation/admission ownership,
  canonical TikTok scalar-price parsing authority, TASK-137 browser lifecycle authority, evidence
  and Product Truth boundaries, and all live acquisition/action closures. TASK-251 performs no live
  TikTok/CDP operation and grants no generation-8 diagnostic attempt.

problem: >
  TASK-250 r2 / RUN-250-003 / REVIEW-250-001 is exactly reviewed and published at
  3b4195b9f81e591697e94b7570450be069861552. It authorized exactly one Human-operated validation
  attempt against the fixed context p8-pilot-001-led-motion-tiktok-vn and source ID
  1731381331718341815, using the exact TASK-249 V2 carrier source
  84739c2a13d9d89ef5379ecba7a9d4b83ed64771 and the distinct TASK-248 collector baseline
  39979020a10b78e1f86c30cf2b704f2f975daec9. The Human completed the non-consuming preflight and
  invoked the carrier exactly once. The external V2 marker and result now show the attempt crossed
  the durable consumption boundary and terminated operation_status SUCCESS, observation_status
  OBSERVED and session_release_status SUCCESS. The snapshot is correctly bound to the exact source
  listing, but current price remains null while original_price is the observed scalar 68220.0; shop,
  discount, sold-count, rating and review-count remain null. This is operation success, not current
  price validation success. The existing collector intentionally admits current-price candidates
  only when deterministic current-role signals exist and admits original-price candidates through
  strike-through or explicit original-role signals; the current live evidence does not justify
  guessing which missing signal, ambiguity, range/variant state, duplicate representation or DOM
  presentation caused current price to remain unknown. The smallest justified work is therefore to
  reconcile the consumed attempt and extend the one existing diagnostic owner with bounded,
  sanitized, non-authoritative price-role signal observability before any collector repair.

