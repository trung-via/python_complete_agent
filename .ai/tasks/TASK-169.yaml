task_id: TASK-169
revision: 2

goal: >
  Close P6.1c Retrieval Stress Benchmark by replaying the published TASK-168 real-evidence
  corpus through the already-published TASK-164 evaluator using six fixed Human-authored
  paraphrase/attribute queries that deliberately increase lexical distance from the original
  listing wording. TASK-169 revision 2 is benchmark/integration work only: it must measure
  exact current TASK-122 behavior without changing retrieval, canonical profiles, evidence,
  identity, ranking, RAG, product truth, or any production Python authority.

problem: >
  Published TASK-168 closed P6.1b and showed exact precision/recall 1/1 for the three
  near-exact product-intent queries, while the broad "shopee" query exposed only the expected
  limit=3 recall ceiling against six relevant variants. That evidence is sufficient to reject
  speculative immediate vector/semantic implementation, but it does not establish whether
  current lexical retrieval remains adequate when Human intent is expressed through paraphrases,
  mixed English/Vietnamese wording, or descriptive attributes that are not copied directly from
  the listing title. TASK-169 revision 1 was authored in parallel to open P6.3 product-truth
  reconciliation, but no RUN-169 was ever admitted. Current explicit Human intent supersedes that
  unexecuted authoring decision: complete one narrow retrieval stress benchmark first, then let
  Brain/Human review the empirical result before deciding whether P6.2 remains parked or deserves
  a bounded improvement experiment. Revision 1 remains preserved in Git history only and must not
  be executed.

assumptions:
  - >
    Canonical python_complete_agent main immediately before TASK-169 revision 2 is
    0a2c66fad53b0e4ee26ecef9ae4538a34777d205, whose only post-TASK-168 product-state change is
    unexecuted TASK-169 revision-1 authoring. No RUN-169, RESULT, FAILURE, REVIEW, FIX, or REPAIR
    lineage exists for revision 1.
  - >
    Published TASK-168 source candidate 0e6626a53c10609a1a7b282d7ca49af33e4d5573 remains the
    authoritative P6.1b real-evidence baseline. Its fixture tree under
    tests/fixtures/p6_1b_real_evidence is immutable published benchmark input.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@32ace104c5cfaa1b7affbaa40157872b1f85147f.
  - >
    TASK-164 remains the sole retrieval-quality evaluator. TASK-122 remains the sole lexical
    retrieval authority. TASK-138/139/140/141, TASK-116/117, TASK-120, and TASK-121 remain the
    published evidence-intake, Human-governed family/variant admission, durability, and canonical
    profile authorities used to replay the exact TASK-168 corpus.
  - >
    Human stress-query relevance labels are fixed by current Human intent before any retrieval
    result is inspected. Executor output, source title overlap, evidence contents, TASK-122 hits,
    measured metrics, provider/model output, or business scores may not alter those labels.
  - >
    P6.2 is conditional. TASK-169 must not automatically authorize semantic/vector work or declare
    lexical retrieval sufficient. After TASK-169 Runtime PASS, semantic PASS, publication, and
    Brain/Human review of the measured stress results, the roadmap decision is made separately.

