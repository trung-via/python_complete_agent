non_goals:
  - Modify any production Python module, dependency, AIOS pin, worker, workflow, CLI, browser,
    discovery, ranking, scraper, ProductSourcePack, intake, identity, approval/admission, catalog,
    persistence, profile, lexical retrieval, RAG, prompt, provider, answer, or evaluator semantics.
  - Modify, rewrite, normalize, relabel, regenerate, or duplicate any file under
    tests/fixtures/p6_1b_real_evidence. TASK-168 published corpus bytes and baseline snapshot are
    immutable source evidence for this stress benchmark.
  - Acquire new Shopee/TikTok evidence, open browser/CDP, use the external TASK-166 capture root,
    read environment-specific marketplace state, access Drive, invoke network/provider accounts,
    or perform live I/O.
  - Add embeddings, vector indexes/databases, ANN, semantic reranking, BM25/FTS/TF-IDF, fuzzy
    matching, synonym expansion, query rewriting, LLM retrieval scoring, fallback behavior, or any
    alternate retrieval implementation.
  - Change TASK-122 limit/matching/normalization/searchable-field/witness/order behavior merely to
    improve stress metrics.
  - Add an acceptance threshold, target score, automatic pass/fail quality gate, weighted metric,
    F1/NDCG/MRR, or an automatic P6.2 activation decision. Low retrieval scores are valid empirical
    findings, not TASK failure.
  - Evaluate grounded-answer prose, citation fidelity, semantic entailment, factual correctness,
    product truth, business relevance, identity correctness, or marketplace quality in P6.1c.
  - Open or implement P6.3 product-truth reconciliation in this revision. TASK-169 revision 1 is
    superseded unexecuted authoring history only.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      TASK-169 revision 2 changes zero production Python. The only executable addition is
      tests/integration/test_p6_1c_retrieval_stress_baseline.py; the only new fixture is one
      descriptor/snapshot file at tests/fixtures/p6_1c_retrieval_stress/benchmark.json.
    - >
      The published TASK-168 fixture tree is read-only benchmark input. Runtime verification must
      fail if any file beneath tests/fixtures/p6_1b_real_evidence differs from its published
      descriptor provenance. Do not copy those source packs into the P6.1c fixture root and do not
      modify TASK-168 benchmark.json. P6.1c benchmark.json must record the exact SHA-256 of the
      published TASK-168 benchmark.json bytes and the repository-relative source fixture path.
    - >
      P6.1c benchmark.json must be deterministic compact UTF-8 JSON with schema
      "p6_1c_retrieval_stress_benchmark", version 1, sort_keys=True, separators=(",", ":"), no BOM,
      and exactly one trailing newline. It must contain only source-baseline provenance, evaluator
      limit, the six fixed Human stress cases, and the exact measured TASK-164 lexical snapshot.
      It must contain no raw source descriptions/media, external paths, secrets, environment values,
      provider output, or mutable timestamps.
    - >
      Use evaluator limit exactly 3 for every case. Define exactly six RetrievalBenchmarkCase values
      in this exact order, with these exact retrieval queries and Human relevance labels:
      1) case_id "p6-1c-001", retrieval_query "bình nước thép không gỉ giữ nóng lạnh",
         relevant_variant_ids ("p6-benchmark-variant-001-001", "p6-benchmark-variant-001-002");
      2) case_id "p6-1c-002", retrieval_query "bình lớn có lọc trà mang đi làm",
         relevant_variant_ids ("p6-benchmark-variant-001-001", "p6-benchmark-variant-001-002");
      3) case_id "p6-1c-003", retrieval_query "keyboard gaming k550 nhiều màu",
         relevant_variant_ids ("p6-benchmark-variant-002-001", "p6-benchmark-variant-002-002");
      4) case_id "p6-1c-004", retrieval_query "bàn phím chơi game có đèn",
         relevant_variant_ids ("p6-benchmark-variant-002-001", "p6-benchmark-variant-002-002");
      5) case_id "p6-1c-005", retrieval_query "mouse bluetooth sạc lại cho laptop",
         relevant_variant_ids ("p6-benchmark-variant-003-001", "p6-benchmark-variant-003-002");
      6) case_id "p6-1c-006", retrieval_query "chuột dùng cho máy tính bảng android",
         relevant_variant_ids ("p6-benchmark-variant-003-001", "p6-benchmark-variant-003-002").
      Questions must be deterministic fixed strings describing the corresponding Human stress intent;
      labels/query/order must not be changed after inspecting retrieval results.
    - >
      Reconstruct the exact six-profile TASK-168 corpus only through published authorities. Replay
      TASK-138 intake once per exact TASK-168 cohort root, TASK-139/140 explicit family approval/admission,
      TASK-141/TASK-116 explicit singleton review/admission with the same fixed family/variant IDs and
      canonical member ordering used by TASK-168, TASK-120 SQLite reload, then TASK-121 profile projection
      with exact one-to-one singleton source-pack binding. This is test-only orchestration and must not
      create a new production helper, shadow profile format, alternate admission path, or new authority.
    - >
      The stress benchmark must create the six exact TASK-164 RetrievalBenchmarkCase values from
      benchmark.json and call evaluate_lexical_retrieval_quality exactly once with the six canonical
      profiles and limit=3. Benchmark code must not call TASK-122 directly, inspect TASK-122 private
      helpers/searchable fields, precompute hits, locally match tokens, or add another retrieval route.
    - >
      Snapshot exact TASK-164 output in P6.1c benchmark.json: ordered TP/FP/FN variant IDs for every
      case, precision/recall as exact [numerator, denominator] pairs, aggregate TP/FP/FN counts, and exact
      micro_precision/micro_recall pairs. Normal verification must recompute from committed TASK-168
      evidence and require exact equality. The snapshot is empirical evidence and must not be edited to
      hide or improve lexical weaknesses.
    - >
      Poor metrics, zero-hit cases, false positives, or false negatives must not fail TASK-169 if they
      are the deterministic current TASK-122 result and are accurately snapshotted. TASK failure is only
      contract/provenance/composition/determinism/verification failure, never low retrieval quality.
    - >
      Add repeated-determinism regression that performs the complete test-only corpus composition and
      stress evaluation twice using fresh tmp_path SQLite catalogs and proves value-equal reports while
      both the published TASK-168 fixture tree and P6.1c descriptor remain byte-identical.
    - >
      Normal Runtime verification must be fully offline and deterministic: zero browser/CDP, marketplace,
      external capture root, environment dependency other than PYTHONPATH, Drive, network, provider/model,
      clock, random/UUID, retry, sleep, subprocess from benchmark code, or filesystem scanning outside
      the exact committed TASK-168 fixture roots and tmp_path.
    - >
      docs/PHASE_6_P6_1_REAL_EVIDENCE_BASELINE.md must be updated only for lifecycle status: TASK-168 is
      CLOSED/PUBLISHED and P6.1b is CLOSED. Preserve its empirical values and interpretation unchanged.
    - >
      docs/PHASE_6_P6_1C_RETRIEVAL_STRESS_BENCHMARK.md must report the exact measured six-case and micro
      metrics, explain that Human labels were fixed before retrieval, distinguish lexical stress from
      semantic/product-truth/business-quality evaluation, and state that no threshold automatically
      authorizes P6.2. It must preserve TASK-122 and TASK-164 as the sole retrieval/evaluation authorities.
    - >
      Update both canonical roadmaps consistently: TASK-168/P6.1b CLOSED/PUBLISHED; TASK-169 revision 1
      preserved as unexecuted superseded authoring history; P6.1c CURRENT with TASK-169 revision 2 as the
      stress-baseline closure candidate; P6.2 GATED / DECISION PENDING until TASK-169 Runtime PASS,
      semantic PASS, publication, and Brain/Human review of measured stress evidence; P6.3-P6.6 remain
      future/deferred and no product-truth authority is yet opened.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      TASK-169 revision 2 changes only the new stress descriptor, offline integration test, lifecycle
      docs, and two roadmaps; zero production Python or prior semantic authority is modified or duplicated.
  - id: AC2
    condition: >
      P6.1c binds immutably to the published TASK-168 benchmark/corpus, records and verifies exact source
      SHA-256 provenance, reuses the existing source packs in place, and never imports live/external evidence.
  - id: AC3
    condition: >
      Exactly six Human-authored stress cases use the fixed query/order/relevant-variant labels above with
      limit=3, and labels are not derived or changed from retrieval/evidence/metrics.
  - id: AC4
    condition: >
      The exact six canonical profiles are reconstructed only through TASK-138, TASK-139/140,
      TASK-141/TASK-116, TASK-120, and TASK-121 with the same family/variant/member semantics as TASK-168.
  - id: AC5
    condition: >
      Stress scoring delegates exactly once to TASK-164 for the six-case corpus; TASK-122 remains reachable
      only through TASK-164 and no local/shadow retrieval or semantic matching exists.
  - id: AC6
    condition: >
      P6.1c benchmark.json snapshots exact per-case and aggregate TP/FP/FN plus Fraction precision/recall,
      and normal offline verification recomputes exact equality from committed evidence.
  - id: AC7
    condition: >
      No metric threshold or automatic roadmap decision exists: weak/zero lexical results are valid measured
      evidence, while P6.2 remains gated pending separate Brain/Human interpretation after publication.
  - id: AC8
    condition: >
      Repeated complete offline execution is deterministic with fresh SQLite catalogs and zero mutation of
      TASK-168 fixtures or the P6.1c descriptor, with no live/external/provider/model/browser/network work.
  - id: AC9
    condition: >
      Phase documentation reports exact stress metrics and authority boundaries; both roadmaps preserve
      TASK-168 closure, TASK-169 rev1 superseded-unexecuted history, P6.1c current rev2, P6.2 decision gate,
      and P6.3-P6.6 deferred state without opening product-truth or semantic-retrieval authority.
  - id: AC10
    condition: >
      Required focused predecessor/baseline/stress tests and git diff check pass with zero unresolved items
      and no changed files outside TASK-169 revision-2 modification scope.

verification:
  required:
    - '$env:PYTHONPATH = ".;src"; python -m pytest tests/integration/test_p6_1b_real_evidence_retrieval_baseline.py tests/integration/test_p6_1c_retrieval_stress_baseline.py tests/product_intelligence/test_retrieval_quality_evaluation.py tests/product_intelligence/test_source_evidence_intake.py tests/product_intelligence/test_canonical_retrieval.py -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - 'git diff --check; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
