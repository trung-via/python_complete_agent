  source_product_id 10374101498 with rendered selection "Model: K550 Trắng Red V4". The
  checkpoint completed with P6.3 LIVE RESULT: PASS only after two distinct live
  ProductSourcePack observations both retained that exact selected-variant fact, TASK-108
