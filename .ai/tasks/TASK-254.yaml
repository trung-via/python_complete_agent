non_goals:
  - >
    Execute TikTok/CDP, invoke the live carrier, create external live marker/result artifacts,
    navigate, refresh, click, type, scroll, search, switch variants or acquire new marketplace
    evidence.
  - >
    Grant or consume a live validation attempt, authorize a Human live invocation, or set live,
    automated acquisition, selector, recommendation, ranking, approval, market-test or commerce
    action authority to a non-NONE value.
  - >
    Modify TikTokPdpCollector, extraction semantics, scalar parsing, DOM-scope resolution, models,
    CLI behavior, Playwright/browser lifecycle or Product Intelligence semantic ownership.
  - >
    Modify AIOS pin, adoption state, conformance state, executor profiles, Brain/Reviewer registry
    files, BP9 workflows/carriers or any TASK-207/TASK-255/TASK-256/TASK-259 engineering lineage.
  - >
    Create a second validation carrier, provenance owner, parser, collector, lifecycle owner,
    alternate carrier-source field or duplicate roadmap authority.
  - >
    Change V2 artifact filenames, schema_version, consumption boundary, terminal sequencing, fixed
    target, failure taxonomy, secret allowlist or cleanup semantics.
  - >
    Rewrite or reinterpret TASK-249/TASK-250/TASK-251/TASK-253 historical facts.
  - >
    Invent, precompute or represent a pending TASK-254 publication SHA through null, sentinel,
    guessed or alternate provenance fields.
  - >
    Add retry/resume/refresh, replacement target, batch, arbitrary target, inferred identity,
    variant switching, selector repair or future successor implementation.

