task_id: TASK-254
revision: 6

goal: >
  Rebind the existing sole Human-operated TikTok public-PDP validation carrier in place from the
  historical TASK-248 collector baseline to the exact reviewed/published TASK-253 collector
  source, while keeping carrier mechanics, collector semantics, browser/session behavior, CLI
  surface and V2 artifact structure unchanged. Canonicalize an exact closed positive current-state
  projection for TASK-254, preserve prior validation/diagnostic facts only through their existing
  historical owners, preserve all post-r4 BP9/TASK-207-r14 downstream state, and grant zero live
  validation authority. Leave validation_carrier_source_sha absent until a later authorization
  binds the exact reviewed/published TASK-254 source.

problem: >
  Revision 5 correctly preserved the valid three-literal carrier rebind, protected post-r4
  BP9/downstream state, separated direct current state from historical records, and required
  validation_carrier_source_sha absence. Fresh adversarial audit found two remaining contract
  ambiguities. First, the current governance suite still has historical TASK-253 assertions that
  intentionally read active_track.current_milestone and direct post_p8_planning_handoff fields, and
  TASK-250 assertions that read consumed TASK-233 facts from the direct current handoff. TASK-254
  must move those assertions to the already-existing nested/completed historical owners without
  weakening or deleting them. Second, revision 5 described the positive current projection by
  semantic categories rather than a closed direct-key contract, leaving room for stale fields to
  be retained as alleged metadata. Revision 6 closes only those contract gaps. It changes no
  product objective, no production delta, no authority, and no verification scope.

