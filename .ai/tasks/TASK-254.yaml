task_id: TASK-254
revision: 5

goal: >
  Rebind the existing sole Human-operated TikTok public-PDP validation carrier in place from the
  historical TASK-248 collector baseline to the exact reviewed/published TASK-253 collector source,
  while keeping carrier mechanics, collector semantics, browser/session behavior, CLI surface and
  V2 artifact structure unchanged. Canonicalize a small positive fresh post-TASK253 current-state
  projection instead of carrying forward execution residue from earlier validation/diagnostic
  generations. Preserve all immutable TASK-249/TASK-250/TASK-251/TASK-253 history and all current
  BP9/TASK-207-r14 downstream-adoption/conformance state. Grant zero live validation authority.
  Leave validation_carrier_source_sha absent until a later authorization binds the exact
  reviewed/published TASK-254 source.

problem: >
  TASK-254 revision 4 was authored before 37 later repository commits that completed BP9
  downstream adoption and current-pin conformance. Five of its seven authorized product/doc paths
  remain byte-identical, and all TASK-253 execution-critical Product Intelligence/browser files
  remain byte-identical to exact TASK-253 publication
  33776f11b20977f46d45d394fa1c56040029b65d. The carrier and its tests also remain byte-identical
  to TASK-249 and still persist POST_TASK248_LIVE_PUBLIC_PDP_COLLECTOR_VALIDATION, TASK-248 and
  source 39979020a10b78e1f86c30cf2b704f2f975daec9. Therefore the provenance defect remains real.
  However .ai/roadmap-state.yaml and tests/aios_bridge/test_aios_governance_state.py now also own
  current BP9/TASK-207-r14 state that revision 4 did not know about. Revision 4 additionally used
  negative cleanup lists against an accumulated post_p8_planning_handoff with many direct fields,
  making omission-prone current/history separation possible. Revision 5 preserves the valid
  three-literal carrier rebind, replaces residue-by-residue cleanup with a positive current-state
  contract, explicitly protects post-r4 BP9/conformance state, and keeps historical nested records
  immutable.

assumptions:
  - >
    Canonical main at authoring is exactly 6ba6c108e6a14bbeaa337769170975aab74560b6.
    TASK-254 revision 4 is authored and unexecuted; no engineering RUN-254 exists.
  - >
    TASK-253 final collector source is exactly
    33776f11b20977f46d45d394fa1c56040029b65d after RUN-253-002 /
    REVIEW-253-002 PASS. Its relevant Product Intelligence/browser implementation files remain
    byte-identical on current main.
  - >
    TASK-249 carrier publication source remains
    84739c2a13d9d89ef5379ecba7a9d4b83ed64771. Current
    src/product_intelligence/tiktok_pdp_live_pilot.py and its dedicated test file remain
    byte-identical to that source before TASK-254 execution.
  - >
    TASK-251 remains the canonical owner of the consumed historical Human validation operation and
    exact V2 marker/result hashes, sizes and SUCCESS/OBSERVED terminal facts.
  - >
    Current active AIOS-renew pin is exactly
    44eee353eda376c9db8cd88d97184d3122651bf5 under EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
    Current downstream conformance is TASK-207 revision 14, successful RUN-207-014,
    REVIEW-207-005 PRIMARY PASS, exact reviewed/published source
    6ba6c108e6a14bbeaa337769170975aab74560b6. BP9 TASK-255 r6, TASK-256 r1,
    TASK-259 r2 and TASK-207 r14 history is current canonical planning/adoption state.
  - >
    P1B Brain/Reviewer registries are ACTIVE and their exact checked-in identities must remain
    unchanged by this product task.
  - >
    Roadmap is Brain planning state rather than engineering truth. The current Human decision to
    harden TASK-254 to revision 5 prospectively supersedes the older revision-4 resume bookmark;
    TASK-254 implementation must publication-gate the durable roadmap reconciliation to revision 5.
  - >
    CAPABILITY_IS_NOT_AUTHORITY, EVIDENCE_IS_NOT_PRODUCT_TRUTH,
    SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY, SNAPSHOT_IS_NOT_TREND,
    AMBIGUOUS_PRICE_IS_NOT_EXACT_PRICE, OPERATION_SUCCESS_IS_NOT_FIELD_VALIDATION_SUCCESS,
    MEASUREMENT_IS_NOT_AUTHORITY and ONE_CAPABILITY_ONE_AUTHORITY remain mandatory.

