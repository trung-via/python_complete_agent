    condition: >
      Exact final TASK-253 lineage through RUN-253-002 / REVIEW-253-002 and published source
      33776f11b20977f46d45d394fa1c56040029b65d is recorded as the new collector baseline.
  - id: AC2
    condition: >
      The sole existing tiktok_pdp_live_pilot carrier is rebound in place to
      POST_TASK253_PAIRED_PRICE_COLLECTOR_VALIDATION, TASK-253 and exact source
      33776f11b20977f46d45d394fa1c56040029b65d, with no second carrier or semantic owner.
  - id: AC3
    condition: >
      V2 artifact filenames, schema shape, create-exclusive consumption boundary, terminal
      sequencing, fixed exact listing, exactly-once collector invocation, failure taxonomy,
      secret exclusion and TASK-137 cleanup behavior remain unchanged.
  - id: AC4
    condition: >
      Executable offline carrier regressions prove marker and conforming terminal result artifacts
      actually persist the new TASK-253 provenance values for success and fail-closed paths; tests
      do not merely inspect source strings.
  - id: AC5
    condition: >
      TikTokPdpCollector, parser, shared DOM-scope resolver, CLI, models and browser/session
      implementation remain byte-unchanged; no paired-role or scalar semantics are duplicated.
  - id: AC6
    condition: >
      Current Product/field uncertainty remains unchanged and historical TASK-249/TASK-250
      carrier/authorization/external-artifact lineage remains immutable rather than retroactively
      rebound.
  - id: AC7
    condition: >
      Exact publication grants zero fresh validation/live/acquisition/action authority, leaves NEXT
      null and pending commitments empty, and hands off only to
      HUMAN_BRAIN_FRESH_POST_GEN8_PAIRED_PRICE_COLLECTOR_VALIDATION_AUTHORIZATION.
  - id: AC8
    condition: >
      Exactly seven authorized paths change; focused carrier/CLI/collector/governance verification
      and git diff --check pass with zero unresolved items and no live marketplace/CDP operation.

