task_id: TASK-254
revision: 3

goal: >
  Rebind the existing sole Human-operated TikTok public-PDP validation carrier's engineering
  provenance from the historical TASK-248 collector baseline to the exact reviewed and published
  TASK-253 paired-price collector source, without changing collector semantics, browser/session
  behavior, CLI surface, artifact structure, or granting any live validation attempt. Preserve the
  existing V2 two-phase consumption and terminal-evidence contract, preserve exact TASK-249,
  TASK-250 and TASK-251 history, and make any future post-Gen8 paired-price collector validation
  artifact truthfully identify TASK-253 as the collector baseline. Return control only to the
  existing fresh Human/Brain validation-authorization gate. The successor authorization must reuse
  the canonical validation_carrier_source_sha field for the exact reviewed/published TASK-254
  carrier source, separately from the TASK-253 collector_validation_baseline.

problem: >
  TASK-253 revision 2 is exactly reviewed and published at
  33776f11b20977f46d45d394fa1c56040029b65d after RUN-253-001 /
  REVIEW-253-001 CHANGES_REQUIRED and remediation RUN-253-002 /
  REVIEW-253-002 PASS. The sole operation-specific carrier
  src/product_intelligence/tiktok_pdp_live_pilot.py still persists
  POST_TASK248_LIVE_PUBLIC_PDP_COLLECTOR_VALIDATION, collector_baseline_task_id TASK-248 and
  collector_baseline_source_sha 39979020a10b78e1f86c30cf2b704f2f975daec9. Direct fresh
  authorization would therefore execute the newer TASK-253 collector while durable marker/result
  provenance names the stale TASK-248 collector baseline. TASK-251 is the canonical
  reconciliation owner of the already-consumed historical validation operation and its exact V2
  marker/result provenance; TASK-250 remains historical authorization-at-publication state and
  TASK-249 remains historical carrier-hardening state. Current top-level post-P8 handoff state
  still carries historical validation_carrier_source_sha TASK-249 and collector baseline TASK-248,
  so TASK-254 must prevent those historical values from being mistaken for future authorization
  provenance. TASK-254 closes only this carrier provenance gap. It performs no TikTok/CDP
  operation, grants no validation/acquisition/action authority, creates no new provenance field or
  semantic owner, and does not reinterpret historical artifacts.

assumptions:
  - >
    Canonical main before this revision is a0a2f5e3114148a9347598b8f7eb9e27f59adc38,
    containing TASK-254 revision 2 only and no engineering RUN-254.
  - >
    TASK-253 final collector source is exactly
    33776f11b20977f46d45d394fa1c56040029b65d.
  - >
    TASK-253 final lineage is RUN-253-001 / REVIEW-253-001 CHANGES_REQUIRED followed by
    remediation RUN-253-002 / REVIEW-253-002 PASS.
  - >
    src/product_intelligence/adapters/tiktok_pdp.py at TASK-253 is the sole exact-PDP
    observation/role-admission owner; src/product_intelligence/adapters/tiktok_parsing.py remains
    the sole scalar-price admission authority.
  - >
    src/product_intelligence/tiktok_pdp_live_pilot.py remains the sole Human-operated
    operation-specific validation carrier and TASK-137 remains the sole browser/CDP lifecycle
    authority.
  - >
    TASK-251 owns canonical consumed-operation reconciliation with attempts 1/0,
    HUMAN_OPERATOR, validation_executed true, SUCCESS / OBSERVED / session-release SUCCESS and
    exact external V2 marker/result provenance. TASK-250 publication state remains 1/1 and
    unexecuted. TASK-249 publication remains the historical carrier-hardening baseline.
  - >
    Current fresh post-TASK253 validation authority is closed: zero fresh attempts,
    validation_execution_owner NONE and live_public_pdp_acquisition_authority NONE.
  - >
    The canonical existing carrier execution-source field is validation_carrier_source_sha.
    No validation_carrier_execution_source field exists and TASK-254 must not introduce one.
  - >
    A source candidate cannot truthfully embed its own eventual commit SHA without
    self-reference. TASK-254 therefore must not populate a new current
    validation_carrier_source_sha with a guessed or stale value. The successor authorization,
    authored after TASK-254 publication, must resolve the exact reviewed/published TASK-254 source
    and bind it to the existing validation_carrier_source_sha field.
  - >
    CAPABILITY_IS_NOT_AUTHORITY, EVIDENCE_IS_NOT_PRODUCT_TRUTH,
    SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY, SNAPSHOT_IS_NOT_TREND,
    AMBIGUOUS_PRICE_IS_NOT_EXACT_PRICE, OPERATION_SUCCESS_IS_NOT_FIELD_VALIDATION_SUCCESS,
    MEASUREMENT_IS_NOT_AUTHORITY and ONE_CAPABILITY_ONE_AUTHORITY remain mandatory.

