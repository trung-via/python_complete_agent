task_id: TASK-254
revision: 4

goal: >
  Rebind the existing sole Human-operated TikTok public-PDP validation carrier in place from the
  historical TASK-248 collector baseline to the exact reviewed/published TASK-253 paired-price
  collector source, without changing carrier mechanics, collector semantics, browser/session
  behavior, CLI surface, artifact structure, or granting any live validation attempt. Preserve
  exact TASK-249/TASK-250/TASK-251 history. Canonicalize a clean fresh post-TASK253 current state
  whose collector_validation_baseline is TASK-253, whose carrier-source SHA is intentionally
  unresolved until a later authorization can bind the exact reviewed/published TASK-254 source,
  and whose top-level state contains no terminal-operation residue from the consumed TASK-251
  validation.

problem: >
  TASK-253 revision 2 was ultimately reviewed PASS through remediation RUN-253-002 /
  REVIEW-253-002 and published at 33776f11b20977f46d45d394fa1c56040029b65d. The sole carrier
  src/product_intelligence/tiktok_pdp_live_pilot.py still emits POST_TASK248/TASK-248 collector
  baseline provenance. TASK-251 remains the canonical owner of the already-consumed historical
  validation operation, including exact V2 artifact hashes/sizes and SUCCESS/OBSERVED terminal
  state. The current top-level post-P8 handoff still mixes those historical TASK-251 terminal
  facts with the planning state for future validation. TASK-254 must both rebind only the carrier's
  three provenance literals and normalize current roadmap state so future authorization is fresh,
  zero-authority, provenance-clean and distinguishable from immutable historical execution. It
  must reuse canonical source_run_id/source_review_id and validation_carrier_source_sha vocabulary,
  append a durable publication-gated completed TASK-254 record, and introduce no second semantic
  owner or live authority.

assumptions:
  - >
    Canonical main before this revision is d812ef1a0771e9b6afe20757b646f655eb404daf,
    containing TASK-254 revision 3 only and no engineering RUN-254.
  - >
    TASK-253 final successful predecessor selector is source_task_id TASK-253,
    source_run_id RUN-253-002, source_review_id REVIEW-253-002 and source_published_sha
    33776f11b20977f46d45d394fa1c56040029b65d.
  - >
    TASK-253 also has historical primary RUN-253-001 / REVIEW-253-001 CHANGES_REQUIRED. That
    history remains documented/historical and must not replace the canonical final predecessor
    selector in TASK-254 current roadmap records.
  - >
    TASK-251 is the sole canonical consumed-operation reconciliation owner for the prior Human
    validation: attempts 1/0, HUMAN_OPERATOR, validation_executed true, SUCCESS / OBSERVED /
    session-release SUCCESS, process_exit_code UNKNOWN, exact V2 artifact sizes/hashes and field
    uncertainty.
  - >
    src/product_intelligence/tiktok_pdp_live_pilot.py remains the sole Human-operated validation
    carrier; TikTokPdpCollector remains the sole exact-PDP role-admission owner;
    tiktok_parsing.py remains sole scalar-price authority; TASK-137 remains browser/CDP lifecycle
    authority.
  - >
    validation_carrier_source_sha is the sole canonical carrier execution-source field. TASK-254
    cannot truthfully self-embed its future publication SHA; only the successor authorization,
    authored after publication, may resolve and bind that field.
  - >
    CAPABILITY_IS_NOT_AUTHORITY, EVIDENCE_IS_NOT_PRODUCT_TRUTH,
    SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY, SNAPSHOT_IS_NOT_TREND,
    AMBIGUOUS_PRICE_IS_NOT_EXACT_PRICE, OPERATION_SUCCESS_IS_NOT_FIELD_VALIDATION_SUCCESS,
    MEASUREMENT_IS_NOT_AUTHORITY and ONE_CAPABILITY_ONE_AUTHORITY remain mandatory.

