    condition: >
      Exact final TASK-253 lineage through RUN-253-002 / REVIEW-253-002 and published source
      33776f11b20977f46d45d394fa1c56040029b65d is recorded as the current collector validation
      baseline.
  - id: AC2
    condition: >
      The sole existing tiktok_pdp_live_pilot carrier is rebound in place using exactly three
      production assignment-value edits to POST_TASK253_PAIRED_PRICE_COLLECTOR_VALIDATION,
      TASK-253 and 33776f11b20977f46d45d394fa1c56040029b65d; no other production token in that
      file changes and no second carrier or semantic owner is created.
  - id: AC3
    condition: >
      V2 artifact filenames/schema and all TASK-249 carrier mechanics remain unchanged, including
      create-exclusive consumption, terminal sequencing, fixed exact listing, exactly-once
      collector invocation, failure taxonomy, secret exclusion and TASK-137 cleanup behavior.
  - id: AC4
    condition: >
      Executable offline carrier regressions read actual generated marker, SUCCESS result and at
      least one conforming FAIL_CLOSED result and independently compare their provenance fields
      against literal TASK-253 expected values, not only against imported production constants.
  - id: AC5
    condition: >
      TikTokPdpCollector, parser, shared DOM-scope resolver, CLI, models and browser/session
      implementations remain byte-unchanged; no paired-role, scalar, identity or lifecycle
      semantics are duplicated.
  - id: AC6
    condition: >
      TASK-249 carrier history, TASK-250 authorization-at-publication history and TASK-251
      consumed-operation reconciliation remain semantically immutable, including exact V2 artifact
      filenames, schema versions, sizes and SHA256 values.
  - id: AC7
    condition: >
      Current Product/field uncertainty remains unchanged: current_price UNKNOWN/null,
      original_price OBSERVED_ONLY 68220.0, canonical_evidence_ingested false,
      price_role_resolution_complete false and selector_repair_complete false.
  - id: AC8
    condition: >
      Exact TASK-254 publication grants zero fresh validation/live/acquisition/action authority
      without overwriting historical TASK-251 1/0 consumed state; NEXT remains null, pending
      commitments empty, and handoff is only
      HUMAN_BRAIN_FRESH_POST_GEN8_PAIRED_PRICE_COLLECTOR_VALIDATION_AUTHORIZATION.
  - id: AC9
    condition: >
      Documentation and canonical handoff explicitly require the successor authorization to bind
      validation_carrier_execution_source to the exact reviewed/published TASK-254 candidate
      resolved after publication while separately preserving collector_validation_baseline as
      TASK-253 / 33776f11b20977f46d45d394fa1c56040029b65d; TASK-254 contains no invented self-SHA.
  - id: AC10
    condition: >
      Exactly seven authorized paths change; focused carrier/CLI/collector/governance verification
      and git diff --check pass with zero unresolved items and no live marketplace/CDP operation.

