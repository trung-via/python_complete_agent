task_id: TASK-254
revision: 2

goal: >
  Rebind the existing sole Human-operated TikTok public-PDP validation carrier's engineering
  provenance from the historical TASK-248 collector baseline to the exact reviewed and published
  TASK-253 paired-price collector source, without changing collector semantics, browser/session
  behavior, CLI surface, artifact structure, or granting any live validation attempt. Preserve the
  existing V2 two-phase consumption and terminal-evidence contract, preserve exact TASK-251
  reconciliation history, and make any future post-Gen8 paired-price collector validation artifact
  truthfully identify TASK-253 as the collector baseline. Return control only to the existing fresh
  Human/Brain validation-authorization gate, where the future authorization must separately bind
  the exact reviewed/published TASK-254 carrier execution source from the TASK-253 collector
  semantic baseline.

problem: >
  TASK-253 revision 2 is exactly reviewed and published at
  33776f11b20977f46d45d394fa1c56040029b65d after RUN-253-001 /
  REVIEW-253-001 CHANGES_REQUIRED and remediation RUN-253-002 /
  REVIEW-253-002 PASS. The collector now contains the bounded paired-price current-role admission
  hardening that a future live validation is intended to test. However the sole operation-specific
  carrier src/product_intelligence/tiktok_pdp_live_pilot.py still persists
  POST_TASK248_LIVE_PUBLIC_PDP_COLLECTOR_VALIDATION, collector_baseline_task_id TASK-248 and
  collector_baseline_source_sha 39979020a10b78e1f86c30cf2b704f2f975daec9. Direct fresh
  authorization would therefore execute the newer collector while durable marker/result
  provenance names the stale baseline. TASK-251, not TASK-250 alone, is the canonical
  reconciliation owner of the already-consumed historical validation operation and its exact V2
  marker/result provenance. TASK-254 closes only the current carrier provenance gap. It performs
  no TikTok/CDP operation, grants no validation/acquisition/action authority, does not reinterpret
  historical artifacts, and must not collapse future carrier execution-source provenance into the
  distinct collector semantic baseline.

assumptions:
  - >
    Canonical main before this revision is d8de91bc9ec4476afe18bb30cb072afe948a1b87,
    containing TASK-254 revision 1 only and no RUN-254.
  - >
    TASK-253 final collector source is exactly
    33776f11b20977f46d45d394fa1c56040029b65d.
  - >
    TASK-253 final lineage is RUN-253-001 / REVIEW-253-001 CHANGES_REQUIRED followed by
    remediation RUN-253-002 / REVIEW-253-002 PASS.
  - >
    src/product_intelligence/adapters/tiktok_pdp.py at TASK-253 is the sole exact-PDP
    observation/role-admission owner; src/product_intelligence/adapters/tiktok_parsing.py remains
    the sole scalar-price admission authority.
  - >
    src/product_intelligence/tiktok_pdp_live_pilot.py remains the sole Human-operated
    operation-specific validation carrier and TASK-137 remains the sole browser/CDP lifecycle
    authority.
  - >
    TASK-251 owns the canonical reconciliation of the historical Human validation as consumed
    SUCCESS / OBSERVED / session-release SUCCESS with attempts 1/0 and exact external V2 artifact
    provenance, while TASK-250 remains immutable historical authorization state at publication.
  - >
    Current fresh post-TASK253 validation authority is closed: zero fresh attempts,
    validation_execution_owner NONE and live_public_pdp_acquisition_authority NONE.
  - >
    A TASK cannot safely pre-embed its own eventual commit SHA. Therefore TASK-254 must not invent
    validation_carrier_source_sha for itself. The successor authorization must resolve the exact
    reviewed and published TASK-254 candidate after publication and keep that carrier execution
    source distinct from the fixed TASK-253 collector baseline.
  - >
    CAPABILITY_IS_NOT_AUTHORITY, EVIDENCE_IS_NOT_PRODUCT_TRUTH,
    SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY, SNAPSHOT_IS_NOT_TREND,
    AMBIGUOUS_PRICE_IS_NOT_EXACT_PRICE, OPERATION_SUCCESS_IS_NOT_FIELD_VALIDATION_SUCCESS,
    MEASUREMENT_IS_NOT_AUTHORITY and ONE_CAPABILITY_ONE_AUTHORITY remain mandatory.

