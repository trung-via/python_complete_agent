task_id: TASK-254
revision: 1

goal: >
  Rebind the existing sole Human-operated TikTok public-PDP validation carrier's engineering
  provenance from the historical TASK-248 collector baseline to the exact reviewed and published
  TASK-253 paired-price collector source, without changing collector semantics, browser/session
  behavior, CLI surface, artifact structure, or granting any live validation attempt. Preserve the
  existing V2 two-phase consumption and terminal-evidence contract while making any future
  post-Gen8 paired-price collector validation artifact truthfully identify TASK-253 as the collector
  baseline. Return control only to the existing fresh Human/Brain validation-authorization gate.

problem: >
  TASK-253 revision 2 is now exactly reviewed and published at
  33776f11b20977f46d45d394fa1c56040029b65d after RUN-253-001 /
  REVIEW-253-001 CHANGES_REQUIRED and remediation RUN-253-002 /
  REVIEW-253-002 PASS. The collector now contains the bounded paired-price current-role admission
  hardening that a future live validation is intended to test. However the sole operation-specific
  carrier src/product_intelligence/tiktok_pdp_live_pilot.py is still the TASK-249 V2 carrier and
  persists CONTRACT_IDENTIFIER POST_TASK248_LIVE_PUBLIC_PDP_COLLECTOR_VALIDATION together with
  collector_baseline_task_id TASK-248 and collector_baseline_source_sha
  39979020a10b78e1f86c30cf2b704f2f975daec9. A new authorization could preflight current files, but
  the durable external marker/result would still attribute the observation to the stale collector
  baseline. Because post-attempt review is artifact-grounded and provenance must remain explicit,
  granting a fresh live attempt before rebinding this carrier would create ambiguous execution
  provenance. TASK-254 closes only that provenance gap; it performs no TikTok/CDP operation and
  grants no validation, acquisition, retry, selector, market-action, or automated authority.

assumptions:
  - >
    Canonical main at authoring is 33776f11b20977f46d45d394fa1c56040029b65d.
  - >
    TASK-253 final source is exactly 33776f11b20977f46d45d394fa1c56040029b65d.
  - >
    TASK-253 lineage is primary RUN-253-001 / REVIEW-253-001 CHANGES_REQUIRED followed by
    remediation RUN-253-002 / REVIEW-253-002 PASS; publication contains both the paired-role
    implementation and the executable truncation regression.
  - >
    src/product_intelligence/adapters/tiktok_pdp.py at TASK-253 is the sole exact-PDP
    observation/role-admission owner.
  - >
    src/product_intelligence/adapters/tiktok_parsing.py remains the sole scalar-price admission
    authority.
  - >
    src/product_intelligence/tiktok_pdp_live_pilot.py remains the sole Human-operated
    operation-specific validation carrier.
  - >
    TASK-137 remains the sole browser/CDP lifecycle authority.
  - >
    Current validation authority is closed: authorized_validation_attempts_remaining is 0 and
    live_public_pdp_acquisition_authority is NONE.
  - >
    Existing historical TASK-250 V2 external artifacts remain immutable historical evidence and
    must not be rewritten or reinterpreted as TASK-253 execution evidence.
  - >
    CAPABILITY_IS_NOT_AUTHORITY, EVIDENCE_IS_NOT_PRODUCT_TRUTH,
    SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY, SNAPSHOT_IS_NOT_TREND,
    AMBIGUOUS_PRICE_IS_NOT_EXACT_PRICE, OPERATION_SUCCESS_IS_NOT_FIELD_VALIDATION_SUCCESS,
    MEASUREMENT_IS_NOT_AUTHORITY and ONE_CAPABILITY_ONE_AUTHORITY remain mandatory.

