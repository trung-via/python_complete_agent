non_goals:
  - >
    Execute TikTok/CDP, invoke tiktok-pdp-live-pilot, create any external live marker/result,
    navigate, refresh, click, type, scroll, search, switch variants or acquire marketplace evidence.
  - >
    Grant or consume a fresh validation attempt, set live_public_pdp_acquisition_authority to any
    non-NONE value, or authorize a Human live invocation.
  - >
    Modify TikTokPdpCollector, TIKTOK_PDP_EXTRACTION_SCRIPT, scalar parsing, shared DOM-scope
    resolution, ProductCandidateSnapshot, CLI behavior, Playwright manager/session or browser
    lifecycle semantics.
  - >
    Create a second validation carrier, second parser, second collector, second evidence model or
    shadow provenance owner.
  - >
    Change V2 artifact JSON shape, filenames, create-exclusive semantics, attempt-consumption
    boundary, terminal sequencing, failure taxonomy, secret allowlist, fixed target, or cleanup
    semantics.
  - >
    Rewrite historical TASK-249/TASK-250 artifacts or claim their TASK-248 baseline fields were
    TASK-253 provenance.
  - >
    Authorize retry/resume/refresh, replacement target, inferred identity, arbitrary target,
    search, batch, multi-listing, variant switching, automated acquisition, selector repair,
    market test, recommendation, approval or commerce action.

constraints:
  hard:
    - >
      Classification is exactly
      POST_TASK253_PAIRED_PRICE_COLLECTOR_VALIDATION_CARRIER_PROVENANCE_REBINDING_ONLY.
    - >
      Record exact TASK-253 final lineage as source_task_id TASK-253, source_primary_run_id
      RUN-253-001, source_primary_review_id REVIEW-253-001, source_remediation_run_id RUN-253-002,
      source_review_id REVIEW-253-002 and source_published_sha
      33776f11b20977f46d45d394fa1c56040029b65d.
    - >
      Preserve the existing sole carrier in place. Do not add another live validation module.
      Update only its provenance identity values needed for future paired-price collector
      validation: CONTRACT_IDENTIFIER becomes POST_TASK253_PAIRED_PRICE_COLLECTOR_VALIDATION,
      COLLECTOR_BASELINE_TASK_ID becomes TASK-253 and COLLECTOR_BASELINE_SOURCE_SHA becomes
      33776f11b20977f46d45d394fa1c56040029b65d.
    - >
      Keep V2 artifact structure and filenames unchanged because their JSON schema is structurally
      unchanged: tiktok-pdp-live-validation-attempt-v2.json and
      tiktok-pdp-live-validation-result-v2.json remain schema_version 2. The new contract identifier
      and baseline values distinguish future artifacts. Historical V2 artifacts remain immutable
      and retain their original POST_TASK248/TASK-248 values.
    - >
      Both the attempt marker and every conforming terminal result must persist the new exact
      contract identifier, collector_baseline_task_id TASK-253 and collector_baseline_source_sha
      33776f11b20977f46d45d394fa1c56040029b65d. Do not add mutable HEAD, branch, local path, executor,
      chat, model or inferred marketplace provenance fields.
    - >
      Preserve all TASK-249 carrier mechanics byte-for-byte except the minimum provenance identity
      constants and any directly necessary documentation comments: external-root gate,
      create-exclusive marker/result, marker consumption boundary, at-most-once collector call,
      fixed listing, exact binding revalidation, bounded status/failure taxonomy, secret-free
      allowlists, manager.close_session cleanup, no browser ownership and fail-closed raising.
    - >
      Preserve Human-facing CLI subcommand and arguments unchanged. No new CLI option, target
      override, source override or baseline override is permitted.
    - >
      TikTokPdpCollector and every semantic owner outside the carrier remain byte-unchanged.
      TASK-254 must not duplicate or reinterpret paired-role logic, scalar parsing, DOM scoping,
      identity admission or browser lifecycle.
    - >
      Deterministic tests must prove the actual carrier-generated marker and SUCCESS/FAIL_CLOSED
      result documents contain the TASK-253 provenance values, while existing two-phase
      consumption, interruption, secret exclusion, fixed-target, exactly-once collector,
      cleanup and failure-code regressions remain green. Do not satisfy this only with
      source-string assertions.
    - >
      Governance must preserve current field uncertainty: current_price UNKNOWN/null,
      original_price OBSERVED_ONLY 68220.0, canonical_evidence_ingested false,
      price_role_resolution_complete false and selector_repair_complete false.
    - >
      Exact TASK-254 publication grants zero live attempts:
      authorized_validation_attempts 0, authorized_validation_attempts_remaining 0,
      validation_execution_owner NONE, validation_executed false for the fresh post-TASK253
      authorization lineage, live_public_pdp_acquisition_authority NONE,
      automated_public_pdp_acquisition_authority NONE, market_test_or_action_authority NONE,
      automatic_live_pilot false and automatic_progression false.
    - >
      Preserve consumed historical TASK-250 validation attempt and external artifact provenance as
      history. Do not overwrite historical authorized_validation_attempts/executed facts inside
      completed TASK-250 records; only current post-TASK253 authorization state is zero.
    - >
      On exact reviewed publication, TASK-254 becomes the current completed capability-hardening
      milestone and hands control only back to
      HUMAN_BRAIN_FRESH_POST_GEN8_PAIRED_PRICE_COLLECTOR_VALIDATION_AUTHORIZATION. Keep
      active_track.next_milestone null, post_p8_planning_handoff.next_milestone null,
      pending_commitments empty and post_run_engineering_successor null.
    - >
      Add docs/PHASE_8_PUBLIC_TIKTOK_PDP_POST_TASK253_VALIDATION_CARRIER_PROVENANCE_REBINDING.md
      documenting exact TASK-253 lineage, why direct live authorization was not yet safe, the
      in-place carrier provenance rebind, unchanged V2 structural contract, immutable historical
      artifacts, zero live authority and the exact Human/Brain authorization handoff.
    - >
      Update both roadmap documents and .ai/roadmap-state.yaml publication-gated. Historicalize
      TASK-253 current-state assertions without weakening its exact final publication lineage or
      paired-role semantics. Do not introduce duplicate direct-child keys.
    - >
      Modify exactly the seven authorized paths. Runtime owns verification. Executor must produce
      one candidate and one ResultPackage and must not publish, review, access TikTok/CDP, create
      live artifacts, authorize validation, consume an attempt or begin the authorization successor.

acceptance:
