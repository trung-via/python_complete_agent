      Classification is exactly
      POST_TASK253_PAIRED_PRICE_COLLECTOR_VALIDATION_CARRIER_PROVENANCE_REBINDING_ONLY.
    - >
      Canonical predecessor selector is exactly source_task_id TASK-253,
      source_run_id RUN-253-002, source_review_id REVIEW-253-002 and source_published_sha
      33776f11b20977f46d45d394fa1c56040029b65d. Historical primary
      RUN-253-001 / REVIEW-253-001 CHANGES_REQUIRED remains history only.
    - >
      In src/product_intelligence/tiktok_pdp_live_pilot.py the only permitted production-code
      delta is changing the values of exactly three existing top-level assignments:
      CONTRACT_IDENTIFIER -> POST_TASK253_PAIRED_PRICE_COLLECTOR_VALIDATION;
      COLLECTOR_BASELINE_TASK_ID -> TASK-253;
      COLLECTOR_BASELINE_SOURCE_SHA ->
      33776f11b20977f46d45d394fa1c56040029b65d.
      No other production token in that file may change.
    - >
      Preserve V2 filenames/schema and all TASK-249 carrier mechanics exactly. Future generated
      marker and every conforming terminal result must persist the three new literal provenance
      values. Historical V2 artifacts remain immutable with their original TASK-248 provenance.
