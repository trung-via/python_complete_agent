non_goals:
  - >
    Execute TikTok/CDP, invoke tiktok-pdp-live-pilot, create live marker/result artifacts, navigate,
    refresh, click, type, scroll, search, switch variants or acquire marketplace evidence.
  - >
    Grant or consume a validation attempt, authorize Human live invocation, set any live/automated
    acquisition or market-action authority to non-NONE, or begin the authorization successor.
  - >
    Modify TikTokPdpCollector, extraction script, parser, DOM scope, models, CLI, Playwright or
    browser/session lifecycle semantics.
  - >
    Create a second carrier, parser, collector, evidence model, provenance owner, lifecycle owner,
    alternate carrier-source field or duplicate roadmap semantic owner.
  - >
    Change V2 artifact shape, filenames, schema version, consumption boundary, terminal sequencing,
    fixed target, failure taxonomy, secret allowlist or cleanup behavior.
  - >
    Rewrite TASK-249/TASK-250/TASK-251 historical records or reinterpret their TASK-248 carrier/
    collector provenance as TASK-253 evidence.
  - >
    Precompute or invent TASK-254's future published SHA.
  - >
    Authorize retry/resume/refresh, replacement target, search, batch, inferred identity, variant
    switching, selector repair, recommendation, approval or commerce action.

