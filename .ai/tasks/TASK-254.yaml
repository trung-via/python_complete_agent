non_goals:
  - >
    Execute TikTok/CDP, invoke tiktok-pdp-live-pilot, create external live marker/result, navigate,
    refresh, click, type, scroll, search, switch variants or acquire marketplace evidence.
  - >
    Grant or consume a fresh validation attempt, authorize a Human live invocation, or set any
    live/automated acquisition or market-action authority to a non-NONE value.
  - >
    Modify TikTokPdpCollector, TIKTOK_PDP_EXTRACTION_SCRIPT, scalar parsing, shared DOM-scope
    resolution, ProductCandidateSnapshot, CLI behavior, Playwright/browser lifecycle semantics.
  - >
    Create a second validation carrier, parser, collector, evidence model, lifecycle owner or
    shadow provenance owner.
  - >
    Change V2 artifact JSON shape, filenames, schema_version, create-exclusive semantics,
    consumption boundary, terminal sequencing, fixed target, failure taxonomy, secret allowlist or
    cleanup semantics.
  - >
    Rewrite or reinterpret historical TASK-249, TASK-250 or TASK-251 publication/reconciliation
    facts, external artifact hashes, sizes or TASK-248 baseline fields as TASK-253 evidence.
  - >
    Precompute, invent or embed a supposed TASK-254 published SHA inside the TASK-254 candidate.
  - >
    Authorize retry/resume/refresh, replacement target, inferred identity, arbitrary target,
    search, batch, multi-listing, variant switching, selector repair, recommendation, approval or
    commerce action.

constraints:
  hard:
    - >
      Classification is exactly
      POST_TASK253_PAIRED_PRICE_COLLECTOR_VALIDATION_CARRIER_PROVENANCE_REBINDING_ONLY.
    - >
      Record exact TASK-253 final lineage as source_task_id TASK-253, source_primary_run_id
      RUN-253-001, source_primary_review_id REVIEW-253-001, source_remediation_run_id RUN-253-002,
      source_review_id REVIEW-253-002 and source_published_sha
      33776f11b20977f46d45d394fa1c56040029b65d.
    - >
      Preserve the existing sole carrier in place. In
      src/product_intelligence/tiktok_pdp_live_pilot.py the only permitted production-code edits
      are the values of exactly these three existing top-level assignments:
      CONTRACT_IDENTIFIER becomes POST_TASK253_PAIRED_PRICE_COLLECTOR_VALIDATION;
      COLLECTOR_BASELINE_TASK_ID becomes TASK-253; COLLECTOR_BASELINE_SOURCE_SHA becomes
      33776f11b20977f46d45d394fa1c56040029b65d. Do not change imports, declarations, dataclasses,
      functions, control flow, error handling, artifact builders, fixed target, cleanup or any
      other production token in that file.
    - >
      Keep V2 artifact structure and filenames unchanged:
      tiktok-pdp-live-validation-attempt-v2.json and
      tiktok-pdp-live-validation-result-v2.json remain schema_version 2. The new contract
      identifier and collector baseline values distinguish future artifacts. Historical V2
      artifacts remain immutable and retain their original POST_TASK248/TASK-248 values.
    - >
      Both the actual carrier-generated attempt marker and every conforming terminal result must
      persist POST_TASK253_PAIRED_PRICE_COLLECTOR_VALIDATION, collector_baseline_task_id TASK-253
      and collector_baseline_source_sha
      33776f11b20977f46d45d394fa1c56040029b65d. Do not add mutable HEAD, branch, local path,
      executor, chat, model or inferred marketplace provenance fields.
    - >
      Preserve TASK-249 carrier mechanics exactly: external-root gate, create-exclusive
      marker/result, marker consumption boundary, at-most-once collector call, fixed listing,
      exact binding revalidation, bounded status/failure taxonomy, secret-free allowlists,
      manager.close_session cleanup, no browser ownership and fail-closed raising. Preserve the
      Human-facing CLI subcommand and arguments unchanged.
    - >
      TikTokPdpCollector and every semantic owner outside the carrier remain byte-unchanged.
      TASK-254 must not duplicate or reinterpret paired-role logic, scalar parsing, DOM scoping,
      identity admission or browser lifecycle.
    - >
      Deterministic executable tests must invoke the actual carrier with offline fakes and read the
      generated marker/result JSON. For the provenance acceptance oracle, assertions must compare
      artifact values independently against the literal expected values
      POST_TASK253_PAIRED_PRICE_COLLECTOR_VALIDATION, TASK-253 and
      33776f11b20977f46d45d394fa1c56040029b65d, rather than proving correctness only by importing
      the same production constants under test. Existing production-constant assertions may
      remain as supplementary checks.
    - >
      Provenance regression must cover the attempt marker, a SUCCESS terminal result and at least
      one conforming FAIL_CLOSED terminal result created after the marker consumption boundary.
      Existing two-phase consumption, interruption, secret exclusion, fixed-target, exactly-once
      collector, cleanup and failure-code regressions remain green.
    - >
      Preserve historical TASK-249 carrier publication semantics and TASK-250 authorization
      publication semantics. Preserve TASK-251 as the canonical consumed-operation reconciliation:
      authorized_validation_attempts 1, authorized_validation_attempts_remaining 0,
      validation_execution_owner HUMAN_OPERATOR, validation_executed true,
      validation_operation_status SUCCESS, validation_observation_status OBSERVED,
      validation_session_release_status SUCCESS and process_exit_code UNKNOWN.
    - >
      Preserve TASK-251 exact external artifact provenance without copying or rewriting artifacts:
      marker tiktok-pdp-live-validation-attempt-v2.json, schema_version 2, size_bytes 633, SHA256
      3588F3E2416B0E1BA8B3DEF49B73544B8C4D04BF3FEF01D17616393783F7C94E; result
      tiktok-pdp-live-validation-result-v2.json, schema_version 2, size_bytes 1947, SHA256
      808971B737F9C2647A7618827722E072A34BDEB07E8CD55325765B48D78CFAF2.
    - >
      Governance must preserve current field uncertainty from TASK-251 through TASK-253:
      current_price UNKNOWN/null, original_price OBSERVED_ONLY 68220.0,
      canonical_evidence_ingested false, price_role_resolution_complete false and
      selector_repair_complete false. Historical evidence remains evidence, not Product Truth.
    - >
      TASK-254 must represent fresh post-TASK253 validation authority separately from historical
      TASK-251 consumed state. Exact TASK-254 publication grants zero fresh attempts:
      authorized_validation_attempts 0, authorized_validation_attempts_remaining 0,
      validation_execution_owner NONE, validation_executed false for the fresh post-TASK253
      authorization lineage, live_public_pdp_acquisition_authority NONE,
      automated_public_pdp_acquisition_authority NONE, market_test_or_action_authority NONE,
      automatic_live_pilot false and automatic_progression false. These fresh zero-state fields
      must not overwrite TASK-251 historical 1/0 consumed facts.
    - >
      Future authorization provenance has two distinct identities and must never collapse them.
      collector_validation_baseline is fixed now as TASK-253 /
      33776f11b20977f46d45d394fa1c56040029b65d. validation_carrier_execution_source is the exact
      reviewed and published TASK-254 source candidate resolved only after TASK-254 publication.
      TASK-254 must not guess its own eventual SHA. The post-publication handoff/documentation must
      state that any successor authorization must resolve and bind the exact TASK-254 publication
      source separately from the TASK-253 collector baseline.
    - >
      On exact reviewed publication, TASK-254 becomes the current completed capability-hardening
      milestone and hands control only to
      HUMAN_BRAIN_FRESH_POST_GEN8_PAIRED_PRICE_COLLECTOR_VALIDATION_AUTHORIZATION. Keep
      active_track.next_milestone null, post_p8_planning_handoff.next_milestone null,
      pending_commitments empty and post_run_engineering_successor null.
    - >
      Add docs/PHASE_8_PUBLIC_TIKTOK_PDP_POST_TASK253_VALIDATION_CARRIER_PROVENANCE_REBINDING.md
      documenting exact TASK-253 lineage, TASK-251 immutable consumed-operation provenance, why
      direct live authorization was unsafe, the three-literal in-place carrier rebind, unchanged
      V2 structural contract, zero live authority, and the future distinction between exact
      published TASK-254 carrier execution source and TASK-253 collector baseline.
    - >
      Update both roadmap documents and .ai/roadmap-state.yaml publication-gated. Historicalize
      TASK-253 current-state assertions without weakening its exact final publication lineage or
      paired-role semantics. Preserve TASK-249/TASK-250/TASK-251 historical records semantically
      unchanged; do not delete, normalize away or rewrite their historical authority/provenance
      facts. Do not introduce duplicate direct-child keys.
    - >
      Governance regressions for TASK-254 must prove the new current/handoff state and preserve the
      existing historical TASK-249/TASK-250/TASK-251 assertions. Do not weaken, delete or bypass
      older governance tests merely to make the new state pass.
    - >
      Modify exactly the seven authorized paths. Runtime owns verification. Executor must produce
      one candidate and one ResultPackage and must not publish, review, access TikTok/CDP, create
      live artifacts, authorize validation, consume an attempt or begin the authorization
      successor.

acceptance:
