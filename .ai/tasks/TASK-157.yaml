task_id: TASK-157
revision: 1

goal: >
  Migrate the repository-owned unified AIOS worker from the currently pinned
  AIOS-renew commit 14a1276d69665e7c371b6d56a95e50b992cbc7b3 to the exact
  semantically reviewed upstream commit d036324f3f9ab74ca3f217ed22e416313da71695,
  so Python Agent can consume published AIOS-renew TASK-075 semantics: reusable
  pre-verification sidecar/package validation is authoritative only for actually
  eligible verification-only NO_CHANGE REPAIR, while a later CODE_FIX continuation
  bypasses reuse-only validation and proceeds through the ordinary exactly-one selected
  Executor REPAIR path. Preserve the existing thin RUN/FIX/REPAIR/STATUS Human-facing
  worker, executor identity separation, exact failed-head/historical REPAIR lineage,
  bootstrap/provenance fail-closed behavior, and Python Agent product/publication
  authority without copying or exposing unrelated upstream remote/workflow capabilities.

problem: >
  Python Agent remains pinned to 14a1276d69665e7c371b6d56a95e50b992cbc7b3.
  TASK-156 produced RUN-156-001 PRIMARY verification failure at failed_head_sha
  112a727ca8cde2a164b00c94122ded64d3b58f44, followed by RUN-156-002 NO_CHANGE
  continuation verification failure on the same failed head. Brain then authorized
  REPAIR-156-002 as CODE_FIX scoped only to the TASK-156 integration certification
  module so Codex could improve bounded discovery diagnostics. The pinned runtime
  rejected that CODE_FIX before new RUN admission with
  "pre-verification candidate changed-files mismatch": reuse-only validation compared
  the continuation-relative FAILURE candidate.changed_files=[] with the preserved
  pre-verification package's full original TASK delta before checking that CODE_FIX is
  ineligible for package reuse. AIOS-renew TASK-075 corrects that ordering boundary and
  is published at d036324f3f9ab74ca3f217ed22e416313da71695. The blocker therefore
  belongs to downstream dependency adoption, not Python Agent product code and not a
  rewrite/rerun of TASK-156.

assumptions:
  - >
    Current canonical python_complete_agent main at TASK-157 authoring is
    eba6124576a07cb3d6d9dd603a86ec730193b874, the TASK-156 author commit. TASK-156
    remains active/unpublished with canonical failed lineage RUN-156-001 -> RUN-156-002
    and canonical CODE_FIX authorization REPAIR-156-002.
  - >
    docs/CHATGPT_PROJECT_CONTRACT.md remains authoritative: AIOS-renew is execution
    substrate only, and an upstream improvement does not exist for Python Agent until
    this repository explicitly updates and certifies its exact dependency pin.
  - >
    TASK-113 owns the repository worker/bootstrap control surface and TASK-155 is the
    direct prior unified-worker pin-migration precedent. TASK-157 extends that authority
    only; it creates no second launcher, runtime store, Human-facing protocol, or Product
    Intelligence semantic authority.
  - >
    The current downstream pin is exactly
    14a1276d69665e7c371b6d56a95e50b992cbc7b3 in both
    requirements-aios-renew.txt and the repository-owned worker launcher.
  - >
    AIOS-renew TASK-075 is canonically Runtime PASS at source candidate
    d036324f3f9ab74ca3f217ed22e416313da71695 with its focused suite reporting 32
    passed and git diff --check PASS; its final DELTA semantic review is PASS.
  - >
    d036324f3f9ab74ca3f217ed22e416313da71695 is a descendant of the current downstream
    pin. The upstream interval also contains TASK-068..TASK-074 implementation history,
    including dispatch reconciliation, publication, wakeup, and bounded remote
    status/approval work. Pinning the distribution necessarily consumes the kernel at
    that exact commit, but TASK-157 does not copy upstream repository workflows or expose
    any new Python Agent Human-facing operation beyond RUN/FIX/REPAIR/STATUS.
  - >
    AIOS-renew TASK-075 preserves TASK-064 verification-only NO_CHANGE reuse semantics,
    TASK-058 exact failed-head historical REPAIR, TASK-057 Runtime-owned changed_files,
    exactly-one ordinary Executor dispatch, and no retry/fallback/reroute. It changes
    only the authority ordering that previously allowed reuse-specific state to block an
    otherwise valid CODE_FIX.

scope:
  inspect:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/tasks/TASK-113.yaml
    - .ai/tasks/TASK-155.yaml
    - .ai/tasks/TASK-156.yaml
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-renew-worker.md
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - tests/aios_bridge/test_aios_worker_control_surface.py
  modify:
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-renew-worker.md
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - tests/aios_bridge/test_aios_worker_control_surface.py

non_goals:
  - Modify Product Intelligence, browser, scraper, discovery, ranking, persistence, catalog, retrieval, approval, grounded-QA, or any other product implementation.
  - Modify TASK-156, its source candidate, RUN-156-001/RUN-156-002 FAILURE artifacts, REPAIR-156-001/REPAIR-156-002 authorization, or any review/publication lineage.
  - Execute or continue REPAIR RUN-156-002 as part of TASK-157 migration verification.
  - Reimplement TASK-075 logic inside the Python Agent worker, inspect reusable sidecars, decide NO_CHANGE eligibility, compare continuation changed_files, or reconstruct failed-head lineage in repository-owned launcher code.
  - Copy AIOS-renew .github workflows, remote status/approval surfaces, self-hosted wakeup behavior, publication implementation, dispatch-reconciliation implementation, or recover-primary behavior into Python Agent.
  - Expose `wakeup`, `approve`, `recover-primary`, raw `transport`, raw AIOS CLI, direct package entrypoints, or any Human-facing operation other than existing RUN/FIX/REPAIR/STATUS.
  - Add retry, fallback, reroute, executor substitution, duplicate dispatch, automatic correction selection, or worker-owned verification/recovery policy.
  - Change Python Agent automatic publication workflow or publication authority.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      The active dependency file must contain exactly one non-comment pin and it must be
      exactly: aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@d036324f3f9ab74ca3f217ed22e416313da71695
    - >
      .agents/skills/aios-worker/scripts/aios_worker.py AUTHORITATIVE_COMMIT and derived
      PIN_LINE must bind exactly the same d036324f3f9ab74ca3f217ed22e416313da71695
      commit and existing authoritative repository URL. No branch, tag, version range,
      current-main lookup, alternate source, or environment override may choose the kernel.
    - >
      Existing dedicated <git-dir>/aios/worker-runtime bootstrap remains authoritative.
      Installed PEP 610 provenance from 14a1276d69665e7c371b6d56a95e50b992cbc7b3
      or any alternate source/commit must fail validation and use the existing atomic
      stale-runtime replacement path to install only the checked-in new pin before the
      next kernel invocation. An already-authoritative d036324f... runtime must be reused.
    - >
      The visible Human protocol remains exactly RUN TASK-N, FIX TASK-N FINDING-ID,
      REPAIR RUN-N-NNN, and STATUS TASK-N. Parsing, target validation, command shapes,
      strict PASS-summary parsing, no-push behavior, and at-most-one pinned-kernel
      invocation remain unchanged except for consuming the new distribution.
    - >
      Codex surface remains permanently bound to executor codex and Antigravity surface
      remains permanently bound to executor antigravity. No TASK, failure, sidecar,
      runtime state, model condition, or upstream dispatch-reconciliation feature may
      silently reroute or substitute executor identity.
    - >
      REPAIR remains a thin delegation of explicit failed RUN plus selected executor.
      The repository worker must not read/validate pre-verification sidecars, decide
      reusable-package eligibility, compare continuation-relative candidate.changed_files,
      reconstruct root/failed-head lineage, or implement the TASK-075 CODE_FIX bypass.
      Those semantics remain exclusively inside the pinned Runtime.
    - >
      Documentation must state the exact TASK-075 behavior adopted by this migration:
      eligible NO_CHANGE reuse remains fail-closed and may elide Executor only under the
      existing Runtime preconditions; CODE_FIX bypasses reuse-only sidecar/package
      validation and proceeds through ordinary exactly-one selected Executor dispatch
      while all canonical FAILURE/TASK/failed_head/REPAIR/completion gates remain intact.
    - >
      Although d036324f... contains upstream TASK-068..TASK-074 behavior and repository
      remote/workflow files, TASK-157 must not copy those workflows or expose new Python
      Agent Human commands. Documentation may acknowledge that the exact package includes
      intervening Runtime history, but the downstream worker surface stays
      RUN/FIX/REPAIR/STATUS only.
    - >
      Certification tests must update the exact expected pin, launcher provenance,
      stale-runtime replacement target, and prior-pin rejection while preserving all
      existing RUN/FIX/REPAIR/STATUS, bootstrap-host, strict parsing, executor separation,
      one-invocation, no-push, and worker-thinness regressions. Add a source-level guard
      that the worker itself does not acquire TASK-075 sidecar/reuse decision authority.
    - >
      Migration verification must be deterministic and network-free with respect to
      Python Agent live product/provider behavior. Do not run TASK-156, REPAIR-156-002,
      marketplace discovery, scrape, provider, or other live Product Intelligence work
      merely to prove this dependency migration.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      Dependency file, launcher authoritative commit, derived pin string, worker docs,
      and certification expectations all reference exactly
      d036324f3f9ab74ca3f217ed22e416313da71695 and reject
      14a1276d69665e7c371b6d56a95e50b992cbc7b3 as stale provenance.
  - id: AC2
    condition: >
      Bootstrap regressions prove an old/alternate worker runtime is not reused and is
      atomically synchronized to the exact new pin using only the checked-in requirements
      file, while an already-authoritative d036324f... runtime is reused without reinstall.
  - id: AC3
    condition: >
      RUN, FIX, REPAIR, and STATUS retain unchanged Human-facing meaning, exact executor
      identity, strict canonical summary parsing, at-most-one pinned-kernel invocation,
      and no worker-owned retry/reroute/publication authority.
  - id: AC4
    condition: >
      Worker REPAIR remains thin and contains no reusable-sidecar decoding, candidate
      changed-files comparison, NO_CHANGE eligibility decision, historical failed-head
      reconstruction, or TASK-075 CODE_FIX bypass logic; those behaviors are consumed
      solely through the exact pinned AIOS-renew distribution.
  - id: AC5
    condition: >
      Documentation correctly records the adopted TASK-075 contract: malformed or
      mismatched reusable state still fails closed when an eligible NO_CHANGE request
      actually relies on reuse, while CODE_FIX does not consult reuse-only state and
      proceeds through normal exactly-one selected Executor REPAIR dispatch with existing
      canonical lineage/completion gates preserved.
  - id: AC6
    condition: >
      No upstream remote approval/status workflow, wakeup workflow, recover-primary
      command, publication implementation, or additional Human operation is copied or
      exposed; Python Agent normal worker surface remains exactly RUN/FIX/REPAIR/STATUS.
  - id: AC7
    condition: >
      No Product Intelligence file, TASK-156 implementation/candidate/artifact, or Python
      Agent publication workflow is changed by TASK-157. TASK-156 remains paused on exact
      RUN-156-002 until this migration is reviewed PASS and published.
  - id: AC8
    condition: >
      The complete repository-owned worker certification suite passes on the migrated
      source tree and git diff --check passes without invoking TASK-156 or any live
      existing RUN/FIX/REPAIR.

verification:
  required:
    - 'python -m pytest tests/aios_bridge/test_aios_worker_control_surface.py -q'
    - 'git diff --check'
