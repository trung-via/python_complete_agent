      Keep active_track.next_milestone null, pending_commitments empty and
      post_run_engineering_successor null.
    - >
      Modify exactly the seven authorized paths. Runtime owns deterministic verification.
      Executor must produce one candidate and one ResultPackage and must not publish, execute
      live TikTok/CDP, authorize generation 6, repair selectors/root semantics or alter browser
      lifecycle authority.

