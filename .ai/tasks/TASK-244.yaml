      Classification is exactly
      GENERATION_5_RESULT_RECONCILIATION_AND_TITLE_LOCAL_COMMERCE_OBSERVABILITY_V3_HARDENING_ONLY.
    - >
      Record exact TASK-243 publication lineage using source_task_id TASK-243,
      source_run_id RUN-243-001, source_review_id REVIEW-243-001 and
      source_published_sha 1410e993de69a6c3a9f100d256328710976a9c64. Preserve
      diagnostic_v2_implementation_source_sha
      8ef61df3936652fb7aeda8ca31ce1db3621ff4cf and generation_5_execution_source_sha
      d113c4a7ce2e2835d532935bc195c922aa3628ca as historical provenance.
    - >
      Reconcile generation 5 as consumed history:
      generation_5_diagnostic_executed true,
      generation_5_authorized_diagnostic_attempts 1,
      generation_5_authorized_diagnostic_attempts_remaining 0,
      generation_5_diagnostic_execution_owner HUMAN_OPERATOR,
      live_dom_diagnostic_authority NONE,
      diagnostic_outcome FAIL_CLOSED,
      diagnostic_failure_reason NO_BOUNDED_PDP_ROOT,
      diagnostic_process_exit_code 1 and diagnostic_artifact_created true.
      TASK-244 must not revive, retry or reinterpret generation 5.
    - >
      Record the exact generation-5 V2 artifact provenance:
      schema_version 2,
      filename tiktok-pdp-dom-diagnostic-v2.json,
      sha256 03CB57F0BA9838985233C919E144416416E1A17DD2DA033F8B5F8A3FE224EA1F,
      size_bytes 6130,
      observed_at 2026-09-22T23:00:39.526520+00:00,
      evidence_authority NONE.
    - >
      Preserve the exact generation-5 root_probe and commerce_probe summary from the task
      assumptions as bounded engineering diagnostic context. Explicitly state that
      price_anchor_count 0 and action_anchor_count 0 are full-body current-selector-family
      misses and are not caused by the 600-node commerce TreeWalker truncation. Explicitly state
      that visible_currency_like_count 0 from the truncated global scan is non-exhaustive and
      that legacy near_title_action_like_count 91 is a broad V2 ancestor-containment heuristic,
      not evidence of 91 commerce controls.
    - >
      Advance the active diagnostic contract from schema_version 2 to schema_version 3 and
      create-exclusive filename tiktok-pdp-dom-diagnostic-v3.json. Do not overwrite, reuse or
      reinterpret the historical V2 artifact filename or payload. evidence_authority remains
      NONE.
    - >
      Preserve existing rootSelector, titleSelectors, priceSelectors, actionSelectors and
      root-selection semantics exactly. V3 is observability hardening only; no selector/root
      repair is permitted.
    - >
      Preserve the legacy global structural scan cap at 600 and its bounded/truncated
      semantics. Do not increase that cap as the solution. V3 must add a distinct
      title_local_topology_probe derived from the exact title anchor and at most six light-DOM
      ancestor levels.
    - >
      Each title-local ancestor record must be independently hard-bounded to at most 300
      descendant element observations and must report ancestor_level, a sanitized structural
      ancestor signature, bounded_nodes_scanned, bounded_scan_truncated,
      current_price_selector_match_count, current_action_selector_match_count,
      visible_currency_like_count, commerce_semantic_action_like_count,
      native_or_role_control_count, pointer_only_interaction_count,
      visible_loading_marker_count, open_shadow_root_boundary_count and
      visible_iframe_boundary_count. Counts are engineering hints only.
    - >
      For V3 title-local topology semantics, commerce_semantic_action_like_count may only count
      bounded BUY/CART/VARIANT/QUANTITY-like text-or-structural hints; native_or_role_control_count
      separately counts generic native/role button, select and input controls;
      pointer_only_interaction_count separately counts remaining generic pointer/tabindex/onclick
      interaction that is not already counted as a commerce-semantic or native/role control.
      Generic pointer interaction must never be promoted to commerce-semantic evidence.
    - >
      V3 may include only bounded sanitized structural candidate samples needed to interpret the
      title-local topology probe. Sampling must prioritize currency-like and commerce-semantic
      categories over generic controls/pointer-only interaction and must not allow generic
      pointer nodes to exhaust all sample capacity. Persist no raw text/value, href, aria-label,
      innerHTML, outerHTML, endpoint secret or arbitrary page content.
    - >
      title_local_topology_probe is observational only. It must not output selected_root,
      recommended_root, selector_repair, root_score, ranking, approval or any equivalent field
      that silently becomes root/selector authority.
    - >
      Preserve one borrowed session, exactly one session.evaluate(DIAGNOSTIC_SCRIPT), zero
      navigation/refresh/click/type/scroll, TASK-137 manager-mediated cleanup, light-DOM-only
      traversal, no iframe document traversal and no shadow-root traversal.
    - >
      Preserve safe fail-closed outcomes and payload validation. NO_BOUNDED_PDP_ROOT may write
      one create-exclusive V3 diagnostic artifact; blocked/login/unavailable/identity mismatch
      and malformed/evaluation/session failures remain bounded according to the diagnostic
      contract. No failure grants retry or repair authority.
    - >
      Preserve generations 1-5 as historical records, root_observability_hardening_implemented
      true, commerce_observability_hardening_implemented true, selector_repair_complete false,
      live_public_pdp_acquisition_authority NONE,
      automated_public_pdp_acquisition_authority NONE,
      market_test_or_action_authority NONE and automatic_progression false.
    - >
