task_id: TASK-138
revision: 1

goal: >
  Implement post-M4 P2 Source Evidence Intake as one bounded deterministic local-filesystem
  application boundary that discovers persisted V1 Product Source Pack manifests only under
  explicit caller-supplied root directories, typed-rehydrates every discovered manifest
  exclusively through the existing TASK-125 authority, and returns one immutable aligned
  inventory of exact manifest paths plus ProductSourcePack values suitable for existing M3
  resolution workflows and TASK-135 persistent grounded QA without introducing a second
  codec, registry store, identity authority, catalog authority, or automatic admission path.

problem: >
  TASK-137 closed the live acquisition/browser foundation and existing Shopee/TikTok scrape
  tools already persist source_pack.json under deterministic local source-pack directories
  and return manifest_path. TASK-125 can strictly rehydrate one explicit persisted manifest,
  M3 accepts ProductSourcePack observations, and TASK-135 can reconstruct persistent grounded
  QA from explicit manifest paths. What remains missing is the narrow application boundary
  that deterministically locates those local persisted manifests inside explicitly configured
  roots and presents the same discovered set in both downstream-compatible forms. Callers
  currently have to duplicate directory walking, ordering, alias handling, duplicate-evidence
  handling, and manifest-path collection themselves. TASK-138 must own only that bounded
  discovery/inventory gap and must preserve all existing evidence, identity, catalog, and
  grounded-QA semantics.

assumptions:
  - >
    Canonical Python Agent main immediately before TASK-138 authoring is
    4cd23ed46a6a53d8d356a7933b7de09e75739ca0. Its parent governance commit
    8512c30f9dd7f79841fd5ad23d51982c637cd570 hardens Brain review/publication handling,
    and TASK-137 source candidate 91a20e5c898fc63856631cc79bd0bd924c3b6d8b is the
    published P1 Live Acquisition Foundation implementation.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@67db82bf19d63f25721d06aabb82d850db8b78d4.
  - >
    docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md is canonical and identifies P2 Source
    Evidence Intake as the current boundary. P3 Human-Governed Knowledge Update, P4 live
    provider certification, P5 presentation, and P6 quality/scale remain future work.
  - >
    src/product_source/serialization.py and TASK-125 deserialize_product_source_pack remain
    the sole Product Source Pack V1 JSON/typed-rehydration authority. TASK-138 may call that
    API but must not parse, validate, repair, normalize, or rewrite manifest JSON itself.
  - >
    SourceObservationIdentity.from_pack remains the sole exact source-observation identity
    projection used by M3. TASK-138 may use exact projected equality only to reject duplicate
    observations in an intake batch; it must not infer or normalize identity fields.
  - >
    TASK-108/109 and successors remain sole entity-resolution/grouping authority. TASK-118/
    119/120 remain sole canonical catalog/persistence authority. TASK-135 remains persistent
    grounded-QA authority and intentionally requires explicit manifest paths rather than
    performing discovery itself.
  - >
    Existing Shopee/TikTok scrape tools persist local manifests under an output root such as
    data/source_packs/<platform>/<source_pack_id>/source_pack.json. Google Drive publication
    is a separate existing side effect; P2 is local-filesystem intake only and does not list
    or download Drive content.

