task_id: TASK-204
revision: 1

goal: >
  Complete Python Agent's downstream AIOS adoption-policy reconciliation by migrating
  the sole active AIOS-renew runtime authority from exact reviewed/source-published pin
  f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e to exact reviewed/source-published source
  652b00b103dd50e2a550dd0ec0fe4063e69631b7, incorporating the published TASK-115
  safe-publication repair and the TASK-114/TASK-116 downstream-portability policy
  reconciliation while preserving exact-pin isolation and keeping every repository-specific
  control-plane binding explicitly inactive until its later adoption task. Close the current
  AIOS_DOWNSTREAM_ADOPTION_POLICY_RECONCILIATION roadmap commitment and make
  FULL_AIOS_CONTROL_PLANE_ADOPTION_PHASE_1 the unique next downstream milestone.

problem: >
  Python Agent canonical main a17e5940894e8d02191df0a04a7e88afb36c56d3 still uses
  AIOS-renew pin f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e, selected by TASK-201.
  TASK-203 revision 2 correctly rebuilt downstream adoption planning so package capability
  availability is distinct from repository-binding activation and made
  AIOS_DOWNSTREAM_ADOPTION_POLICY_RECONCILIATION the unique NEXT milestone. Upstream
  reconciliation is now complete: TASK-114 established the prospective portability versus
  activation policy; TASK-115 repaired safe publication for truthful zero-delta intermediate
  CONTINUE_IMPLEMENTATION failures; and TASK-116 integrated the reviewed TASK-114 policy
  onto current upstream main. AIOS-renew source
  652b00b103dd50e2a550dd0ec0fe4063e69631b7 is REVIEW-116-001 PRIMARY PASS,
  source-published, and descends from the current downstream pin by seven commits. The
  downstream auto-publisher executes the pinned AIOS publication gate, so retaining the
  older pin would omit the live-evidence-backed TASK-115 publisher repair before full
  downstream control-plane conformance. This migration must remain explicit and must not
  silently activate any repository-specific carrier or workflow.

