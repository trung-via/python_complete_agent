    - >
      Verification must be deterministic, offline, non-interactive, and independent of
      GitHub/network, marketplace/browser/CDP, provider/LLM, Drive, wall-clock, random/UUID,
      or mutable external state.
    - >
      Do not weaken, skip, xfail, or bypass existing worker, provenance, Brain-ingress,
      publisher, roadmap, or adoption regression intent merely to make the migration pass.
    - Do not push from Executor implementation execution.

