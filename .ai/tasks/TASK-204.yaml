      Replace the sole active requirements pin and worker AUTHORITATIVE_COMMIT from
      f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e to exactly
      652b00b103dd50e2a550dd0ec0fe4063e69631b7. No floating ref, ambient AIOS import,
      or duplicate active runtime pin may exist.
    - >
      Preserve the existing repository-local pinned runtime and PEP 610 source-plus-commit
      provenance boundary. Worker and Brain-only ingress surfaces must continue using the
      checked-in pinned distribution and rebuilding stale runtime state fail-closed rather
      than consuming ambient/global/mutable AIOS.
    - >
      Preserve the Human-facing worker protocol and executor identity separation exactly:
      CONTINUE TASK-N, STATUS TASK-N, RUN TASK-N, FIX TASK-N FINDING-ID, REPAIR RUN-N-NNN;
      Codex and Antigravity remain distinct selected Executor surfaces.
    - >
      Keep .github/workflows/aios-auto-publish.yml unchanged. It remains the downstream
      source-only publication surface and must continue delegating to the checked-in exact
      AIOS pin rather than gaining new review or publication semantics locally.
    - >
      Reconcile .ai/aios-adoption-state.yaml so downstream_pin.commit is exactly
      652b00b103dd50e2a550dd0ec0fe4063e69631b7 and upstream audit/provenance recognizes
      TASK-114 through TASK-116. Represent TASK-115 as adopted pinned publication hardening
      with no repository binding required; represent TASK-114/TASK-116 as governance-policy
      provenance rather than as newly activated downstream runtime or product authority.
    - >
      Preserve existing package-versus-binding classifications. In particular A1/A2/A3/A6
      and TASK-107/TASK-108/TASK-110/TASK-111/TASK-112/TASK-113 repository bindings remain
      REQUIRED_PENDING after this migration. No repository binding becomes ACTIVE merely
      because the pin advances.
    - >
      Preserve exact-pin isolation prospectively: 652b00b103dd50e2a550dd0ec0fe4063e69631b7
      becomes the sole active downstream AIOS authority only after reviewed publication of
      this task; later upstream movement remains irrelevant until another explicit reviewed
      downstream migration.
    - >
      Reconcile .ai/roadmap-state.yaml so the current
      AIOS_DOWNSTREAM_ADOPTION_POLICY_RECONCILIATION commitment is closed by this reviewed
      migration/reconciliation and FULL_AIOS_CONTROL_PLANE_ADOPTION_PHASE_1 becomes the
      unique NEXT item. Keep the same ACTIVE track and preserve the approved later ordering
