task_id: TASK-202
revision: 1

goal: >
  Reconcile docs/CHATGPT_PROJECT_CONTRACT.md as the final HOW layer of the Python
  Agent Governance Foundation so that Brain/repository/execution/review/publication
  operations are explicitly subordinate to the published Constitution and Product
  Contract, preserve Human mandate sovereignty without confusing intent with
  engineering-state truth, bind concrete operating actors to the constitutional
  role model without merging authorities, and retain the exact pinned AIOS-renew
  worker, recovery, semantic-review, and source-publication mechanics already
  established by TASK-201.

problem: >
  Python Agent now has the complete published WHY / enforceable-governance / WHAT
  stack: Manifesto, Constitution, and Product Contract. The existing ChatGPT Project
  Contract predates that stack. It remains the current operating HOW contract, but
  its authority model still mixes Human intent, repository state, phase documents,
  TASK lineage, and the Project Contract in one hierarchy and does not yet make the
  Constitution/Product Contract precedence explicit. Its Brain Sync protocol also
  does not require the full Governance Foundation preflight. This leaves the exact
  transition ambiguity that the Constitution reserved for the dedicated Project
  Contract reconciliation milestone. The contract must be reconciled without
  changing Python Agent product semantics, domain authorities, the exact AIOS pin,
  worker UX, Runtime behavior, review/publication authority, or current roadmap
  completion state.

assumptions:
  - >
    Canonical python_complete_agent main at TASK authoring is
    6d87fcb9641905a4555bc2a2280efab59143fc64, the exact reviewed and
    source-published TASK-201 migration candidate.
  - >
    RUN-201-001 completed with canonical RESULT, required verification passed,
    unresolved is empty, and REVIEW-201-001 is PRIMARY PASS with AC1-AC6 PASS and
    no findings for reviewed SHA
    6d87fcb9641905a4555bc2a2280efab59143fc64.
  - >
    docs/PYTHON_AGENT_MANIFESTO.md is the canonical WHY layer;
    docs/PYTHON_AGENT_CONSTITUTION.md is the highest enforceable Python Agent
    governance layer; docs/PYTHON_AGENT_PRODUCT_CONTRACT.md is the canonical WHAT
    layer; docs/CHATGPT_PROJECT_CONTRACT.md is the operating HOW layer to reconcile.
  - >
    The published Governance Foundation source provenance remains:
    TASK-194 / PYTHON_AGENT_MANIFESTO at
    e0d8998ee004fda80ca3fbc3de4eb0afb59160a5,
    TASK-196 / PYTHON_AGENT_CONSTITUTION at
    4f6d91858c93192f497342315c4650e30b0a2718, and
    TASK-199 / PYTHON_AGENT_PRODUCT_CONTRACT at
    702e85e9e77a556f3716717ccaa186919b1a9dab.
  - >
    .ai/roadmap-state.yaml records PYTHON_AGENT_GOVERNANCE_FOUNDATION as the sole
    ACTIVE track and CHATGPT_PROJECT_CONTRACT_RECONCILIATION as the unique NEXT /
    NOT_DONE commitment. This semantic TASK does not auto-advance that Brain-owned
    planning bookmark.
  - >
    Python Agent's sole active AIOS-renew authority is the exact reviewed and
    source-published pin f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e under
    EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY. Mutable upstream AIOS-renew main is not
    downstream runtime authority.
  - >
    TASK-201 preserves the current Human-facing protocol, Brain-only authoring
    ingress carrier, source-only downstream publisher, and the distinction between
    package-level adopted behavior and repository-specific upstream outer automation
    that is not automatically active in Python Agent.
  - >
    Current Human intent is to complete the dedicated ChatGPT Project Contract
    reconciliation milestone. It does not amend the Constitution, Product Contract,
    product/domain semantics, AIOS pin, or current product roadmap priorities.

