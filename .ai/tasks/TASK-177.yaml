task_id: TASK-177
revision: 1

goal: >
  Explicitly migrate the repository-owned Python Agent AIOS worker from the exact
  currently pinned AIOS-renew commit 32ace104c5cfaa1b7affbaa40157872b1f85147f to
  the exact semantically reviewed upstream source candidate
  a607fb2cf1c57fe35a9a15504df0e98d28de2f5b, and adopt the published TASK-086
  Unified State + Next Action and TASK-087 Unified Human Surface through the existing
  Codex and Antigravity Human-facing worker surfaces. The normal Human workflow must
  gain one stable CONTINUE TASK-N command that delegates lifecycle selection solely to
  pinned AIOS-renew while preserving the repository-owned executor-specific surfaces,
  deterministic bootstrap/provenance boundary, review-before-publication authority,
  and explicit low-level RUN/FIX/REPAIR compatibility paths.

problem: >
  Python Agent currently pins AIOS-renew at
  32ace104c5cfaa1b7affbaa40157872b1f85147f and its repository-owned launcher still
  requires the Human to translate lifecycle state manually among RUN, FIX, REPAIR,
  and STATUS. Upstream AIOS-renew has now semantically reviewed and published a bounded
  Unified State reducer and Human continuation front door at exact source candidate
  a607fb2cf1c57fe35a9a15504df0e98d28de2f5b. Without an explicit downstream migration,
  those capabilities do not exist for Python Agent. The downstream worker must consume
  them without copying lifecycle logic into the launcher, bypassing the repository-provided
  Human-facing surfaces, changing executor-selection authority, or silently following
  later AIOS-renew main commits.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-177 authoring is
    0f000cd8798a7ac8a83f9e39ee168978e1a4a5ef, the reviewed and published TASK-176
    source candidate. RUN-176-001 Runtime verification passed and REVIEW-176-001 is
    PRIMARY PASS with no findings, so the prior authored-task sequencing blocker is closed.
  - >
    The authoritative downstream AIOS dependency immediately before this migration is
    exactly `aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@32ace104c5cfaa1b7affbaa40157872b1f85147f`.
    Current AIOS-renew main is not downstream authority.
  - >
    Upstream source candidate a607fb2cf1c57fe35a9a15504df0e98d28de2f5b is the
    Human-selected, semantically reviewed and published TASK-087 candidate. Its canonical
    REVIEW-087-002 is DELTA PASS with no findings. This exact candidate, rather than later
    AIOS-renew planning commits, is the migration target.
  - >
    TASK-086 establishes the deterministic read-only `aios state <TASK_ID>` lifecycle
    reducer and TASK-087 establishes the bounded `aios continue <TASK_ID>` Human surface.
    The downstream worker consumes those authorities solely through the pinned distribution;
    it does not reimplement their state/action taxonomy or correction/recovery logic.
  - >
    Choosing `$aios-worker ...` is explicit Human selection of executor `codex`, while
    choosing `/aios-renew-worker ...` is explicit Human selection of executor `antigravity`.
    Passing that selected identity to `aios continue` is therefore not automatic routing.
    For a lifecycle action that requires no coding Executor, the pinned TASK-087 contract
    remains authoritative and the supplied surface identity must not force an Executor call.
  - >
    Existing repository-native semantic review and auto-publication remain separate from
    execution. The publication workflow already installs AIOS-renew from the same immutable
    requirements pin file and requires no workflow redesign for this migration.

scope:
  inspect:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-renew-worker.md
    - .agents/workflows/aios-worker.md
    - .github/workflows/aios-auto-publish.yml
    - tests/aios_bridge/test_aios_worker_control_surface.py
    - .ai/tasks/TASK-130.yaml
    - .ai/tasks/TASK-157.yaml
    - .ai/tasks/TASK-158.yaml
    - .ai/tasks/TASK-161.yaml
    - .ai/tasks/TASK-176.yaml
  modify:
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-renew-worker.md
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - tests/aios_bridge/test_aios_worker_control_surface.py

non_goals:
  - Modify AIOS-renew itself, follow current/future AIOS-renew main, use a floating branch/tag,
    or migrate beyond exact reviewed source candidate a607fb2cf1c57fe35a9a15504df0e98d28de2f5b.
  - Modify Product Intelligence production code, product tests, Phase 6 product semantics,
    marketplace behavior, persistence, retrieval, truth, ranking, media, provider, or domain APIs.
  - Reimplement, fork, approximate, cache, or infer the TASK-086 lifecycle reducer or TASK-087
    next-action mapping in the downstream launcher, skill, workflow, or documentation.
  - Replace the repository-provided `$aios-worker` and `/aios-renew-worker` Human-facing
    surfaces with raw `aios ...` commands in normal Human guidance.
  - Remove RUN, FIX, or REPAIR compatibility/debug commands, change their canonical low-level
    mappings, or convert historical explicit worker commands into aliases with new semantics.
  - Add executor recommendation, scoring, model selection, fallback, reroute, retry, polling,
    recursive continuation, autonomous review, autonomous correction authoring, or publication.
  - Expose raw wakeup, approval, transport, recover-primary, remediation-ref, repair-ref, or
    other internal operator selectors as new downstream Human commands. CONTINUE may cause
    pinned AIOS-renew to delegate an already-derived canonical operation internally, but the
    downstream worker does not select or reconstruct it.
  - Modify `.github/workflows/aios-auto-publish.yml`, review-decision/publication authority,
    TASK-176 lineage, or historical AIOS artifacts.
  - Install AIOS-renew into the product virtualenv or make a global/local source checkout the
    active runtime authority. The dedicated repository-local pinned worker runtime remains authoritative.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Change the only active downstream dependency pin to exactly
      `aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@a607fb2cf1c57fe35a9a15504df0e98d28de2f5b`
      and change the launcher `AUTHORITATIVE_COMMIT` to the same exact SHA. No floating ref,
      duplicate alternate source, or later AIOS-renew commit is allowed.
    - >
      Add `CONTINUE` as a TASK-oriented action accepted by the shared launcher and both active
      repository-provided Human-facing surfaces. `CONTINUE TASK-N` accepts one canonical TASK id
      and no finding/run selector.
    - >
      The shared launcher must translate CONTINUE exactly once to the pinned operator equivalent
      of `python -m aios_renew.operator continue TASK-N --executor <surface-selected-executor>
      --repo <exact-python-agent-root>`. It must not inspect RUN/ref/file state, parse error prose,
      call `state` first to choose an operation, map Unified State actions itself, or invoke a second
      kernel command after the first returns.
    - >
      CONTINUE is a pass-through Human-surface operation. Preserve the pinned kernel return code
      and bounded `AIOS_HUMAN_SURFACE` output without using downstream parsing to authorize RUN,
      REMEDIATION, REPAIR, transport, recovery, semantic review, correction authoring, or
      publication. The launcher may emit its existing non-semantic operator framing, but must not
      synthesize a second lifecycle verdict or automatically continue after a delegated operation.
    - >
      Change STATUS to delegate exactly once to pinned `aios state TASK-N` / the equivalent
      `python -m aios_renew.operator state TASK-N --repo <exact-python-agent-root>` read-only
      boundary. STATUS must expose the versioned `AIOS_UNIFIED_STATE` observation and must not
      call the older task-description path as lifecycle status.
    - >
      Preserve RUN -> `aios run`, FIX -> `aios remediate --finding`, and REPAIR -> `aios repair`
      as explicit compatibility/debug paths with their current exact selector validation,
      explicit executor binding, canonical PASS-summary handling, no retry/reroute, and
      review-before-publication behavior. CONTINUE becomes the recommended normal lifecycle path;
      the explicit commands are not removed or silently repurposed.
    - >
      Preserve physical executor identity separation. The Codex `$aios-worker` surface must pass
      only `--executor codex`; the Antigravity `/aios-renew-worker` surface must pass only
      `--executor antigravity`. Neither may mention or select the other executor in its invocation
      instructions. A Human chooses the executor by choosing the surface; the worker adds no model
      recommendation or routing authority.
    - >
      When CONTINUE observes a no-Executor lifecycle action such as WAIT, Reviewer/Brain/Publisher
      handoff, DONE/BLOCKED, transport/recovery where coding is not required, or an eligible
      TASK-064 verification-only NO_CHANGE repair, the downstream layer must not second-guess the
      pinned TASK-087 `executor_required` semantics or force a coding invocation merely because the
      executor-specific surface supplied its identity.
    - >
      Preserve the dedicated `.git/aios/worker-runtime` bootstrap and PEP 610 provenance contract.
      An existing runtime pinned to 32ace104c5cfaa1b7affbaa40157872b1f85147f or any other stale,
      alternate-source, incomplete, or unverifiable installation must be atomically replaced and
      accepted only when installed provenance proves repository `trung-via/AIOS-renew` at exact
      commit a607fb2cf1c57fe35a9a15504df0e98d28de2f5b. No second runtime authority is introduced.
    - >
      Update `docs/CHATGPT_PROJECT_CONTRACT.md` so normal Human guidance uses the repository-owned
      executor-specific CONTINUE/STATUS surfaces after this migration. It must still state that
      the exact checked-in pin is downstream runtime authority, raw `aios ...` commands are internal
      integration details unless debugging, and explicit RUN/FIX/REPAIR remain bounded operational
      escape hatches rather than the normal state-selection burden on the Human.
    - >
      Update the Codex skill, Antigravity workflow, and unified-worker documentation consistently:
      normal examples use `$aios-worker CONTINUE TASK-N` and `/aios-renew-worker CONTINUE TASK-N`;
      STATUS is Unified State inspection; one invocation delegates at most one pinned canonical
      operation; Brain/Reviewer/Publisher handoffs remain external authorities; successful execution
      still requires independent ChatGPT semantic review before source-only publication.
    - >
      Document the adopted upstream boundary precisely. Python Agent adopts TASK-086/TASK-087 only
      by pinning the reviewed source candidate and translating to their public operator surfaces;
      it does not copy AIOS-renew workflow files, create a second state machine, or automatically
      expose every upstream operator command. Existing repository publication remains repository-owned.
    - >
      `.github/workflows/aios-auto-publish.yml` must remain byte-unchanged. It continues to obtain
      publication semantics from the migrated immutable requirements pin; TASK-177 grants no new
      publication or workflow authority.
    - >
      All modified worker/docs/test files must remain UTF-8 without BOM and LF line endings where
      their existing repository format requires it. Do not modify deprecated Antigravity
      `.agents/workflows/aios-worker.md` except by leaving it byte-unchanged.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      The checked-in dependency pin and launcher provenance constant both bind exactly to
      AIOS-renew a607fb2cf1c57fe35a9a15504df0e98d28de2f5b, and deterministic bootstrap tests
      prove stale/alternate/unverifiable worker runtimes are rejected or atomically rebuilt to
      that exact source+commit without another runtime authority.
  - id: AC2
    condition: >
      Launcher regressions prove `CONTINUE TASK-N` accepts only a valid TASK target and delegates
      exactly one pinned operator invocation with the exact repository root and the explicit
      surface-selected executor, with no downstream state/action reconstruction or second kernel call.
  - id: AC3
    condition: >
      CONTINUE regressions prove successful, non-mutating handoff/no-action, blocked, and delegated
      failure outputs are passed through from the pinned Human surface without the launcher selecting
      another operation, retrying, rerouting, synthesizing canonical failure/review state, or requiring
      low-level Human selectors already owned by Unified State.
  - id: AC4
    condition: >
      STATUS regressions prove `STATUS TASK-N` delegates to the pinned read-only Unified State command
      rather than task description, emits its bounded state output, and invokes zero coding Executors
      or mutating lifecycle operations.
  - id: AC5
    condition: >
      Existing explicit RUN/FIX/REPAIR worker regressions remain behaviorally compatible, including
      exact task/finding/failed-run selector validation, executor identity binding, one kernel invocation,
      canonical PASS-summary checks, and no retry/fallback/reroute.
  - id: AC6
    condition: >
      Codex and Antigravity surface documentation exposes CONTINUE and STATUS consistently while
      preserving permanent executor separation: choosing the Codex surface selects only codex,
      choosing the Antigravity surface selects only antigravity, and neither surface adds recommendation,
      ranking, memory, fallback, or cross-surface substitution.
  - id: AC7
    condition: >
      The downstream layer does not force Executor work on pinned TASK-087 states that do not require
      a coding Executor. Tests/documentation make clear that the surface-bound executor identity is
      Human selection available to the kernel, while exact `executor_required` and NO_CHANGE reuse
      decisions remain solely inside pinned AIOS-renew.
  - id: AC8
    condition: >
      `docs/CHATGPT_PROJECT_CONTRACT.md`, the two active worker surfaces, and
      `docs/AIOS_UNIFIED_WORKER_WORKFLOW.md` establish CONTINUE as the normal Human lifecycle command,
      STATUS as Unified State inspection, and RUN/FIX/REPAIR as explicit compatibility/debug paths,
      while preserving ChatGPT semantic review, source-only publication, exact pin authority, and the
      prohibition on raw operator commands in normal downstream guidance.
  - id: AC9
    condition: >
      Product Intelligence source/tests, Phase 6 product roadmaps, deprecated Antigravity surface,
      and `.github/workflows/aios-auto-publish.yml` are unchanged. The existing publication workflow
      continues to consume the same requirements file and gains no new review/publication authority.
  - id: AC10
    condition: >
      Focused worker-control regressions and `git diff --check` pass with no unresolved items and no
      changed files outside the seven explicitly authorized migration files.

verification:
  required:
    - 'python -m pytest tests/aios_bridge/test_aios_worker_control_surface.py -q'
    - 'git diff --check'
