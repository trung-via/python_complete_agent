goal: >
  Reconcile the single Human-operated Generation-8 bounded price-role diagnostic attempt as
  consumed SUCCESS with exact external V5 artifact provenance, preserve evidence_authority NONE and
  unresolved Product Truth uncertainty, and harden only TikTokPdpCollector's bounded current/original
