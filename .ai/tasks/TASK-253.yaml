      source_review_id REVIEW-252-001 and source_published_sha
      e4bd532699d91d915ddfba54e94ce614a98dad35. Preserve diagnostic_v5_implementation_source_sha and
      generation_8_execution_source_sha as
      0c23b4f0530f17f8bb77e23f8199fc167a6e68b1 from TASK-251.
    - >
      Canonicalize the consumed external Gen-8 operation as Human-operated, not an AIOS RUN:
      generation_8_authorized true, generation_8_authorized_diagnostic_attempts 1,
      generation_8_authorized_diagnostic_attempts_remaining 0,
      generation_8_diagnostic_execution_owner HUMAN_OPERATOR, generation_8_diagnostic_executed true,
      diagnostic_outcome SUCCESS, diagnostic_artifact_created true and live_dom_diagnostic_authority
      NONE. Do not infer a process exit code or session-release status not present in supplied
      evidence.
    - >
      Record exact V5 artifact provenance: filename tiktok-pdp-dom-diagnostic-v5.json,
      schema_version 5, SHA256 A61B58FC41B4CBDDB0F83A65625325F3685147C6948F74CA8D041C8658B40DD7,
      size_bytes 34929, observed_at 2026-09-26T07:43:19.570359+00:00 and evidence_authority NONE.
      Never persist the Human local filesystem path.
    - >
      Record exact bounded Gen-8 observations without promoting them: selected_root_kind
      TITLE_LOCAL_COMMERCE_QUORUM, selected_title_local_ancestor_level 2; price_role_probe
      bounded_nodes_scanned 90, bounded_scan_truncated false, currency_candidate_count 6,
      collector_eligible_candidate_count 6, leaf_candidate_count 4,
      strike_through_signal_count 1, explicit_current_structural_signal_count 0,
      explicit_original_structural_signal_count 1, unresolved_role_candidate_count 5,
      range_like_candidate_count 0, multi_numeric_candidate_count 3,
      distinct_text_equivalence_group_count 4 and candidate_sample_count 6. Preserve
      evidence_authority NONE and SNAPSHOT_IS_NOT_TREND.
    - >
      Record mandatory Brain review disposition as
      BOUNDED_PAIRED_PRICE_CURRENT_ROLE_ADMISSION_HARDENING_JUSTIFIED with review scope
      ENGINEERING_DIAGNOSTIC_ONLY and insufficient_diagnostic_resolution false. This means only that
      a narrow collector role-admission hardening is justified. It does not declare canonical
      current price, parser defect, selector defect, Product Truth, acquisition readiness,
      marketplace-global causation or future validation success.
    - >
      Keep current_price_validation_status UNKNOWN and current_price_observed null. Keep
      original_price_validation_status OBSERVED_ONLY and original_price_observed 68220.0 from the
      prior validation lineage. Keep canonical_evidence_ingested false,
      price_role_resolution_complete false and selector_repair_complete false. Gen-8 diagnostic
      evidence must not change product-field truth.
    - >
      Modify only TikTokPdpCollector's existing bounded root-scoped DOM price-role admission in
      src/product_intelligence/adapters/tiktok_pdp.py. Preserve the shared bounded root resolver,
      maximum 300-node/candidate observation budget, fail-closed truncation, interactive/title
      subtree exclusions, existing explicit-current admission and existing
      strike-through/explicit-original admission.
    - >
      Add one generic bounded paired-price inference rule. The rule may emit an otherwise unresolved
      non-struck leaf-equivalence group into current_price_candidates only when all of the following
      are structurally established inside the already-resolved bounded root: exactly one plausible
      unresolved non-struck leaf-equivalence group participates in one local price cluster; exactly
      one distinct leaf-equivalence group in that same bounded local cluster is deterministically
      original by strike-through or existing explicit-original evidence; wrapper/leaf observations
      carrying equivalent candidate text are collapsed for role reasoning so wrappers do not create
      extra semantic candidates; the inferred current group is neither interactive nor inside the
      title subtree; and no candidate in the pair has conflicting current/original structural role
      evidence. Executor owns HOW but must prove these semantics deterministically.
    - >
      The paired local cluster must be established by generic bounded DOM containment/proximity
      semantics, not TikTok-specific classes, hashed class names, fixed ancestor levels, fixed child
      indices, price magnitude ordering, first-match behavior or marketplace-specific labels. A
      non-struck price elsewhere in the bounded root is not sufficient.
    - >
      Fail closed and infer no paired current candidate when there are multiple plausible unresolved
      non-struck equivalence groups in the local cluster, multiple possible deterministic-original
      groups, conflicting explicit roles, unrelated local currency observations, range-like role
      ambiguity that cannot remain safely delegated to the scalar parser, traversal truncation, or
      otherwise non-unique pairing. Existing explicit-current candidates may continue through their
      existing path but must not be silently merged with a contradictory paired inference.
    - >
      Paired-role inference is candidate-role admission only. It must emit raw bounded candidate text
      into the existing current_price_candidates channel and must not parse, normalize to a scalar,
      compare numeric price magnitude, rank candidates or decide Product Truth. Existing
      parse_tiktok_pdp_price remains the sole scalar admission authority and must stay byte-unchanged;
      equivalent duplicates may reconcile there, while ranges, conflicting scalars or ambiguous
      values remain None under existing rules.
    - >
      Add deterministic regression directly against the generated collector extraction script or an
      equivalent deterministic executable harness proving at minimum: one generic unresolved
      non-struck leaf group uniquely paired with one struck/explicit-original leaf group admits the
      non-struck group as current and the original group as original; wrapper/leaf duplicates of the
      same current text do not create multiple semantic current candidates; two plausible non-struck
      groups infer none; two possible original groups infer none; unrelated shipping/coupon-style
      currency observations do not pair across unrelated local structure; interactive and
      title-subtree currency candidates remain excluded; conflicting current/original role evidence
      fails closed; existing explicit-current behavior remains intact; and truncated bounded price
      observation still returns empty current/original candidate sets.
    - >
      Preserve scalar reconciliation regressions proving one exact current scalar is admitted,
      equivalent duplicates reconcile, zero remains distinct from missing, ranges return None,
      conflicting current scalars return None and original-price scalar reconciliation remains
      unchanged. Do not weaken tests to encode the Gen-8 live raw value, which is intentionally not
      present in the sanitized artifact.
    - >
      Do not modify the V5 diagnostic to make it mirror the new paired-role admission. TASK-253 uses
      the completed Gen-8 diagnostic only as historical bounded engineering evidence; diagnostic
      semantics remain frozen at TASK-251. Any future observability change requires separate
      authority.
    - >
      Exact reviewed TASK-253 publication closes Gen-8 diagnostic execution and records
      paired_price_current_role_hardening_implemented true while keeping
      price_role_resolution_complete false until a separately authorized future collector
      validation. It grants zero fresh live attempts.
    - >
