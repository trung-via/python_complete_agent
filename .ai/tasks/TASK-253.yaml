  explicit Generation-8 job root was fresh with V1-V5 diagnostic artifacts absent. The one-shot
  carrier was then invoked exactly once and returned schema-V5 diagnostic status SUCCESS for
  context p8-pilot-001-led-motion-tiktok-vn and source ID 1731381331718341815 at
  2026-09-26T07:43:19.570359+00:00. The create-exclusive external artifact
