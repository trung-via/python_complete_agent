goal: >
  Reconcile the single Human-operated Generation-8 bounded price-role diagnostic attempt as
  consumed SUCCESS with exact external V5 artifact provenance, preserve its evidence_authority
  NONE and all unresolved Product Truth uncertainty, and harden only TikTokPdpCollector's bounded
