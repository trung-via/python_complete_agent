constraints:
  hard:
    - >
      Classification is exactly
      GENERATION_8_SUCCESS_RECONCILIATION_AND_BOUNDED_PAIRED_PRICE_CURRENT_ROLE_ADMISSION_HARDENING_ONLY.
    - >
      Reconcile exact lineage source_task_id TASK-252, source_run_id RUN-252-002,
      source_review_id REVIEW-252-001, source_published_sha
      e4bd532699d91d915ddfba54e94ce614a98dad35. Preserve V5 implementation/execution source as
      0c23b4f0530f17f8bb77e23f8199fc167a6e68b1.
    - >
      Canonicalize Gen-8 as Human-operated consumed SUCCESS, not an AIOS RUN:
      generation_8_authorized true, attempts 1, attempts_remaining 0, owner HUMAN_OPERATOR,
      executed true, diagnostic_outcome SUCCESS, diagnostic_artifact_created true and
      live_dom_diagnostic_authority NONE. Do not invent exit/session-release evidence.
    - >
      Record exact artifact provenance: tiktok-pdp-dom-diagnostic-v5.json, schema 5,
      SHA256 A61B58FC41B4CBDDB0F83A65625325F3685147C6948F74CA8D041C8658B40DD7,
      size_bytes 34929, observed_at 2026-09-26T07:43:19.570359+00:00,
      evidence_authority NONE. Never persist the Human local path.
    - >
      Record exact bounded observations: TITLE_LOCAL_COMMERCE_QUORUM level 2;
      bounded_nodes_scanned 90; bounded_scan_truncated false; currency 6; eligible 6; leaf 4;
      strike-through 1; explicit-current 0; explicit-original 1; unresolved 5; range-like 0;
      multi-numeric 3; text-equivalence groups 4; candidate samples 6. State explicitly that the
      sample set is exhaustive only for this bounded observation and does not carry node identity
      proving exact pair membership.
    - >
      Brain review disposition is
      BOUNDED_PAIRED_PRICE_CURRENT_ROLE_ADMISSION_HARDENING_JUSTIFIED with scope
      ENGINEERING_DIAGNOSTIC_ONLY, insufficient_diagnostic_resolution false and
      exact_pair_membership_proven false. This authorizes only a conservative generic hardening.
    - >
      Keep current_price_validation_status UNKNOWN/current_price_observed null,
      original_price_validation_status OBSERVED_ONLY/original_price_observed 68220.0,
      canonical_evidence_ingested false, price_role_resolution_complete false and
      selector_repair_complete false.
    - >
      Preserve existing bounded-root resolver, 300-node/candidate budget, fail-closed truncation,
      interactive/title exclusions, explicit-current admission and strike-through/explicit-original
      admission. The new rule is additive only for otherwise unresolved paired-role admission.
    - >
      For paired-role reasoning, begin only from eligible leaf currency candidates after existing
      interactive/title filtering. Collapse wrapper/leaf semantic duplicates only by a
      non-semantic text key defined exactly as trim plus collapse Unicode/ASCII whitespace runs to a
      single space. Do not case-fold, parse numbers, normalize punctuation/currency, convert k/M,
      compare magnitudes or otherwise create scalar equivalence in this layer.
    - >
      Paired inference runs only when the entire eligible bounded leaf set contains ZERO
      non-conflicted explicit-current groups. If any valid explicit-current leaf group exists, use
      the existing explicit-current path and do not infer an additional paired current group. Any
      group carrying both current and original evidence is role-conflicted and cannot participate
      in inference.
    - >
      Define a candidate local pair structurally. For one unresolved non-struck leaf-equivalence
      group U and one deterministic-original leaf-equivalence group O, compute their nearest common
      ancestor NCA within the already-resolved bounded PDP root. NCA must be a strict descendant of
      the bounded root. After eligibility, leaf filtering and whitespace-only equivalence collapse,
      the NCA subtree must contain exactly two distinct eligible currency groups: U and O. U must
      have no explicit current/original evidence and no strike-through. O must be original by
      strike-through or existing explicit-original evidence and must not have explicit-current
      conflict. The pair is valid only when this condition is structurally satisfied without
      marketplace-specific selectors, fixed depth/index or numeric reasoning.
    - >
      Global paired inference requires uniqueness: across the bounded eligible leaf-group set there
      must be exactly one valid U/O candidate pair. Zero or more than one valid pair means infer
      nothing. This prevents cross-pairing between multiple price presentations or unrelated
      currency clusters. A pair whose only common ancestor is the bounded root is invalid.
    - >
      The role layer must not inspect numeric_token_count, range syntax, price magnitude,
      current<original ordering, discount arithmetic or scalar parse results to decide pair
      membership. If a structurally valid inferred current candidate contains a range or otherwise
      ambiguous scalar text, it may enter current_price_candidates and the existing sole parser
      must return None according to AMBIGUOUS_PRICE_IS_NOT_EXACT_PRICE.
    - >
      Paired inference emits only the raw bounded candidate text for the unique U group into the
      existing current_price_candidates channel. It does not parse, normalize to scalar, rank or
      decide Product Truth. Existing parse_tiktok_pdp_price remains sole scalar authority and
      src/product_intelligence/adapters/tiktok_parsing.py must stay byte-unchanged.
    - >
      Semantic verification must exercise the paired-role decision implementation, not merely assert
      source substrings. Source-string assertions alone are insufficient for AC4/AC6. If Executor
      keeps paired-role decision logic in generated JavaScript, tests must execute that exact
      generated decision path against a deterministic offline synthetic DOM/runtime with zero
      network/CDP. If no reliable JS runtime is available, Executor may factor only the paired-role
      decision into a pure deterministic helper inside src/product_intelligence/adapters/tiktok_pdp.py
      and make the JS emit bounded structural facts consumed by that helper; in that design the pure
      helper must be the sole paired-role decision implementation and JS must not contain a duplicate
      paired-role predicate. Existing explicit-current/original observation behavior may remain in
      JS. No second semantic owner or test-only mirror is allowed.
    - >
      Deterministic regressions must prove at minimum: one valid unique U/O structural pair admits U
      as current and O as original; same-text wrapper/leaf differing only whitespace collapses;
      same numeric value expressed by textually different strings does NOT collapse in role layer;
      two plausible U groups infer none; two possible O groups infer none; a third eligible currency
      group inside NCA invalidates the pair; two independent valid-looking clusters produce no
      global inference; a U/O whose NCA is only the bounded root produces no inference; unrelated
      shipping/coupon currency does not cross-pair; interactive/title candidates remain excluded;
      role-conflicted group fails closed; explicit-current plus original uses existing explicit path
      and no paired inference; explicit-current plus unresolved plus original does not add unresolved;
      structurally valid paired current containing range text reaches scalar parser but final price
      remains None; and truncated observation still yields empty current/original candidate sets.
    - >
      Preserve existing scalar regressions for one exact scalar, equivalent scalar duplicates,
      zero vs missing, ranges None, conflicting scalars None and original-price reconciliation.
      Do not encode or reconstruct an unavailable Gen-8 raw scalar.
    - >
      Do not modify V5 diagnostic to mirror the new rule. Diagnostic semantics stay frozen at
      TASK-251; any future observability change requires separate authority.
    - >
      Exact reviewed TASK-253 publication records
      paired_price_current_role_hardening_implemented true, closes Gen-8 live authority, but keeps
      price_role_resolution_complete false until separately authorized future collector validation.
      It grants zero fresh live attempts.
    - >
      Exact TASK-253 publication hands off only to
      HUMAN_BRAIN_FRESH_POST_GEN8_PAIRED_PRICE_COLLECTOR_VALIDATION_AUTHORIZATION.
      Keep active_track.next_milestone null, post_p8_planning_handoff.next_milestone null,
      pending_commitments empty, post_run_engineering_successor null, automatic_live_pilot false,
      automatic_progression false; generation_9_authorized false and
      generation_9_authorized_diagnostic_attempts 0 if represented.
    - >
      Keep live_public_pdp_acquisition_authority NONE,
      automated_public_pdp_acquisition_authority NONE, market_test_or_action_authority NONE,
      selector_repair_authority NONE, arbitrary_target_authority NONE,
      replacement_target_authority NONE, search_authority NONE, batch_authority NONE,
      inferred_identity_authority NONE and variant_switching_authority NONE.
    - >
      Add docs/PHASE_8_PUBLIC_TIKTOK_PDP_GEN8_RESULT_AND_PAIRED_PRICE_ROLE_HARDENING.md documenting
      exact lineage/provenance, bounded-hypothesis limitations, formal paired-role invariants,
      parser ownership, closed authorities and Human/Brain-only future validation handoff.
    - >
      Update both roadmap docs and .ai/roadmap-state.yaml publication-gated. Historicalize TASK-252
      authorization assertions without weakening one-shot history. TASK-253 becomes owner of current
      Gen-8 consumed-state and paired-role-hardening assertions after publication. Do not introduce
      duplicate direct-child keys in post_p8_planning_handoff.
    - >
      Modify exactly seven authorized paths. Runtime owns verification. Executor must produce one
      candidate and one ResultPackage and must not publish, review, access TikTok/CDP, invoke live
      diagnostic/collector, authorize validation, create Gen-9 authority or start successor work.

