    click, type, scroll, search, switch variants or perform any marketplace operation during
    TASK-253 engineering or verification.
  - Modify tiktok_pdp_dom_diagnostic.py, tiktok_pdp_dom_scope.py, tiktok_parsing.py, CLI,
    tiktok_pdp_live_pilot.py, Playwright manager/session, ProductCandidateSnapshot models or any
    non-authorized production path.
  - Persist or reconstruct raw Gen-8 candidate price text/value from sanitized diagnostic evidence.
  - Declare any Gen-8 sanitized candidate to be the canonical current price, Product Truth,
    recommendation, ranking, approval, trend, acquisition readiness or commerce-action evidence.
  - Introduce TikTok-specific current-price CSS classes, hashed class names, ancestor level,
    first-match selector, fixed sibling index, current-vs-original numeric comparison, variant
    assumption, visual-size-only rule or marketplace-specific text token as canonical role authority.
  - Change scalar parsing, bypass parse_tiktok_pdp_price, add a second price parser, admit ranges or
    conflicting scalars, or weaken AMBIGUOUS_PRICE_IS_NOT_EXACT_PRICE.
  - Infer current role merely because a price is not struck through or merely because one original
    candidate exists somewhere in the bounded root.
  - Authorize a second Gen-8 invocation, Generation-9 diagnostic, live collector validation,
    arbitrary/replacement target, selector repair, acquisition, automated acquisition, market test,
    commerce action, automatic retry or automatic progression.

