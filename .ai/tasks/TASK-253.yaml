      exact_pair_membership_proven false, current_price UNKNOWN/null, original_price OBSERVED_ONLY
      68220.0, evidence_authority NONE and no Product Truth/causation overclaim.
  - id: AC4
    condition: >
      TikTokPdpCollector alone gains the formal fail-closed paired-role semantics: whitespace-only
