  tiktok-pdp-dom-diagnostic-v5.json has SHA256
  A61B58FC41B4CBDDB0F83A65625325F3685147C6948F74CA8D041C8658B40DD7, size 34929 bytes,
  evidence_authority NONE. Selected root was TITLE_LOCAL_COMMERCE_QUORUM level 2. price_role_probe
