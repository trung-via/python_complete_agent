  only when it is uniquely and locally paired with exactly one deterministically original
  strike-through/explicit-original leaf-equivalence group inside the already-resolved bounded PDP
  root. Preserve src/product_intelligence/adapters/tiktok_parsing.py as the sole scalar-price
  admission authority. TASK-253 performs no TikTok/CDP operation and grants no live validation,
  acquisition, selector, market-action, retry, or Generation-9 authority.

