task_id: TASK-174
revision: 1

goal: >
  Continue P6.3b with one narrow Shopee live-DOM structural-depth hardening inside the existing
  ShopeeSourceExtractor so the already-published TASK-172/TASK-173 selected-variant evidence
  contract can observe the exact current Shopee selection-box hierarchy proven by Human-owned
  live diagnostics. Preserve TASK-162 readiness, TASK-172 selected-variant semantics, TASK-108
  relationship authority, TASK-116 Human sellable-variant admission, TASK-171 descriptive truth,
  ProductSourcePack schema, and browser/session ownership unchanged.

problem: >
  TASK-173 was published at candidate f91dfe0f900664c835fef86bdf5d6c75879dbbdc after
  REVIEW-173-002 DELTA PASS. A post-publication Human-owned live recheck on the same Shopee listing
  source_product_id 10374101498, with healthy CDP 9222, matching structured product identity, and
  explicit Human selection of "K550 Trắng Red V4", still returned
  selected_variants_complete=false and selected_variants=[]. A bounded live DOM diagnostic then
  isolated the exact structural mismatch. The bounded current-product scope is already found
  correctly and contains exactly four selection-box buttons, exactly one selected. All four buttons
  share one immediate option-cluster DIV. However, the real hierarchy is button -> immediate option
  cluster -> one transparent wrapper DIV -> labelled SECTION group. That SECTION has direct children
  H2 "Model" and the wrapper containing the option cluster. Quantity/stock is outside that SECTION as
  a sibling section one level higher. Current TASK-173 code instead fixes optionCluster=opt.parentElement
  and grp=optionCluster.parentElement, then requires group-label evidence directly on that immediate
  parent. On the real hierarchy grp is the transparent wrapper containing only the option cluster,
  so inference returns null before reaching the actual labelled SECTION. This task corrects only that
  proven structural-depth regression while retaining TASK-173 F1 protection against climbing into
  arbitrary Quantity/stock or other product-detail text. It is blocker hardening, not live
  certification and not a new variant-evidence authority.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-174 authoring is
    f91dfe0f900664c835fef86bdf5d6c75879dbbdc, the published TASK-173 source candidate.
  - >
    Canonical REVIEW-173-002 on branch aios/review-decision/RUN-173-002 has
    reviewed_sha f91dfe0f900664c835fef86bdf5d6c75879dbbdc, mode DELTA, verdict PASS,
    prior_finding_id F1, acceptance AC5 PASS, and no findings.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@32ace104c5cfaa1b7affbaa40157872b1f85147f.
  - >
    TASK-162 remains the sole Shopee product-page bounded same-page readiness authority. TASK-174
    must not change first-trusted-media-ready termination, attempts/delay, browser/session
    acquisition, navigation count, or CAPTCHA ownership.
  - >
    TASK-172 remains the selected-variant source-evidence semantic authority. TASK-173 is a
    compatibility hardening of the same private DOM observation path. TASK-174 extends that same
    implementation boundary only for the newly proven wrapper depth; it creates no second group
    resolver or selected-variant authority.
  - >
    TASK-108 remains the sole pairwise ProductSourcePack relationship resolver; TASK-116 remains
    the sole sellable-variant proposal/Human-decision authority; TASK-171 remains the sole
    descriptive product-truth reconciliation authority.
  - >
    The Human-owned 2026-09-09 live diagnostic proves this exact bounded shape for the current
    listing: one current-product scope, four selection-box options, exactly one selected, all options
    sharing one immediate parent, then one transparent wrapper, then one SECTION whose direct
    children are H2 "Model" and the option-bearing wrapper; Quantity/stock is a sibling section above
    that group. The external diagnostic is operational evidence only and must not be committed.

