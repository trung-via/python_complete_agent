non_goals:
  - Modify ProductSourcePack, ProductFact, OriginalMediaRef, serialization schema/version,
    source_pack_id, source identity, media downloader, or persisted manifest contracts.
  - Modify TASK-108 relationship/variant-key/normalization/confidence/precedence semantics;
    TASK-115/TASK-116/TASK-117 variant evidence/admission; TASK-120 persistence; TASK-121 profiles;
    TASK-171 truth; or retrieval/RAG/ranking/provider/application authorities.
  - Modify TASK-162 readiness behavior, timing bounds, first-media-ready termination,
    BrowserManager/BrowserSession/CDP lifecycle, page acquisition, navigation count, or public
    ShopeeScrapeTool behavior.
  - Add a second Shopee extractor, alternate browser/page, network/API fallback, second navigation,
    retry/reroute, stealth/proxy behavior, login automation, CAPTCHA solving, or automatic
    marketplace selection.
  - Infer selected variant from display_model_id, rModelId, vModelId, URL/query state, title,
    model_sku, media labels, image changes, price, quantity, stock, recommendation state, or text
    similarity.
  - Scan document/body/[role="main"]/generic containers or arbitrary whole-page controls. Positive
    current-product scope and existing structured identity anchoring remain mandatory.
  - Treat gallery thumbnail-selected-mask, Quantity/stock controls, add-ons, vouchers, shipping,
    recommendations, reviews, related products, or lower-page content as variation evidence.
  - Hard-code minified/hash-like live classes such as lK5dVS, zMC_pN, Lj3peW, wnyXtI, UmZuAo,
    dPpMsC, wC4xhr, Jnv7Db, vr0998, or similar unstable tokens as semantic selectors.
  - Reopen, rewrite, rerun, repair, or republish TASK-173 lineage. TASK-174 starts from published
    current main and preserves TASK-173 F1 behavior as regression authority.
  - Add live Shopee verification to AIOS Runtime. Post-publication Human-owned live recheck remains
    a separate checkpoint.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Keep ShopeeSourceExtractor as the sole Shopee product-page source/DOM extraction authority and
      preserve its public constructor/extract signature, exact one page/session acquisition, exact
      one navigation, TASK-162 readiness semantics, trusted media rules, media roles/provenance/order,
      ProductSourcePack identity, optional metadata, existing facts prefix, exception classes, and
      TASK-172 selected-variant ProductFact contract.
    - >
      Preserve current TASK-173 positive-scope expansion. The current live diagnostic already proves
      the bounded current-product scope is found and contains exactly the four intended selection-box
      controls. TASK-174 must not broaden scope discovery or add document/body/global fallback.
    - >
      Preserve exact selection-box-selected / selection-box-unselected candidate and explicit
      selection semantics. Do not introduce broad substring-selected matching or new option families.
    - >
      Refine only selection-box group inference so the immediate option cluster may be separated from
      its true labelled group by a bounded chain of transparent option-bearing wrappers. Starting from
      an option's immediate cluster, choose the nearest ancestor below variantScope that proves one
      deterministic semantic label-plus-option-branch relationship. Do not stop at an unlabeled
      transparent wrapper and do not climb merely because an ancestor contains arbitrary text.
    - >
      A transparent wrapper is structural only: it may contain the option-bearing branch but may not
      contribute a group label, may not introduce an independent candidate-option branch, and may not
      authorize unrelated sibling text. Traversal must remain finite and bounded inside variantScope;
      no unbounded ancestor search is allowed.
    - >
      For an inferred selection-box group, accept group-label evidence only from explicit group
      attributes already supported by the extractor or from one deterministic semantic direct child
      label outside the option-bearing branch, such as label or heading semantics. The proven live
      H2 "Model" must be accepted without using its minified class. Arbitrary descendant or sibling
      div/span/p text must not become label evidence merely because it is nonblank.
    - >
      The valid inferred group must have exactly one accepted label source and one deterministic
      direct child branch containing that group's candidate options, with no second independent
      option-bearing child. A higher ancestor containing multiple group/purchase sections must not
      collapse them into one group. Quantity/stock one level above the live Model SECTION must remain
      excluded even when the true group label is missing or blank.
    - >
      Preserve TASK-172/TASK-173 all-or-nothing semantics across the unified bounded variation scope:
      every candidate option belongs to exactly one accepted group, every group has exactly one
      explicit selected option, labels are nonblank, duplicate/ambiguous group identity fails closed,
      and any uncovered/multiply-covered/unlabelled/zero-selected/multi-selected state emits zero
      selected-variant evidence.
    - >
      Preserve exact raw observed group and option strings in retained selected_variants and appended
      ProductFact values. Whitespace trimming may be used only for validity/duplicate checks and must
      not rewrite retained observations.
    - >
      Add or refine an offline DOM fixture to reproduce the exact newly proven hierarchy without
      minified classes: one bounded current-product card containing a gallery anchor, details branch,
      labelled SECTION with direct H2 "Model" plus one wrapper DIV whose only child is the immediate
      option-cluster DIV, four selection-box buttons with exactly the second selected, and a separate
      Quantity/stock SECTION outside the labelled group. This shape must return
      selected_variants_complete=true and exactly [{group_label: "Model", option_label:
      "K550 Trắng Red V4"}].
    - >
      Add focused negative regressions on that same nested-wrapper hierarchy proving missing or blank
      Model still fails closed despite surrounding Quantity/stock; an extra independent option-bearing
      sibling branch fails closed; and a higher unrelated semantic heading cannot be used to relabel
      an unlabeled inner group. Existing TASK-173 Quantity/stock, ambiguous-root, identity-mismatch,
      zero/multiple-selection, mixed old/new control, gallery-mask, add-on, and exact-string
      regressions must remain green.
    - >
      Existing TASK-172 ProductSourcePack and unchanged TASK-108 compatibility regressions must remain
      green. TASK-174 must not add local identity classification or a new ProductFact mapping path.
    - >
      Keep verification fully offline/deterministic with no live Shopee/CDP 9222, Google Drive,
      provider/model, real sleep, or Human interaction. Do not persist raw live HTML, cookies,
      account data, or the uploaded diagnostic artifact.
    - >
      Update lifecycle documentation consistently: TASK-171/P6.3a remains CLOSED/PUBLISHED at
      3a33748905154b4822cfc164999e5c57780e67f2; TASK-172/P6.3b source hardening remains
      CLOSED/PUBLISHED at 63525151e4dbb7a1c30454a301e3c0e20ae771e9; TASK-173 live-DOM hardening is
      CLOSED/PUBLISHED at f91dfe0f900664c835fef86bdf5d6c75879dbbdc; TASK-174 is the current narrow
      P6.3b structural-depth blocker hardening; P6.2 remains PARKED/reopenable; live exact-variant/
      product-truth certification remains downstream; P6.4-P6.6 remain deferred/unimplemented.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      TASK-174 changes only ShopeeSourceExtractor internals, focused DOM regressions, Product Source
      Pack/P6.3 documentation, and the two canonical roadmaps, with no new schema, browser, readiness,
      resolver, identity, catalog, persistence, retrieval, or truth authority.
  - id: AC2
    condition: >
      The exact nested-wrapper live shape is accepted: four selection-box buttons inside one bounded
      current-product scope, second option selected, immediate option cluster wrapped once before the
      labelled SECTION, exact group label "Model", and result selected_variants_complete=true with
      the exact selected option string.
  - id: AC3
    condition: >
      Selection-box group inference uses a finite bounded transparent-wrapper traversal to the nearest
      structurally proven semantic label-plus-option group and never uses arbitrary higher ancestor
      text as label evidence.
  - id: AC4
    condition: >
      Missing/blank Model, surrounding Quantity/stock, an extra independent option-bearing sibling,
      or a higher unrelated heading cannot create or relabel variant evidence; each fails closed to
      zero selected-variant facts.
  - id: AC5
    condition: >
      Existing TASK-172/TASK-173 all-or-nothing candidate coverage, exact raw label preservation,
      structured identity gating, old/new option coexistence, gallery/add-on exclusions, and
      zero/multiple-selection behavior remain semantically unchanged.
  - id: AC6
    condition: >
      Existing selected-variant ProductFact mapping and unchanged TASK-108 relationship regressions
      remain green; no local identity classification, schema change, or second variant-evidence path
      is introduced.
  - id: AC7
    condition: >
      TASK-162 readiness, exact one acquisition/navigation, Human CAPTCHA/selection ownership,
      media extraction/provenance/order, scraper compatibility, and offline behavior remain unchanged.
  - id: AC8
    condition: >
      Documentation marks TASK-173 published at f91dfe0f900664c835fef86bdf5d6c75879dbbdc,
      TASK-174 current narrow P6.3b blocker hardening, P6.2 parked/reopenable, and live exact-variant/
      product-truth certification still downstream rather than complete.
  - id: AC9
    condition: >
      Required verification and git diff check pass with zero unresolved items and no changed files
      outside TASK-174 scope.

