task_id: TASK-194
revision: 2

goal: >
  Establish the canonical Python Agent Manifesto as the first milestone of the Python Agent
  Governance Foundation, centered explicitly on a durable Commerce Intelligence doctrine rather
  than only repository governance. The Manifesto must define WHY Python Agent exists, what
  "Intelligence" means in this product, which epistemic and decision values are non-negotiable,
  and how Product Intelligence can later compose into Media Intelligence, Distribution
  Intelligence, and Commerce Operations Intelligence without collapsing evidence, knowledge,
  hypotheses, decisions, authority, or learning into one opaque autonomous system.

problem: >
  TASK-194 revision 1 correctly emphasized Human intent, evidence, uncertainty, authority,
  fail-closed behavior, and product/substrate separation, but Human/Brain audit found that it
  under-specified the core philosophy implied by the published Product Intelligence architecture.
  Current M2, M3/P6.3, M4, and P7.1 already distinguish observed evidence from product truth,
  scoring from approval, grounded answers from factual truth, static snapshots from velocity, and
  missing evidence from negative evidence. Yet no canonical product-level doctrine states the
  larger intelligence loop that connects evidence, knowledge, hypotheses, decision-relevant
  uncertainty, action, outcomes, and learning. Without that doctrine, future Commerce AI work could
  mistake more data for more intelligence, optimize internal scores instead of decision quality,
  automate without justified delegation, collect every missing field without Value-of-Information
  reasoning, treat prediction as truth, or learn from outcomes by rewriting historical evidence.
  Revision 2 must correct that philosophical gap while remaining a Manifesto, not a Constitution.

assumptions:
  - >
    Canonical python_complete_agent main at revision-2 authoring is
    9e0aa60d0836a31613bb0ab20b50fcc7033fad68. TASK-194 revision 1 is authored only; no
    TASK-194 implementation/review/publication lineage exists, so revising the task contract before
    execution does not supersede an admitted candidate.
  - >
    `.ai/roadmap-state.yaml` remains the canonical Brain planning bookmark with
    `PYTHON_AGENT_GOVERNANCE_FOUNDATION` ACTIVE and `PYTHON_AGENT_MANIFESTO` as the unique NEXT
    milestone. Constitution, Python Agent Product Contract, and ChatGPT Project Contract
    reconciliation remain later distinct milestones.
  - >
    The exact downstream AIOS runtime authority remains
    `aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@2599202afedb0622e9e9bdc7b5a15f34da01cc27`.
    AIOS-renew is execution substrate only and is not Python Agent product-governance authority.
  - >
    Published M2 Winning Product Intelligence frames intelligence as allocating scarce deeper
    Agent resources using reproducible score, confidence, explanation, and evidence trail; unknown
    factual market values remain unknown, velocity is not inferred from a static snapshot, and
    decision bands are advisory rather than automatic approval.
  - >
    Published P6.3 preserves unresolved conflicting product evidence rather than selecting a
    preferred/latest/majority/model winner automatically. Published M4 distinguishes structurally
    grounded answers from semantic entailment or factual truth. Published TASK-191/P7.1 shows that
    high missingness is a measurement, not automatic authorization to build an enrichment
    collector. These existing authorities are inputs to the philosophy; this TASK does not rewrite
    them.
  - >
    Human explicitly approved the deeper Intelligence audit before revision 2: the Manifesto
    should be organized around the doctrine `Evidence -> Knowledge -> Hypothesis -> Intelligence
    -> Decision -> Action -> Outcome -> Learning`, with explicit distinctions that Data is not
    Intelligence, Score is not Intelligence, Automation is not Intelligence, and Prediction is
    not Truth.

scope:
  inspect:
    - .ai/roadmap-state.yaml
    - .ai/aios-adoption-state.yaml
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md
    - docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md
    - docs/PHASE_6_M2_PRODUCT_INTELLIGENCE.md
    - docs/PHASE_6_M2_DISCOVERY.md
    - docs/PHASE_6_P6_3_PRODUCT_TRUTH_RECONCILIATION.md
    - docs/PHASE_6_M4_GROUNDED_ANSWER.md
    - docs/PHASE_7_P7_0_WINNING_PRODUCT_EVIDENCE_QUALITY.md
    - docs/PHASE_7_P7_1_REAL_EVIDENCE_COVERAGE_BASELINE.md
    - .ai/tasks/TASK-192.yaml
    - .ai/tasks/TASK-193.yaml
  modify:
    - docs/PYTHON_AGENT_MANIFESTO.md
    - tests/governance/test_python_agent_manifesto.py

non_goals:
  - >
    Modify production Python, Product Intelligence behavior, marketplace/browser/session logic,
    discovery, scoring/ranking, Human approval, identity, persistence, retrieval/RAG,
    provider/model, CLI, Media Intelligence, Distribution Intelligence, Commerce Operations, or
    any product Runtime.
  - >
    Modify AIOS dependency pin, AIOS adoption state, worker surfaces, Unified State/Human Surface,
    Executor semantics, publication, correction, repair, synchronization, or any AIOS-renew
    implementation.
  - >
    Author the Python Agent Constitution, Python Agent Product Contract, or ChatGPT Project Contract
    reconciliation. Those remain distinct later Governance Foundation milestones.
  - >
    Define enforceable role/permission matrices, amendment procedure, conflict-resolution or
    precedence hierarchy, constitutional compliance/enforcement mechanics, lifecycle state
    machines, exact publication rules, or executable governance policy. Those belong to the
    Constitution or later contracts.
  - >
    Define new Winning Product signals, scoring weights, thresholds, calibration algorithms,
    recommendation semantics, winner labels, marketplace acquisition methods, P7.2 implementation,
    autonomous optimization policy, or automatic evidence-enrichment priority.
  - >
    Treat hypotheses, recommendations, scores, confidence, grounded answers, predictions, or model
    outputs as canonical product truth or Human approval.
  - >
    Grant new autonomous mutation authority. The Manifesto may value bounded delegation in
    principle, but current Human-explicit approval/admission authorities remain unchanged until a
    later canonical authority explicitly changes them.
  - >
    Copy AIOS-renew Manifesto/Constitution text or make AIOS governance the Python Agent product
    authority.
  - >
    Advance `.ai/roadmap-state.yaml` inside Executor implementation. Manifesto remains NEXT until
    exact TASK-194 source is semantically PASS, source-published, and a fresh Brain-owned roadmap
    reconciliation canonically marks it DONE and advances Constitution to NEXT.
  - >
    Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Add exactly one canonical product-governance document at
      `docs/PYTHON_AGENT_MANIFESTO.md`. It must be concise enough for routine Human/Brain reading,
      durable enough to outlive individual tasks/providers/executors, and independent from mutable
      marketplace DOM details, model names, exact AIOS task numbers, benchmark values, or temporary
      implementation state.
    - >
      The Manifesto must state the North Star in durable product language: Python Agent exists to
      reduce decision-relevant uncertainty in commerce by transforming attributable observations
      into trustworthy knowledge and auditable intelligence that helps the owning Human or a
      legitimately delegated authority make better decisions. More data, more automation, or a
      higher internal score is not itself success.
    - >
      The Manifesto must define one compact Intelligence Doctrine showing the conceptual flow
      `Observation/Signal -> Evidence -> Knowledge State -> Hypothesis -> Intelligence -> Decision
      -> Action -> Outcome -> Learning`. It must explain at principle level that evidence carries
      provenance/time, knowledge preserves known/unknown/conflicting state, hypotheses remain
      falsifiable interpretations, intelligence is decision-relevant meaning under uncertainty,
      decisions are commitments by an owning authority, outcomes become new evidence, and learning
      updates hypotheses/policy/calibration without rewriting historical evidence.
    - >
      The Manifesto must state the epistemic separations explicitly enough that future architecture
      cannot collapse them: Data is not Intelligence; Evidence is not Knowledge; Knowledge is not
      Intelligence; Intelligence is not Decision; Score is not Intelligence; Prediction is not
      Truth; Recommendation is not Approval; Confidence is not Certainty; Snapshot is not Trend;
      Automation is not Intelligence; Autonomy is not Intelligence; Outcome alone is not proof that
      the ex-ante decision process was good or bad.
    - >
      The Manifesto must define exactly twelve stable principle IDs, `M1` through `M12`, in this
      exact order and with these semantic responsibilities. Prose may be refined, but no principle
      may be omitted, merged away, or assigned a conflicting meaning:

        M1 HUMAN_MANDATE_BOUNDED_DELEGATION — Human owns product goals, priorities, risk appetite,
        mandate changes, and delegation boundaries. Automation or autonomy may operate only inside
        an explicit legitimate mandate; assistance must not invent a mandate or silently widen one.

        M2 EVIDENCE_BEFORE_ASSERTION — commerce/product claims start from attributable evidence.
        Unsupported factual claims remain unknown rather than guessed, while inferred or modeled
        claims remain labeled as such instead of masquerading as observed fact.

        M3 UNCERTAINTY_AND_TIME_FIRST_CLASS — missing, stale, conflicting, ambiguous, unavailable,
        or time-sensitive evidence remains explicit. A snapshot is not momentum, historical truth
        can become decisionally stale, and absence must not be silently coerced to zero or certainty.

        M4 EPISTEMIC_LAYER_INTEGRITY — preserve distinct layers from observation/evidence through
        knowledge, hypotheses, intelligence, decision, action, outcome, and learning. Evidence
        preservation is not product-truth reconciliation; retrieval relevance is not business
        ranking; business ranking is not identity; RAG context is not answer truth; recommendation
        is not approval.

        M5 HYPOTHESIS_AND_DISCONFIRMATION — opportunity, winner, trend, audience, or creative claims
        begin as hypotheses that can be supported, contradicted, remain unknown, or become stale.
        Intelligence actively values evidence that could falsify or materially change a conclusion,
        not only evidence that confirms the current favorite.

        M6 DECISION_QUALITY_OVER_SCORE — scores, rankings, predictions, and recommendation bands are
        instruments, not the objective. Optimize for decision quality under the information and
        uncertainty available at decision time, preserve alternatives and sensitivity, and never
        equate metric maximization with commerce intelligence.

        M7 VALUE_OF_INFORMATION_BEFORE_ENRICHMENT — certify real paths and measure trustworthy
        baselines before optimization. Acquire deeper or more expensive evidence because its
        expected decision value justifies cost, latency, access risk, fragility, and opportunity
        cost, not merely because a field is missing or technically collectible.

        M8 CALIBRATED_AUDITABLE_INTELLIGENCE — important conclusions must retain inspectable
        evidence/provenance, policy/context, uncertainty, and reasoning boundaries. Deterministic
        claims must be reproducible from explicit inputs/policy/time; probabilistic confidence
        should be treated as a claim whose calibration can be evaluated over outcomes rather than
        as decorative certainty.

        M9 AUTHORITY_AND_BOUNDARY_INTEGRITY — each semantic capability has one explicit owner.
        Composition extends existing owners rather than creating shadow identity, truth, ranking,
        retrieval, approval, persistence, or evidence authorities. Model/agent output remains
        advisory until admitted through the authority that owns canonical change.

        M10 SAFE_ACTION_WITHOUT_FABRICATION — analysis may continue under explicitly surfaced
        uncertainty, but unsafe canonical mutation or trust-boundary crossing must fail closed.
        Never fabricate evidence, hide fallback across trust boundaries, silently change
        methodology, or resolve unsafe provenance/identity/authority ambiguity for convenience.

        M11 LEARN_WITHOUT_REWRITING_HISTORY — decisions and actions must remain auditable against
        what was known at the time. Outcomes become new evidence for updating hypotheses, policy,
        calibration, and future decisions; they do not retroactively rewrite prior observations or
        convert lucky outcomes into proof of good reasoning.

        M12 PRODUCT_ABOVE_SUBSTRATE_COMPOSABLE_COMMERCE_INTELLIGENCE — Python Agent product
        semantics must survive changes in AIOS, Executor, model/provider, browser/runtime, and
        deployment tooling. Product Intelligence is the trustworthy foundation; future Media
        Intelligence, Distribution Intelligence, and Commerce Operations Intelligence compose over
        canonical outputs with explicit authorities and feedback loops instead of collapsing into
        one opaque autonomous monolith.
    - >
      The Manifesto must include a short refusal/anti-principles section rejecting at minimum:
      fabricated evidence or fabricated certainty; metric/score worship; hidden mandate or implicit
      approval; confirmation-only reasoning; treating static snapshots as trends; collecting data
      without decision value; shadow semantic authorities; provider/executor lock-in as product
      architecture; silent fallback across trust boundaries; premature scale/automation without
      measured need; outcome-based rewriting of history; and autonomous canonical-truth mutation
      outside explicit authority.
    - >
      The Manifesto must distinguish Intelligence from Automation and Autonomy. It may support
      future bounded autonomy under explicit legitimate delegation, but it must not claim that
      higher autonomy is inherently more intelligent or authorize any current boundary expansion.
    - >
      The Manifesto must distinguish ex-ante decision quality from ex-post outcome quality:
      a good decision under uncertainty can produce a bad outcome and a poor process can get lucky.
      Learning should evaluate both the reasoning available at decision time and subsequent
      outcomes.
    - >
      The Manifesto must separate aspiration from current capability. It may state the long-term
      Commerce Intelligence direction, but must not claim that Media Intelligence, Distribution
      Intelligence, autonomous optimization, livestream, affiliate intelligence, broad
      cross-platform coverage, closed-loop calibration, or other future systems are already
      implemented or authorized.
    - >
      Governance layering must remain explicit and non-duplicative:
        Manifesto = WHY, enduring intelligence philosophy, values, refusals, and product direction.
        Constitution = enforceable hard governance: authority hierarchy, delegation rules,
        conflict/precedence resolution, amendment procedure, and compliance/enforcement mechanics.
        Product Contract = WHAT durable product/domain promises and architecture boundaries exist.
        ChatGPT Project Contract = HOW the Brain operates against repository, roadmap, task, review,
        publication, and pinned AIOS state.
      The Manifesto may state values such as explicit authority or bounded delegation, but must not
      encode the later Constitution's exact permission matrix, precedence algorithm, amendment
      process, or enforcement procedure.
    - >
      The Manifesto must state that it does not retroactively rewrite prior published semantics or
      make philosophy itself proof of implementation, safety, review, publication, authorization,
      truth, or performance. Later Constitution/Product Contract/Project Contract reconciliation
      must translate applicable values into normative governance and operating rules.
    - >
      Add `tests/governance/test_python_agent_manifesto.py` as a structural governance regression
      only. It may verify UTF-8/no-BOM/LF-safe loading, canonical title/required top-level sections,
      one ordered occurrence of M1..M12 with no duplicate IDs, one Intelligence Doctrine section,
      one refusals section, and the explicit four-layer Governance Foundation relationship. It must
      not duplicate principle prose, score philosophical quality, assert current/future feature
      implementation, import production modules, or become a second semantic authority.
    - >
      Do not modify `.ai/roadmap-state.yaml`, `.ai/aios-adoption-state.yaml`,
      `docs/CHATGPT_PROJECT_CONTRACT.md`, product roadmaps, or production source in this TASK.
      Planning advancement occurs only after semantic PASS/source publication through a fresh
      Brain-owned reconciliation, preserving the TASK-192/TASK-193 no-auto-advance model.
    - >
      Verification must be deterministic and offline: no GitHub/network, browser/CDP, marketplace,
      provider/LLM, Drive, environment-dependent product evidence, wall-clock, random/UUID, or
      mutable external state.

acceptance:
  - id: AC1
    condition: >
      `docs/PYTHON_AGENT_MANIFESTO.md` exists as one canonical, concise product Manifesto whose North
      Star defines Python Agent as a trustworthy Commerce Intelligence foundation for reducing
      decision-relevant uncertainty, while keeping AIOS/executors/providers/runtime subordinate to
      product semantics.
  - id: AC2
    condition: >
      The Manifesto contains one coherent Intelligence Doctrine from observation/evidence through
      knowledge, hypotheses, intelligence, decision, action, outcome, and learning, and clearly
      preserves the required epistemic distinctions including Data/Score/Automation not being
      Intelligence and Prediction not being Truth.
  - id: AC3
    condition: >
      The Manifesto contains exactly M1-M12 in order with the revision-2 semantic responsibilities:
      bounded Human mandate/delegation, evidence-first claims, uncertainty/time, epistemic layers,
      disconfirmable hypotheses, decision quality over score, Value of Information, calibrated and
      auditable intelligence, one-owner authority boundaries, safe action without fabrication,
      learning without rewriting history, and substrate-independent composable Commerce
      Intelligence.
  - id: AC4
    condition: >
      The Manifesto distinguishes analysis under uncertainty from unsafe canonical mutation,
      distinguishes ex-ante decision quality from ex-post outcomes, supports only explicitly bounded
      delegation, and rejects fabricated certainty, confirmation-only reasoning, metric worship,
      low-value data collection, hidden approval, shadow authority, silent trust-boundary fallback,
      premature automation/scale, historical rewriting, and unauthorized canonical mutation.
  - id: AC5
    condition: >
      Governance layering is explicit and non-duplicative: Manifesto remains WHY/philosophy;
      Constitution remains future enforceable authority/delegation/conflict/amendment/compliance
      governance; Product Contract remains future durable product/domain promises; Project Contract
      remains Brain operating protocol. TASK-194 creates none of the later layers and does not
      retroactively rewrite published semantics.
  - id: AC6
    condition: >
      The structural regression validates only Manifesto document shape, ordered principle IDs,
      Intelligence Doctrine/refusals sections, and four-layer governance relationship without
      becoming a second semantic authority or asserting implementation.
  - id: AC7
    condition: >
      No production source, AIOS pin/adoption state, roadmap state, Project Contract, product
      roadmap, or current autonomy/approval authority changes; changed-file truth remains exactly
      within TASK-194 scope.modify.
  - id: AC8
    condition: >
      Required offline verification and git diff --check pass with zero unresolved items.

verification:
  required:
    - 'python -m pytest tests/governance/test_python_agent_manifesto.py -q'
    - 'git diff --check'
