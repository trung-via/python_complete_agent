task_id: TASK-179
revision: 1

goal: >
  Explicitly migrate the repository-owned Python Agent AIOS worker from the exact
  currently pinned AIOS-renew source candidate
  a607fb2cf1c57fe35a9a15504df0e98d28de2f5b to the exact semantically reviewed
  and published TASK-088 source candidate
  883974be6ec5922ae57021b50a48c84a0014dbfa so downstream CONTINUE can consume
  the upstream missing-local-TASK pre-resolution synchronization hardening. Preserve
  the existing thin repository-owned worker, Unified State/Human Surface authority,
  executor-specific Human surfaces, dedicated runtime provenance, review-before-
  publication boundary, and explicit RUN/FIX/REPAIR compatibility paths. This task
  migrates and certifies the dependency boundary only; the real stale-checkout
  CONTINUE proof remains a separate subsequent downstream task.

problem: >
  Python Agent live adoption exposed that `/aios-renew-worker CONTINUE TASK-178`
  from a stale local checkout failed before RUN admission because the requested TASK
  existed on canonical remote main but was absent locally. AIOS-renew TASK-088 was
  then authored from that observed evidence, semantically reviewed, and published at
  exact source candidate 883974be6ec5922ae57021b50a48c84a0014dbfa. Python Agent
  still pins a607fb2cf1c57fe35a9a15504df0e98d28de2f5b, so TASK-088 behavior does
  not yet exist downstream. The migration must advance only the explicit immutable
  dependency/provenance authority and active documentation/tests; it must not copy
  TASK-088 synchronization logic into the downstream launcher or claim the later live
  proof has already passed.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-179 authoring is
    69242cabd11f4fb9cea3e0f03676be7b17335e7f, the reviewed and published
    TASK-178 source candidate. RUN-178-002 Runtime verification passed and
    REVIEW-178-002 is PRIMARY PASS with no findings, so no earlier authored task or
    correction lineage blocks this migration.
  - >
    The authoritative downstream AIOS dependency immediately before this migration is
    exactly `aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@a607fb2cf1c57fe35a9a15504df0e98d28de2f5b`.
    Current upstream main is never inferred as downstream authority.
  - >
    Upstream AIOS-renew source candidate
    883974be6ec5922ae57021b50a48c84a0014dbfa is the exact published TASK-088
    candidate. REVIEW-088-002 is DELTA PASS with no findings and binds that exact SHA.
    The migration target is this reviewed source candidate, not a floating branch or any
    later upstream commit.
  - >
    TASK-086 and TASK-087 remain authoritative for Unified State, next-action selection,
    the one-operation Human front door, executor_required semantics, correction selectors,
    handoff/no-action behavior, and thin downstream delegation. TASK-088 extends only the
    missing-local-TASK CONTINUE pre-resolution boundary by reusing TASK-062 safe PRIMARY
    synchronization authority; it does not make `state` mutating or add generic auto-sync.
  - >
    The current shared launcher already translates CONTINUE exactly once to pinned
    `aios_renew.operator continue` and STATUS exactly once to pinned `state`; RUN/FIX/REPAIR
    compatibility paths and executor-specific surfaces are already correct. No downstream
    lifecycle or synchronization implementation change is required to consume TASK-088.
  - >
    TASK-178 reconciled the repository auto-publication regression suite so publication
    tests no longer freeze one historical exact AIOS pin. `.github/workflows/aios-auto-publish.yml`
    continues to install AIOS-renew solely through the checked-in immutable requirements
    file and needs no workflow redesign for this pin migration.
  - >
    AIOS-renew roadmap Downstream Adoption remains NEXT. TASK-179 publication alone does
    not make that roadmap item DONE; a later real downstream stale-checkout CONTINUE run,
    semantic PASS, and publication are still required as evidence.

