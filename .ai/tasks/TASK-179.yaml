non_goals:
  - Modify AIOS-renew itself, follow current/future AIOS-renew main automatically, use a
    floating branch/tag, or migrate beyond exact reviewed source candidate
    883974be6ec5922ae57021b50a48c84a0014dbfa.
  - Reimplement, copy, approximate, or cache TASK-062/TASK-088 Git synchronization logic
    in Python Agent worker code, skill/workflow prose as executable policy, or tests.
  - Change TASK-086 Unified State taxonomy, TASK-087 one-operation mapping, executor_required
    semantics, correction selectors, recovery/transport semantics, or no-Executor behavior.
  - Add generic auto-sync, retry, fallback, reroute, polling, recursive CONTINUE, planner,
    model selection, executor recommendation, autonomous review, autonomous correction
    authoring, or publication.
  - Change the normal CONTINUE/STATUS translation or repurpose/remove RUN/FIX/REPAIR
    compatibility/debug paths.
  - Modify `.github/workflows/aios-auto-publish.yml`,
    `tests/aios_bridge/test_aios_auto_publish_workflow.py`, deprecated
    `.agents/workflows/aios-worker.md`, Product Intelligence code/tests, Phase 6 product
    roadmaps, marketplace behavior, persistence, retrieval, truth, ranking, or domain APIs.
  - Claim that this migration itself proves a stale checkout can launch a newly authored
    remote-only TASK through CONTINUE. That operational proof belongs to a fresh downstream
    task authored after this migration is published so the local checkout can first possess
    the migrated worker pin while remaining stale relative to the new proof TASK.
  - Advance the AIOS-renew roadmap bookmark or claim Downstream Adoption DONE from Executor
    implementation.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Change the only active downstream dependency pin to exactly
      `aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@883974be6ec5922ae57021b50a48c84a0014dbfa`
      and change the launcher `AUTHORITATIVE_COMMIT` to the same exact SHA. No floating ref,
      duplicate alternate source, or later AIOS-renew commit is allowed.
    - >
      Preserve the dedicated `.git/aios/worker-runtime` bootstrap and PEP 610 provenance
      boundary. A runtime installed from the immediate predecessor
      a607fb2cf1c57fe35a9a15504df0e98d28de2f5b, any older commit, alternate source,
      incomplete install, or unverifiable provenance must be rejected and atomically rebuilt;
      only repository `trung-via/AIOS-renew` at exact commit
      883974be6ec5922ae57021b50a48c84a0014dbfa is authoritative after migration.
    - >
      The shared launcher remains thin. Apart from updating its exact immutable authority
      constant, do not change TASK/RUN parsing, bootstrap mechanics, kernel command mapping,
      CONTINUE/STATUS pass-through behavior, RUN/FIX/REPAIR PASS-summary handling, executor
      selection, retry policy, or any lifecycle/synchronization logic.
    - >
      CONTINUE continues to invoke the pinned `continue` operator exactly once with the exact
      TASK, repository root, and surface-selected executor identity. Python Agent must not
      call `state` first, inspect TASK/ref/RUN state to choose an action, or implement the new
      pre-resolution synchronization itself. TASK-088 behavior is consumed solely because
      the exact pinned distribution now contains it.
    - >
      Active downstream documentation must describe the adopted TASK-088 boundary precisely:
      for a syntactically valid requested TASK whose canonical local TASK file is absent,
      pinned CONTINUE may perform the bounded TASK-062-governed pre-resolution synchronization
      before Unified State loads the TASK and then derive state from fresh synchronized state.
      Existing local TASKs do not gain this new automatic sync path, `state`/STATUS remains
      read-only for product state, unsafe repository states fail closed, and no retry/reroute
      or second lifecycle operation is hidden behind the feature.
    - >
      Update `docs/CHATGPT_PROJECT_CONTRACT.md` only to reconcile current downstream AIOS
      authority from TASK-177's a607fb2... pin to TASK-179's exact 883974be... pin and record
      TASK-088 as an adopted upstream boundary. Preserve all existing Human-facing worker,
      review, correction, publication, downstream isolation, and authority rules; do not
      introduce new durable governance unrelated to this migration.
    - >
      Update the Codex skill, Antigravity workflow, and unified-worker documentation
      consistently so their exact pin/adopted-capability statements no longer describe
      a607fb2... as current authority. Preserve physical executor separation and the existing
      normal CONTINUE/STATUS plus explicit RUN/FIX/REPAIR surface contract.
    - >
      Worker-control regressions must bind the requirements file and launcher constant to
      exact target 883974be6ec5922ae57021b50a48c84a0014dbfa, explicitly treat immediate
      predecessor a607fb2cf1c57fe35a9a15504df0e98d28de2f5b as stale provenance, and retain
      existing deterministic bootstrap, exact source+commit provenance, action routing,
      one-invocation, pass-through, executor separation, and no-retry/reroute coverage.
    - >
      `tests/aios_bridge/test_aios_auto_publish_workflow.py` and
      `.github/workflows/aios-auto-publish.yml` must remain unchanged. Their current structural
      contract intentionally consumes the checked-in requirements file without owning a
      duplicated exact pin, so the migration must not reintroduce TASK-130/TASK-177 snapshot
      coupling there.
    - >
      Historical TASK-177 and TASK-178 contracts/artifacts remain immutable historical truth
      and must not be edited merely because they mention the pin that was authoritative for
      their own lineage.
    - >
      All modified worker/docs/test files must remain UTF-8 without BOM and LF line endings
      where their existing repository format requires it.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      The checked-in requirements entry and launcher provenance constant both bind exactly to
      AIOS-renew 883974be6ec5922ae57021b50a48c84a0014dbfa with no floating or duplicate
      active runtime source, and the previous a607fb2... installation is explicitly classified
      as stale after migration.
  - id: AC2
    condition: >
      Deterministic worker bootstrap/provenance regressions prove an authoritative target
      runtime is reused, while immediate-predecessor, older, alternate-source, incomplete,
      or unverifiable runtimes are rejected or atomically rebuilt to the exact target source
      and commit without creating a second runtime authority.
  - id: AC3
    condition: >
      Existing CONTINUE and STATUS regressions remain behaviorally unchanged: CONTINUE
      delegates exactly one pinned Human Surface invocation, STATUS delegates exactly one
      read-only Unified State invocation, and the launcher does not gain downstream state
      selection, pre-resolution Git logic, retry, reroute, recursive continuation, or a
      second kernel call.
  - id: AC4
    condition: >
      Existing RUN/FIX/REPAIR worker regressions remain behaviorally compatible, including
      exact selector validation, surface-bound executor identity, canonical PASS-summary
      handling, no retry/fallback/reroute, and review-before-publication behavior.
  - id: AC5
    condition: >
      `docs/CHATGPT_PROJECT_CONTRACT.md`, the active Codex/Antigravity worker surfaces, and
      `docs/AIOS_UNIFIED_WORKER_WORKFLOW.md` consistently identify
      883974be6ec5922ae57021b50a48c84a0014dbfa as the exact downstream AIOS authority and
      record TASK-088 missing-local-TASK pre-resolution behavior without duplicating its
      synchronization implementation or changing STATUS/read-only and one-operation boundaries.
  - id: AC6
    condition: >
      `.github/workflows/aios-auto-publish.yml`, the current publication regression suite,
      deprecated Antigravity surface, Product Intelligence code/tests, Phase 6 product roadmaps,
      and historical TASK-177/TASK-178 artifacts are unchanged; publication continues to
      consume only the checked-in immutable requirements source and gains no new authority.
  - id: AC7
    condition: >
      The migration does not claim a live stale-checkout proof or Downstream Adoption
      completion. Documentation leaves that proof explicitly pending a fresh subsequent
      downstream task after TASK-179 publication.
  - id: AC8
    condition: >
      Focused worker-control plus publication-boundary regressions and `git diff --check`
      pass with no unresolved items and no changed files outside the seven explicitly
      authorized migration files.

