task_id: TASK-234
revision: 1

goal: >
  Reconcile the Human-operated TASK-233 one-shot TikTok PDP live pilot that has now actually
  occurred, preserve its partial live observation without promoting chat/screenshot content into
  canonical Product Intelligence evidence, implement one bounded attach-only DOM diagnostic
  capability for the same exact selected listing, and correct TASK-233 consumer cleanup so
  Python Agent releases only its owned Playwright/CDP connection resources through the existing
  TASK-137 browser lifecycle authority without closing the Human-owned Chrome/context/page.
  Do not execute a live diagnostic or second PDP capture in this engineering task.

problem: >
  TASK-233 is published exactly at 99338787dcfff5e1897b9d58c12b04f7961f6e58 and granted one
  Human-operated capture attempt for source ID 1731381331718341815. The Human then executed that
  exact operation outside ordinary AIOS verification. The bounded result reported SUCCESS with
  requested URL equal to observed URL, identity basis OBSERVED_URL bound to the exact source ID,
  a non-empty title, and null shop_name, price, original_price, discount_percent, sold_count,
  rating and review_count. A contemporaneous Human-visible PDP screenshot showed that several
  of those categories were visibly present in the UI, which is diagnostic context that the
  existing extraction selectors missed the live DOM; the screenshot and displayed values are
  not automatically canonical Product Intelligence evidence and must not be transcribed into the
  snapshot or roadmap as product truth.

  Canonical roadmap state still says real_pilot_executed=false and live_evidence_acquired=false,
  and still presents the TASK-233 one-attempt authority as unconsumed. That planning state is now
  stale relative to the Human-operated event and must be reconciled without pretending the
  external artifact has been canonically ingested. Separately, the live operation ended with
  Python 3.14 asyncio transport deallocator warnings. TASK-137 already owns borrowed-CDP lifecycle
  and explicitly requires close/cleanup to release Python Agent-owned Playwright connection and
  listeners without closing borrowed Chrome/context/page. TASK-233's consumer-level prohibition
  on manager.close_session was therefore over-conservative and left owned Playwright resources
  unreleased.

  The exact live DOM selectors remain unknown. Guessing CSS from a screenshot would risk another
  live miss. The smallest correct next capability is one attach-only, no-navigation DOM diagnostic
  that inspects the already-open exact PDP and emits only bounded structural selector hints.
  It is diagnostic capability only, not evidence acquisition, parsing, Product Truth, or a second
  Product Intelligence observation authority.

assumptions:
  - Canonical main at authoring is 99338787dcfff5e1897b9d58c12b04f7961f6e58.
  - TASK-233 / RUN-233-002 / REVIEW-233-001 are PASS and exactly source-published on canonical main.
  - The Human-operated TASK-233 live command was actually invoked once after publication and returned operation.status SUCCESS.
  - The reported live result bound requested and observed URL to source ID 1731381331718341815 through OBSERVED_URL and produced a safe external artifact.
  - The reported snapshot contained an explicit title while shop_name, price, original_price, discount_percent, sold_count, rating and review_count remained null/unknown.
  - The Human-visible screenshot is diagnostic context only; its displayed values are not repository evidence, ProductCandidateSnapshot truth, P7.4 evidence, recommendation, approval or market-test evidence.
  - TASK-231 remains the sole public-PDP acquisition contract; ProductCandidateSnapshot remains the sole public marketplace observation contract and SignalEvidence remains the field-evidence owner.
  - src/product_intelligence/adapters/tiktok_parsing.py remains the sole canonical TikTok parser/identity authority.
  - TASK-137 and the existing PlaywrightBrowserManager/PlaywrightBrowserSession remain the sole browser/CDP lifecycle authority.
  - In borrowed CDP mode, PlaywrightBrowserSession.close() is already designed not to close the Human-owned browser/context/page and to stop only Python Agent-owned Playwright resources/listeners.
  - No exact live DOM selector for the missing V1 fields has yet been canonically established.
  - Public PDP and TikTok Affiliate lanes remain independent.
  - EVIDENCE_IS_NOT_PRODUCT_TRUTH, SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY, SNAPSHOT_IS_NOT_TREND, CAPABILITY_IS_NOT_AUTHORITY and ONE_CAPABILITY_ONE_AUTHORITY remain mandatory.

