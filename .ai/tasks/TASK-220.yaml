non_goals:
  - Modify AIOS-renew source, dependency pin, Runtime, repair-wakeup implementation, correction preflight, repair authorization schema, action semantics, or Executor validation.
  - Modify the self-hosted REPAIR target merely to accept github-actions[bot]; its existing Human actor fail-closed direct workflow_dispatch boundary must remain intact.
  - Add an Executor field to AUTHOR_REPAIR envelope semantics, parse repair instructions to infer Executor, infer Executor from the failed RUN/previous Executor, default to Antigravity/Codex, or silently reroute.
  - Create a new REPAIR carrier, second repair state machine, approval database, scheduler, queue, broker, retry loop, generic lifecycle router, Planner, or generic conversation store.
  - Change or supersede REPAIR-207-002, execute/redeliver it during TASK-220 implementation or verification, or create RUN-207-008 inside this task.
  - Modify TASK-207 candidate 39277166d69ea788ae9eaa4626707e7412a5f114, TASK-215/RUN-215-004, product source, roadmap product semantics, Publisher, remediation binding, or conformance records.
  - Publish, merge, or mutate canonical main from Executor execution.

constraints:
  hard:
    - >
      TASK-206 remains the sole semantic owner of the Phase-2 REPAIR binding family.
      Revision 2 narrows TASK-216/TASK-217 post-AUTHOR_REPAIR behavior to a canonical
      handoff boundary: AUTHOR_REPAIR canonicalization may expose immutable selectors
      but does not itself authorize coding delivery without an explicit Human-selected Executor.
    - >
      Remove the Brain Ingress step that directly createWorkflowDispatches
      aios-self-hosted-repair-wakeup.yml after AUTHOR_REPAIR, including any receipt logic
      that claims such a dispatch was attempted/accepted. Successful AUTHOR_REPAIR must
      remain canonicalized normally and must not be marked failed merely because repair
      execution has not yet been separately authorized through the dedicated carrier.
    - >
      Preserve the dedicated [AIOS REPAIR WAKEUP] Issue carrier unchanged as the normal
      remote repair-delivery authority. Its canonical policy must continue to require
      authorized Human actor trung-via and exact title marker, and its request may carry
      only repair_dispatch_id, failed_run_id, repair_sha and optional supported Executor.
    - >
      Preserve .github/workflows/aios-self-hosted-repair-wakeup.yml behaviorally unchanged
      from canonical main: direct workflow_dispatch remains a Human/debug fallback gated
      by GITHUB_ACTOR == trung-via; workflow_call remains available to the actor-gated
      dedicated carrier; repository/main/root/runner/bootstrap checks and contents:read
      permissions remain fail-closed.
    - >
      Coding REPAIR delivery must require the dedicated actor-gated request to carry one
      explicit supported Executor. NO_CHANGE must omit Executor. Downstream workflows,
      docs and tests must not infer action-compatible Executor from repair prose, failed
      RUN history, task history, prior Executor, or model preference.
    - >
      Pinned Runtime remains sole authority for current canonical repair SHA, failed RUN,
      action, executor_required, duplicate repair_dispatch_id binding, reusable verification
      state, correction preflight, RUN allocation, Executor invocation and verification.
      Repository workflows remain selector couriers only.
    - >
      Documentation must describe AUTHOR_REPAIR as canonical authorization creation plus
      bounded handoff, not automatic execution. It must describe the dedicated REPAIR
      wakeup as the separate Human/Brain delivery step that supplies explicit Executor
      when coding is required and none for NO_CHANGE.
    - >
      Documentation must preserve immutable redelivery semantics: after an outer delivery
      failure before Runtime admission, the same repair_dispatch_id/failed_run_id/repair_sha
      is reused, together with the same explicitly selected Executor when the coding repair
      dispatch has already been bound. A selector change is new delivery intent and must
      fail closed against an existing durable dispatch record.
    - >
      Deterministic regressions must prove Brain Ingress performs no direct REPAIR
      createWorkflowDispatch after AUTHOR_REPAIR; the dedicated carrier remains the only
      actor-gated normal remote coding-delivery path; direct target workflow_dispatch remains
      Human-gated; coding/NO_CHANGE executor shapes remain enforced by the pinned bootstrap
      boundary rather than downstream inference.
    - >
      Mutation is limited to the six authorized files. Verification must be deterministic,
      offline, non-interactive and independent of live GitHub/network/provider/model state.

acceptance:
  - id: AC1
    condition: >
      Brain Ingress canonicalizes AUTHOR_REPAIR without directly dispatching the self-hosted
      REPAIR target and without treating the absence of immediate repair execution as ingress failure.
  - id: AC2
    condition: >
      Dedicated [AIOS REPAIR WAKEUP] remains the actor-gated normal remote delivery path;
      direct self-hosted workflow_dispatch remains Human-gated and github-actions[bot] gains
      no semantic or Executor-selection authority.
  - id: AC3
    condition: >
      Coding REPAIR continuation requires one explicit supported Executor from the dedicated
      authorized request, while NO_CHANGE carries none; no downstream component infers,
      defaults, or silently substitutes Executor identity.
  - id: AC4
    condition: >
      Pinned Runtime remains sole lifecycle/repair authority and validates exact canonical
      repair selectors, action/executor_required shape, duplicate binding, correction preflight,
      RUN allocation and verification without downstream duplication.
  - id: AC5
    condition: >
      Documentation and regressions accurately describe canonical AUTHOR_REPAIR handoff,
      separate dedicated REPAIR wakeup, direct fallback authorization, and immutable exact-intent
      redelivery semantics.
  - id: AC6
    condition: >
      RUN-207-007, REPAIR-207-002, TASK-207/TASK-215 candidates, exact pin, product source,
      Publisher, remediation binding and conformance records remain unchanged.
  - id: AC7
    condition: >
      Focused deterministic Brain-ingress, Phase-1, Phase-2 and governance regressions plus
      git diff --check pass with zero unresolved items, producing a fresh PRIMARY candidate
      eligible for independent review and safe publication.

