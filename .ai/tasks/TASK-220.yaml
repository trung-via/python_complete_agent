task_id: TASK-220
revision: 2

goal: >
  Correct TASK-220 revision-1 after REVIEW-220-001 by restoring a fail-closed
  Human/Brain authorization boundary for REPAIR delivery and making Executor transport
  truthful under exact AIOS-renew pin 1a68db9acb6989dfa81bf875503db62e54a4bed6.
  Preserve TASK-206 as the Phase-2 REPAIR binding authority and preserve the dedicated
  [AIOS REPAIR WAKEUP] carrier as the actor-gated remote continuation surface. Remove
  the unsafe/impossible automatic post-AUTHOR_REPAIR coding dispatch from Brain Ingress:
  AUTHOR_REPAIR canonicalization may expose immutable repair selectors, but it must not
  invent or omit a Human-selected coding Executor. Coding REPAIR continuation therefore
  proceeds through the existing authorized REPAIR wakeup carrier with one explicit
  Executor; NO_CHANGE proceeds through that same carrier with no Executor. Preserve the
  current RUN-207-007 / REPAIR-207-002 lineage unchanged so, after reviewed source
  publication, the exact FINALIZE_CANDIDATE repair can be redelivered through the
  dedicated carrier with executor antigravity and TASK-207 revision-7 certification can resume.

problem: >
  REVIEW-220-001 found two semantic defects in RUN-220-001 candidate
  911ca690a0dd4a4d673d790c94d46f7b5f9b2b68. FINDING-220-001 showed that deleting
  the self-hosted target GITHUB_ACTOR check while retaining direct workflow_dispatch
  widened transport authority: a direct caller could choose executor without traversing
  either canonical authorized_actors carrier. FINDING-220-002 showed that the existing
  Brain Ingress post-AUTHOR_REPAIR createWorkflowDispatch hard-codes executor='' for every
  repair, but exact pin 1a68db9 requires an explicit Executor for CODE_FIX,
  CONTINUE_IMPLEMENTATION and FINALIZE_CANDIDATE and forbids one for NO_CHANGE.
  REPAIR-207-002 is FINALIZE_CANDIDATE, so the revision-1 candidate would still fail
  after its actor check removal.

  The canonical AUTHOR_REPAIR ingress envelope does not carry a Human-selected Executor,
  and the pinned GitHub ingress outputs expose only repair_dispatch_id, failed_run_id and
  repair_sha. Inferring the Executor from failed RUN identity, repair prose, prior surface,
  or model preference would create downstream lifecycle/authorization semantics that the
  pinned Runtime intentionally does not own. The existing dedicated [AIOS REPAIR WAKEUP]
  carrier already solves this boundary correctly: it actor-gates the Human request,
  accepts the exact immutable repair selectors plus optional explicit Executor, and the
  pinned repair-wakeup authority validates coding-versus-NO_CHANGE shape fail-closed.
  Therefore revision 2 must stop treating AUTHOR_REPAIR canonicalization as sufficient
  coding-delivery authorization and consolidate actual remote repair delivery on the
  existing dedicated carrier rather than weakening the target.

assumptions:
  - Canonical Python Agent main at authoring is 3f87a8b5ac6f36c4052157c25ee8a6b78fce27f1 and contains TASK-220 revision 1 only; RUN-220-001 candidate is not published.
  - REVIEW-220-001 is canonical CHANGES_REQUIRED for reviewed_sha 911ca690a0dd4a4d673d790c94d46f7b5f9b2b68 with FINDING-220-001 and FINDING-220-002.
  - The sole active AIOS-renew pin remains exact 1a68db9acb6989dfa81bf875503db62e54a4bed6.
  - Pinned repair-wakeup requires one explicit Executor for CODE_FIX, CONTINUE_IMPLEMENTATION and FINALIZE_CANDIDATE, and zero Executor for NO_CHANGE.
  - Canonical AUTHOR_REPAIR GitHub ingress outputs do not contain a Human-selected Executor and must not infer one.
  - The dedicated [AIOS REPAIR WAKEUP] Issue carrier remains actor-gated by .ai/brain-repair-wakeup-carriers.yaml authorized_actors=[trung-via] and accepts exact repair_dispatch_id, failed_run_id, repair_sha and optional explicit Executor.
  - The self-hosted REPAIR target on canonical main still contains its Human actor preflight because RUN-220-001 was never published.
  - RUN-207-007 remains the canonical repairable/transportable failed TASK-207 revision-7 RUN with failed_head_sha 39277166d69ea788ae9eaa4626707e7412a5f114.
  - REPAIR-207-002 remains the exact current FINALIZE_CANDIDATE authorization at f4c69eb7edc865c16a26a307270a3ae2f4e26d86 with modification_scope=[].
  - The failed outer workflow_dispatch created no RUN-207-008 and consumed no repair execution authority.
  - P7.3 and TASK-215/RUN-215-004 remain unchanged and out of scope.

