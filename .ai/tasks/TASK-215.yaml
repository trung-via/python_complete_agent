constraints:
  hard:
    - >
      Preserve one-capability-one-authority: TASK-215 remains the sole P7.3 semantic
      authority. Revision 2 is current-main reconciliation of revision-1 semantics,
      not a new feature design and not a second owner.
    - >
      The four bounded P7.3 semantic artifacts
      src/commerce_opportunity_intelligence/__init__.py,
      src/commerce_opportunity_intelligence/decision_context.py,
      tests/commerce_opportunity_intelligence/test_decision_context.py, and
      docs/PHASE_7_P7_3_DECISION_CONTEXT_OPPORTUNITY_HYPOTHESIS.md must preserve the
      successful RUN-215-004 semantics, including the FINDING-215-001 fail-closed
      projection boundary. Any intentional semantic difference from candidate
      142bd865... requires explicit unresolved reporting rather than silent drift.
    - >
      Preserve the revision-1 authority boundary exactly: DecisionContext is not a
      Decision; OpportunityHypothesis is not Truth, Recommendation, or TEST_READY;
      evidence references do not become evidence ownership; subject references remain
      opaque; Product Candidate Triage V1 score/rank does not become opportunity
      judgment; no P7.2 conceptual lifecycle becomes persisted/runtime state.
    - >
      Preserve pure deterministic construction and serialization: caller-supplied IDs
      and timezone-aware times only; no network, marketplace/browser/CDP, provider/model,
      filesystem persistence, database, queue, environment-derived identity, wall clock,
      random/UUID, subprocess, or AIOS lifecycle behavior in the P7.3 production module.
    - >
      Preserve the exact FINDING-215-001 correction. Public construction/projection must
      fail closed on forbidden sensitive/raw payload classes already covered by the
      RUN-215-004 focused suite, including cookie/session content such as
      session_token=private-value, while preserving caller order, immutability,
      opaque-reference semantics, and valid JSON-serializable projections.
    - >
      Product Intelligence production files remain byte-for-byte unchanged.
    - >
      Reconcile .ai/roadmap-state.yaml from current main rather than copying the historical
      candidate wholesale. Preserve TASK-207 revision-8 full_downstream_conformance DONE,
      exact pin edd7d8d..., TASK-221 migration history, Brain/Human planning authority,
      TASK-191/TASK-213/TASK-214 completed history, and all current governance lineage.
      Then mark TASK-215/P7.3 publication-gated DONE and make P7.4 the sole NEXT commitment;
      P7.5-P7.7 remain ordered NOT_DONE.
    - >
      Reconcile tests/aios_bridge/test_aios_governance_state.py additively from current
      main. Preserve all current TASK-207 r8 / TASK-221 / exact-pin / conformance tests
      and add the P7.3/P7.4 roadmap assertions from the historical candidate without
      deleting or weakening current control-plane governance coverage.
    - >
      Reconcile both product roadmap documents so TASK-214/P7.2 remains published,
      TASK-215/P7.3 becomes publication-gated DONE only on reviewed source publication,
      P7.4 becomes unique NEXT, and P7.5-P7.7 remain NOT_DONE. Do not rewrite unrelated
      roadmap history.
    - >
      Preserve .ai/aios-adoption-state.yaml and .ai/aios-conformance-state.yaml
      byte-for-byte. Preserve requirements-aios-renew.txt and worker AUTHORITATIVE_COMMIT
      exactly at edd7d8d92d54900c56442bbfcddb8648ec4d2e09.
    - >
      Source mutation is limited to the eight authorized paths. New directories are
      allowed only as parents of the explicitly authorized P7.3 files.
    - >
      Executor may inspect historical candidate 142bd865... and current main to perform
      bounded reconciliation, but Runtime owns canonical verification. Executor must not
      start another AIOS operation, background/delegated agent, network/provider task, or
      publication action.
    - >
      Verification is deterministic, offline and non-interactive. Use current-main
      governance tests so integration cannot silently regress the freshly certified
      control plane.

acceptance:
  - id: AC1
    condition: >
      Current-main source contains exactly one bounded
      src/commerce_opportunity_intelligence P7.3 authority with immutable DecisionContext
      semantics equivalent to the successful revision-1 candidate and no decision,
      recommendation, scoring, evidence, identity, persistence, or lifecycle authority.
  - id: AC2
    condition: >
      OpportunityHypothesis remains immutable, deterministic, context-bound, opaque-subject
      and falsifiable with non-overlapping evidence refs and no automatic TEST_READY or
      later-stage semantics.
  - id: AC3
    condition: >
      FINDING-215-001 is materially resolved in the integrated current-main candidate:
      deterministic public projections fail closed on the forbidden sensitive/raw payload
      classes covered by RUN-215-004, including session_token, while valid projections
      preserve exact caller ordering and JSON serialization.
  - id: AC4
    condition: >
      Product Intelligence production files, Product Contract, Project Contract,
      TASK-207 r8 certification, TASK-221 migration state, exact AIOS pin, active bindings,
      and authority boundaries remain unchanged.
  - id: AC5
    condition: >
      P7.3 documentation preserves Product Contract v2/P7.2 epistemic boundaries and the
      two product roadmap documents consistently record publication-gated P7.3 completion
      followed by P7.4 as unique NEXT without implementing P7.4-P7.7.
  - id: AC6
    condition: >
      .ai/roadmap-state.yaml preserves current control-plane/governance lineage and, on
      publication gate, closes P7.3 and advances exactly one product step to P7.4; the
      current AIOS adoption/conformance files remain unchanged.
  - id: AC7
    condition: >
      Only the eight authorized paths change; focused P7.3 plus current governance
      regressions and git diff --check pass with zero unresolved items, producing one
      source candidate that descends from current canonical main and is eligible for
      independent PRIMARY review and exact safe publication.

