task_id: TASK-215
revision: 2

goal: >
  Reconcile and publish P7.3 Decision Context + Opportunity Hypothesis on the current
  canonical Python Agent main after the long control-plane recovery sequence made the
  already-correct revision-1 repair candidate historical rather than directly publishable.
  Preserve TASK-215 as the sole P7.3 semantic authority. Reuse the exact reviewed-intent
  and verified product semantics from RUN-215-004 / candidate
  142bd865f69a6636b321d3cc7a0cd4004db3fdc7, including the FINDING-215-001 sensitive
  projection correction, while integrating them onto current main
  be9b4ca2e454314eb8067560314944e7a8d2f029 without reverting any TASK-207 revision-8,
  TASK-221, AIOS exact-pin, conformance, adoption, Project Contract, or control-plane
  history. On reviewed source publication, close P7.3 and advance exactly one product
  roadmap step so P7.4 TikTok Affiliate Evidence Profile becomes the unique NEXT
  commitment.

problem: >
  TASK-215 revision 1 established the intended P7.3 semantic owner and produced PRIMARY
  candidate 58cbf9a8a43ede37dac8abd86302031ea4b49439. REVIEW-215-001 found exactly one
  semantic defect, FINDING-215-001 / AC4: public projections could emit forbidden
  caller-supplied sensitive/raw payload classes. The correction lineage ultimately
  completed as RUN-215-004 at exact candidate
  142bd865f69a6636b321d3cc7a0cd4004db3fdc7. Runtime verification passed 45 focused
  tests plus git diff --check, and the correction specifically rejects
  session_token=private-value while preserving the already-correct bounded P7.3
  semantics.

  Publication was intentionally deferred while the downstream AIOS control plane was
  migrated and re-certified. That recovery is now complete: TASK-221 migrated the sole
  active pin to exact reviewed/source-published
  edd7d8d92d54900c56442bbfcddb8648ec4d2e09, and TASK-207 revision 8 / RUN-207-010 /
  REVIEW-207-004 are publication-effective on current canonical main
  be9b4ca2e454314eb8067560314944e7a8d2f029.

  RUN-215-004 can no longer be safely published as-is. Git ancestry now shows current
  main and candidate 142bd865... diverged: current main is 25 commits ahead on the
  control-plane line while the P7.3 candidate is 3 commits ahead on its historical
  product line. Exact publication of 142bd865... would discard the later canonical
  control-plane history and is therefore not eligible. This is a canonical-state
  invalidation of direct revision-1 publication, not a new P7.3 semantic finding and
  not a reason to create a second product authority.

  The correct continuation is a fresh revision of the existing TASK-215 authority:
  integrate the already-verified P7.3 source semantics onto current main, reconcile
  only overlapping planning/governance files with the current certified control-plane
  state, verify the complete bounded result, then perform one PRIMARY semantic review
  and exact source publication.

assumptions:
