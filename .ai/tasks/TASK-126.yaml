task_id: TASK-126
revision: 1

goal: >
  Integrate the existing persistent Chrome at http://127.0.0.1:9222 into the
  production BrowserManager path and repair the BrowserSession evaluate(script,
  arg) contract. Reuse the attached browser's existing context and page, fail
  closed when attachment is unavailable, and retain the existing launch-based
  path for isolated tests and explicitly injected isolated consumers.

problem: >
  AgentController currently constructs PlaywrightBrowserManager(), whose sessions
  always launch a new browser and create a new context/page. That path cannot use
  the operator's already authenticated persistent Chrome profile. Separately,
  ShopeeSourceExtractor calls evaluate(script, product_id), while BrowserSession
  and PlaywrightBrowserSession accept only script. Permissive extractor fakes and
  tests calling raw Playwright Page.evaluate conceal this production contract gap.

assumptions:
  - >
    Authoring baseline is python_complete_agent main
    d47ed9c048cacd152452cf2a7054c662e1043c82, confirmed against origin/main.
    The largest authored TASK and remote TASK/RUN identifier observed is 125.
    TASK-126 is an independent browser integration/regression task; it neither
    implements nor certifies TASK-125 M3 completion or any M4 capability.
  - >
    TASK-010 owns AgentController production wiring/lifecycle; TASK-012 owns the
    existing public evaluate capability and Shopee discovery integration;
    TASK-013 owns ProductSourcePack and marketplace extraction semantics.
    Their older contracts are archived on origin/ai-control; current source and
    docs/PHASE_6_BOOTSTRAP.md and docs/PHASE_6_PRODUCT_SOURCE_PACK.md remain the
    implementation authority. Do not reactivate the legacy AIOS Bridge.
  - >
    The operator has confirmed that the dedicated Chrome profile retains Shopee
    login after restart. Chrome startup, login, and any manual verification remain
    operator responsibilities. This report is context, not automated test evidence.
  - >
    The active execution kernel remains the exact repository pin
    59b31ede597d4a27b848771522672705a021abe4. Do not modify its version, launcher,
    execution gates, synchronization, or review/publication semantics.

