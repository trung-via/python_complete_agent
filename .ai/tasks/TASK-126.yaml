    - '$env:PYTHONPATH = ".;src"; & .\venv\Scripts\python.exe -m pytest tests/product_source/test_shopee_source_extractor.py tests/product_source/test_tiktok_source_extractor.py tests/product_source/test_scrape_tool_compat.py tests/product_source/test_extractor_dom_fixtures.py tests/product_intelligence/test_shopee_discovery.py tests/product_intelligence/test_tiktok_discovery.py -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - 'git diff --check; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
