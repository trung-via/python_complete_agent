task_id: TASK-137
revision: 1

goal: >
  Implement the first post-M4 Product Intelligence boundary, P1 Live Acquisition
  Foundation, by repairing the existing browser runtime contract on current main:
  allow the production AgentController browser path to attach explicitly to the
  operator-owned authenticated Chromium at http://127.0.0.1:9222 through CDP,
  preserve launch mode for isolated callers, and make BrowserSession.evaluate support
  one optional argument without changing Product Source Pack, discovery, ranking,
  catalog, retrieval, provider, or grounded-answer semantics.

problem: >
  M4 is canonically complete, but the live upstream acquisition path still contains two
  concrete correctness gaps. AgentController constructs PlaywrightBrowserManager() and
  PlaywrightBrowserSession.start() always launches a fresh browser, fresh context, and
  fresh page, so the production M1/M2 ingestion path cannot reuse the operator's already
  authenticated persistent Chrome profile. Separately, BrowserSession.evaluate and
  PlaywrightBrowserSession.evaluate accept only evaluate(script), while the current
  ShopeeSourceExtractor invokes evaluate(_SHOPEE_EXTRACTION_SCRIPT, product_id). The
  production wrapper therefore cannot satisfy a caller that already exists in current
  source. Historical TASK-126 described the same class of defect on a much older
  baseline and ended in old failure/control-plane lineage; it must not be rerun or
  repaired. TASK-137 re-authors only the still-valid browser/runtime intent against the
  current post-M4 repository state.

assumptions:
  - >
    Canonical Python Agent main immediately before TASK-137 authoring is
    ed4914015568a3e697aff9ab495fd74e15d41c26. Its parent
    f57fd9fed3f12042366ab884aa3f0151e23b0d8f is the published TASK-136 source
    candidate that canonically closed Phase 6 M4.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@67db82bf19d63f25721d06aabb82d850db8b78d4.
  - >
    docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md is the canonical post-M4 roadmap.
    TASK-137 implements only P1 Live Acquisition Foundation. P2 source-evidence intake,
    P3 Human-governed knowledge update, P4 live provider certification, P5 presentation,
    and P6 quality/scale work remain future boundaries.
  - >
    Existing browser/AgentController implementation is the only current browser runtime
    authority. TASK-137 extends that authority; it must not create a second browser
    manager/session stack.
  - >
    M2 remains the sole discovery/ranking/Human approval authority; the M2 approval bridge
    already enqueues approved product URLs into the existing M1 ingestion queue.
  - >
    Product Source Pack extraction/serialization and scrape-tool behavior remain owned by
    current src/product_source and src/tools modules. TASK-137 may exercise those callers
    but must not redefine their extraction, media, identity, persistence, or Drive
    semantics.
  - >
    M3 and M4 authority maps established through TASK-136 remain closed and unchanged.
    Browser transport/lifecycle fixes are upstream integration work, not permission to
    modify canonical identity, catalog, retrieval, RAG, prompt, provider, or answer
    behavior.

