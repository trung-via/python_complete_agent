non_goals:
  - Modify ProductCandidateSnapshot, discovery parsing, scoring, ranking, approval, queue
    semantics, or any M2 business authority.
  - Modify Shopee/TikTok extraction JavaScript, selectors, ProductSourcePack fields,
    source-pack serialization, media filtering/downloading, output directory semantics,
    Google Drive behavior, or scrape-tool result contracts.
  - Modify M3 entity resolution, family/variant approval/admission, catalog, SQLite,
    profile, lexical retrieval, grounded-context, or source-pack typed rehydration
    authority.
  - Modify M4 query planning, prompt packaging, provider invocation, grounded QA,
    GroundedAnswer semantics, persistent grounded QA, or M4 completion records.
  - Add browser pools, automatic browser restart/reconnect, multi-page scheduling,
    cross-run concurrency policy, cookie export/import, profile copying, login automation,
    CAPTCHA bypass, stealth behavior, or anti-bot circumvention.
  - Add automatic filesystem/Drive source-pack discovery, M3 knowledge-update orchestration,
    live-provider certification, CLI/API presentation, vector retrieval, or product-truth
    reconciliation.
  - Add environment-dependent browser-mode guessing, pytest detection, automatic fallback
    from CDP to launch, or a second BrowserManager/BrowserSession authority.
  - Change the AIOS pin, worker surfaces, publication workflow, TASK-126 historical
    artifacts/branches, or any AIOS/runtime implementation.
  - Access the operator's live Chrome, live Shopee/TikTok, models, or Google Drive during
    deterministic verification.
  - Push, merge, publish, rerun PRIMARY, or self-author semantic review from executor work.

constraints:
  hard:
    - >
      Extend the existing PlaywrightBrowserManager with one explicit optional CDP endpoint
      selection. PlaywrightBrowserManager() with no endpoint must preserve current launch
      behavior for isolated callers. AgentController's internally-created default manager
      must explicitly select http://127.0.0.1:9222. If a caller injects browser_manager,
      AgentController must preserve that exact object and must not override or wrap its
      browser mode.
    - >
      CDP mode belongs to the concrete Playwright manager/session lifecycle, not
      BrowserConfig product semantics. A per-call BrowserConfig passed to
      get_or_create_session must not silently disable or replace a manager-selected CDP
      endpoint. Reject non-Chromium BrowserConfig explicitly in CDP mode.
    - >
      CDP startup must use the existing Playwright dependency and call Chromium
      connect_over_cdp with the exact configured endpoint and a finite timeout derived
      from existing browser timeout authority. It must reuse browser.contexts[0] and the
      first existing non-closed page in that context's current order. It must not
      navigate during attachment and must not call launch, launch_persistent_context,
      new_context, or new_page in CDP mode.
    - >
      Missing context, empty/all-closed page lists, connection refusal/timeout, or CDP
      disconnection must fail closed through existing browser error/state authority.
      Failed attachment must not be cached as a usable session and must never fall back
      to launching another browser.
    - >
      Preserve current per-run manager locking/cache semantics. Repeated and concurrent
      get_or_create_session calls for the same healthy run return the same session and
      attach only once. A cached CLOSED or CRASHED session remains unavailable; TASK-137
      must not introduce automatic replacement/restart behavior.
    - >
      Add explicit resource-ownership handling so launch-owned resources keep current
      cleanup semantics while CDP mode treats browser, context, and page as borrowed.
      Closing a CDP-backed session, close_session, close_all, repeated close, or partial
      attachment cleanup must not close or create the operator's persistent Chrome,
      borrowed context, or borrowed page. Release only Python Agent-owned Playwright
      connection/listener resources, and remove only listeners installed by that session.
      Cleanup must not mask the original attachment error.
    - >
      Observe browser/page disconnection/crash sufficiently that a cached CDP session
      cannot remain semantically READY after its borrowed connection/page is unusable.
      Preserve existing READY/BUSY/CRASHED behavior for navigation, actions, screenshots,
      inspection, and launch mode.
    - >
      BrowserSession.evaluate and PlaywrightBrowserSession.evaluate must accept exactly
      one optional argument named arg both positionally and by keyword while preserving
      evaluate(script) compatibility. Omission and explicit None must remain
      distinguishable so one-argument calls still invoke Page.evaluate(script) while an
      explicitly supplied value, including None, False, 0, empty string, list, or dict,
      is forwarded unchanged through Page.evaluate using its arg parameter. Reject more
      than one evaluation argument through the normal Python call contract; do not
      stringify, normalize, interpolate, or drop falsey values.
    - >
      Preserve evaluate return values and existing readiness/error translation. A
      Playwright evaluation failure remains an existing browser-context error; TASK-137
      must not change ShopeeSourceExtractor exception or ProductSourcePack semantics.
    - >
      Add tests that traverse real PlaywrightBrowserManager and PlaywrightBrowserSession
      code while mocking only the lower Playwright connection/page boundary for CDP
      lifecycle determinism. Forbidden launch/context/page creation in CDP mode must be
      observable test failures. Tests must cover attach-once caching, unsupported browser
      type, refusal/timeout, missing context, no usable page, disconnection, borrowed
      cleanup, repeated cleanup, and retained launch mode.
    - >
      Add an AgentController regression proving the default internally-created browser
      manager is CDP-backed for http://127.0.0.1:9222 without touching the live endpoint,
      and a separate regression proving an explicitly injected manager is preserved by
      identity and receives no mode override.
    - >
      Add focused source-extractor regression evidence that
      ShopeeSourceExtractor.extract -> existing manager/session boundary -> real
      PlaywrightBrowserSession.evaluate forwards the unchanged extraction script and the
      exact product_id argument. The regression may mock the lower Playwright page but
      must not satisfy this requirement with a permissive extractor fake or by bypassing
      the session wrapper.
    - >
      Do not change Shopee/TikTok extraction scripts or discovery adapters merely to make
      tests pass. Existing extractor/discovery suites must remain green under the repaired
      browser contract.
    - >
      Update docs/PHASE_6_BOOTSTRAP.md to document the exact production CDP endpoint,
      explicit production-versus-isolated selection, existing-context/page requirement,
      fail-closed behavior, borrowed-resource ownership, sequential/shared-page caveat,
      and operator responsibility for starting/authenticating the persistent Chrome.
      Do not claim live marketplace success without separate live evidence.
    - >
      The committed TASK-137 implementation delta must stay inside scope.modify. Do not
      resurrect or mutate historical TASK-126 lineage. TASK-137 is a fresh current-main
      regression/integration task and its candidate must descend from the current TASK-137
      authoring commit.
    - Do not push from executor execution.

acceptance:
  - id: AC1
    condition: >
      AgentController's default internally-created browser manager selects exact CDP
      endpoint http://127.0.0.1:9222, while explicit browser_manager injection is
      preserved by identity and PlaywrightBrowserManager() without an endpoint retains
      launch mode.
  - id: AC2
    condition: >
      CDP startup attaches through Chromium exactly once per healthy cached run, reuses
      the exact first existing context and first non-closed existing page, performs no
      navigation or browser/context/page creation, and rejects unsupported browser types.
  - id: AC3
    condition: >
      Deterministic regressions prove CDP connection refusal/timeout, missing context,
      no usable page, page/browser disconnection, and failed attachment all fail closed
      with no launch fallback, no falsely READY state, and no failed cache entry.
  - id: AC4
    condition: >
      CDP cleanup releases only Python Agent-owned connection/listener resources and never
      closes borrowed Chrome/context/page; launch-mode cleanup remains unchanged and
      continues closing launch-owned resources.
  - id: AC5
    condition: >
      BrowserSession and PlaywrightBrowserSession accept evaluate(script) and exactly one
      optional positional/keyword arg. Omitted arg and explicit None remain distinct, and
      None, False, 0, empty string, list, and dict values are forwarded unchanged to the
      lower Page.evaluate arg parameter with existing result/error/state behavior.
  - id: AC6
    condition: >
      A focused regression traverses ShopeeSourceExtractor through the real current
      manager/session wrapper and proves the unchanged extraction script plus exact
      product_id reach Page.evaluate without changing ProductSourcePack extraction
      semantics.
  - id: AC7
    condition: >
      Existing browser/bootstrap, Shopee/TikTok source-extractor/scrape compatibility,
      and Shopee/TikTok discovery regressions pass without live network, model, Drive,
      test skip, or out-of-scope semantic change.
  - id: AC8
    condition: >
      Bootstrap documentation accurately records the authenticated CDP production
      boundary and retained isolated launch path, and git diff integrity proves the
      committed candidate contains no files outside TASK-137 scope.modify.

