non_goals:
  - Modify Shopee discovery/parsing, selectors, readiness, candidate mapping, scoring, ranking,
    approval, ProductCandidateSnapshot, or marketplace/product-truth semantics.
  - Add a second browser/session owner, second live-capture module, new executable/service/daemon,
    new persistence authority, or a second access-gate state machine.
  - Add P7 raw cohort capture, fixture import, TASK-181 evaluation, a new baseline, measurements,
    winner/threshold logic, or P7 enrichment.
  - Generalize live capture to TikTok in this task.
  - Automate Human verification, alter platform access controls, or add automatic access-gate retry.
  - Persist credentials, raw browser identity values, raw page content, screenshots, local absolute
    paths, browser profiles, or exception tracebacks in checkpoint/bundle output.
  - Change PlaywrightBrowserManager page-selection, launch/reconnect/restart, borrowed-resource,
    navigation, or close semantics beyond the minimum read-only binding receipt.
  - Modify AIOS-renew, the downstream pin, worker surfaces, verification, continuation, or publication.
  - Perform live Chrome/Shopee/TikTok/Drive/provider/network work during TASK-189 verification.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Preserve one-capability-one-owner. TASK-166 live_capture.py remains the sole capture sequencing
      and checkpoint owner. TASK-137 BrowserSession / PlaywrightBrowserSession remain the sole
      browser/CDP lifecycle owner. BrowserSession may gain exactly one read-only opaque binding-digest
      operation; live_capture.py consumes it only through the public BrowserSession surface.
    - >
      The Playwright CDP binding receipt must be a deterministic lowercase SHA-256 digest derived
      inside the existing browser authority from non-sensitive identity of the currently borrowed
      page/context. Raw identity values must never leave that authority or be persisted. The digest
      must remain stable across navigation in the same borrowed page target and differ when the
      borrowed page target changes. If it cannot be established safely, fail closed through existing
      browser error authority.
    - >
      Do not change TASK-137 page-selection policy. TASK-189 binds the exact page/session selected by
      existing browser authority; it does not search for a marketplace tab, reorder pages, create a
      replacement page, or navigate while deriving the binding receipt.
    - >
      Upgrade capture_checkpoint.json to schema version 2 while leaving the existing READY
      capture_bundle.json shape/version/evidence semantics unchanged. V2 checkpoint persists only a
      SHA-256 digest of the exact supplied CDP endpoint plus browser_binding_digest; it must not
      persist the raw endpoint.
    - >
      Define V2 statuses exactly NEW, SESSION_READY, RUNNING, HUMAN_ACTION_REQUIRED, VERIFY_SESSION,
      SESSION_LOST, READY, FAILED. Preserve capture phases exactly DISCOVERY, ACQUIRE_1, ACQUIRE_2,
      COMPLETE. Status owns operational/session control state; phase owns exact unfinished capture work.
    - >
      Fresh capture atomically initializes NEW before browser/network work, constructs exactly one
      existing PlaywrightBrowserManager from the supplied endpoint, obtains the existing session,
      derives endpoint and browser binding digests, transitions through SESSION_READY to RUNNING,
      and then executes existing TASK-166 phase logic. Existing query order, one-manager/one-tool,
      checkpoint progress, evidence hashing, bundle immutability, and no-repeat-completed-work
      semantics remain unchanged.
    - >
      Existing authoritative access-gate signals map to HUMAN_ACTION_REQUIRED at the exact unfinished
      phase. Do not add another platform detector or infer Human action from empty results, timeout,
      ranking/scoring output, or arbitrary exception text. HUMAN_ACTION_REQUIRED performs no
      automatic retry/navigation/reload/query change and returns a bounded normal outcome.
    - >
      Resume from HUMAN_ACTION_REQUIRED first compares the exact supplied endpoint digest with the
      checkpoint. It then attaches using existing browser authority and compares the current browser
      binding digest before any unfinished marketplace operation. A mismatch atomically transitions
      to SESSION_LOST and returns without executing the unfinished phase.
    - >
      When endpoint and binding match, resume transitions to VERIFY_SESSION and performs exactly one
      bounded non-mutating generic browser-liveness probe through the existing BrowserSession public
      surface. It must not navigate, reload, duplicate platform-specific access-gate detection, or
      acquire evidence. A usable session transitions through SESSION_READY to RUNNING and continues
      the exact unfinished phase once. If that authoritative operation reports the access gate again,
      return HUMAN_ACTION_REQUIRED without advancement.
    - >
      Browser-resource errors that specifically establish closed/disconnected/unavailable borrowed
      resources may transition to SESSION_LOST. Do not broaden SESSION_LOST to ordinary navigation
      failure, malformed/empty evidence, ranking result, storage/path failure, checkpoint corruption,
      or arbitrary exception text; those remain terminal TASK-166 failures.
    - >
      SESSION_LOST is Human-visible and non-terminal but cannot continue implicitly. Add one explicit
      --rebind-session boolean on the existing capture CLI, valid only with --resume on a SESSION_LOST
      V2 checkpoint. Rebind may establish a newly supplied endpoint/browser binding, perform the same
      non-mutating VERIFY_SESSION probe, then continue only the exact unfinished phase. It may not
      replace queries, alter phase, discard completed evidence, or repeat completed work.
    - >
      Existing V1 READY bundles remain immutable and are never rewritten. A valid V1
      CHALLENGE_REQUIRED checkpoint may be explicitly resumed with its exact stored endpoint and
      atomically upgraded to V2 before unfinished work, preserving exact queries/phase/progress while
      removing the raw endpoint. Other V1 states gain no new resume or mutation authority.
    - >
      Preserve existing capture_bundle.json evidence semantics, selected-candidate behavior,
      two-observation requirement, manifest SHA-256, external-root safety, READY immutability,
      discovery/ranking, acquisition, browser ownership, and ProductSourcePack behavior unchanged.
    - >
      Keep the existing Product Intelligence CLI as the only Human-facing Python Agent command
      surface. Fresh capture arguments remain unchanged. Resume keeps --job-root and --cdp-endpoint
      with no replacement queries. Add only --rebind-session as specified above. Normal CLI output
      may expose bounded status/phase/query position and relative artifact filenames only; it must
      not expose endpoint or binding digests.
    - >
      Update docs/CHATGPT_PROJECT_CONTRACT.md with one narrow authoring rule: when mutable live
      marketplace evidence can be staged through a repository-owned operational surface,
      engineering TASK implementation and Runtime verification consume reviewed/frozen evidence
      instead of making an Executor perform live marketplace acquisition. CONTINUE_IMPLEMENTATION is
      an exceptional recovery safety net, not the normal Human access/session workflow. An exception
      requires explicit current Human intent plus TASK architecture justification.
    - >
      Update docs/PHASE_6_P6_1_LIVE_CAPTURE_CHECKPOINT.md for V2 status semantics, endpoint redaction,
      browser binding, HUMAN_ACTION_REQUIRED, SESSION_LOST, explicit rebind, verify-before-resume,
      Human ownership, and preserved browser/discovery/extraction authorities.
    - >
      Update P7.0 documentation and both canonical roadmaps to preserve TASK-181 CLOSED/PUBLISHED,
      TASK-182 BLOCKED/UNPUBLISHED, TASK-185 CLOSED/PUBLISHED, TASK-186 BLOCKED/UNPUBLISHED, TASK-187
      CLOSED/PUBLISHED, and record TASK-188/RUN-188-004 as BLOCKED/UNPUBLISHED with no source
      candidate. Record TASK-189 as the current boundary-hardening prerequisite. Fresh P7.1 raw
      cohort capture remains deferred until TASK-189 publication; diagnostic observations are not
      baseline truth.
    - >
      Verification is fully offline and deterministic. Browser binding uses deterministic fake CDP
      responses; capture state transitions, V1 compatibility, endpoint redaction, rebind and CLI use
      fake managers/tools and temporary local external roots only. No live browser, marketplace,
      provider, Drive, network, Human interaction or real sleep is permitted.
    - >
      Regressions prove at minimum: stable binding digest across same-target navigation; different
      digest for another target; no raw browser identity leakage; V2 fresh state progression;
      access gate -> HUMAN_ACTION_REQUIRED with exact phase preserved; matching resume ->
      VERIFY_SESSION -> SESSION_READY -> RUNNING; binding mismatch -> SESSION_LOST with zero unfinished
      operation calls; explicit rebind resumes exact unfinished phase; repeated access gate stability;
      browser-resource loss classification; ordinary failures remain FAILED; V1 challenge checkpoint
      upgrade removes raw endpoint; existing READY bundle immutability; CLI redaction; and all prior
      TASK-166 regressions remain green.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      TASK-189 extends only existing TASK-137 browser identity/lifecycle and TASK-166 live-capture
      sequencing/checkpoint authorities and introduces no second browser, discovery, access-gate,
      capture, ranking, evidence, or product-truth owner.
  - id: AC2
    condition: >
      BrowserSession exposes one read-only opaque SHA-256 binding digest that is stable for the same
      borrowed page target across navigation, changes for another target, and leaks no raw browser
      identity material.
  - id: AC3
    condition: >
      V2 checkpoint persists endpoint/browser binding digests rather than raw CDP endpoint and uses
      exactly NEW, SESSION_READY, RUNNING, HUMAN_ACTION_REQUIRED, VERIFY_SESSION, SESSION_LOST,
      READY, FAILED while preserving TASK-166 phases and evidence semantics.
  - id: AC4
    condition: >
      Existing authoritative access-gate signals become HUMAN_ACTION_REQUIRED with exact progress
      preserved; normal resume validates endpoint + binding and performs one non-mutating liveness
      probe before the unfinished operation.
  - id: AC5
    condition: >
      Binding/resource loss becomes SESSION_LOST without unfinished marketplace work; only explicit
      Human --rebind-session establishes a new binding and continues the exact unfinished phase,
      while ordinary capture failures remain terminal FAILED.
  - id: AC6
    condition: >
      Valid legacy V1 CHALLENGE_REQUIRED can upgrade to V2 without changing query/phase/progress or
      retaining raw endpoint; other V1 immutable/terminal states gain no mutation authority.
  - id: AC7
    condition: >
      Existing TASK-166 bundle/evidence, ranking/selection, acquisition count, manifest hashing,
      external-root safety, READY immutability, browser ownership, Shopee discovery/parsing and
      ProductSourcePack semantics remain unchanged.
  - id: AC8
    condition: >
      Existing capture CLI adds only bounded explicit SESSION_LOST rebind and exposes no endpoint or
      binding secrets while preserving behavior outside V2 states.
  - id: AC9
    condition: >
      Governance/phase/roadmap docs record the operational-plane versus engineering-plane boundary,
      TASK-188 BLOCKED/UNPUBLISHED, TASK-189 current prerequisite, and defer fresh P7.1 raw capture
      until TASK-189 publication without treating diagnostic observations as baseline truth.
  - id: AC10
    condition: >
      Required offline verification and git diff --check pass with zero unresolved items, zero live
      marketplace/browser/network work, and changed files remain within TASK-189 scope.modify.

