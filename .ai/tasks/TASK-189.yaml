task_id: TASK-189
revision: 1

goal: >
  Harden the existing TASK-166 repository-owned Shopee live-capture checkpoint boundary into
  Session/Access Continuity V2. Human-owned marketplace access gates and browser/session loss must
  become explicit operational states with deterministic resume, not ad-hoc live work inside an AIOS
  engineering RUN. Preserve TASK-166 live_capture.py as the sole capture sequencing/checkpoint
  authority and TASK-137 browser/session code as the sole CDP lifecycle authority. Add only the
  minimum read-only browser binding receipt required to distinguish same endpoint from same borrowed
  browser page/session. This task adds no new capture mode and captures no P7.1 evidence.

problem: >
  TASK-166 established the correct operational boundary for mutable marketplace session state, but
  later P7.1 benchmark attempts again required implementation-time live marketplace capture inside
  Executor work. TASK-188 latest canonical RUN-188-004 is a zero-delta COMPLETION_GATE failure and
  remains BLOCKED / UNPUBLISHED; no production Shopee adapter defect is established by that lineage.
  A separate Human diagnostic audit, which is diagnostic context only and not canonical P7.1
  evidence, showed that current published production code can execute the exact three TASK-188
  Shopee queries with five candidates each and fifteen distinct IDs/URLs when the authenticated
  session is usable. The narrow architectural gap is therefore live evidence execution/session
  continuity. TASK-166 V1 also persists the raw CDP endpoint, treats exact endpoint equality as
  resume continuity, has no explicit verify-before-resume state, and does not distinguish browser
  session loss from ordinary terminal capture failure.

assumptions:
  - >
    Canonical main immediately before TASK-189 authoring is
    2f30b408e5e2e8854c997afe8093dddd10010471. Its parent is published TASK-187 source
    857e6b5d0009e9327e1a92d5f62b91432e28f150; main additionally contains TASK-188 authoring state.
  - >
    The exact Python Agent AIOS runtime authority remains
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@e72135cd5c5a1dec0d8374d9bb8994da5e458feb.
  - >
    TASK-188/RUN-188-004 remains BLOCKED / UNPUBLISHED with no source candidate. Do not continue,
    repair, publish, or reuse its live diagnostics as baseline truth in this task.
  - >
    TASK-166 live_capture.py remains the sole bounded resumable live-capture sequencing/checkpoint
    authority. TASK-137 BrowserSession / PlaywrightBrowserSession remain the sole browser/CDP
    connection, borrowed-resource, page-selection, and lifecycle authority.
  - >
    TASK-151 discovery readiness/access-gate detection, TASK-162 deep extraction/access-gate
    detection, ShopeeDiscoveryAdapter, ShopeeScrapeTool, orchestration/ranking, ProductSourcePack,
    and all Product Intelligence truth authorities remain unchanged.
  - >
    The Human explicitly selected this boundary correction before any fresh P7.1 capture work.
    Raw P7 discovery-cohort capture remains deferred until TASK-189 Runtime PASS, semantic PASS,
    and source-only publication.

