task_id: TASK-260
revision: 2

goal: >
  Reconcile the roadmap after exact TASK-254 publication and restore the original P8
  real-commerce-decision objective as the planning center. Preserve a time-aware bounded
  knowledge-state view over the selected pilot, close stale BP9-to-TASK254 continuation
  pointers, expose Human-owned missing decision inputs, reuse P7.5 laws without fabricating a
  P7.5 plan or disposition, and return exactly one unranked Human/Brain choice gate. Grant no
  acquisition, test, action, successor-task or future-domain authority.

problem: >
  TASK-254 r6 is exactly published at
  36627c80e76f156fcb774b10fbd35d14df6d9ea4 after RUN-254-003 /
  REVIEW-254-001 PASS. The carrier provenance defect is closed, but the real-commerce decision
  remains under uncertainty: no current-price value is admitted; the 68220 original-price
  observation belongs to the dated Generation-8 diagnostic and is not current truth; affiliate
  economics remain unestablished; manual Wave-1 contribution remains unperformed; and Human
  economics/test/risk inputs remain unset. The prior revision incorrectly risked describing
  historical observations as current, applying P7.5 dispositions to Human-owned inputs even
  though no canonical current P7.4 real-pilot profile exists, and leaving current roadmap shapes
  open enough to retain TASK-254 acquisition residue. Existing governance tests also still freeze
  TASK-254 and BP9 resume pointers as current state. Revision 2 closes those ambiguities while
  preserving the planning-only objective.

assumptions:
  - >
    Canonical main at authoring is exactly
    be663b74f52244a5bc8f0b772768c4f28b0e26d0. TASK-260 r1 is authored but unexecuted.
    No engineering RUN-260 exists.
  - >
    Exact predecessor is TASK-254 r6 / RUN-254-003 / REVIEW-254-001 / published source
    36627c80e76f156fcb774b10fbd35d14df6d9ea4. RUN-254-001 and RUN-254-002 remain immutable
    failed verification history; REPAIR-254-001 and REPAIR-254-002 remain correction lineage.
  - >
    Current roadmap after TASK-254 has active_track DONE, next_milestone null,
    pending_commitments empty, and handoff
    HUMAN_BRAIN_FRESH_POST_GEN8_PAIRED_PRICE_COLLECTOR_VALIDATION_AUTHORIZATION. This is a
    decision gate, not a selected NEXT.
  - >
    P8.0 remains the sole decision-loop composition owner; P7.3/P7.4/P7.5/P7.6/P7.7 and Product
    Intelligence keep their canonical ownership. TASK-260 is Brain planning state only.
  - >
    P7.5 canonical dispositions are CONTINUE, DEFER and STOP, but constructing a canonical
    ValueOfInformationPlan requires a valid DecisionContext, OpportunityHypothesis and
    TikTokAffiliateEvidenceProfile. TASK-260 has no authority to fabricate a current real-pilot
    P7.4 profile merely to obtain a P7.5 disposition.
  - >
    P7.5 laws still guide qualitative reasoning: missingness != acquisition authorization,
    collectability != value, CONTINUE != authorization, DEFER != permanent rejection,
    STOP != proof no evidence exists, represented != sufficient and disposition != decision.
  - >
    Historical TASK-233 external evidence established exact-listing binding and title at the
    TASK-233 operation time, but canonical roadmap state does not restate a trustworthy exact
    observation timestamp for those two fields. TASK-260 therefore must preserve them as
    historical observations with freshness NOT_ASSERTED, not as current marketplace truth.
  - >
    Generation-8 V5 diagnostic evidence has exact observed_at
    2026-09-26T07:43:19.570359+00:00. It supports original_price OBSERVED_ONLY 68220.0 and
    current_price UNKNOWN/null at that observation time; SNAPSHOT_IS_NOT_TREND and time remains
    first-class.
  - >
    Current knowledge for shop_name, discount_percent, sold_count, rating and review_count
    remains UNKNOWN. Affiliate eligibility, affiliate commission rate and estimated commission
    remain NOT_ESTABLISHED by canonical exact-listing evidence.
  - >
    TASK-229 manual Wave-1 authorization is historical; contribution_status and review_status
    remain UNPERFORMED_BY_TASK and human_owned_inputs_status remains UNSET. It is not assumed
    automatically executable after subsequent roadmap progression.
  - >
    Human-owned budget, duration, exposure controls, contribution-margin threshold,
    success/failure criteria, target audience, quality constraints, risk constraints,
    risk acceptance and decision timing remain unset and cannot be produced by marketplace
    acquisition.
  - >
    Active AIOS pin remains 44eee353eda376c9db8cd88d97184d3122651bf5 and full downstream
    conformance remains TASK-207 r14 / RUN-207-014 / REVIEW-207-005. BP9/P1B history remains
    unchanged except its live TASK-254 continuation pointers are now stale planning state.
  - >
    CAPABILITY_IS_NOT_AUTHORITY, EVIDENCE_IS_NOT_KNOWLEDGE,
    EVIDENCE_IS_NOT_PRODUCT_TRUTH, INTELLIGENCE_IS_DECISION_RELATIVE,
    VALUE_OF_INFORMATION_BEFORE_ENRICHMENT, SNAPSHOT_IS_NOT_TREND,
    AUTOMATION_IS_NOT_INTELLIGENCE, RECOMMENDATION_IS_NOT_DECISION and
    ONE_CAPABILITY_ONE_AUTHORITY remain mandatory.

