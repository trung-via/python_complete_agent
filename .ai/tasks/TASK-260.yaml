non_goals:
  - >
    Modify any production Python module, Product Intelligence collector/parser/browser/session
    behavior, P7.3-P7.7 semantic module, P8.0 composition implementation, AIOS configuration,
    AIOS adoption/conformance state, registry, workflow, Runtime, Reviewer or Publisher.
  - >
    Execute TikTok/CDP, invoke the live carrier, create a marker/result, acquire marketplace
    evidence, perform manual Wave-1 contribution, access TikTok Affiliate UI, inspect an account,
    resolve CAPTCHA, navigate, search, click, type, refresh, switch variants or perform any live
    external operation.
  - >
    Authorize or consume a live validation attempt, manual contribution operation, Wave 0/1/2
    acquisition, market test, spend, traffic, content publication, campaign mutation, pricing,
    inventory mutation, Product Intelligence approval or any commerce action.
  - >
    Construct a P7.4 TikTokAffiliateEvidenceProfile or P7.5 ValueOfInformationPlan from
    unavailable/unreviewed real-pilot evidence. Do not fabricate a profile merely to run the
    existing factory.
  - >
    Create a new VOI score, readiness score, evidence-priority ranking, universal sufficiency
    threshold, recommendation engine, acquisition router, roadmap selector or autonomous loop.
  - >
    Treat current-price UNKNOWN, missing affiliate economics, unperformed manual contribution
    or unset Human inputs as proof that more collection is automatically required.
  - >
    Automatically choose Media/Creative Intelligence, Distribution Intelligence, Commerce
    Operations Intelligence, Product Intelligence rework or another future domain.
  - >
    Select, author, mark NEXT, dispatch or execute a successor task from TASK-260.
  - >
    Rewrite immutable TASK-207/TASK-255/TASK-259 historical task language or prior published
    P8 evidence/diagnostic history.

constraints:
  hard:
    - >
      Classification is exactly
      POST_TASK254_REAL_DECISION_SUFFICIENCY_AND_ROADMAP_RECONCILIATION_ONLY.
      TASK-260 is Brain-owned planning reconciliation only; it owns no evidence, product truth,
      decision, action, acquisition, market-test, VOI or future-domain semantics.
    - >
      Exact predecessor selector is TASK-254 revision 6 / RUN-254-003 /
      REVIEW-254-001 / published source
      36627c80e76f156fcb774b10fbd35d14df6d9ea4. RUN-254-001 and RUN-254-002 remain immutable
      failed verification history and REPAIR-254-001 / REPAIR-254-002 remain correction lineage.
    - >
      Create exactly one planning document
      docs/PHASE_8_POST_TASK254_REAL_DECISION_SUFFICIENCY_AND_ROADMAP_RECONCILIATION.md.
      It must explain that the original P8 objective is a real-commerce decision loop and that
      acquisition is subordinate to decision-relevant uncertainty reduction rather than an
      objective in itself.
    - >
      The document and roadmap must freeze the current decision-sufficiency snapshot without
      promoting it to evidence truth. At minimum represent:
      exact selected listing identity/provenance OBSERVED; title OBSERVED;
      current_price UNKNOWN/null; original_price OBSERVED_ONLY 68220.0;
      current exact-listing shop_name, discount_percent, sold_count, rating and review_count
      UNKNOWN; affiliate eligibility/commission/estimated commission NOT_ESTABLISHED;
      manual Wave-1 contribution UNPERFORMED; manual review UNPERFORMED;
      Human-owned test/economic/risk inputs UNSET; canonical_evidence_ingested false;
      price_role_resolution_complete false; selector_repair_complete false.
    - >
      Do not collapse absence semantics. UNKNOWN, NOT_ESTABLISHED, UNPERFORMED and UNSET are
      distinct. An unavailable or unperformed observation is not zero, false, rejected or proof
      that the information lacks decision value.
    - >
      Reuse P7.5 semantics exactly. For each remaining information question that TASK-260
      discusses, expose the same nine qualitative considerations from P7.5 and one advisory
      disposition drawn only from CONTINUE, DEFER or STOP. The disposition is planning advice,
      not an acquisition order, recommendation, decision, lifecycle gate or NEXT selector.
    - >
      At minimum evaluate, without ranking them, these bounded inquiry families:
      (1) exact-listing current price/variant economics;
      (2) affiliate eligibility/commission/estimated commission;
      (3) current market-traction observations such as sold_count/rating/review_count;
      (4) currently unset Human-owned economics/test/risk inputs.
      The Human-input inquiry must explicitly state that marketplace acquisition cannot supply
      those values.
    - >
      Deeper Wave-2 dimensions (creator ecosystem, content activity, audience-channel fit,
      competition saturation, longitudinal velocity) remain NOT_AUTOMATIC and may remain DEFER
      unless current canonical reasoning can show they could materially change the Human decision
      despite higher cost/access/fragility. Do not collect them for completeness.
    - >
      Represent the current decision state as MARKET_TEST_READINESS_NOT_ESTABLISHED rather than
      TEST_READY/NOT_READY, because no canonical task has authority to make a market-test
      approval decision here. The basis must include unresolved affiliate economics and
      Human-owned constraints without pretending that resolving either guarantees authorization.
    - >
      Define exactly five unranked Human/Brain candidate continuations, all with
      selection_status HUMAN_SELECTION_REQUIRED and automatic_progression false:
      AUTHORIZE_ONE_SHOT_POST_TASK254_CARRIER_VALIDATION;
      RECONFIRM_MANUAL_WAVE1_CONTRIBUTION;
      REQUEST_HUMAN_DECISION_INPUTS;
      DEFER_CURRENT_PILOT;
      STOP_CURRENT_PILOT.
      Their presence is a choice set, not a recommendation. No candidate is NEXT or preferred.
    - >
      The one-shot validation candidate, if later selected, must be described accurately:
      a future authorization would bind the exact TASK-254 published carrier source
      36627c80e76f156fcb774b10fbd35d14df6d9ea4 while retaining collector_validation_baseline
      TASK-253 / 33776f11b20977f46d45d394fa1c56040029b65d. TASK-260 itself must not add
      validation_carrier_source_sha to current state or grant an attempt.
    - >
      The manual Wave-1 candidate must not claim TASK-229 remains automatically executable.
      It may only identify the already-published historical authorization and require fresh
      Human confirmation/reconciliation before any external manual operation.
    - >
      The Human-input candidate must preserve Human sovereignty: budget, duration, exposure,
      contribution-margin threshold, success/failure criteria, audience, quality constraints,
      risk constraints, risk acceptance and decision timing are Human-owned. TASK-260 may list
      them as missing decision inputs but must not propose values.
    - >
      Close current stale BP9-to-TASK254 planning pointers without rewriting their history.
      In human_priority_side_track, keep BP9 status/history unchanged but reconcile
      next_after_publication and preserved_product_commitment so they state TASK-254 r6 completed
      on exact reviewed-source publication, with run_id RUN-254-003, review_id REVIEW-254-001 and
      published_sha 36627c80e76f156fcb774b10fbd35d14df6d9ea4. They must no longer say
      AUTHORED_UNEXECUTED or UNIQUE_AUTHORED_UNEXECUTED_CONTINUATION.
    - >
      In full_downstream_conformance preserve certification state, exact pin, TASK-207 r14 and
      all conformance semantics. Set next_commitment to null. Reconcile resume_target in place
      from AUTHORED_UNEXECUTED to COMPLETED_ON_EXACT_TASK_254_REVIEWED_SOURCE_PUBLICATION with
      run_id RUN-254-003, review_id REVIEW-254-001 and exact published SHA. Do not add a new
      duplicate conformance or history owner.
    - >
      On exact TASK-260 publication, active_track is
      P8_POST_TASK254_REAL_DECISION_SUFFICIENCY_AND_ROADMAP_RECONCILIATION with title
      "P8 Post-TASK254 Real-Decision Sufficiency & Roadmap Reconciliation",
      priority_owner HUMAN, status DONE, completion_basis PUBLICATION_GATED,
      sequence_status COMPLETE_ON_EXACT_TASK_260_SOURCE_PUBLICATION and next_milestone null.
    - >
      On publication active_track.current_milestone is TASK-260 with classification
      POST_TASK254_REAL_DECISION_SUFFICIENCY_AND_ROADMAP_RECONCILIATION_ONLY,
      authorization_owner HUMAN_BRAIN, exact TASK-254 predecessor selector,
      status DONE, completion_basis PUBLICATION_GATED, next_milestone null,
      automatic_progression false, live_public_pdp_acquisition_authority NONE,
      automated_public_pdp_acquisition_authority NONE and market_test_or_action_authority NONE.
    - >
      On publication pending_commitments is exactly []. post_p8_planning_handoff destination is
      HUMAN_BRAIN_REAL_DECISION_SUFFICIENCY_SELECTION, status
      EFFECTIVE_ON_EXACT_TASK_260_SOURCE_PUBLICATION, next_milestone null,
      post_run_engineering_successor null, automatic_progression false, and all live/acquisition/
      action authorities NONE. It must carry the five unranked choice records and the bounded
      decision-sufficiency snapshot while retaining prior P8 historical mappings as history.
    - >
      Append exactly one completed_milestones TASK-260 record with task_revision 1,
      exact track/milestone identity, exact TASK-254 predecessor selector,
      planning-only classification, MARKET_TEST_READINESS_NOT_ESTABLISHED,
      five unranked HUMAN_SELECTION_REQUIRED candidate continuations, zero live/action authority,
      next_milestone null, post_run_engineering_successor null and effective_only_when:
      semantic_review PASS / published_source EXACT_REVIEWED_CANDIDATE /
      canonical_main_equals_reviewed_candidate true.
    - >
      Preserve every prior completed milestone and existing P8 historical mapping. TASK-260 may
      replace the direct current projection of post_p8_planning_handoff but must not recursively
      delete TASK-229/TASK-233/TASK-249/TASK-251/TASK-253/TASK-254 history.
    - >
      Update both canonical roadmap documents consistently. They must stop describing additional
      PDP acquisition as the implied continuation and instead state that after TASK-254 the
      product returns to a Human/Brain real-decision sufficiency gate governed by P7.5 VOI and
      Human-owned constraints.
    - >
      Extend governance regression to prove stale BP9 pointers are closed, TASK-254 is historical
      completed state, current TASK-260 planning state creates no acquisition/action authority,
      five choices are unranked/Human-owned, no NEXT exists, Human inputs remain unset, and P7.5
      remains the sole VOI semantic authority.
    - >
      Changes are confined to the five authorized scope.modify paths. Runtime verification is
      deterministic/offline. Executor must not review, publish, run live operations, authorize a
      continuation or dispatch a successor.

acceptance:
  - id: AC1
    condition: >
      Exact TASK-254 r6 / RUN-254-003 / REVIEW-254-001 /
      36627c80e76f156fcb774b10fbd35d14df6d9ea4 is the sole predecessor and TASK-254 remains
      immutable completed history.
  - id: AC2
    condition: >
      The planning document restores the P8 real-decision objective, accurately freezes current
      evidence/unknown/unperformed/unset state, and creates no new evidence, truth, VOI,
      recommendation, decision or action authority.
  - id: AC3
    condition: >
      Remaining inquiries reuse only P7.5 CONTINUE/DEFER/STOP and the nine qualitative
      considerations, with no score/ranking/acquisition order and no fabricated P7.4 profile.
  - id: AC4
    condition: >
      MARKET_TEST_READINESS_NOT_ESTABLISHED is represented as bounded planning state with Human
      inputs and unresolved affiliate economics visible, without asserting TEST_READY/NOT_READY,
      recommendation, approval or future outcome.
  - id: AC5
    condition: >
      Exactly five unranked candidate continuations exist, each HUMAN_SELECTION_REQUIRED with
      automatic progression false; none is NEXT, preferred, recommended or automatically
      executable.
  - id: AC6
    condition: >
      The future one-shot validation candidate references exact TASK-254 carrier publication and
      TASK-253 collector baseline but TASK-260 grants no validation attempt and does not populate
      validation_carrier_source_sha.
  - id: AC7
    condition: >
      BP9/full-conformance live continuation pointers no longer describe TASK-254 as unexecuted;
      certification history and exact pin 44eee353eda376c9db8cd88d97184d3122651bf5 remain unchanged.
  - id: AC8
    condition: >
      Roadmap current state is TASK-260 publication-gated DONE with next_milestone null,
      pending_commitments [], destination HUMAN_BRAIN_REAL_DECISION_SUFFICIENCY_SELECTION and
      zero live/acquisition/action authority while all prior P8 history remains intact.
  - id: AC9
    condition: >
      Both roadmap documents consistently state that acquisition is subordinate to
      decision-relevant uncertainty reduction and that Human-owned constraints cannot be replaced
      by marketplace evidence or automation.
  - id: AC10
    condition: >
      Only the five authorized planning/docs/governance-test paths change; deterministic
      governance verification and git diff --check pass with no live network/browser/provider
      operation and no successor execution.

