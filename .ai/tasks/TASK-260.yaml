acceptance:
  - id: AC1
    condition: >
      Exact TASK-254 r6 / RUN-254-003 / REVIEW-254-001 /
      36627c80e76f156fcb774b10fbd35d14df6d9ea4 is the sole predecessor and TASK-254 remains
      fully asserted as immutable completed history.
  - id: AC2
    condition: >
      TASK-260 uses a time-aware knowledge-state snapshot: historical observations remain
      historical/freshness-not-asserted, exact Gen-8 time is preserved where known, and
      UNKNOWN/NOT_ESTABLISHED/UNPERFORMED/UNSET are not collapsed.
  - id: AC3
    condition: >
      P7.5 remains the sole VOI authority. TASK-260 reuses its nine considerations and laws but
      constructs no P7.4 profile, no ValueOfInformationPlan and no CONTINUE/DEFER/STOP
      disposition; Human-owned inputs are separately represented as non-acquirable.
  - id: AC4
    condition: >
      MARKET_TEST_READINESS_NOT_ESTABLISHED is planning state only and exactly five unranked
      HUMAN_SELECTION_REQUIRED candidates exist with preferred/recommended/automatic false and
      no NEXT.
  - id: AC5
    condition: >
      Future validation and manual-Wave1 candidates are described with correct lineage and
      authority boundaries but TASK-260 grants no operation, carrier source binding or evidence
      acquisition.
  - id: AC6
    condition: >
      BP9/full-conformance live pointers record TASK-254 completion instead of unexecuted status
      while exact pin, conformance certification and P1B history remain unchanged.
  - id: AC7
    condition: >
      active_track/current_milestone and post_p8 direct current projection satisfy their closed
      positive schemas with no direct TASK-254 carrier/validation residue and zero live/action
      authority.
  - id: AC8
    condition: >
      TASK-254 and BP9 governance tests are historicalized/reconciled without semantic weakening,
      and new TASK-260 regression proves no current milestone/NEXT/automatic continuation is
      selected.
  - id: AC9
    condition: >
      Exactly one TASK-260 r2 completed record exists; pending_commitments is []; handoff is
      HUMAN_BRAIN_REAL_DECISION_SUFFICIENCY_SELECTION; all prior P8 nested history is retained.
  - id: AC10
    condition: >
      Only the five authorized planning/docs/governance-test paths change; focused governance
      verification and git diff --check pass with no external operation.

