    Modify production Python, P7/P8 semantic implementations, Product Intelligence,
    AIOS adoption/conformance, registries, workflows, Runtime, Reviewer or Publisher.
  - >
    Execute TikTok/CDP or any live/manual external evidence operation; invoke the carrier;
    create validation artifacts; use Affiliate UI; navigate, search, click, type, refresh,
    resolve CAPTCHA or acquire evidence.
  - >
    Authorize validation, manual contribution, Wave 0/1/2, market test, spend, traffic,
    creative publication, campaign mutation, Product Intelligence approval or commerce action.
  - >
    Construct or simulate a TikTokAffiliateEvidenceProfile or ValueOfInformationPlan for the
    current real pilot. Do not invent a profile_id, plan_id, disposition or P7.5 result.
  - >
    Create a VOI/readiness/evidence-priority score, ranking, recommendation engine,
    acquisition router, roadmap selector or autonomous continuation.
  - >
    Treat historical observed evidence as current, fresh, trend evidence or Product Truth.
  - >
    Select a preferred continuation, mark a candidate NEXT, author a successor, execute a
    successor or select a future intelligence domain.
  - >
    Rewrite immutable TASK-207/TASK-255/TASK-259 historical task text or prior published
    evidence/diagnostic facts.

constraints:
  hard:
    - >
      Classification is exactly
      POST_TASK254_REAL_DECISION_SUFFICIENCY_AND_ROADMAP_RECONCILIATION_ONLY.
      TASK-260 owns only Human/Brain planning reconciliation.
    - >
      Exact predecessor selector is TASK-254 r6 / RUN-254-003 / REVIEW-254-001 /
      36627c80e76f156fcb774b10fbd35d14df6d9ea4.
    - >
      Create exactly one planning document
      docs/PHASE_8_POST_TASK254_REAL_DECISION_SUFFICIENCY_AND_ROADMAP_RECONCILIATION.md.
      It must state that P8 is a real-commerce decision loop and acquisition is subordinate to
      decision-relevant uncertainty reduction rather than an objective in itself.
    - >
      Use a time-aware KNOWLEDGE-STATE projection, not a claim of current marketplace truth.
      It must distinguish:
      selected source/listing binding = CANONICALLY_SELECTED and HISTORICALLY_OBSERVED at
      TASK-233 operation time with freshness NOT_ASSERTED;
      title = HISTORICALLY_OBSERVED_TASK233 with freshness NOT_ASSERTED;
      current_price = UNKNOWN/null;
      original_price = OBSERVED_ONLY 68220.0 at
      2026-09-26T07:43:19.570359+00:00 with freshness NOT_ASSERTED;
      shop_name/discount_percent/sold_count/rating/review_count = UNKNOWN;
      affiliate eligibility/commission/estimated commission = NOT_ESTABLISHED;
      manual Wave-1 contribution = UNPERFORMED;
      manual review = UNPERFORMED;
      Human-owned inputs = UNSET;
      canonical_evidence_ingested false; price_role_resolution_complete false;
      selector_repair_complete false. Do not invent a TASK-233 observed_at value.
    - >
      Preserve UNKNOWN, NOT_ESTABLISHED, UNPERFORMED, UNSET and historical OBSERVED_ONLY as
      distinct states. Snapshot evidence is not freshness, trend, truth or present-value proof.
    - >
      Reuse P7.5 only as semantic law and qualitative lens. The planning document must apply the
      nine P7.5 considerations to the three evidence inquiry families:
      (1) affiliate_economics: exact-listing current price/variant economics;
      (2) affiliate_economics: affiliate eligibility/commission/estimated commission;
      (3) market_traction: sold_count/rating/review_count.
      Do not emit CONTINUE/DEFER/STOP for these inquiries because no canonical current real-pilot
      TikTokAffiliateEvidenceProfile exists and TASK-260 must not fabricate a P7.5 plan.
    - >
      Human-owned economics/test/risk inputs are not a P7.4 evidence dimension and must not be
      represented as a ValueOfInformationInquiry. Represent them separately as
      NON_ACQUIRABLE_HUMAN_INPUTS_UNSET and state explicitly that marketplace collection cannot
      resolve them.
    - >
      Record P7.5 reuse status as SEMANTIC_LENS_ONLY_NO_PLAN_CONSTRUCTED with
      canonical_dispositions [CONTINUE, DEFER, STOP], factory_invoked false and
      disposition_status NOT_COMPUTED_NO_CANONICAL_CURRENT_P7_4_PROFILE. NOT_COMPUTED is a
      TASK-260 planning-status field, never a fourth P7.5 disposition.
    - >
      Deeper Wave-2 dimensions remain NOT_AUTOMATIC / DEFERRED_FROM_CURRENT_RECONCILIATION.
      This is not a P7.5 DEFER disposition. It means TASK-260 does not justify collecting them
      merely for completeness.
    - >
      Represent decision state exactly as MARKET_TEST_READINESS_NOT_ESTABLISHED.
      It is a planning knowledge-state description, not TEST_READY, NOT_READY, approval,
      rejection, recommendation or test authorization.
    - >
      Define exactly five candidate continuations, preserving this exact order only for
      deterministic serialization and not ranking:
      AUTHORIZE_ONE_SHOT_POST_TASK254_CARRIER_VALIDATION;
      RECONFIRM_MANUAL_WAVE1_CONTRIBUTION;
      REQUEST_HUMAN_DECISION_INPUTS;
      DEFER_CURRENT_PILOT;
      STOP_CURRENT_PILOT.
      Each has selection_status HUMAN_SELECTION_REQUIRED, preferred false,
      recommended false and automatic_progression false. No candidate is NEXT.
    - >
      Future one-shot validation, if separately selected later, would bind carrier execution
      source to exact TASK-254 publication
      36627c80e76f156fcb774b10fbd35d14df6d9ea4 and retain collector baseline TASK-253 /
      33776f11b20977f46d45d394fa1c56040029b65d. TASK-260 must not create
      validation_carrier_source_sha or an attempt.
    - >
