task_id: TASK-203
revision: 1

goal: >
  Perform one atomic Python Agent governance/bootstrap reset after explicit Human
  supersession and suspension intent: retire the current detailed ChatGPT Project
  Contract from active HOW authority, replace it with a minimal transitional
  suspension notice that preserves the Constitution-mandated Project Contract slot,
  and adopt the already-pinned AIOS-renew TASK-107 GitHub-Issue Brain authoring
  carrier so future Brain-to-repository authoring can use the same zero-touch
  transport as AIOS-renew without adding a second ingress, service layer, or state
  machine.

problem: >
  Python Agent already pins exact AIOS-renew commit
  f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e, which contains the reviewed
  post-TASK-105 canonical authoring ingress and TASK-107 GitHub-Issue delivery
  carrier. However, Python Agent's adoption registry explicitly leaves TASK-107 in
  a coarse NOT_EXPOSED repository-specific outer-automation family, while the
  current docs/CHATGPT_PROJECT_CONTRACT.md requires Brain authoring through the
  checked-in local aios_brain_ingress.py carrier. This downstream restriction
  conflicts with the zero-touch carrier already present in the exact pinned AIOS
  authority and creates recurring Human courier work. The Human Principal has now
  explicitly rejected that local-only operating rule, requested suspension of the
  current detailed Project Contract pending a fresh audit and Human review, and
  requested adoption of the existing pinned AIOS Issue ingress rather than another
  Python-Agent-specific transport layer.

assumptions:
  - >
    Canonical python_complete_agent main at TASK authoring is
    277ac830dff1fd6b0026aeb1ea42b101ae1d58aa.
  - >
    The sole active downstream AIOS-renew authority remains exact commit
    f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e from
    .agents/skills/aios-worker/requirements-aios-renew.txt.
  - >
    That exact pin contains aios_renew.github_issue_ingress and the existing
    canonical authoring ingress. TASK-107 defines GitHub Issue as replaceable
    transport only; semantic validation, canonical destinations, CAS, idempotency,
    Git mutation, review semantics, and publication semantics remain owned by the
    existing pinned AIOS implementation.
  - >
    Python Agent's existing .github/workflows/aios-auto-publish.yml already
    publishes from canonical review-decision branch pushes and therefore does not
    require the TASK-110-style explicit publication-dispatch addition merely to
    adopt TASK-107 Brain Issue ingress.
  - >
    The Python Agent Constitution requires a distinct Project Contract = HOW layer
    and makes the Constitution the highest enforceable governance. Therefore this
    TASK must not physically remove the Project Contract slot; it may suspend and
    supersede the current detailed content while preserving a minimal transitional
    HOW placeholder subordinate to Constitution and Product Contract.
  - >
    The Human Principal has explicit prospective suspension/supersession intent for
    the current detailed ChatGPT Project Contract and requires the eventual
    replacement contract to be audited and presented in full for Human approval
    before canonicalization.
  - >
    .ai/roadmap-state.yaml remains Brain-owned planning state and is intentionally
    not advanced by this transport/governance reset.

scope:
  inspect:
    - docs/PYTHON_AGENT_MANIFESTO.md
    - docs/PYTHON_AGENT_CONSTITUTION.md
    - docs/PYTHON_AGENT_PRODUCT_CONTRACT.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/roadmap-state.yaml
    - .ai/aios-adoption-state.yaml
    - .ai/tasks/TASK-196.yaml
    - .ai/tasks/TASK-199.yaml
    - .ai/tasks/TASK-201.yaml
    - .ai/tasks/TASK-202.yaml
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_brain_ingress.py
    - .github/workflows/aios-auto-publish.yml
    - tests/aios_bridge/test_aios_governance_state.py
    - tests/governance/test_chatgpt_project_contract.py
  modify:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/aios-adoption-state.yaml
    - .ai/brain-ingress-carriers.yaml
    - .github/workflows/aios-brain-ingress.yml
    - tests/aios_bridge/test_aios_governance_state.py
    - tests/aios_bridge/test_aios_brain_issue_ingress.py
    - tests/governance/test_chatgpt_project_contract.py

non_goals:
  - >
    Amend the Manifesto, Constitution, or Product Contract, or remove the
    Constitution-mandated Project Contract = HOW governance slot.
  - >
    Draft or canonicalize the replacement full Project Contract. A fresh audit and
    explicit Human approval of the complete proposed replacement are required
    before a later TASK may restore durable detailed HOW rules.
  - >
    Add a new Brain gateway, HTTP service, GitHub App backend, webhook server,
    broker, queue, database, scheduler, poller, daemon, browser automation service,
    remote-secret service, or second authoring/lifecycle state machine.
  - >
    Copy, fork, or reimplement AIOS authoring semantics inside Python Agent. The
    exact pinned AIOS-renew package remains the sole semantic ingress authority.
  - >
    Change TASK, REVIEW, REMEDIATION, REPAIR, Runtime, Unified State, Executor,
    deterministic verification, correction-frontier, semantic-review, or
    source-publication semantics.
  - >
    Adopt TASK-108, TASK-110, TASK-111, TASK-112, or TASK-113 repository-specific
    wakeup/remediation/repair/terminal-attention carriers. This TASK adopts only the
    TASK-107 Brain authoring Issue carrier needed to remove the manual courier gap.
  - >
    Remove .agents/skills/aios-worker/scripts/aios_brain_ingress.py. It remains an
    emergency/debug local carrier over the same pinned canonical ingress, but it is
    no longer the exclusive normal authoring transport.
  - >
    Reopen generic direct GitHub source/ref write as normal Brain authoring or let
    GitHub Issue content select arbitrary paths, refs, Git commands, shell commands,
    credentials, authority overrides, or publication destinations.
  - >
    Modify .ai/roadmap-state.yaml, close Governance Foundation, choose a P7
    collector/enrichment strategy, or change any Product Intelligence semantics.
  - >
    Push, publish, merge, or mutate canonical main from Executor implementation.

constraints:
  hard:
    - >
      Preserve Constitution supremacy, Product Contract WHAT authority,
      CAPABILITY_IS_NOT_AUTHORITY, ONE_CAPABILITY_ONE_AUTHORITY, and the separation
      among Human mandate, canonical mutation, semantic review, execution, and
      publication.
    - >
      Preserve exact AIOS-renew pin
      f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e as the sole downstream
      Runtime/ingress implementation authority. Mutable upstream AIOS-renew main
      must not be installed, inferred, or substituted.
    - >
      Replace docs/CHATGPT_PROJECT_CONTRACT.md with a minimal transitional
      suspension notice, not another detailed operating contract. It must state:
      the current detailed Project Contract is superseded and suspended by explicit
      Human Principal intent; Constitution and Product Contract remain authoritative;
      the Project Contract HOW slot remains intentionally present but contains no
      durable detailed operating rules pending audit; exact pinned AIOS mechanics
      remain available only through separately adopted repository surfaces; and a
      future full replacement requires presentation of the complete proposed text
      to the Human Principal and explicit approval before canonicalization.
    - >
      The suspension notice must not reproduce the retired 12-section operating
      contract, preserve the local-only Brain ingress mandate, invent a new
      precedence system, redefine product semantics, or silently grant new review,
      execution, mutation, roadmap, or publication authority.
    - >
      Add .ai/brain-ingress-carriers.yaml using
      AIOS_BRAIN_INGRESS_CARRIERS_POLICY version 1 with github_issue.enabled true,
      repository trung-via/python_complete_agent, authorized_actors containing
      exactly trung-via, title_marker [AIOS BRAIN INGRESS], and max_body_bytes
      131072.
    - >
      Add .github/workflows/aios-brain-ingress.yml as a downstream TASK-107 carrier
      adaptation. It must trigger only on issues opened, gate delivery on the exact
      [AIOS BRAIN INGRESS] title marker, serialize repository deliveries with
      cancel-in-progress false, check out main with fetch-depth 0, set up Python
      3.11+, install only
      .agents/skills/aios-worker/requirements-aios-renew.txt, and invoke
      python -m aios_renew.github_issue_ingress with GITHUB_EVENT_PATH, the
      repository policy, and repo root.
    - >
      The Issue workflow must require only contents: write and issues: write for
      TASK-107 transport/receipt behavior. It must not add actions: write,
      pull-requests: write, id-token, packages, deployments, secrets access, or a
      second publication-dispatch path. Existing aios-auto-publish review-decision
      push behavior remains unchanged.
    - >
      The Issue body is opaque ingress-envelope data. Workflow shell must never
      interpolate, evaluate, template, normalize, rewrite, summarize, or execute
      Issue body content. Event-file admission and semantic ingress remain inside
      the pinned aios_renew.github_issue_ingress implementation.
    - >
      The workflow may post the bounded pinned-carrier receipt to the originating
      Issue and close the Issue only after successful delivery. Receipt text, Issue
      state, workflow state, title, labels, or comments never become canonical TASK,
      review, execution, roadmap, or publication authority.
    - >
      Keep the existing local aios_brain_ingress.py carrier and
      .github/workflows/aios-auto-publish.yml unchanged.
    - >
      Split current coarse repository-specific outer-automation adoption state so
      TASK-107 is explicitly ADOPTED_BY_PIN and exposed only through the checked-in
      Brain Issue policy/workflow, while TASK-108/TASK-110/TASK-111/TASK-112 remain
      EXPLICITLY_NOT_APPLICABLE_OR_OPTIONAL and NOT_EXPOSED. TASK-113 terminal
      attention package compatibility remains unchanged and its Issue carrier
      remains not exposed.
    - >
      RECOVERED_BRAIN_AUTHORING_INGRESS for TASK-104/TASK-105 remains
      ADOPTED_BY_PIN with POST_TASK_105_RECOVERY semantics. TASK-107 transport must
      delegate to that same canonical semantic ingress and must not become a second
      authoring authority.
    - >
      Keep every unrelated adoption classification, exact pin, incident lineage,
      future migration policy, product source, roadmap state, worker surfaces, and
      immutable historical artifacts unchanged.
    - >
      Replace the old Project Contract structural regression with a transitional
      suspension regression that proves the file remains the Constitution-mandated
      HOW slot, is explicitly SUSPENDED/SUPERSEDED pending Human-reviewed rewrite,
      retains Constitution/Product Contract subordination, contains the full-draft
      Human approval gate, and no longer asserts the local carrier as exclusive.
    - >
      Add focused Issue-carrier regression proving exact repository policy,
      authorized actor, marker, body bound, event family, permissions, serialized
      concurrency, full-history main checkout, exact-pin installation, one pinned
      github_issue_ingress invocation, opaque event-file transport, bounded receipt
      behavior, and absence of direct create-file/create-branch/force-push or
      alternate publication dispatch.
    - >
      Update adoption/governance regression only as needed to prove TASK-107-only
      carrier exposure and continued non-exposure of TASK-108/TASK-110/TASK-111/
      TASK-112, without treating planning state as engineering truth.
    - >
      Verification must be deterministic, offline, non-interactive, and independent
      of GitHub/network, marketplace/browser/CDP, provider/LLM, Drive, environment
      secrets, wall-clock, random/UUID, or mutable external state.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      The previous detailed ChatGPT Project Contract is no longer active HOW
      authority. The canonical file is a minimal explicit suspension/supersession
      notice preserving the Constitution-mandated Project Contract slot and requiring
      full-text Human approval before any later durable replacement is canonicalized.
  - id: AC2
    condition: >
      Python Agent contains repository-specific TASK-107 policy and Issue workflow
      that use the exact pinned AIOS github_issue_ingress carrier; no new semantic
      ingress, service, gateway, daemon, or state machine is introduced.
  - id: AC3
    condition: >
      An authorized newly opened [AIOS BRAIN INGRESS] Issue is framed as opaque
      transport to the existing pinned canonical ingress, while unauthorized or
      malformed carrier events remain fail-closed inside the pinned implementation
      and Issue content cannot gain path/ref/shell/authority semantics.
  - id: AC4
    condition: >
      Adoption state explicitly exposes TASK-107 by exact pin while preserving
      TASK-104/TASK-105 canonical semantic ingress and keeping TASK-108/TASK-110/
      TASK-111/TASK-112 and TASK-113 Issue/wakeup carriers unexposed.
  - id: AC5
    condition: >
      Existing local emergency/debug ingress carrier, worker surfaces,
      review-decision auto-publication workflow, exact AIOS pin, roadmap state,
      Product Intelligence semantics, immutable lineage, and all unrelated adoption
      classifications remain unchanged.
  - id: AC6
    condition: >
      Focused deterministic regressions prove the suspended-contract state,
      Human-approval gate, TASK-107-only carrier adoption, workflow/policy safety,
      and exact-pin isolation; required verification passes with zero unresolved
      items.

verification:
  required:
    - 'python -m pytest tests/governance/test_chatgpt_project_contract.py tests/aios_bridge/test_aios_brain_issue_ingress.py tests/aios_bridge/test_aios_governance_state.py -q'
