task_id: TASK-203
revision: 2

goal: >
  Reset Python Agent governance/adoption planning after explicit Human supersession
  of TASK-203 revision 1 and the current detailed ChatGPT Project Contract. Retire
  the current detailed Project Contract from active HOW authority while preserving
  the Constitution-mandated Project Contract slot as a minimal transitional notice;
  rebuild AIOS downstream adoption state so package capability availability is not
  conflated with repository-binding activation; correct the audited A1/A2/A3/A6,
  TASK-069 through TASK-072, and TASK-107 through TASK-113 classifications; and
  canonicalize the Human-approved roadmap toward full AIOS downstream control-plane
  adoption before a new Project Contract is written.

problem: >
  Python Agent currently pins the reviewed AIOS-renew source
  f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e, but its Brain-readable adoption
  registry uses coarse EXPLICITLY_NOT_APPLICABLE_OR_OPTIONAL / NOT_EXPOSED
  classifications that conflate package/runtime behavior with repository-specific
  bindings. The audit found that TASK-069 and TASK-071 are Runtime/Operator
  hardening and TASK-070 and TASK-072 are publication-control hardening already
  present in the exact pin, while A1/A2/A3/A6 and TASK-107/TASK-108/TASK-110/
  TASK-111/TASK-112/TASK-113 require repository bindings rather than semantic
  withholding. The current detailed Project Contract also preserves the old
  local-only Brain-authoring and downstream-withholding assumptions. TASK-203
  revision 1 attempted to suspend that contract while adopting TASK-107 alone, but
  its RUN-203-001 candidate remains unreviewed/unpublished and its TASK-107-only
  boundary no longer matches explicit Human intent. A clean governance/adoption
  reset is required before any carrier/workflow adoption is implemented.

assumptions:
  - >
    Canonical python_complete_agent main at revision-2 authoring is
    433939ce40e4c82e47b8ed4dc0493a3a8c60bc60 and contains canonical
    TASK-203 revision 1 but not its implementation candidate.
  - >
    RUN-203-001 is immutable revision-1 execution evidence with Runtime RESULT,
    candidate 18a9a350be82d752e0b5d000b8e7566141498efd, required verification
    passing, and unresolved empty; no canonical
    refs/heads/aios/review-decision/RUN-203-001 exists, so that candidate has no
    semantic review decision and no publication authority.
  - >
    The sole active downstream AIOS-renew dependency remains exact reviewed,
    source-published commit
    f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e under
    EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY. Mutable upstream main is not downstream
    Runtime authority.
  - >
    The Python Agent Constitution requires a distinct Project Contract = HOW slot,
    makes the Constitution the highest enforceable governance, and gives the Human
    Principal prospective suspension/supersession authority without rewriting
    historical engineering facts.
  - >
    The Product Contract remains the sole durable product WHAT authority. This
    governance/adoption reset changes no Product Intelligence or Commerce
    Intelligence semantics.
  - >
    Fresh audit established that upstream A1/A2/A3/A6 semantics are realized by
    TASK-066, TASK-068 plus TASK-073, TASK-074, and TASK-082 plus TASK-084;
    TASK-069/TASK-071 are package Runtime/Operator hardening; TASK-070/TASK-072 are
    package publication-control hardening; and TASK-107/TASK-108/TASK-110/TASK-111/
    TASK-112/TASK-113 provide post-TASK-105 outer control-plane carriers or
    compatibility whose repository activation requires explicit binding rather than
    a claim that the capability is inapplicable downstream.
  - >
    Current Python Agent main contains no published TASK-107/108/110/111/112/113
    downstream carrier workflow. This revision is governance/adoption planning only
    and must not claim such bindings are already active.
  - >
    Human intent has explicitly approved the following sequence: governance/adoption
    reset; upstream AIOS downstream-adoption policy reconciliation; Python Agent
    authoring/PRIMARY/terminal-attention adoption; review/publication/remediation/
    repair adoption; full downstream conformance proof; a new Project Contract
    drafted from zero and shown in full for Human approval; Governance Foundation
    closure; then return to the P7 product roadmap.
  - >
    .ai/roadmap-state.yaml and .ai/aios-adoption-state.yaml are Brain-owned planning
    and adoption state with engineering_truth false. They may record the approved
    prospective priority but do not prove execution, review, publication, or binding
    completion.

scope:
  inspect:
    - docs/PYTHON_AGENT_MANIFESTO.md
    - docs/PYTHON_AGENT_CONSTITUTION.md
    - docs/PYTHON_AGENT_PRODUCT_CONTRACT.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/roadmap-state.yaml
    - .ai/aios-adoption-state.yaml
    - .ai/tasks/TASK-201.yaml
    - .ai/tasks/TASK-202.yaml
    - .ai/tasks/TASK-203.yaml
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_brain_ingress.py
    - .github/workflows/aios-auto-publish.yml
    - tests/governance/test_python_agent_manifesto.py
    - tests/governance/test_python_agent_constitution.py
    - tests/governance/test_python_agent_product_contract.py
    - tests/governance/test_chatgpt_project_contract.py
    - tests/aios_bridge/test_aios_governance_state.py

  modify:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/aios-adoption-state.yaml
    - .ai/roadmap-state.yaml
    - tests/governance/test_chatgpt_project_contract.py
    - tests/aios_bridge/test_aios_governance_state.py

non_goals:
  - >
    Amend, reinterpret, or replace docs/PYTHON_AGENT_MANIFESTO.md,
    docs/PYTHON_AGENT_CONSTITUTION.md, or docs/PYTHON_AGENT_PRODUCT_CONTRACT.md.
  - >
    Draft or canonicalize the replacement durable Project Contract. This revision
    creates only the minimal transitional HOW-slot notice; the full replacement is
    deferred until full AIOS downstream control-plane conformance and requires
    presentation of the complete proposed text to the Human Principal plus explicit
    Human approval before canonicalization.
  - >
    Add, copy, activate, or modify any GitHub Issue carrier, self-hosted wakeup,
    remote approval/status, remediation wakeup, repair wakeup, terminal-attention,
    publication-continuation workflow, carrier policy, runner binding, or other
    repository automation. Those are later explicit adoption tasks.
  - >
    Modify the exact AIOS dependency pin, worker/Brain-ingress code, worker skills,
    Runtime, Operator, Executor adapters, canonical verification, source publisher,
    existing .github/workflows/aios-auto-publish.yml, or upstream AIOS-renew source.
  - >
    Reuse, review, remediate, repair, publish, merge, cherry-pick, or otherwise
    promote candidate 18a9a350be82d752e0b5d000b8e7566141498efd from RUN-203-001.
    The revision-1 lineage remains immutable evidence only.
  - >
    Rewrite or delete historical TASK/RUN/RESULT/FAILURE/REVIEW/REMEDIATION/REPAIR
    artifacts, including TASK-201, TASK-202, TASK-203 revision 1, RUN-203-001, or
    RUN-197 incident lineage.
  - >
    Change Product Intelligence source, evidence/product-truth semantics,
    scoring/ranking, approval, persistence, retrieval/RAG, marketplace/browser,
    provider/model behavior, Media Intelligence, Distribution Intelligence,
    Commerce Operations, or select a P7 collector/enrichment implementation.
  - >
    Implement A4, A5, A7, A9, A10, planner/router/reviewer autonomy, retry/fallback,
    scheduler, queue, broker, daemon, second lifecycle reducer, or any new
    canonical authority.
  - >
    Push, publish, merge, or mutate canonical main from Executor implementation.

constraints:
  hard:
    - >
      Only the five files in scope.modify may change. Any need to alter a worker,
      workflow, AIOS pin, product source, higher governance document, or historical
      artifact fails closed for fresh Brain review.
    - >
      Replace docs/CHATGPT_PROJECT_CONTRACT.md with a minimal transitional notice
      that preserves the Constitution-mandated Project Contract = HOW slot but
      declares the prior detailed Project Contract prospectively SUPERSEDED and
      SUSPENDED by explicit Human Principal intent. The notice must state that the
      Constitution remains the highest enforceable governance, the Product Contract
      remains the authoritative WHAT layer, and no durable detailed HOW rules are
      active in this slot pending the later rebuild.
    - >
      The transitional Project Contract must not reproduce the retired detailed
      operating contract, historical AIOS pin/TASK/RUN migration narrative,
      local-only Brain-ingress mandate, worker command catalogue, recovery taxonomy,
      roadmap sequence, carrier withholding policy, or a new permission/precedence
      system. It must grant no new semantic review, execution, canonical mutation,
      roadmap, domain, or publication authority.
    - >
      The transitional notice must require that a future durable Project Contract
      be drafted only after the full downstream AIOS control-plane conformance gate,
      be presented to the Human Principal in complete text, and receive explicit
      Human approval before canonicalization.
    - >
      Rebuild .ai/aios-adoption-state.yaml so package capability availability and
      repository-binding activation are represented as distinct dimensions rather
      than one coarse classification. The state must continue to declare
      engineering_truth false, preserve the exact f0237a3b98985ce6ebbaf41af1e06fa3eb4e998e
      pin and immutable incident provenance, and must not claim a repository binding
      is ACTIVE when the corresponding downstream workflow/policy does not exist on
      canonical main.
    - >
      The rebuilt adoption state must classify TASK-069 and TASK-071 as package
      Runtime/Operator hardening consumed from the exact pin with no pending
      repository binding, and TASK-070 and TASK-072 as package publication-control
      hardening consumed from the exact pin with no pending repository binding.
      They must not remain in an optional/not-exposed outer-automation bucket.
    - >
      The rebuilt adoption state must represent A1/A2/A3/A6
      (TASK-066, TASK-068, TASK-073, TASK-074, TASK-084) as capabilities available
      through the exact pin whose repository-specific bindings are REQUIRED_PENDING,
      not as inapplicable or semantically unavailable.
    - >
      The rebuilt adoption state must preserve TASK-104/TASK-105 post-TASK-105
      canonical ingress semantics as ADOPTED_BY_PIN and recognize the existing
      checked-in local aios_brain_ingress.py carrier as the current active
      emergency/debug repository binding. It must represent TASK-107, TASK-108,
      TASK-110, TASK-111, TASK-112, and the TASK-113 terminal-attention carrier as
      capabilities available through the exact pin with repository binding
      REQUIRED_PENDING. TASK-113 package compatibility itself remains adopted by
      the pin.
    - >
      Remove the current policy meaning that standard audited AIOS control-plane
      capabilities are EXPLICITLY_NOT_APPLICABLE_OR_OPTIONAL merely because they
      need repository-specific configuration. No current adoption entry for the
      audited A1/A2/A3/A6 or TASK-107 through TASK-113 graph may use NOT_EXPOSED to
      mean downstream inapplicability. Pending binding is not implementation
      completion and must remain explicit.
    - >
      Preserve exact-pin isolation: mutable AIOS-renew main never becomes downstream
      runtime authority from this reset, and a future pin change still requires a
      separate explicit reviewed downstream migration.
    - >
      Reconcile .ai/roadmap-state.yaml to the explicit current Human priority. The
      prior CHATGPT_PROJECT_CONTRACT_RECONCILIATION commitment must be recorded as
      SUPERSEDED rather than DONE, and the prior detailed Project Contract must not
      be represented as the final Governance Foundation completion.
    - >
      The roadmap must establish exactly one ACTIVE track named
      AIOS_FULL_DOWNSTREAM_ADOPTION_AND_GOVERNANCE_REBUILD and exactly one NEXT
      milestone named AIOS_DOWNSTREAM_ADOPTION_POLICY_RECONCILIATION. It must
      preserve the TASK-191 P7.1 product checkpoint and the already-completed
      Manifesto, Constitution, and Product Contract provenance.
    - >
      The roadmap must preserve the approved later ordering after the unique NEXT:
      FULL_AIOS_CONTROL_PLANE_ADOPTION_PHASE_1,
      FULL_AIOS_CONTROL_PLANE_ADOPTION_PHASE_2,
      FULL_AIOS_DOWNSTREAM_CONFORMANCE,
      PROJECT_CONTRACT_REBUILD,
      GOVERNANCE_FOUNDATION_CLOSURE_AND_P7_RETURN.
      These later items are pending/waiting planning commitments only and must not
      be marked DONE or engineering truth.
    - >
      Structural governance regressions must be rewritten only as needed to prove
      the transitional HOW-slot suspension/full-text Human approval gate, the new
      package-versus-binding adoption semantics, the corrected audited task
      classifications, the unique new roadmap track/NEXT ordering, preserved exact
      pin and incident provenance, and preserved higher Governance Foundation
      documents. Tests must not become a policy engine or duplicate substantial
      contract prose.
    - >
      Verification must be deterministic, offline, non-interactive, and independent
      of GitHub/network, marketplace/browser/CDP, provider/LLM, Drive, environment
      secrets, wall-clock, random/UUID, or mutable external state.
    - >
      Do not weaken, skip, xfail, or bypass existing relevant governance/adoption
      regression intent merely to make the reset pass.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      The canonical Project Contract file is a minimal transitional HOW-slot notice:
      the detailed TASK-202-era contract is prospectively SUPERSEDED/SUSPENDED,
      Constitution and Product Contract authority remain intact, no detailed HOW
      policy is recreated, and full-text Human approval after downstream
      control-plane conformance is required before a durable replacement.
  - id: AC2
    condition: >
      AIOS adoption state separates package capability availability from
      repository-binding activation, preserves the exact f023 pin and incident
      provenance, and no audited capability is mislabeled as absent merely because
      a repo-local binding is still pending.
  - id: AC3
    condition: >
      TASK-069/TASK-071 are represented as adopted package Runtime/Operator
      hardening and TASK-070/TASK-072 as adopted package publication-control
      hardening, while A1/A2/A3/A6 and TASK-107/TASK-108/TASK-110/TASK-111/
      TASK-112/TASK-113 carrier activation remain explicit REQUIRED_PENDING
      repository bindings rather than NOT_EXPOSED/inapplicable capability.
  - id: AC4
    condition: >
      Existing TASK-104/TASK-105 canonical ingress and local debug/emergency carrier
      remain usable, exact AIOS pin isolation remains unchanged, and no workflow,
      runner, carrier policy, publisher, worker, Runtime, Executor, or product source
      is modified or falsely declared newly active.
  - id: AC5
    condition: >
      Roadmap planning state records CHATGPT_PROJECT_CONTRACT_RECONCILIATION as
      SUPERSEDED, establishes AIOS_FULL_DOWNSTREAM_ADOPTION_AND_GOVERNANCE_REBUILD
      as the sole ACTIVE track, establishes
      AIOS_DOWNSTREAM_ADOPTION_POLICY_RECONCILIATION as the sole NEXT item, preserves
      the approved later sequence through Project Contract rebuild and P7 return,
      and preserves TASK-191 plus existing Governance Foundation completion
      provenance without claiming current implementation completion.
  - id: AC6
    condition: >
      RUN-203-001 and candidate 18a9a350be82d752e0b5d000b8e7566141498efd
      remain immutable unreviewed/unpublished revision-1 evidence and gain no
      review, publication, integration, or implementation authority from this
      revision.
  - id: AC7
    condition: >
      Focused deterministic governance/adoption regressions pass, all implementation
      changes remain inside the five authorized files, higher governance and product
      semantics remain unchanged, and RESULT contains zero unresolved items.

