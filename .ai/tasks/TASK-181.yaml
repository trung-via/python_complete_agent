task_id: TASK-181
revision: 1

goal: >
  Begin a separately justified post-P6 Product Intelligence / Commerce value extension by
  adding one pure deterministic evaluation authority over the existing M2 Winning Product
  scoring outputs. Measure how much of the already-defined WinningProductScorer V1 evidence
  space is actually populated for a bounded cohort of existing ProductCandidateSnapshot
  values, without changing discovery, normalization, scoring, ranking, approval, identity,
  persistence, retrieval, product truth, or Human authority. Freeze this evaluator first so
  a later real-marketplace baseline can decide which missing evidence class, if any, is worth
  implementing rather than opening collectors or infrastructure from assumption.

problem: >
  P6.0, P6.1, and P6.3 are closed; P6.2 is parked because current retrieval evidence does
  not justify semantic/vector work; and P6.4-P6.6 remain deferred pending value evidence.
  The strongest current product-value gap is instead inside the already-published M2 Winning
  Product Intelligence objective: the V1 scorer defines Demand, Momentum, Commercial
  Attractiveness, Trust, Contentability, and Competition Opportunity, while current live
  search-card adapters necessarily leave affiliate commission, creator/competition fields,
  and all velocity fields unknown, and CandidateRanker invokes WinningProductScorer without
  semantic contentability signals. The scorer correctly preserves those absences through
  category coverage and confidence, but the repository has no canonical evaluator that
  quantifies the resulting coverage gap across a candidate cohort. Jumping directly to
  longitudinal collection, commission acquisition, semantic contentability, P6.4 identity
  migration, P6.5 review automation, or P6.6 serving would therefore be implementation before
  measurement. TASK-181 adds measurement only.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-181 authoring is
    e3d1a3611f238c82d5f3141568a3812000b55866. TASK-180 is a control-plane
    certification/runbook task only; REVIEW-180-001 is PRIMARY PASS and it does not alter
    Product Intelligence architecture or reopen Phase 6 product semantics.
  - >
    The authoritative downstream AIOS dependency is exactly
    `aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@883974be6ec5922ae57021b50a48c84a0014dbfa`.
    Current or future AIOS-renew main is not Python Agent runtime authority.
  - >
    P6.0, P6.1, and P6.3 are CLOSED. P6.2 remains PARKED / reopenable only from new
    evidence. P6.4 identity evolution, P6.5 higher-level Human-review assistance, and P6.6
    caches/background serving remain DEFERRED / UNIMPLEMENTED; this task does not open them.
  - >
    ProductCandidateSnapshot remains the canonical M2 marketplace observation value.
    SnapshotNormalizer remains the sole snapshot-to-normalized-signal authority.
    WinningProductScorer remains the sole V1 business-scoring authority, ScoringPolicy owns
    score weights/thresholds, and CandidateRanker remains the sole candidate ranking authority.
  - >
    Current WinningProductScorer V1 already exposes category coverage, normalized signals,
    confidence breakdown, decision band, evidence references, and reason codes. TASK-181 can
    evaluate those public outputs and must not reproduce normalization or scoring formulas.
  - >
    Current Shopee and TikTok search discovery adapters preserve unavailable
    `affiliate_commission_rate`, `estimated_commission_value`, `creator_count`, `video_count`,
    `similar_listing_count`, `sales_velocity`, `review_velocity`, `creator_velocity`, and
    `video_velocity` as None rather than fabricating them. Current CandidateRanker calls
    WinningProductScorer.score_snapshot without semantic_signals. These repository facts
    justify measuring coverage; they do not justify inventing or collecting the missing data.
  - >
    TASK-164 is retrieval-quality evaluation authority only. Its CERTIFY -> EVALUATE ->
    IMPROVE discipline is an architectural precedent, not authority over M2 business scoring.
    No current module owns cohort-level Winning Product score/evidence coverage evaluation.

