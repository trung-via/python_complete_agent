non_goals:
  - Modify ProductCandidateSnapshot, NormalizedSignal, WinningProductScore,
    SnapshotNormalizer, WinningProductScorer, ScoringPolicy, CandidateRanker,
    DiscoveryOrchestrator, DiscoveryRequest, DiscoveryBatch, Shopee/TikTok adapters, parsing,
    browser/CDP behavior, or Human-facing discovery behavior.
  - Change any V1 category, category weight, signal weight, confidence formula, freshness
    formula, decision-band threshold, tie-break, shortlist behavior, missing-data semantics,
    source reliability, evidence semantics, or ranking order.
  - Add or derive sales/review/creator/video velocity, observation history, trend windows,
    affiliate commission, creator counts, video counts, similar-listing counts, competition
    estimates, price history, external trend data, or any other new marketplace fact.
  - Add LLM/provider calls, semantic contentability generation, hook-angle generation,
    semantic scoring, model selection, prompt construction, embeddings, vector retrieval, or
    any inferred market fact.
  - Add network/browser/Drive/filesystem/SQLite access, scheduler/background jobs, caches,
    telemetry, dashboard, HTTP service, database table, mutable global state, or persistence of
    evaluation results.
  - Rank, approve, reject, enqueue, ingest, admit, merge, split, reconcile, or mutate any
    candidate, evidence object, family, variant, catalog, profile, or product-truth state.
  - Define a pass/fail threshold for business quality, declare any product a winner, choose an
    improvement automatically, or claim that one missing category is more valuable than another.
  - Open P6.2, P6.4, P6.5, or P6.6, or claim their implementation is now justified.
  - Acquire live marketplace evidence in Runtime verification. A separate successor owns the
    real-evidence coverage baseline after this evaluator is reviewed and published.
  - Modify AIOS worker/runtime/pin, publication workflow, TASK-180 control-plane lineage, or
    historical TASK artifacts.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Add exactly one Product Intelligence implementation module,
      `src/product_intelligence/winning_product_quality_evaluation.py`. Expose exactly these
      new public names from that module and `src/product_intelligence/__init__.py`:
      `WinningProductQualityEvaluationError`, `CandidateWinningProductCoverage`,
      `WinningProductCoverageReport`, and `evaluate_winning_product_coverage`. Import
      dependencies through private aliases so the implementation module leaks no other
      non-underscore public names.
    - >
      `CandidateWinningProductCoverage` must be a frozen value with exactly six fields:
      `candidate`, `score`, `zero_coverage_categories`, `partial_coverage_categories`,
      `full_coverage_categories`, and `missing_factual_signal_names`. `candidate` is the exact
      supplied ProductCandidateSnapshot object and `score` is the exact WinningProductScore
      object returned by the existing WinningProductScorer for that candidate. Category tuples
      contain exact ScoreCategory members in canonical V1 category order. A category is zero
      coverage only when the scorer's existing CategoryScore.coverage is exactly 0.0, full
      coverage only when it is exactly 1.0, and otherwise partial. TASK-181 introduces no
      category threshold or reinterpretation of coverage.
    - >
      `missing_factual_signal_names` must be derived only from the exact normalized signals
      already retained inside the returned WinningProductScore category scores whose provenance
      is exactly SignalProvenance.MISSING. Preserve canonical category order and each category's
      existing signal order. Do not maintain a second expected-signal registry, inspect raw
      snapshot fields to infer absence, or invent missing semantic signal names when the scorer
      emitted no such signal. A zero-coverage CONTENTABILITY category may be observed as a
      category fact, but TASK-181 must not fabricate individual semantic-signal absence.
    - >
      `WinningProductCoverageReport` must be a frozen value with exactly six fields:
      `evaluated_at`, `candidate_evaluations`, `zero_coverage_counts_by_category`,
      `partial_coverage_counts_by_category`, `full_coverage_counts_by_category`, and
      `decision_band_counts`. `candidate_evaluations` preserves caller candidate order.
      Aggregate count fields must be immutable tuples of two-tuples, not mutable dicts:
      category counts use every ScoreCategory exactly once in canonical V1 order and decision
      counts use every DecisionBand exactly once in enum declaration order, including zero
      counts. TASK-181 adds no averages, threshold, weighted score, recommendation, or roadmap
      verdict.
    - >
      `evaluate_winning_product_coverage(candidates, *, evaluated_at, policy=None)` must
      materialize the supplied candidate iterable exactly once. Require a non-empty bounded
      cohort of at most 100 exact ProductCandidateSnapshot values; bools, duck-typed mappings,
      or other values are invalid. Duplicate exact `candidate_id` values fail closed with
      WinningProductQualityEvaluationError before any scoring call. Preserve caller order.
    - >
      `evaluated_at` must be explicitly supplied and must be a datetime value accepted by the
      existing scorer; TASK-181 may not default to wall-clock time, read the clock, coerce a
      string, rewrite timezone semantics, or create a second freshness policy. `policy` may be
      None or an exact ScoringPolicy instance and must be passed unchanged to the scorer; TASK-181
      owns no policy defaults or validation beyond type/boundary validation needed to fail closed.
    - >
      After all task-owned input validation succeeds, call existing
      WinningProductScorer.score_snapshot exactly once per candidate, in caller order, with the
      exact candidate, exact evaluated_at, and exact policy value. Do not call SnapshotNormalizer,
      CandidateRanker, rank_candidates, DiscoveryOrchestrator, adapters, private scorer helpers,
      or reproduce any scoring/normalization formula. Existing scorer exceptions must propagate
      unchanged rather than be converted into evaluation judgments.
    - >
      TASK-181 may inspect only public WinningProductScore / CategoryScore / NormalizedSignal
      values returned by the scorer to build coverage observations. It must not recompute base,
      confidence, final score, decision band, freshness, reliability, evidence coverage, category
      weights, or signal scores, and it must never treat DecisionBand as Human approval or product
      truth.
    - >
      Evaluation must be pure deterministic in-memory computation over caller-supplied values and
      exact existing scorer delegation. It performs zero network, browser/CDP, provider/LLM,
      filesystem, SQLite, Drive, environment, clock, random, UUID, subprocess, queue, cache,
      admission, retrieval, product-truth, or persistence work.
    - >
      Add `docs/PHASE_7_P7_0_WINNING_PRODUCT_EVIDENCE_QUALITY.md` to record the completed
      architecture/value audit and introduce P7 as `Commerce Opportunity Intelligence`, with
      P7.0 limited to Winning Product evidence-coverage evaluation. The document must explain
      why P6.2 stays parked and P6.4-P6.6 stay deferred: no current evidence establishes a
      retrieval, identity-migration, review-automation, or serving bottleneck that outranks the
      measurable undercoverage of the product's existing Winning Product evidence model.
    - >
      The P7.0 document must separate measurement from improvement. It may record current static
      repository facts that search-card discovery leaves several V1 input fields unavailable and
      that CandidateRanker supplies no semantic signals, but it must not claim any live cohort
      coverage percentage before a successor executes the frozen evaluator on reviewed real
      marketplace observations. It must define the immediate successor as a real-evidence
      coverage baseline and leave longitudinal momentum, commercial/affiliate evidence,
      competition evidence, and semantic contentability enrichment conditional on that baseline.
    - >
      Update both canonical roadmaps consistently: P6.0/P6.1/P6.3 remain CLOSED, P6.2 remains
      PARKED, P6.4-P6.6 remain DEFERRED / UNIMPLEMENTED, and the fresh architecture/value audit
      selects the separately justified P7 Commerce Opportunity Intelligence branch rather than
      automatically opening P6.4. Record TASK-181 as the P7.0 evaluation-contract gate and a
      later real-evidence baseline as NEXT; do not mark P7.0 CLOSED until canonical Runtime PASS
      plus ChatGPT semantic review PASS on the same source candidate.
    - >
      Focused tests must prove exact public API and frozen field shape; one-shot iterable
      materialization; empty/oversized/non-snapshot/duplicate rejection before scoring; explicit
      evaluated_at; exact policy pass-through; exactly one scorer call per candidate in caller
      order; exact candidate and score object preservation; zero/partial/full category
      classification from scorer-owned coverage only; missing factual names from emitted MISSING
      signals only; no fabricated semantic missing names; canonical immutable aggregate ordering;
      decision-band counts including zeros; repeated determinism; propagation of scorer failures;
      and absence of forbidden ranker/normalizer/discovery/model/I/O side effects.
    - >
      Existing scoring, ranking, orchestration, Shopee discovery, and TikTok discovery regression
      suites must remain green. Runtime verification must use no live marketplace, CDP endpoint,
      provider, Drive, or external service.
    - >
      Do not modify `models.py`, `normalizer.py`, `scoring.py`, `policy.py`, `ranking.py`,
      `orchestration.py`, either marketplace adapter, Product Intelligence CLI, canonical catalog,
      retrieval/RAG/truth modules, AIOS integration, or publication workflow. All modified text
      files must remain UTF-8 without BOM and LF line endings where repository format requires.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      TASK-181 adds exactly the bounded M2 coverage evaluation error, per-candidate immutable
      coverage value, aggregate immutable report, and one evaluator function, with no new
      discovery, scoring, ranking, approval, persistence, retrieval, truth, or collection API.
  - id: AC2
    condition: >
      Evaluation validates and materializes one bounded ProductCandidateSnapshot cohort once,
      rejects duplicate identities before scoring, preserves caller order, requires explicit
      evaluated_at, and passes the exact optional ScoringPolicy through unchanged.
  - id: AC3
    condition: >
      Every accepted candidate is scored exactly once through existing
      WinningProductScorer.score_snapshot; the evaluator preserves the exact candidate and exact
      returned score objects and neither calls nor reimplements SnapshotNormalizer, CandidateRanker,
      discovery/orchestration, scoring formulas, confidence formulas, or decision policy.
  - id: AC4
    condition: >
      Per-candidate results classify category coverage solely from existing CategoryScore.coverage
      values and identify missing factual signals solely from scorer-emitted MISSING signals,
      preserving canonical order and never inventing absent semantic signals or inspecting raw
      candidate fields as a second missing-data authority.
  - id: AC5
    condition: >
      Aggregate report counts zero/partial/full coverage for every V1 ScoreCategory and counts
      every existing DecisionBand in deterministic immutable order, including zero counts, while
      introducing no threshold, average, ranking, recommendation, product-winner label, or
      automatic roadmap decision.
  - id: AC6
    condition: >
      Evaluation is pure deterministic in-memory computation with zero network/browser/provider/
      LLM/filesystem/SQLite/Drive/environment/clock/random/subprocess/queue/cache/admission/
      retrieval/truth side effects, and existing scorer exceptions propagate unchanged.
  - id: AC7
    condition: >
      New P7.0 documentation records the fresh architecture/value audit, keeps P6.2 parked and
      P6.4-P6.6 deferred, identifies current M2 evidence undercoverage without claiming a live
      coverage result, and makes a separate real-evidence coverage baseline the next gate before
      any signal-enrichment implementation.
  - id: AC8
    condition: >
      Both canonical roadmaps consistently select the separately justified P7 Commerce Opportunity
      Intelligence evaluation branch, preserve all prior authority/closure states, and do not
      claim TASK-181/P7.0 closed before Runtime and semantic review evidence exists.
  - id: AC9
    condition: >
      Focused evaluator tests plus existing scoring/ranking/orchestration/Shopee/TikTok discovery
      regressions pass offline, git diff --check passes, RESULT has no unresolved items, and Runtime
      changed-files truth contains only the six explicitly authorized files.

