task_id: TASK-223
revision: 1

goal: >
  Execute P7.5 Value-of-Information Planning in the existing Commerce Opportunity
  Intelligence domain. Establish one bounded immutable planning authority that composes
  the published P7.3 DecisionContext/OpportunityHypothesis and published P7.4
  TikTokAffiliateEvidenceProfile, makes the decision relevance and trade-offs of possible
  additional evidence inspectable, and supports explicit CONTINUE, DEFER, or STOP planning
  dispositions without creating a universal VOI score, acquisition authority, collector
  routing, test authorization, or autonomous decision authority. On exact reviewed source
  publication, close P7.5 and advance exactly one roadmap step so P7.6 Market Test /
  Funnel Evidence becomes the unique NEXT commitment.

problem: >
  P7.4 can truthfully describe which six TikTok-affiliate evidence dimensions are represented
  by caller-supplied evidence references, but it deliberately cannot infer evidence quality,
  completeness, priority, or whether any missing information should be acquired. Product
  Contract v2 requires Value-of-Information reasoning: deeper evidence acquisition should be
  considered relative to expected decision impact, uncertainty reduction, cost, latency,
  access risk, fragility, reliability, opportunity cost, and decision deadline, and the system
  must be able to stop when additional evidence is unlikely to improve a material decision
  enough to justify its cost or delay. A bounded P7.5 semantic owner is therefore required
  before P7.6 market-test/funnel work, while preserving the rule that missingness and technical
  collectability do not themselves authorize acquisition.

assumptions:
  - Canonical python_complete_agent main at authoring is ca6da00e9e58f66e25f2f6edcb416677bed70b6d, the exact reviewed P7.4 correction candidate published from RUN-222-002 / REVIEW-222-002.
  - TASK-222 revision 1 is publication-effective and P7.5 Value-of-Information Planning is the unique canonical NEXT commitment.
  - P7.6 Market Test / Funnel Evidence and P7.7 Calibration & Winner Validation remain NOT_DONE.
  - src/commerce_opportunity_intelligence/decision_context.py remains the sole P7.3 owner for DecisionContext and OpportunityHypothesis semantics.
  - src/commerce_opportunity_intelligence/tiktok_affiliate_evidence.py remains the sole P7.4 owner for TikTokAffiliateEvidenceProfile and its six evidence dimensions.
  - Product Intelligence remains sole owner of its observed facts/evidence semantics; P7.5 consumes P7.4 profile identity and caller-authored planning claims only.
  - An unrepresented P7.4 dimension is not evidence that acquisition is valuable or authorized; a represented dimension is not evidence that no further information could be valuable.
  - Value-of-Information is context-dependent and Product Contract v2 requires no universal formula.
  - A P7.5 CONTINUE/DEFER/STOP disposition is advisory planning semantics only and does not establish TEST_READY, authorize collection, choose a provider, or execute an action.
  - Current full downstream AIOS conformance remains DONE through TASK-207 revision 8 under exact pin edd7d8d92d54900c56442bbfcddb8648ec4d2e09.
  - Human selected Antigravity for the current execution sequence; do not silently switch Executor.

