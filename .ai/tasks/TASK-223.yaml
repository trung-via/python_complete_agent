non_goals:
  - Modify DecisionContext, OpportunityHypothesis, TikTokAffiliateEvidenceProfile, or their existing validation/public projection semantics.
  - Modify any src/product_intelligence production file, ProductCandidateSnapshot, SignalEvidence, scorer, ranker, discovery, approval, evidence, identity, truth, catalog, retrieval, or persistence authority.
  - Implement a collector, scraper, browser/CDP path, TikTok/TikTok Shop API call, provider selection, source discovery, enrichment router, acquisition scheduler, queue, background worker, or live marketplace operation.
  - Treat an unrepresented P7.4 dimension, missing field, technically collectable source, or caller curiosity as acquisition authorization.
  - Define a universal numeric VOI score, fixed cross-context weighting formula, automatic evidence priority ranking, global threshold, winner score, confidence score, or acquisition score.
  - Turn planning disposition into Human approval, acquisition approval, autonomous action, recommendation authority, or commerce decision authority.
  - Implement P7.6 test design/execution, TEST_READY promotion, traffic/content/campaign actions, funnel measurement, market experimentation, budget/exposure authorization, or post-test outcome interpretation.
  - Implement P7.7 calibration, causal attribution, VALIDATED_WINNER/SCALABLE_WINNER classification, policy learning, or scorer reweighting.
  - Persist plans to a database/files/queues/services, add an API/server, or invoke provider/model/LLM, network, browser, filesystem discovery, environment-derived identity, wall clock, random/UUID, subprocess, or AIOS lifecycle APIs from the production semantic module.
  - Modify Product Contract, Project Contract, Constitution, AIOS adoption/conformance state, exact AIOS pin, workers, workflows, transport, Reviewer, Publisher, or control-plane policy.
  - Create a second Commerce Opportunity Intelligence package or duplicate P7.3/P7.4 authority.
  - Push, merge, publish, or mutate canonical main from Executor implementation execution.

constraints:
  hard:
    - >
      Extend only the existing src/commerce_opportunity_intelligence package. The canonical
      P7.5 owner is src/commerce_opportunity_intelligence/value_of_information.py with
      authority identifier COMMERCE_OPPORTUNITY_INTELLIGENCE_P7_5. Do not create a second
      domain package or move P7.3/P7.4 ownership.
    - >
      Provide one immutable ValueOfInformationInquiry semantic value and one immutable
      ValueOfInformationPlan semantic value. An inquiry must be caller-authored and contain
      stable inquiry_id, exactly one P7.4 evidence dimension, a bounded information question,
      an inspectable explanation of why the answer could change the current decision, and
      explicit caller-supplied considerations for expected decision impact, uncertainty
      reduction, cost, latency, access risk, fragility, reliability, opportunity cost, and
      decision deadline. These fields are planning claims, not measured Product Truth.
    - >
      Expose exactly three ordered planning dispositions: CONTINUE, DEFER, STOP. Each inquiry
      carries one disposition plus a bounded rationale. CONTINUE means only that further
      information remains worth considering; DEFER means not justified now under the stated
      context; STOP means further acquisition for that inquiry is not currently justified.
      None of the three authorizes acquisition or establishes TEST_READY.
    - >
      ValueOfInformationPlan must bind to caller-supplied stable plan_id, exact
      DecisionContext.context_id, exact OpportunityHypothesis.hypothesis_id, exact
      TikTokAffiliateEvidenceProfile.profile_id, and timezone-aware as_of. It must contain an
      ordered tuple of inquiries and one overall advisory disposition/rationale. The plan must
      preserve caller order and reject duplicate inquiry_id values.
    - >
      Provide one pure create_value_of_information_plan construction surface accepting the
      exact DecisionContext, OpportunityHypothesis, and TikTokAffiliateEvidenceProfile plus
      caller-supplied plan identity/time/inquiries/overall disposition. It must verify exact
      P7.3/P7.4 binding: hypothesis.decision_context_id equals context.context_id; profile
      decision_context_id equals context.context_id; profile hypothesis_id equals
      hypothesis.hypothesis_id. It must not infer identity, time, evidence quality, acquisition
      priority, or disposition from profile missingness.
    - >
      Enforce only semantic consistency, not a universal decision formula: overall CONTINUE
      requires at least one inquiry with CONTINUE; overall STOP must contain no CONTINUE
      inquiry; overall DEFER must contain no CONTINUE inquiry and at least one DEFER inquiry.
      Empty inquiry sets are allowed only with overall STOP and an explicit stopping rationale.
      These coherence rules do not rank inquiries or evaluate commercial truth.
    - >
      P7.4 represented/unrepresented dimensions may be inspected by callers, but P7.5 production
      semantics must never auto-create inquiries, auto-mark CONTINUE, or prioritize an inquiry
      merely because a dimension is unrepresented. Conversely, represented dimensions remain
      eligible for caller-authored inquiries because representation is not quality/sufficiency.
    - >
      Public projections must be deterministic and JSON-serializable, serialize as_of as ISO-8601
      text, preserve inquiry order, expose all nine Product-Contract VOI considerations and
      rationales, and fail closed on blank/multiline/unbounded or obvious secret/cookie/session/
      prompt/execution-metadata/raw-HTML payloads. No object repr or memory address may leak.
    - >
      Public package exports may add only COMMERCE_OPPORTUNITY_INTELLIGENCE_P7_5,
      VALUE_OF_INFORMATION_DISPOSITIONS, ValueOfInformationInquiry, ValueOfInformationPlan,
      and create_value_of_information_plan in addition to the existing P7.3/P7.4 surface.
    - >
      P7.5 documentation must explicitly preserve: missingness != acquisition authorization;
      collectability != value; planning claim != evidence truth; VOI plan != collector plan;
      CONTINUE != authorization; STOP != proof no evidence exists; DEFER != permanent rejection;
      represented != sufficient; disposition != decision; P7.5 != TEST_READY.
    - >
      Update the two canonical product roadmaps consistently. Record TASK-222/P7.4 as
      CLOSED/PUBLISHED at ca6da00e9e58f66e25f2f6edcb416677bed70b6d. Record TASK-223/P7.5
      as publication-gated DONE and make P7.6 Market Test / Funnel Evidence the single NEXT
      commitment only after TASK-223 publication. P7.7 remains NOT_DONE.
    - >
      Update .ai/roadmap-state.yaml without changing its authority classification. Preserve
      current Governance Foundation/control-plane history, TASK-207 revision-8 conformance,
      TASK-221 migration history, exact pin edd7d8d..., and P7.2/P7.3/P7.4 published lineage.
      Set current milestone to P7.5/TASK-223 publication-gated DONE, next milestone P7.6, and
      retain only P7.6/P7.7 as ordered pending commitments.
    - >
      Extend governance regression additively so current exact AIOS pin/conformance assertions
      remain intact and tests prove one and only one NEXT=P7.6 after publication, P7.5 semantic
      ownership, P7.4 published source ca6da00..., no roadmap authority change, and P7.7 NOT_DONE.
    - >
      Preserve .ai/aios-adoption-state.yaml, .ai/aios-conformance-state.yaml,
      requirements-aios-renew.txt, Product Contract, Project Contract, P7.3/P7.4 production
      modules, and all Product Intelligence production files byte-for-byte.
    - >
      Only the eight authorized paths may change. Verification must be deterministic, offline,
      non-interactive, and independent of network, GitHub, marketplace, browser/CDP,
      provider/model, credentials, local absolute paths, wall clock, random, UUID, mutable
      external state, or live TikTok availability.
    - >
      Executor must perform bounded source work only, commit the candidate, return one structured
      ResultPackage, and leave Runtime to execute canonical TASK verification. Do not start
      another AIOS operation or delegated/background agent.

acceptance:
  - id: AC1
    condition: >
      Exactly one P7.5 production owner exists in the existing Commerce Opportunity Intelligence
      package with immutable ValueOfInformationInquiry and ValueOfInformationPlan semantics and
      no duplicate evidence, decision, acquisition, or lifecycle authority.
  - id: AC2
    condition: >
      Inquiry semantics make all nine Product-Contract VOI considerations inspectable as
      caller-supplied planning claims, bind each inquiry to exactly one canonical P7.4 evidence
      dimension, preserve caller order, and expose no universal numeric VOI score or fixed
      cross-context weighting formula.
  - id: AC3
    condition: >
      Pure plan construction verifies exact DecisionContext/OpportunityHypothesis/
      TikTokAffiliateEvidenceProfile identity binding and caller-supplied plan/time/inquiries
      with zero network/provider/marketplace/persistence/runtime behavior.
  - id: AC4
    condition: >
      CONTINUE, DEFER, and STOP semantics plus plan-level coherence are deterministic and
      inspectable while remaining advisory only: no disposition authorizes evidence collection,
      establishes TEST_READY, advances lifecycle state, chooses a provider, or makes a commerce
      decision.
  - id: AC5
    condition: >
      P7.5 never derives acquisition need or priority from represented/unrepresented dimensions
      alone; empty inquiries are valid only for explicit STOP, and represented dimensions may
      still receive caller-authored inquiries without implying evidence insufficiency.
  - id: AC6
    condition: >
      Public projections are deterministic JSON-serializable values, preserve inquiry order,
      include the nine VOI considerations and rationales, and fail closed on forbidden
      sensitive/raw payload classes with no score, rank, winner, recommendation, acquisition
      order, decision, or lifecycle state.
  - id: AC7
    condition: >
      P7.5 documentation and both canonical roadmaps preserve prior published P7 lineage and
      authority boundaries, record P7.5 as publication-gated DONE, advance exactly P7.6 to
      unique NEXT only after source publication, and leave P7.7 NOT_DONE.
  - id: AC8
    condition: >
      Only the eight authorized paths change; P7.3/P7.4 regression, focused P7.5 tests, current
      governance regression, and git diff --check pass with zero unresolved items, producing a
      clean candidate eligible for independent PRIMARY review and exact safe publication.

