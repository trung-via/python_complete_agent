task_id: TASK-191
revision: 1

goal: >
  Close P7.1 Real-Evidence Winning Product Coverage Baseline by freezing exactly one
  Human-accepted TASK-190 READY discovery_capture_bundle.json into immutable repository
  fixtures, then replaying the already-published TASK-181 Winning Product evidence-coverage
  evaluator fully offline and recording one deterministic measured baseline report. This is
  benchmark/integration work only: it changes zero production Python, performs no live
  marketplace acquisition, and introduces no new discovery, normalization, scoring, ranking,
  approval, persistence, retrieval, product-truth, or Human-authority semantics.

problem: >
  TASK-182's attempted baseline remains semantically BLOCKED because malformed Shopee sold
  evidence made its frozen cohort untrustworthy. TASK-185 later hardened the existing sold-evidence
  input boundary. TASK-186 and TASK-188 remain BLOCKED / UNPUBLISHED with no source candidate;
  TASK-188 also demonstrated that live marketplace acquisition does not belong inside ordinary
  AIOS engineering execution. TASK-189 and TASK-190 subsequently established the session/access
  continuity and Human-operated discovery-cohort staging boundary. TASK-190 is now published, and
  the Human has completed its required post-publication gate by accepting one READY three-query,
  fifteen-candidate discovery bundle for exact query/order/count/integrity/relevance. The remaining
  work is therefore deterministic evidence freeze plus offline TASK-181 replay, not another live
  capture attempt and not a continuation or repair of TASK-182, TASK-186, or TASK-188.

