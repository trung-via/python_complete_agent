non_goals:
  - Modify any production Python module, public API, dependency, AIOS pin, worker surface,
    workflow, browser/session implementation, live-capture implementation, discovery/parsing,
    normalization, scoring, ranking, approval, persistence, retrieval/RAG, product truth,
    CLI, provider/model, scheduler, service, database, cache, or background process.
  - Perform Shopee/TikTok discovery, browser/CDP navigation, CAPTCHA handling, scrape/acquisition,
    Drive upload, HTTP/network access, provider calls, or any other live marketplace work during
    implementation or Runtime verification.
  - Continue, repair, publish, copy, import, reconstruct, or rehabilitate TASK-182,
    TASK-186, or TASK-188 evidence, candidate deltas, diagnostics, or measured reports.
  - Import any rejected or failed TASK-190 operational root, checkpoint, partial batch, console
    output, or replacement bundle. Only the exact Human-accepted bundle digest in this contract
    is admissible.
  - Hand-edit, normalize, enrich, fill, infer, clean, repair, substitute, reorder, filter, rank,
    shortlist, approve, or otherwise alter any accepted marketplace candidate field.
  - Add velocity/history, affiliate, creator/video, competition, semantic Contentability, trend,
    LLM/provider, embeddings, or any new marketplace fact.
  - Use score, decision band, category coverage, title overlap, marketplace popularity, or report
    output to change the accepted cohort.
  - Define a business-quality pass/fail threshold, product winner, Human approval, automatic
    enrichment priority, or post-baseline roadmap decision.
  - Claim TikTok, cross-platform, all-Shopee, longitudinal, affiliate, creator, competition, or
    semantic Contentability coverage beyond the exact accepted bounded cohort.
  - Open P6.2, P6.4, P6.5, or P6.6, or pre-authorize a later P7 enrichment implementation.
  - Commit capture_checkpoint.json, cookies, credentials, browser/session identifiers, raw HTML,
    screenshots, media, local absolute paths, transient execution logs, or operational failure roots.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      TASK-191 changes zero production Python. Changed-files truth must remain within exactly the
      seven paths in scope.modify. Fixture and integration-test code must never be imported by src/.
    - >
      Implementation-time evidence import is allowed from exactly one Human-supplied environment
      variable named PI_P7_1_ACCEPTED_BUNDLE. It must resolve to one existing absolute regular
      non-symlink file outside the Git repository. The Executor may read that variable only for the
      one-time accepted-bundle freeze. It must not commit, print into docs/baseline/result claims,
      normalize, persist, or otherwise expose the external absolute path. It must not scan parent or
      sibling directories. Runtime verification must use only committed fixtures and must not require
      or read PI_P7_1_ACCEPTED_BUNDLE.
    - >
      Before fixture freeze, require exact SHA-256
      aba1cdbc0a74d591a7da6c6dce11b9ae06bb7c16b0fe151490bb74da3efc465a and exact byte count 16047
      for the supplied file. Any byte or digest mismatch fails closed. Never search for, recapture,
      regenerate, repair, or substitute another bundle.
    - >
      Validate the accepted source before copying: exact top-level keys `batches`, `queries`,
      `schema`, `version`; schema exactly product_intelligence_discovery_capture_bundle; version 1;
      exact three-query sequence `bình giữ nhiệt inox`, `bàn phím cơ`, `chuột không dây`; exactly
      three ordered batches; platform shopee, matching exact query, pages_examined == 1 and
      candidate_count == 5 for each batch; exactly five candidate mappings per batch; fifteen
      pairwise-distinct candidate_id values and fifteen pairwise-distinct URLs; and canonical aware
      ISO observed_at values. Fail closed on any structural mismatch without repairing data.
    - >
      Copy the exact accepted source bytes byte-for-byte to
      tests/fixtures/p7_1_winning_product_coverage/discovery_capture_bundle.json. Do not parse and
      rewrite that fixture, change JSON whitespace/key ordering, or append provenance fields.
      Repository verification must assert its exact SHA-256 and byte count remain the accepted values.
    - >
      The committed discovery_capture_bundle.json is immutable benchmark input only and must never
      be imported by production code. It is the sole frozen marketplace-evidence fixture for this
      P7.1 baseline; baseline.json references it by fixture-relative filename and digest rather than
      duplicating its batch/candidate payloads.
    - >
      Add tests/fixtures/p7_1_winning_product_coverage/baseline.json as the sole deterministic
      baseline descriptor and measured snapshot. It must be compact UTF-8 JSON without BOM, use
      sort_keys=True and separators=(",", ":"), contain exactly one trailing newline, have schema
      p7_1_winning_product_coverage_baseline and version 1, and contain exactly these top-level keys:
      `schema`, `version`, `source`, `evaluated_at`, `report`.
    - >
      baseline.json `source` must contain exactly `fixture`, `sha256`, `byte_count`,
      `capture_task`, `capture_source_sha`, and `human_review`. Their exact values are
      `discovery_capture_bundle.json`,
      aba1cdbc0a74d591a7da6c6dce11b9ae06bb7c16b0fe151490bb74da3efc465a,
      16047, `TASK-190`, 22d8837e5955ed78185426f293e874625a34d469, and `ACCEPTED`.
      These are provenance facts only and grant no product approval or ranking semantics.
    - >
      A private integration-test loader may parse the frozen bundle only for deterministic offline
      replay. It must reconstruct each ProductCandidateSnapshot from the exact public candidate
      mapping, parsing only observed_at ISO text back to datetime, then require
      candidate.to_dict() exact equality with the frozen mapping. It must reconstruct each
      DiscoveryBatch from those exact candidates and public batch fields, then require
      batch.to_dict() exact equality with the frozen batch mapping. The loader is test-only, not a
      reusable codec or production serialization authority.
    - >
      Offline replay must revalidate the fixed bundle methodology before evaluation: exact query and
      batch order, three batches, five candidates per batch, pages_examined == 1, platform shopee,
      all fifteen candidate IDs and URLs pairwise distinct, and no extra or missing frozen candidates.
      Human relevance is already accepted task input and must not be recomputed by the Executor.
    - >
      Build the evaluation cohort by concatenating all five reconstructed candidates from each batch
      in exact query order and exact candidate order, yielding exactly fifteen exact
      ProductCandidateSnapshot values. Do not sort, filter, rank, deduplicate, replace, or select by
      score or title.
    - >
      Derive evaluated_at only as max(batch.observed_at) over the three exact reconstructed batches.
      It must equal 2026-09-12T12:06:33.110964+00:00 exactly and must not read the clock, environment,
      file mtime, commit time, or any external timestamp.
    - >
      Call published TASK-181 evaluate_winning_product_coverage exactly once for the complete
      fifteen-candidate cohort with exact evaluated_at and policy=None. Baseline replay must not
      directly call WinningProductScorer, SnapshotNormalizer, CandidateRanker, discovery adapters,
      live_capture, orchestration, private evaluator helpers, or any second scoring/evaluation
      authority.
    - >
      Project the returned TASK-181 report without recomputing scoring or coverage. `report` must
      contain exact evaluated_at; one ordered candidate record per evaluator candidate containing
      exact candidate_id, exact score.to_dict(), zero_coverage_categories,
      partial_coverage_categories, full_coverage_categories, and missing_factual_signal_names in
      evaluator order; exact ordered zero/partial/full category-count pairs; and exact ordered
      decision-band count pairs. Enum values are serialized through their existing public `.value`
      only. No average, threshold, recommendation, ranking, winner label, or roadmap verdict may be
      added.
    - >
      The implementation-time baseline snapshot must be produced mechanically from the frozen
      accepted fixture and the published TASK-181 evaluator, not manually transcribed. Normal
      verification must independently reconstruct the frozen candidates, derive evaluated_at,
      call TASK-181 once, project the report, and require exact equality with committed
      baseline.json, including exact canonical serialized bytes.
    - >
      No quality threshold exists. Any valid deterministic measured distribution passes regardless
      of score values, decision bands, category coverage, sold_count availability, missing-signal
      prevalence, or whether the report looks commercially attractive.
    - >
      Add docs/PHASE_7_P7_1_REAL_EVIDENCE_COVERAGE_BASELINE.md recording the accepted bundle
      provenance/digest, exact sampling methodology, TASK-181 replay boundary, exact measured report
      summary, bounded scope, and the distinction between evidence prevalence and economic value.
      It must state that the baseline itself does not select an enrichment or declare a winning
      product.
    - >
      Update the P7.0 document and both canonical roadmaps consistently: TASK-181 remains P7.0
      CLOSED/PUBLISHED; TASK-182, TASK-186 and TASK-188 remain BLOCKED/UNPUBLISHED historical
      evidence; TASK-185, TASK-187, TASK-189 and TASK-190 remain CLOSED/PUBLISHED prerequisites;
      TASK-191 is the fresh accepted-bundle offline P7.1 baseline successor. Preserve P6.2 PARKED
      and P6.4-P6.6 DEFERRED / UNIMPLEMENTED. Do not authorize the next improvement until
      canonical Runtime PASS, ChatGPT semantic PASS, source-only publication, and separate
      Brain/Human interpretation of this measured baseline.
    - >
      Runtime verification is fully offline and deterministic: zero browser/CDP, marketplace,
      network, provider, Drive, environment-dependent evidence loading, wall-clock, random, UUID,
      subprocess, mutable persistence, or external discovery. Existing evaluator, scoring, ranking,
      orchestration, Shopee discovery/parsing, live-capture, CLI and browser/CDP offline regressions
      remain green.
    - >
      All modified text files must remain UTF-8 without BOM and LF line endings where repository
      format requires. Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      TASK-191 changes zero production Python and freezes exactly the one Human-accepted TASK-190
      discovery bundle byte-for-byte as immutable repository benchmark input, identified by the
      exact accepted SHA-256 and byte count, with no historical/rejected evidence reuse.
  - id: AC2
    condition: >
      Offline fixture validation losslessly reconstructs all three exact DiscoveryBatch public
      projections and all fifteen exact ProductCandidateSnapshot public projections, revalidates
      query/order/count/pages/platform/cohort uniqueness, and never alters or semantically reselects
      the Human-accepted cohort.
  - id: AC3
    condition: >
      evaluated_at is deterministically derived as the maximum frozen batch observed_at and the
      complete fifteen-candidate cohort is passed exactly once to published TASK-181
      evaluate_winning_product_coverage with policy=None, with no second scoring/evaluation authority.
  - id: AC4
    condition: >
      baseline.json deterministically records accepted-bundle provenance plus the exact projected
      TASK-181 report, and normal offline replay independently reproduces both the semantic document
      and exact canonical bytes.
  - id: AC5
    condition: >
      No live marketplace work, production-code change, synthetic enrichment, missing-value fill,
      post-hoc anomaly cleanup, threshold, ranking, winner declaration, Human approval, or automatic
      enrichment selection is introduced.
  - id: AC6
    condition: >
      P7.1 documentation records the exact bounded measured baseline and clearly separates observed
      evidence prevalence from economic value, while preserving blocked predecessor evidence and
      accepted-bundle provenance.
  - id: AC7
    condition: >
      P7.0 and both canonical roadmaps correctly record TASK-191 as the fresh offline P7.1 baseline
      successor, preserve all prior published/blocked/deferred states, and leave any post-baseline
      improvement choice to separate Brain/Human interpretation after publication.
  - id: AC8
    condition: >
      Required Runtime verification is fully offline/deterministic, all focused and regression tests
      pass, git diff --check passes, unresolved is empty, and changed-files truth remains within
      TASK-191 scope.modify.

