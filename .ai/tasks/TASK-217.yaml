non_goals:
  - Modify, rerun, repair, review, integrate, or publish TASK-215 / RUN-215-002 inside this task.
  - Modify .ai/aios-conformance-state.yaml or claim TASK-207 certification applies to c96eb8b5.
  - Adopt AIOS-renew 788436636a03a70e658c1e0cd6d7fe6ec4a309da, b56174a9023d361ca816cb3e147fc3a3b566cbf7, TASK-130, mutable upstream main, or any unpublished/unreviewed upstream candidate as downstream runtime authority.
  - Add new behavior beyond the already-reviewed TASK-216 r3 migration semantics, broaden repository bindings, or redesign publication, repair, remediation, Runtime, Executor, or product semantics.
  - Force-publish RUN-216-007, rewrite its historical review/repair lineage, publish a review-decision commit, move refs manually, or bypass the safe Publisher.
  - Introduce floating refs, vendored AIOS source, a second runtime authority, generic retry/reroute, scheduler, queue, broker, lifecycle router, memory database, Planner, or generic conversation store.
  - Push or publish from Executor implementation execution.
constraints:
  hard:
    - The TASK-217 implementation candidate must descend from the canonical TASK-217 authoring state on current main and preserve all current-main history.
    - Reproduce the complete reviewed TASK-216 r3 semantic delta represented by source candidate 2eff8fc8f9c3224dc38fdc656a73e9205b91c34b across the same fourteen authorized files. No unrelated semantic change, refactor, cleanup, or behavior expansion is permitted.
    - The sole active AIOS-renew dependency pin and worker AUTHORITATIVE_COMMIT must become exactly c96eb8b52acd865b9453409e6598e08a8bd4e48e. Existing PEP-610 source-plus-commit provenance must remain fail-closed for stale, alternate, or unverifiable runtimes.
    - Preserve Human-facing Codex and Antigravity worker protocol and executor separation unchanged.
    - Preserve the existing publication continuation and exactly one additional bounded post-canonicalization AUTHOR_REPAIR dispatch to aios-self-hosted-repair-wakeup.yml using exact repair_dispatch_id, failed_run_id, and repair_sha only.
    - Preserve the dedicated REPAIR issue carrier title bound so unrelated Issue fan-out cannot emit canonical-looking REPAIR receipts.
    - Adoption and roadmap planning state must record migration through upstream TASK-129 at exact c96eb8b5, preserve P7.3 as NEXT and TASK-215/RUN-215-002 lineage, and explicitly keep fresh c96eb8b5 downstream conformance certification pending.
    - Do not rewrite the historical .ai/aios-conformance-state.yaml. Old TASK-207 certification remains historical evidence for 91a177d5 only.
    - Later upstream BP-0 planning and TASK-130 authoring may be acknowledged only as non-runtime audit context. They must not become downstream package capability, binding, certification, or pin authority in this task.
    - TASK-217 is a fresh PRIMARY integration lineage. Historical RUN-216 verification/review remain evidence for the original delta, while TASK-217 Runtime verification must establish compatibility of the current-main descendant before semantic review/publication.
    - Mutation must stay inside the fourteen authorized modify files. Executor must leave a clean worktree and must not publish.
    - Verification must be deterministic, offline, non-interactive, and independent of GitHub/network/provider/model/chat state. Use the dedicated repository-gitdir pytest base temp path to avoid the known old-pin Windows pytest-current cleanup failure without changing product/source semantics.
acceptance:
  - id: AC1
    condition: The TASK-217 candidate descends from its current-main authoring state, changes only the fourteen authorized files, and preserves the complete reviewed TASK-216 r3 semantic delta without unrelated behavior.
  - id: AC2
    condition: Sole active AIOS-renew dependency/provenance authority is exactly c96eb8b52acd865b9453409e6598e08a8bd4e48e and stale/alternate provenance remains fail-closed.
  - id: AC3
    condition: Human-facing worker surfaces remain authority-neutral and Brain ingress preserves both the existing publication continuation and exactly one bounded post-AUTHOR_REPAIR REPAIR dispatch using canonical outputs only.
  - id: AC4
    condition: Dedicated REPAIR issue carrier remains exact-title bounded so unrelated Issue fan-out cannot emit false canonical-looking REPAIR receipts.
  - id: AC5
    condition: Adoption/roadmap truth records the exact c96eb8b5 migration through TASK-129, preserves TASK-215/P7.3 lineage, and marks fresh downstream conformance for the new pin as pending without rewriting historical certification.
  - id: AC6
    condition: No unreviewed/upstream-main-only BP-0 or TASK-130 state becomes runtime/package/binding authority; c96eb8b5 remains the newest downstream-eligible exact reviewed/source-published runtime target for this task.
  - id: AC7
    condition: Focused deterministic regressions pass using the dedicated gitdir pytest temp root, git diff --check passes, RESULT has zero unresolved items, and the resulting PRIMARY source candidate is eligible for ordinary independent review and safe publication.
