task_id: TASK-217
revision: 1
goal: >
  Integrate the already-reviewed TASK-216 revision-3 downstream AIOS migration onto
  current Python Agent main as a fresh current-main PRIMARY candidate so Python Agent
  activates the latest downstream-eligible reviewed/source-published AIOS-renew runtime
  c96eb8b52acd865b9453409e6598e08a8bd4e48e, preserves the TASK-127 bounded
  post-AUTHOR_REPAIR handoff and carrier-noise hardening, preserves TASK-215/P7.3
  lineage, and can be published through the existing safe Publisher without depending
  on the historical RUN-216 REPAIR publication lineage.
problem: >
  TASK-216 revision 3 produced reviewed candidate
  2eff8fc8f9c3224dc38fdc656a73e9205b91c34b. RUN-216-007 completed Runtime
  verification with the exact candidate preserved through a NO_CHANGE repair, and
  REVIEW-216-001 is PRIMARY PASS with AC1-AC7 PASS and no findings. Safe publication
  then failed before mutating main because current Python Agent main still installs old
  AIOS-renew pin 91a177d5b96b2197a4d8223dbb727dda6201cb64; that old Publisher rejects the
  RUN-216-007 REPAIR execution lineage with `invalid canonical publication lineage:
  REPAIR execution fields do not match persisted lineage`. The source candidate itself
  is a one-commit descendant of current main and has no semantic review finding. A fresh
  current-main integration task is therefore required to reproduce the reviewed TASK-216
  semantic delta in a new PRIMARY lineage that the current safe Publisher can process.

  Fresh upstream audit shows AIOS-renew current main is
  b56174a9023d361ca816cb3e147fc3a3b566cbf7, but the only commits after c96eb8b5 are
  the Human-approved BP-0 planning baseline and TASK-130 authoring. They contain no
  reviewed/source-published TASK-130 runtime implementation. Python Agent adoption policy
  is EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY, so mutable upstream main, planning state,
  788436636a03a70e658c1e0cd6d7fe6ec4a309da, and b56174a9023d361ca816cb3e147fc3a3b566cbf7
  are not eligible runtime authorities. c96eb8b5 remains the newest eligible downstream
  runtime source through published TASK-129.
assumptions:
  - Canonical Python Agent main at authoring is 4bfa07d0d667b5c5082121017161c8df60d02b25 and contains TASK-216 revision 3 only; TASK-216 implementation is not published.
  - TASK-216 reviewed source is 2eff8fc8f9c3224dc38fdc656a73e9205b91c34b and REVIEW-216-001 is PRIMARY PASS with no findings.
  - The TASK-216 publication failure is a Publisher/lineage compatibility blocker under the old downstream pin, not a semantic defect in 2eff8fc8.
  - Canonical comparison establishes 2eff8fc8 as exactly one implementation commit ahead of 4bfa07d0 with mutations confined to the fourteen TASK-216 r3 authorized files.
  - AIOS-renew c96eb8b52acd865b9453409e6598e08a8bd4e48e remains the newest exact reviewed/source-published runtime candidate eligible under Python Agent adoption policy; later upstream main movement is planning/task-authoring only and is not adopted here.
  - Frozen Kernel and existing Human/Brain/Runtime/Executor/Reviewer/Publisher authority boundaries remain unchanged.
