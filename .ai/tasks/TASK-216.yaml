task_id: TASK-216
revision: 2
goal: 'Preserve TASK-216 revision-1 semantics while making the migration executable
  against the actual current Python Agent repository contents. Migrate the sole active
  AIOS-renew runtime authority from 91a177d5b96b2197a4d8223dbb727dda6201cb64 to exact
  reviewed/source-published c96eb8b52acd865b9453409e6598e08a8bd4e48e, port only the
  bounded TASK-127 repository-binding compatibility for deterministic post-AUTHOR_REPAIR
  wakeup, preserve product/TASK-215 lineage, and leave fresh new-pin downstream conformance
  certification as a separate next prerequisite.

  '
problem: 'TASK-216 revision 1 was correctly authored but RUN-216-001 failed in EXECUTION
  before any candidate existed. The failure was not semantic: Codex attempted a brittle
  apply_patch in .agents/workflows/aios-renew-worker.md using historical TASK-118
  prose that is not present verbatim in the current file, causing apply_patch verification
  failure. Canonical failure evidence records failed_head_sha equal to base 19cd4df4ee0d8644982f3da513c3aca4467caa70,
  changed_files=[], repairable=false, transportable=false. Therefore RUN-216-001 is
  not a REPAIR subject and revision 2 must execute from current canonical main after
  ordinary checkout reconciliation. The migration semantics, authority boundaries,
  exact target pin, TASK-215 lineage preservation, and fresh-certification requirement
  from revision 1 remain unchanged.

  '
assumptions:
- 'Canonical repository content after recovery is source-equivalent to TASK-216 r1
  main; the two connector recovery commits between 19cd4df4 and e3a96bb have zero
  net file delta.

  '
- 'RUN-216-001 is immutable failed execution evidence only and produced no source
  candidate; it must not be FIXed or REPAIRed.

  '
- 'AIOS-renew c96eb8b52acd865b9453409e6598e08a8bd4e48e remains the exact reviewed
  and source-published cumulative upstream through TASK-129.

  '
- 'TASK-215 / RUN-215-002 correction lineage remains immutable and must not be altered
  by this migration.

  '
