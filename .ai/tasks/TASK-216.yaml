non_goals:
- Repair, rerun, review, integrate, publish, or otherwise alter TASK-215 or RUN-215-002.
- Repair RUN-216-001 or salvage its dirty working tree as a candidate.
- Modify .ai/aios-conformance-state.yaml or claim old TASK-207 certification applies
  to c96eb8b5.
- Introduce a floating AIOS ref, second runtime authority, vendored AIOS source, retry/reroute,
  lifecycle router, scheduler, queue, broker, or new semantic authority.
- Replace repository identity, runner labels/paths, actor allowlists, existing publication
  or remediation authority, or product semantics.
constraints:
  hard:
  - 'Replace the sole active requirements pin and worker AUTHORITATIVE_COMMIT with
    exactly c96eb8b52acd865b9453409e6598e08a8bd4e48e; preserve existing PEP-610 provenance
    and fail-closed runtime bootstrap behavior.

    '
  - 'Before modifying every authorized file, read its current repository content at
    the admitted base. Do not construct apply_patch hunks from assumed historical
    prose or from TASK-118/TASK-119-era exact text. In particular, edits to .agents/workflows/aios-renew-worker.md
    must locate the current `Adopted Upstream Capabilities and Boundaries` section
    and current old-pin text semantically/currently, then update that current content.
    If an expected historical anchor is absent, re-read the file and make a content-aware
    edit rather than failing or fabricating the anchor.

    '
  - 'Preserve Human-facing Codex and Antigravity worker protocols and authority neutrality.

    '
  - 'Port TASK-127 post-canonicalization REPAIR handoff into the existing .github/workflows/aios-brain-ingress.yml
    only: successful non-replayed AUTHOR_REPAIR with canonical repair_sha dispatches
    at most once to existing aios-self-hosted-repair-wakeup.yml using exact repair_dispatch_id,
    failed_run_id and repair_sha. Existing publication dispatch remains unchanged
    and transport receipts assert transport only.

    '
  - 'Bound .github/workflows/aios-brain-repair-wakeup.yml receipt/failure behavior
    to exact `[AIOS REPAIR WAKEUP]` target issues so unrelated Brain ingress fan-out
    produces no false canonical-looking REPAIR rejection receipt.

    '
  - 'Reconcile .ai/aios-adoption-state.yaml to c96eb8b5 and cumulative reviewed TASK-119..129
    provenance, while explicitly marking fresh full downstream conformance certification
    as pending/not-current. Preserve .ai/aios-conformance-state.yaml unchanged as
    historical old-pin evidence.

    '
  - 'Reconcile .ai/roadmap-state.yaml only for this control-plane migration; preserve
    P7.3 and TASK-215 correction lineage and make fresh new-pin certification the
    next control-plane prerequisite before generic roadmap continuation.

    '
  - 'Existing Phase-1/Phase-2 bindings, publication, remediation intent, self-hosted
    repair target, terminal attention, runner labels/paths, policies and actor allowlists
    remain unchanged except the two bounded TASK-127 workflow deltas.

    '
  - 'Mutation must stay inside the thirteen authorized modify files. Executor must
    leave no dirty working tree on success and must not publish.

    '
