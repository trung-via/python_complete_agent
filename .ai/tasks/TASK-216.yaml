task_id: TASK-216
revision: 3
goal: 'Preserve TASK-216 revision-2 migration semantics and authority boundaries while
  correcting the verification contract exposed by RUN-216-005. Migrate Python Agent
  to exact reviewed AIOS-renew pin c96eb8b52acd865b9453409e6598e08a8bd4e48e, preserve
  the bounded TASK-127 post-AUTHOR_REPAIR handoff, preserve TASK-215/P7.3 lineage,
  and authorize the one previously inspect-only Phase-1 regression file whose stale
  assertion now contradicts the intended two bounded workflow-dispatch continuations.

  '
problem: 'RUN-216-004 produced a clean, transportable, repairable TASK-216 r2 candidate
  and failed only because a stale governance regression forbade TASK-119/TASK-120
  text. REPAIR-216-002 corrected that authorized test and produced RUN-216-005 at
  failed_head_sha af9b408336d1c0d9a9dfb600f58facad10dbfd7e. RUN-216-005 verification
  now reports 220 passed and one failure: tests/aios_bridge/test_aios_phase1_control_plane.py
  still asserts that the entire Brain ingress workflow contains exactly one createWorkflowDispatch
  call. TASK-216 r2 intentionally adds a second bounded dispatch for post-canonicalization
  AUTHOR_REPAIR while preserving the existing publication dispatch. The Phase-2 candidate
  tests already assert the intended count of two. The Phase-1 test is therefore stale,
  but revision 2 listed it only for inspection/verification and did not authorize
  modification. Repairing that file under r2 would exceed task scope, so a fresh revision
  is required.

  '
