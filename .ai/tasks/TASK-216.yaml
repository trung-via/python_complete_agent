non_goals:
- Repair, rerun, review, integrate, publish, or otherwise alter TASK-215 or RUN-215-002.
- Modify .ai/aios-conformance-state.yaml or claim TASK-207 revision-3 certifies the
  new pin.
- Claim FULL_AIOS_DOWNSTREAM_CONFORMANCE for c96eb8b5; fresh certification remains
  separate.
- Copy AIOS-renew source into Python Agent, follow mutable upstream main, use a branch/tag
  reference, introduce a second runtime authority, or activate unreviewed upstream
  code.
- Replace Python Agent repository identity, runner labels/paths, actor allowlists,
  policies, self-hosted targets, remediation binding, publication binding, or product
  semantics.
- Copy upstream workflow repository-specific literals verbatim where Python Agent
  already owns a downstream binding; preserve downstream repository identity and exact-pin
  install.
- Automatically infer repair strategy, retry/reroute execution, or create another
  lifecycle router, scheduler, watcher, queue, broker, or semantic authority.
- Rewrite historical TASK-207/TASK-209 certification or migration lineage.
- Push or publish from Executor implementation execution.
constraints:
  hard:
  - 'Replace the sole active requirements pin and worker AUTHORITATIVE_COMMIT from
    91a177d5b96b2197a4d8223dbb727dda6201cb64 to exactly c96eb8b52acd865b9453409e6598e08a8bd4e48e.
    No floating ref or second active AIOS runtime pin may be introduced. Existing
    PEP-610 provenance validation and fail-closed runtime rebuild behavior must remain
    authoritative.

    '
  - 'Preserve Human-facing worker protocol exactly. Codex and Antigravity remain distinct
    Human-selected Executor identities and worker surfaces gain no Brain/review/publication
    authority.

    '
  - 'Port TASK-127 post-canonicalization REPAIR handoff into Python Agent''s existing
    .github/workflows/aios-brain-ingress.yml without replacing the downstream binding:
    successful non-replayed AUTHOR_REPAIR output with canonical repair_sha must cause
    at most one dispatch to the existing aios-self-hosted-repair-wakeup.yml bound
    to exact repair_dispatch_id, failed_run_id and repair_sha; publication dispatch
    behavior remains unchanged and both dispatch receipts assert transport only.

    '
  - 'Preserve Python Agent repository identity, pinned-package installation, current
    runner and actor boundaries. Do not replace downstream exact-pin installs with
    `pip install .` or hard-code AIOS-renew repository identity into Python Agent
    workflows.

    '
  - 'Bound the dedicated .github/workflows/aios-brain-repair-wakeup.yml receipt/failure
    job to its exact `[AIOS REPAIR WAKEUP]` target issue so unrelated Brain ingress
    fan-out does not emit a canonical-looking REJECTED repair receipt. The dedicated
    carrier''s admitted behavior remains otherwise unchanged.

    '
  - 'Reconcile .ai/aios-adoption-state.yaml to make c96eb8b5 the sole active downstream
    pin, advance upstream audit checkpoint through TASK-129, and record cumulative
    TASK-119..129 provenance/capability ownership. Existing repository bindings remain
    ACTIVE unless this task explicitly ports the TASK-127 compatibility above.

    '
  - 'The old TASK-207 revision-3 certification remains historical evidence tied to
    91a177d5b96b2197a4d8223dbb727dda6201cb64 and must not be relabeled as new-pin
    certification. Adoption/planning state must explicitly represent c96eb8b5 full
    downstream conformance as NOT_CURRENT/PENDING_FRESH_CERTIFICATION until a separate
    publication-gated certification succeeds.

    '
  - 'Reconcile .ai/roadmap-state.yaml only to record this non-product blocker migration,
    preserve P7.3 as the product NEXT and all TASK-215 correction lineage, and establish
    a fresh new-pin downstream-conformance certification as the next control-plane
    recovery prerequisite before generic P7 continuation. Do not mark P7.3 DONE or
    discard the existing failed candidate.

    '
  - 'Existing Phase-1/Phase-2 bindings, safe publication, remediation intent, self-hosted
    repair target, terminal attention, policies, runner labels/paths, and actor allowlists
    remain unchanged except the two explicitly authorized TASK-127 workflow deltas.

    '
  - 'Deterministic tests must prove exact new pin/provenance, stale/alternate runtime
    fail-closed behavior, truthful workflow dispatch boundaries, non-target repair
    receipt suppression, preserved publication/remediation bindings, and truthful
    transitional conformance state. No test may require network, live Actions, provider/model,
    wall clock, browser/CDP, Drive, or mutable external state.

    '
acceptance:
- id: AC1
  condition: 'The sole active Python Agent AIOS-renew dependency and worker provenance
    authority are exactly c96eb8b52acd865b9453409e6598e08a8bd4e48e; stale or alternate
    provenance still fails closed through the existing exact-pin bootstrap boundary.

    '
- id: AC2
  condition: 'Existing Codex and Antigravity Human-facing worker surfaces remain behaviorally
    compatible and authority-neutral, while documentation consistently names the new
    exact reviewed/source-published pin.

    '
- id: AC3
  condition: 'Python Agent Brain ingress preserves existing review-to-publication
    continuation and adds exactly one bounded post-canonicalization REPAIR dispatch
    path using only pinned ingress outputs; it cannot dispatch repair on failed ingress
    or absent repair_sha and its receipt does not claim execution/review/publication
    success.

    '
- id: AC4
  condition: 'The dedicated REPAIR issue carrier remains least-privilege and behaviorally
    compatible for target issues while non-target Brain ingress events cannot emit
    false REPAIR rejection receipts or create repair lifecycle truth.

    '
- id: AC5
  condition: 'Adoption/roadmap state records cumulative reviewed upstream TASK-119
    through TASK-129, c96eb8b5 as the sole active pin, preserves current product P7.3/TASK-215
    correction lineage, and truthfully marks prior TASK-207 revision-3 conformance
    as historical old-pin evidence with fresh c96eb8b5 certification still required.

    '
- id: AC6
  condition: 'Existing Phase-1/Phase-2 repository bindings and policies remain unchanged
    except the two bounded TASK-127 compatibility deltas; no AIOS source is vendored,
    no floating pin, retry/reroute, lifecycle router, or new semantic authority is
    introduced.

    '
- id: AC7
  condition: 'Mutation stays inside the thirteen authorized files, focused deterministic
    worker, ingress, Phase-2 and governance regressions pass, git diff --check passes,
    and RESULT contains zero unresolved items.

    '
