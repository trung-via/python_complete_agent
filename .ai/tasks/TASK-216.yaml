task_id: TASK-216
revision: 1
goal: 'Perform the explicit reviewed downstream AIOS-renew migration required to consume
  the cumulative reviewed/source-published upstream control-plane hardening through
  TASK-129, including the failed-REMEDIATION AUTHOR_REPAIR fix that blocks Python
  Agent RUN-215-002. Move the sole active pinned AIOS runtime authority from 91a177d5b96b2197a4d8223dbb727dda6201cb64
  to the exact reviewed and source-published cumulative source c96eb8b52acd865b9453409e6598e08a8bd4e48e,
  port only the repository- binding compatibility required by TASK-127 for deterministic
  post-AUTHOR_REPAIR wakeup, preserve current product/TASK-215 lineage, and leave
  full downstream conformance on the new pin to a fresh separately reviewed certification
  task before normal roadmap resumption.

  '
problem: 'Python Agent is pinned to AIOS-renew 91a177d5b96b2197a4d8223dbb727dda6201cb64.
  RUN-215-002 is a canonical failed REMEDIATION with clean, transportable, repairable
  candidate 75cbd814bf5e687c71015dfdce4e5d8a715009c5. Its canonical run wrapper stores
  the operational Run under execution.run. Under the current downstream pin AUTHOR_REPAIR
  reads task identity from the embedded Run but base_sha from the outer REMEDIATION
  wrapper and fails closed with `RUN base_sha is invalid`, preventing legitimate REPAIR
  authoring. Upstream TASK-129 fixed that exact generic defect and REVIEW-129-001
  passed; safe publication advanced AIOS-renew main to c96eb8b52acd865b9453409e6598e08a8bd4e48e.
  The cumulative source from the current downstream pin to c96eb8b5 also contains
  reviewed/published TASK-119 through TASK-128 reliability hardening. Exact-pin isolation
  means none is active in Python Agent until an explicit migration. In addition, Python
  Agent''s active Brain ingress binding predates TASK-127 and lacks deterministic
  post-canonicalization REPAIR dispatch, so merely bumping the package would leave
  a valid AUTHOR_REPAIR vulnerable to being stranded by carrier ordering. The current
  TASK-207 revision-3 conformance certification is explicitly bound to the old pin
  and must not be silently reinterpreted as certification of c96eb8b5.

  '
assumptions:
- 'Canonical Python Agent main at authoring is d720b1a80c9bffef9973c76e32710f2a72604f70,
  which authors TASK-215 revision 1 and remains pinned to 91a177d5b96b2197a4d8223dbb727dda6201cb64.

  '
- 'Canonical RUN-215-002 FAILURE remains phase VERIFICATION with failed_head_sha 75cbd814bf5e687c71015dfdce4e5d8a715009c5,
  changed files only src/commerce_opportunity_intelligence/decision_context.py and
  tests/commerce_opportunity_intelligence/test_decision_context.py, dirty=false, descends_from_base=true,
  outside_task_scope=[], repairable=true, transportable=true.

  '
- 'AIOS-renew c96eb8b52acd865b9453409e6598e08a8bd4e48e is exact reviewed/source-published
  TASK-129 source, with REVIEW-129-001 PRIMARY PASS and safe publication to canonical
  upstream main. It descends from the current downstream pin and cumulatively contains
  reviewed/published TASK-119 through TASK-129.

  '
- 'TASK-119 through TASK-129 preserve Frozen Kernel and established Brain/Runtime/Executor/
  Reviewer/Publisher authority separation. Their cumulative package changes cover
  D1 repair executor truth, Windows verification isolation, Brain Sync, FINALIZE_CANDIDATE,
  immutable REPAIR supersession/publication compatibility, Antigravity zero-mutation
  completion, deterministic post-AUTHOR_REPAIR wakeup, current-main integration, and
  failed-REMEDIATION AUTHOR_REPAIR normalization.

  '
- 'Python Agent Phase-1/Phase-2 repository bindings remain active. Only the bounded
  TASK-127 downstream binding compatibility is missing: Brain ingress must dispatch
  the fixed self-hosted REPAIR wakeup once after successful non-replayed AUTHOR_REPAIR
  canonicalization, and the dedicated issue REPAIR carrier must not post false rejection
  noise for non-target issues.

  '
- '.ai/aios-conformance-state.yaml remains immutable evidence of TASK-207 revision-3
  certification at the old pin for this migration. It is not certification authority
  for c96eb8b5; fresh new-pin certification is a separate next control-plane recovery
  step.

  '
- 'TASK-215, RUN-215-001, REVIEW-215-001, FINDING-215-001, RUN-215-002 and its failure
  artifacts remain immutable product/correction lineage. This task does not repair
  or reinterpret them.

  '
