constraints:
  hard:
  - Preserve the sole active exact AIOS-renew pin and worker AUTHORITATIVE_COMMIT
    target as c96eb8b52acd865b9453409e6598e08a8bd4e48e with existing PEP-610 fail-closed
    provenance behavior.
  - Preserve the existing publication dispatch unchanged and preserve exactly one
    additional bounded AUTHOR_REPAIR dispatch to aios-self-hosted-repair-wakeup.yml
    using exact repair_dispatch_id, failed_run_id and repair_sha.
  - Update tests/aios_bridge/test_aios_phase1_control_plane.py only to stop asserting
    that publication is the only workflow dispatch. It must instead preserve Phase-1
    forbidden raw-worker/executor invariants while truthfully allowing the one bounded
    REPAIR continuation introduced by TASK-216.
  - Do not hide the REPAIR continuation by changing API spelling solely to satisfy
    the old count assertion. Verification must describe actual semantics truthfully.
  - Preserve P7.3 as NEXT, preserve TASK-215/RUN-215-002 lineage, and keep fresh c96eb8b5
    downstream conformance certification pending.
  - Preserve the RUN-216-005 candidate semantics across the original thirteen files
    unless current-base reconstruction proves a minimal correction is necessary. No
    unrelated refactor or broadened behavior.
  - Mutation must stay inside the fourteen authorized modify files. Executor must
    leave a clean working tree and must not publish.
