task_id: TASK-148
revision: 1

goal: >
  Implement post-M4 P5.3b Human Family Decision + Durable Admission Presentation by
  extending the existing Product Intelligence CLI with one bounded `family-decide`
  operation. The operation must intake persisted evidence through TASK-138, build one
  exact in-memory TASK-139 FamilyKnowledgeReviewPlan, render that exact current plan for
  Human review, accept one explicit Human proposal selection plus APPROVE/REJECT during
  the same process invocation, delegate the exact selected FamilyMergeProposal object to
  TASK-140 record_planned_family_decision, and, only for explicit APPROVE, accept one
  caller-supplied opaque family_id and delegate durable admission exactly once through
  TASK-140 durably_admit_planned_family. TASK-148 must not persist/reconstruct review
  plans or proposals, infer a family decision, generate/normalize family IDs, duplicate
  TASK-112/114/118/119/120 semantics, auto-create a catalog, or implement P5.3c variant
  presentation.

problem: >
  Published TASK-147 closes P5.3a and proves the Human-facing CLI can preserve exact
  in-process review-object lineage rather than reconstructing authority from prior JSON.
  P5.3b has the same architectural requirement. TASK-139 creates an immutable
  FamilyKnowledgeReviewPlan retaining exact TASK-112 proposal objects, while TASK-140
  permits a Human decision only for an exact proposal retained by that exact plan and
  permits durable admission only through TASK-114 then TASK-120. A naive later-process
  family approval command over serialized preview data would either reconstruct a
  FamilyMergeProposal or introduce a new persistent review authority. P5.3b therefore
  must compose intake -> planning -> preview -> Human selection -> TASK-140 decision ->
  optional TASK-140 durable admission in one invocation, while retaining every existing
  semantic owner unchanged.

assumptions:
  - >
    Canonical Python Agent main immediately before TASK-148 authoring is
    762420c1166625cb4bfe7de2c71b9b1ccac8f7a0, the published TASK-147 source candidate
    after REVIEW-147-001 PRIMARY PASS. P1-P4 are CLOSED; P5 is CURRENT / IN PROGRESS;
    P5.1, P5.2, and P5.3a are CLOSED; P5.3b is the immediate next boundary.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@67db82bf19d63f25721d06aabb82d850db8b78d4.
  - >
    src/product_intelligence/cli.py remains the sole Product Intelligence Human-facing CLI
    module. TASK-145/TASK-146/TASK-147 command behavior remains authoritative and must not
    be reopened by TASK-148.
  - >
    TASK-138 intake_product_source_evidence remains the sole bounded persisted-evidence
    intake authority. TASK-148 may pass explicit Human roots once and consume the returned
    exact SourceEvidenceInventory; it may not scan files independently or rehydrate source
    packs through another codec.
  - >
    TASK-139 plan_family_knowledge_review remains the sole P3.1 application composition
    that produces FamilyKnowledgeReviewPlan and the exact actionable TASK-112 proposal
    tuple while retaining every provisional group, including SINGLETON and CONFLICTED.
  - >
    TASK-140 record_planned_family_decision and durably_admit_planned_family remain the
    sole P3.2 application composition authority. TASK-112 owns Human family decision
    semantics, TASK-114 owns explicit approved family admission plus opaque family_id
    validation, TASK-118 owns catalog integrity, TASK-119 owns catalog codec semantics,
    and TASK-120 owns SQLite durability/transactions.
  - >
    A REJECT remains an in-memory TASK-112 decision with no durable history authority.
    TASK-148 must not invent a rejection store or successful durable no-op for REJECT.
  - >
    TASK-141 remains the P3.3 sellable-variant review/decision/admission authority. Its
    Human-facing presentation remains P5.3c and is outside TASK-148.

