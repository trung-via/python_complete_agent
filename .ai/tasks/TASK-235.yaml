constraints:
  hard:
    - >
      Classification is exactly ONE_SHOT_ATTACH_ONLY_PUBLIC_PDP_DOM_DIAGNOSTIC_AUTHORIZATION_ONLY.
      This task is a Human/Brain authorization record only; Executor must not run TikTok/CDP.
    - >
      Authorize exactly one diagnostic attempt for source ID 1731381331718341815 using the
      already-published TASK-234 diagnostic carrier. No arbitrary URL/source/query/batch override,
      no second product and no recurring authority are granted.
    - >
      Execution owner is HUMAN_OPERATOR. The operator-owned Chrome 9222 session/page must already
      be open on the exact selected PDP before invocation. The diagnostic has no navigation or
      interaction authority and must fail closed if the current page is login, challenge,
      CAPTCHA, unavailable, unrelated, malformed, unverifiable or a different product.
    - >
      The invocation requires an explicit external job root and operator-owned CDP endpoint.
      The fixed artifact is diagnostic-only structural output with evidence_authority NONE.
      It must not be treated as ProductCandidateSnapshot, SignalEvidence, Product Truth,
      canonical evidence, trend, recommendation, approval, TEST_READY or action evidence.
    - >
      Authorization grants one attempt only. There is no automatic retry, second attempt,
      refresh, resume or alternate page. If the operation fails or a Human must resolve a
      challenge, any later diagnostic attempt requires fresh Human/Brain authorization.
    - >
      Preserve TASK-233 as consumed history: authorized_capture_attempts_remaining remains 0,
      live_public_pdp_acquisition_authority remains NONE, real_pilot_executed remains true,
      live_evidence_acquired remains EXTERNAL_BOUNDED_SOURCE_ARTIFACT_ONLY, and
      canonical_evidence_ingested remains false.
    - >
      On exact reviewed TASK-235 publication, record live_dom_diagnostic_authority
      ONE_SHOT_ATTACH_ONLY_EXACT_LISTING; authorized_diagnostic_attempts 1;
      authorized_diagnostic_attempts_remaining 1; diagnostic_execution_owner HUMAN_OPERATOR;
      diagnostic_implementation_exists true; diagnostic_executed false;
      selector_repair_complete false; automated_public_pdp_acquisition_authority NONE;
      live_public_pdp_acquisition_authority NONE; market_test_or_action_authority NONE;
      automatic_progression false; next_milestone null; pending_commitments empty; and exact
      handoff HUMAN_OPERATOR_ONE_SHOT_PUBLIC_PDP_DOM_DIAGNOSTIC_EXECUTION.
    - >
      Add docs/PHASE_8_PUBLIC_TIKTOK_PDP_DOM_DIAGNOSTIC_AUTHORIZATION.md documenting the Human
      approval, exact fixed listing, one-attempt limit, attach-only/no-navigation boundary,
