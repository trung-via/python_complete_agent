task_id: TASK-097
revision: 2

goal: >
  Replace the active repository-owned Codex $aios-worker and Antigravity
  /aios-worker execution surfaces so both delegate exclusively to the frozen
  AIOS-renew kernel, with no active execution dependency on the legacy AIOS
  Bridge control plane and no manual PowerShell/Git push step in a successful
  normal RUN.

problem: >
  The current Python Agent worker surfaces still route RUN/FIX/STATUS through
  .agents/skills/aios-worker/scripts/aios_worker.py -> src.aios_bridge.worker_flow
  -> bridge.py. This creates an obsolete second execution pipeline beside
  AIOS-renew and prevents Codex surfaces that do not expose the global aios CLI
  from using the canonical kernel. Revision 1 also left two material gaps: a
  requirements.txt pin alone would not guarantee AIOS-renew is installed in the
  interpreter actually used by a worker surface, and post-PASS push was optional,
  which would still leave a manual publication step before ChatGPT review.

assumptions:
  - AIOS-renew authoritative v0.1.2 commit is
    2ee57fd87316fdf8eb52a77777c51dff6d023214.
  - AIOS-renew remains frozen; this task modifies only Python Agent integration.
  - The visible Codex/Antigravity session is an operator UI, not a second
    implementation executor.
  - The bootstrap Python interpreter used to start the repository-owned worker
    script need not already contain AIOS-renew.
  - A repository-local untracked worker runtime may live under the Git-dir AIOS
    state area and may install only the exact pinned AIOS-renew dependency.
  - Codex and Antigravity surfaces may differ only in selected executor identity;
    semantic TASK/RUN/RESULT/EVIDENCE behavior must come from the same AIOS-renew
    kernel.
  - Legacy bridge.py and src/aios_bridge may remain in repository history/source
    for archival compatibility, but must not be reachable from active
    $aios-worker or /aios-worker RUN/FIX/STATUS paths.
  - Canonical REVIEW/REMEDIATION artifacts, when available locally, live outside
    the product worktree under Git-dir AIOS state. Cloud-to-local review artifact
    transport is a separate concern and is not invented in this migration.

scope:
  inspect:
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-worker.md
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - src/aios_bridge/worker_flow.py
    - bridge.py
    - requirements.txt
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - tests/aios_bridge/test_aios_worker_control_surface.py
    - .ai/tasks/TASK-096.yaml
  modify:
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-worker.md
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - tests/aios_bridge/test_aios_worker_control_surface.py
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md

non_goals:
  - Modify AIOS-renew source or kernel semantics.
  - Add AIOS-renew to the Python Agent product/runtime requirements.txt.
  - Reintroduce planning, review, scoring, retry policy, or state authority in the
    worker surface.
  - Delete legacy AIOS Bridge history wholesale.
  - Run Codex and Antigravity for the same execution.
  - Auto-reroute from one executor to the other.
  - Auto-retry failed AIOS executions.
  - Merge, rebase, reset, checkout, stash, clean, or otherwise add a second Git
    coordination policy beside AIOS-renew.
  - Change Product Intelligence or Phase 6 product behavior.
  - Make the visible Antigravity session perform implementation after handoff;
    AIOS-renew remains responsible for invoking its Antigravity executor adapter.
  - Invent a new cloud control branch or replacement AIOS Bridge to transport
    REVIEW/REMEDIATION artifacts. FIX must fail closed if exact local lineage is
    absent or ambiguous.

constraints:
  hard:
    - Active RUN execution from both worker surfaces must enter AIOS-renew and no
      active RUN path may import src.aios_bridge, invoke bridge.py, or use
      WorkerFlowCoordinator.
    - The worker-owned dependency file must pin AIOS-renew to exact authoritative
      commit 2ee57fd87316fdf8eb52a77777c51dff6d023214 rather than an unbounded
      branch, floating tag, or package version.
    - The worker launcher must not depend on a globally installed aios executable,
      a preinstalled aios_renew package, the Python Agent product virtualenv, or a
      machine-specific absolute path such as C:\\TOOL\\Projects.
    - Before invoking AIOS-renew, the launcher must deterministically ensure a
      repository-local untracked worker runtime under the repository Git-dir AIOS
      state area. If absent or not provably bound to the authoritative commit, it
      may bootstrap that runtime by installing only the exact worker dependency.
      Bootstrap failure must fail closed before creating an AIOS RUN.
    - Runtime provenance must be checked from installed distribution metadata
      (PEP 610 direct_url metadata or an equivalently immutable source record) and
      must resolve to the exact authoritative commit/source; a stale, global, or
      unverifiable AIOS-renew install must never be used silently.
    - Runtime bootstrap must be one-time/idempotent for an already valid pinned
      runtime and must not run pip/install commands on every worker invocation.
    - RUN TASK-N from the Codex surface must select executor=codex exactly once;
      RUN TASK-N from the Antigravity surface must select executor=antigravity
      exactly once.
    - Both surfaces must pass the Python Agent repository root explicitly or
      deterministically to AIOS-renew; they must never execute AIOS-renew against
      the AIOS-renew source repository itself.
    - Codex RUN must preserve the canonical sandbox choice danger-full-access
      currently required by the proven Python Agent AIOS flow; the UI surface may
      expose no second sandbox policy.
    - The visible Codex and Antigravity operator sessions must not edit product
      implementation/test files themselves after dispatch; implementation belongs
      to the one executor invoked by AIOS-renew.
    - STATUS must be read-only and may use AIOS-renew describe_task/task semantics;
      it must not fetch/sync the product branch, authorize, execute, push, modify
      TASK, inspect/interpret RESULT lineage as a reviewer, or invoke an executor.
    - FIX must delegate to AIOS-renew run_remediation/remediate semantics only. The
      launcher may locate local REVIEW/REMEDIATION artifacts only by canonical
      filename/content fields and current immutable SHA. If one exact lineage
      cannot be resolved uniquely, including DELTA prior-review lineage, fail
      closed rather than infer or fall back to legacy Bridge behavior.
    - No worker surface may manually reconstruct TASK semantics, execute task
      verification independently of AIOS-renew, synthesize RESULT/EVIDENCE, or
      become a second reviewer.
    - No automatic retry or executor rerouting is allowed after an AIOS error.
    - Legacy bridge.py and src/aios_bridge may remain physically present but the
      active worker script, Codex skill, and Antigravity workflow must contain no
      operational instruction to call them.
    - A successful RUN/FIX with repository HEAD advancement must be published
      automatically after AIOS-renew PASS. Publication may occur only when the
      worktree is clean, local HEAD equals the canonical AIOS summary/result
      head_sha, the attached branch has a configured remote+merge upstream, and
      the push is an explicit normal non-force push of HEAD to that exact upstream
      ref. No merge/rebase/reset/checkout/stash/clean/force is allowed.
    - If AIOS-renew returns an error, the launcher must not push anything.
    - If AIOS-renew PASSes but publication fails, report AIOS PASS and publication
      failure as distinct states; do not invalidate/rewrite the canonical RESULT,
      do not retry AIOS, and preserve repository state for explicit recovery.
    - A PASS that does not advance HEAD, including evidence-only/no-op completion,
      must not create a meaningless push attempt.
    - Existing AIOS-renew PRIMARY sync and remediation no-sync semantics remain
      authoritative and must not be duplicated in this integration layer.
    - Existing Product Agent tests outside the integration surface must remain
      unchanged.

acceptance:
  - id: AC1
    condition: >
      $aios-worker RUN TASK-N enters the exact pinned AIOS-renew kernel with
      executor codex, explicit Python Agent repo root, danger-full-access sandbox,
      and no legacy bridge.py/src.aios_bridge execution dependency.
  - id: AC2
    condition: >
      /aios-worker RUN TASK-N enters the same exact pinned AIOS-renew kernel with
      executor antigravity and no legacy bridge.py/src.aios_bridge execution
      dependency; the visible Antigravity session does not implement the task.
  - id: AC3
    condition: >
      A fresh worker surface with no preinstalled AIOS-renew can bootstrap one
      repository-local untracked runtime from the exact immutable worker pin,
      prove its provenance, and reuse it on later invocations without reinstalling;
      stale/unverifiable runtimes fail closed or are deterministically rebuilt.
  - id: AC4
    condition: >
      The integration is repository-portable: it does not require global PATH
      aios, C:\\TOOL\\Projects, or mutation of the Python Agent product
      requirements/virtualenv.
  - id: AC5
    condition: >
      Codex and Antigravity surface tests prove identical semantic routing except
      for executor identity and the fixed Codex sandbox argument, with one and
      only one AIOS-renew invocation and no outer-session implementation work.
  - id: AC6
    condition: >
      STATUS is non-authorizing/read-only and FIX either calls exact AIOS-renew
      remediation lineage or deterministically fails closed when lineage is
      ambiguous/missing; neither falls back to old Bridge.
  - id: AC7
    condition: >
      Tests fail if the active worker launcher imports src.aios_bridge, calls
      bridge.py, references WorkerFlowCoordinator, uses --adapter routing, invokes
      raw task implementation logic, or performs task verification outside
      AIOS-renew.
  - id: AC8
    condition: >
      After an AIOS-renew PASS that advances HEAD, the launcher performs exactly
      one normal non-force publication to the configured upstream only after
      clean/head/upstream checks; AIOS failure performs zero push; publication
      failure is reported distinctly without rerunning AIOS or rewriting RESULT.
  - id: AC9
    condition: >
      Existing legacy Bridge files may remain as archived source but are clearly
      documented as inactive; docs show AIOS-renew as the sole active execution
      kernel for both worker surfaces and explicitly state that TASK-096 remains
      pending until this migration is certified.
  - id: AC10
    condition: >
      A bounded unit/integration test proves one RUN request produces one
      AIOS-renew call with exact task ID, repository root, executor identity and
      Codex sandbox; bootstrap is not repeated for a valid runtime and no retry,
      reroute, duplicate executor invocation, or legacy execution occurs.
  - id: AC11
    condition: >
      Unit tests cover fresh runtime bootstrap, exact immutable dependency pin,
      provenance mismatch handling, successful automatic publication, no push on
      AIOS failure/no-op PASS, publication failure preservation, STATUS read-only,
      unique FIX lineage resolution, ambiguous/missing FIX fail-closed, and DELTA
      prior-review fail-closed behavior.

verification:
  required:
    - '$env:PYTHONPATH = ".;src"; pytest tests/aios_bridge/test_aios_worker_control_surface.py -q'
    - 'git grep -n -E "src\\.aios_bridge|bridge\\.py|WorkerFlowCoordinator|--adapter" -- .agents/skills/aios-worker/SKILL.md .agents/workflows/aios-worker.md .agents/skills/aios-worker/scripts/aios_worker.py; if ($LASTEXITCODE -eq 0) { exit 1 } elseif ($LASTEXITCODE -eq 1) { exit 0 } else { exit $LASTEXITCODE }'
    - 'Select-String -Path .agents/skills/aios-worker/requirements-aios-renew.txt -SimpleMatch "2ee57fd87316fdf8eb52a77777c51dff6d023214" | ForEach-Object { $_.Line }; if (-not $?) { exit 1 }'
    - git diff --check
    - git status --porcelain
