task_id: TASK-097
revision: 5

goal: >
  Eliminate the remaining Antigravity command-resolution ambiguity by moving the
  Antigravity operator surface to a fresh repository-owned slash-command namespace
  that can only dispatch the shared pinned AIOS-renew launcher, while turning the
  contaminated legacy /aios-worker namespace into a fail-closed deprecation stub.

problem: >
  Production evidence showed that invoking /aios-worker from Antigravity could still
  resolve a stale/legacy workflow and execute bridge.py even though main contains the
  migrated AIOS-renew workflow. Because slash-command resolution happens before the
  repository launcher can enforce kernel provenance, reusing the same historical
  Antigravity command name is not a reliable safety boundary. The fix must make a
  stale/old branch or cached workflow fail closed rather than silently enter legacy
  AIOS Bridge execution.

assumptions:
  - AIOS-renew authoritative v0.1.2 commit remains
    2ee57fd87316fdf8eb52a77777c51dff6d023214 and stays frozen.
  - The shared launcher .agents/skills/aios-worker/scripts/aios_worker.py and Codex
    $aios-worker path passed production certification and are not part of this fix.
  - Antigravity maps repository workflow filenames to slash-command names.
  - A fresh command name that does not exist in legacy branches/caches provides a
    fail-closed namespace boundary: stale environments cannot accidentally execute
    old semantics under the new name.
  - TASK-098 remains pending and must not be modified or executed by this task.

scope:
  inspect:
    - .agents/workflows/aios-worker.md
    - .agents/skills/aios-worker/SKILL.md
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - tests/aios_bridge/test_aios_worker_control_surface.py
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - .ai/tasks/TASK-098.yaml
  modify:
    - .agents/workflows/aios-worker.md
    - .agents/workflows/aios-renew-worker.md
    - tests/aios_bridge/test_aios_worker_control_surface.py
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md

non_goals:
  - Modify AIOS-renew source, pin, runtime bootstrap, publication, or kernel semantics.
  - Modify the shared launcher or Codex $aios-worker skill.
  - Modify bridge.py, src/aios_bridge, Product Intelligence, TASK-098, or product code.
  - Delete legacy history or rewrite old branches.
  - Add retries, rerouting, branch checkout, merge, rebase, reset, stash, clean, or a
    second Git coordination policy.
  - Make the visible Antigravity session implement product tasks.

constraints:
  hard:
    - The new canonical Antigravity command must be /aios-renew-worker and must be
      defined only by .agents/workflows/aios-renew-worker.md.
    - /aios-renew-worker RUN TASK-N must dispatch exactly once to the checked-in
      shared launcher .agents/skills/aios-worker/scripts/aios_worker.py with
      --executor antigravity and no other executor or adapter path.
    - /aios-renew-worker FIX and STATUS must preserve the same shared-launcher
      semantics already certified by TASK-097 revision 4.
    - The new workflow must use the existing deterministic Python 3.11+ bootstrap
      host resolution contract and must not invoke raw agy, bridge.py,
      src.aios_bridge, WorkerFlowCoordinator, --adapter, or product implementation.
    - The visible Antigravity session is operator UI only. After dispatch it must not
      inspect TASK implementation context, edit product files, execute verification,
      synthesize evidence, review semantics, retry, reroute, or continue coding.
    - The historical /aios-worker workflow on main must become a fail-closed
      deprecation stub. It must execute zero shell/Python/Git/launcher commands and
      must only report ANTIGRAVITY_SURFACE_DEPRECATED plus the exact replacement
      command namespace /aios-renew-worker.
    - The deprecated /aios-worker workflow must contain no operational reference to
      bridge.py, src.aios_bridge, WorkerFlowCoordinator, --adapter, raw agy, or the
      shared launcher.
    - The new /aios-renew-worker workflow must contain no operational reference to
      any legacy Bridge execution path.
    - Codex $aios-worker behavior, shared launcher code, AIOS-renew pin, bootstrap
      runtime, publication logic, and TASK-098 must remain byte-for-byte unchanged.
    - Documentation must state that Antigravity uses /aios-renew-worker from now on,
      /aios-worker is permanently retired/fail-closed, and a fresh/reloaded
      Antigravity session on main is required before first use.
    - No implementation/publish action may occur for TASK-098 in this task.

acceptance:
  - id: AC1
    condition: >
      A fresh Antigravity session on main exposes /aios-renew-worker as the only
      active Antigravity execution surface and its RUN command delegates exactly once
      to the shared launcher with executor antigravity.
  - id: AC2
    condition: >
      The old /aios-worker workflow is a pure fail-closed deprecation stub with zero
      command execution and cannot invoke the launcher or any legacy Bridge path.
  - id: AC3
    condition: >
      Tests prove /aios-renew-worker RUN/FIX/STATUS preserve the revision-4 launcher
      contract, including deterministic bootstrap-host resolution and one dispatch.
  - id: AC4
    condition: >
      Tests fail if the new workflow references bridge.py, src.aios_bridge,
      WorkerFlowCoordinator, --adapter, raw agy, or visible-session implementation.
  - id: AC5
    condition: >
      Tests prove the deprecated /aios-worker workflow has no executable command
      surface and emits the deterministic deprecation reason/replacement namespace.
  - id: AC6
    condition: >
      Codex $aios-worker, shared launcher, AIOS-renew pin/runtime/publication, product
      code, and TASK-098 are unchanged.
  - id: AC7
    condition: >
      Documentation records the hard namespace cutover and explains that stale
      Antigravity branches/caches lacking /aios-renew-worker fail closed instead of
      falling back to legacy /aios-worker semantics.
  - id: AC8
    condition: >
      After this task passes, TASK-098 remains the first production certification run
      and must be invoked only with /aios-renew-worker RUN TASK-098.

verification:
  required:
    - '$env:PYTHONPATH = ".;src"; pytest tests/aios_bridge/test_aios_worker_control_surface.py -q'
    - 'git grep -n -E "bridge\\.py|src\\.aios_bridge|WorkerFlowCoordinator|--adapter|agy --print" -- .agents/workflows/aios-renew-worker.md; if ($LASTEXITCODE -eq 0) { exit 1 } elseif ($LASTEXITCODE -eq 1) { exit 0 } else { exit $LASTEXITCODE }'
    - '$old = Get-Content .agents/workflows/aios-worker.md -Raw; if ($old -notmatch "ANTIGRAVITY_SURFACE_DEPRECATED" -or $old -notmatch "/aios-renew-worker") { exit 1 }; if ($old -match "aios_worker\\.py|bridge\\.py|src\\.aios_bridge|WorkerFlowCoordinator|--adapter|agy") { exit 1 }'
    - 'git diff --check'
    - 'git status --porcelain'
