task_id: TASK-144
revision: 1

goal: >
  Complete post-M4 P4 live provider certification through a supported Google Cloud
  Application Default Credentials path by extending the repository's existing single
  GeminiProvider with an explicit Vertex AI backend mode and adding one credentialed
  live grounded-QA certification through the unchanged TASK-135 -> TASK-133 -> TASK-132
  -> TASK-129 chain. Preserve the existing Gemini Developer API/API-key mode as the
  default compatibility path, introduce no automatic fallback/reroute, and close P4 only
  after the exact TASK-144 Runtime and ChatGPT semantic-review gates PASS.

problem: >
  TASK-142 closed P4.1 by modernizing the existing GeminiProvider to google-genai==2.22.0
  and certifying its generic transport offline. TASK-143 then attempted the P4.2 live proof
  through the Gemini Developer API/API-key path, but repeated canonical RUNs remained
  blocked by external provider/authentication availability while the candidate stayed
  clean and all focused offline regressions passed. The TASK-143 lineage is therefore
  parked and must not be blindly retried or mutated. Current Google documentation supports
  Gemini 3.8 Flash on the Google Cloud global endpoint with Application Default
  Credentials, and the exact google-genai 2.22.0 source supports ADC in explicit Vertex AI
  mode while its non-Vertex Gemini Developer API mode still requires an API key. P4 can
  therefore proceed through the same GeminiProvider and same generic M4 authority chain by
  adding one explicit Vertex AI ADC transport mode rather than waiting indefinitely for the
  Developer API auth-key blocker or introducing a second provider.

assumptions:
  - >
    Canonical Python Agent main immediately before TASK-144 authoring is
    af6c144ce42020903446b1f2313fe49106b5f66d, the TASK-143 authoring commit. TASK-143 has
    no reviewed/published source candidate; its latest parked failure lineage ends at
    RUN-143-007 with exact failed candidate 273f24d115cf116aeddadaaad9afb4990eb43bcd.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@67db82bf19d63f25721d06aabb82d850db8b78d4.
  - >
    P1, P2, and P3 are CLOSED. P4 is CURRENT / IN PROGRESS. TASK-142/P4.1 is CLOSED;
    P5 has not advanced.
  - >
    src/providers/base.py LLMProvider, LLMResponse, and ProviderToolCall remain the sole
    generic provider transport contract. src/providers/gemini.py GeminiProvider remains
    the sole concrete Gemini adapter and the only provider implementation changed here.
  - >
    TASK-129 remains sole GroundedAnswer structural-validation authority; TASK-131 remains
    prompt/schema-framing authority; TASK-132 remains exactly-one generic provider
    invocation plus syntactic response parsing; TASK-133 remains context-to-answer
    composition; TASK-134 remains retrieval-query planning; TASK-135 remains persistent
    grounded-QA startup/composition.
  - >
    Exact google-genai==2.22.0 supports explicit Vertex AI construction with
    vertexai=True plus project/location and can obtain Google credentials through ADC.
    Its non-Vertex Gemini Developer API path still requires an API key, so TASK-144 must
    not pretend that genai.Client(credentials=...) is an equivalent supported direct
    Developer API path under this exact repository dependency.
  - >
    Gemini 3.8 Flash is GA on the Google Cloud global endpoint. TASK-144 fixes the live
    certification subject to model gemini-3.8-flash and location global; this is a bounded
    certification configuration, not model-selection or regional-routing authority.
  - >
    Human/environment setup of Google Cloud ADC, project access, billing, enabled Google
    Cloud API, and IAM remains an external prerequisite. Repository code must not create,
    download, refresh-store, or persist OAuth client secrets/tokens itself.

