task_id: TASK-255
revision: 1

goal: >
  Execute BP9-P1A by migrating Python Agent's sole active AIOS-renew runtime authority
  from exact pin edd7d8d92d54900c56442bbfcddb8648ec4d2e09 to exact reviewed and
  source-published BP8 pin 2cf7ba01222891bb5470b231fee01b7122e39cab, while atomically
  porting only the repository-owned Phase-1/Phase-2 carrier compatibility required by
  that pin: execution-profile resolution, exact TASK semantic identity, trusted
  transient control-source isolation, bounded Operational Receipt v2, and current safe
  publication control. Preserve the already-authored TASK-254 r4 product commitment
  untouched and leave fresh downstream conformance pending for later TASK-207 r9.

problem: >
  Python Agent currently pins AIOS-renew edd7d8d92d54900c56442bbfcddb8648ec4d2e09
  and is certified through TASK-207 r8 for that old pin. Upstream AIOS-renew BP8 is now
  complete through TASK-194 r1 / RUN-194-001 / REVIEW-194-001 with exact reviewed and
  safely published source 2cf7ba01222891bb5470b231fee01b7122e39cab. A fresh downstream
  audit shows that a pin-only update is unsafe: current Python Agent PRIMARY,
  REMEDIATION and REPAIR carrier workflows predate exact task revision/blob/commit
  binding, repository execution-profile policy, model/effort source attribution,
  trusted transient control-source isolation and Operational Receipt v2. The current
  publisher also predates current-control-SHA publication binding. TASK-255 must move
  the pin and these compatibility bindings together in one reviewed candidate without
  copying upstream lifecycle authority or adopting Brain/Reviewer semantic registries;
  those registries are reserved for BP9-P1B / TASK-256.

assumptions:
  - >
    Canonical Python Agent main at authoring is
    27ac741dd4fe6630b5638b85684c3ecaff69bc21. Its Brain-owned roadmap records
    AIOS_BP9_BRAIN_PORTABILITY_DOWNSTREAM_ADOPTION as a Human-prioritized side-track,
    BP9-P1A / TASK-255 r1 as NEXT, BP9-P1B / TASK-256 as PLANNED, fresh TASK-207 r9
    conformance after TASK-256 publication, and TASK-254 r4 as AUTHORED_UNEXECUTED
    resume target.
  - >
    Current sole downstream AIOS-renew dependency pin and worker AUTHORITATIVE_COMMIT
    are exactly edd7d8d92d54900c56442bbfcddb8648ec4d2e09.
  - >
    Exact target 2cf7ba01222891bb5470b231fee01b7122e39cab is eligible under
    EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY policy because TASK-194 r1 produced
    zero-delta RUN-194-001, REVIEW-194-001 is PRIMARY PASS, and the safe Publisher
    completed exact publication/replay of that reviewed source. Later AIOS-renew
    roadmap-only commit 7eca2f912500297882bcaa5362b455d114729b63 is not runtime
    authority and must not be adopted.
  - >
    RUN-194-001 Runtime evidence records one controlled real Reviewer call with
    outcome VALIDATED_DECISION, provider antigravity, model gemini-3.8-flash,
    explicit effort high, invocation_count 1, exact request identity, validated
    decision fingerprint and native usage witness. That proof is upstream provenance;
    its proof-specific high effort is not a Python Agent Reviewer or Executor default.
  - >
    Python Agent carrier policy YAML files already match the target carrier-policy
    contracts except repository identity and therefore require no mutation in P1A.
  - >
    Python Agent has no repository-owned scripts/aios_control_entry.py today. The
    target-pin self-host carrier semantics require an equivalent downstream-specific
    trusted entry that bootstraps/invokes only the exact pinned AIOS-renew runtime
    from a transient checkout of the exact downstream control commit; blindly copying
    the upstream AIOS-renew source-tree entry would be invalid because Python Agent
    does not contain src/aios_renew.
  - >
    .ai/aios-conformance-state.yaml remains the immutable publication-effective
    certification record for TASK-207 r8 under edd7d8d... until a fresh TASK-207 r9
    is authored and published after P1B. TASK-255 is migration, not conformance.
  - >
    TASK-254 r4 has no RUN, FAILURE or REVIEW lineage and must remain byte-identical
    and unexecuted throughout this migration.

