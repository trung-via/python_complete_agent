non_goals:
  - >
    Modify, execute, supersede, revise, review, publish, or reinterpret TASK-254 r4
    or any Product Intelligence/TikTok/product source, evidence, browser/session,
    collector, parser, scoring, ranking or market-action semantic.
  - >
    Modify .ai/roadmap-state.yaml from Executor implementation. BP9 planning phase
    advancement remains Human/Brain-owned and occurs only after publication.
  - >
    Modify .ai/aios-conformance-state.yaml or claim TASK-207 r8 certifies the new pin.
  - >
    Add .ai/flow-cards.yaml, .ai/brain-audit-profiles.yaml,
    .ai/brain-return-contracts.yaml, .ai/reviewer-procedure-profiles.yaml or
    .ai/reviewer-return-contracts.yaml. Those repository-owned semantic registries are
    BP9-P1B / TASK-256 scope.
  - >
    Perform a real Brain or Reviewer provider invocation, call Gemini, access external
    provider APIs, or use provider/network availability as verification.
  - >
    Make antigravity, gemini-3.8-flash or reasoning effort high a downstream default.
    BP8's real-provider proof choice is provenance only.
  - >
    Copy upstream AIOS-renew workflows byte-for-byte without preserving Python Agent
    repository identity, install-from-exact-pin behavior, actor policy, runner labels,
    existing Human worker surfaces and downstream bootstrap boundaries.
  - >
    Activate an upstream .agents hook, vendor AIOS-renew source, add a floating ref,
    second runtime authority, lifecycle router, Planner, generic provider router,
    retry/fallback/failover, automatic correction selector, scheduler, queue, broker
    or persistent model memory.
  - >
    Freshly certify downstream conformance. That is reserved for TASK-207 r9 after
    TASK-256 publication.

constraints:
  hard:
    - >
      The sole active dependency line and aios_worker.AUTHORITATIVE_COMMIT must become
      exactly 2cf7ba01222891bb5470b231fee01b7122e39cab. Existing PEP-610
      source-plus-commit provenance validation must remain fail-closed for stale,
      alternate, floating or unverifiable runtimes.
    - >
      Add exactly one repository-owned execution-profile policy at
      .ai/executor-profiles.yaml compatible with the target pin: codex default model
      gpt-6-sol / default effort medium and antigravity default model
      gemini-3.8-flash / default effort medium; each supports only low, medium and
      high. This policy does not select an Executor and must not encode the BP8
      proof-specific high effort as a default.
    - >
      Hosted PRIMARY admission must bind one exact TASK revision, TASK blob SHA and
      TASK authoring/control commit plus exactly one resolved executor/model/effort
      profile with explicit REPOSITORY_DEFAULT or EXPLICIT source attribution before
      dispatch. The downstream issue carrier remains actor/title/repository bound and
      must install/use only the exact pinned AIOS package.
    - >
      Hosted REMEDIATION and REPAIR admission must likewise resolve and propagate the
      exact execution profile permitted by the target pin. REPAIR preserves the
      no-Executor shape when Runtime semantics require it; no carrier may infer or
      force a coding Executor.
    - >
      PRIMARY, approved-REMEDIATION and REPAIR self-host workflows must consume a
      trusted transient checkout of the exact downstream invocation/control commit
      outside the persistent AIOS_REPO_ROOT, fail closed before AIOS on missing,
      dirty, mismatched or ambiguous control source, and remove that transient source
      after use. They must not use mutable persistent workspace files as control code.
    - >
      Add a downstream-specific scripts/aios_control_entry.py that contains no lifecycle,
      review, publication, routing or semantic authority. It may only resolve the
      exact repository-owned worker bootstrap from the supplied transient Python Agent
      control source, establish the exact pinned runtime through the existing immutable
      pin/provenance mechanism, and invoke the selected aios_renew.operator operation
      once with the already-resolved bounded selectors. It must not depend on a local
      src/aios_renew tree and must not choose an operation, Executor, model or effort.
    - >
      The self-host PRIMARY invocation must transmit dispatch_id, task_id,
      task_revision, task_blob_sha, task_commit_sha, executor, model,
      reasoning_effort, model_source and effort_source exactly once. Approved
      REMEDIATION and REPAIR must transmit their existing immutable selector identities
      plus the exact resolved profile fields. No automatic retry, fallback, reroute or
      second AIOS invocation is permitted.
    - >
      Pre-AIOS/self-host operational failures must produce bounded
      AIOS_OPERATIONAL_RECEIPT v2 with family, immutable delivery identity, selectors,
      PRE_AIOS typed cause, run_created=false and executor_invoked=false. Successful
      dispatch receipts may report dispatch acceptance or canonical terminal pointer
      but must never claim RUN success, verification, review or publication solely from
      transport status.
    - >
      Brain ingress must remain the sole actor-gated authoring/review ingress and must
      port only target-pin-compatible bounded post-canonicalization handoffs, including
      repair authorization delivery when canonical ingress output supplies a repair SHA.
      It must not itself select correction semantics or execute a repair.
    - >
      Safe publication must resolve the exact canonical review-decision ref and current
      canonical publication control SHA, invoke only the pinned publication gate, and
      publish only the exact eligible reviewed source candidate. Review-decision,
      artifact, remediation or planning commits must never become source publication.
    - >
      Preserve Python Agent repository identity, authorized Human actor, all existing
      issue title bounds, Codex-versus-Antigravity Human surface separation, and
      self-host labels [self-hosted, windows, x64, python-complete-agent]. Carrier
      policy YAML files and aios-terminal-attention.yml remain byte-unchanged because
      fresh audit found no semantic delta beyond repository/install identity.
    - >
      Existing compatibility bootstrap scripts aios_phase1_wakeup.py,
      aios_phase2_remediation.py and aios_phase2_repair.py remain byte-unchanged unless
      the new control entry can be proven impossible without changing them. If such a
      conflict exists, stop unresolved rather than silently widening scope.
    - >
      .ai/aios-adoption-state.yaml must move downstream_pin to exact 2cf7ba... and
      record upstream reviewed/source-published provenance through TASK-194 r1 /
      RUN-194-001 / REVIEW-194-001. It must classify the newly available BP1-BP8
      package capabilities separately from repository binding activation, mark fresh
      full downstream conformance for TASK-207 r9 as PENDING_FRESH_CERTIFICATION, and
      preserve TASK-207 r8 / edd7d8d... as immutable prior-pin certification history.
      Older historical certification/failure records remain intact.
    - >
      New Brain/Reviewer semantic capability families made available by the target pin
      must be marked repository-binding REQUIRED_PENDING until TASK-256 adds their
      repository-owned registries. Package availability alone must not imply that
      Python Agent has activated those semantic surfaces.
    - >
      .ai/aios-conformance-state.yaml remains byte-identical and continues to describe
      only publication-effective TASK-207 r8 certification under edd7d8d.... Tests
      must distinguish ACTIVE_PIN=2cf7ba... from CERTIFIED_PRIOR_PIN=edd7d8d... instead
      of rewriting old certification truth.
    - >
      The Brain-owned roadmap side-track and TASK-254 r4 file remain byte-identical
      during Executor implementation. TASK-255 must not mark P1A DONE, advance P1B,
      revise TASK-254 or resume product work.
    - >
      Documentation updates may describe the exact new pin, execution-profile provenance,
      transient control-source and Operational Receipt v2 boundaries, but must not copy
      Runtime implementation semantics or make mutable upstream main authoritative.
    - >
      Verification is deterministic, offline, non-interactive and provider/network
      independent. Workflow tests inspect/configure static carrier semantics only and
      must not dispatch GitHub Actions, invoke real self-host runners or call external
      providers.
    - >
      Mutation is confined exactly to the authorized modify list. Executor must leave
      zero unresolved implementation items and must not review, publish or advance the
      roadmap.

acceptance:
  - id: AC1
    condition: >
      The implementation has exactly one active AIOS-renew runtime authority at
      2cf7ba01222891bb5470b231fee01b7122e39cab in both the immutable dependency pin
      and worker AUTHORITATIVE_COMMIT, with stale/alternate provenance still fail-closed,
      and one repository execution-profile policy with only the prescribed two
      executor defaults and low/medium/high effort sets.
  - id: AC2
    condition: >
      PRIMARY carrier implementation binds exact task revision/blob/commit and one
      resolved execution profile before dispatch, and its self-host path uses one
      exact transient control source plus bounded Operational Receipt v2 rather than
      mutable workspace control code.
  - id: AC3
    condition: >
      REMEDIATION and REPAIR carrier implementations preserve their existing immutable
      semantic selectors while adding exact profile provenance, transient control-source
      isolation and Operational Receipt v2, with REPAIR no-Executor semantics preserved
      and no retry/fallback/reroute path.
  - id: AC4
    condition: >
      A downstream-specific authority-neutral control entry exists and only bootstraps
      the exact pinned runtime from the supplied transient Python Agent control source
      before one already-selected operator invocation; it contains no lifecycle,
      semantic, provider-selection, review or publication decision logic.
  - id: AC5
    condition: >
      Brain ingress and safe publication are compatible with the target pin's bounded
      repair handoff and current-control-SHA publication contract while preserving
      actor gating, exact reviewed-source publication and Python Agent repository
      identity.
  - id: AC6
    condition: >
      Carrier policy YAMLs, terminal-attention workflow, legacy phase bootstrap scripts,
      product source, TASK-254 r4, Brain-owned roadmap planning and conformance
      certification record remain unchanged, and no upstream hook or second lifecycle
      authority is activated.
  - id: AC7
    condition: >
      Adoption state identifies 2cf7ba... as the active exact reviewed/source-published
      package pin, preserves edd7d8d... TASK-207 r8 certification as prior-pin history,
      marks TASK-207 r9 fresh conformance pending, and leaves Brain/Reviewer repository
      binding activation pending for BP9-P1B rather than claiming capability activation.
  - id: AC8
    condition: >
      Focused offline regression coverage represents the new exact task/profile
      selectors, pre-AIOS operational receipts, transient control-source isolation,
      downstream control entry, repair/remediation no-reroute boundaries, safe
      publication control SHA, old-pin conformance preservation and exact new-pin
      provenance without performing any real provider or GitHub dispatch operation.

