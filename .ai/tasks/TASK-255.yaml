task_id: TASK-255
revision: 4

goal: >
  Execute BP9-P1A as one exact legacy-bootstrap downstream migration from Python Agent's
  current installed AIOS-renew generation edd7d8d92d54900c56442bbfcddb8648ec4d2e09
  to the first exact reviewed migration-capable generation
  83115b26df85a7ad6643f317833e18b18586bdbe, then adopt the exact current reviewed/
  published AIOS-renew source 45c46397914aadf20cb4cb6b874f274da43e2b9c as the sole
  downstream dependency authority using only the TASK-197/TASK-198 migration architecture
  and repository-owned compatibility changes required by BP9-P1A. Preserve TASK-254 r4,
  old-pin conformance history, and leave P1B semantic registries to TASK-256.

problem: >
  TASK-255 r3 targeted 615a13ab519d5d285801cc79e40cb5e25bb16617 but its legacy
  downstream generation predates migrate-primary. Carrier attempts reached the old bootstrap
  boundary and failed before a canonical TASK-255 RUN/Executor. TASK-257 diagnosed that
  boundary read-only. Upstream TASK-197 then published reusable N-to-N+1 migrate-primary and
  TASK-198 published a bounded one-time bootstrap-primary compatibility edge for legacy
  installed generations. Exact upstream main is now
  45c46397914aadf20cb4cb6b874f274da43e2b9c. The downstream must consume those published
  semantics rather than retrying r3 or allowing synchronized target source to self-authorize.
  Because TASK-198 intentionally restricts bootstrap-primary to first reviewed migration-capable
  generation 83115b26df85a7ad6643f317833e18b18586bdbe, r4 must respect that exact authority edge
  and must not pretend the legacy generation can directly authorize arbitrary later source.

assumptions:
  - >
    Canonical Python Agent main at authoring is
    49b88606b0047b88086bd848e7530646355cdfbd.
  - >
    The sole active downstream AIOS dependency and worker provenance remain exactly
    edd7d8d92d54900c56442bbfcddb8648ec4d2e09; TASK-207 r8 remains prior-pin certification.
  - >
    TASK-255 r1-r3 and their failed/pre-AIOS attempts are immutable history. No r3 retry,
    REPAIR, RUN resurrection, or fabricated failure is authorized.
  - >
    TASK-257 r1 is diagnostic-only and grants no migration authority.
  - >
    Upstream TASK-197 is exact-source published through
    83115b26df85a7ad6643f317833e18b18586bdbe and provides reusable migrate-primary.
  - >
    Upstream TASK-198 / RUN-198-002 / REVIEW-198-001 are exact-source published at
    45c46397914aadf20cb4cb6b874f274da43e2b9c and provide only the bounded legacy
    bootstrap into the TASK-197 handoff. TASK-198 does not approve this downstream adoption.
  - >
    Current upstream execution-profile policy remains Codex gpt-6-sol/high with efforts
    [none, low, medium, high, xhigh, max], and Antigravity gemini-3.8-flash/medium with
    [low, medium, high].
  - >
    TASK-254 r4 is canonically authored/unexecuted and must remain byte-identical.
    P1B/TASK-256 and fresh TASK-207 r9 remain later publication-gated steps.

