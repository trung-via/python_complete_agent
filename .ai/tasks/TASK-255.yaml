    product code, Product Intelligence semantics, marketplace/browser/session/evidence state,
    or automatically advance BP9 planning.
  - >
    Add the five P1B Brain/Reviewer semantic registries. They remain TASK-256 scope.
  - >
    Retry TASK-255 r3, revive its pre-AIOS attempts, sequentially execute ordinary PRIMARY
    against intermediate historical tasks, or fabricate canonical lifecycle artifacts.
  - >
    Let target/current synchronized AIOS source attest or authorize the legacy generation.
    The exact installed legacy distribution witness and immutable migration intent are mandatory.
  - >
    Create a second Runtime, migration daemon, lifecycle router, Planner, Reviewer, Publisher,
    retry/fallback/failover authority, provider selector, scheduler, queue, broker, or floating pin.
  - >
