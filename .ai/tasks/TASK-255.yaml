    or rewrite the consumed r5 handoff, fabricate a new r5 RUN, or reinterpret historical
    RUN-255 failures.
  - >
    Pin the r6 candidate directly to activation source
    275067b56cfd1dc9f7faf99fa2a3192e7cf48eec or any mutable/latest upstream SHA during
    the source-bootstrap RUN. Movement from exact first consumer pin 31fd2482... to a
