constraints:
  hard:
    - >
      Before any TASK-255 r6 RUN or Executor invocation, Runtime recovery must be
      performed from exact reviewed/published activation source
      275067b56cfd1dc9f7faf99fa2a3192e7cf48eec and must target exact consumer
      31fd2482cd87d97fd818e05eb5b4dcec69ffeee6. The recovery operation itself creates no
      RUN and invokes no Executor.
    - >
      Recovery may supersede only the exact selected prior TASK-255 r5 source-bootstrap
      v2 edge after independently proving it is consumed, uncompleted, unsuperseded and
      has no bound RUN; that the installed legacy generation is exact edd7d8d...; that
      current downstream main is clean, attached and a fast-forward descendant of the old
      source control; that the legacy pin path/content/blob is unchanged; that TASK id is
      still TASK-255; that revision 6 is exactly Brain-authored at current source control;
      and that Executor remains codex. Malformed, ambiguous, conflicting, stale, dirty,
      detached, pin-changed, completed, bound-RUN or non-fast-forward state fails closed.
    - >
      Old r5 marker, consumed evidence, bound intent, transport and historical RUN state
      are immutable. Supersession is additive only, with exact predecessor/replacement
      linkage. Do not delete, rename, overwrite, compact, reset or hand-edit Runtime
      migration history to make recovery pass.
    - >
      Only the exact recovered r6 replacement handoff may be consumed by source
      31fd2482.... Its target-side source proof must establish that the running source is
      exactly the bound target; it then admits ordinary run_task(... synchronize=False ...)
      for TASK-255 r6. At most one canonical r6 RUN and one Executor invocation may
      result. Replay must reconcile idempotently or fail closed without a second RUN.
    - >
      Recovery/admission truth is Runtime-owned and is not an Executor acceptance claim.
      Executor completion must not pre-assert Runtime verification, migration completion,
      review, or publication truth. Acceptance below concerns only the committed r6
      downstream candidate and Executor-owned unresolved state.
    - >
      The resulting candidate must leave exactly one active AIOS-renew dependency and
      repository-owned worker provenance at
      31fd2482cd87d97fd818e05eb5b4dcec69ffeee6. requirements-aios-renew.txt,
      aios_worker AUTHORITATIVE_COMMIT/PIN_LINE, worker documentation, adoption state and
      repository-owned exact-pin assertions must agree. No edd7d8..., ff29666d...,
      bbc8f09..., 275067b5... or floating pin may remain active as current dependency
      authority; historical provenance may name them only with explicit historical roles.
    - >
      Port the exact consumer execution-profile policy: Codex default gpt-6-sol/high with
      supported efforts [none, low, medium, high, xhigh, max] in that order; Antigravity
      gemini-3.8-flash/medium with [low, medium, high]. Preserve Human override precedence
      and immutable model/effort provenance across applicable PRIMARY, REMEDIATION and
      REPAIR carriers.
    - >
      Port repository-owned carrier compatibility present at exact consumer 31fd2482...,
      including non-target remediation fan-out hygiene, exact selector/profile
      propagation, bounded Operational Receipt semantics, safe publication bindings and
      trusted transient control isolation where the adopted AIOS contract requires it.
      Preserve Python Agent repository/actor/runner policy instead of blindly copying
      upstream repository identity.
    - >
      Existing aios_phase1_wakeup.py, aios_phase2_remediation.py and
      aios_phase2_repair.py remain byte-identical. If exact consumer compatibility
      requires editing those legacy bootstrap scripts, stop unresolved rather than widen
      scope.
    - >
      .ai/aios-adoption-state.yaml must preserve edd7d8... / TASK-207 r8 as historical
      old-pin certification only; record TASK-199/TASK-200/TASK-201/TASK-202/TASK-203
      migration/adoption provenance with the distinction activation source
      275067b5... versus first adopted consumer pin 31fd2482...; mark fresh post-pin
      TASK-207 certification pending; and keep P1B semantic registries REQUIRED_PENDING.
      Planning/adoption metadata does not itself prove Runtime migration completion.
    - >
      .ai/aios-conformance-state.yaml, .ai/roadmap-state.yaml, TASK-254 r4, TASK-258 r1,
      carrier policy YAMLs, terminal-attention workflow, product code and the three legacy
      phase bootstrap scripts remain byte-identical.
    - >
      Runtime owns deterministic verification. Executor returns one clean candidate with
      zero unresolved implementation items and does not review, publish, mutate roadmap
      state, execute TASK-254, begin P1B, perform fresh conformance certification, or move
      the pin beyond 31fd2482....

acceptance:
  - id: AC1
    condition: >
      The committed candidate has exactly one active AIOS-renew dependency/provenance
      authority at 31fd2482cd87d97fd818e05eb5b4dcec69ffeee6 across requirements,
      aios_worker, documentation, adoption state and repository-owned exact-pin
      assertions, with no active intermediate, activation-source, legacy or floating pin.
  - id: AC2
    condition: >
      Repository execution-profile policy and applicable carrier bindings exactly express
      Codex gpt-6-sol/high with efforts [none, low, medium, high, xhigh, max] and
      Antigravity gemini-3.8-flash/medium with [low, medium, high], preserving explicit
      Human override precedence and exact model/effort provenance.
  - id: AC3
    condition: >
      Repository-owned PRIMARY/REMEDIATION/REPAIR/publication carrier compatibility
      required by exact consumer 31fd2482... is present without broadening Python Agent
      actor/repository/runner policy, including clean non-target remediation fan-out,
      bounded operational receipts, exact selectors and safe publication binding.
  - id: AC4
    condition: >
      Adoption state preserves historical old-pin certification/failure lineage, records
      exact TASK-199 through TASK-203 migration provenance and the activation-source versus
      consumer-pin distinction, marks fresh post-pin conformance certification pending,
      and leaves P1B semantic registries REQUIRED_PENDING.
  - id: AC5
    condition: >
      .ai/roadmap-state.yaml, .ai/aios-conformance-state.yaml, TASK-254 r4, TASK-258 r1,
      product code, carrier policy YAMLs, terminal-attention workflow and the three legacy
      phase bootstrap scripts remain unchanged.
  - id: AC6
    condition: >
      The candidate introduces no second lifecycle authority, generic router,
      retry/fallback/failover, migration daemon, Planner, Reviewer, Publisher or automatic
      successor selector; no P1B, product, TASK-254 or fresh certification work begins.
  - id: AC7
    condition: >
      Executor reports zero unresolved implementation items and the candidate changes
      only the authorized modification scope. AC7 does not assert or require Runtime
      verification PASS, semantic review PASS, publication, or migration completion before
      the completion gate.

