  - >
    TASK-258 r1 at current downstream main is an authored historical transport attempt.
    Canonical GitHub state contains no RUN-258 or FAILURE-258 artifact. TASK-258 must not
    be executed, repaired, repurposed, or used as the authority path for r6.
  - >
    Upstream TASK-202 / RUN-202-003 / REVIEW-202-002 is reviewed and published at exact
    consumer SHA 31fd2482cd87d97fd818e05eb5b4dcec69ffeee6. That source contains the
    transactional source-bootstrap recovery semantics and repository-default executor
