      Canonical migration evidence proves exact activation source bbc8f09..., exact legacy
      installed witness edd7d8d..., exact source-control bootstrap target ff29666d..., exact
      Python Agent source-control/pin/TASK/Executor binding, and no pre-edge RUN/Executor
      fabrication or target self-authorization.
  - id: AC2
    condition: >
      Exactly one TASK-255 r5 implementation RUN executes under the bound ff29666d target
      with synchronization disabled and at most one Executor invocation; stale/replay/
      mismatched state reconciles or fails closed without a second RUN.
  - id: AC3
    condition: >
      The resulting downstream candidate has one exact final AIOS dependency/provenance
      authority bbc8f09..., no active intermediate pin, and exact Codex/Antigravity
      execution-profile policy and provenance matching the final upstream pin.
  - id: AC4
    condition: >
      Repository-owned Phase-1/Phase-2 carriers remain Python-Agent-specific but compatible
