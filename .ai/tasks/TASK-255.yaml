constraints:
  hard:
    - >
      The sole active requirements pin and worker AUTHORITATIVE_COMMIT must become
      exactly 615a13ab519d5d285801cc79e40cb5e25bb16617. Existing PEP-610
      repository-plus-commit provenance validation remains fail-closed against stale,
      alternate, floating or unverifiable package sources.
    - >
      Add exactly one downstream repository execution-profile policy with Codex
      default_model gpt-6-sol, default_reasoning_effort high and supported efforts
      [none, low, medium, high, xhigh, max] in that order; Antigravity remains
      gemini-3.8-flash/medium with [low, medium, high]. Human explicit selection
      continues to outrank defaults.
    - >
      PRIMARY hosted admission must bind the exact TASK id/revision/blob SHA/authoring
      commit plus exactly one resolved executor/model/effort profile and source
      attribution before dispatch. No carrier may infer task meaning or re-resolve a
      bound profile after admission.
    - >
      REMEDIATION and REPAIR hosted admission must preserve their existing immutable
      correction selectors while resolving/propagating exact execution-profile
      provenance. Coding REPAIR requires exactly one explicit Executor; valid
      no-Executor repair shapes remain possible only when pinned Runtime semantics
      authorize them.
    - >
      PRIMARY, approved-REMEDIATION and REPAIR self-host paths must use one trusted
      transient checkout of the exact downstream control/invocation commit outside
      persistent AIOS_REPO_ROOT, validate clean SHA identity before AIOS, and delete it
      after use. Mutable persistent workspace control code is forbidden.
    - >
      Add one downstream-specific scripts/aios_control_entry.py that owns only trusted
      bootstrap/delegation. It must resolve bootstrap code from the supplied transient
      Python Agent control source, establish/use the exact pinned AIOS runtime through
      the existing repository-local immutable-pin mechanism, and invoke the
      already-selected aios_renew.operator operation once. It must not select operation,
      Executor, model, effort, lifecycle action, review or publication outcome.
    - >
      Existing aios_phase1_wakeup.py, aios_phase2_remediation.py and
      aios_phase2_repair.py remain byte-unchanged. If target-pin compatibility cannot
      be achieved through the new control entry and authorized workflows without
      changing them, stop unresolved instead of widening scope.
    - >
      Pre-AIOS operational failure surfaces must emit bounded AIOS_OPERATIONAL_RECEIPT
      v2 carrying family, immutable delivery identity, available selectors, typed
      PRE_AIOS/downstream-workflow cause, run_created=false and executor_invoked=false.
      Transport success never claims RUN, verification, semantic review or publication.
    - >
      Brain ingress remains actor/title/repository gated and may dispatch only bounded
      canonical continuation outputs, including publication replay and canonical
      AUTHOR_REPAIR handoff when exact ingress output supplies its repair SHA. It must
      not choose correction strategy or fabricate lifecycle state.
    - >
      Safe Publisher binding must resolve the exact canonical PASS review-decision ref
      and exact current canonical control SHA, invoke only the pinned publication gate,
      and publish only the eligible reviewed source candidate. Metadata/ref commits
      never become source publication.
    - >
      Preserve Python Agent repository identity, authorized Human actor, existing issue
      title policies, self-host labels [self-hosted, windows, x64,
      python-complete-agent], and Codex-versus-Antigravity Human surface separation.
    - >
      Carrier policy YAMLs and aios-terminal-attention.yml remain byte-unchanged.
      The three standalone upstream remote/approval workflows remain absent.
    - >
      .ai/aios-adoption-state.yaml records exact active pin 615a13ab..., TASK-195 r1 / RUN-195-002 / REVIEW-195-001 as execution-profile provenance, TASK-196 / RUN-196-003 / REVIEW-196-001 as installed-dependency portability provenance, and package capability coverage through TASK-196. It preserves TASK-207 r8 / edd7d8d...
      as prior-pin certified history and marks current full downstream conformance
      PENDING_FRESH_CERTIFICATION through TASK-207 r9.
    - >
      Adoption classifications must explicitly distinguish package availability from
      repository binding. At minimum: execution-profile and Phase-1/Phase-2 carrier
      compatibility are ACTIVE after publication; Brain Context/Decision Packet/Brain
      Audit/Brain Provider/Reviewer Provider/BP7/BP8 semantic package capability is
      ADOPTED_BY_PIN while the five P1B semantic registries remain REQUIRED_PENDING;
      verification-performance profile/probes and standalone remote UX are
      NOT_REQUIRED; no package presence silently activates a repository binding.
    - >
      .ai/aios-conformance-state.yaml remains byte-identical old-pin certification.
      Governance tests must distinguish ACTIVE_PIN=615a13ab... from
      CERTIFIED_PRIOR_PIN=edd7d8d... until TASK-207 r9 publication.
    - >
      TASK-254 r4, Brain-owned roadmap state and all product code remain byte-identical.
      This candidate does not mark P1A DONE or automatically advance P1B.
    - >
      Offline regressions must cover exact pin/provenance, new six-effort/high policy,
      PRIMARY/REMEDIATION/REPAIR exact identity and profile propagation, transient
      control source, bounded Operational Receipt v2, repair handoff, safe publication
      control SHA, old-pin certification preservation, REQUIRED_PENDING P1B registries
      and explicit exclusion of upstream-only profiles/workflows.
    - >
      Modify exactly the twenty-two authorized files. Treat TASK-255 r2, RUN-255-001, REPAIR-255-001 and RUN-255-002 as immutable historical old-pin lineage; do not continue or rewrite that repair lineage. Prove the exact RUN-255-002 failure class is closed by validating durable REMEDIATION and REPAIR v2 profile bindings against the governed Python Agent repository policy while AIOS is consumed as the exact immutable installed dependency.  Executor returns one clean
      candidate with zero unresolved implementation items and does not review, publish,
      advance roadmap planning or execute TASK-254.

acceptance:
  - id: AC1
    condition: >
      Candidate has exactly one active AIOS-renew dependency/provenance authority at
      615a13ab519d5d285801cc79e40cb5e25bb16617 and one exact downstream execution-profile
      policy with Codex gpt-6-sol/high supporting none/low/medium/high/xhigh/max and
      unchanged Antigravity medium policy.
  - id: AC2
    condition: >
      PRIMARY, REMEDIATION and REPAIR carrier implementations bind and propagate their
      exact semantic selectors plus one immutable execution profile, use trusted
      transient control source on self-host, and expose bounded Operational Receipt v2
      without retry, fallback, reroute or fabricated lifecycle success.
  - id: AC3
    condition: >
      The downstream control entry is authority-neutral and can bootstrap exactly the
      pinned runtime from an exact transient Python Agent control source for one
      already-selected operator invocation while legacy phase bootstrap scripts remain
      unchanged.
  - id: AC4
    condition: >
      Brain ingress and auto-publish implementations are target-pin compatible for
      bounded canonical repair/publication handoffs and exact current-control-SHA
      publication while preserving actor gating and exact reviewed-source publication.
  - id: AC5
    condition: >
      Adoption state identifies 615a13ab... as active package authority through TASK-196, preserves TASK-195 as execution-profile provenance and TASK-196 as installed-dependency portability provenance,
      preserves edd7d8d/TASK-207 r8 as prior-pin certification, marks TASK-207 r9
      conformance pending, and explicitly classifies P1B semantic registries as
      REQUIRED_PENDING rather than silently active.
  - id: AC6
    condition: >
      Upstream-only verification-performance profiles/probes and standalone remote UX
      remain absent/NOT_REQUIRED; carrier policy YAMLs, terminal-attention workflow,
      old conformance record, TASK-254 r4, roadmap state, product code and legacy phase
      bootstrap scripts remain unchanged.
  - id: AC7
    condition: >
      Focused deterministic test code represents the exact new pin/default/profile
      provenance, carrier identity propagation, transient control isolation, bounded
      operational receipts, safe publication control, historical certification split
      and P1B-pending classifications without any real provider, GitHub dispatch or
      self-host operation.

