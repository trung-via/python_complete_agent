constraints:
  hard:
    - >
      The pre-Executor authority edge for r5 must be the reviewed version-2
      AIOS_SOURCE_CONTROL_BOOTSTRAP_INTENT path. Admission must execute from exact
      reviewed/published activation source
      bbc8f09f38ac4d150060c6fcc851b6da2140e5a0, never mutable main/latest, while an
      isolated interpreter independently attests the actually imported installed legacy
      generation as exact edd7d8d92d54900c56442bbfcddb8648ec4d2e09.
    - >
      That bootstrap intent must target exactly the activated TASK-199 consumer source
      ff29666d50eaf9276ab62d944018f2bbeb91f073 and bind the exact governed Python Agent
      repository, exact unchanged source-control commit containing canonical TASK-255 r5,
      exact source pin blob, TASK-255 r5 revision/blob/authoring commit, selected Executor,
      and exact target source URL. Missing, stale, dirty, detached, ambiguous, floating,
      mismatched, or replayed identity fails closed before target authority.
    - >
      Do not target bbc8f09... directly in the source-bootstrap intent. bbc8f09... is the
      separately reviewed activation/admission source and desired final downstream pin;
      the only activated consumer target is ff29666d.... The exact ff29666d target must
      consume the durable handoff and admit the one TASK-255 r5 Runtime execution at the
      unchanged downstream source-control commit with synchronization disabled.
    - >
      Exactly one canonical TASK-255 r5 implementation RUN and at most one Executor
      invocation may exist. The candidate's change of the repository dependency pin to
      bbc8f09... is ordinary bounded TASK implementation state, not a second migration
      authority edge or second execution. If the architecture cannot truthfully preserve
      one RUN/one Executor, stop unresolved rather than fall back to TASK-198 multi-hop.
    - >
      The final candidate must leave exactly one active AIOS dependency/provenance at
      bbc8f09f38ac4d150060c6fcc851b6da2140e5a0. requirements-aios-renew.txt,
      aios_worker AUTHORITATIVE_COMMIT/PIN_LINE, documentation, adoption state and all
      repository-owned pin assertions must agree exactly; no intermediate pin remains
      active or floating.
    - >
      Port the final-pin execution-profile policy exactly: Codex default
      gpt-6-sol/high with supported efforts [none, low, medium, high, xhigh, max] in that
      order; Antigravity gemini-3.8-flash/medium with [low, medium, high]. Preserve exact
      Human override precedence and immutable model/effort provenance through applicable
      PRIMARY/REMEDIATION/REPAIR carriers.
    - >
      Port repository-owned carrier compatibility required through TASK-201, including
      TASK-200 remediation fan-out hygiene: non-[AIOS REMEDIATION INTENT] issues must skip
      the remediation receipt/failure path cleanly, while genuine target-family admission
      or dispatch failure remains fail-closed. Do not blindly copy upstream repository
      identity; preserve Python Agent actor/repository/runner policy and authority boundaries.
    - >
      PRIMARY/REMEDIATION/REPAIR bindings must preserve exact semantic selectors,
      trusted transient control isolation where required by the final pin, bounded
      Operational Receipt semantics, and separation between carrier delivery and
      RUN/verification/review/publication truth.
    - >
      Existing aios_phase1_wakeup.py, aios_phase2_remediation.py and
      aios_phase2_repair.py remain byte-identical. If satisfying the final pin requires
      changing these historical bootstrap scripts, stop unresolved rather than widen
      scope.
    - >
      .ai/aios-adoption-state.yaml must preserve edd7d8d... / TASK-207 r8 as historical
      old-pin certification only, record TASK-199/TASK-200/TASK-201 migration/adoption
      provenance and final pin bbc8f09..., mark fresh TASK-207 r9 certification pending,
      and keep P1B semantic registries REQUIRED_PENDING. Planning state does not itself
      prove migration completion.
    - >
      .ai/aios-conformance-state.yaml, .ai/roadmap-state.yaml, TASK-254 r4, carrier policy
      YAMLs, terminal-attention workflow, product code and the three legacy phase bootstrap
      scripts remain byte-identical.
    - >
      Runtime owns verification. Executor returns one clean candidate with zero unresolved
      implementation items and does not review, publish, advance roadmap state, execute
      TASK-254, begin P1B, or certify the new pin.

