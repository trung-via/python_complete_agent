task_id: TASK-255
revision: 6

goal: >
  Complete BP9-P1A through one recovered source-control legacy-bootstrap adoption from
  Python Agent's currently installed AIOS-renew generation
  edd7d8d92d54900c56442bbfcddb8648ec4d2e09. Preserve the previously consumed TASK-255
  r5 handoff as immutable history, transactionally supersede it to this exact r6 intent
  using the reviewed/published TASK-203 activation source
  275067b56cfd1dc9f7faf99fa2a3192e7cf48eec, admit exactly one TASK-255 r6 Runtime RUN
  under exact TASK-202 consumer source
  31fd2482cd87d97fd818e05eb5b4dcec69ffeee6, and produce one downstream candidate whose
  first post-bootstrap AIOS-renew dependency/provenance is exactly that same consumer
  SHA 31fd2482cd87d97fd818e05eb5b4dcec69ffeee6. Port only the repository-owned BP9-P1A
  worker/profile/carrier compatibility required by that exact pin. Do not advance P1B,
  fresh conformance certification, product work, or roadmap planning state.

problem: >
  TASK-255 r5 is stale before execution. Its source-bootstrap edge targeted the older
  TASK-199 consumer ff29666d50eaf9276ab62d944018f2bbeb91f073 while its requested final
  candidate pin was bbc8f09f38ac4d150060c6fcc851b6da2140e5a0. The real bootstrap attempt
  consumed that r5 edge but failed before any bound r5 RUN because the then-active
  consumer could not read canonical REMEDIATION RUN documents. Upstream TASK-202 has now
  published mixed-RUN parsing plus bounded transactional pre-RUN supersession/recovery at
  exact consumer 31fd2482cd87d97fd818e05eb5b4dcec69ffeee6, and TASK-203 has separately
  published activation source 275067b56cfd1dc9f7faf99fa2a3192e7cf48eec whose sole
  _SOURCE_BOOTSTRAP_TARGET_SHA is that exact TASK-202 consumer. The recovered first
  downstream candidate must therefore pin to 31fd2482... itself so completed
  source-bootstrap steady state is generation-exact. Pinning directly to the TASK-203
  activation commit during the same source-bootstrap RUN would recreate the generation
  mismatch that TASK-202 explicitly forbids.

