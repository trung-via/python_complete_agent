    [none, low, medium, high, xhigh, max], and Antigravity
    gemini-3.8-flash/medium with [low, medium, high].
  - >
    Upstream TASK-203 / RUN-203-001 / REVIEW-203-001 is reviewed and published at exact
    activation source 275067b56cfd1dc9f7faf99fa2a3192e7cf48eec. Its sole production
    _SOURCE_BOOTSTRAP_TARGET_SHA is exact 31fd2482cd87d97fd818e05eb5b4dcec69ffeee6.
  - >
    Any actual local recovery operation must independently reattest the existing
    source-bootstrap history before mutation: one exact selected TASK-255 r5 consumed,
    uncompleted, unsuperseded pre-RUN edge with no bound RUN; immutable legacy pin;
    clean attached fast-forward main; installed legacy generation edd7d8d...; and no
    conflicting active migration state. Repository authoring alone does not prove those
    local Runtime facts.
  - >
    TASK-254 r4 remains authored/unexecuted and preserved. P1B/TASK-256 and fresh
    TASK-207 successor certification remain publication-gated later work.

