  publication of 636cde7c55f8a843338ea407d2888ea1043875b5. Downstream TASK-255 r2 then produced RUN-255-001 FAILURE, REPAIR-255-001 and RUN-255-002 FAILURE at the durable execution-profile completion gate. Upstream TASK-196 corrected that installed-dependency/external-governed-repository portability defect through RUN-196-003 Runtime PASS, REVIEW-196-001 PASS and exact publication of 615a13ab519d5d285801cc79e40cb5e25bb16617. The migration target is therefore the exact final TASK-196 source.
  Package code must be adopted once through the final immutable pin, not through 259
  sequential pin migrations. However, repository-owned compatibility surfaces cannot
  be inherited by package pin alone. Fresh audit identifies required P1A bindings:
  execution-profile policy; exact TASK revision/blob/commit and model/effort provenance
  on PRIMARY/REMEDIATION/REPAIR hosted carriers; trusted transient downstream control
  source for self-host invocation; bounded Operational Receipt v2; bounded ingress
  repair handoff; and current-control-SHA safe publication. P1B separately owns the
  semantic Brain/Reviewer registries. Upstream performance measurement profiles,
  standalone remote UX and repository-specific probes must not be copied.

