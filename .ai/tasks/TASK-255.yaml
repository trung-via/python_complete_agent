    TASK artifacts, or provider proof state downstream.
  - >
    Review, publish, fresh-certify conformance, execute TASK-254, or begin P1B inside Executor work.

constraints:
  hard:
    - >
      The migration must use the published TASK-198 bounded legacy bootstrap semantics. Before
      target authority, independently attest the actually imported installed legacy distribution
      as exact edd7d8d92d54900c56442bbfcddb8648ec4d2e09; synchronized downstream or target
      source cannot serve as that witness.
    - >
      The one-time bootstrap authority edge targets exactly
      83115b26df85a7ad6643f317833e18b18586bdbe. Do not change the upstream bootstrap target,
      use mutable main/latest, or claim a direct legacy-to-45c463 migration authorization.
    - >
      The migration intent must bind exact source/target generation, governed downstream
      repository, source and target downstream control commits, source/target pin blobs,
      TASK-255 r4 id/revision/blob/authoring commit and the selected Executor. Missing, stale,
      floating, dirty, detached-unsafe, ambiguous or mismatched identity fails closed before
      target authority.
    - >
      After the bounded bootstrap edge, only the exact admitted 83115b26 target consumes the
      TASK-197 handoff. Any further generation movement must be owned by installed
      migration-capable migrate-primary semantics, never by bootstrap-primary reuse.
    - >
      The final reviewed candidate must leave exactly one active downstream dependency/provenance
      authority at 45c46397914aadf20cb4cb6b874f274da43e2b9c and repository-owned compatibility
      bindings matching that exact published source. If reaching 45c463 from 83115b requires a
      separate migration authority or cannot be represented without violating the one-RUN/one-
      Executor lifecycle for TASK-255 r4, stop unresolved and report the minimum required
      successor rather than inventing a second authority edge.
    - >
      Preserve the execution-profile policy: Codex default gpt-6-sol/high with
      [none, low, medium, high, xhigh, max] in that order; Antigravity
      gemini-3.8-flash/medium with [low, medium, high]. Human explicit selection outranks defaults.
    - >
      PRIMARY/REMEDIATION/REPAIR hosted carriers must preserve exact semantic selectors and
      immutable execution-profile provenance; self-host execution must use trusted exact transient
      downstream control source and bounded Operational Receipt semantics. Carrier success is not
      RUN/verification/review/publication truth.
    - >
      scripts/aios_control_entry.py remains authority-neutral bootstrap/delegation only. It must
      not select migration target, operation, Executor, model, effort, lifecycle action, review,
      publication or correction strategy, and must not become a second migration protocol.
    - >
      Existing aios_phase1_wakeup.py, aios_phase2_remediation.py and aios_phase2_repair.py remain
      byte-identical. If compatibility requires changing them, stop unresolved rather than widen scope.
    - >
      Brain ingress and safe publication remain exact canonical continuation/publisher bindings;
      no repository-owned workflow may fabricate review/publication or treat metadata/ref commits
      as source publication.
    - >
      Adoption state must preserve old edd7d8d/TASK-207 r8 certification as prior-pin history,
      record TASK-197/TASK-198 migration provenance and final exact active pin only after the
      implementation candidate itself represents that state, mark TASK-207 r9 pending, and keep
      P1B semantic registries REQUIRED_PENDING.
    - >
      .ai/aios-conformance-state.yaml, .ai/roadmap-state.yaml, TASK-254 r4, carrier policy YAMLs,
      terminal-attention workflow, product code and legacy phase bootstrap scripts remain
      byte-identical.
    - >
      Production and focused test changes remain within the twenty-two P1A paths listed in modify.
      Runtime owns verification. Executor returns one clean candidate with zero unresolved items;
      if the exact migration architecture cannot truthfully satisfy this in one TASK-255 r4
      implementation lifecycle, return unresolved rather than bypassing TASK-197/TASK-198.
    - >
      No real marketplace/provider operation is part of deterministic verification.

acceptance:
  - id: AC1
    condition: >
      Exact evidence shows the legacy installed generation is independently attested as edd7d8d...
      and the only bootstrap authority edge is bound to exact 83115b26... under TASK-198 semantics,
      with no target self-authorization and no pre-edge Executor/RUN fabrication.
  - id: AC2
    condition: >
      The downstream candidate has one final exact AIOS dependency/provenance authority at
      45c46397914aadf20cb4cb6b874f274da43e2b9c, Codex gpt-6-sol/high six-effort policy,
      unchanged Antigravity policy, and no floating/intermediate active pin.
  - id: AC3
    condition: >
      PRIMARY/REMEDIATION/REPAIR compatibility bindings preserve exact semantic/profile identity,
      trusted transient control isolation, bounded operational receipts and authority-neutral
      delegation without retry/fallback/reroute or duplicate lifecycle authority.
  - id: AC4
    condition: >
      Bootstrap completion composes into TASK-197 migration ownership and any subsequent
      generation movement is exact and migration-capable; at most one TASK-255 implementation
      RUN and one Executor invocation occur. If this cannot be proven, execution stops unresolved.
  - id: AC5
    condition: >
      Adoption state records TASK-197/TASK-198 provenance, final active pin, old-pin TASK-207 r8
      certification as historical only, fresh TASK-207 r9 pending, and P1B registries
      REQUIRED_PENDING; no package capability silently activates repository semantic bindings.
  - id: AC6
    condition: >
      Roadmap, conformance state, TASK-254 r4, product code, carrier policies, terminal-attention
      workflow and legacy phase bootstrap scripts are unchanged; no P1B or product work begins.
  - id: AC7
    condition: >
      Focused deterministic regressions prove exact migration/bootstrap identities, final pin and
      execution-profile policy, carrier/profile propagation, transient control isolation,
      operational receipts, safe publication, historical certification split and P1B pending
      classifications; git diff --check passes with zero unresolved items.

