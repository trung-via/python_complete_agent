  control/pin commit and can transfer one exact unchanged downstream TASK directly to an
  exact consumer source. TASK-201 separately activated that capability by allowing only
  exact consumer SHA ff29666d50eaf9276ab62d944018f2bbeb91f073, and its reviewed candidate
  bbc8f09f38ac4d150060c6fcc851b6da2140e5a0 is now canonical AIOS-renew main. TASK-200
  also removed non-target remediation-carrier false-red fan-out. Python Agent remains
  pinned to legacy edd7d8d... and its current remediation carrier still has the old
  unconditional receipt path. Running r4 or retrying old PRIMARY would therefore ignore
  the newly reviewed migration invariant and can recreate the generation-switch hazard.

