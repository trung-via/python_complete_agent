task_id: TASK-168
revision: 1

goal: >
  Close P6.1b Real-Evidence Benchmark Execution by freezing one exact Human-reviewed TASK-166
  READY Shopee capture bundle and its six persisted ProductSourcePack manifests into immutable
  test fixtures, then replaying the already-published P2/P3/M3/M4/TASK-164 authority chain fully
  offline to snapshot exact lexical retrieval precision/recall and grounded citation-fidelity
  baseline evidence. TASK-168 is integration/benchmark work only: it changes zero production
  Python and introduces no new capture, retrieval, ranking, truth, provider, persistence,
  admission, or benchmark-label authority.

problem: >
  TASK-164 closed P6.1a with a pure deterministic evaluator. TASK-165 attempted P6.1b but mixed
  mutable marketplace capture into AIOS implementation/verification and remains unpublished blocked
  historical evidence. Published TASK-166 moved capture to an external resumable Human-operated
  boundary. Published TASK-167 then hardened Shopee search-surface provenance after the first READY
  bundle was Human-rejected because query "chuột không dây" captured an unrelated lantern listing.
  A second external TASK-166 READY bundle was captured after TASK-167 publication and has now passed
  Human semantic review for all three fixed intents plus integrity review: exactly two observations
  per cohort, relative manifest references, exact SHA-256 matches, platform shopee, one stable
  source_product_id per cohort, and distinct observed_at values. The remaining P6.1b gap is to freeze
  those exact reviewed bytes into repository test fixtures and measure the published lexical path
  offline without allowing the executor to recapture, relabel, rewrite, or substitute evidence.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-168 authoring is
    fce417ff1309f68c89a830aecbfc66a30f93a031, the published TASK-167 source candidate after
    RUN-167-001 Runtime PASS and REVIEW-167-001 PRIMARY PASS.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@32ace104c5cfaa1b7affbaa40157872b1f85147f.
  - >
    TASK-164 remains the sole retrieval-quality/citation-fidelity evaluator. TASK-122 remains the
    sole lexical retrieval authority; TASK-123 remains canonical RAG-context authority; TASK-129
    remains GroundedAnswer structural authority; TASK-133 remains grounded-QA composition.
  - >
    TASK-138 remains the sole configured-root persisted-evidence intake/typed-rehydration
    composition over TASK-125. TASK-139/140/141 remain the sole P3 family/variant review, explicit
    Human decision, and durable admission composition boundaries. TASK-120 remains SQLite durability;
    TASK-121 remains canonical profile projection.
  - >
    TASK-166 remains the sole external live-capture checkpoint/bundle authority. TASK-167 remains a
    closed Shopee search-surface hardening task. TASK-168 must not modify either implementation.
  - >
    The rejected first READY bundle is historical operational evidence only and must never be
    imported, repaired, merged, relabeled, or substituted. The accepted second READY bundle is the
    only permitted implementation-time external source for TASK-168.
  - >
    Human relevance labels are fixed before retrieval evaluation. The executor may not inspect
    TASK-122 hits, profile evidence, business score, candidate title overlap, answer text, or computed
    metrics to change benchmark labels or cohort ordering.
  - >
    P6.2 remains blocked regardless of metric values until TASK-168 Runtime PASS, semantic PASS,
    publication, and Brain/Human review of the resulting empirical baseline.

