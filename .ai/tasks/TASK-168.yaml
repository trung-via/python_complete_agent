non_goals:
  - Modify any production Python module, dependency, AIOS pin, worker, workflow, browser, discovery,
    ranker, scraper, ProductSourcePack, intake, entity, admission, catalog, profile, retrieval, RAG,
    prompt, provider, answer, evaluator, or CLI implementation.
  - Run Shopee/TikTok discovery, browser/CDP, scrape/acquisition, Drive upload, CAPTCHA handling, HTTP,
    network, provider-account, or marketplace work inside TASK-168 Runtime verification.
  - Reuse, repair, rewrite, import, or derive fixtures from the Human-rejected first READY bundle.
  - Modify TASK-164 evaluator semantics, TASK-122 retrieval semantics, TASK-123 context semantics,
    TASK-129 structural grounding, TASK-133 answer composition, or TASK-134 query planning.
  - Add semantic/vector retrieval, embeddings, BM25/FTS/TF-IDF, fuzzy matching, synonym expansion,
    reranking, LLM retrieval scoring, query rewriting, fallback behavior, or a quality threshold.
  - Derive relevance labels from titles, evidence, retrieved hits, marketplace popularity, business
    score, provider output, answer text, or measured metrics.
  - Add product-truth reconciliation, preferred/latest/majority evidence selection, identity
    migration, family/variant membership evolution, autonomous approval, or a production benchmark store.
  - Commit downloaded images/video, raw HTML, cookies, headers, credentials, browser profiles,
    checkpoint files, local absolute paths, transient output directories, or live execution logs.
  - Treat low precision/recall/citation fidelity as a task failure or automatically authorize P6.2.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      TASK-168 changes zero production Python. The only executable addition is
      tests/integration/test_p6_1b_real_evidence_retrieval_baseline.py; all committed real evidence is
      fixture-only and must never be imported by production code.
    - >
      Implementation-time evidence import is allowed from exactly one Human-supplied environment
      variable named PI_P6_1B_CAPTURE_ROOT. It must resolve to one existing absolute directory outside
      the Git repository. The executor may read that variable only to perform the one-time fixture
      freeze. It must not commit the absolute path, print it into benchmark/docs/result claims, scan
      parent/sibling directories, or read any second external root. Runtime verification must not
      require or read this variable.
    - >
      The implementation-time external root is read-only. Never modify, rename, delete, resume, or
      recapture it. Require exact capture_bundle.json schema "product_intelligence_live_capture_bundle"
      version 1 with exactly three cohorts in this exact query order: "bình giữ nhiệt inox",
      "bàn phím cơ", "chuột không dây". Require exactly two ordered observation references per cohort,
      nonblank candidate_id/title/product_url, and pairwise-distinct selected candidate URLs. Do not
      perform any new semantic/title relevance judgment; Human acceptance is an input to this TASK.
    - >
      For every bundle observation, require manifest_path to be a safe relative path without traversal,
      resolve it strictly beneath PI_P6_1B_CAPTURE_ROOT, require a regular non-symlink source_pack.json,
      and require SHA-256 of exact persisted bytes to equal the bundle digest. Any mismatch fails closed;
      never search for a replacement manifest or repair the bundle.
    - >
      Copy capture_bundle.json byte-for-byte to the fixture root. Copy the six manifest files
      byte-for-byte into the six fixed case/observation target paths solely by cohort ordinal and
      observation ordinal. Do not parse/rewrite/normalize/shorten/hand-edit any ProductSourcePack field.
      Do not copy capture_checkpoint.json or media. benchmark.json may map each original bundle-relative
      manifest path/digest to its deterministic fixture target but must contain no external absolute path.
    - >
      The committed capture_bundle.json plus six source_pack.json files are immutable benchmark input.
      Normal verification must use only the repository fixture tree. It must prove each target
      source_pack.json exact SHA-256 still matches the corresponding capture bundle record before any
      benchmark composition. Fixture corruption must fail closed.
    - >
      benchmark.json is the only benchmark descriptor and measured snapshot. It must be deterministic
      compact UTF-8 JSON with schema "p6_1b_real_evidence_benchmark", version 1, sort_keys=True,
      separators=(",", ":"), no BOM, and one trailing newline. It must contain the capture bundle
      fixture-relative filename and exact bundle SHA-256, fixed Human labels, exact source manifest
      provenance/digests/fixture targets, and exact measured baseline values; never raw description/media
      payloads, secrets, cookies, local absolute paths, or copied checkpoint state.
    - >
      benchmark.json must define exactly four RetrievalBenchmarkCase values in this exact order:
      1) case_id "p6-1b-001", question
         "Which frozen benchmark variant matches the Human intent bình giữ nhiệt inox?",
         retrieval_query "bình giữ nhiệt inox", relevant_variant_ids
         ("p6-benchmark-variant-001",);
      2) case_id "p6-1b-002", question
         "Which frozen benchmark variant matches the Human intent bàn phím cơ?",
         retrieval_query "bàn phím cơ", relevant_variant_ids
         ("p6-benchmark-variant-002",);
      3) case_id "p6-1b-003", question
         "Which frozen benchmark variant matches the Human intent chuột không dây?",
         retrieval_query "chuột không dây", relevant_variant_ids
         ("p6-benchmark-variant-003",);
      4) case_id "p6-1b-004", question
         "Which frozen benchmark variants contain persisted Shopee evidence?",
         retrieval_query "shopee", relevant_variant_ids
         ("p6-benchmark-variant-001", "p6-benchmark-variant-002",
          "p6-benchmark-variant-003").
      Evaluator limit is exactly 3 for every case. Labels and queries are frozen before metrics run.
    - >
      Offline benchmark verification must call TASK-138 intake_product_source_evidence exactly once per
      case cohort root, yielding exactly two manifest paths and two typed ProductSourcePack values per
      cohort. Do not direct-parse or deserialize source_pack.json in benchmark-scoring code, construct
      shadow packs, or create another manifest inventory.
    - >
      Build one disposable TASK-120 SQLite catalog under tmp_path. For each cohort in case order call
      TASK-139 plan_family_knowledge_review exactly once and require exactly one actionable
      FamilyMergeProposal covering its two exact observations. Record explicit family APPROVE only via
      TASK-140 with actor "p6-benchmark" and fixed aware timestamp 2026-09-08T00:00:00+00:00, then durably
      admit exact family IDs "p6-benchmark-family-001" through "p6-benchmark-family-003" only through
      TASK-140/TASK-120.
    - >
      For each admitted family call TASK-141 prepare_sellable_variant_review exactly once with the
      complete family.members tuple, never singleton fallback. Require existing TASK-116 semantics to
      accept that exact full selection, record explicit variant APPROVE through TASK-141 with the same
      actor/timestamp, and durably admit exact variant IDs "p6-benchmark-variant-001" through
      "p6-benchmark-variant-003" through TASK-141/TASK-120. If existing semantics reject a cohort, fail
      closed; do not split observations, alter labels, substitute evidence, or recapture inside TASK-168.
    - >
      Reload the completed SQLite catalog only through TASK-120. Build exactly three
      CanonicalVariantProfile values only through TASK-121 build_canonical_variant_profile in catalog
      variant order, binding each variant only to its exact cohort ProductSourcePack pair. Do not direct-
      construct profiles, copy/reduce evidence, or create another projection authority.
    - >
      Construct the four exact TASK-164 RetrievalBenchmarkCase values from benchmark.json and call
      evaluate_lexical_retrieval_quality exactly once with the three-profile corpus and limit=3. Do not
      call TASK-122 directly from benchmark-scoring code, precompute hits, add local matching, or apply a
      metric threshold.
    - >
      Snapshot the exact lexical report in benchmark.json: each case's ordered TP/FP/FN variant IDs,
      precision/recall exact [numerator, denominator] pairs, aggregate TP/FP/FN counts, and exact
      micro_precision/micro_recall pairs. The offline test must recompute TASK-164 output and require exact
      equality. The snapshot is empirical evidence, not a target and must never be edited to hide drift.
    - >
      For each RetrievalCaseEvaluation build exactly one TASK-123 CanonicalRagContext from the same exact
      three profiles, case.question, case.retrieval_query, max_hits=3, and default byte budget. Instantiate
      a test-only deterministic zero-network provider with one explicit boolean has_hits=
      bool(rag_context.hits) decided before provider invocation. The provider may branch only on that
      explicit boolean: ANSWERED with citation ["H001-W001"] when true; INSUFFICIENT_EVIDENCE with zero
      citations and one fixed limitation when false. It must not inspect rendered prompt/messages,
      evidence, variant IDs, benchmark labels, answer text, or TASK-164 metrics.
    - >
      Call TASK-133 answer_grounded_context exactly once per case context, then call TASK-164
      evaluate_grounded_answer_citation_fidelity exactly once per resulting case evaluation/answer pair.
      Snapshot each fidelity as exact [numerator, denominator] or null and require exact recomputation.
      Fidelity remains structural benchmark relevance only, not semantic entailment, factual accuracy,
      hallucination detection, or product truth.
    - >
      Normal Runtime verification must be fully offline and deterministic: zero browser/CDP, marketplace,
      network, Drive, external capture root, environment dependency, provider account, clock, random/UUID,
      subprocess, retry, sleep, or filesystem scanning outside committed fixture roots and tmp_path. The
      required pytest command must explicitly remove PI_P6_1B_CAPTURE_ROOT before execution to prove the
      committed benchmark is self-contained.
    - >
      Add repeated-determinism regression that executes the full offline benchmark composition twice from
      the same committed fixtures using fresh tmp_path catalogs and proves value-equal lexical report and
      citation-fidelity snapshot, with zero fixture mutation.
    - >
      docs/PHASE_6_P6_1_REAL_EVIDENCE_BASELINE.md must report the exact measured values from benchmark.json
      and clearly distinguish Human relevance labels, TASK-122 lexical behavior, TASK-164 metric semantics,
      deterministic structural citation fidelity, and the absence of product-truth/semantic-entailment
      claims. Low scores are valid findings and must be reported rather than hidden.
    - >
      Update both canonical roadmaps consistently: TASK-166 and TASK-167 are CLOSED/published; the first
      READY bundle remains Human-rejected operational evidence; the second reviewed READY bundle is the
      accepted P6.1b corpus source; TASK-168 is the current P6.1b closure candidate; P6.2 remains blocked
      until TASK-168 Runtime PASS, semantic PASS, publication, and Brain/Human review of the measured
      empirical baseline.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      TASK-168 changes only fixture, offline integration-test, baseline-documentation, and roadmap files;
      zero production Python or prior semantic authority is modified or duplicated.
  - id: AC2
    condition: >
      Implementation imports exactly one Human-reviewed external TASK-166 bundle through
      PI_P6_1B_CAPTURE_ROOT, validates fixed schema/query/cohort/observation/path/digest invariants,
      copies only exact bundle and six manifest bytes, commits no external absolute path/checkpoint/media,
      and never recaptures or substitutes evidence.
  - id: AC3
    condition: >
      Committed capture provenance is immutable and self-verifying: capture_bundle.json exact digest is
      recorded, all six manifest fixture bytes match their bundle SHA-256 records, and Human cohort/label
      ordering is preserved without metric-driven relabeling.
  - id: AC4
    condition: >
      Offline composition uses TASK-138 exactly once per cohort, then existing TASK-139/140/141/120/121
      authorities to create exactly three full-member benchmark variants under explicit fixed Human
      decisions/IDs, with no shadow decode, identity, approval, admission, persistence, or profile path.
  - id: AC5
    condition: >
      The exact four frozen TASK-164 benchmark cases execute once against exactly three canonical profiles
      with limit=3; TASK-122 remains reachable only through TASK-164 and no query/retrieval semantics or
      quality threshold is added.
  - id: AC6
    condition: >
      benchmark.json snapshots exact per-case and aggregate TP/FP/FN plus Fraction precision/recall values,
      and normal verification recomputes them exactly from committed evidence so retrieval drift is visible.
  - id: AC7
    condition: >
      Grounded citation-fidelity uses one TASK-123 context and one TASK-133 call per case, a provider whose
      only branch input is explicit bool(rag_context.hits), and exactly one TASK-164 fidelity evaluation per
      answer; no prompt inspection, semantic grading, or evidence-driven provider behavior occurs.
  - id: AC8
    condition: >
      Normal Runtime verification succeeds with PI_P6_1B_CAPTURE_ROOT removed and performs zero live/external
      I/O beyond committed fixture roots/tmp_path; repeated execution is deterministic and fixtures remain
      byte-identical.
  - id: AC9
    condition: >
      Baseline documentation reports exact empirical metrics without claiming product truth, semantic
      entailment, factual accuracy, or a quality threshold, and both roadmaps preserve the accepted/rejected
      bundle lineage plus P6.2 block.
  - id: AC10
    condition: >
      Required focused predecessor/benchmark tests and git diff check pass with zero unresolved items and no
      changed files outside TASK-168 modification scope.

