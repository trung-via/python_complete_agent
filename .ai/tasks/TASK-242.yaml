task_id: TASK-242
revision: 1

goal: >
  Reconcile the consumed Human-operated generation-4 TikTok PDP commerce-observability
  diagnostic attempt from TASK-241 as an artifact-free evaluation failure, repair only the
  confirmed malformed JavaScript guard in the published schema-version-2 diagnostic carrier,
  and add bounded regression coverage that prevents this exact syntax defect from recurring.
  Preserve TASK-137 browser/CDP lifecycle authority, Product Intelligence semantics, and all
  acquisition/action boundaries. Do not execute TikTok/CDP and do not authorize generation 5
  during TASK-242 engineering execution.

problem: >
  TASK-241 is reviewed and published exactly at
  c319c384f370fec1946d7d85b871e05d1e4b82a7 after RUN-241-001 and REVIEW-241-001.
  Its publication granted exactly one Human-operated generation-4 attach-only diagnostic
  attempt. The Human completed non-consuming preflight successfully, then started the exact
  canonical CLI invocation. That invocation reached the diagnostic carrier and returned exit
  code 1 with sanitized error type TikTokPdpDomDiagnosticError and message
  "the bounded current-page evaluation failed"; no tiktok-pdp-dom-diagnostic-v2.json artifact
  was created. Under TASK-241, starting the canonical invocation consumes the sole attempt on
  every terminal outcome, including evaluation failure, so generation 4 is consumed even though
  canonical roadmap state still records executed false and one attempt remaining.
  Repository inspection identifies a concrete malformed JavaScript regex guard inside
  DIAGNOSTIC_SCRIPT that is sufficient to explain parse-time page.evaluate failure. Existing
  FakeSession regressions only record the script and return synthetic payloads, so they did not
  parse the JavaScript and therefore did not detect this defect. No root_probe or commerce_probe
  payload was produced, so no selector, DOM topology, render, shadow, iframe, collector, or
  acquisition repair is justified by generation 4.

assumptions:
  - >
    Canonical main at authoring is
    c319c384f370fec1946d7d85b871e05d1e4b82a7.
  - >
    TASK-241 / RUN-241-001 / REVIEW-241-001 are Runtime PASS, semantic PASS and publication
    SUCCESS, and canonical main equals the exact reviewed TASK-241 candidate
    c319c384f370fec1946d7d85b871e05d1e4b82a7.
  - >
    TASK-241 published the generation-4 authorization bound to context
    p8-pilot-001-led-motion-tiktok-vn, source ID 1731381331718341815 and exact listing
    https://shop.tiktok.com/vn/pdp/den-led-cam-bien-chuyen-dong-3-che-do-sang-sac-usb-c/1731381331718341815.
  - >
    The Human-operated preflight immediately before the consuming invocation established:
    CDP 127.0.0.1:9222 reachable; exactly one matching normal page target for source ID
    1731381331718341815; execution-critical files equivalent to published V2 source
    8ef61df3936652fb7aeda8ca31ce1db3621ff4cf; and both V1/V2 diagnostic artifacts absent in
    the new external generation-4 job root.
  - >
    The Human then executed the canonical one-line CLI invocation. It returned
    TikTokPdpDomDiagnosticError with sanitized message
    "the bounded current-page evaluation failed", process exit code 1, and no V2 artifact.
    This operator observation is engineering execution context to be reconciled; it is not
    marketplace evidence or Product Truth.
  - >
    Canonical src/product_intelligence/tiktok_pdp_dom_diagnostic.py currently contains a
    malformed JavaScript regex-negation guard inside DIAGNOSTIC_SCRIPT equivalent to a missing
    opening regex delimiter before a four-or-more-digit check. That defect is sufficient to
    cause JavaScript parse failure before a diagnostic payload can be returned.
  - >
    Existing tests/product_intelligence/test_tiktok_pdp_dom_diagnostic.py uses FakeSession
    evaluation that records DIAGNOSTIC_SCRIPT and returns synthetic Python payloads; it does not
    parse or execute the JavaScript source, so current green tests do not certify JavaScript
    syntax.
  - >
    TASK-137 remains the sole browser/CDP lifecycle authority. Its current contract deliberately
    borrows the first existing non-closed page in the first existing context. TASK-242 has no
    evidence that this browser policy caused the generation-4 failure and therefore must not
    modify or reinterpret TASK-137.
  - >
    TASK-231 remains sole public PDP acquisition contract. ProductCandidateSnapshot remains the
    marketplace observation contract and SignalEvidence remains field-evidence owner.
  - >
    CAPABILITY_IS_NOT_AUTHORITY, EVIDENCE_IS_NOT_PRODUCT_TRUTH,
    SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY, SNAPSHOT_IS_NOT_TREND and
    ONE_CAPABILITY_ONE_AUTHORITY remain mandatory.

