task_id: TASK-249
revision: 1

goal: >
  Harden only the existing Human-operated TikTok public-PDP live-pilot carrier so that a later,
  separately authorized post-TASK248 one-shot collector validation has durable attempt-consumption
  lineage, exact TASK-248 implementation provenance, bounded terminal evidence for both success and
  fail-closed outcomes, interruption visibility, and secret-safe external artifacts. Preserve the
  published TikTokPdpCollector, canonical TikTok parser, shared bounded DOM-scope resolver, TASK-137
  browser lifecycle authority, Product Intelligence observation/evidence ownership, and all live
  acquisition, automated acquisition, ranking, recommendation, approval, market-test, and commerce-
  action gates. TASK-249 performs no TikTok/CDP operation and grants no live attempt.

problem: >
  TASK-248 is exactly published on canonical main at
  39979020a10b78e1f86c30cf2b704f2f975daec9 after independent semantic review and remediation.
  The collector now shares the proven bounded PDP DOM-scope resolver, bounds price observation,
  fails closed on truncated price traversal, and no longer defaults unresolved currency-like DOM
  observations to current price. Canonical planning therefore correctly returns to
  HUMAN_BRAIN_LIVE_PUBLIC_PDP_PILOT_AUTHORIZATION with zero live authority. However, the existing
  operation-specific carrier src/product_intelligence/tiktok_pdp_live_pilot.py still reflects the
  older TASK-233 execution contract: it writes a bounded artifact only after successful collection,
  does not durably mark the exact moment at which a later one-shot attempt becomes consumed, does
  not leave deterministic terminal evidence for ordinary fail-closed outcomes, and does not bind
  its external operation record to the exact published TASK-248 collector baseline. A later live
  validation would therefore remain vulnerable to ambiguous interruption or failure lineage and
  could force Brain to reconstruct whether an attempt started from console/chat evidence. The
  smallest justified engineering step is to harden that existing carrier in place, without
  modifying or reinterpreting the collector or granting a new live operation.

assumptions:
  - Canonical main at authoring is 39979020a10b78e1f86c30cf2b704f2f975daec9.
  - TASK-248 is the exact reviewed and published current collector-hardening baseline.
  - The exact post-TASK248 planning handoff is HUMAN_BRAIN_LIVE_PUBLIC_PDP_PILOT_AUTHORIZATION.
  - live_public_pdp_acquisition_authority, automated_public_pdp_acquisition_authority, and
    market_test_or_action_authority are NONE; automatic progression is false.
  - The selected P8 case remains context p8-pilot-001-led-motion-tiktok-vn, source ID
    "1731381331718341815", and the exact existing selected TikTok Shop Vietnam PDP URL.
  - TikTokPdpCollector remains the sole Product Intelligence exact-PDP observation/admission owner.
  - src/product_intelligence/adapters/tiktok_parsing.py remains the sole canonical TikTok parsing and
    exact-PDP scalar-price admission authority.
  - src/product_intelligence/tiktok_pdp_dom_scope.py owns bounded structural PDP DOM-scope resolution only.
  - TASK-137 and the existing Playwright manager/session implementation remain the sole browser/CDP
    lifecycle and borrowed-session authority.
  - CAPABILITY_IS_NOT_AUTHORITY, EVIDENCE_IS_NOT_PRODUCT_TRUTH,
    SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY, SNAPSHOT_IS_NOT_TREND,
    AMBIGUOUS_PRICE_IS_NOT_EXACT_PRICE, and ONE_CAPABILITY_ONE_AUTHORITY remain mandatory.

