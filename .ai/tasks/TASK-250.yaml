task_id: TASK-250
revision: 1

goal: >
  Canonicalize the Human/Brain authorization for exactly one Human-operated post-TASK249 live
  TikTok public-PDP collector validation against the already-selected exact listing, using only the
  reviewed and published TASK-249 V2 live-pilot carrier and the TASK-248 collector baseline it binds.
  Grant one bounded live validation attempt without changing implementation, executing TikTok/CDP,
  normalizing external output into canonical Product Intelligence evidence, authorizing automation,
  recommendation, ranking, approval, market test, or any commerce action.

problem: >
  TASK-249 is exactly reviewed and published at
  84739c2a13d9d89ef5379ecba7a9d4b83ed64771 through RUN-249-002 / REVIEW-249-001. It hardened the
  existing Human-operated live-pilot carrier with a durable V2 attempt marker, bounded terminal
  result, exact TASK-248 collector-baseline provenance, interruption semantics, secret-safe failure
  handling, and no automatic retry. Canonical planning now returns exactly to
  HUMAN_BRAIN_LIVE_PUBLIC_PDP_PILOT_AUTHORIZATION with authorized_validation_attempts=0 and no live
  acquisition authority. The Human has explicitly chosen to continue the roadmap. The unique next
  commitment is therefore an authorization-only record for one future Human-operated validation
  attempt bound to the exact published TASK-249 carrier source; TASK-250 must not perform that live
  attempt during engineering.

assumptions:
  - Canonical main at authoring is 84739c2a13d9d89ef5379ecba7a9d4b83ed64771.
  - TASK-249 / RUN-249-002 / REVIEW-249-001 are PASS and exact-source published at
    84739c2a13d9d89ef5379ecba7a9d4b83ed64771.
  - TASK-248 remains the exact collector validation baseline at
    39979020a10b78e1f86c30cf2b704f2f975daec9; TASK-250 does not move that collector baseline.
  - The selected context remains p8-pilot-001-led-motion-tiktok-vn, source ID
    "1731381331718341815", and stable listing
    https://shop.tiktok.com/vn/pdp/den-led-cam-bien-chuyen-dong-3-che-do-sang-sac-usb-c/1731381331718341815.
  - src/product_intelligence/tiktok_pdp_live_pilot.py is the sole operation-specific carrier and
    its fixed V2 artifacts are tiktok-pdp-live-validation-attempt-v2.json and
    tiktok-pdp-live-validation-result-v2.json.
  - TikTokPdpCollector remains the sole exact-PDP observation/admission owner; the canonical TikTok
    parser remains sole scalar-price admission owner; the shared DOM-scope resolver owns structural
    scoping only; TASK-137 remains sole browser/CDP lifecycle authority.
  - CAPABILITY_IS_NOT_AUTHORITY, EVIDENCE_IS_NOT_PRODUCT_TRUTH,
    SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY, SNAPSHOT_IS_NOT_TREND,
    AMBIGUOUS_PRICE_IS_NOT_EXACT_PRICE, MEASUREMENT_IS_NOT_AUTHORITY, and
    ONE_CAPABILITY_ONE_AUTHORITY remain mandatory.
  - TASK-250 authoring and deterministic verification require no live TikTok/CDP access.

