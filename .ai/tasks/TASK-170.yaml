  inspect:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/PHASE_6_M4_QUERY_PLANNING.md
    - docs/PHASE_6_P6_1_RETRIEVAL_QUALITY_EVALUATION.md
    - docs/PHASE_6_P6_1_REAL_EVIDENCE_BASELINE.md
    - docs/PHASE_6_P6_1C_RETRIEVAL_STRESS_BENCHMARK.md
    - docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md
    - docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md
    - .ai/tasks/TASK-122.yaml
    - .ai/tasks/TASK-134.yaml
    - .ai/tasks/TASK-135.yaml
    - .ai/tasks/TASK-164.yaml
    - .ai/tasks/TASK-168.yaml
    - .ai/tasks/TASK-169.yaml
    - tests/fixtures/p6_1b_real_evidence/benchmark.json
    - tests/fixtures/p6_1c_retrieval_stress/benchmark.json
    - tests/integration/test_p6_1b_real_evidence_retrieval_baseline.py
    - tests/integration/test_p6_1c_retrieval_stress_baseline.py
