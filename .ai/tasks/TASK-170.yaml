task_id: TASK-170
revision: 1

goal: >
  Close P6.1d Planner-Assisted Retrieval Stress Benchmark by replaying the exact six
  Human-authored TASK-169 stress intents through the already-published TASK-134 query
  planner and then the already-published TASK-164 retrieval-quality evaluator over the
  same immutable TASK-168 real-evidence corpus. TASK-170 is benchmark/integration work
  only: it must measure the current production planner-plus-lexical retrieval boundary
  before any P6.2 semantic/vector authority is introduced, and it must change zero
  production Python semantics.

problem: >
  Published TASK-169 established that raw TASK-122 lexical retrieval has a systematic
  stress weakness on the six fixed paraphrase/attribute intents: 2 TP, 0 FP, 10 FN,
  micro precision 1/1, and micro recall 1/6. That is strong evidence against relying on
  raw all-term lexical matching alone, but it is not yet sufficient evidence that the
  current production grounded-QA path requires embeddings or vector retrieval because
  TASK-135 already invokes TASK-134 before TASK-123/TASK-122. TASK-134 deliberately
  selects a bounded contiguous lexical span by probing only TASK-122, so it may recover
  relevant evidence from a longer stress intent without creating semantic understanding.
  Before authorizing a new P6.2 retrieval authority, TASK-170 must measure this existing
  planner-assisted composition on the exact same Human labels and corpus. Low or high
  metrics are empirical evidence, not TASK failure and not an automatic architecture
  decision.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-170 authoring is
    52d539aa1a2b880f488987cb07c46ea9347dcdcc, the published TASK-169 revision-2
    source candidate after RUN-169-001 Runtime PASS and REVIEW-169-001 PRIMARY PASS.
  - >
    Published TASK-168 source candidate 0e6626a53c10609a1a7b282d7ca49af33e4d5573
    remains the authoritative P6.1b real-evidence corpus and baseline. Published TASK-169
    freezes the exact six Human stress intents/labels and raw TASK-122 stress snapshot.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@32ace104c5cfaa1b7affbaa40157872b1f85147f.
  - >
    TASK-134 remains the sole deterministic natural-question to retrieval-query planning
    authority. TASK-122 remains the sole lexical retrieval normalization/matching/witness
    authority. TASK-164 remains the sole retrieval-quality evaluation authority.
    TASK-138/139/140/141, TASK-116/117, TASK-120, and TASK-121 remain the published
    evidence-intake, Human-governed admission, durability, and canonical-profile
    authorities used to reconstruct the TASK-168 corpus.
  - >
    The six Human relevance labels and stress intent strings were fixed before TASK-169
    retrieval execution. TASK-170 must reuse them byte-for-byte from the published
    TASK-169 descriptor; planner output, retrieval hits, evidence, metrics, or executor
    observations may not change them.
  - >
    P6.2 remains conditional. TASK-170 must not automatically authorize embeddings,
    vector search, semantic reranking, query expansion, or declare the existing lexical
    stack sufficient. A separate Brain/Human decision follows only after TASK-170 Runtime
    PASS, semantic PASS, publication, and review of the measured planner-assisted results.

