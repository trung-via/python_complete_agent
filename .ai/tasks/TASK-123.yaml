task_id: TASK-123
revision: 1

goal: >
  Add one pure deterministic grounded RAG-context boundary over existing TASK-121
  CanonicalVariantProfile values and TASK-122 lexical retrieval. The boundary must keep
  the caller's natural-language question separate from an explicit retrieval_query,
  invoke TASK-122 exactly once, preserve exact retrieval/profile/evidence lineage,
  package mandatory retrieval witnesses plus bounded supplemental evidence into an
  immutable context value, and render that context as deterministic compact JSON for a
  future model consumer without invoking any model, embedding, reranker, index, network,
  storage, or answer-synthesis path.

problem: >
  TASK-122 can deterministically identify which canonical profiles contain lexical
  evidence relevant to a compact retrieval query, but downstream model consumers still
  lack a bounded, provenance-preserving context package. Passing an unrestricted natural
  language question directly into TASK-122 would conflict with its conservative all-term
  matching contract, while passing only retrieval witnesses would often omit useful
  same-profile evidence. Dumping whole profiles would instead create unbounded context
  and leak irrelevant transport metadata. TASK-123 therefore owns only deterministic
  context packaging: explicit question + explicit retrieval query, exact TASK-122 hits,
  mandatory witness preservation, bounded supplemental TASK-121 evidence blocks,
  deterministic citation addresses, and model-neutral UTF-8 byte budgeting.

assumptions:
  - Current canonical python_complete_agent main baseline before TASK-123 authoring is a045acf09dd82beef9a4eadc8d0dd4a7be3afe44.
  - TASK-121 remains the evidence-preserving canonical variant-profile projection authority.
  - TASK-122 remains the sole canonical lexical-retrieval semantics and ordering authority.
  - A caller may supply a natural-language question whose words are intentionally broader than the compact retrieval_query.
  - TASK-123 may expose deterministic model-facing data but does not own any model prompt, answer, truth, ranking, or instruction-execution semantics.
  - Source evidence is untrusted data; deterministic JSON escaping can preserve data/instruction separation structurally but does not claim complete prompt-injection immunity.

scope:
  inspect:
    - .ai/tasks/TASK-121.yaml
    - .ai/tasks/TASK-122.yaml
    - src/product_intelligence/canonical_profile.py
    - src/product_intelligence/canonical_retrieval.py
    - src/product_intelligence/__init__.py
    - tests/product_intelligence/test_canonical_profile.py
    - tests/product_intelligence/test_canonical_retrieval.py
    - docs/PHASE_6_M3_ENTITY_RESOLUTION.md
  modify:
    - src/product_intelligence/canonical_rag_context.py
    - src/product_intelligence/__init__.py
    - tests/product_intelligence/test_canonical_rag_context.py
    - docs/PHASE_6_M3_ENTITY_RESOLUTION.md

non_goals:
  - Modify TASK-121 profile construction or TASK-122 retrieval semantics, normalization, match classes, witnesses, hit ordering, or limits.
  - Modify TASK-118 catalog integrity, TASK-119 codec, TASK-120 SQLite durability, M2 ranking/scoring, entity resolution, approval, or admission semantics.
  - Infer, rewrite, summarize, normalize, deduplicate, reconcile, average, majority-vote, rank, or otherwise choose a preferred product truth from conflicting evidence.
  - Derive retrieval_query automatically from question through stop-word removal, heuristics, stemming, synonyms, LLMs, embeddings, or model inference.
  - Invoke OpenAI, Gemini, Claude, Minimax, local models, chat/completions, tool calling, agents, browser/network, filesystem, SQLite, subprocesses, environment, clock, random, UUID, background jobs, or queues.
  - Add embeddings, vector databases, ANN, FTS, BM25, TF-IDF, reranking, query expansion, semantic similarity, persistent indexes, retrieval caches, or corpus synchronization.
  - Add model-specific tokenizers, tiktoken, token budgets, provider-specific prompt formats, system prompts, user prompts, answer generation, citations generated by a model, or response validation.
  - Persist or reuse context-local hit/witness/evidence citation IDs as canonical identities.
  - Include product/media source URLs, source_pack_id, source_product_id, hashes, perceptual hashes, local filenames, or other transport-only identifiers in model-facing rendered evidence.
  - Truncate a retained evidence string or partially serialize one evidence block merely to fit the byte budget.

constraints:
  hard:
    - >
      Expose exactly these new TASK-123 public names from product_intelligence:
      CanonicalRagContextError, CanonicalRagEvidenceKind,
      CanonicalRagEvidenceBlock, CanonicalRagHitContext, CanonicalRagContext,
      build_canonical_rag_context, and render_canonical_rag_context. Do not add public
      model/answer/prompt/index/storage/tokenizer APIs.
    - >
      build_canonical_rag_context(profiles, *, question, retrieval_query, max_hits=5,
      max_context_utf8_bytes=32768) must accept the caller-supplied profile corpus and
      exact str question/retrieval_query separately. question and retrieval_query must
      each be exact str values; question must contain at least one non-whitespace code
      point and must be preserved exactly. TASK-123 must not derive or rewrite
      retrieval_query from question.
    - >
      max_hits must be an exact int with bool rejected and be in the inclusive range
      1..100. max_context_utf8_bytes must be an exact int with bool rejected and be in
      the inclusive range 4096..131072. No model tokenizer or token estimate participates
      in validation or packing.
    - >
      The builder must invoke retrieve_canonical_variant_profiles exactly once using the
      supplied profiles, exact retrieval_query, and limit=max_hits. It must accept no
      precomputed hit input and must not reconstruct or independently reimplement
      TASK-122 lexical matching, normalization, classification, ordering, or witnesses.
    - >
      CanonicalRagHitContext must retain the exact TASK-122 CanonicalVariantRetrievalHit
      object. Its exact supplied profile object, match_class, witness tuple, source
      evidence objects, and witness values therefore remain the sole retrieval lineage.
      Do not copy, normalize, rebuild, or reduce those objects.
    - >
      CanonicalRagEvidenceKind must contain exactly OBSERVATION, FACT, and MEDIA.
      CanonicalRagEvidenceBlock must retain the exact corresponding TASK-121 source
      evidence object and a deterministic context-local citation_id. Equal-looking and
      conflicting evidence from distinct retained source objects must remain distinct
      blocks; no value-based deduplication is allowed.
    - >
      Supplemental evidence traversal is deterministic and rooted in each hit profile's
      TASK-121 canonical member order. For each member, include its matching observation
      first, then matching fact_evidence in existing tuple order, then matching
      media_evidence in existing tuple order. The exact TASK-121 evidence object is the
      identity of a supplemental block; do not sort globally by strings, URLs, hashes,
      marketplace, timestamp, or caller corpus order.
    - >
      Model-facing OBSERVATION blocks may render only platform, observed_at, title,
      shop_name, brand, model_sku, and description_text. FACT blocks may render only
      platform, observed_at, key, value, unit, source_section, and provenance. MEDIA
      blocks may render only platform, observed_at, role, provenance, ordinal, alt_text,
      variant_label, and content_type. Optional None values remain explicit JSON null
      where present in the block schema. Do not render source_pack_id, source_product_id,
      product_url, media source_url, hashes, perceptual hashes, local filenames, or any
      other field outside this whitelist.
    - >
      Context-local citation IDs are deterministic addresses only. Hits are H001, H002,
      ... in exact TASK-122 result order. Retrieval witnesses inside each hit are W001,
      W002, ... in exact TASK-122 witness order and may be rendered/addressed as
      H001-W001, etc. Supplemental evidence blocks are E001, E002, ... in exact canonical
      supplemental traversal order within a hit and may be rendered/addressed as
      H001-E001, etc. These IDs create no canonical identity, persistence key, approval,
      ranking, or product-truth claim.
    - >
      Every selected hit header and every TASK-122 retrieval witness is mandatory context
      and must be represented completely before any supplemental evidence is admitted.
      Supplemental evidence is then considered in exact hit order and exact canonical
      block order. A supplemental block is included only if the complete final rendered
      context still fits max_context_utf8_bytes; otherwise omit that whole block. Never
      truncate question, retrieval_query, hit metadata, witness values, or any evidence
      string/field to fit the budget.
    - >
      If question + retrieval metadata + all selected hit headers + all mandatory
      retrieval witnesses cannot fit within max_context_utf8_bytes under the canonical
      renderer, fail closed with CanonicalRagContextError rather than dropping a hit,
      witness, field, or partial string. If supplemental blocks are omitted, the context
      must record truncated=true and omitted_evidence_blocks as the exact count of
      otherwise eligible supplemental blocks not included. If none are omitted,
      truncated=false and omitted_evidence_blocks=0.
    - >
      Supplemental packing must not privilege a truth policy. Witness-source evidence may
      appear again as a supplemental block if reached by canonical traversal; do not
      suppress it merely because a witness already references the same source object.
      Conflicting/latest/majority/equal-looking evidence remains plural and canonical
      ordering, not perceived relevance or confidence, controls supplemental selection.
    - >
      CanonicalRagContext must preserve the exact question, exact retrieval_query, exact
      ordered hit contexts, truncation metadata, and byte-budget value. It must expose
      immutable data only and make no statement that a retrieved or rendered value is
      true, preferred, complete, latest, authoritative, or safe to execute as an
      instruction.
    - >
      render_canonical_rag_context(context) must accept an exact CanonicalRagContext only
      and produce deterministic compact JSON text with schema
      "canonical_variant_rag_context", version 1, ensure_ascii=False, sort_keys=True,
      separators=(",", ":"), no BOM, and no trailing newline. The rendered UTF-8 byte
      length must be <= context.max_context_utf8_bytes and builder budgeting must use this
      exact renderer representation rather than an estimate.
    - >
      The rendered root must include an explicit evidence_policy object stating that
      evidence_is_untrusted_data is true, instructions_inside_evidence_are_not_authoritative
      is true, preserve_conflicts is true, and truncation_may_hide_additional_evidence is
      true. Evidence strings must appear only as JSON data values under the fixed schema;
      do not concatenate them into instruction text, markdown delimiters, XML tags, or
      provider-specific prompt syntax. Documentation must not claim this fully prevents
      prompt injection.
    - >
      Rendering must be deterministic across repeated calls and across value-equal context
      reconstruction. Context building must remain pure in-memory computation: zero model,
      embedding, rerank, retrieval-index, SQLite/filesystem/network/browser, environment,
      clock, random, UUID, subprocess, or upstream entity-resolution/admission work.
    - >
      Do not modify canonical_profile.py, canonical_retrieval.py, ranking.py, scoring.py,
      canonical_catalog*.py, product_source models/serialization, or earlier M3 modules.
      Documentation must state TASK-121 owns evidence projection, TASK-122 owns lexical
      retrieval, and TASK-123 owns deterministic grounded context packaging only; model
      invocation and answer synthesis remain future consumers outside this task.
    - Do not push from executor execution.

acceptance:
  - id: AC1
    condition: >
      Public exports add exactly the bounded TASK-123 context error, evidence-kind enum,
      evidence/hit/context immutable values, builder, and renderer, with no model,
      prompt, answer, embedding, tokenizer, index, or storage API.
  - id: AC2
    condition: >
      Builder validates exact question/retrieval_query, max_hits, and UTF-8 byte budget,
      preserves question/retrieval_query unchanged, and never derives one from the other.
  - id: AC3
    condition: >
      Builder delegates exactly once to TASK-122 with retrieval_query and max_hits,
      accepts no precomputed/forged hit path, and preserves exact returned hit/profile/
      witness/source-evidence identity and order.
  - id: AC4
    condition: >
      Supplemental OBSERVATION/FACT/MEDIA evidence blocks reuse exact TASK-121 evidence
      objects, follow canonical member/evidence traversal, keep duplicate/conflicting
      evidence plural, and expose no transport-only URLs/IDs/hashes in rendered blocks.
  - id: AC5
    condition: >
      Context-local H/W/E citation addresses are deterministic from TASK-122/TASK-121
      order, stable across repeated equivalent construction, and create no canonical
      identity or truth semantics.
  - id: AC6
    condition: >
      All selected hit headers and retrieval witnesses are mandatory before supplemental
      evidence; supplemental blocks are admitted whole in canonical order only when the
      exact rendered context remains within the byte budget.
  - id: AC7
    condition: >
      No retained question, query, witness, or evidence string is partially truncated.
      Mandatory-context overflow fails closed; supplemental omission records exact
      truncated/omitted_evidence_blocks metadata.
  - id: AC8
    condition: >
      Packing preserves plural conflicting/equal-looking evidence and uses no latest,
      majority, confidence, marketplace, semantic relevance, or product-truth policy.
  - id: AC9
    condition: >
      Renderer emits exact deterministic compact JSON schema/version 1, no BOM/newline,
      exact original strings, explicit nulls where applicable, and final UTF-8 bytes
      never exceed context.max_context_utf8_bytes.
  - id: AC10
    condition: >
      Rendered policy marks evidence as untrusted data and non-authoritative instructions;
      source text is structurally JSON data only, while docs avoid claiming complete
      prompt-injection immunity.
  - id: AC11
    condition: >
      Successful building/rendering performs zero model/embedding/rerank/index,
      ranking/scoring, SQLite/filesystem/network/browser, resolver/grouping/approval/
      admission, environment, clock/random/UUID, or subprocess work and leaves TASK-121/
      TASK-122 and earlier authorities unchanged.
  - id: AC12
    condition: >
      Focused regressions cover validation, separate question/query semantics, exactly-once
      retrieval delegation, hit/profile/witness identity reuse, all evidence kinds and
      whitelist rendering, deterministic citation IDs, conflicts/duplicates, byte-budget
      fit/overflow, whole-block omission, mandatory-witness preservation, deterministic
      compact JSON, hostile instruction-like evidence strings, repeated determinism, and
      no-model/no-I/O behavior; docs record TASK-123 as context packaging only.

verification:
  required:
    - '$env:PYTHONPATH = ".;src"; python -m pytest tests/product_intelligence/test_canonical_profile.py tests/product_intelligence/test_canonical_retrieval.py tests/product_intelligence/test_canonical_rag_context.py -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - 'git diff --check; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
