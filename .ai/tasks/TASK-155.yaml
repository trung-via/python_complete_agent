task_id: TASK-155
revision: 1

goal: >
  Migrate the repository-owned unified AIOS worker from the currently pinned
  AIOS-renew commit 67db82bf19d63f25721d06aabb82d850db8b78d4 to the exact
  semantically reviewed upstream commit 14a1276d69665e7c371b6d56a95e50b992cbc7b3,
  so Python Agent consumes the published TASK-064 verification-only NO_CHANGE REPAIR
  optimization, TASK-065 native Executor token telemetry bridge, and TASK-067
  task/revision-scoped remediation-lineage resolution that prevents unrelated historical
  finding ids from poisoning current FIX admission. Preserve the existing thin
  RUN/FIX/REPAIR/STATUS Human-facing worker, executor identity separation,
  bootstrap/provenance fail-closed behavior, and Python Agent product/publication
  authority without copying or exposing unrelated upstream workflow capabilities.

problem: >
  Python Agent remains pinned to 67db82bf19d63f25721d06aabb82d850db8b78d4.
  Real TASK-154 exposed a pinned-runtime control-plane defect before FIX admission:
  resolving F1 scanned repository-wide remediation refs and dereferenced unrelated
  historical TASK-111 F1 lineage, causing current TASK-154 F1 admission to fail even
  though its own canonical REVIEW/REMEDIATION lineage was valid. The current upstream
  fix is AIOS-renew TASK-067, reviewed PASS at
  14a1276d69665e7c371b6d56a95e50b992cbc7b3. That target also contains the already
  reviewed TASK-064 and TASK-065 hardening that Python Agent has not yet adopted.
  TASK-154 was subsequently completed through the pinned runtime's existing explicit
  REVIEW+REMEDIATION mode, DELTA reviewed PASS, and published at
  27ec982a96619379e8e387f0e8781b9503be2c59. The blocker therefore belongs to downstream
  dependency adoption, not Python Agent product code and not a new AIOS kernel fix.

assumptions:
  - >
    Current canonical python_complete_agent main at TASK-155 authoring is
    27ec982a96619379e8e387f0e8781b9503be2c59, the published TASK-154 F1-remediated
    source candidate.
  - >
    docs/CHATGPT_PROJECT_CONTRACT.md remains authoritative: AIOS-renew is an execution
    substrate, and an upstream improvement does not exist for Python Agent until this
    repository explicitly updates and certifies its exact pin.
  - >
    TASK-113 owns the repository worker/bootstrap control surface and TASK-127 is the
    direct prior pin-migration precedent. TASK-155 extends that same authority only;
    it does not introduce a second worker, runtime store, launcher, or product authority.
  - >
    The current downstream pin is exactly
    67db82bf19d63f25721d06aabb82d850db8b78d4 in both
    requirements-aios-renew.txt and the repository-owned worker launcher.
  - >
    AIOS-renew TASK-067 REVIEW-067-001 is PRIMARY PASS for candidate
    14a1276d69665e7c371b6d56a95e50b992cbc7b3. Its canonical regression suite proves
    unrelated same-name finding ids from other TASKs/revisions cannot poison current
    remediation resolution while relevant malformed/ambiguous lineage still fails closed.
  - >
    14a1276d69665e7c371b6d56a95e50b992cbc7b3 is a descendant of the current downstream
    pin and also contains published TASK-064 and TASK-065 behavior. It additionally
    contains upstream TASK-066/A1 implementation history; pinning the package does not
    by itself install AIOS-renew repository workflows into Python Agent or authorize a
    new Human-facing worker command.
  - >
    TASK-154 is closed and published. TASK-155 must not reopen, rerun, repair, or modify
    TASK-154 or its review/remediation artifacts.

scope:
  inspect:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/tasks/TASK-113.yaml
    - .ai/tasks/TASK-127.yaml
    - .ai/tasks/TASK-154.yaml
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-renew-worker.md
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - tests/aios_bridge/test_aios_worker_control_surface.py
  modify:
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-renew-worker.md
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - tests/aios_bridge/test_aios_worker_control_surface.py

non_goals:
  - Modify Product Intelligence, browser, scraper, persistence, catalog, retrieval, ranking, approval, grounded-QA, or any other product implementation.
  - Modify TASK-154, its source candidates, REVIEWs, REMEDIATION, RUNs, RESULT/EVIDENCE, or publication history.
  - Reimplement TASK-064, TASK-065, or TASK-067 logic inside the Python Agent worker.
  - Let the worker decide NO_CHANGE fast-path eligibility, parse provider token usage, scan remediation history, reconstruct REVIEW/REMEDIATION lineage, or own task/revision filtering.
  - Add raw AIOS CLI, direct package-entry invocation, manual artifact courier steps, retry, fallback, reroute, executor substitution, or automatic correction selection to the normal Human workflow.
  - Copy AIOS-renew .github workflows, expose `wakeup`, `recover-primary`, or any other new operator command, or claim that upstream TASK-066/A1 is adopted as a Python Agent Human-facing capability.
  - Change Python Agent automatic publication workflow or publication authority.
  - Execute an existing Python Agent RUN/FIX/REPAIR as part of migration verification.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      The active dependency file must contain exactly one non-comment pin and it must be
      exactly: aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@14a1276d69665e7c371b6d56a95e50b992cbc7b3
    - >
      .agents/skills/aios-worker/scripts/aios_worker.py AUTHORITATIVE_COMMIT and derived
      PIN_LINE must bind exactly the same 14a1276d69665e7c371b6d56a95e50b992cbc7b3
      commit and existing authoritative repository URL. No branch, tag, version range,
      current-main lookup, alternate source, or environment override may choose the kernel.
    - >
      Existing dedicated <git-dir>/aios/worker-runtime bootstrap remains authoritative.
      Installed PEP 610 provenance from 67db82bf19d63f25721d06aabb82d850db8b78d4
      or any alternate source/commit must fail validation and use the existing atomic
      stale-runtime replacement path to install only the checked-in new pin before the
      next kernel invocation. An already-authoritative 14a1276d... runtime must be reused.
    - >
      The visible Human protocol remains exactly RUN TASK-N, FIX TASK-N FINDING-ID,
      REPAIR RUN-N-NNN, and STATUS TASK-N. Parsing, command shapes, strict PASS-summary
      parsing, one-kernel-invocation behavior, no-push behavior, and target validation
      remain unchanged except for consuming the new pinned distribution.
    - >
      Codex surface remains permanently bound to executor codex and Antigravity surface
      remains permanently bound to executor antigravity. No TASK, failure, runtime state,
      token observation, or model condition may reroute or substitute executor identity.
    - >
      FIX remains a thin delegation of TASK id + finding id + selected executor to the
      pinned Runtime. The worker must not enumerate remediation refs, inspect historical
      F1/F2 branches, dereference source artifacts, or duplicate TASK-067 task/revision
      filtering. Documentation may state that the new pin fixes cross-TASK finding-id
      poisoning, but ownership remains upstream Runtime/transport.
    - >
      REPAIR remains a thin delegation of explicit failed RUN + selected executor. The
      worker must not decide whether TASK-064 verification-only NO_CHANGE reuse is
      eligible, reconstruct pre-verification state, or invoke/skips an Executor itself.
      Any zero-Executor continuation is owned and evidenced by the pinned Runtime.
    - >
      Token usage remains optional subordinate RUN_OBSERVATION telemetry owned by the
      pinned native adapters/Runtime. The worker must not parse provider events, infer
      tokens, request usage endpoints, add model calls, or treat token data as RESULT,
      EVIDENCE, review, routing, or acceptance authority.
    - >
      Although the target upstream commit contains TASK-066/A1 history, this downstream
      migration must not copy AIOS-renew workflow files, add self-hosted wakeup, expose a
      new Human-facing operation, or alter Python Agent publication/automation authority.
      The checked-in worker surface remains RUN/FIX/REPAIR/STATUS only.
    - >
      Documentation must identify the exact adopted upstream capabilities relevant to
      Python Agent: TASK-064 eligible NO_CHANGE verification-only continuation,
      TASK-065 same-invocation Executor token telemetry when available, and TASK-067
      task/revision-scoped remediation resolution. It must distinguish these from
      capabilities present in upstream history but not exposed by this downstream worker.
    - >
      Certification tests must update the exact expected pin, launcher provenance,
      stale-runtime replacement target, and prior-pin rejection while preserving all
      existing RUN/FIX/REPAIR/STATUS, bootstrap-host, strict parsing, executor separation,
      one-invocation, no-push, and worker-thinness regressions.
    - >
      Migration verification must be deterministic and network-free with respect to
      live Python Agent product/provider behavior. Do not run TASK-154 live certification
      or any other existing product execution merely to prove a dependency pin update.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      Dependency file, launcher authoritative commit, derived pin string, worker docs,
      and certification expectations all reference exactly
      14a1276d69665e7c371b6d56a95e50b992cbc7b3 and reject
      67db82bf19d63f25721d06aabb82d850db8b78d4 as stale provenance.
  - id: AC2
    condition: >
      Bootstrap regressions prove a stale/alternate worker runtime is not reused and is
      atomically synchronized to the exact new pin using only the checked-in requirements
      file, while an already-authoritative new runtime is reused without reinstall.
  - id: AC3
    condition: >
      RUN, FIX, REPAIR, and STATUS retain unchanged Human-facing meaning, exact executor
      identity, strict canonical PASS parsing, one pinned-kernel invocation at most, and
      no worker-owned retry/reroute/publication authority.
  - id: AC4
    condition: >
      Worker FIX remains thin and contains no repository-wide remediation discovery or
      historical lineage filtering logic; consuming TASK-067 occurs solely through the
      exact pinned AIOS distribution, so unrelated historical finding ids cannot require
      a Python Agent workaround or branch cleanup.
  - id: AC5
    condition: >
      Worker REPAIR remains thin and does not implement TASK-064 fast-path decisions;
      documentation correctly states that eligible NO_CHANGE verification-only
      continuation may invoke zero Executors only when the pinned Runtime proves all
      canonical reuse preconditions.
  - id: AC6
    condition: >
      Worker code adds no token parsing or telemetry authority; documentation correctly
      states that TASK-065 token_usage is optional same-native-invocation Executor-only
      operational telemetry and may remain null when the native response does not expose
      a complete trusted counter group.
  - id: AC7
    condition: >
      No AIOS-renew workflow is copied and no wakeup/recover-primary/new worker command is
      exposed despite the target commit containing TASK-066 history; Python Agent normal
      Human surface remains exactly RUN/FIX/REPAIR/STATUS.
  - id: AC8
    condition: >
      No Product Intelligence or TASK-154 implementation/artifact/publication file is
      changed by TASK-155, and Python Agent's existing auto-publication workflow remains
      unchanged.
  - id: AC9
    condition: >
      The complete repository-owned worker certification suite passes on the migrated
      source tree and git diff --check passes, without invoking a live existing
      RUN/FIX/REPAIR or repeating TASK-154 verification.

verification:
  required:
    - 'python -m pytest tests/aios_bridge/test_aios_worker_control_surface.py -q'
    - 'git diff --check'
