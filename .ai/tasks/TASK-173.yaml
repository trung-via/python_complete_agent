task_id: TASK-173
revision: 1

goal: >
  Continue P6.3b with one narrow live-DOM compatibility hardening inside the existing
  ShopeeSourceExtractor so explicit selected-variant state rendered by the current Shopee PDP
  control shape can enter the already-published TASK-172 ProductFact evidence boundary. Preserve
  TASK-172 selected-variant semantics, TASK-162 readiness semantics, TASK-108 relationship
  authority, TASK-116 Human sellable-variant admission, TASK-171 descriptive truth authority,
  ProductSourcePack schema, and browser/session ownership unchanged.

problem: >
  TASK-172 is published at source candidate 63525151e4dbb7a1c30454a301e3c0e20ae771e9 and
  REVIEW-172-003 records DELTA PASS on that exact candidate. A subsequent Human-owned external
  live capture on 2026-09-09, after the Human solved Shopee CAPTCHA and CDP 9222 was healthy,
  reached READY for one real Shopee listing (source_product_id 10374101498), but both persisted
  observations contained zero "variant" ProductFact values. Direct evaluation on the same live
  page then proved structured current-product identity matched target product_id 10374101498 while
  selected_variants_complete remained false even after the Human explicitly selected the sellable
  option "K550 Trắng Red V4". A bounded DOM diagnostic established why: the existing positive
  selector matched section.C21rQm in the left gallery column, while the real variation controls
  were rendered in the sibling product-details branch under one group labelled "Model". The live
  option controls are BUTTON elements carrying semantic class tokens selection-box-selected or
  selection-box-unselected; exactly one button was selection-box-selected. The gallery separately
  contains thumbnail-selected-mask elements, and lower-page add-on content contains variant-like
  product text, so broad selected-class or whole-page scanning would create false product truth.
  This task corrects only the existing ShopeeSourceExtractor DOM observation boundary using an
  offline regression that reproduces the proven live shape; it is not live certification.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-173 authoring is
    63525151e4dbb7a1c30454a301e3c0e20ae771e9, the published TASK-172 source candidate.
  - >
    Canonical REVIEW-172-003 on branch aios/review-decision/RUN-172-003 has
    reviewed_sha 63525151e4dbb7a1c30454a301e3c0e20ae771e9, mode DELTA, verdict PASS,
    prior_finding_id F2, and no findings.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@32ace104c5cfaa1b7affbaa40157872b1f85147f.
  - >
    TASK-162 remains the sole Shopee product-page bounded readiness authority. TASK-173 must not
    change the current first-trusted-media-ready termination rule, readiness attempt count/delay,
    browser/session acquisition, navigation count, or CAPTCHA ownership.
  - >
    TASK-172 remains the sole selected-variant source-evidence semantic authority. This task is a
    compatibility hardening of the same private extraction script, not a second variant-evidence
    owner and not a redefinition of complete/explicit selected state.
  - >
    TASK-108 remains the sole pairwise ProductSourcePack relationship resolver; TASK-116 remains
    the sole sellable-variant proposal/Human-decision authority; TASK-171 remains the sole
    descriptive product-truth reconciliation authority.
  - >
    Human authentication, login, CAPTCHA solving, and any explicit marketplace selection remain
    outside repository code. TASK-173 observes only already-rendered state and never clicks or
    chooses an option.
  - >
    The 2026-09-09 live diagnostic is external operational evidence, not a repository fixture.
    Executor verification must remain offline and encode only the minimum proven DOM shape needed
    for deterministic regression coverage.

