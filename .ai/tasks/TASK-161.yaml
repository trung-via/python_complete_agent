task_id: TASK-161
revision: 1

goal: >
  Explicitly migrate the repository-owned unified AIOS worker from the currently pinned
  AIOS-renew commit ba0cc66324fc2310812945a351bfc001a41f99f8 to the exact semantically
  reviewed and published TASK-080 source candidate
  32ace104c5cfaa1b7affbaa40157872b1f85147f, so Python Agent consumes both published
  TASK-079 REMEDIATION structural-output hardening and TASK-080 REPAIR structural-output
  hardening before continuing the preserved TASK-156/F1 lineage. Preserve the existing
  thin RUN/FIX/REPAIR/STATUS Human-facing worker, exact executor identity,
  bootstrap/provenance fail-closed behavior, Runtime-owned canonical lineage and
  acceptance authority, no-retry/no-fallback/no-reroute semantics, and Python Agent
  product/publication authority. Do not execute, repair, rerun, review, publish, or
  otherwise mutate TASK-156 product work during this migration.

problem: >
  Python Agent main currently pins AIOS-renew at
  ba0cc66324fc2310812945a351bfc001a41f99f8, the published TASK-078 source consumed by
  TASK-160. Under that pin, historical FIX for TASK-156/F1 was successfully admitted and
  produced clean in-scope correction candidate
  38e087e6925b1e7bac81c0eddc8b4dbb8992ff25, but RUN-156-007 failed at COMPLETION_GATE
  with `remediation RESULT claims must be empty`. Upstream AIOS TASK-079 corrected that
  provider-native REMEDIATION schema mismatch. While certifying TASK-079, its CODE_FIX
  REPAIR continuation RUN-079-002 exposed an analogous REPAIR structural mismatch: the
  generic native schema allowed claims=[], while Runtime correctly required complete TASK
  acceptance claims before verification. AIOS TASK-080 then added a repair-specific
  structural schema that requires at least one claim, empty unresolved/root evidence,
  and empty per-claim evidence while leaving dynamic complete acceptance coverage solely
  to Runtime. TASK-079 is published in the lineage leading to TASK-080, and TASK-080 is
  canonical PRIMARY PASS and published at
  32ace104c5cfaa1b7affbaa40157872b1f85147f. Per Python Agent project contract, neither
  upstream hardening exists downstream until this repository explicitly updates and
  certifies its exact dependency pin.

assumptions:
  - >
    Current canonical python_complete_agent main at TASK-161 authoring is
    2f4202a00556673d486a37ac2266b5aabda1b70d, the published TASK-160 source candidate.
  - >
    The current downstream AIOS pin is exactly
    ba0cc66324fc2310812945a351bfc001a41f99f8 in the requirements pin and repository-owned
    launcher authoritative commit.
  - >
    AIOS-renew TASK-079 is canonical PRIMARY PASS and published at source candidate
    4ee6e68ec1ad8fe92a26fcd3bcf4e12067c69600. It introduces a remediation-specific
    native schema for both Codex and Antigravity that structurally requires empty root
    evidence, empty result.claims, and empty result.unresolved while preserving Runtime
    fail-closed completion authority.
  - >
    AIOS-renew TASK-080 is canonical PRIMARY PASS at source candidate
    32ace104c5cfaa1b7affbaa40157872b1f85147f. RUN-080-001 reports 129 focused tests
    passed plus git diff --check PASS; REVIEW-080-001 is PRIMARY PASS with AC1-AC7 PASS.
  - >
    The interval from ba0cc66324fc2310812945a351bfc001a41f99f8 to
    32ace104c5cfaa1b7affbaa40157872b1f85147f is five commits and includes the published
    TASK-079 and TASK-080 authoring/implementation lineage. The target pin is the exact
    TASK-080 reviewed source candidate, not AIOS current-main-by-name or a moving ref.
  - >
    TASK-113 remains the repository-owned worker/bootstrap authority. TASK-157 through
    TASK-160 remain direct pin-migration precedents. TASK-161 extends only that existing
    authority and creates no second launcher, runtime store, schema validator, Product
    Intelligence authority, remediation/repair resolver, or publication authority.
  - >
    TASK-156 remains active and unpublished. REVIEW-156-006 is PRIMARY CHANGES_REQUIRED
    with only F1/AC10 failing on reviewed_sha
    d66faa95c8c03e1fe2d5f4c4c36b44b7fc9bc364. REMEDIATION-156-006-F1 is CODE_FIX with
    modification_scope exactly the two roadmap documents. RUN-156-007 is an admitted
    REMEDIATION failure at COMPLETION_GATE with failed_head_sha
    38e087e6925b1e7bac81c0eddc8b4dbb8992ff25; its candidate is clean, repairable,
    transportable, and changed_files is exactly those two roadmap documents.
  - >
    P6.0b remains the active certification objective. This migration is execution
    substrate maintenance only and must not claim TASK-156 F1 resolution, P6.0 closure,
    P6.1 activation, or any Product Intelligence semantic change.

