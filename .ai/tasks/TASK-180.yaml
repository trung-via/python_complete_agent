task_id: TASK-180
revision: 1

goal: >
  Add a durable operator-facing certification protocol for Python Agent's adopted
  AIOS-renew stale-checkout CONTINUE boundary. The protocol must explain how a fresh
  remote-only TASK can be exercised through the repository-owned CONTINUE surface
  without a manual git pull, what observable evidence distinguishes a real
  pre-resolution synchronization passage from a false or manually-assisted success,
  and which fail-closed boundaries must remain intact. Add a focused regression so the
  operational contract cannot silently drift. This TASK does not itself declare the
  live proof successful; canonical RUN/RESULT/review/publication lineage from the Human
  invocation remains the evidence for that decision.

problem: >
  TASK-179 migrated Python Agent to exact AIOS-renew source candidate
  883974be6ec5922ae57021b50a48c84a0014dbfa, which includes published TASK-088
  missing-local-TASK pre-resolution synchronization. Active documentation describes the
  semantics and explicitly says a live stale-checkout proof is still pending, but there
  is no concise durable certification procedure defining the proof precondition,
  permitted Human action, expected observable evidence, and invalidating/manual-assist
  conditions. Without that procedure, future operators could accidentally make a proof
  meaningless by pulling first, retrying after failure, using raw operator commands, or
  treating an Executor/document claim as evidence of control-plane behavior.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-180 authoring is
    00c776477a82a1d387bebaefe091d473b79f8928, the reviewed and published TASK-179
    source candidate. REVIEW-179-002 is PRIMARY PASS and the repository-native Safe
    Publisher published that exact source candidate.
  - >
    The authoritative downstream AIOS dependency is exactly
    `aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@883974be6ec5922ae57021b50a48c84a0014dbfa`.
    This exact pin contains the semantically reviewed and published TASK-088 behavior;
    current/future AIOS-renew main is not downstream authority.
  - >
    Python Agent's normal Human lifecycle surface remains `$aios-worker CONTINUE TASK-N`
    for Codex or `/aios-renew-worker CONTINUE TASK-N` for Antigravity. The downstream
    launcher remains thin and delegates exactly one canonical operation to pinned
    AIOS-renew.
  - >
    The operational live-proof condition for this TASK is external to implementation:
    the Human should invoke TASK-180 from a repository checkout that already contains
    the TASK-179 migrated worker pin but does not yet contain `.ai/tasks/TASK-180.yaml`,
    and must not manually synchronize the repository merely to make the proof pass.
    Executor prose is never evidence that this precondition held.
  - >
    P6.3 remains CLOSED and P6.4-P6.6 remain deferred pending a fresh architecture/value
    audit. This control-plane certification work does not open or alter product roadmap
    authority.

scope:
  inspect:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-renew-worker.md
    - tests/aios_bridge/test_aios_worker_control_surface.py
    - .ai/tasks/TASK-179.yaml
  modify:
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - tests/aios_bridge/test_aios_worker_control_surface.py

non_goals:
  - Modify AIOS-renew, the downstream AIOS pin, launcher behavior, worker bootstrap,
    TASK/RUN parsing, CONTINUE/STATUS translation, executor selection, publication, or
    any synchronization implementation.
  - Add a second state machine, local TASK discovery policy, Git sync implementation,
    retry, fallback, reroute, polling, recursive CONTINUE, planner, or model selection.
  - Modify Codex or Antigravity surface files merely to duplicate the runbook; their
    existing commands and authority separation remain unchanged.
  - Claim from implementation text or tests that this TASK's live stale-checkout
    invocation succeeded, that Downstream Adoption is DONE, or that a canonical RUN,
    semantic review, or publication occurred before those artifacts actually exist.
  - Modify Product Intelligence source/tests, marketplace behavior, Phase 6 product
    semantics, product roadmaps, or open P6.4-P6.6.
  - Require a manual `git pull`, raw `aios ...` command, direct executor invocation, or
    repeated CONTINUE call as part of the certification path.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Add one concise section to `docs/AIOS_UNIFIED_WORKER_WORKFLOW.md` defining the
      stale-checkout CONTINUE certification protocol. It must identify the exact current
      downstream pin 883974be6ec5922ae57021b50a48c84a0014dbfa as a prerequisite,
      require that the fresh proof TASK exists on canonical remote but is absent from the
      local checkout before invocation, and use only the repository-owned CONTINUE
      surface as the Human lifecycle action.
    - >
      The protocol must explicitly state that the Human must not manually pull/fetch-reset,
      retry CONTINUE, switch executors, or fall back to raw operator commands to manufacture
      a successful proof. A failed first invocation remains evidence to inspect rather than
      permission for an automatic retry or reroute.
    - >
      The protocol must distinguish observable control-plane proof from implementation
      claims. Valid evidence must include the pre-invocation remote-only/local-missing TASK
      condition plus canonical AIOS lifecycle evidence showing that the same CONTINUE
      invocation progressed beyond missing-TASK resolution into the derived lifecycle
      action. Executor-authored prose, a documentation edit, or a later manual pull alone
      is insufficient.
    - >
      Preserve TASK-088 boundaries: only the missing-local-TASK CONTINUE pre-resolution
      path may synchronize under pinned Runtime rules; existing local TASKs do not gain a
      generic sync path; STATUS/state remains read-only for product state; unsafe
      repository states fail closed; downstream code does not implement Git synchronization;
      and one CONTINUE invocation delegates at most one canonical lifecycle operation.
    - >
      Add focused regression coverage in
      `tests/aios_bridge/test_aios_worker_control_surface.py` for the runbook's proof
      prerequisites, forbidden manual-assist/retry/reroute behavior, evidence distinction,
      exact current pin, and the fact that the documentation does not claim Downstream
      Adoption completion. The regression must remain semantically specific while being
      insensitive to ordinary Markdown whitespace and line wrapping.
    - >
      Do not change `.agents/skills/aios-worker/requirements-aios-renew.txt`,
      `.agents/skills/aios-worker/scripts/aios_worker.py`, either active worker surface,
      `.github/workflows/aios-auto-publish.yml`, publication tests, historical TASKs, or
      Product Intelligence/Phase 6 files.
    - >
      The runbook may describe the expected proof procedure and evidence types, but it must
      not write a PASS/FAIL outcome for TASK-180 itself. Reviewer/Runtime artifacts remain
      the only authority for that outcome.
    - >
      Modified files must remain UTF-8 without BOM and LF line endings where required by
      repository format.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      The unified worker documentation contains a concise stale-checkout CONTINUE
      certification protocol bound to exact downstream AIOS pin
      883974be6ec5922ae57021b50a48c84a0014dbfa and clearly states the remote-only TASK /
      local-missing TASK precondition before the first invocation.
  - id: AC2
    condition: >
      The protocol uses only the repository-owned CONTINUE Human surface and explicitly
      rejects manual pull/sync assistance, raw operator fallback, retry, reroute, or
      executor switching as ways to manufacture a successful certification.
  - id: AC3
    condition: >
      The protocol defines observable evidence sufficient to distinguish a genuine
      pre-resolution synchronization passage from implementation prose or later manual
      repository synchronization, while preserving fail-closed behavior if the first
      invocation does not pass the boundary.
  - id: AC4
    condition: >
      Documentation preserves existing TASK-088/Unified Human Surface authority: STATUS
      remains read-only, existing local TASKs do not gain generic auto-sync, downstream
      code owns no Git synchronization, and one CONTINUE invocation delegates at most one
      canonical lifecycle operation.
  - id: AC5
    condition: >
      Focused regression coverage enforces AC1-AC4 plus the explicit prohibition on
      claiming TASK-180/Downstream Adoption completion from documentation alone, and the
      checks tolerate ordinary Markdown whitespace wrapping without becoming generic
      keyword-only assertions.
  - id: AC6
    condition: >
      Required verification and Runtime repository-integrity gates pass with no unresolved
      items and the implementation changes only
      `docs/AIOS_UNIFIED_WORKER_WORKFLOW.md` and
      `tests/aios_bridge/test_aios_worker_control_surface.py`.

verification:
  required:
    - 'python -m pytest tests/aios_bridge/test_aios_worker_control_surface.py -q'
    - 'git diff --check'
