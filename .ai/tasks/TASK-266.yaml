non_goals:
  - Run TikTok, CDP, browser, scraper, API, search, collector, authenticated Affiliate access, provider/model, Drive, or any live/external acquisition.
  - Authorize or execute Wave 0, Wave 1, Wave 2, authenticated affiliate inspection, market test, spend, traffic, content publication, outreach, pricing/inventory mutation, or commerce action.
  - Establish affiliate eligibility, affiliate commission rate, estimated commission, actual commission, audience-channel fit, creator ecosystem, content activity, competition saturation, test readiness, or winner status.
  - Fabricate or infer quality_constraints or risk_constraints.
  - Treat target_audience as audience_channel_fit evidence.
  - Treat contribution-margin threshold as evidence that contribution margin is currently known or positive.
  - Substitute seller-side COGS, seller platform fees, seller shipping, or other seller economics as creator/affiliate pilot costs without a separately justified authority.
  - Construct or mutate ProductCandidateSnapshot, SignalEvidence, TikTokAffiliateEvidenceProfile, ValueOfInformationPlan, MarketTestEvidenceProfile, WinnerValidationAssessment, CommerceDecisionLoopCase, or another semantic owner.
  - Create or mutate P7.3 DecisionContext.decision_deadline.
  - Modify production Python code, AIOS adoption/conformance state, downstream pin, Governance Foundation documents, or historical TASK/RUN/REVIEW lineage.
  - Preselect TASK-267 or any engineering/acquisition implementation successor.

constraints:
  hard:
    - >
      Classification is exactly POST_HUMAN_INPUTS_DECISION_SUFFICIENCY_REVIEW_ONLY.
      TASK-266 records Human-supplied planning inputs and one fresh Human/Brain sufficiency
      reconciliation; it performs zero live acquisition and zero commerce action.
    - >
      Record exactly ten Human-input names. Eight are Human supplied/approved and two remain
      UNSET: quality_constraints and risk_constraints.
    - >
      Record budget as 5000000 VND hard ceiling, duration as 14 days, and target_audience exactly
      as the Human supplied phrase "người trẻ có thời lượng sử dụng mạng xã hội cao".
    - >
      Record exposure controls exactly as initial_at_risk_tranche_vnd 750000,
      mandatory_review_before_additional_exposure true, total_budget_hard_cap_vnd 5000000,
      automatic_second_tranche false, and automatic_scaling false.
    - >
      Record contribution_margin_threshold as creator/affiliate perspective with the decision
      formula SETTLED_AFFILIATE_COMMISSION_MINUS_DIRECTLY_ATTRIBUTABLE_INCREMENTAL_VARIABLE_PILOT_COSTS
      and threshold GT_0_VND. This is a Human-approved criterion, not current marketplace evidence.
    - >
      Record risk_acceptance as 15 percent of budget and max_accepted_economic_loss_vnd 750000.
      Do not reinterpret it as probability, drawdown from revenue, or seller-side margin.
    - >
      Record decision_timing as checkpoint_day 7 and final_review_day 14 while preserving
      p7_3_deadline_mutated false and requiring separate P7.3 authorization for any canonical
      deadline reconciliation.
    - >
      Record the Human-approved success/failure/inconclusive criteria from the assumptions
      without converting them into P7.6 evidence, winner status, recommendation, or test approval.
    - >
      Fresh sufficiency review must preserve MARKET_TEST_READINESS_NOT_ESTABLISHED,
      affiliate_economics NOT_ESTABLISHED, canonical_evidence_ingested false, selector_repair_complete
      false, and all market-test/action authorities NONE.
    - >
      target_audience supplied does not establish audience_channel_fit. quality_constraints and
      risk_constraints remain Human-owned UNSET blockers for any later market-test authorization.
    - >
      The fresh Human/Brain review may identify the exact-listing authenticated affiliate-economics
      question — affiliate eligibility, commission rate, and estimated commission through a
      legitimate exact-listing source — as the highest-decision-impact unresolved marketplace
      information gap. This qualitative selection must not construct a P7.5 ValueOfInformationPlan,
      score/rank evidence dimensions, or claim that acquisition is authorized.
    - >
      On exact reviewed TASK-266 publication, planning hands only to
      HUMAN_BRAIN_AUTHENTICATED_AFFILIATE_ECONOMICS_ACQUISITION_AUTHORIZATION.
      authenticated_affiliate_lookup_authority remains NONE until a later explicit Human decision;
      next_milestone remains null, pending_commitments remains empty,
      post_run_engineering_successor remains null, automatic_progression remains false, and no
      TASK-267 is preselected.
    - >
      Preserve TASK-264/TASK-265 historical observations, external artifact provenance, screenshot
      handling constraint, one-shot capture closure, and all closed live/action authorities.
    - >
      Modify exactly the five authorized planning/documentation/governance-test paths. Runtime
      verification is offline and deterministic. Executor must not collect evidence, self-review,
      publish, or start successor work.
    - >
      Completion-gate acceptance is limited to candidate facts available before Runtime
      verification. Executor completion must not claim Runtime PASS, Reviewer PASS, or publication.

acceptance:
  - id: AC1
    condition: >
      The exact ten-input Human planning envelope is canonicalized after TASK-265 publication with
      eight Human-supplied/approved values and only quality_constraints plus risk_constraints UNSET.
  - id: AC2
    condition: >
      Budget, duration, target audience, exposure controls, risk acceptance, contribution-margin
      threshold, success/failure/inconclusive criteria, and decision timing exactly preserve the
      Human-approved meanings and values without marketplace inference or fabricated facts.
  - id: AC3
    condition: >
      Contribution-margin semantics remain creator/affiliate scoped and distinguish Human threshold
      from unknown actual affiliate economics; seller-side economics are not silently substituted.
  - id: AC4
    condition: >
      Fresh decision-sufficiency state preserves affiliate_economics NOT_ESTABLISHED,
      MARKET_TEST_READINESS_NOT_ESTABLISHED, target_audience != audience_channel_fit evidence,
      quality/risk constraints UNSET, canonical_evidence_ingested false, and selector_repair_complete false.
  - id: AC5
    condition: >
      Exact-listing authenticated affiliate eligibility/commission/estimated commission is recorded
      only as the selected highest-decision-impact unresolved marketplace information gap for a
      later Human authorization decision; no lookup/acquisition/test/action authority is granted.
  - id: AC6
    condition: >
      Human inputs remain separate from P7.4 evidence and P7.5 VOI ownership, and decision timing
      creates no duplicate P7.3 deadline authority.
  - id: AC7
    condition: >
      Exact reviewed TASK-266 publication hands planning only to
      HUMAN_BRAIN_AUTHENTICATED_AFFILIATE_ECONOMICS_ACQUISITION_AUTHORIZATION with null next
      milestone/engineering successor, empty pending commitments, automatic progression false,
      authenticated lookup authority NONE, and no TASK-267 preselection.
  - id: AC8
    condition: >
      The Executor candidate changes exactly the five authorized planning/documentation/governance-test
      paths, changes zero production-code files, performs zero live/external operation, is clean,
      descends from canonical TASK-266 base, and has no outside-scope mutation, thereby making it
      eligible for Runtime verification. Focused governance regression and git diff --check remain
      Runtime-owned verification requirements; Reviewer and Publisher remain downstream authorities.

verification:
  policy: minimum-sufficient-v1
  required:
    - python -m pytest tests/aios_bridge/test_aios_governance_state.py -q --basetemp=.git/aios/pytest-task266-primary
    - git diff --check
