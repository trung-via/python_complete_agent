task_id: TASK-266
revision: 1

goal: >
  Canonicalize the Human-supplied and Human-approved decision inputs received after exact
  TASK-265 publication, perform the required fresh Human/Brain decision-sufficiency
  reconciliation for the exact P8 pilot, and hand planning only to a separate Human/Brain
  authorization decision about acquiring exact-listing authenticated affiliate economics.
  Preserve unknowns and closed authorities. Do not execute any marketplace acquisition,
  authenticated lookup, market test, spend, content publication, or commerce action.

problem: >
  Canonical main is eb3c1cc2fa198e10e0ea61f61e27b0042aed549d, the exact reviewed and
  published TASK-265 revision-2 candidate. TASK-265 is DONE and hands planning only to
  HUMAN_OPERATOR_P8_DECISION_INPUTS_SUPPLY, with all ten inputs recorded as UNSET until
  supplied by the Human and with the required next step FRESH_HUMAN_BRAIN_DECISION_SUFFICIENCY_REVIEW.
  The Human has now supplied/approved eight of the ten inputs and explicitly approved the Brain
  proposals for duration, exposure controls, contribution-margin threshold, success/failure
  criteria, decision timing, and the interpretation of 15 percent risk acceptance as a maximum
  750000 VND economic loss against a 5000000 VND pilot budget. quality_constraints and
  risk_constraints remain UNSET. Affiliate eligibility, affiliate commission rate, and estimated
  commission for the exact listing remain NOT_ESTABLISHED, and no authenticated affiliate lookup
  is currently authorized.

assumptions:
  - >
    Canonical main at TASK-266 authoring is exactly
    eb3c1cc2fa198e10e0ea61f61e27b0042aed549d.
  - >
    TASK-265 revision 2 / RUN-265-002 / REVIEW-265-001 is exact reviewed and published
    source authority for the current Human-input handoff.
  - >
    The exact case remains context_id p8-pilot-001-led-motion-tiktok-vn, TikTok Shop Vietnam
    source ID 1731381331718341815, stable listing reference
    https://shop.tiktok.com/vn/pdp/den-led-cam-bien-chuyen-dong-3-che-do-sang-sac-usb-c/1731381331718341815,
    with SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY preserved.
  - >
    Human-approved budget is 5000000 VND and is a hard ceiling, not a spending target.
  - >
    Human-approved duration is 14 days. Human-approved decision timing is a checkpoint on day 7
    and final review on day 14; this is planning timing only and does not mutate P7.3
    DecisionContext.decision_deadline.
  - >
    Human-approved exposure controls are: initial at-risk tranche capped at 750000 VND,
    mandatory Human/Brain review before any additional exposure, total hard cap 5000000 VND,
    no automatic second tranche, and no automatic scaling.
  - >
    Human-approved contribution-margin threshold is creator/affiliate-perspective cumulative
    settled contribution margin greater than 0 VND, where the decision rule is settled affiliate
    commission minus directly attributable incremental variable pilot costs. This threshold is a
    Human economic criterion, not evidence that commission or costs are currently known.
  - >
    Human-approved success/failure criteria are bounded as follows: a success candidate requires
    exact-listing affiliate eligibility to be established, economics to be based on observed
    commission rather than fabricated assumptions, cumulative settled contribution margin above
    0 VND, no breach of the approved risk envelope, no breach of later-supplied quality/risk
    constraints, and evidence sufficient for a later Human/Brain repeatability assessment.
    Stop/failure conditions include established ineligibility, evidence showing no plausible path
    to positive contribution margin within the approved exposure envelope, cumulative economic
    loss reaching 750000 VND, or a serious breach of later-supplied quality/risk constraints.
    If settlement/refund evidence is incomplete or exposure is insufficient, the result is
    INCONCLUSIVE rather than automatically FAILURE.
  - >
    Human-approved target_audience is "người trẻ có thời lượng sử dụng mạng xã hội cao".
    This is a Human planning segment, not evidence that audience_channel_fit is established.
  - >
    quality_constraints and risk_constraints remain UNSET and must not be invented, inferred,
    defaulted, or treated as satisfied.
  - >
    Human-approved risk_acceptance is 15 percent of the 5000000 VND budget, represented as a
    maximum accepted economic loss of 750000 VND before stop/review.
  - >
    P7.3 remains sole owner of DecisionContext and OpportunityHypothesis; P7.4 remains sole owner
    of TikTokAffiliateEvidenceProfile; P7.5 remains sole owner of Value-of-Information planning;
    P7.6 remains sole owner of market-test evidence; P7.7 remains sole owner of winner validation;
    P8.0 remains sole owner of decision-loop composition. Product Intelligence ownership remains
    unchanged.

