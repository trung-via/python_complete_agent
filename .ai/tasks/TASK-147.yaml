task_id: TASK-147
revision: 1

goal: >
  Implement post-M4 P5.3a Live Shortlist Human Decision + M1 Queue Bridge by extending
  the existing Product Intelligence CLI with one bounded Human-facing `decide` operation.
  The operation must run the already-published TASK-146 live discovery/orchestration path,
  present the exact current shortlist to the Human, accept one explicit Human selection and
  APPROVE/REJECT decision during that same process invocation, then delegate the exact
  selected RankedCandidate object to the existing TASK-096 approval authority. Only an
  explicit APPROVE may be delegated once to TASK-096 enqueue_approval; REJECT must create
  no queue mutation. TASK-147 must not create a persistent shortlist/review store, reconstruct
  RankedCandidate from prior JSON, auto-approve, redefine ranking/approval/queue semantics,
  start ingestion, or implement P5.3b/P5.3c family/variant mutation presentation.

problem: >
  TASK-146 now closes P5.2 and gives Humans a live `discover` command that returns the
  canonical OrchestrationResult JSON, while TASK-096 already owns explicit Human
  APPROVE/REJECT and the deterministic M1 queue bridge. A naive separate `approve`
  command over prior `discover` JSON would require reconstructing or persisting a
  RankedCandidate outside existing authority and could let a later process act on stale
  discovery state. P5.3a therefore needs an in-process Human review/action boundary:
  perform one fresh discovery, show that exact shortlist, keep the typed
  OrchestrationResult in memory, let the Human select one current shortlist position,
  and pass the exact selected RankedCandidate object to TASK-096. This adds presentation
  and interaction only; ranking remains M2 authority and approval/queue mutation remains
  TASK-096 authority.

assumptions:
  - >
    Canonical Python Agent main immediately before TASK-147 authoring is
    99f30e5a0b29e8f84589d2974a83207b05f191e7, the published TASK-146 FIX source
    candidate after REVIEW-146-002 DELTA PASS. P1-P4 are CLOSED; P5 is CURRENT /
    IN PROGRESS; P5.1 and P5.2 are CLOSED.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@67db82bf19d63f25721d06aabb82d850db8b78d4.
  - >
    TASK-146 cli.py remains the sole Product Intelligence Human-facing CLI module and
    its `discover` composition over TASK-137 browser/CDP, existing Shopee/TikTok
    adapters, DiscoveryRequest, DiscoveryOrchestrator, and CandidateRanker remains the
    sole live discovery-to-shortlist presentation path.
  - >
    TASK-096 approval.py remains the sole M2 Human approval and M1 queue bridge
    authority. create_approval_record owns RankedCandidate/decision/actor/decided_at
    validation; enqueue_approval owns canonical task construction, tasks.txt/completed.txt
    path defaults, idempotency, append durability, and queue mutation. TASK-147 must
    delegate rather than reproduce those semantics.
  - >
    TASK-096 ApprovalRecord is intentionally in-memory and there is no canonical
    persistent shortlist or approval-history codec. TASK-147 must not invent one merely
    to support a second-process decision command.
  - >
    Existing P3 family/variant Human decision and durable admission authorities remain
    TASK-139/TASK-140/TASK-141. Presenting those authorities through the CLI is deferred
    to P5.3b/P5.3c and is not part of TASK-147.

