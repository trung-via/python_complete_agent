non_goals:
  - Modify approval.py, ApprovalRecord, ApprovalDecision, EnqueueResult, queue task text,
    queue path defaults, idempotency, fsync, completed-file behavior, or TASK-096 validation.
  - Modify ProductCandidateSnapshot, RankedCandidate, WinningProductScore,
    DiscoveryRequest, DiscoveryBatch, OrchestrationResult, DiscoveryOrchestrator,
    CandidateRanker, WinningProductScorer, scoring policy, decision bands, or tie-breaks.
  - Modify PlaywrightBrowserManager/Session, Shopee/TikTok adapters, browser/CDP lifecycle,
    selectors, marketplace extraction, retry/fallback, login, captcha, or anti-bot behavior.
  - Persist or serialize a shortlist, RankedCandidate, approval review session, pending Human
    decision, ApprovalRecord, or REJECT history to a new file/table/database/JSON artifact.
  - Rehydrate or reconstruct a RankedCandidate from a prior `discover` JSON document,
    candidate URL, candidate_id, score payload, rank number, or caller-supplied fields.
  - Allow a prior `discover` invocation to authorize a later `decide` invocation without
    showing the fresh in-process shortlist used by that later decision.
  - Auto-select a shortlist member, infer APPROVE/REJECT from rank, score, confidence,
    DecisionBand, platform, URL, or any machine signal.
  - Start AgentController, execute ingestion, call an executor, wait for queue completion,
    modify completed.txt, or add queue worker/background/scheduler behavior.
  - Add custom tasks/completed queue path controls to P5.3a; TASK-096 canonical defaults
    remain authoritative for this Human-facing bridge.
  - Add family planning/decision/admission, sellable-variant review/decision/admission,
    catalog registration, evidence mutation, provider/LLM calls, Drive work, or P6 behavior.
  - Change AIOS pin, worker surfaces, publication workflow, or prior RUN/REVIEW lineage.

constraints:
  hard:
    - >
      Extend only src/product_intelligence/cli.py as the Human-facing Product Intelligence
      command surface. The CLI must expose exactly five operations: existing `evidence`,
      `catalog`, `ask`, `discover`, plus new `decide`, with no aliases. Existing TASK-145
      and TASK-146 command signatures, stdout/error behavior, discovery composition, and
      semantics must remain unchanged.
    - >
      `decide` must expose exactly the TASK-146 discovery controls plus the minimum explicit
      TASK-096 Human identity/time controls: exactly one `--query`, one or more repeated
      `--platform` values with choices exactly `shopee`/`tiktok`, exactly one
      `--cdp-endpoint`, optional one `--shortlist-size`, exactly one `--actor`, and exactly
      one `--decided-at`. No decision, candidate, score, rank, queue-path, approval-policy,
      ingestion-start, provider, credential, retry, or persistence flag is permitted.
      Repeated `--platform` remains the sole repeatable decide control; every other decide
      option must reject repeated occurrences with argparse-style exit code 2.
    - >
      `--decided-at` is a CLI representation boundary only. It must parse one ISO-8601
      datetime string into a datetime value without adding a wall-clock default and without
      independently enforcing TASK-096 timezone-awareness or other approval semantics.
      Syntactically invalid datetime text may fail as argparse input; a syntactically valid
      but timezone-naive datetime must reach TASK-096 create_approval_record and fail only
      under existing ApprovalError authority.
    - >
      Refactor only private CLI composition as needed so `discover` and `decide` reuse one
      canonical private live-discovery helper that returns the exact typed
      OrchestrationResult after TASK-146 browser cleanup has completed. Each invocation
      must still construct exactly one PlaywrightBrowserManager, preserve exact Human
      platform order, create the same existing adapters/DiscoveryRequest/PlatformDiscoveryPlan
      objects, capture one timezone-aware UTC timestamp once, call orchestrate_discovery
      exactly once, and attempt close_all exactly once. TASK-147 must not duplicate a second
      discovery implementation or change TASK-146 cleanup/error precedence.
    - >
      `discover` must continue to return exactly OrchestrationResult.to_dict() on stdout.
      `decide` must not begin Human interaction unless live discovery and browser cleanup
      both succeed and the returned shortlist is non-empty. Empty shortlist, discovery
      failure, orchestration failure, or cleanup failure must cause zero approval and zero
      queue calls.
    - >
      For `decide`, after successful cleanup and before reading Human action, render exactly
      one current review preview to stderr using the existing OrchestrationResult.to_dict()
      representation without reordering, filtering, rescoring, summarizing, or adding
      recommendation/approval semantics. The preview is presentation only and must not be
      persisted. Existing four commands must retain empty stderr on success.
    - >
      After rendering the exact current preview, `decide` must read exactly two bounded
      Human input lines from stdin in this order: first a 1-based shortlist position, then
      an exact decision token `APPROVE` or `REJECT`. Fixed prompts may be written to stderr.
      EOF, malformed/non-decimal/out-of-range position, extra semantic tokens, or any
      decision other than exact APPROVE/REJECT must fail closed before create_approval_record
      and before any queue access. No default position or decision is permitted.
    - >
      A valid Human shortlist position may only select the exact RankedCandidate object
      already stored at that position in the current OrchestrationResult.shortlist tuple.
      TASK-147 must not copy, reconstruct, deserialize, re-rank, search by URL/candidate_id,
      or create a new RankedCandidate. The selected exact object must be forwarded unchanged
      to TASK-096 create_approval_record exactly once together with the explicit
      ApprovalDecision mapped from the exact Human token, the exact Human `actor` string,
      and the parsed `decided_at` datetime object.
    - >
      TASK-147 must not inspect final_score, confidence, decision band, candidate fields,
      platform, URL, or shortlist position to infer or modify the Human decision. The only
      decision authority is the exact Human APPROVE/REJECT token delegated to TASK-096.
      ApprovalError and all existing TASK-096 validation errors must propagate into the
      existing bounded sanitized CLI error surface without cause-chain/traceback leakage.
    - >
      For exact Human REJECT, return the exact ApprovalRecord projection described below
      and perform zero enqueue_approval calls and zero queue filesystem access through
      TASK-147. REJECT must not be converted into a successful queue no-op status and must
      not be persisted independently.
    - >
      For exact Human APPROVE, call existing TASK-096 enqueue_approval exactly once with
      the exact ApprovalRecord returned by create_approval_record and no queue-path
      overrides, thereby retaining TASK-096 tasks.txt/completed.txt defaults and all queue
      semantics. TASK-147 must not call build_ingestion_task/build_approved_ingestion_task,
      open queue files, construct task text, inspect duplicate queues, fsync, start
      AgentController, retry, or reinterpret ENQUEUED/ALREADY_QUEUED/ALREADY_COMPLETED.
    - >
      Successful `decide` stdout must be exactly one JSON document with exactly two
      top-level keys in this order: `approval` and `queue`. `approval` must contain exactly
      `decision`, `actor`, `decided_at`, and `ranked_candidate`; ranked_candidate must
      contain exactly the selected existing candidate.to_dict() result and score.to_dict()
      result without added/recomputed fields. For REJECT, `queue` must be null. For APPROVE,
      `queue` must contain exactly `task` and `outcome` projected unchanged from the exact
      TASK-096 EnqueueResult, with outcome rendered as its enum value. Do not add a new
      approval status, boolean authorization flag, recommendation label, or persistence
      claim.
    - >
      Existing bounded CLI error handling remains authoritative. Add ApprovalError to the
      known application-error boundary. Interactive input/selection representation failures
      may use a bounded ValueError path but must expose no traceback/cause chain and must
      occur before approval/queue mutation. Unexpected exceptions remain generic.
    - >
      Module import must remain side-effect-free: importing cli.py must not create a browser,
      capture time, read stdin, render prompts, call discovery/approval/enqueue, touch queue
      files, or mutate Product Intelligence state.
    - >
      Focused offline tests must prove exactly five commands and exact decide flags; duplicate
      single-value decide options fail code 2 while ordered repeated platform remains valid;
      discover behavior is unchanged; decide performs one shared discovery/cleanup before
      interaction; exact preview order is preserved; Human position selects the exact
      RankedCandidate object by identity; exact APPROVE/REJECT/actor/parsed datetime are
      forwarded once to TASK-096; no score/rank auto-authority exists; REJECT makes zero
      enqueue calls; APPROVE makes exactly one enqueue call with no path overrides; exact
      EnqueueOutcome pass-through; empty shortlist/EOF/invalid input/ApprovalError/queue
      error fail closed; no RankedCandidate reconstruction or persistent review state exists;
      and import remains side-effect-free.
    - >
      Add one compatibility regression using real TASK-096 approval/queue code with a
      synthetic in-memory OrchestrationResult and temporary working directory: explicit
      Human APPROVE through the CLI must append exactly one canonical task to default
      tasks.txt, a repeated approval of the same exact product must return
      ALREADY_QUEUED without duplication, and completed.txt must remain unmodified.
      The regression must use no live browser/network and must not start AgentController.
    - >
      Add one real REJECT compatibility regression proving an exact current shortlist
      member can be explicitly rejected through TASK-096, returns queue null, and creates
      or modifies neither tasks.txt nor completed.txt.
    - >
      Update docs/POST_M4_P5_HUMAN_FACING_SURFACE.md to mark published TASK-146 P5.2
      CLOSED, document `decide` as P5.3a candidate, explain that only the fresh shortlist
      displayed inside the same decide invocation is eligible for that decision, and state
      that prior discover JSON is advisory presentation only and cannot be rehydrated into
      approval authority.
    - >
      Update docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md to mark P5.2 CLOSED by published
      TASK-146 and refine the remaining P5.3 boundary into: P5.3a live-shortlist Human
      decision + TASK-096 M1 queue bridge (TASK-147 candidate), P5.3b family decision/durable
      admission presentation over TASK-139/140, and P5.3c sellable-variant review/decision/
      durable admission presentation over TASK-141. Overall P5 remains CURRENT / IN PROGRESS
      after TASK-147 and P6 must not advance.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      The existing Product Intelligence CLI remains the sole Human-facing CLI and exposes
      exactly evidence/catalog/ask/discover/decide, preserving all TASK-145/TASK-146
      signatures and behavior while adding no second UI, API, service, or executable.
  - id: AC2
    condition: >
      decide accepts only the exact bounded discovery inputs plus explicit actor and
      ISO-8601 decided_at representation, rejects duplicate single-value controls, and
      introduces no queue-path, score/policy, automatic decision, persistence, provider,
      ingestion-start, or alternate authority controls.
  - id: AC3
    condition: >
      decide reuses the TASK-146 live discovery composition exactly once, completes
      browser cleanup before Human action, renders the exact current OrchestrationResult
      preview, and never acts when discovery/cleanup fails or shortlist is empty.
  - id: AC4
    condition: >
      The Human supplies one exact current 1-based shortlist position and exact
      APPROVE/REJECT after seeing that preview; invalid/EOF input fails before approval
      or queue mutation, and no machine score/rank/decision band can imply a decision.
  - id: AC5
    condition: >
      The selected position forwards the exact existing RankedCandidate object by identity
      to TASK-096 create_approval_record exactly once with exact Human decision/actor and
      parsed decided_at, with no reconstruction, serialization, stale prior-discover state,
      or duplicate approval validation authority.
  - id: AC6
    condition: >
      REJECT performs zero enqueue/queue mutation; APPROVE delegates exactly once to existing
      enqueue_approval with no path override, preserving TASK-096 canonical queue task,
      idempotency, durability, completed-file, and no-ingestion-start semantics unchanged.
  - id: AC7
    condition: >
      Successful decide output is exactly the bounded approval/queue JSON projection of
      existing TASK-096 objects, while ApprovalError, interactive representation errors,
      queue errors, known application errors, and unexpected errors retain bounded sanitized
      handling with no traceback/cause leakage.
  - id: AC8
    condition: >
      TASK-147 creates no persistent shortlist/review/approval state, no RankedCandidate
      codec, no direct queue/filesystem implementation, no AgentController execution, no
      family/variant/catalog mutation, no provider/Drive/background work, and no P6 behavior.
  - id: AC9
    condition: >
      Focused offline tests plus real TASK-096 temporary-directory regressions prove exact
      object lineage, explicit Human control, APPROVE enqueue/idempotency, REJECT no-write,
      existing discover regressions, and M2/browser authority preservation without live
      marketplace/CDP access.
  - id: AC10
    condition: >
      Documentation records P5.2 CLOSED by published TASK-146, P5.3a as TASK-147 candidate,
      P5.3b/P5.3c still unimplemented, overall P5 CURRENT / IN PROGRESS, and P6 not current.

