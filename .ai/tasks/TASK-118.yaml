task_id: TASK-118
revision: 1

goal: >
  Add a bounded, deterministic, immutable canonical catalog integrity state over
  existing TASK-114 CanonicalProductFamily and TASK-117 CanonicalSellableVariant
  identities. The catalog must become the sole in-memory authority for canonical
  family/variant registration semantics: global opaque-ID uniqueness, idempotent
  repeat registration, family/variant lineage collision detection, observation
  exclusivity across canonical records, and family-before-variant integrity. The
  task must remain pure and side-effect-free and stop before serialization,
  filesystem/database durability, transactions, migrations, profile aggregation,
  retrieval, or RAG.

problem: >
  TASK-114 and TASK-117 intentionally create immutable canonical identities but do
  not know whether an ID or observation has already been admitted elsewhere. TASK-117
  explicitly defers variant-ID uniqueness, reuse, one-time admission, idempotent
  insertion, and cross-record integrity to the catalog milestone. Mixing those
  domain semantics immediately with SQLite/serialization would create a second
  storage authority and make collision behavior depend on persistence mechanics.
  M3 therefore needs a pure canonical catalog state that decides all registration
  integrity deterministically before any durable adapter is introduced.

assumptions:
  - Current canonical python_complete_agent main baseline is b982d960859670f2d50ff63a19f8d078a6c72594.
  - TASK-114 CanonicalProductFamily is the only canonical family identity input.
  - TASK-117 CanonicalSellableVariant is the only canonical sellable-variant identity input.
  - Canonical family and variant IDs are already validated opaque strings and must not be normalized or regenerated by the catalog.
  - Canonical records are immutable value objects whose equality can represent semantically identical reconstructed lineage even when Python object identity differs.
  - Incomplete sellable-variant coverage of a family is valid; the catalog must not require a complete family partition.
  - Durable serialization, SQLite/storage transactions, reopen/recovery, schema migration, profile aggregation, retrieval, and RAG remain later milestones.

scope:
  inspect:
    - .ai/tasks/TASK-114.yaml
    - .ai/tasks/TASK-116.yaml
    - .ai/tasks/TASK-117.yaml
    - src/product_intelligence/canonical_family.py
    - src/product_intelligence/canonical_variant.py
    - src/product_intelligence/sellable_variant_approval.py
    - src/product_intelligence/__init__.py
    - tests/product_intelligence/test_canonical_family.py
    - tests/product_intelligence/test_sellable_variant_approval.py
    - tests/product_intelligence/test_canonical_variant.py
    - docs/PHASE_6_M3_ENTITY_RESOLUTION.md
  modify:
    - src/product_intelligence/canonical_catalog.py
    - src/product_intelligence/__init__.py
    - tests/product_intelligence/test_canonical_catalog.py
    - docs/PHASE_6_M3_ENTITY_RESOLUTION.md

non_goals:
  - Modify TASK-114 family admission, TASK-115 evidence, TASK-116 proposal/decision, or TASK-117 variant admission semantics.
  - Generate, allocate, normalize, parse, hash, prefix, or rewrite family_id or variant_id.
  - Add update, upsert, replace, merge, delete, reassignment, membership-extension, or identity-evolution behavior.
  - Automatically register a missing source family when registering a variant.
  - Require all family members to belong to a canonical variant or declare a complete variant partition.
  - Re-run entity resolution, grouping, family approval/admission, variant evidence/proposal/decision/admission, or profile aggregation.
  - Add JSON/pickle codecs, SQLite, database drivers, filesystem persistence, locking, transactions, migrations, schema versioning, network, browser, Drive, queue, LLM, embeddings, retrieval, or RAG behavior.
  - Use Python object identity as catalog equivalence across independently reconstructed canonical records.

constraints:
  hard:
    - >
      Provide one immutable CanonicalCatalogState containing canonical families and
      variants, plus a public empty-catalog factory. Direct forged construction of a
      valid catalog state outside the canonical catalog boundary must fail closed.
    - >
      Catalog state must expose families and variants in deterministic canonical order
      by their exact opaque IDs, independent of valid registration order. Ordering must
      not normalize or change the IDs themselves.
    - >
      Provide separate public registration operations for one exact
      CanonicalProductFamily and one exact CanonicalSellableVariant. Wrong types or
      substitutes fail closed before state mutation/creation.
    - >
      Registration must be pure: INSERTED returns a new immutable catalog state;
      ALREADY_PRESENT must be a semantic no-op and return the unchanged input catalog
      state. Conflicts fail closed and leave the input state unchanged.
    - >
      A frozen CatalogRegistrationStatus must expose exactly INSERTED and
      ALREADY_PRESENT, and an immutable CatalogRegistrationResult must return the
      resulting catalog plus the explicit status. Conflict is an exception/fail-closed
      path, not a successful registration status.
    - >
      family_id is globally unique within the catalog. Re-registering a value-equal
      canonical family with the same family_id is ALREADY_PRESENT, including an
      independently reconstructed-but-equal family object. The same family_id bound to
      different members/approval lineage fails closed.
    - >
      The same canonical family admission lineage must not be registered under a
      different family_id. Family lineage equivalence must be based on immutable
      canonical values, not Python object identity.
    - >
      One SourceObservationIdentity value may belong to at most one registered
      CanonicalProductFamily. Registering a distinct family whose members overlap any
      existing family fails closed even when IDs differ.
    - >
      A CanonicalSellableVariant may be registered only when its source family is
      already present as a value-equal canonical family under the same exact family_id.
      Missing or conflicting source-family registration fails closed; variant
      registration must not auto-register the family.
    - >
      variant_id is globally unique within the catalog. Re-registering a value-equal
      canonical variant with the same variant_id is ALREADY_PRESENT, including an
      independently reconstructed-but-equal variant object. The same variant_id bound
      to different approval/member/family lineage fails closed.
    - >
      The same canonical variant approval lineage must not be registered under a
      different variant_id. Variant lineage equivalence must be based on immutable
      canonical values, not Python object identity.
    - >
      One SourceObservationIdentity value may belong to at most one registered
      CanonicalSellableVariant. Registering a distinct variant whose members overlap
      any existing variant fails closed, including a strict subset/superset overlap.
    - >
      Variant members must remain within the already-registered source family lineage;
      catalog registration must preserve TASK-117 family binding and must not rewrite,
      copy, infer, or reassign members/evidence.
    - >
      A registered family may have zero, one, or multiple registered variants and may
      retain unassigned family members. Absence of a complete variant partition is
      valid and must not be treated as a conflict.
    - >
      The catalog is append-only at this milestone. No public mutation path may update,
      replace, delete, merge, reassign, or silently extend an existing canonical family
      or variant. Such future identity-evolution policy is explicitly deferred.
    - >
      Registration must perform zero upstream factory calls, resolution/grouping,
      evidence projection, Human decision creation, canonical identity generation,
      profile aggregation, serialization, filesystem/database/network access, clock,
      random/UUID, environment reads, or other external effects.
    - Do not push from executor execution.

acceptance:
  - id: AC1
    condition: >
      An empty-catalog factory returns one immutable canonical CanonicalCatalogState;
      forged direct state construction fails closed, and families/variants are exposed
      in deterministic exact-ID order independent of registration order.
  - id: AC2
    condition: >
      Registering one exact new CanonicalProductFamily returns INSERTED with a new
      immutable catalog containing the exact canonical family value and no unrelated
      changes.
  - id: AC3
    condition: >
      Re-registering the same or independently reconstructed value-equal family under
      the same family_id returns ALREADY_PRESENT and the exact unchanged input catalog.
  - id: AC4
    condition: >
      Family registration fails closed for same-ID/different-lineage, same-lineage/
      different-ID, or any member overlap with a distinct registered family; the input
      catalog remains unchanged.
  - id: AC5
    condition: >
      Variant registration requires an already-registered value-equal source family
      under the same exact family_id and never auto-registers a missing family.
  - id: AC6
    condition: >
      Registering one exact new CanonicalSellableVariant whose source family exists
      returns INSERTED with a new immutable catalog and preserves its exact canonical
      identity/approval/family/member lineage without recomputation or rewriting.
  - id: AC7
    condition: >
      Re-registering the same or independently reconstructed value-equal variant under
      the same variant_id returns ALREADY_PRESENT and the exact unchanged input catalog.
  - id: AC8
    condition: >
      Variant registration fails closed for same-ID/different-lineage,
      same-lineage/different-ID, missing/conflicting source family, or member overlap
      with any distinct registered variant; the input catalog remains unchanged.
  - id: AC9
    condition: >
      A family with partially registered variants is valid: for example F={A,B,C,D},
      V1={A,B}, V2={C} may coexist while D remains unassigned, with no inferred
      complete partition or DIFFERENT_VARIANT assertion.
  - id: AC10
    condition: >
      The public catalog API exposes no update/upsert/delete/merge/reassignment,
      automatic family registration, profile, persistence, retrieval, or mutation
      authority beyond pure append-only registration results.
  - id: AC11
    condition: >
      Focused deterministic regressions cover family and variant insertion,
      ALREADY_PRESENT no-op identity, reconstructed value equality versus object
      identity, global ID conflicts, lineage-reuse conflicts, family/variant member
      overlap, family-before-variant enforcement, incomplete variant coverage,
      canonical ordering independent of insertion order, immutable anti-forgery state,
      and zero upstream/external work.
  - id: AC12
    condition: >
      M3 documentation records TASK-118 as the sole canonical catalog integrity
      authority and explicitly defers canonical serialization, durable storage/SQLite,
      transactions, reopen/recovery, migrations, identity evolution, profile
      aggregation, deterministic retrieval, and RAG to later milestones.

verification:
  required:
    - '$env:PYTHONPATH = ".;src"; python -m pytest tests/product_intelligence/test_canonical_family.py tests/product_intelligence/test_sellable_variant_approval.py tests/product_intelligence/test_canonical_variant.py tests/product_intelligence/test_canonical_catalog.py -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - 'git diff --check; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
