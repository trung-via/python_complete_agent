task_id: TASK-224
revision: 1

goal: >
  Execute P7.6 Market Test / Funnel Evidence in the existing Commerce Opportunity
  Intelligence domain. Establish one bounded immutable post-action evidence profile that
  binds to the published P7.3 DecisionContext and OpportunityHypothesis, preserves explicit
  test/action lineage, and organizes caller-supplied opaque evidence references for exposure,
  funnel, economic, and quality outcomes. The capability must remain evidence semantics only:
  it must not authorize or execute a market test, infer TEST_READY, score test success, claim
  causation, classify a winner, or perform P7.7 calibration/validation. On exact reviewed
  source publication, close P7.6 and advance exactly one roadmap step so P7.7 Calibration &
  Winner Validation becomes the unique NEXT commitment.

problem: >
  P7.2 requires authorized observed funnel, economic, and quality outcomes appropriate to
  the decision before any bounded winner-validation judgment can be made. P7.3 owns decision
  context and hypothesis semantics; P7.4 owns the pre-test TikTok Affiliate Evidence Profile;
  P7.5 owns advisory Value-of-Information planning. None owns a canonical semantic envelope
  for evidence produced after an authorized market intervention. Without a bounded P7.6
  owner, later outcome evidence risks losing the test design, authorization, action, exposure,
  time-window, provenance, and uncertainty context required by Product Contract v2 PC7, or
  being silently upgraded into success, attribution, winner truth, or autonomous learning.
  P7.6 must therefore preserve post-action evidence and intervention context without becoming
  the authority that designs, authorizes, executes, judges, or learns from the test.

assumptions:
  - Canonical python_complete_agent main at authoring is 3c67a828857f74466883463abf35a17ecdcc6775, the exact reviewed TASK-223 / P7.5 source candidate published from RUN-223-003 / REVIEW-223-003.
  - TASK-223 revision 1 is publication-effective and P7.6 Market Test / Funnel Evidence is the unique canonical NEXT commitment.
  - P7.7 Calibration & Winner Validation remains NOT_DONE and is not implemented by this task.
  - src/commerce_opportunity_intelligence/decision_context.py remains the sole P7.3 owner for DecisionContext, OpportunityHypothesis, decision deadline, objective, alternatives, constraints, and risk context.
  - src/commerce_opportunity_intelligence/tiktok_affiliate_evidence.py remains the sole P7.4 owner for the six pre-test TikTok affiliate evidence dimensions.
  - src/commerce_opportunity_intelligence/value_of_information.py remains the sole P7.5 owner for advisory VOI inquiry/plan semantics and is not a test authorization gate.
  - Product Intelligence and other evidence-producing domains retain ownership of their observations, provenance, identity, truth, retrieval, persistence, and source semantics; P7.6 stores only opaque references and bounded intervention metadata.
  - TEST_READY requires an authorized test design, success/failure criteria, constraints, and exposure controls, but P7.6 does not create, approve, or infer that authorization.
  - An authorization_ref is an opaque lineage reference supplied by the caller; its presence does not mean P7.6 granted or independently verified authorization.
  - A test_design_ref is an opaque lineage reference; P7.6 does not own test criteria or methodology.
  - An action_ref is an opaque lineage reference to the intervention/action that occurred; P7.6 does not execute that action.
  - An observed post-action outcome is evidence, not causal attribution, retroactive proof, winner validation, or scalability evidence by itself.
  - P7.5 CONTINUE/DEFER/STOP remains advisory only and is not a mandatory dependency or workflow gate for P7.6 evidence creation.
  - Current downstream AIOS pin and full downstream conformance remain edd7d8d92d54900c56442bbfcddb8648ec4d2e09 / TASK-207 revision 8.
  - Human has approved continuation from the P7.6 architecture audit; preserve Antigravity as the current Executor choice and do not silently switch.

