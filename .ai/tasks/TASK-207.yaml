task_id: TASK-207
revision: 8

goal: >
  Re-certify Python Agent full downstream AIOS control-plane conformance under the exact
  reviewed/source-published AIOS-renew pin
  edd7d8d92d54900c56442bbfcddb8648ec4d2e09 after TASK-221 published that migration.
  Preserve TASK-207 as the sole downstream-conformance semantic authority, preserve
  revision-5 certification for 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2 as historical
  prior-pin evidence, preserve revision-7 / RUN-207-009 as failed non-certifying old-pin
  history for 1a68db9acb6989dfa81bf875503db62e54a4bed6, freshly prove the active
  Phase-1/Phase-2 bindings where the new pin is material, and make revision-8
  certification effective only after independent semantic PASS and safe publication of
  exactly the reviewed source candidate. After effective certification, resume P7.3 by
  reviewing and, if eligible, publishing the preserved TASK-215 revision-1 RUN-215-004
  candidate 142bd865f69a6636b321d3cc7a0cd4004db3fdc7 against FINDING-215-001;
  do not rerun TASK-215 and do not advance P7.4.

problem: >
  TASK-221 / RUN-221-002 / REVIEW-221-001 are now publication-effective on canonical
  Python Agent main df1d71974979bed37bd20d67d9f0700fdb1e75b0 and migrated the sole
  active AIOS-renew runtime authority from exact
  1a68db9acb6989dfa81bf875503db62e54a4bed6 to exact reviewed/source-published
  edd7d8d92d54900c56442bbfcddb8648ec4d2e09. Adoption and roadmap state therefore mark
  full downstream conformance for edd7d8d... as PENDING_FRESH_CERTIFICATION through
  TASK-207 revision 8.

  The prior revision-7 attempt cannot be continued after the pin change. Its lineage
  progressed through RUN-207-007, RUN-207-008 and RUN-207-009 under exact 1a68db9.
  RUN-207-009 failed during Runtime verification because the old pinned historical
  subject used linked-worktree .git-file semantics. That generic Runtime defect was
  fixed upstream by TASK-148 revision 2 and is now available only through the newly
  published exact edd7d8d pin. Revision 7 therefore remains immutable failed old-pin
  evidence and grants no certification authority for the new pin.

  Current .ai/aios-conformance-state.yaml still certifies TASK-207 revision 5 only for
  49ad4d7. Fresh current-pin certification is therefore unresolved. The correct
  continuation is revision 8 of the existing TASK-207 semantic authority, not REPAIR
  of RUN-207-009 and not a new conformance task.

assumptions:
  - Canonical Python Agent main at authoring is df1d71974979bed37bd20d67d9f0700fdb1e75b0.
  - TASK-221 / RUN-221-002 / REVIEW-221-001 are completed and exactly source-published on that main.
  - The sole active AIOS-renew dependency and worker provenance authority are exactly edd7d8d92d54900c56442bbfcddb8648ec4d2e09 under EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
  - Upstream TASK-148 revision 2 / RUN-148-003 / REVIEW-148-003 are reviewed/source-published provenance for the historical-subject .git-directory and local object-graph transfer fix.
  - TASK-207 revision 5 remains publication-effective historical certification only for 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2.
  - TASK-207 revision 7 and RUN-207-007 through RUN-207-009 remain immutable failed/non-certifying history for exact pin 1a68db9acb6989dfa81bf875503db62e54a4bed6 and must not be repaired after the pin change.
  - Existing Phase-1/Phase-2 repository binding implementation files remain unchanged by TASK-221.
  - P7.3 remains the unique product NEXT and TASK-215 revision 1 remains product_done=false.
  - TASK-215 current successful correction candidate remains RUN-215-004 at 142bd865f69a6636b321d3cc7a0cd4004db3fdc7, preserving FINDING-215-001 through predecessor RUN-215-003 / REPAIR-215-002 continuity.
  - No review-decision ref exists for RUN-215-004.
  - Existing TASK-207 canonical RUN history extends through RUN-207-009; the fresh revision-8 PRIMARY is expected to become RUN-207-010.
  - Mutable future upstream AIOS-renew main is not downstream authority; only the checked-in exact pin is relevant.
  - Human has selected Codex for the current self-hosted execution sequence; do not silently switch Executor.

