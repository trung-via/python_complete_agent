  - Modify the AIOS-renew pin, worker provenance, Phase-1/Phase-2 workflows, policies, bootstraps, Runtime, Reviewer, Publisher, A3/A6, REPAIR, or terminal-attention implementation.
  - Modify, rerun, repair, review, integrate, or publish TASK-215 / RUN-215-002 inside this task.
  - Modify src/product_intelligence, src/commerce_opportunity_intelligence, marketplace/browser/provider behavior, scoring/ranking, evidence, product truth, retrieval, persistence, or other product semantics.
  - Rewrite TASK-207 revision-3 history or claim its old-pin live evidence is positive certification for c96eb8b5 where the pin is material.
  - Manufacture CHANGES_REQUIRED, deliberately fail a RUN, or create coding mutation merely to exercise correction transports.
