task_id: TASK-207
revision: 12

goal: >
  Freshly certify Python Agent's complete downstream AIOS control-plane and portability
  profile surface under the exact reviewed/source-published AIOS-renew pin
  44eee353eda376c9db8cd88d97184d3122651bf5 after TASK-259 revision 2 publication.
  Preserve TASK-207 as the sole downstream-conformance semantic authority, preserve
  revision-8 certification for edd7d8d92d54900c56442bbfcddb8648ec4d2e09 and revision-5
  certification for 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2 as historical old-pin
  evidence, preserve revision-7 / RUN-207-009 as failed non-certifying old-pin history,
  freshly certify the active Phase-1/Phase-2 carrier bindings, the TASK-256 P1B
  Brain/Reviewer semantic registries, and the current execution-profile policy, and make
  revision-12 certification effective only after independent semantic PASS and safe
  publication of exactly the reviewed source candidate. After effective certification,
  close the BP9 downstream-adoption side track and return the preserved product
  continuation to already-authored TASK-254 revision 4 without executing product work
  inside this task.

problem: >
  TASK-259 revision 2 completed through failed predecessor RUN-259-001, successor
  PRIMARY RUN-259-002 RESULT, REVIEW-259-001 PRIMARY PASS, and exact publication of
  candidate 6c9cfcd258c492a5f2301936324379c5e862a2ce. Canonical main now uses exact
  AIOS-renew pin 44eee353eda376c9db8cd88d97184d3122651bf5. The existing
  .ai/aios-conformance-state.yaml still certifies TASK-207 revision 8 only for historical
  pin edd7d8d92d54900c56442bbfcddb8648ec4d2e09, while adoption state correctly marks
  fresh downstream certification REQUIRED_PENDING.

  Revision 8 predates BP9-P1B. TASK-256 later added five exact repository-owned semantic
  registries for Brain/Reviewer portability, and TASK-259 preserved those registry blobs
  and .ai/executor-profiles.yaml byte-for-byte while moving the active pin. Revision 12
  therefore must certify not only the existing Phase-1/Phase-2 carrier families but also
  the exact P1B registry identities and current execution-profile policy under the new
  active pin. It must not reuse revision-8 certification as current-pin truth and must not
  resume TASK-254 before exact revision-12 reviewed-source publication.

assumptions:
  - Canonical Python Agent main at authoring is exactly e6a9066eb78f81d70c026b1093969fc6c4ef565f.
  - >
    TASK-259 revision 2 / RUN-259-002 / REVIEW-259-001 remain publication-effective engineering history. TASK-207 revisions 9 and 10 were authored but never executed. Revision 11 executed as RUN-207-011 under Codex gpt-6-sol/high and terminalized immutable FAILURE at COMPLETION_GATE with failed candidate f1580073867f095704bc1c34f2858c160e0cf4d3 because tests/aios_bridge/test_aios_brain_reviewer_portability_bindings.py still asserted REQUIRED_PENDING state while the task required publication-gated current certification but omitted that test from scope.modify. Revision 12 is the bounded contract correction; do not REPAIR RUN-207-011.
  - The sole active AIOS-renew dependency and worker provenance authority are exactly 44eee353eda376c9db8cd88d97184d3122651bf5 under EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
  - TASK-207 revision 8 / RUN-207-010 / REVIEW-207-004 remains publication-effective historical certification only for edd7d8d92d54900c56442bbfcddb8648ec4d2e09.
  - TASK-207 revision 5 remains historical certification only for 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2.
  - TASK-207 revision 7 and RUN-207-007 through RUN-207-009 remain immutable failed/non-certifying old-pin history for 1a68db9acb6989dfa81bf875503db62e54a4bed6 and must not be repaired after later pin migrations.
  - >
    TASK-256 publication established ACTIVE P1B semantic registry bindings with exact blobs:
    brain-audit=e931c1c7fa4b1b9dfbf7e7c649d5a19e0035d6ba;
    brain-return=9d220ece8dd20028e590efd083b1a04b00ffadfe;
    flow-cards=574edd0407de7f4cca14b8b854a5d00d271be014;
    reviewer-procedure=ad510261ff220f9b9165dd7cdc8646fd6915b0a7;
    reviewer-return=c805c49fcbe170677ff3bb9dde3fb4c9d308c474.
  - >
    .ai/executor-profiles.yaml blob is 6f0507f2bd15597fba4a2340f1508061bc7bee06;
    Codex defaults to gpt-6-sol/high with supported efforts [none, low, medium, high, xhigh, max],
    and Antigravity defaults to gemini-3.8-flash/medium with [low, medium, high].
  - Existing Phase-1/Phase-2 workflows, carrier policies, and bootstrap scripts were not changed by TASK-259.
  - TASK-254 revision 4 remains authored/unexecuted and is the unique product continuation after exact TASK-207 revision-12 publication.
  - Mutable future AIOS-renew main is not downstream authority; only the checked-in exact pin is relevant.
  - >
    Existing TASK-207 canonical RUN history extends through immutable RUN-207-011 FAILURE; if no competing
    reservation appears, the fresh revision-12 PRIMARY is expected to become RUN-207-012,
    but Runtime owns canonical RUN allocation.

