non_goals:
  - Create a new conformance task or second downstream-conformance authority.
  - Modify the AIOS-renew pin, worker provenance, workflow/carrier implementation, policies, bootstraps, Runtime, Reviewer, Publisher, A3/A6, correction actions, REPAIR semantics, or terminal-attention implementation.
  - Modify, rerun, repair, review, integrate, publish, or otherwise advance TASK-215 or any RUN-215 lineage.
  - Modify src/product_intelligence, src/commerce_opportunity_intelligence, marketplace/browser/provider behavior, scoring/ranking, evidence, product truth, retrieval, persistence, or any product semantic.
  - Rewrite TASK-207 revision-4 history or claim its c96 live evidence is current certification for 49ad4d7 where the pin is material.
  - Manufacture CHANGES_REQUIRED, deliberately fail a real implementation RUN, or introduce code mutation solely to exercise correction transport.
  - Reimplement upstream TASK-145 behavior downstream, delete local Runtime state, create a generic router/retry/reroute loop, scheduler, queue, broker, Planner, memory database, generic conversation store, duplicate lifecycle state machine, or floating AIOS reference.
  - Push, merge, publish, or mutate canonical main from Executor implementation execution.

constraints:
  hard:
    - >
      TASK-207 revision 5 remains the sole downstream-conformance semantic authority and
      supersedes only the current-certification role of revision 4. Revision-4 evidence
      remains immutable historical prior-pin evidence for c96eb8b52acd865b9453409e6598e08a8bd4e48e.
    - >
      This revision must itself be authored through the live [AIOS BRAIN INGRESS] carrier
      against canonical predecessor main ada9a4e5b765a7daa4e081db1d56917410a73873 while
      exact pin 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2 is already active on main.
    - >
      PRIMARY execution must use one fresh [AIOS BRAIN WAKEUP] request with executor
      antigravity and stable dispatch_id task207-r5-antigravity-001 through the dedicated
      [self-hosted, windows, x64, python-complete-agent] path. It must resolve exact pin
      49ad4d7 from current main and produce exactly one new canonical TASK-207 revision-5
      RUN with deterministic verification evidence and duplicate-dispatch protection.
    - >
      Terminalization must create or idempotently reuse the strict [AIOS TERMINAL ATTENTION]
      carrier tied to the canonical revision-5 terminal truth. Attention remains notification
      only and gains no lifecycle authority.
    - >
      Fresh REMEDIATION conformance must be live-proven under exact 49ad4d7 through the
      repository-owned GitHub carrier and self-hosted Phase-2 bootstrap using stable
      correction_dispatch_id task-207-r5-remediation-non-authorizing-001 and a deliberately
      non-authorizing selector shape that must fail closed without creating an implementation
      RUN. This is a transport/admission probe, not fabricated semantic remediation.
    - >
      Fresh REPAIR conformance must be live-proven under exact 49ad4d7 through the
      repository-owned GitHub carrier and self-hosted Phase-2 bootstrap using stable
      repair_dispatch_id task-207-r5-repair-non-authorizing-001 and a deliberately
      non-authorizing NO_CHANGE-shaped selector with no coding Executor. It must fail closed
      without creating an implementation RUN unless a real TASK-207 failure independently
      requires canonical REPAIR.
    - >
      The existing bounded post-AUTHOR_REPAIR dispatch and exact-title REPAIR carrier hardening
      introduced before TASK-218 remain ACTIVE repository bindings but need not be triggered by
      manufacturing a failed RUN. Deterministic source tests plus the live REPAIR carrier probe
      are sufficient unless real correction state naturally invokes AUTHOR_REPAIR.
    - >
      Review-to-publication authority remains the existing Brain ingress plus safe Publisher.
      Revision-5 certification becomes effective only after its own PRIMARY semantic PASS is
      canonicalized and the safe Publisher publishes exactly the reviewed revision-5 source
      candidate so canonical main equals it.
    - >
      .ai/aios-conformance-state.yaml must move current certification to TASK-207 revision 5 /
      exact 49ad4d7 while preserving revision 4 / c96 as explicit historical prior-pin
      certification evidence and retaining older historical exclusions without rewriting them.
      It remains a certification record, not Runtime truth or raw evidence store.
    - >
      .ai/aios-adoption-state.yaml must mark exact 49ad4d7 full downstream conformance as
      publication-gated current certification through TASK-207 revision 5 only after the
      reviewed candidate is published, preserve exact pin and all package/binding classifications,
      and preserve prior-pin certification history.
    - >
      .ai/roadmap-state.yaml must resolve FRESH_AIOS_DOWNSTREAM_CONFORMANCE_CERTIFICATION
      through TASK-207 revision 5 while preserving P7.3 as the unique product NEXT and exact
      resume target TASK-215 revision 1 / RUN-215-003 / REPAIR-215-002 with failed_head_sha
      75cbd814bf5e687c71015dfdce4e5d8a715009c5 and repair authorization
      69b04072dce87c7815afdfea863cb60fde119cbf. It must not mark P7.3 DONE or advance P7.4.
    - >
      The production blocker motivating TASK-218 must be represented in certification scope:
      the exact pinned kernel must expose the upstream TASK-145 revision-2 local/canonical REPAIR
      reconciliation capability through package adoption, while Python Agent owns no duplicate
      implementation of that semantics.
    - >
      No source mutation outside the six authorized modify files is permitted. A live defect in
      workflows, policy, bootstrap, pin, Runtime, repair reconciliation, or transport blocks
      certification and requires separate authorized work rather than widening this task.
    - >
      Deterministic verification must be offline, non-interactive and provider/network independent,
      using a dedicated gitdir pytest basetemp. Live carrier evidence is separately observed from
      canonical GitHub workflow/receipt state and must not be faked inside offline tests.
    - >
      Semantic Reviewer must independently inspect typed live evidence and must not PASS solely
      because source tests pass. Missing or contradictory material current-pin live evidence is
      BLOCKED or CHANGES_REQUIRED as appropriate.

acceptance:
  - id: AC1
    condition: >
      TASK-207 revision 5 is canonically authored through live Brain ingress from predecessor
      ada9a4e5b765a7daa4e081db1d56917410a73873 while exact 49ad4d7 is active.
  - id: AC2
    condition: >
      One fresh Antigravity PRIMARY wakeup under exact 49ad4d7 produces exactly one canonical
      TASK-207 revision-5 RUN with deterministic verification lineage and duplicate-dispatch protection.
  - id: AC3
    condition: >
      Revision-5 terminalization produces or idempotently reuses the correct terminal-attention
      notification from canonical terminal truth without granting it lifecycle authority.
  - id: AC4
    condition: >
      REMEDIATION carrier/bootstrap are freshly reachable and fail closed on the non-authorizing
      revision-5 probe under 49ad4d7 without creating a coding RUN solely for the probe.
  - id: AC5
    condition: >
      REPAIR carrier/bootstrap are freshly reachable and fail closed on the non-authorizing
      NO_CHANGE-shaped revision-5 probe under 49ad4d7 with no coding Executor and no coding RUN
      solely for the probe.
  - id: AC6
    condition: >
      Exact-pin isolation, upstream TASK-145 revision-2 reconciliation capability, one-capability-
      one-authority, all existing Phase-1/Phase-2 binding families, and Human/Brain/Runtime/
      Executor/Reviewer/Publisher/A3/A6/REPAIR/Attention boundaries remain intact without duplicate
      lifecycle implementation.
  - id: AC7
    condition: >
      Conformance/adoption records bind current certification to TASK-207 revision 5 and exact
      49ad4d7 only on reviewed source publication, while preserving TASK-207 revision 4 / c96
      as historical prior-pin evidence.
  - id: AC8
    condition: >
      Roadmap resolves the fresh-conformance prerequisite but preserves P7.3 as NEXT and exact
      TASK-215 / RUN-215-003 / REPAIR-215-002 resume lineage; it does not advance P7.4.
  - id: AC9
    condition: >
      Source mutations stay inside the six authorized files; focused deterministic tests and
      git diff --check pass with zero unresolved source items; Reviewer observes sufficient typed
      live current-pin evidence before PASS.

