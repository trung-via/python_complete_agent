non_goals:
  - Create a new conformance task or second downstream-conformance authority.
  - Modify the AIOS-renew pin, worker provenance, executor profiles, the five P1B registry blobs, workflow/carrier implementation, carrier policies, bootstrap scripts, Runtime, Reviewer, Publisher, correction/repair semantics, terminal-attention implementation, or frozen Kernel semantics.
  - REPAIR, retry, recover, review, publish, or otherwise revive RUN-207-009 or reinterpret revision-8 certification as current-pin truth.
  - Modify TASK-254 or execute/resume any product implementation inside this conformance task.
  - Modify product source, marketplace/browser/provider behavior, scoring/ranking, evidence, product truth, retrieval, persistence, or any product semantic.
  - Add provider routing, retry/fallback/failover, a second lifecycle authority, Planner, Reviewer, Publisher, scheduler, queue, broker, persistent model/chat memory, or mutable upstream reference.
  - Push, merge, publish, or mutate canonical main from Executor implementation execution.

constraints:
  hard:
    - >
      TASK-207 revision 12 remains the sole downstream-conformance semantic authority for
      the current pin. Prior TASK-207 certifications and failures remain immutable,
      explicitly historical, and non-authorizing for 44eee353.
    - >
      This revision must itself be authored through the live [AIOS BRAIN INGRESS] carrier
      against canonical predecessor main e6a9066eb78f81d70c026b1093969fc6c4ef565f.
    - >
      PRIMARY execution must use one fresh [AIOS BRAIN WAKEUP] request with executor codex,
      model gpt-6-sol, reasoning_effort high and stable dispatch_id
      task207-r12-codex-high-001 through the dedicated self-hosted Python Agent runner.
      This explicit Human override is bounded to this execution only. The exact
      .ai/executor-profiles.yaml policy must remain byte-identical and independently prove
      that high is a supported Codex effort and remains the repository default. It must
      create exactly one fresh canonical TASK-207 revision-12 RUN from current canonical
      main; RUN-207-011 and failed candidate f1580073867f095704bc1c34f2858c160e0cf4d3
      remain immutable history and are not REPAIR/source authority.
    - >
      The selected Executor performs only bounded seven-file implementation work. Runtime
      owns canonical verification; Executor must not review, publish, run another AIOS
      lifecycle operation, or widen scope.
    - >
      Terminalization must create or idempotently reuse the strict [AIOS TERMINAL ATTENTION]
      carrier tied to the revision-12 canonical terminal truth. Attention remains notification only.
    - >
      Fresh REMEDIATION compatibility must be live-proven under exact pin 44eee353 through
      the repository-owned GitHub carrier and self-hosted Phase-2 bootstrap using stable
      correction_dispatch_id task-207-r12-remediation-non-authorizing-001 and a deliberately
      non-authorizing selector that fails closed without creating an implementation RUN.
    - >
      Fresh REPAIR compatibility must be live-proven under exact pin 44eee353 through the
      repository-owned GitHub carrier and self-hosted Phase-2 bootstrap using stable
      repair_dispatch_id task-207-r12-repair-non-authorizing-001 and a deliberately
      non-authorizing NO_CHANGE-shaped selector with no coding Executor, failing closed
      without creating an implementation RUN unless a real revision-11 failure independently
      requires canonical correction.
    - >
      .ai/aios-conformance-state.yaml must make TASK-207 revision 12 / exact 44eee353 the
      publication-gated current certification and preserve revision 8 / edd7d8d and
      revision 5 / 49ad4d7 as historical certification plus revision 7 / RUN-207-009 as
      failed old-pin non-certifying evidence.
    - >
      The conformance record must certify the current repository binding surface, not just
      the r8 subset: Phase-1, Phase-2, exact TASK-256 P1B semantic registries, and exact
      execution-profile policy. Record the five P1B paths/blob identities and exact
      executor-profile blob 6f0507f2bd15597fba4a2340f1508061bc7bee06 without copying
      package-owned semantics or turning registry/profile material into lifecycle authority.
    - >
      P1B registry semantics remain exactly bounded by TASK-256: Brain and Reviewer
      registries are cognitive/procedure material only, store no chat memory, select no
      provider/model default, and grant no Runtime/Executor/Reviewer/Publisher mutation
      authority. Their exact committed blobs must remain unchanged.
    - >
      Execution-profile policy remains byte-identical. Certification may record current
      defaults/capabilities, but may not change Codex gpt-6-sol/high, its effort set,
      Antigravity gemini-3.8-flash/medium, its effort set, or explicit Human override precedence.
    - >
      .ai/aios-adoption-state.yaml must move full_downstream_conformance from
      REQUIRED_PENDING to publication-gated TASK-207 revision-12 certification for exact
      44eee353 only after publication while preserving TASK-259/TASK-256 provenance and
      exact registry identities.
    - >
      .ai/roadmap-state.yaml must close the BP9 downstream-adoption side track only on
      exact TASK-207 revision-11 reviewed-source publication and make already-authored
      TASK-254 revision 4 the preserved unique product continuation. Do not execute
      TASK-254, grant live validation authority, or invent a successor beyond TASK-254.
    - >
      Documentation may update only current-pin certification, exact portability-profile
      coverage, historical certification labels, and the publication-gated handoff back to
      TASK-254. Any surviving statement that P7.3/TASK-215 is the current NEXT must be
      historicalized or removed from current-state wording so it cannot conflict with the
      canonical TASK-254 revision-4 handoff. Preserve the immutable historical TASK-215
      lineage where context requires it. It must preserve "delegate exclusively",
      single-kernel authority, and lifecycle-role separation.
    - >
      The sole scope correction from revision 11 is authorization to modify
      tests/aios_bridge/test_aios_brain_reviewer_portability_bindings.py so its adoption
      assertions can move from REQUIRED_PENDING to the same publication-gated revision-12
      current-certification semantics required by adoption state. Preserve all exact TASK-256
      registry blob assertions and portability authority boundaries; do not weaken the test.
    - >
      No source mutation outside the seven authorized modify files is permitted. A live
      defect in workflow, policy, bootstrap, pin, Runtime, P1B registry, profile policy,
      review transport, remediation transport, or repair transport blocks certification
      and requires separate authorized work rather than widening this task.
    - >
      Deterministic verification must be offline, non-interactive and provider/network
      independent. Live carrier evidence is separately observed from canonical GitHub
      workflow/receipt state and must not be faked inside offline tests.
    - >
      Semantic Reviewer must independently inspect typed live current-pin evidence and the
      exact registry/profile identities and must not PASS solely because source tests pass.

acceptance:
  - id: AC1
    condition: >
      TASK-207 revision 12 is canonically authored through live Brain ingress from exact
      predecessor e6a9066eb78f81d70c026b1093969fc6c4ef565f, with RUN-207-011 immutable
      COMPLETION_GATE failure and all earlier TASK-207 certification/failure lineage preserved.
  - id: AC2
    condition: >
      One fresh Codex PRIMARY Brain Wakeup under exact active pin 44eee353 uses explicit Human
      override gpt-6-sol/high and produces exactly one canonical TASK-207 revision-12 RUN
      with deterministic Runtime verification and duplicate-dispatch protection. The exact
      executor-profile policy remains unchanged, high remains the repository default, and
      the explicit override does not alter policy.
  - id: AC3
    condition: >
      Revision-12 terminalization produces or idempotently reuses the correct
      terminal-attention notification from canonical terminal truth without granting it lifecycle authority.
  - id: AC4
    condition: >
      REMEDIATION carrier/bootstrap are freshly reachable under 44eee353 and fail closed
      on the non-authorizing revision-12 probe without creating a coding RUN solely for the probe.
  - id: AC5
    condition: >
      REPAIR carrier/bootstrap are freshly reachable under 44eee353 and fail closed on the
      non-authorizing NO_CHANGE-shaped revision-12 probe with no coding Executor and no
      coding RUN solely for the probe.
  - id: AC6
    condition: >
      Current certification covers Phase-1, Phase-2, the five exact ACTIVE TASK-256 P1B
      registry blobs, and exact executor-profile blob 6f0507f2bd15597fba4a2340f1508061bc7bee06
      while preserving one-capability-one-authority and all Human/Brain/Runtime/Executor/
      Reviewer/Publisher/A3/A6/REPAIR/Attention boundaries.
  - id: AC7
    condition: >
      Conformance/adoption records bind current certification to TASK-207 revision 12 and
      exact 44eee353 only on reviewed source publication, preserving revision-8 and
      revision-5 certifications as historical old-pin evidence and revision-7 failure as
      non-certifying history.
  - id: AC8
    condition: >
      On exact revision-12 publication the BP9 downstream-adoption side track is closed and
      the unique preserved continuation becomes already-authored TASK-254 revision 4,
      without executing it or changing product/live-validation authority.
  - id: AC9
    condition: >
      Source mutations stay inside the seven authorized files; the P1B portability test is
      updated only to replace stale REQUIRED_PENDING assertions with publication-gated
      revision-12 current-certification assertions while preserving exact registry identity
      checks; focused deterministic tests and git diff --check pass with zero unresolved
      source items; Reviewer observes sufficient typed live current-pin evidence before PASS.

