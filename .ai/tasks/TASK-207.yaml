non_goals:
  - Create a new conformance task or second downstream-conformance authority.
  - Modify the AIOS-renew pin, worker provenance, workflow/carrier implementation, policies, bootstraps, Runtime, Reviewer, Publisher, A3/A6, correction actions, REPAIR semantics, or terminal-attention implementation.
  - Modify, rerun, repair, review, integrate, publish, or otherwise advance TASK-215 or RUN-215-004 inside this conformance task.
  - Modify src/product_intelligence, src/commerce_opportunity_intelligence, marketplace/browser/provider behavior, scoring/ranking, evidence, product truth, retrieval, persistence, or any product semantic.
  - Rewrite TASK-207 revision-5 history or claim its 49ad4d7 live evidence is current certification for 1a68db9 where the pin is material.
  - Manufacture CHANGES_REQUIRED, deliberately fail a real implementation RUN, or introduce code mutation solely to exercise correction transport.
  - Manufacture a TASK-215 DELTA review solely as conformance evidence; the preserved RUN-215-004 review remains a separate Brain action after revision-6 certification is effective.
  - Reimplement upstream TASK-144 behavior downstream, delete local Runtime state, create a generic router/retry/reroute loop, scheduler, queue, broker, Planner, memory database, generic conversation store, duplicate lifecycle state machine, or floating AIOS reference.
  - Push, merge, publish, or mutate canonical main from Executor implementation execution.

constraints:
  hard:
    - >
      TASK-207 revision 6 remains the sole downstream-conformance semantic authority and
      supersedes only the current-certification role of revision 5. Revision-5 evidence
      remains immutable historical prior-pin evidence for 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2.
    - >
      This revision must itself be authored through the live [AIOS BRAIN INGRESS] carrier
      against canonical predecessor main f7ee8a6d0c0fb7290ebfb2190703caf78baae5b8 while
      exact pin 1a68db9acb6989dfa81bf875503db62e54a4bed6 is already active on main.
    - >
      PRIMARY execution must use one fresh [AIOS BRAIN WAKEUP] request with executor
      antigravity and stable dispatch_id task207-r6-antigravity-001 through the dedicated
      [self-hosted, windows, x64, python-complete-agent] path. It must resolve exact pin
      1a68db9 from current main and produce exactly one new canonical TASK-207 revision-6
      RUN, expected to be RUN-207-006 given current canonical history, with deterministic
      verification evidence and duplicate-dispatch protection.
    - >
      Terminalization must create or idempotently reuse the strict [AIOS TERMINAL ATTENTION]
      carrier tied to the canonical revision-6 terminal truth. Attention remains notification
      only and gains no lifecycle authority.
    - >
      Fresh REMEDIATION conformance must be live-proven under exact 1a68db9 through the
      repository-owned GitHub carrier and self-hosted Phase-2 bootstrap using stable
      correction_dispatch_id task-207-r6-remediation-non-authorizing-001 and a deliberately
      non-authorizing selector shape that must fail closed without creating an implementation
      RUN. This is a transport/admission probe, not fabricated semantic remediation.
    - >
      Fresh REPAIR conformance must be live-proven under exact 1a68db9 through the
      repository-owned GitHub carrier and self-hosted Phase-2 bootstrap using stable
      repair_dispatch_id task-207-r6-repair-non-authorizing-001 and a deliberately
      non-authorizing NO_CHANGE-shaped selector with no coding Executor. It must fail closed
      without creating an implementation RUN unless a real TASK-207 failure independently
      requires canonical REPAIR.
    - >
      Review-to-publication authority remains the existing Brain ingress plus safe Publisher.
      Revision-6 certification becomes effective only after its own PRIMARY semantic PASS is
      canonicalized and the safe Publisher publishes exactly the reviewed revision-6 source
      candidate so canonical main equals it.
    - >
      The newly adopted TASK-144 revision-2 successful-REPAIR review reconstruction and
      publication semantics are certified as exact-pin package capability by immutable
      reviewed/source-published upstream provenance plus deterministic current-pin regression
      coverage. This task must not create a synthetic DELTA finding or consume RUN-215-004
      merely to exercise that branch. The real RUN-215-004 DELTA review remains the next
      separate semantic action after certification.
    - >
      .ai/aios-conformance-state.yaml must move current certification to TASK-207 revision 6 /
      exact 1a68db9 while preserving revision 5 / 49ad4d7 as explicit historical prior-pin
      certification evidence and retaining older historical exclusions without rewriting them.
      It remains a certification record, not Runtime truth or raw evidence store.
    - >
      .ai/aios-adoption-state.yaml must mark exact 1a68db9 full downstream conformance as
      publication-gated current certification through TASK-207 revision 6 only after the
      reviewed candidate is published, preserve exact pin and all package/binding classifications,
      preserve TASK-144 revision-2 provenance, and preserve prior-pin certification history.
    - >
      .ai/roadmap-state.yaml must resolve FRESH_AIOS_DOWNSTREAM_CONFORMANCE_CERTIFICATION
      through TASK-207 revision 6 while preserving P7.3 as the unique product NEXT and exact
      resume target TASK-215 revision 1 / RUN-215-004 / candidate
      142bd865f69a6636b321d3cc7a0cd4004db3fdc7 / FINDING-215-001 with predecessor
      RUN-215-003 / REPAIR-215-002 continuity. It must not mark P7.3 DONE or advance P7.4.
    - >
      The production blocker motivating TASK-219 must be represented in certification scope:
      the exact pinned kernel must expose upstream TASK-144 revision-2 successful-REPAIR
      review-lineage reconstruction and publication validation through package adoption, while
      Python Agent owns no duplicate implementation of those semantics.
    - >
      No source mutation outside the six authorized modify files is permitted. A live defect in
      workflows, policy, bootstrap, pin, Runtime, repair/review reconstruction, or transport blocks
      certification and requires separate authorized work rather than widening this task.
    - >
      Deterministic verification must be offline, non-interactive and provider/network independent,
      using a dedicated gitdir pytest basetemp. Live carrier evidence is separately observed from
      canonical GitHub workflow/receipt state and must not be faked inside offline tests.
    - >
      Semantic Reviewer must independently inspect typed live evidence and must not PASS solely
      because source tests pass. Missing or contradictory material current-pin live evidence is
      BLOCKED or CHANGES_REQUIRED as appropriate.

acceptance:
  - id: AC1
    condition: >
      TASK-207 revision 6 is canonically authored through live Brain ingress from predecessor
      f7ee8a6d0c0fb7290ebfb2190703caf78baae5b8 while exact 1a68db9 is active.
  - id: AC2
    condition: >
      One fresh Antigravity PRIMARY wakeup under exact 1a68db9 produces exactly one canonical
      TASK-207 revision-6 RUN with deterministic verification lineage and duplicate-dispatch protection.
  - id: AC3
    condition: >
      Revision-6 terminalization produces or idempotently reuses the correct terminal-attention
      notification from canonical terminal truth without granting it lifecycle authority.
  - id: AC4
    condition: >
      REMEDIATION carrier/bootstrap are freshly reachable and fail closed on the non-authorizing
      revision-6 probe under 1a68db9 without creating a coding RUN solely for the probe.
  - id: AC5
    condition: >
      REPAIR carrier/bootstrap are freshly reachable and fail closed on the non-authorizing
      NO_CHANGE-shaped revision-6 probe under 1a68db9 with no coding Executor and no coding RUN
      solely for the probe.
  - id: AC6
    condition: >
      Exact-pin isolation, upstream TASK-144 revision-2 successful-REPAIR review/publication
      capability, one-capability-one-authority, all existing Phase-1/Phase-2 binding families,
      and Human/Brain/Runtime/Executor/Reviewer/Publisher/A3/A6/REPAIR/Attention boundaries
      remain intact without duplicate lifecycle implementation.
  - id: AC7
    condition: >
      Conformance/adoption records bind current certification to TASK-207 revision 6 and exact
      1a68db9 only on reviewed source publication, while preserving TASK-207 revision 5 /
      49ad4d7 as historical prior-pin evidence.
  - id: AC8
    condition: >
      Roadmap resolves the fresh-conformance prerequisite but preserves P7.3 as NEXT and exact
      TASK-215 revision-1 / RUN-215-004 / candidate 142bd865f69a6636b321d3cc7a0cd4004db3fdc7 /
      FINDING-215-001 / RUN-215-003 / REPAIR-215-002 resume continuity; it does not rerun
      TASK-215 or advance P7.4.
  - id: AC9
    condition: >
      Source mutations stay inside the six authorized files; focused deterministic tests and
      git diff --check pass with zero unresolved source items; Reviewer observes sufficient typed
      live current-pin evidence before PASS.

