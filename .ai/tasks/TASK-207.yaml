  - id: AC2
    condition: One fresh Antigravity PRIMARY wakeup under exact c96eb8b5 produces one canonical TASK-207 revision-4 RUN with deterministic verification lineage and duplicate-dispatch protection.
  - id: AC3
    condition: Revision-4 terminalization produces or idempotently reuses the correct terminal-attention notification from canonical terminal truth without granting it lifecycle authority.
  - id: AC4
    condition: REMEDIATION carrier/bootstrap are freshly reachable and fail closed on a non-authorizing probe under c96eb8b5 without creating a coding RUN solely for the probe.
  - id: AC5
    condition: REPAIR carrier/bootstrap are freshly reachable and fail closed on a non-authorizing NO_CHANGE-shaped probe under c96eb8b5 with no coding Executor and no coding RUN solely for the probe.
  - id: AC6
    condition: Exact-pin isolation, one-capability-one-authority, all Phase-1/Phase-2 binding families including TASK-217 bounded post-AUTHOR_REPAIR handoff, and Human/Brain/Runtime/Executor/Reviewer/Publisher/A3/A6/REPAIR/Attention boundaries remain intact without duplicate lifecycle implementation.
  - id: AC7
    condition: Conformance/adoption records bind current certification to TASK-207 revision 4 and exact c96eb8b5 only on reviewed source publication, while preserving TASK-207 revision-3 / 91a177d5 as historical evidence.
  - id: AC8
    condition: Roadmap resolves the fresh-conformance prerequisite but preserves P7.3 as NEXT and exact TASK-215 / RUN-215-002 resume lineage; it does not advance to P7.4.
  - id: AC9
    condition: Source mutations stay inside the six authorized files; focused deterministic tests and git diff --check pass with zero unresolved source items; Reviewer observes sufficient typed live evidence before PASS.
