task_id: TASK-207
revision: 1

goal: >
  Close FULL_AIOS_DOWNSTREAM_CONFORMANCE for Python Agent by certifying the already-published
  Phase-1 and Phase-2 repository bindings against live downstream operation, without creating
  another lifecycle authority or manufacturing correction work merely for ceremony. The gate
  must prove normal Brain authoring, PRIMARY execution on the dedicated self-hosted runner,
  terminal attention, and Review-to-Publication end to end; it must also prove that the
  REMEDIATION and REPAIR carrier families are live, bounded, and fail closed across their
  GitHub-hosted admission and self-hosted pinned-bootstrap boundaries without causing an
  unauthorized coding mutation. After reviewed publication, mark full downstream conformance
  DONE and make PROJECT_CONTRACT_REBUILD the unique NEXT roadmap commitment.

problem: >
  TASK-205 and TASK-206 are semantically reviewed and source-published. Python Agent main is
  9f741508f980a27e4b77c7224a2987b92067db94 and its sole active AIOS-renew authority remains
  exact reviewed/source-published pin 652b00b103dd50e2a550dd0ec0fe4063e69631b7. Phase 1
  activated GitHub Issue Brain authoring, PRIMARY wakeup through A1/A2, and terminal attention.
  Phase 2 activated Review-to-Publication continuation, Human remediation intent over separate
  A3/A6 authorities, and dedicated REPAIR wakeup. Those tasks intentionally did not claim full
  live downstream conformance. The current Project Contract HOW slot remains suspended until
  this gate is closed. The next work is therefore certification of the published bindings in
  their real repository/runner environment, not another source-adoption phase.

assumptions:
  - >
    Canonical Python Agent main at authoring is
    9f741508f980a27e4b77c7224a2987b92067db94, the exact reviewed and published TASK-206
    candidate from RUN-206-002 / REVIEW-206-001.
  - >
    Python Agent's sole active AIOS-renew dependency remains exactly
    652b00b103dd50e2a550dd0ec0fe4063e69631b7 under
    EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
  - >
    Phase-1 and Phase-2 repository bindings are already source-published and classified ACTIVE.
    This task certifies those bindings; it does not create replacement ingress, wakeup,
    correction, review, Runtime, or Publisher semantics.
  - >
    docs/CHATGPT_PROJECT_CONTRACT.md is a suspended transitional HOW slot and explicitly
    requires full downstream AIOS control-plane conformance before a durable replacement may
    be drafted. The complete future replacement still requires separate full-text Human approval.
  - >
    Live PRIMARY and correction-boundary probes require one dedicated Windows x64 self-hosted
    runner registered for trung-via/python_complete_agent with custom label
    python-complete-agent and repository variable AIOS_REPO_ROOT pointing to a persistent
    Python Agent checkout. These are Human-owned operational prerequisites, not source truth.
  - >
    Live conformance evidence may include GitHub Issue receipts, GitHub Actions run/job state,
    canonical AIOS refs/artifacts, and exact candidate/publication refs. Runtime unit tests alone
    cannot satisfy live-conformance acceptance.
  - >
    Two previously observed defects remain deferred and are not source-fix authority for this
    task: D1, the local Human-facing worker can supply a coding Executor to NO_CHANGE even when
    executor_required=false; D2, native Windows pytest may raise WinError 5 while cleaning
    pytest-current after completed tests. If D2 naturally occurs during this conformance run,
    recovery must preserve the exact candidate and use canonical NO_CHANGE REPAIR semantics.
  - >
    Full conformance does not require fabricating a CHANGES_REQUIRED verdict or failed RUN solely
    to exercise correction. For REMEDIATION/REPAIR, a live bounded fail-closed probe through the
    published carrier/self-hosted bootstrap plus TASK-206 deterministic positive semantics is
    sufficient unless a real correction condition naturally occurs.

