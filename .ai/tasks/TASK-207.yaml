task_id: TASK-207
revision: 6

goal: >
  Re-certify Python Agent full downstream AIOS control-plane conformance under the
  exact reviewed/source-published AIOS-renew pin
  1a68db9acb6989dfa81bf875503db62e54a4bed6 after TASK-219 published that migration.
  Preserve TASK-207 as the sole downstream-conformance semantic authority, preserve
  revision-5 certification for 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2 as
  historical prior-pin evidence, freshly prove the current Phase-1/Phase-2 bindings
  where the pin movement is material, and make revision-6 certification effective
  only after independent semantic PASS and safe publication of exactly the reviewed
  source candidate. After effective certification, resume P7.3 by reviewing and, if
  eligible, publishing the preserved TASK-215 revision-1 RUN-215-004 candidate
  142bd865f69a6636b321d3cc7a0cd4004db3fdc7 against FINDING-215-001; do not rerun
  TASK-215 and do not advance P7.4.

problem: >
  TASK-219 / RUN-219-001 / REVIEW-219-001 is now source-published on canonical
  Python Agent main at f7ee8a6d0c0fb7290ebfb2190703caf78baae5b8. The sole active
  downstream AIOS-renew dependency and worker provenance authority are now exact
  1a68db9acb6989dfa81bf875503db62e54a4bed6. Canonical adoption and roadmap state
  intentionally mark full downstream conformance for 1a68db9 as
  PENDING_FRESH_CERTIFICATION and preserve TASK-207 revision-5 certification only
  as historical evidence for 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2.

  TASK-219 was required because the prior 49ad4d7 control plane could not canonicalize
  the successful TASK-215 REPAIR DELTA review: SUBMIT_REVIEW did not reconstruct
  successful REPAIR lineage, so prior_finding_id validation failed before review-decision
  materialization. Upstream TASK-144 revision 2 fixed that generic review/publication
  gap and exact source 1a68db9 was independently reviewed and source-published.
  Python Agent must now certify that the existing repository-owned authoring, PRIMARY,
  attention, remediation, repair, review, and publication bindings remain conformant
  under that exact pin before using the newly adopted capability to review RUN-215-004.
  Because TASK-207 already owns downstream-conformance semantics, the correct continuation
  is revision 6 of TASK-207, not a new conformance task.

assumptions:
  - Canonical Python Agent main at authoring is f7ee8a6d0c0fb7290ebfb2190703caf78baae5b8, the exact TASK-219 reviewed source candidate published to main.
  - The sole active AIOS-renew dependency and worker provenance authority are exactly 1a68db9acb6989dfa81bf875503db62e54a4bed6 under EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
  - TASK-219 / RUN-219-001 / REVIEW-219-001 are completed migration lineage; RUN-219-001 passed 225 focused downstream tests and git diff --check before source publication.
  - TASK-207 revision 5 and .ai/aios-conformance-state.yaml remain valid historical certification evidence only for 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2 after TASK-219 publication.
  - All existing Phase-1/Phase-2 repository binding implementation files remained unchanged by TASK-219; only exact pin, documentation, planning/provenance state, and related governance tests changed.
  - P7.3 remains the unique product NEXT and TASK-215 revision 1 remains product_done=false.
  - TASK-215 current successful correction candidate is RUN-215-004 at 142bd865f69a6636b321d3cc7a0cd4004db3fdc7, preserving FINDING-215-001 through predecessor RUN-215-003 / REPAIR-215-002 continuity.
  - No review-decision ref exists for RUN-215-004 at authoring time.
  - No RUN-207-006 exists at authoring time; existing TASK-207 canonical RUN history extends through RUN-207-005.
  - Mutable future upstream AIOS-renew main is not downstream authority; only the checked-in exact pin is relevant.

