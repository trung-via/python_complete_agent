constraints:
  hard:
    - TASK-207 revision 4 remains the sole downstream-conformance semantic authority and supersedes only the current-certification role of revision 3; revision-3 evidence remains immutable historical old-pin evidence.
    - This revision must itself be authored through the live [AIOS BRAIN INGRESS] carrier against canonical predecessor main d12434f2d688a3381e0dd75b4067d7786cabb4a0 so authoring ingress is freshly exercised while c96eb8b5 is already active on main.
    - PRIMARY execution must use one fresh [AIOS BRAIN WAKEUP] request, executor antigravity, and a new stable dispatch_id through the dedicated [self-hosted, windows, x64, python-complete-agent] path. It must resolve exact pin c96eb8b5 from current main and produce one canonical RUN with deterministic verification evidence.
    - Terminalization must create or idempotently reuse the strict [AIOS TERMINAL ATTENTION] carrier tied to canonical terminal truth. Attention remains notification only.
    - Fresh REMEDIATION conformance must be live-proven under c96eb8b5 through the repository-owned GitHub carrier and self-hosted Phase-2 bootstrap using a deliberately non-authorizing selector shape that must fail closed without creating an implementation RUN. This is a transport/admission probe, not fabricated semantic remediation.
    - Fresh REPAIR conformance must be live-proven under c96eb8b5 through the repository-owned GitHub carrier and self-hosted Phase-2 bootstrap using a deliberately non-authorizing NO_CHANGE-shaped selector with no coding Executor. It must fail closed without creating an implementation RUN unless a real TASK-207 failure independently requires canonical REPAIR.
    - The current bounded post-AUTHOR_REPAIR dispatch added by TASK-217 must remain represented as an ACTIVE repository binding but need not be triggered by manufacturing a failed RUN. Deterministic source tests plus the live REPAIR carrier probe are sufficient unless real correction state naturally invokes AUTHOR_REPAIR.
    - Review-to-publication authority remains the existing Brain ingress plus safe Publisher. The candidate must record certification status as effective only after its own PRIMARY semantic PASS is canonicalized and the safe Publisher publishes exactly the reviewed source candidate so canonical main equals it.
    - .ai/aios-conformance-state.yaml must be updated from old-pin current certification to TASK-207 revision-4 / c96eb8b5 publication-gated certification while preserving revision-3 / 91a177d5 as explicit historical certification evidence. It remains a certification record, not Runtime truth or raw evidence store.
    - .ai/aios-adoption-state.yaml must mark c96eb8b5 full downstream conformance as publication-gated current certification only after the candidate is reviewed/published, preserve exact pin and capability/binding classifications, and retain old-pin certification history.
    - .ai/roadmap-state.yaml must resolve FRESH_AIOS_DOWNSTREAM_CONFORMANCE_CERTIFICATION through TASK-207 revision 4 while preserving P7.3 as the unique product NEXT and exact resume_target TASK-215 / RUN-215-002. It must not mark P7.3 DONE or advance to P7.4.
    - No source mutation outside the six authorized modify files is permitted. A live defect in workflows, policy, bootstrap, pin, or Runtime blocks certification and requires separate authorized work rather than widening this task.
    - Deterministic verification must be offline, non-interactive, provider/network independent, and use a dedicated gitdir pytest basetemp to avoid native Windows pytest-current cleanup noise without changing product semantics.
    - Semantic Reviewer must independently inspect typed live evidence and must not PASS solely because source tests pass. Missing material current-pin live evidence is BLOCKED or CHANGES_REQUIRED as appropriate.
