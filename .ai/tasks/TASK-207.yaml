task_id: TASK-207
revision: 4
goal: >
  Re-certify Python Agent full downstream AIOS control-plane conformance under the currently
  published exact AIOS-renew pin c96eb8b52acd865b9453409e6598e08a8bd4e48e after TASK-217
  activated that pin on canonical main. Preserve TASK-207 as the sole conformance semantic
  authority, preserve prior revision-3 certification as historical evidence for 91a177d5 only,
  prove the current Phase-1/Phase-2 repository bindings through fresh live evidence where the
  pin movement is material, and make the new certification effective only after independent
  semantic PASS and safe publication of exactly the reviewed source candidate. After effective
  certification, resume the existing product roadmap at P7.3 through the preserved
  TASK-215 / RUN-215-002 correction lineage; do not advance to P7.4 in this task.
problem: >
  TASK-217 is now source-published on canonical Python Agent main at
  d12434f2d688a3381e0dd75b4067d7786cabb4a0 and migrated the sole active AIOS-renew runtime
  authority from 91a177d5b96b2197a4d8223dbb727dda6201cb64 to exact reviewed/source-published
  c96eb8b52acd865b9453409e6598e08a8bd4e48e. Canonical adoption and roadmap state explicitly
  mark full downstream conformance for c96eb8b5 as PENDING_FRESH_CERTIFICATION and preserve the
  TASK-207 revision-3 certification only as historical old-pin evidence. The same roadmap also
  preserves P7.3 as NEXT and exact TASK-215 / RUN-215-002 correction lineage, requiring fresh
  conformance before generic roadmap continuation. Because TASK-207 already owns downstream
  conformance semantics, the correct continuation is revision 4 of TASK-207 rather than a new
  conformance task or second authority.
assumptions:
  - Canonical Python Agent main at authoring is d12434f2d688a3381e0dd75b4067d7786cabb4a0, the exact TASK-217 reviewed source candidate published to main.
  - The sole active AIOS-renew dependency and worker provenance authority are exactly c96eb8b52acd865b9453409e6598e08a8bd4e48e under EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
  - TASK-217 / RUN-217-001 / REVIEW-217-001 are completed migration lineage; RUN-217-001 passed deterministic verification with 221 tests and git diff --check before source publication.
  - TASK-207 revision 3 and .ai/aios-conformance-state.yaml remain valid historical evidence only for downstream pin 91a177d5b96b2197a4d8223dbb727dda6201cb64 and must not be promoted into current-pin certification.
  - Phase-1 and Phase-2 repository bindings remain the same authority families, while TASK-217 additionally activated the bounded TASK-127 post-AUTHOR_REPAIR dispatch in Brain ingress and exact-title REPAIR carrier hardening.
  - P7.3 remains the product NEXT. TASK-215 / RUN-215-002 is preserved correction lineage with product_done=false and must not be rerun or modified inside this certification task.
  - No newer unreviewed upstream planning/task-authoring commit is runtime authority for this revision; downstream authority is the checked-in exact pin only.
