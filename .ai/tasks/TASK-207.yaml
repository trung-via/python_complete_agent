      revision-7 / RUN-207-009 preserved as immutable non-certifying old-pin history.
  - id: AC2
    condition: >
      One fresh Codex PRIMARY Brain Wakeup under exact edd7d8d produces exactly one canonical
      TASK-207 revision-8 RUN with deterministic verification lineage and duplicate-dispatch
      protection from the dedicated self-hosted Python Agent runner.
  - id: AC3
    condition: >
      Revision-8 terminalization produces or idempotently reuses the correct terminal-attention
      notification from canonical terminal truth without granting it lifecycle authority.
  - id: AC4
    condition: >
