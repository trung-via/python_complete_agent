  - id: AC6
    condition: >
      Exact-pin isolation, upstream TASK-148 revision-2 historical-subject capability,
      one-capability-one-authority, all existing Phase-1/Phase-2 binding families, and
      Human/Brain/Runtime/Executor/Reviewer/Publisher/A3/A6/REPAIR/Attention boundaries remain
      intact without duplicate lifecycle implementation or upstream-hook activation.
  - id: AC7
    condition: >
      Conformance/adoption records bind current certification to TASK-207 revision 8 and exact
      edd7d8d only on reviewed source publication, preserving TASK-207 revision 5 / 49ad4d7
      historical certification and revision 7 / RUN-207-009 failed old-pin history.
  - id: AC8
    condition: >
      Roadmap resolves the fresh-conformance prerequisite but preserves P7.3 as NEXT and exact
      TASK-215 revision-1 / RUN-215-004 / candidate
      142bd865f69a6636b321d3cc7a0cd4004db3fdc7 / FINDING-215-001 / RUN-215-003 /
      REPAIR-215-002 continuity without rerunning TASK-215 or advancing P7.4.
  - id: AC9
    condition: >
      Source mutations stay inside the six authorized files; focused deterministic tests and
      git diff --check pass with zero unresolved source items; Reviewer observes sufficient
