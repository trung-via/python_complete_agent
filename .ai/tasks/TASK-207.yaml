task_id: TASK-207
revision: 3

goal: >
  Resume and close FULL_AIOS_DOWNSTREAM_CONFORMANCE for Python Agent after reviewed and
  published TASK-209 migrated the sole active AIOS-renew runtime authority to exact pin
  91a177d5b96b2197a4d8223dbb727dda6201cb64. Certify the already-published Phase-1 and
  Phase-2 repository bindings against live downstream operation under that exact pin,
  including the TASK-118 terminal-attention portability hardening that revision 2 could not
  prove. Preserve one-capability-one-authority and the existing Brain/Runtime/Executor/
  Reviewer/Publisher/A3/A6/REPAIR/Attention boundaries. After reviewed publication of the
  TASK-207 revision-3 candidate, mark FULL_AIOS_DOWNSTREAM_CONFORMANCE DONE and make
  PROJECT_CONTRACT_REBUILD the unique NEXT roadmap commitment.

problem: >
  TASK-207 revision 2 was correctly rebound after TASK-208 to pin
  26097405343150dc1b55015b94720528afad50ed. Its live PRIMARY lineage reached canonical
  RESULT and deterministic verification PASS, and real REPAIR recovery was also proven, but
  semantic certification remained blocked because terminal-attention publication was
  unavailable for exact-pin downstream layouts that do not vendor src/aios_renew source.
  Upstream TASK-118 repaired that causal portability defect, REVIEW-118-001 returned PRIMARY
  PASS, and AIOS-renew source publication advanced upstream main to
  91a177d5b96b2197a4d8223dbb727dda6201cb64. Downstream TASK-209 then explicitly migrated
  Python Agent to that exact reviewed/source-published pin; RUN-209-002 produced canonical
  RESULT after a NO_CHANGE verification-only continuation, REVIEW-209-001 returned PRIMARY
  PASS, and safe publication advanced Python Agent main to
  ed10b28e068d662e8dd70c8a38af2b0da19fcf65. TASK-207 revision 2 and its RUN/REPAIR lineage
  remain immutable old-pin evidence and are not certification authority for the new pin.
  Revision 3 must therefore gather only the live evidence invalidated by the pin movement and
  terminal-attention fix, while reusing still-valid repository/governance evidence instead of
  repeating unchanged work for ceremony.

assumptions:
  - >
    Canonical Python Agent main immediately before this revision is
    ed10b28e068d662e8dd70c8a38af2b0da19fcf65, the reviewed and source-published TASK-209
    candidate from RUN-209-002 / REVIEW-209-001.
  - >
    Python Agent's sole active AIOS-renew dependency and worker provenance authority are
    exactly 91a177d5b96b2197a4d8223dbb727dda6201cb64 under
    EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
  - >
    AIOS-renew main is 91a177d5b96b2197a4d8223dbb727dda6201cb64 and contains reviewed
    TASK-118 terminal-attention portability hardening. Downstream authority derives from the
    checked-in exact pin rather than mutable upstream main.
  - >
    TASK-209 changed only bounded exact-pin/provenance migration surfaces and preserved every
    TASK-205/TASK-206 Phase-1/Phase-2 repository binding, policy, workflow, runner label/path,
    actor allowlist, bootstrap boundary, and semantic authority unchanged.
  - >
    TASK-207 revision 2, RUN-207-001, REPAIR-207-001, RUN-207-002, and all associated live
    evidence remain immutable history bound to the prior pin. They may explain observed
    behavior but must not be promoted into positive certification evidence when the changed
    exact-pin dependency is material to the capability under test.
  - >
    The immediately preceding TASK-209 review-to-publication path is current live evidence that
    Brain ingress SUBMIT_REVIEW and the safe Publisher can publish an exact reviewed source
    candidate on this repository. Because TASK-207 revision 3 is not authorized to modify that
    transport, the evidence remains reusable unless new canonical state invalidates it.
  - >
    docs/CHATGPT_PROJECT_CONTRACT.md remains a suspended transitional HOW slot. A durable
    replacement may be drafted only after full downstream conformance and still requires
    separate full-text Human approval.
  - >
    Live PRIMARY and correction-boundary probes require the dedicated Windows x64 self-hosted
    runner for trung-via/python_complete_agent with custom label python-complete-agent and
    repository variable AIOS_REPO_ROOT pointing to the persistent checkout. These are
    Human-owned operational prerequisites rather than source truth.
  - >
    D1 remains the deferred local Human-facing worker supplied-executor mismatch when
    executor_required=false. D2 remains the deferred native Windows pytest-current cleanup
    defect. D3 remains the deferred cross-chat roadmap interruption/resume persistence audit.
    None is implementation authority for this task.
  - >
    Full conformance does not require fabricating CHANGES_REQUIRED, deliberately failing a
    RUN, or manufacturing coding mutation merely to exercise correction transports. Fresh
    bounded fail-closed live probes under the new exact pin are sufficient unless a real
    correction condition naturally occurs.

