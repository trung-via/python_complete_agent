task_id: TASK-207
revision: 7

goal: >
  Re-certify Python Agent full downstream AIOS control-plane conformance under the
  exact reviewed/source-published AIOS-renew pin
  1a68db9acb6989dfa81bf875503db62e54a4bed6 after TASK-219 published that migration,
  while preserving the failed TASK-207 revision-6 RUN-207-006 as immutable,
  non-repairable execution history. Preserve TASK-207 as the sole downstream-
  conformance semantic authority, preserve revision-5 certification for
  49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2 as historical prior-pin evidence,
  freshly prove the current Phase-1/Phase-2 bindings where the pin movement is
  material, and make revision-7 certification effective only after independent
  semantic PASS and safe publication of exactly the reviewed source candidate.
  After effective certification, resume P7.3 by reviewing and, if eligible,
  publishing the preserved TASK-215 revision-1 RUN-215-004 candidate
  142bd865f69a6636b321d3cc7a0cd4004db3fdc7 against FINDING-215-001; do not rerun
  TASK-215 and do not advance P7.4.

problem: >
  TASK-207 revision 6 was canonically authored at
  bb79c6440a240cded4aac501619399cd9b8aeb56 under exact pin
  1a68db9acb6989dfa81bf875503db62e54a4bed6. Its admitted Antigravity PRIMARY became
  canonical RUN-207-006 but failed during EXECUTION before Runtime verification.
  Canonical failure evidence records base/failed-head
  bb79c6440a240cded4aac501619399cd9b8aeb56, zero committed changed files, dirty=true,
  repairable=false, transportable=false, and error type AntigravityExecutionError
  with message "Antigravity ResultPackage missing: root agent idle; waiting up to 5s
  for 2 background task(s)". A terminal-attention FAILURE carrier was created for
  RUN-207-006. Because the failure is non-repairable and non-transportable,
  RUN-207-006 must not be retried, repaired, rerouted, reviewed, integrated, or
  published. Its uncommitted local work is not canonical candidate authority.

  The conformance requirement itself remains unresolved: adoption and roadmap state
  still mark exact 1a68db9 full downstream conformance as PENDING_FRESH_CERTIFICATION,
  and the current certification record remains TASK-207 revision 5 for prior pin
  49ad4d7 only. The correct continuation is therefore a fresh TASK-207 revision 7,
  not REPAIR of RUN-207-006 and not a new conformance task.

assumptions:
  - Canonical Python Agent main at authoring is bb79c6440a240cded4aac501619399cd9b8aeb56 containing TASK-207 revision 6.
  - The sole active AIOS-renew dependency and worker provenance authority remain exactly 1a68db9acb6989dfa81bf875503db62e54a4bed6 under EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
  - TASK-219 / RUN-219-001 / REVIEW-219-001 remain completed, source-published migration lineage.
  - TASK-207 revision 5 remains valid historical certification evidence only for 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2.
  - RUN-207-006 is canonical immutable TASK-207 revision-6 FAILURE history with phase EXECUTION, repairable=false, transportable=false, and no canonical source candidate.
  - RUN-207-006 local uncommitted edits are not review, publication, or continuation authority and must not be reused as the revision-7 candidate.
  - Existing Phase-1/Phase-2 repository binding implementation files remain unchanged on canonical main.
  - P7.3 remains the unique product NEXT and TASK-215 revision 1 remains product_done=false.
  - TASK-215 current successful correction candidate remains RUN-215-004 at 142bd865f69a6636b321d3cc7a0cd4004db3fdc7, preserving FINDING-215-001 through predecessor RUN-215-003 / REPAIR-215-002 continuity.
  - No review-decision ref exists for RUN-215-004.
  - Existing TASK-207 canonical RUN history extends through failed RUN-207-006; the fresh revision-7 PRIMARY is expected to become RUN-207-007.
  - Mutable future upstream AIOS-renew main is not downstream authority; only the checked-in exact pin is relevant.

