non_goals:
  - Create a new conformance task or second downstream-conformance authority.
  - Modify the AIOS-renew pin, worker provenance, workflow/carrier implementation, policies, bootstraps, Runtime, Reviewer, Publisher, A3/A6, correction actions, REPAIR semantics, or terminal-attention implementation.
  - REPAIR, retry, reroute, review, integrate, publish, or otherwise revive RUN-207-006.
  - Reuse, cherry-pick, commit, or otherwise promote RUN-207-006 uncommitted local edits as canonical revision-7 work.
  - Modify, rerun, repair, review, integrate, publish, or otherwise advance TASK-215 or RUN-215-004 inside this conformance task.
  - Modify src/product_intelligence, src/commerce_opportunity_intelligence, marketplace/browser/provider behavior, scoring/ranking, evidence, product truth, retrieval, persistence, or any product semantic.
  - Rewrite TASK-207 revision-5 history or claim its 49ad4d7 live evidence is current certification for 1a68db9.
  - Manufacture CHANGES_REQUIRED, deliberately fail a real implementation RUN, or introduce code mutation solely to exercise correction transport.
  - Manufacture a TASK-215 DELTA review solely as conformance evidence.
  - Reimplement upstream TASK-144 behavior downstream, delete Runtime history, create a generic router/retry/reroute loop, scheduler, queue, broker, Planner, memory database, generic conversation store, duplicate lifecycle state machine, or floating AIOS reference.
  - Push, merge, publish, or mutate canonical main from Executor implementation execution.

constraints:
  hard:
    - >
      TASK-207 revision 7 remains the sole downstream-conformance semantic authority.
      RUN-207-006 remains immutable failed revision-6 history and grants no source,
      correction, review, or publication authority.
    - >
      Before revision-7 PRIMARY dispatch, the self-hosted Python Agent checkout used by
      the repository binding must be clean and synchronized to the canonical revision-7
      task commit. Any preserved local RUN-207-006 partial diff may exist only outside
      the active worktree as non-authoritative diagnostic backup.
    - >
      This revision must itself be authored through the live [AIOS BRAIN INGRESS]
      carrier against canonical predecessor main bb79c6440a240cded4aac501619399cd9b8aeb56
      while exact pin 1a68db9acb6989dfa81bf875503db62e54a4bed6 is active.
    - >
      PRIMARY execution must use one fresh [AIOS BRAIN WAKEUP] request with executor
      antigravity and stable dispatch_id task207-r7-antigravity-001 through the dedicated
      [self-hosted, windows, x64, python-complete-agent] path. It must produce exactly one
      fresh canonical TASK-207 revision-7 RUN, expected RUN-207-007, with deterministic
      Runtime verification evidence and duplicate-dispatch protection. Do not use local
      CONTINUE or explicit RUN as the conformance PRIMARY surface.
    - >
      The selected Executor must perform only the bounded six-file implementation work.
      Runtime owns canonical verification; Executor must not run the TASK-level pytest
      verification suite, long-running builds, watchers, delegated subagents, or background
      tasks as substitute verification, and must return the required structured terminal
      ResultPackage only after all bounded repository work and commit completion are finished.
    - >
      Terminalization must create or idempotently reuse the strict [AIOS TERMINAL ATTENTION]
      carrier tied to revision-7 canonical terminal truth. Attention remains notification only.
    - >
      Fresh REMEDIATION conformance must be live-proven under exact 1a68db9 through the
      repository-owned GitHub carrier and self-hosted Phase-2 bootstrap using stable
      correction_dispatch_id task-207-r7-remediation-non-authorizing-001 and a deliberately
      non-authorizing selector shape that fails closed without creating an implementation RUN.
    - >
      Fresh REPAIR conformance must be live-proven under exact 1a68db9 through the
      repository-owned GitHub carrier and self-hosted Phase-2 bootstrap using stable
      repair_dispatch_id task-207-r7-repair-non-authorizing-001 and a deliberately
      non-authorizing NO_CHANGE-shaped selector with no coding Executor, failing closed
      without creating an implementation RUN unless a real revision-7 failure independently
      requires canonical correction.
    - >
      Review-to-publication authority remains the existing Brain ingress plus safe Publisher.
      Revision-7 certification becomes effective only after PRIMARY semantic PASS is canonicalized
      and the safe Publisher publishes exactly the reviewed revision-7 source candidate.
    - >
      Upstream TASK-144 revision-2 successful-REPAIR review reconstruction/publication semantics
      are certified as exact-pin package capability by immutable reviewed/source-published
      provenance plus deterministic current-pin regression coverage. Do not consume RUN-215-004
      as a conformance probe.
    - >
      .ai/aios-conformance-state.yaml must move current certification to TASK-207 revision 7 /
      exact 1a68db9 while preserving revision 5 / 49ad4d7 as historical prior-pin certification
      and retaining RUN-207-006 as failed non-certifying revision-6 history without making this
      certification record a Runtime truth or raw evidence store.
    - >
      .ai/aios-adoption-state.yaml must mark exact 1a68db9 full downstream conformance as
      publication-gated current certification through TASK-207 revision 7 only after publication,
      preserving pin, package/binding classifications, TASK-144 provenance, and prior-pin history.
    - >
      .ai/roadmap-state.yaml must resolve FRESH_AIOS_DOWNSTREAM_CONFORMANCE_CERTIFICATION
      through TASK-207 revision 7 while preserving P7.3 as the unique product NEXT and exact
      resume target TASK-215 revision 1 / RUN-215-004 / candidate
      142bd865f69a6636b321d3cc7a0cd4004db3fdc7 / FINDING-215-001 with predecessor
      RUN-215-003 / REPAIR-215-002 continuity. It must not mark P7.3 DONE or advance P7.4.
    - >
      No source mutation outside the six authorized modify files is permitted. A live defect in
      workflow, policy, bootstrap, pin, Runtime, repair/review reconstruction, or transport blocks
      certification and requires separate authorized work rather than widening this task.
    - >
      Deterministic verification must be offline, non-interactive and provider/network independent,
      using a dedicated gitdir pytest basetemp. Live carrier evidence is separately observed from
      canonical GitHub workflow/receipt state and must not be faked inside offline tests.
    - >
      Semantic Reviewer must independently inspect typed live current-pin evidence and must not
      PASS solely because source tests pass.

acceptance:
  - id: AC1
    condition: >
      TASK-207 revision 7 is canonically authored through live Brain ingress from predecessor
      bb79c6440a240cded4aac501619399cd9b8aeb56 while exact 1a68db9 is active, with
      RUN-207-006 preserved as immutable non-certifying failure history.
  - id: AC2
    condition: >
      One fresh Antigravity PRIMARY Brain Wakeup under exact 1a68db9 produces exactly one
      canonical TASK-207 revision-7 RUN with deterministic verification lineage and
      duplicate-dispatch protection from a clean synchronized self-hosted checkout.
  - id: AC3
    condition: >
      Revision-7 terminalization produces or idempotently reuses the correct terminal-attention
      notification from canonical terminal truth without granting it lifecycle authority.
  - id: AC4
    condition: >
      REMEDIATION carrier/bootstrap are freshly reachable and fail closed on the non-authorizing
      revision-7 probe under 1a68db9 without creating a coding RUN solely for the probe.
  - id: AC5
    condition: >
      REPAIR carrier/bootstrap are freshly reachable and fail closed on the non-authorizing
      NO_CHANGE-shaped revision-7 probe under 1a68db9 with no coding Executor and no coding RUN
      solely for the probe.
  - id: AC6
    condition: >
      Exact-pin isolation, upstream TASK-144 revision-2 successful-REPAIR review/publication
      capability, one-capability-one-authority, all existing Phase-1/Phase-2 binding families,
      and Human/Brain/Runtime/Executor/Reviewer/Publisher/A3/A6/REPAIR/Attention boundaries
      remain intact without duplicate lifecycle implementation.
  - id: AC7
    condition: >
      Conformance/adoption records bind current certification to TASK-207 revision 7 and exact
      1a68db9 only on reviewed source publication, preserving TASK-207 revision 5 / 49ad4d7
      as historical prior-pin certification and RUN-207-006 as failed non-certifying history.
  - id: AC8
    condition: >
      Roadmap resolves the fresh-conformance prerequisite but preserves P7.3 as NEXT and exact
      TASK-215 revision-1 / RUN-215-004 / candidate 142bd865f69a6636b321d3cc7a0cd4004db3fdc7 /
      FINDING-215-001 / RUN-215-003 / REPAIR-215-002 continuity without rerunning TASK-215
      or advancing P7.4.
  - id: AC9
    condition: >
      Source mutations stay inside the six authorized files; focused deterministic tests and
      git diff --check pass with zero unresolved source items; Reviewer observes sufficient typed
      live current-pin evidence before PASS.

