non_goals:
  - Create a new conformance task or second downstream-conformance authority.
  - Modify the AIOS-renew pin, worker provenance, workflow/carrier implementation, policies, bootstraps, Runtime, Reviewer, Publisher, A3/A6, correction actions, REPAIR semantics, or terminal-attention implementation.
  - REPAIR, retry, recover, review, publish, or otherwise revive RUN-207-009.
  - Reuse any revision-7 candidate as revision-8 source authority instead of implementing revision 8 from current canonical main.
  - Modify, rerun, repair, review, publish, or otherwise advance TASK-215 / RUN-215-004 inside this conformance task.
  - Modify src/product_intelligence, src/commerce_opportunity_intelligence, marketplace/browser/provider behavior, scoring/ranking, evidence, product truth, retrieval, persistence, or any product semantic.
  - Rewrite revision-5 historical certification or claim revision-7 live evidence is current certification for edd7d8d where the pin is material.
  - Manufacture CHANGES_REQUIRED, deliberately fail a real implementation RUN, or introduce code mutation solely to exercise correction transport.
  - Manufacture a TASK-215 DELTA review solely as conformance evidence.
  - Reimplement upstream TASK-148 behavior downstream, copy upstream project hooks, delete Runtime history, create a generic router/retry/reroute loop, scheduler, queue, broker, Planner, memory database, generic conversation store, duplicate lifecycle state machine, or floating AIOS reference.
  - Push, merge, publish, or mutate canonical main from Executor implementation execution.

constraints:
  hard:
    - >
      TASK-207 revision 8 remains the sole downstream-conformance semantic authority for the
      current pin. Revision 7 / RUN-207-009 remains immutable failed old-pin history and grants
      no source, correction, review, publication, or certification authority for edd7d8d.
    - >
      This revision must itself be authored through the live [AIOS BRAIN INGRESS] carrier
      against canonical predecessor main df1d71974979bed37bd20d67d9f0700fdb1e75b0 while
      exact pin edd7d8d92d54900c56442bbfcddb8648ec4d2e09 is active.
    - >
      PRIMARY execution must use one fresh [AIOS BRAIN WAKEUP] request with executor codex
      and stable dispatch_id task207-r8-codex-001 through the dedicated
      [self-hosted, windows, x64, python-complete-agent] path. It must produce exactly one
      fresh canonical TASK-207 revision-8 RUN, expected RUN-207-010, with deterministic
      Runtime verification evidence and duplicate-dispatch protection. Do not use local
      compatibility/debug execution as the conformance PRIMARY surface.
    - >
      The selected Executor performs only bounded six-file implementation work. Runtime owns
      canonical verification; Executor must not run the TASK-level verification suite,
      long-running builds, watchers, delegated/background agents, or another AIOS operation
      as substitute verification, and must return one structured terminal ResultPackage only
      after bounded repository work and commit completion are finished.
    - >
      Terminalization must create or idempotently reuse the strict [AIOS TERMINAL ATTENTION]
      carrier tied to revision-8 canonical terminal truth. Attention remains notification only.
    - >
      Fresh REMEDIATION conformance must be live-proven under exact edd7d8d through the
      repository-owned GitHub carrier and self-hosted Phase-2 bootstrap using stable
      correction_dispatch_id task-207-r8-remediation-non-authorizing-001 and a deliberately
      non-authorizing selector shape that fails closed without creating an implementation RUN.
    - >
      Fresh REPAIR conformance must be live-proven under exact edd7d8d through the
      repository-owned GitHub carrier and self-hosted Phase-2 bootstrap using stable
      repair_dispatch_id task-207-r8-repair-non-authorizing-001 and a deliberately
      non-authorizing NO_CHANGE-shaped selector with no coding Executor, failing closed
      without creating an implementation RUN unless a real revision-8 failure independently
      requires canonical correction.
    - >
      Review-to-publication authority remains the existing Brain ingress plus safe Publisher.
      Revision-8 certification becomes effective only after PRIMARY semantic PASS is canonicalized
      and the safe Publisher publishes exactly the reviewed revision-8 source candidate.
    - >
      Upstream TASK-148 revision-2 historical-subject semantics are certified as exact-pin package
      capability by immutable REVIEW-148-003/source-publication provenance plus deterministic
      current-pin regression coverage. Do not copy its Runtime implementation downstream and do
      not consume RUN-215-004 as a conformance probe.
    - >
      .ai/aios-conformance-state.yaml must move current certification to TASK-207 revision 8 /
      exact edd7d8d while preserving revision 5 / 49ad4d7 as historical prior-pin certification
      and revision 7 / RUN-207-009 as failed old-pin non-certifying history. It remains a
      certification record, not Runtime truth or raw evidence storage.
    - >
      .ai/aios-adoption-state.yaml must mark exact edd7d8d full downstream conformance as
      publication-gated current certification through TASK-207 revision 8 only after publication,
      preserving exact pin, package/binding classifications, TASK-148 provenance, and prior-pin history.
    - >
      .ai/roadmap-state.yaml must resolve FRESH_AIOS_DOWNSTREAM_CONFORMANCE_CERTIFICATION through
      TASK-207 revision 8 while preserving P7.3 as the unique product NEXT and exact resume target
      TASK-215 revision 1 / RUN-215-004 / candidate
      142bd865f69a6636b321d3cc7a0cd4004db3fdc7 / FINDING-215-001 with predecessor
      RUN-215-003 / REPAIR-215-002 continuity. It must not mark P7.3 DONE or advance P7.4.
    - >
      No source mutation outside the six authorized modify files is permitted. A live defect in
      workflow, policy, bootstrap, pin, Runtime, historical-subject semantics, review transport,
      or correction transport blocks certification and requires separate authorized work rather
      than widening this task.
    - >
      Deterministic verification must be offline, non-interactive and provider/network independent,
      using a dedicated gitdir pytest basetemp. Live carrier evidence is separately observed from
      canonical GitHub workflow/receipt state and must not be faked inside offline tests.
    - >
      Semantic Reviewer must independently inspect typed live current-pin evidence and must not
      PASS solely because source tests pass.

