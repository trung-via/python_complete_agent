task_id: TASK-207
revision: 5

goal: >
  Re-certify Python Agent full downstream AIOS control-plane conformance under the
  exact reviewed/source-published AIOS-renew pin
  49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2 after TASK-218 published that migration.
  Preserve TASK-207 as the sole downstream-conformance semantic authority, preserve
  revision-4 certification for c96eb8b52acd865b9453409e6598e08a8bd4e48e as
  historical prior-pin evidence, freshly prove the current Phase-1/Phase-2 bindings
  where the pin movement is material, and make revision-5 certification effective
  only after independent semantic PASS and safe publication of exactly the reviewed
  source candidate. After effective certification, resume P7.3 through the preserved
  TASK-215 / RUN-215-003 / REPAIR-215-002 lineage; do not advance P7.4.

problem: >
  TASK-218 / RUN-218-001 / REVIEW-218-001 is now source-published on canonical
  Python Agent main at ada9a4e5b765a7daa4e081db1d56917410a73873. The sole active
  downstream AIOS-renew dependency and worker provenance authority are now exact
  49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2. Canonical adoption and roadmap state
  intentionally mark full downstream conformance for 49ad4d7 as
  PENDING_FRESH_CERTIFICATION and preserve TASK-207 revision-4 certification only
  as historical evidence for c96eb8b52acd865b9453409e6598e08a8bd4e48e.
  The migration was required because the c96 kernel can falsely report
  MALFORMED_CANONICAL_STATE when the same repaired-REMEDIATION REPAIR terminal exists
  in both local Runtime state and canonical remote lifecycle; upstream TASK-145
  revision 2 fixed that generic reconciliation defect and source 49ad4d7 was reviewed
  and published. Python Agent must now certify that the existing repository-owned
  authoring, PRIMARY, attention, remediation, repair, review and publication bindings
  remain conformant under that exact pin before the pending TASK-215 REPAIR can resume.
  Because TASK-207 already owns downstream-conformance semantics, the correct
  continuation is revision 5 of TASK-207, not a new conformance task.

assumptions:
  - Canonical Python Agent main at authoring is ada9a4e5b765a7daa4e081db1d56917410a73873, the exact TASK-218 reviewed source candidate published to main.
  - The sole active AIOS-renew dependency and worker provenance authority are exactly 49ad4d7a1e57a4c25ba44e60589d8320cb0f57b2 under EXACT_REVIEWED_SOURCE_PUBLISHED_ONLY.
  - TASK-218 / RUN-218-001 / REVIEW-218-001 are completed migration lineage; RUN-218-001 passed 225 focused downstream tests and git diff --check before source publication.
  - TASK-207 revision 4 and .ai/aios-conformance-state.yaml remain valid historical certification evidence only for c96eb8b52acd865b9453409e6598e08a8bd4e48e after TASK-218 publication.
  - All existing Phase-1/Phase-2 repository binding files remained unchanged by TASK-218; only the exact package/runtime pin and planning/provenance state changed.
  - P7.3 remains the unique product NEXT. TASK-215 revision 1 remains product_done=false and the exact preserved continuation is RUN-215-003 with failed_head_sha 75cbd814bf5e687c71015dfdce4e5d8a715009c5 and REPAIR-215-002 authorization 69b04072dce87c7815afdfea863cb60fde119cbf.
  - No RUN-215-004 exists and no TASK-215 implementation, review, repair, integration or publication is authorized inside this conformance task.
  - Mutable upstream AIOS-renew main is not downstream authority; only the checked-in exact pin is relevant.

