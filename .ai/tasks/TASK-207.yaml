non_goals:
  - >
    Modify any Phase-1/Phase-2 workflow, policy, bootstrap, local Human-facing worker,
    AIOS-renew pin, Runtime, Reviewer, Publisher, product/domain source, or execution adapter.
    A live defect in those surfaces blocks certification and requires separate authorized work.
  - >
    Modify or reinterpret TASK-207 revision-1/revision-2 history, RUN-207-001/RUN-207-002,
    REPAIR-207-001, TASK-208/TASK-209 lineage, or any immutable evidence/review artifact.
  - >
    Treat old-pin live evidence as new-pin certification merely because repository bindings are
    similar. Evidence may be reused only where the changed pin is not material to the claim.
  - >
    Fix D1, D2, or D3 in this task.
  - >
    Manufacture a semantic CHANGES_REQUIRED finding, deliberately break implementation,
    deliberately fail verification, or create coding mutation merely to demonstrate
    REMEDIATION or REPAIR.
  - >
    Claim that a GitHub carrier receipt by itself proves RUN, verification, review,
    publication, or semantic correctness. Evidence must remain typed to the authority it proves.
  - >
    Replace exact-pin semantics with local conformance logic, add a generic router, retry loop,
    fallback loop, poller, daemon, broker, database, background model call, or duplicate journal.
  - >
    Draft or rebuild the durable ChatGPT Project Contract in this task.
    PROJECT_CONTRACT_REBUILD remains the next separate milestone after reviewed publication.
  - >
    Change Manifesto, Constitution, Product Contract, Product Intelligence, Commerce
    Intelligence, marketplace/browser/provider behavior, scoring/ranking, persistence,
    retrieval/RAG, product truth, or product-roadmap semantics.
  - >
    Push, force-publish, or mutate canonical main from Executor implementation execution.

constraints:
  hard:
    - >
      This TASK-207 revision 3 must itself be delivered through the published
      [AIOS BRAIN INGRESS] GitHub Issue carrier by authorized actor trung-via against expected
      predecessor main ed10b28e068d662e8dd70c8a38af2b0da19fcf65. Local file/stdin ingress may
      be used only as recovery if the live carrier is demonstrably unavailable; fallback cannot
      satisfy AC1 until the live carrier is separately proven.
    - >
      TASK-207 PRIMARY execution must use a fresh authorized [AIOS BRAIN WAKEUP] request with
      one explicit Human-selected Executor and a new stable dispatch_id distinct from all prior
      TASK-207/TASK-208/TASK-209 dispatch identities. The job must run on
      [self-hosted, windows, x64, python-complete-agent], use only vars.AIOS_REPO_ROOT for the
      persistent repository, and reach the exact pinned A1/A2/Runtime path without local
      Human-surface substitution.
    - >
      Live PRIMARY evidence must bind the carrier request, A2 durable dispatch identity,
      canonical RUN, TASK-207 revision 3, selected Executor, exact downstream pin
      91a177d5b96b2197a4d8223dbb727dda6201cb64, candidate SHA, canonical verification
      evidence, and terminal RESULT or FAILURE. Duplicate immutable dispatch delivery must not
      produce a second execution.
    - >
      After TASK-207 revision-3 terminalization, the published TASK-113/TASK-118
      terminal-attention path must create or idempotently reuse one strict
      [AIOS TERMINAL ATTENTION] Issue tied to canonical terminal truth. Attention remains
      notification only and acquires no review, correction, execution, or publication authority.
    - >
      Review-to-Publication transport evidence already established by the immediately preceding
      TASK-209 SUBMIT_REVIEW and safe source publication remains reusable because TASK-207
      revision 3 cannot modify that transport. The TASK-207 source candidate must nevertheless
      encode that conformance certification is effective only after its own semantic PASS is
      canonicalized through [AIOS BRAIN INGRESS] and the safe Publisher independently publishes
      exactly the reviewed candidate. A Reviewer PASS is authorization to publish the candidate,
      not a claim that publication has already occurred.
    - >
      REMEDIATION conformance must be freshly live-proven under the new exact pin through the
      published GitHub admission boundary and fixed self-hosted remediation workflow/bootstrap
      using selectors that cannot authorize coding mutation. Expected stale, missing, or
      conflicting authority must fail closed. The probe must not create a new implementation RUN
      merely for demonstration.
    - >
      REPAIR conformance must be freshly live-proven under the new exact pin through the
      published GitHub admission boundary and fixed self-hosted REPAIR workflow/bootstrap using
      selectors that cannot authorize coding mutation. A NO_CHANGE-shaped non-authorizing probe
      carries no coding Executor. Expected stale, missing, or conflicting authority must fail
      closed and must not create a new implementation RUN unless a real TASK-207 failure
      independently requires canonical REPAIR.
    - >
      If a real TASK-207 failure naturally occurs and canonical state selects REPAIR, use the
      dedicated Phase-2 REPAIR carrier as the normal recovery surface. If D2 recurs after tests
      complete, preserve the exact candidate; materially change only the temp prerequisite and
      continue through canonical NO_CHANGE reuse. Do not mutate implementation merely to evade
      cleanup and do not rerun unchanged verification for ceremony.
    - >
      If semantic review naturally returns CHANGES_REQUIRED, use the Phase-2 Human remediation
      intent carrier with the exact finding and explicit Human-selected Executor. Do not create
      a finding merely to exercise the carrier.
    - >
      Add .ai/aios-conformance-state.yaml as a small Brain/review certification record, not a
      second Runtime truth store. It must identify TASK-207 revision 3, exact downstream pin
      91a177d5b96b2197a4d8223dbb727dda6201cb64, Phase-1 and Phase-2 binding families under
      certification, the live evidence selectors used for AC1-AC6, and state that certification
      becomes effective only on reviewed source publication. It must not copy tokens, raw logs,
      transient runner paths, secrets, or mutable external state.
    - >
      Reconcile .ai/aios-adoption-state.yaml only to record full downstream conformance as
      certified by reviewed TASK-207 revision-3 publication. Preserve the exact pin, capability
      ownership, prior provenance, and ACTIVE/NOT_REQUIRED binding classifications.
    - >
      Reconcile .ai/roadmap-state.yaml so FULL_AIOS_DOWNSTREAM_CONFORMANCE becomes DONE through
      TASK-207 revision 3 and PROJECT_CONTRACT_REBUILD becomes the unique NEXT commitment only
      when the revision-3 certification source is reviewed and published. Preserve TASK-191
      product checkpoint, TASK-204/TASK-205/TASK-206/TASK-208/TASK-209 provenance, later
      Governance-closure/P7 ordering, and do not claim Project Contract rebuild or Governance
      closure completion.
    - >
      Documentation may describe the certified normal surfaces and bounded fallback posture only
      as publication-gated TASK-207 revision-3 state. Local file/stdin ingress, Human-facing
      worker, and direct operator paths remain emergency/debug fallbacks and do not compete with
      normal repository bindings.
    - >
      Runtime verification for source changes remains deterministic, offline, non-interactive,
      and independent of GitHub, provider/LLM, live runner state, marketplace/browser/CDP,
      Drive, wall clock, random/UUID, or mutable external state. Live conformance evidence is
      evaluated separately by the semantic Reviewer.
    - >
      Semantic Reviewer must not PASS TASK-207 solely because deterministic tests pass. Missing
      or ambiguous fresh new-pin live evidence for AC1, AC2, AC3, AC5, or AC6 is BLOCKED or
      CHANGES_REQUIRED as appropriate. Valid unchanged evidence may be reused only when the
      supporting state has not been invalidated by TASK-209 or later canonical movement.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      TASK-207 revision 3 is canonically authored through one authorized live
      [AIOS BRAIN INGRESS] Issue against predecessor main
      ed10b28e068d662e8dd70c8a38af2b0da19fcf65, with bounded PASS receipt and exact canonical
      revision/source commit; no local ingress is needed for the successful proof.
  - id: AC2
    condition: >
      One fresh authorized live [AIOS BRAIN WAKEUP] request executes TASK-207 revision 3
      PRIMARY through the dedicated Python Agent self-hosted runner and exact pinned
      A1/A2/Runtime path under pin 91a177d5b96b2197a4d8223dbb727dda6201cb64, producing one
      canonical RUN with correct dispatch identity, explicit Executor, candidate, verification
      lineage, and immutable duplicate-delivery protection.
  - id: AC3
    condition: >
      TASK-207 revision-3 terminalization creates or idempotently reuses the correct
      [AIOS TERMINAL ATTENTION] Issue from canonical terminal truth through the TASK-118-hardened
      exact-pin downstream path, while attention acquires no review, correction, execution, or
      publication authority.
  - id: AC4
    condition: >
      Review-to-Publication transport has valid current live evidence from TASK-209 and remains
      unchanged by this task; the TASK-207 revision-3 candidate truthfully gates conformance
      effectiveness on its own canonical semantic PASS plus safe publication of exactly the
      reviewed candidate. After PASS, main must equal that candidate before conformance state is
      treated as effective.
  - id: AC5
    condition: >
      REMEDIATION carrier and self-hosted bootstrap are freshly live-proven under the new exact
      pin as reachable, bounded, and fail closed on a non-authorizing probe, with explicit
      Executor framing where applicable, no raw-Issue execution, no token crossing into coding
      execution, and no new implementation RUN caused solely by the probe.
  - id: AC6
    condition: >
      REPAIR carrier and self-hosted bootstrap are freshly live-proven under the new exact pin as
      reachable, bounded, and fail closed on a non-authorizing probe; NO_CHANGE framing carries
      no coding Executor, and no new implementation RUN is caused solely by the probe unless a
      real TASK-207 failure independently requires canonical REPAIR.
  - id: AC7
    condition: >
      Exact pin isolation at 91a177d5b96b2197a4d8223dbb727dda6201cb64,
      one-capability-one-authority, separate Brain/Runtime/Executor/Reviewer/Publisher/A3/A6/
      REPAIR/Attention boundaries, Phase-1/Phase-2 source bindings, and local emergency/debug
      fallbacks remain intact with no duplicate lifecycle implementation.
  - id: AC8
    condition: >
      Conformance/adoption state truthfully records certification as effective only on reviewed
      TASK-207 revision-3 publication; roadmap marks FULL_AIOS_DOWNSTREAM_CONFORMANCE DONE and
      makes PROJECT_CONTRACT_REBUILD the sole NEXT item without claiming that the replacement
      Project Contract exists or is approved.
  - id: AC9
    condition: >
      All source changes stay inside authorized files, deterministic focused tests and
      git diff --check pass, RESULT has zero unresolved source items, and Reviewer separately
      observes sufficient typed live evidence for AC1-AC6 before issuing a PASS candidate.

