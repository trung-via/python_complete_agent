task_id: TASK-139
revision: 1

goal: >
  Implement post-M4 P3.1 Family Review Planning as one bounded deterministic application
  composition boundary over the already-published P2 and M3 authorities. The operation
  must accept exactly one existing TASK-138 SourceEvidenceInventory, pass its exact typed
  ProductSourcePack tuple once through TASK-109 multi-observation resolution, pass the
  exact resulting graph once through TASK-111 grouping, create TASK-112 family merge
  proposals only for canonical conflict-free POSITIVE_CONNECTED groups, and return one
  immutable lineage-preserving review plan that exposes the exact inventory, graph,
  groups, and actionable proposals for subsequent explicit Human review. TASK-139 must
  not record a Human decision, allocate or accept canonical IDs, admit family/variant
  identities, mutate or persist catalog state, or implement later P3 decision/admission
  behavior.

problem: >
  TASK-138 closed deterministic local evidence intake and now returns aligned exact
  manifest paths plus typed ProductSourcePack values. M3 already owns pairwise/multi-
  observation resolution, provisional family grouping, evidence-complete family merge
  proposals, explicit Human decisions, canonical family/variant admission, catalog
  integrity, and SQLite durability. What remains missing at the start of P3 is a narrow
  application boundary that composes the first three review-preparation authorities so a
  caller does not have to manually reproduce resolve -> group -> proposal call ordering
  or accidentally hide SINGLETON/CONFLICTED groups. This task must close only that
  planning gap. Human decision capture and durable canonical admission remain separate
  later P3 boundaries because combining them here would collapse established M3
  authorities and would require identity/persistence inputs that are intentionally absent
  from TASK-139.

assumptions:
  - >
    Canonical Python Agent main immediately before TASK-139 authoring is
    ffbaa7584dc0d41cd03ace2d8706e0fec992fa66, the published TASK-138 final source
    candidate after REVIEW-138-002 DELTA PASS.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@67db82bf19d63f25721d06aabb82d850db8b78d4.
  - >
    docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md is canonical: P1 and P2 are closed and
    P3 Human-Governed Knowledge Update Workflow is the current architecture boundary.
  - >
    TASK-138 SourceEvidenceInventory remains the sole P2 aligned local evidence-inventory
    value. TASK-139 may consume its source_packs tuple unchanged but must not rediscover
    manifests, deserialize source_pack.json, or create another intake representation.
  - >
    TASK-109 resolve_multi_observations remains the sole bounded multi-observation graph
    authority; TASK-111 group_resolution_graph remains the sole provisional family-
    grouping authority; TASK-112 create_family_merge_proposal remains the sole evidence-
    complete family proposal authority and explicit Human family decision authority.
  - >
    TASK-114 remains canonical family admission from explicit Human APPROVE plus explicit
    caller-supplied opaque family_id. TASK-115/116/117 remain sellable-variant evidence,
    proposal/Human-decision, and canonical-variant admission authorities respectively.
    TASK-118/119/120 remain catalog integrity, canonical catalog bytes, and SQLite
    durability authorities respectively.
  - >
    Family/variant ID allocation, identity evolution or membership extension, conflict
    adjudication, product-truth reconciliation, automatic merge/approval, and variant
    auto-discovery remain deferred and must not be smuggled into P3.1.

