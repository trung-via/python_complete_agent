    next distinct semantic milestone after this reconciliation is reviewed and
    source-published.
  - >
    Modify .ai/aios-adoption-state.yaml, the AIOS dependency pin, Brain ingress
    carrier, Human worker surfaces, Runtime, Unified State, Executor selection,
    remediation/repair semantics, publication workflow, or upstream AIOS-renew.
  - >
