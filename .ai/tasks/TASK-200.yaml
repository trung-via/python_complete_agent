    evidence, identity, persistence, retrieval/RAG, grounded-answer semantics,
    product truth, hypothesis/intelligence behavior, outcome/learning behavior,
    marketplace/browser/session behavior, provider/model behavior, Media
    Intelligence, Distribution Intelligence, Commerce Operations, or any commerce
    capability.
  - >
    Add a planner, governance runtime, daemon, automatic roadmap advancement,
    second lifecycle reducer, retry, reroute, autonomous mutation mechanism, or
    new authority.
  - >
    Push, publish, merge, or mutate canonical main from Executor implementation.

