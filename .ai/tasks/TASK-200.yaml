  TASK-199 established the canonical Python Agent Product Contract at exact source
  702e85e9e77a556f3716717ccaa186919b1a9dab. RUN-199-001 verified the candidate,
  REVIEW-199-001 returned PRIMARY PASS with AC1-AC10 PASS and no findings, and the
