    docs/PYTHON_AGENT_PRODUCT_CONTRACT.md are canonical Governance Foundation
    layers WHY, highest enforceable governance, and WHAT respectively.
  - >
    .ai/roadmap-state.yaml remains Brain-owned non-engineering planning state and
    currently records PYTHON_AGENT_PRODUCT_CONTRACT as unique NEXT, with
    CHATGPT_PROJECT_CONTRACT_RECONCILIATION still NOT_DONE.
  - >
    TASK-198 recovery remains complete. The sole active downstream AIOS authority
    remains a3b723b49cd65677f548c5694a52a6fc006a9e2a and is not modified by
    this reconciliation.
  - >
