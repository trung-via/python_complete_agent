task_id: TASK-101
revision: 1

goal: >
  Synchronize the Python Agent repository-owned AIOS worker control plane
  from the previously pinned AIOS-renew v0.1.3 commit
  6e2fab2cb1fc32e2002d41f3d21e4019a8844e1a
  to the reviewed and published UTF-8-capable AIOS-renew kernel commit
  f68ea27583ec6dcd4324e77d6b29a36a246be745,
  so future RUN, REMEDIATE, and STATUS invocations use the corrected
  deterministic Windows verification-output boundary.

problem: >
  The Python Agent worker surface still declares and installs AIOS-renew
  commit 6e2fab2cb1fc32e2002d41f3d21e4019a8844e1a.
  AIOS-renew TASK-034 has since published the Windows verification UTF-8
  boundary repair at commit
  f68ea27583ec6dcd4324e77d6b29a36a246be745.
  Therefore the repository declaration and dedicated worker runtime are
  stale relative to the required canonical kernel.

assumptions:
  - AIOS-renew commit f68ea27583ec6dcd4324e77d6b29a36a246be745
    is already reviewed and published.
  - The current Python Agent canonical main is
    7d03d0d2fe1d7d4b9897b308157eef769954dae8.
  - The failed TASK-100 implementation is intentionally preserved outside
    canonical main and must not be incorporated by this task.
  - Product Intelligence behavior must remain unchanged.
  - The repository-owned worker launcher remains the single supported
    control surface for RUN, REMEDIATE, and STATUS.

scope:
  inspect:
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-renew-worker.md
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - tests/aios_bridge/test_aios_worker_control_surface.py
  modify:
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - tests/aios_bridge/test_aios_worker_control_surface.py

non_goals:
  - Do not modify Product Intelligence implementation or tests.
  - Do not modify TASK-100 or any TASK-100 artifact.
  - Do not cherry-pick, merge, or otherwise incorporate
    preserve/TASK-100-failed.
  - Do not modify AIOS-renew source code.
  - Do not change executor semantics.
  - Do not redesign the worker control plane.
  - Do not add retry, fallback, reroute, or alternate execution paths.
  - Do not weaken semantic-review-before-publication behavior.
  - Do not change public Product Intelligence behavior.

constraints:
  hard:
    - Pin AIOS-renew exactly to commit
      f68ea27583ec6dcd4324e77d6b29a36a246be745.
    - The repository declaration and launcher authoritative commit must agree.
    - The launcher must deterministically recognize an existing dedicated
      runtime installed from an older AIOS-renew commit as stale and bring
      that runtime to the exact declared commit before invoking the worker.
    - Runtime provenance must remain inspectable through installed package
      metadata/direct_url.json.
    - RUN, REMEDIATE, and STATUS must continue through the same repository-owned
      launcher and dedicated runtime.
    - Do not hard-code a second competing AIOS-renew source of truth.
    - Preserve fail-closed behavior.
    - Preserve review-before-publication.
    - Do not push from the executor phase.

acceptance:
  - id: AC1
    condition: >
      requirements-aios-renew.txt pins AIOS-renew exactly to
      f68ea27583ec6dcd4324e77d6b29a36a246be745.

  - id: AC2
    condition: >
      aios_worker.py uses the same exact canonical AIOS-renew commit as its
      authoritative required kernel identity, with no stale
      6e2fab2cb1fc32e2002d41f3d21e4019a8844e1a control-plane pin remaining.

  - id: AC3
    condition: >
      The worker launcher deterministically detects a dedicated runtime whose
      installed AIOS-renew provenance differs from the declared target and
      synchronizes it to the exact declared commit before worker execution.

  - id: AC4
    condition: >
      Regression tests prove both already-synchronized and stale-runtime paths,
      including exact target SHA/provenance behavior, without network-dependent
      test behavior.

  - id: AC5
    condition: >
      Existing RUN, REMEDIATE, STATUS, executor selection, semantic review
      boundary, and publication boundary behavior remain unchanged.

  - id: AC6
    condition: >
      No Product Intelligence files, TASK-100 artifacts, or preserved failed
      TASK-100 implementation are modified or incorporated.

verification:
  required:
    - '$env:PYTHONPATH = ".;src"; pytest tests/aios_bridge/test_aios_worker_control_surface.py -q'
    - 'git diff --check'
    - 'git status --porcelain'
