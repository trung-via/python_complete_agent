non_goals:
  - Modify PlaywrightBrowserManager, PlaywrightBrowserSession, BrowserSession, BrowserConfig,
    CDP endpoint selection, context/page ownership, page creation, reconnect/restart, browser pool,
    profile handling, cookie APIs, or TASK-137 semantics.
  - Modify Shopee/TikTok discovery adapters, DiscoveryRequest, DiscoveryBatch, orchestration,
    CandidateRanker, WinningProductScorer, scoring policy, shortlist ordering, search URL behavior,
    same-page readiness, CAPTCHA detection, or TASK-146/TASK-151 semantics.
  - Modify ShopeeScrapeTool, ShopeeSourceExtractor, ProductSourcePack model/serialization,
    media download/provenance, Google Drive production behavior, extraction readiness, block
    detection, or TASK-162 semantics.
  - Automate login, solve or bypass CAPTCHA, inject CAPTCHA tokens, use stealth, proxy rotation,
    fingerprint spoofing, anti-bot circumvention, alternate HTTP/API scraping, retry loops,
    browser restart, alternate marketplace, alternate query, or rerouting.
  - Keep an AIOS executor process blocked waiting for Human interaction, add unbounded sleeps,
    poll indefinitely for challenge completion, or make Runtime verification depend on live
    Shopee/CDP/browser state.
  - Commit capture outputs, downloaded media, source_pack.json, checkpoint files, cookies,
    credentials, raw HTML, screenshots, browser profiles, local absolute paths, or runtime logs to
    the repository as part of TASK-166.
  - Complete TASK-165, repair its fixtures, compute P6.1b metrics, change TASK-164 evaluator,
    introduce semantic/vector retrieval, or authorize P6.2.
  - Add a second Product Intelligence executable, web API, MCP server, plugin, service, watcher,
    scheduler, daemon, queue consumer, or persistent database authority.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Add exactly one production composition module src/product_intelligence/live_capture.py.
      It is the sole new authority introduced by TASK-166 and owns only resumable operational
      sequencing/checkpoint state for bounded live Shopee capture. It must compose existing browser,
      discovery/ranking, and ShopeeScrapeTool authorities rather than reimplementing any of them.
    - >
      Define one explicit capture state machine whose externally observable statuses are exactly
      RUNNING, CHALLENGE_REQUIRED, READY, and FAILED. Its resumable phases are exactly DISCOVERY,
      ACQUIRE_1, ACQUIRE_2, and COMPLETE for each Human query. A fresh capture job advances queries
      in caller order. A checkpoint must preserve the exact current query index, phase, previously
      selected candidate identity/URL when selection already occurred, and exact completed
      observation manifest references so resume never repeats an already-successful acquisition.
    - >
      A live capture job is Shopee-only in TASK-166. Fresh capture accepts one or more exact Human
      query strings in caller order and one exact CDP endpoint. Queries must be non-empty,
      single-line strings and are forwarded unchanged. Do not translate, normalize, expand,
      reorder, dedupe, replace, or select easier queries.
    - >
      For each query, construct one existing DiscoveryRequest with max_pages=1 and
      max_candidates<=20, one existing ShopeeDiscoveryAdapter using the exact shared browser
      manager, one PlatformDiscoveryPlan, and call existing orchestrate_discovery exactly once per
      successful DISCOVERY phase with shortlist_size<=3. Select the first ranked shortlist candidate
      whose exact candidate URL is not already selected by an earlier query in the same job; do not
      inspect score magnitude, DecisionBand, price, sales, rating, confidence, or retrieval results
      to choose. If no distinct candidate exists, fail closed rather than alter queries or rediscover
      automatically.
    - >
      Use exactly one PlaywrightBrowserManager per capture invocation, constructed with the exact
      requested CDP endpoint, and reuse that exact manager for all discovery and acquisition work
      performed during that invocation. Always attempt manager.close_all() exactly once before the
      invocation returns or raises. TASK-137 borrowed-resource semantics must ensure this disconnects
      Python Agent resources without closing the operator-owned Chromium/context/page.
    - >
      Use exactly one ShopeeScrapeTool instance per capture invocation. For each selected candidate,
      perform exactly two planned successful acquisitions in order, represented by ACQUIRE_1 and
      ACQUIRE_2. Use deterministic capture-local call_id/run_id strings derived only from the query
      position and observation position; do not use random/UUID/clock values for job identity.
      Completed ACQUIRE_1 must never be repeated after a later ACQUIRE_2 challenge or process restart.
    - >
      ShopeeScrapeTool requires a Drive dependency, but TASK-166 capture is local evidence staging.
      live_capture.py may define one private minimal zero-network capture sink implementing only the
      synchronous get_or_create_folder(name, parent_id=None) and upload_file(file_path, folder_id=None)
      methods required by the existing tool. It must perform no network/auth/environment work, no
      independent evidence transformation, and may only return deterministic truthy placeholders so
      the existing scraper can persist its exact local source_pack.json and media bytes under the
      capture job root. This sink is not a production Drive authority and must not be exported.
    - >
      The capture job root is explicit Human input and must resolve outside the Git repository root.
      Reject repository-root or repository-descendant job roots before browser/network work so a
      challenge or canceled capture can never dirty the engineering worktree. All checkpoint,
      capture media, source packs, and bundle artifacts must remain beneath that explicit external
      job root; reject path escapes and symlink escapes.
    - >
      Persist one UTF-8 capture_checkpoint.json beneath the external job root using atomic
      replace semantics. The checkpoint schema and version are fixed by TASK-166 and must contain
      only bounded operational state: schema/version, status, exact query sequence, current query
      position, current phase, completed cohort records, selected candidate_id/product URL/title
      fields already returned by existing discovery, relative observation manifest paths, manifest
      SHA-256 values, and one bounded challenge/error category. Never persist cookies, headers,
      tokens, raw HTML/page text, screenshots, browser profile paths, exception tracebacks, or local
      absolute paths.
    - >
      Catch only canonical challenge signals for resumable handling: DiscoveryBlockedError during
      DISCOVERY and ShopeeScrapeTool ToolResult failure whose exact error code is EXTRACTION_BLOCKED
      during acquisition. On either signal, atomically write status CHALLENGE_REQUIRED at the exact
      unfinished phase, perform no automatic retry, no second navigation, no alternate query, and
      return a normal capture outcome rather than raising an engineering failure. The Human remains
      solely responsible for solving the challenge in the operator-owned browser before explicitly
      invoking resume.
    - >
      Resume must require an existing valid CHALLENGE_REQUIRED checkpoint and must use its exact
      frozen queries/progress rather than accepting replacement queries. Resume reattaches through
      a new invocation's single TASK-137 manager and continues only the exact unfinished phase.
      If the marketplace still reports a challenge, return CHALLENGE_REQUIRED again without
      corrupting or advancing checkpoint state. Resume may never repeat completed discovery after a
      selected candidate is already checkpointed, and may never repeat a completed acquisition.
    - >
      Non-challenge discovery/navigation/orchestration failures, empty shortlist, no distinct
      candidate, extraction-empty, download/upload/partial failures, invalid ToolResult, invalid
      manifest path, checkpoint corruption, path escape, or inconsistent resume state must fail
      closed as LiveCaptureError, persist bounded FAILED state when a checkpoint has already been
      initialized, and must not be reclassified as Human-solvable challenge.
    - >
      After every acquisition success, require ToolStatus.SUCCESS, error is None, and exactly one
      existing source_pack.json manifest path beneath that observation's capture output directory.
      Compute SHA-256 from the exact persisted manifest bytes without parsing, rewriting, or
      normalizing them. Store only a job-root-relative manifest path and digest in checkpoint state.
      Do not mutate observed_at or any ProductSourcePack field to force identity distinctness.
    - >
      When all queries have two successful observations, atomically write one immutable
      capture_bundle.json beneath the external job root and set status READY. The bundle must use
      fixed schema "product_intelligence_live_capture_bundle", version 1, preserve exact query order,
      selected candidate provenance, two ordered manifest-relative paths and SHA-256 values per
      cohort, and no absolute paths or sensitive browser/session data. Once READY, subsequent resume
      attempts must be rejected; TASK-166 does not import the bundle into Git.
    - >
      Extend the existing Product Intelligence CLI with exactly one new `capture` operation; do not
      create a second CLI. Fresh mode requires --job-root, --cdp-endpoint, and one-or-more repeated
      --query values. Resume mode is selected by exact --resume, requires --job-root and
      --cdp-endpoint, and forbids --query so checkpoint state is authoritative. No platform,
      shortlist, retry, wait, CAPTCHA, cookie, profile, Drive, browser-type, or ranking controls may
      be exposed. Existing commands and their behavior remain unchanged.
    - >
      CLI capture success must emit exactly one JSON stdout document. READY and
      CHALLENGE_REQUIRED are both valid operational outcomes with exit code 0 and must expose only
      bounded status, job-root-independent phase/query-position information, and relative bundle or
      checkpoint filenames. FAILED/non-challenge application errors use existing sanitized exit-1
      handling with no traceback/cause chain. Argparse misuse remains exit 2. Never print product
      URLs, cookies, raw marketplace text, local absolute paths, or source-pack contents to stdout or
      stderr from the capture command.
    - >
      TASK-166 verification is fully offline. Tests must inject deterministic fake browser manager,
      orchestration, adapter/tool outcomes, filesystem manifests, and zero-network sink boundaries.
      No test may connect to Chrome 9222, Shopee, TikTok, Google Drive, provider APIs, or any external
      network; no test may require Human interaction or real sleep.
    - >
      Focused tests must prove at minimum: fresh ordered multi-query capture; one manager/tool per
      invocation; exact one discovery per successfully completed DISCOVERY phase; DISCOVERY challenge
      checkpoint without exception; ACQUIRE_1 challenge checkpoint; ACQUIRE_2 challenge after a
      completed first observation; resume from each phase without repeating completed work; repeated
      challenge leaves the same unfinished phase; non-challenge failures are terminal; external-root
      enforcement; path/symlink escape rejection; exact manifest SHA-256 preservation; atomic
      checkpoint replacement behavior; READY bundle immutability; zero sensitive/absolute-path data
      in checkpoint/bundle/CLI output; and unchanged existing CLI/discovery/scraper/CDP regressions.
    - >
      Add docs/PHASE_6_P6_1_LIVE_CAPTURE_CHECKPOINT.md documenting the operational boundary:
      AIOS engineering RUNs remain deterministic/offline; live capture is an explicit Product
      Intelligence operation outside AIOS verification; CAPTCHA remains Human-owned; challenge means
      checkpoint-and-resume rather than automatic solving or engineering failure; capture artifacts
      remain outside the repo; and a fresh P6.1b successor may consume a reviewed immutable bundle
      only after TASK-166 publication.
    - >
      Update both P6 roadmaps consistently. Record TASK-165 as unpublished P6.1b blocked evidence,
      with REVIEW-165-003 F1 and subsequent failed remediation/repair lineage demonstrating that
      implementation-time live capture inside an AIOS RUN is the wrong operational boundary. Record
      TASK-166 as the CURRENT blocker-hardening gate. P6.1b remains open and a fresh successor is NEXT
      only after TASK-166 Runtime PASS, semantic PASS, publication, and one READY external capture
      bundle. P6.2 remains blocked until reviewed empirical P6.1b metrics exist.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      TASK-166 introduces only one new live_capture composition authority plus one `capture` operation
      on the existing Product Intelligence CLI; TASK-137 browser lifecycle, TASK-146 discovery/ranking,
      TASK-151 readiness, TASK-162 extraction, ShopeeScrapeTool, ProductSourcePack, and TASK-164
      evaluator semantics remain unchanged.
  - id: AC2
    condition: >
      Fresh capture validates an external non-repository job root and exact ordered Human queries
      before live work, constructs exactly one existing CDP manager and one ShopeeScrapeTool per
      invocation, and composes the existing discovery/orchestration path exactly once per completed
      DISCOVERY phase without local ranking or alternate-query behavior.
  - id: AC3
    condition: >
      DiscoveryBlockedError and exact EXTRACTION_BLOCKED ToolResult are converted only into
      CHALLENGE_REQUIRED checkpoint outcomes at the exact unfinished phase, with no automatic retry,
      challenge solving, alternate navigation, or AIOS/runtime coupling.
  - id: AC4
    condition: >
      Resume consumes only an existing valid CHALLENGE_REQUIRED checkpoint, preserves exact queries
      and selected-candidate/progress state, continues only the unfinished phase, and never repeats a
      completed acquisition or completed discovery with an already-selected candidate.
  - id: AC5
    condition: >
      All non-challenge failure classes remain fail-closed terminal LiveCaptureError/FAILED outcomes
      and are never reclassified as resumable Human challenge.
  - id: AC6
    condition: >
      Every successful observation records exactly one existing manifest beneath the external job
      root and preserves its exact bytes by relative path plus SHA-256 only, with no ProductSourcePack
      field mutation, no repo-local capture output, and no path/symlink escape.
  - id: AC7
    condition: >
      Completion produces one immutable READY capture_bundle.json with fixed schema/version,
      caller-order cohorts, selected-candidate provenance, two ordered manifest references/digests per
      query, no sensitive/session data or absolute paths, and no automatic Git import.
  - id: AC8
    condition: >
      Existing CLI gains only `capture`; fresh/resume argument contracts are exact, READY and
      CHALLENGE_REQUIRED return one bounded JSON document with exit 0, application failures remain
      sanitized exit 1, syntax failures exit 2, and all prior CLI commands remain unchanged.
  - id: AC9
    condition: >
      Deterministic offline tests prove fresh capture, checkpoint/resume across DISCOVERY/ACQUIRE_1/
      ACQUIRE_2, repeated challenge stability, exact no-repeat continuity, root/path safety, exact
      manifest digests, bundle immutability, one-manager/tool cleanup semantics, and zero live network,
      browser, Drive, provider, Human wait, or real sleep.
  - id: AC10
    condition: >
      Documentation and roadmaps explicitly separate live capture from AIOS engineering verification,
      record TASK-165 as blocked/unpublished evidence, TASK-166 as the blocker correction, fresh P6.1b
      successor only after a READY external bundle, and P6.2 still blocked pending reviewed metrics.

