task_id: TASK-166
revision: 2

goal: >
  Remove the live-marketplace bottleneck exposed while implementing P6.1b by adding one
  repository-owned, resumable Shopee live-capture composition boundary above the existing
  TASK-137 CDP browser lifecycle, TASK-146 discovery/ranking path, and ShopeeScrapeTool.
  A detected Shopee CAPTCHA/challenge becomes an explicit CHALLENGE_REQUIRED checkpoint
  that preserves completed capture progress outside the repository and can be resumed by the
  Human after solving the challenge in the operator-owned Chrome session, instead of turning
  the surrounding AIOS engineering RUN into a live-interaction failure. TASK-166 must not
  automate login, solve or bypass CAPTCHA, create a second browser/discovery/scraper authority,
  or perform live marketplace work during its own Runtime verification.

problem: >
  TASK-165 attempted to curate three real Shopee benchmark cohorts from inside one AIOS
  engineering lineage. Semantic review exposed invalid fixture provenance. Subsequent F1 /
  REPAIR continuations still depended on live discovery/acquisition while the Human observed
  that Shopee could log out or present a new CAPTCHA even when Chrome 9222 was already open and
  a prior challenge had been solved. RUN-165-004 and RUN-165-005 then terminated during
  Antigravity execution before Runtime verification, while their failed candidates still did
  not establish acceptable six-observation provenance. Current discovery and extraction
  authorities correctly treat CAPTCHA as fail-closed, and TASK-137 owns only CDP lifecycle;
  no repository-owned operational state can checkpoint a partially completed live capture,
  allow Human challenge resolution, and resume only the unfinished step. Mutable marketplace
  session state therefore became an accidental engineering-run dependency and blocks reliable
  P6.1b evidence curation.

assumptions:
  - >
    Canonical python_complete_agent main immediately before TASK-166 revision 1 authoring was
    be34cdfe2410dbd09753875b8326c6bc16598645, the TASK-165 authoring commit on top of published
    TASK-164 candidate ab80a746329cafa7f3cd316fb140c392644f3267. Revision 2 reconciles the
    TASK-166 contract before any TASK-166 RUN. TASK-165 remains unpublished and blocked; its
    REVIEW-165-003 F1 and failed remediation/repair lineage remain preserved evidence.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@32ace104c5cfaa1b7affbaa40157872b1f85147f.
  - >
    TASK-137 PlaywrightBrowserManager / PlaywrightBrowserSession remain the sole CDP connection,
    browser/session lifecycle, borrowed-resource ownership, and page-selection authority.
  - >
    TASK-146 / M2 remain the sole discovery/orchestration/ranking authority. TASK-151 remains
    Shopee discovery same-page readiness/block authority and DiscoveryBlockedError is the
    canonical discovery challenge signal.
  - >
    ShopeeScrapeTool and ShopeeSourceExtractor remain the deep-acquisition/extraction path.
    TASK-162 remains Shopee product-page readiness/block authority and existing ToolResult error
    code EXTRACTION_BLOCKED is the canonical acquisition challenge signal.
  - >
    The Product Intelligence CLI remains the single Human-facing Python Agent command surface.
    TASK-166 may extend that same CLI with one capture operation but may not create another CLI,
    service, daemon, scheduler, browser worker, or background process authority.
  - >
    TASK-164 remains frozen P6.1a evaluation authority. TASK-166 is a blocker-hardening task;
    it does not complete P6.1b, create benchmark labels, compute retrieval metrics, or authorize
    P6.2.

