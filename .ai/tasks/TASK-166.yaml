non_goals:
  - Modify PlaywrightBrowserManager, PlaywrightBrowserSession, BrowserSession, BrowserConfig,
    CDP attachment/page ownership/page creation/reconnect/restart/profile/cookie semantics, or
    create a second browser authority.
  - Modify Shopee/TikTok discovery adapters, DiscoveryRequest/DiscoveryBatch, orchestration,
    ranking/scoring, shortlist order, selectors, readiness, block detection, or create a second
    discovery/ranking authority.
  - Modify ShopeeScrapeTool, ShopeeSourceExtractor, ProductSourcePack, serialization, media
    provenance/download semantics, production Google Drive behavior, extraction readiness, or
    create a second scraper/evidence authority.
  - Automate login, solve/bypass CAPTCHA, inject tokens, use stealth/proxy/fingerprint spoofing,
    alternate HTTP/API scraping, automatic retry loops, browser restart, alternate marketplace,
    alternate query, or rerouting.
  - Keep an AIOS executor waiting for Human interaction, add unbounded sleeps/polling, or make
    TASK-166 Runtime verification depend on live Shopee/CDP/browser state.
  - Commit capture outputs, media, source packs, checkpoints, bundles, cookies, credentials, raw
    HTML/screenshots/browser profiles/local absolute paths/runtime logs as TASK-166 source delta.
  - Complete or publish TASK-165, repair its fixtures, change TASK-164, compute P6.1b metrics,
    introduce semantic/vector retrieval, or authorize P6.2.
  - Add another Product Intelligence executable, API, MCP server, service, watcher, scheduler,
    daemon, queue consumer, or persistent database authority.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Add exactly one production composition module src/product_intelligence/live_capture.py.
      It is the sole new authority introduced by TASK-166 and owns only bounded resumable live
      capture sequencing/checkpoint state while composing existing browser, discovery/ranking,
      and ShopeeScrapeTool authorities.
    - >
      Define statuses exactly RUNNING, CHALLENGE_REQUIRED, READY, FAILED and resumable phases
      exactly DISCOVERY, ACQUIRE_1, ACQUIRE_2, COMPLETE. Fresh jobs advance exact Human queries
      in caller order. Checkpoint state must preserve exact current query position, current phase,
      selected candidate identity/URL/title when discovery already completed, and completed
      observation manifest references so resume never repeats successful work.
    - >
      TASK-166 capture is Shopee-only. Fresh capture accepts one-or-more exact nonblank single-line
      Human queries in caller order and one exact nonblank CDP endpoint. Queries and endpoint are
      frozen into checkpoint state before browser/network work and are never normalized, rewritten,
      expanded, reordered, deduped, replaced, or inferred.
    - >
      For each DISCOVERY phase construct one existing DiscoveryRequest with max_pages=1 and
      max_candidates<=20, one existing ShopeeDiscoveryAdapter using the invocation's exact shared
      browser manager, one PlatformDiscoveryPlan, and call existing orchestrate_discovery exactly
      once per successfully completed DISCOVERY phase with shortlist_size<=3. Select the first
      ranked shortlist candidate whose exact candidate URL was not selected by an earlier query.
      Never inspect score magnitude, DecisionBand, price, sales, rating, confidence, or retrieval
      results to choose. Empty/no-distinct shortlist fails closed without query change or automatic
      rediscovery.
    - >
      Use exactly one PlaywrightBrowserManager per capture invocation, constructed with the exact
      requested CDP endpoint, and reuse that exact object for all work in that invocation. Always
      attempt manager.close_all() exactly once before return/raise. TASK-137 borrowed-resource
      semantics remain authoritative and operator-owned Chromium/context/page must stay open.
    - >
      Resume requires an existing valid CHALLENGE_REQUIRED checkpoint and the Human must provide
      the exact same CDP endpoint frozen in that checkpoint. Mismatched endpoint fails before browser
      work. Resume accepts no replacement queries and continues only the exact unfinished phase.
      If the challenge remains, return CHALLENGE_REQUIRED again without advancing or corrupting state.
    - >
      Use exactly one ShopeeScrapeTool instance per invocation. For each selected candidate perform
      exactly two planned successful acquisitions in order as ACQUIRE_1 and ACQUIRE_2. Use
      deterministic capture-local call_id/run_id strings derived only from query and observation
      positions; no random/UUID/clock job identifiers. Resume never repeats a completed acquisition.
    - >
      Because ShopeeScrapeTool requires a Drive dependency while capture is local staging,
      live_capture.py may define one private zero-network sink exposing only synchronous
      get_or_create_folder(name, parent_id=None) and upload_file(file_path, folder_id=None). It
      performs no network/auth/environment/independent evidence transformation and returns only
      deterministic truthy placeholders. It is not exported and does not redefine Drive authority.
    - >
      The explicit Human job root must resolve outside the Git repository root. Reject repository
      root/descendants before browser work. All checkpoint, bundle, source pack and media artifacts
      remain beneath the external job root. Reject lexical path escape, resolved path escape and
      symlink escape.
    - >
      Persist exactly one UTF-8 capture_checkpoint.json beneath the job root using atomic
      temp-write plus replace. Its fixed schema/version contains only: status, frozen exact CDP
      endpoint, frozen exact query sequence, current query position/phase, completed cohort records,
      selected candidate_id/product URL/title already returned by existing discovery, relative
      observation manifest paths, exact SHA-256 values, and one bounded challenge/error category.
      Never persist cookies, headers, tokens, raw HTML/page text, screenshots, browser profile paths,
      exception tracebacks, or local absolute paths.
    - >
      Catch only DiscoveryBlockedError during DISCOVERY and ShopeeScrapeTool FAILURE whose exact
      error code is EXTRACTION_BLOCKED during acquisition as resumable challenge signals. On either,
      atomically write CHALLENGE_REQUIRED at the exact unfinished phase, perform no automatic retry,
      second navigation, alternate query or Human wait, and return a normal capture outcome. Human
      remains solely responsible for solving the challenge before explicit resume.
    - >
      Non-challenge discovery/navigation/orchestration failure, empty/no-distinct shortlist,
      extraction-empty, download/upload/partial failure, invalid ToolResult, invalid manifest,
      checkpoint corruption, endpoint mismatch, path escape, or inconsistent resume state fails
      closed as LiveCaptureError. If checkpoint initialization already occurred, persist bounded
      FAILED state; never reclassify these failures as Human-solvable challenge.
    - >
      After each acquisition success require exact ToolStatus.SUCCESS, error is None, and exactly
      one existing source_pack.json beneath that observation output directory. Compute SHA-256 from
      exact persisted bytes without parsing/normalizing/rewriting the manifest. Store only job-root-
      relative path plus digest. Do not mutate observed_at or any ProductSourcePack field.
    - >
      When all queries have two successful observations, create exactly one
      capture_bundle.json with fixed schema "product_intelligence_live_capture_bundle" and version 1,
      preserving exact query order, selected-candidate provenance, and two ordered relative manifest
      paths/SHA-256 values per cohort. Bundle contains no CDP endpoint, absolute paths, credentials or
      session data. Creation is immutable/fail-closed: if capture_bundle.json already exists, do not
      overwrite or rewrite it. Only after successful exclusive bundle creation may checkpoint status
      advance to READY. READY jobs cannot be resumed and TASK-166 performs no Git import.
    - >
      Extend the existing Product Intelligence CLI with exactly one new `capture` operation. Fresh
      mode requires --job-root, --cdp-endpoint, and one-or-more repeated --query. Resume mode is
      exact --resume with --job-root and --cdp-endpoint and forbids --query. No platform, shortlist,
      retry, wait, CAPTCHA, cookie, profile, Drive, browser-type, ranking or bundle-import controls.
      Existing command behavior remains unchanged.
    - >
      CLI READY and CHALLENGE_REQUIRED are valid operational outcomes: exit 0 with exactly one
      bounded JSON stdout document exposing status, phase/query-position information and only
      relative checkpoint/bundle filenames. Never print CDP endpoint, product URL, source-pack
      contents, raw marketplace text or local absolute paths. Non-challenge application errors remain
      sanitized exit 1 without traceback/cause chain; argparse misuse remains exit 2.
    - >
      TASK-166 verification is fully offline. Tests inject deterministic fake manager,
      orchestration/tool outcomes and local manifest bytes; no Chrome 9222, Shopee/TikTok, Google
      Drive, provider API, external network, Human interaction or real sleep is permitted.
    - >
      Focused tests prove: ordered multi-query fresh capture; exact one manager/tool per invocation;
      one discovery per completed DISCOVERY phase; DISCOVERY/ACQUIRE_1/ACQUIRE_2 challenge
      checkpoints; resume without repeated completed work; same-endpoint enforcement; repeated
      challenge stability; terminal non-challenge failures; external-root and symlink/path escape
      rejection; exact manifest digest preservation; atomic checkpoint replacement; existing-bundle
      no-overwrite; READY immutability; no sensitive/absolute-path CLI/checkpoint/bundle leakage; and
      unchanged existing CLI/discovery/scraper/CDP regressions.
    - >
      Add docs/PHASE_6_P6_1_LIVE_CAPTURE_CHECKPOINT.md documenting: AIOS engineering RUNs stay
      deterministic/offline; live capture is explicit Product Intelligence operation outside AIOS
      verification; CAPTCHA remains Human-owned; challenge means checkpoint/resume rather than solve
      or engineering failure; capture artifacts remain external; fresh P6.1b successor may consume a
      reviewed READY bundle only after TASK-166 publication.
    - >
      Update both P6 roadmaps consistently. Record TASK-165 as unpublished P6.1b blocked evidence,
      REVIEW-165-003 F1 plus failed continuation lineage as evidence that live capture inside AIOS is
      the wrong operational boundary, TASK-166 as CURRENT blocker-hardening gate, fresh P6.1b
      successor NEXT only after TASK-166 Runtime PASS + semantic PASS + publication + one READY
      external bundle, and P6.2 still blocked until reviewed empirical P6.1b metrics exist.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      TASK-166 adds only one live_capture composition authority plus one capture operation on the
      existing CLI while TASK-137, TASK-146, TASK-151, TASK-162, ShopeeScrapeTool,
      ProductSourcePack and TASK-164 semantics remain unchanged.
  - id: AC2
    condition: >
      Fresh capture freezes and validates external job root, exact ordered Human queries and exact
      CDP endpoint before live work; each invocation constructs one existing manager and one
      ShopeeScrapeTool and delegates discovery/ranking only through existing orchestration.
  - id: AC3
    condition: >
      DiscoveryBlockedError and exact EXTRACTION_BLOCKED are the only challenge signals and become
      CHALLENGE_REQUIRED at the exact unfinished phase with no automatic retry, Human wait,
      challenge solving, alternate navigation, or AIOS/runtime coupling.
  - id: AC4
    condition: >
      Resume requires the exact checkpoint-frozen CDP endpoint, accepts no replacement queries,
      continues only the unfinished phase, and never repeats completed discovery with a selected
      candidate or any completed acquisition.
  - id: AC5
    condition: >
      All non-challenge failures remain terminal LiveCaptureError/FAILED and are never made resumable.
  - id: AC6
    condition: >
      Successful observations preserve exact serializer-emitted manifest bytes by safe relative path
      plus SHA-256 only, with no source field mutation, repo-local capture output or path escape.
  - id: AC7
    condition: >
      Completion exclusively creates one immutable READY capture_bundle.json with fixed
      schema/version, ordered cohort provenance and two manifest references/digests per query; an
      existing bundle is never overwritten and no automatic Git import occurs.
  - id: AC8
    condition: >
      Existing CLI gains only capture; fresh/resume argument contracts are exact, READY and
      CHALLENGE_REQUIRED emit one bounded JSON document with exit 0, application errors remain
      sanitized exit 1, syntax errors exit 2, and prior commands remain unchanged.
  - id: AC9
    condition: >
      Offline tests prove challenge/resume continuity at every phase, exact no-repeat behavior,
      same-endpoint binding, root/path safety, manifest digests, atomic checkpointing, bundle
      no-overwrite/immutability, cleanup semantics, and zero live browser/network/Drive/provider/
      Human wait/real sleep.
  - id: AC10
    condition: >
      Documentation separates live capture from AIOS verification, records TASK-165 as blocked
      unpublished evidence, TASK-166 as blocker correction, fresh P6.1b successor only after READY
      bundle, and P6.2 still blocked pending reviewed metrics.

