task_id: TASK-166
revision: 1

goal: >
  Remove the live-marketplace bottleneck exposed while implementing P6.1b by adding one
  repository-owned, resumable Shopee live-capture composition boundary above the existing
  TASK-137 CDP browser lifecycle, TASK-146 discovery/ranking path, and ShopeeScrapeTool.
  A detected Shopee CAPTCHA/challenge must become an explicit CHALLENGE_REQUIRED checkpoint
  that preserves completed capture progress outside the repository and can be resumed by the
  Human after solving the challenge in the operator-owned Chrome session, instead of turning
  the surrounding AIOS engineering RUN into a live-interaction failure. TASK-166 must not
  automate login, solve or bypass CAPTCHA, create a second browser/discovery/scraper authority,
  or perform any live marketplace work during its own verification.

problem: >
  TASK-165 attempted to curate three real Shopee benchmark cohorts from inside one AIOS
  engineering lineage. Its review exposed invalid fixture provenance, and subsequent F1 / REPAIR
  continuations repeatedly depended on live discovery/acquisition while the Human observed that
  Shopee could log out or present a new CAPTCHA even when Chrome 9222 was already open and a prior
  challenge had been solved. RUN-165-004 and RUN-165-005 then terminated during Antigravity
  execution before Runtime verification, while their failed candidates still did not establish
  acceptable six-observation provenance. The architecture currently treats Shopee block/CAPTCHA
  as terminal failure inside both discovery and source extraction, and TASK-137 only owns CDP
  attachment/lifecycle; there is no repository-owned operational state that can checkpoint one
  partially completed live capture, let the Human solve the marketplace challenge, and resume the
  exact unfinished step without rerunning the surrounding AIOS TASK. This makes mutable browser
  session state and marketplace anti-bot challenges an accidental engineering-run authority and
  blocks reliable P6.1b evidence curation.

assumptions:
  - >
    Canonical python_complete_agent main immediately before TASK-166 authoring is
    be34cdfe2410dbd09753875b8326c6bc16598645, the TASK-165 authoring commit on top of published
    TASK-164 candidate ab80a746329cafa7f3cd316fb140c392644f3267. TASK-165 remains unpublished
    and blocked; its current review finding F1 plus failed remediation/repair lineage are preserved
    as evidence and must not be rerun or published by TASK-166.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@32ace104c5cfaa1b7affbaa40157872b1f85147f.
  - >
    TASK-137 PlaywrightBrowserManager / PlaywrightBrowserSession remain the sole CDP connection,
    browser/session lifecycle, borrowed-resource ownership, and page-selection authority. TASK-166
    consumes that existing manager and must not modify or duplicate it.
  - >
    TASK-146 / M2 remain the sole discovery/orchestration/ranking authority. ShopeeDiscoveryAdapter
    remains the sole Shopee search-surface implementation. TASK-151 readiness/block handling remains
    inside that adapter and explicit DiscoveryBlockedError remains the canonical discovery challenge
    signal.
  - >
    ShopeeScrapeTool and ShopeeSourceExtractor remain the sole deep-acquisition/extraction path.
    TASK-162 readiness/block handling remains inside ShopeeSourceExtractor, and ShopeeScrapeTool's
    existing ToolResult error code EXTRACTION_BLOCKED remains the canonical acquisition challenge
    signal. ProductSourcePack serialization remains unchanged.
  - >
    The Product Intelligence CLI remains the single Human-facing Python Agent command surface.
    TASK-166 may extend that same CLI with one capture operation but may not create another CLI,
    service, daemon, scheduler, browser worker, or background process authority.
  - >
    P6.1a TASK-164 evaluator remains frozen. P6.1b is still blocked until real evidence can be
    captured reproducibly. TASK-166 is a blocker-hardening task only; it does not itself complete
    TASK-165, create benchmark labels, compute retrieval metrics, or authorize P6.2.

