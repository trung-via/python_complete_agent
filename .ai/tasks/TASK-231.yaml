task_id: TASK-231
revision: 1

goal: >
  Canonicalize the Human-approved architecture and bounded implementation authorization
  for automated public TikTok Shop PDP acquisition after TASK-230. Define the exact
  semantic ownership, evidence boundary, field allowlist, identity gate, ambiguity policy,
  CAPTCHA/access boundary, and post-publication handoff for a later offline-first collector
  implementation, without implementing a collector, acquiring live marketplace evidence,
  changing Product Intelligence models, or authorizing any live pilot, market test, score,
  ranking, approval, or commerce action.

problem: >
  TASK-230 closed the selected /vn/pdp/<slug>/<id> compatibility blocker and returned
  control to HUMAN_BRAIN_PUBLIC_PDP_ACQUISITION_AUTHORIZATION. Canonical Product
  Intelligence already owns ProductCandidateSnapshot and SignalEvidence marketplace
  observation semantics; Product Source Pack separately owns seller facts/media; P7.4
  organizes opaque TikTok Affiliate evidence references; and P7.5 owns VOI planning.
  The repository has no canonical contract defining how a later automated public-PDP
  capability may observe exact-listing price/traction without creating duplicate semantic
  ownership, depending on Affiliate access, coupling to ProductSourcePack/TikTokScrapeTool,
  or silently treating variant/range prices as exact scalar evidence. The Human has now
  approved a contract-first design: establish the acquisition contract and bounded
  implementation authorization first, then implement the collector separately, still
  without live acquisition authority.

assumptions:
  - Canonical main at authoring is 2e9df54916522a50939b98f1130e6d74950018a9.
  - TASK-230 is published and DONE only as P8_WAVE_0_TIKTOK_PDP_IDENTITY_COMPATIBILITY_ONLY.
  - Current post-P8 handoff is HUMAN_BRAIN_PUBLIC_PDP_ACQUISITION_AUTHORIZATION with automated_public_pdp_acquisition_authority NONE.
  - The Human explicitly approves the audited contract-first public-PDP acquisition architecture and authorizes canonicalization of a later bounded collector implementation commitment, but does not authorize live TikTok acquisition.
  - The exact selected pilot remains context_id p8-pilot-001-led-motion-tiktok-vn, source ID 1731381331718341815, stable listing reference https://shop.tiktok.com/vn/pdp/den-led-cam-bien-chuyen-dong-3-che-do-sang-sac-usb-c/1731381331718341815.
  - ProductCandidateSnapshot is the canonical marketplace observation contract and SignalEvidence is the canonical field-evidence contract for existing Product Intelligence scalar observations.
  - ProductSourcePack remains the source-facts/seller-media evidence contract and must not become a second owner of public market metrics.
  - Public TikTok Shop PDP product/traction observations are semantically independent from authenticated TikTok Affiliate eligibility/economics.
  - Existing search-card parsing behavior may intentionally use lower-bound treatment for displayed price ranges; that behavior must not be reinterpreted as exact-PDP scalar-price evidence.
  - Missing, blocked, ambiguous, or unavailable values remain unknown rather than false, zero, minimum, maximum, inferred, or substituted.
  - SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY, SNAPSHOT_IS_NOT_TREND, EVIDENCE_IS_NOT_PRODUCT_TRUTH, and CAPABILITY_IS_NOT_AUTHORITY remain in force.
  - Current downstream AIOS pin and conformance remain edd7d8d92d54900c56442bbfcddb8648ec4d2e09 / TASK-207 revision 8.

