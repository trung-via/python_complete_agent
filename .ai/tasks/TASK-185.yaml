non_goals:
  - Modify, delete, recapture, normalize, hand-edit, or publish the TASK-182 candidate, baseline
    fixture, integration test, RUN/RESULT/FAILURE/REPAIR lineage, or REVIEW-182-006 decision.
  - Add a live Shopee/CDP verification or require Human interaction during TASK-185 Runtime
    verification. Live proof belongs to a later fresh baseline successor after publication.
  - Modify ProductCandidateSnapshot schema, DiscoveryRequest, DiscoveryBatch, orchestration,
    CandidateRanker, WinningProductScorer, SnapshotNormalizer, ScoringPolicy, DecisionBand,
    recommendation/approval, persistence, catalog, retrieval, grounded QA, or product-truth semantics.
  - Add a second Shopee adapter, second sold-count parser, generic marketplace parser, HTTP/API
    scraper, alternate browser route, browser launch fallback, reconnect/retry, alternate query,
    alternate platform, CAPTCHA solving/bypass, stealth, proxy rotation, or fallback evidence source.
  - Infer sold volume from price, review count, rating, title, URL, rank, neighboring cards, score,
    DOM position, or any unrelated marketplace field.
  - Hard-code the blocked TASK-182 suspicious values as a suppression list or special-case candidate
    IDs/queries. The correction must be provenance-semantic and general to the existing authority.
  - Select a P7.2 evidence collector, enrichment strategy, business threshold, winner, approval rule,
    or Commerce AI implementation direction. Governance/Product Direction work remains separate.
  - Modify AIOS-renew, the Python Agent AIOS pin, worker surfaces, publication machinery, or Human
    lifecycle commands.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Keep ShopeeDiscoveryAdapter and SHOPEE_CARD_EXTRACTION_SCRIPT as the sole Shopee search-card
      discovery/DOM extraction path. Keep parse_shopee_sold_count as the sole Shopee sold-count text
      parser. Do not add parallel extraction, parser, post-hoc sanitizer, or downstream scoring guard.
    - >
      Remove the generic styling-only `.truncate` fallback from sold-count extraction. A DOM node may
      supply sold_text only through a sold-specific selector/provenance already owned by the Shopee
      adapter or an equally narrow sold-specific selector justified by current source semantics.
      Generic typography/layout/truncation classes are not sufficient evidence of sold volume.
    - >
      Missing, unavailable, or untrusted sold evidence must remain null in the extraction payload and
      None in ProductCandidateSnapshot.sold_count. Do not fabricate, derive, substitute, or copy price
      or any neighboring numeric field into sold_count.
    - >
      Harden parse_shopee_sold_count so explicit price/currency-like text fails closed to None. At
      minimum, strings carrying unambiguous Vietnamese currency provenance such as the `₫` symbol or
      a standalone VND/currency marker adjacent to a numeric amount must not parse as sold volume.
      The guard must distinguish the Vietnamese sold phrase `đã bán` from a currency `đ` token and
      must not break legitimate localized sold-count text merely because the letter đ appears in `đã`.
    - >
      Preserve legitimate existing sold-count forms already covered by parsing authority, including
      forms equivalent to `Đã bán 1,2k`, `1.5k Đã bán`, `Đã bán 1200`, localized `tr/triệu`
      multipliers, and a trusted bare numeric count supplied by a sold-specific extraction node.
      Do not change positive-count rounding/multiplier semantics except as required to reject
      price/currency provenance.
    - >
      Do not use `sold_count == price` as the production rejection rule. Equality is evidence that
      exposed this defect, not a universally impossible marketplace state. Correct the provenance
      boundary so price text cannot enter sold_text/sold_count in the first place.
    - >
      Preserve TASK-151 readiness sampling, TASK-153 null-safe mapping, TASK-167 search-surface
      scoping, product-anchor fallback, block/CAPTCHA detection, true-empty semantics, navigation
      count, browser/page ownership, candidate identity, deduplication, max_candidates/max_pages,
      diagnostics, and existing error classes unchanged except for the minimum sold-evidence change.
    - >
      Add deterministic source/DOM-contract regression proving a card with price text inside a generic
      `.truncate` node and no sold-specific node yields sold_text null / sold_count None rather than
      price-derived sold evidence. The test must not depend on a live Shopee page, network, browser
      launch, wall-clock waiting, or current marketplace availability.
    - >
      Add focused mapping regressions proving: valid sold-specific text still maps to the expected
      sold_count; missing sold-specific evidence remains None; sibling price/original-price extraction
      remains unchanged; and the existing card mapping, readiness, scoped fallback, dedupe, pagination,
      block/empty, manager/cleanup, and one-navigation regressions remain green.
    - >
      Add parser regressions proving explicit currency/price-like strings are rejected while all
      previously legitimate sold-count forms remain accepted. Include at least one regression that
      protects `đã bán` from being confused with the currency `đ` marker.
    - >
      Do not modify SnapshotNormalizer or WinningProductScorer to compensate for malformed upstream
      data. Their existing behavior remains authoritative; the proof of this task is that untrusted
      price text no longer arrives as non-None sold_count.
    - >
      Update docs/PHASE_6_M2_DISCOVERY.md to record the sold-evidence provenance rule inside the
      existing Shopee adapter authority: sold volume is optional marketplace evidence, generic visual
      text is not sold provenance, and absence must remain None rather than be inferred.
    - >
      Update docs/PHASE_7_P7_0_WINNING_PRODUCT_EVIDENCE_QUALITY.md and both canonical product roadmaps
      consistently: TASK-181/P7.0 is CLOSED/PUBLISHED at
      9e835ed2c551c2fa3a8b66b82caa238bd41b152c; TASK-182/RUN-182-006 is BLOCKED by semantic review
      because malformed sold evidence invalidates the real-evidence baseline; TASK-185 is the narrow
      current prerequisite Shopee sold-evidence hardening; a fresh baseline successor remains NEXT
      only after TASK-185 Runtime PASS + semantic PASS + source-only publication. Preserve P6.0/P6.1/
      P6.3 CLOSED, P6.2 PARKED/reopenable, and P6.4-P6.6 DEFERRED/UNIMPLEMENTED.
    - >
      Do not claim that TASK-185 itself establishes a valid P7.1 baseline, marketplace coverage rate,
      business value, winner, recommendation, or enrichment priority. It is production evidence-input
      hardening only; the blocked TASK-182 measurements are not baseline truth.
    - >
      All TASK-185 Runtime verification is offline and deterministic. No browser/CDP, marketplace,
      provider/LLM, Drive, external network, Human challenge, random, UUID, or live acquisition work
      is permitted in verification.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      TASK-185 changes only the eight authorized paths, preserves ShopeeDiscoveryAdapter and
      parse_shopee_sold_count as the existing sole Shopee evidence authorities, and introduces no
      second discovery, parser, normalization, scoring, ranking, approval, browser, or truth owner.
  - id: AC2
    condition: >
      Generic `.truncate`/styling-only DOM provenance can no longer supply sold_text; absent or
      untrusted sold-specific DOM evidence remains null/None and price extraction remains separate.
  - id: AC3
    condition: >
      parse_shopee_sold_count rejects explicit price/currency-like text while preserving legitimate
      sold-count formats, including Vietnamese `đã bán`, multiplier forms, and trusted bare counts.
  - id: AC4
    condition: >
      Focused offline regressions prove the REVIEW-182-006 anomaly class is prevented without using
      sold_count==price as a production heuristic, and prior TASK-151/TASK-153/TASK-167 Shopee
      readiness, mapping, scoped-fallback, block/empty, navigation, dedupe, pagination and cleanup
      behavior remains green.
  - id: AC5
    condition: >
      ProductCandidateSnapshot, SnapshotNormalizer, WinningProductScorer, CandidateRanker,
      DiscoveryRequest/DiscoveryBatch, browser/session, CAPTCHA, Human approval, and downstream
      Product Intelligence semantics remain unchanged; no compensating downstream anomaly filter is
      introduced.
  - id: AC6
    condition: >
      Discovery documentation records the optional sold-evidence provenance/fail-closed boundary, and
      P7.0 plus both product roadmaps record TASK-182 as semantic BLOCKED evidence, TASK-185 as the
      narrow prerequisite, and a fresh real-evidence baseline successor as deferred until TASK-185
      Runtime PASS + semantic PASS + source-only publication while preserving all existing P6 states.
  - id: AC7
    condition: >
      TASK-182 candidate 94c4e5105e593b9136f186882daacb466c9a304d, its fixture/test/docs delta,
      RUN/RESULT/FAILURE/REPAIR lineage, and REVIEW-182-006 remain immutable and unpublished; TASK-185
      does not recapture or rewrite baseline evidence.
  - id: AC8
    condition: >
      Required offline verification and git diff check pass with zero unresolved items and changed
      files remain exactly within TASK-185 scope.

