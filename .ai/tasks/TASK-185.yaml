task_id: TASK-185
revision: 1

goal: >
  Harden the existing ShopeeDiscoveryAdapter sold-evidence extraction/parsing boundary so
  generic visual price text cannot become ProductCandidateSnapshot.sold_count. Preserve
  TASK-151/TASK-153/TASK-167 ShopeeDiscoveryAdapter as the sole Shopee discovery/DOM mapping
  authority and preserve existing ProductCandidateSnapshot, normalization, scoring, ranking,
  approval, browser/session, and Product Intelligence truth authorities. TASK-185 is the
  prerequisite product hardening exposed by REVIEW-182-006 F1; it does not repair, recapture,
  publish, or rewrite the blocked TASK-182 baseline candidate.

problem: >
  TASK-182 / P7.1 intentionally changed zero production Python and attempted to freeze one
  bounded three-query, fifteen-candidate Shopee search-card cohort through the existing
  ShopeeDiscoveryAdapter. RUN-182-006 reached canonical Runtime PASS at candidate
  94c4e5105e593b9136f186882daacb466c9a304d, but PRIMARY semantic review found a systematic
  evidence-integrity anomaly: all fifteen frozen candidates have sold_count exactly equal to
  price, including 590000/590000, 175000/175000, 999000/999000, and 302001/302001. Current
  SHOPEE_CARD_EXTRACTION_SCRIPT selects sold text with
  `.r6wKnM, ._2VI87d, [data-sqe="sold"], .truncate`; the generic `.truncate` fallback can bind
  a price-bearing visual node on the current Shopee DOM. parse_shopee_sold_count also accepts
  broad numeric text, so price-like strings can survive into sold_count. SnapshotNormalizer
  treats any non-None sold_count as OBSERVED sold_volume, which made the blocked baseline
  report DEMAND partial coverage and STRONG_DEMAND for evidence that is not semantically
  trustworthy. REVIEW-182-006 therefore BLOCKED publication. TASK-182 cannot fix the production
  authority because its contract requires zero production Python and the exact pinned AIOS
  remediation validator forbids widening TASK.scope.modify. The correction belongs in the
  existing Shopee discovery/parsing authority before any fresh real-evidence baseline successor.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-185 authoring is
    0e62d934b18d058e921ec6313b5a721d12888dfb. The active downstream AIOS dependency is exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@e72135cd5c5a1dec0d8374d9bb8994da5e458feb.
  - >
    TASK-182 revision 1 remains an unpublished benchmark task. RUN-182-006 produced candidate
    94c4e5105e593b9136f186882daacb466c9a304d with Runtime PASS, but REVIEW-182-006 is PRIMARY
    BLOCKED because the frozen sold_count evidence is malformed/untrustworthy. Neither the
    candidate nor the review-decision commit is product main.
  - >
    TASK-151 owns bounded Shopee search readiness/product-anchor fallback, TASK-153 owns null-safe
    Shopee card mapping hardening, and TASK-167 owns search-surface-bounded DOM eligibility.
    ShopeeDiscoveryAdapter remains the sole Shopee search-card discovery/DOM extraction authority;
    this task extends that same authority narrowly rather than introducing a second collector.
  - >
    src/product_intelligence/adapters/shopee_parsing.py remains the existing Shopee scalar parsing
    authority. parse_shopee_sold_count may continue to support legitimate sold-specific text,
    including localized multiplier and bare-count forms, but price/currency-marked text is not
    valid sold-count evidence merely because it contains digits.
  - >
    SnapshotNormalizer and WinningProductScorer are downstream consumers and are not defective for
    treating a non-None sold_count as observed evidence. TASK-185 must correct provenance at the
    Shopee extraction/parsing boundary rather than add anomaly heuristics to normalization/scoring.
  - >
    A fresh P7.1 real-evidence baseline must be captured only after TASK-185 Runtime PASS, ChatGPT
    semantic PASS, and source-only publication. The blocked TASK-182 fixture must never be edited
    into apparent validity or reused as baseline truth.

