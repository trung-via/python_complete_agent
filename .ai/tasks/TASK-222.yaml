task_id: TASK-222
revision: 1

goal: >
  Implement P7.4 TikTok Affiliate Evidence Profile as the next bounded production
  semantic capability inside the existing Commerce Opportunity Intelligence domain.
  Establish one immutable, deterministic, inspectable profile that organizes opaque
  references to already-owned evidence around the decision-relevant TikTok affiliate
  dimensions needed to evaluate a P7.3 OpportunityHypothesis, without acquiring,
  normalizing, scoring, ranking, interpreting, reconciling, or asserting truth from
  that evidence. The profile must compose with the published P7.3 DecisionContext and
  OpportunityHypothesis authority, expose which profile dimensions are represented or
  unrepresented by caller-supplied evidence references, and preserve uncertainty so
  P7.5 Value-of-Information Planning can later reason about evidence gaps without
  turning missing data into automatic acquisition authority. On exact reviewed source
  publication, close P7.4 and advance exactly one roadmap step so P7.5
  Value-of-Information Planning becomes the unique NEXT commitment.

problem: >
  P7.3 is now publication-effective through TASK-215 revision 2 / RUN-215-006 /
  REVIEW-215-002 at exact source
  dc4c4c8e6f3f4d6eb3441ff4873632e5f51655f9. Python Agent therefore has a bounded
  Commerce Opportunity Intelligence authority for DecisionContext and falsifiable
  OpportunityHypothesis, but it still has no product semantic representation of what
  decision-relevant TikTok affiliate evidence has actually been supplied for a
  hypothesis and what profile dimensions remain unrepresented.

  Existing Product Intelligence already owns ProductCandidateSnapshot and
  SignalEvidence semantics, including nullable observed fields such as
  affiliate_commission_rate, estimated_commission_value, creator_count, video_count
  and other market metrics. Shopee discovery intentionally leaves unavailable
  affiliate/creator/video values as None rather than fabricating them. Those existing
  types remain evidence/observation authorities and must not be duplicated or moved
  into Commerce Opportunity Intelligence.

  The next product need is therefore composition, not collection: P7.4 must group
  caller-supplied opaque evidence references into a stable TikTok affiliate evidence
  profile tied to one exact P7.3 DecisionContext and OpportunityHypothesis. The
  profile may say that a dimension has supplied references or has no supplied
  references. It must not claim that evidence exists or does not exist in the world,
  that a source is trustworthy, that a product is a winner, that missing evidence
  should automatically be fetched, or that any dimension is more important than
  another. P7.5, not P7.4, will own later Value-of-Information reasoning about what
  additional evidence may be worth acquiring.

assumptions:
  - Canonical python_complete_agent main at authoring is dc4c4c8e6f3f4d6eb3441ff4873632e5f51655f9.
  - TASK-215 revision 2 / RUN-215-006 / REVIEW-215-002 are PRIMARY PASS and exactly source-published at canonical main.
  - P7.3 is publication-effective and P7.4 TikTok Affiliate Evidence Profile is the unique canonical NEXT commitment.
  - P7.5 Value-of-Information Planning, P7.6 Market Test / Funnel Evidence, and P7.7 Calibration & Winner Validation remain NOT_DONE.
  - src/commerce_opportunity_intelligence/decision_context.py remains the sole P7.3 owner for DecisionContext and OpportunityHypothesis semantics.
  - ProductCandidateSnapshot and SignalEvidence remain Product Intelligence authorities for their existing observed/derived evidence semantics; P7.4 consumes opaque references only and does not re-own those values.
  - Existing Product Intelligence fields affiliate_commission_rate, estimated_commission_value, creator_count and video_count are evidence-bearing product observations when supplied by their canonical producers; their existence does not authorize P7.4 to collect or reinterpret them.
  - A profile with no supplied refs in one or more dimensions is valid and means only that the profile does not currently represent evidence for those dimensions.
  - The same opaque evidence reference may legitimately inform more than one profile dimension; cross-dimension reuse does not multiply evidentiary weight because P7.4 performs no scoring.
  - Current full downstream AIOS conformance remains DONE through TASK-207 revision 8 under exact pin edd7d8d92d54900c56442bbfcddb8648ec4d2e09.
  - Human selected Antigravity for the next execution sequence; do not silently switch Executor.

