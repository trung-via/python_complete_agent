task_id: TASK-159
revision: 1

goal: >
  Explicitly migrate the repository-owned unified AIOS worker from the currently pinned
  AIOS-renew commit 3f2770be9752b800e21adfc05d57778dd9818c68 to the exact semantically
  reviewed upstream TASK-077 source candidate
  6893d44a3b8478cadb4bdceab6e671324a54d954, so Python Agent can consume the
  historical-REPAIR remote snapshot hardening required to continue RUN-156-003 without
  repeated remote ref discovery. Preserve the existing thin RUN/FIX/REPAIR/STATUS Human-facing
  worker, exact executor identity, bootstrap/provenance fail-closed behavior, historical
  failed-head/continuation lineage, no-retry/no-fallback/no-reroute semantics, and Python Agent
  product/publication authority. Do not modify, rerun, repair, or replace TASK-156 product work
  during this migration.

problem: >
  Python Agent main currently pins AIOS-renew at
  3f2770be9752b800e21adfc05d57778dd9818c68, which includes TASK-076 and correctly
  supports the intended NO_CHANGE continuation semantics for RUN-156-003. However, repeated
  attempts to invoke the already-authored REPAIR-156-003 fail before new RUN admission inside
  TASK-058 historical REPAIR remote-lineage recovery with only
  `historical REPAIR lineage rejected: failed to query canonical refs from origin`.
  Direct host Git, direct Codex-shell Git, repository-venv Python spawning Git, and the exact
  pinned worker-runtime Python spawning the same task-scoped ls-remote query all succeeded,
  while inspection of the pinned Runtime showed historical recovery performs multiple remote
  ref queries whose count grows with chain length and collapses any nonzero query to one generic
  error. AIOS-renew TASK-077 hardens the existing TASK-058 authority by acquiring one immutable
  TASK-scoped ref snapshot for one historical-repair admission and preserving bounded transport
  failure provenance without adding retry/fallback/reroute. TASK-077 is canonically PRIMARY PASS
  and published at 6893d44a3b8478cadb4bdceab6e671324a54d954. Per Python Agent project
  contract, this upstream fix is unavailable downstream until the exact pin is explicitly
  migrated and certified here.

assumptions:
  - >
    Current canonical python_complete_agent main at TASK-159 authoring is
    265ad397ef61723c70bc65077c1772a3e34feddf, the published TASK-158 source candidate.
  - >
    The current downstream AIOS pin is exactly
    3f2770be9752b800e21adfc05d57778dd9818c68 in the requirements pin and the
    repository-owned launcher authoritative commit.
  - >
    AIOS-renew TASK-077 is canonical PRIMARY PASS at source candidate
    6893d44a3b8478cadb4bdceab6e671324a54d954. RUN-077-001 reports 26 focused
    tests passed and git diff --check PASS; REVIEW-077-001 is PRIMARY PASS with AC1-AC9 PASS.
  - >
    The interval from 3f2770be9752b800e21adfc05d57778dd9818c68 to
    6893d44a3b8478cadb4bdceab6e671324a54d954 is exactly two commits: TASK-077
    authoring plus the reviewed implementation. The implementation changes only AIOS-renew
    historical-repair transport mechanics and focused tests.
  - >
    TASK-113 remains the repository-owned worker/bootstrap authority. TASK-157 and TASK-158
    remain direct pin-migration precedents. TASK-159 extends only this existing authority and
    creates no second launcher, runtime store, Human-facing protocol, or Product Intelligence
    authority.
  - >
    TASK-156 remains active and unpublished. Canonical remote state still contains failures
    RUN-156-001, RUN-156-002, RUN-156-003 and REPAIR-156-003, with no RUN-156-004 admitted.
    Exact failed candidate d66faa95c8c03e1fe2d5f4c4c36b44b7fc9bc364 and all existing
    continuation evidence must remain immutable during this migration. After TASK-159 is
    reviewed PASS and published, Brain may separately continue REPAIR RUN-156-003.
  - >
    Product P6.0b remains the active certification objective. This migration is execution
    substrate maintenance only and must not advance, close, or redefine P6.0b.

