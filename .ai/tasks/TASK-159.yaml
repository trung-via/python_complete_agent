  inspect:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md
    - .ai/tasks/TASK-113.yaml
    - .ai/tasks/TASK-156.yaml
    - .ai/tasks/TASK-158.yaml
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-renew-worker.md
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - tests/aios_bridge/test_aios_worker_control_surface.py
  modify:
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-renew-worker.md
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - tests/aios_bridge/test_aios_worker_control_surface.py

non_goals:
  - Modify Product Intelligence, browser, discovery, scraper, persistence, catalog, retrieval,
    family/variant admission, grounded-QA, roadmap product semantics, or any production Python module.
  - Modify TASK-156, RUN-156-001/RUN-156-002/RUN-156-003 artifacts, REPAIR-156-003,
    candidate d66faa95c8c03e1fe2d5f4c4c36b44b7fc9bc364, or any TASK-156 review/publication lineage.
  - Execute, continue, rerun, repair, or verify TASK-156 as part of TASK-159 verification.
  - Reimplement TASK-077 ref snapshot acquisition, historical-lineage reconstruction, remote
    transport classification, duplicate-continuation detection, or fail-closed logic inside the
    downstream worker, docs tooling, adapters, or tests.
  - Add Git retry, reconnect, fallback remote, alternate transport, polling, backoff, reroute,
    failover, or executor substitution in the Python Agent worker.
  - Copy AIOS-renew transport implementation, remote status/approval workflows, publication code,
    or expose any Human command beyond RUN/FIX/REPAIR/STATUS.
  - Change Python Agent auto-publication workflow or publication authority.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      The active dependency file must contain exactly one non-comment pin and it must be exactly:
      aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@6893d44a3b8478cadb4bdceab6e671324a54d954
    - >
      .agents/skills/aios-worker/scripts/aios_worker.py AUTHORITATIVE_COMMIT and derived PIN_LINE
      must bind exactly the same 6893d44a3b8478cadb4bdceab6e671324a54d954 commit and
      existing authoritative repository URL. No branch, tag, version range, current-main lookup,
      alternate source, or environment override may select the kernel.
    - >
      Existing dedicated <git-dir>/aios/worker-runtime bootstrap remains authoritative. Installed
      PEP 610 provenance from 3f2770be9752b800e21adfc05d57778dd9818c68 or any alternate
      source/commit must fail validation and use the existing atomic stale-runtime replacement path
      to install only the checked-in new pin. An already-authoritative
      6893d44a3b8478cadb4bdceab6e671324a54d954 runtime must be reused without reinstall.
    - >
      The visible Human protocol remains exactly RUN TASK-N, FIX TASK-N FINDING-ID,
      REPAIR RUN-N-NNN, and STATUS TASK-N. Parsing, target validation, strict canonical PASS-summary
      parsing, no-push behavior, executor binding, and at-most-one pinned-kernel invocation remain
      unchanged except for consuming the new distribution.
    - >
      Codex remains bound to executor codex and Antigravity remains bound to executor antigravity.
      No TASK, runtime state, failure state, or network condition may silently reroute or substitute
      executor identity.
    - >
      Worker REPAIR remains thin. TASK-058/TASK-077 historical-repair semantics are owned solely by
      the pinned Runtime: one admission consumes one immutable task-scoped remote ref snapshot for
      terminal/candidate identity, duplicate-continuation checks, and lineage reconstruction; a
      nonzero snapshot query fails closed with bounded operational provenance; missing refs after a
      successful query remain semantic lineage failures; no automatic retry/fallback/reroute is added.
      None of this logic may be duplicated downstream.
    - >
      Documentation may explain the exact adopted TASK-077 behavior but must explicitly distinguish
      Runtime authority from worker authority. The worker does not snapshot refs, classify Git
      transport failures, reconstruct lineage, choose recovery policy, retry Git, or infer whether
      TASK-156 should use NO_CHANGE versus CODE_FIX.
    - >
      Certification tests must update the exact expected pin, launcher provenance, stale-runtime
      replacement target, and prior-pin rejection while preserving existing RUN/FIX/REPAIR/STATUS,
      bootstrap-host, strict parsing, executor separation, one-invocation, no-push, and thin-worker
      regressions. Add or update source-level guards only as necessary to prove TASK-077 authority
      did not move into repository worker code.
    - >
      Migration verification must be deterministic and network-free with respect to Python Agent
      product/provider behavior. Do not run TASK-156, REPAIR RUN-156-003, live marketplace discovery,
      scraping, provider calls, or any product path merely to prove the dependency migration.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      Dependency file, launcher authoritative commit, derived pin string, worker docs, and
      certification expectations all reference exactly
      6893d44a3b8478cadb4bdceab6e671324a54d954 and reject
      3f2770be9752b800e21adfc05d57778dd9818c68 as stale provenance.
  - id: AC2
    condition: >
      Bootstrap regressions prove stale/alternate worker runtime provenance is not reused and is
      atomically synchronized to the exact new pin, while an already-authoritative new runtime is
      reused without reinstall.
  - id: AC3
    condition: >
      RUN, FIX, REPAIR, and STATUS retain unchanged Human-facing meaning, exact executor identity,
      strict canonical summary parsing, at-most-one pinned-kernel invocation, and no worker-owned
      retry/reroute/publication authority.
  - id: AC4
    condition: >
      Worker REPAIR remains thin and contains no TASK-077 snapshot acquisition, remote transport
      categorization, historical lineage traversal, duplicate-continuation policy, retry/fallback,
      or repair-action decision logic; those behaviors are consumed solely through the exact pin.
  - id: AC5
    condition: >
      Documentation accurately records the adopted TASK-077 behavior: historical REPAIR ref
      discovery is consolidated into one immutable task-scoped snapshot per admission; nonzero
      snapshot acquisition remains fail-closed with bounded operational provenance; successful but
      incomplete snapshots remain lineage failures; there is no automatic retry/fallback/reroute.
  - id: AC6
    condition: >
      No Product Intelligence file, TASK-156 source/artifact/repair lineage, Python Agent workflow,
      publication implementation, or additional Human-facing command is changed or exposed.
  - id: AC7
    condition: >
      TASK-156 remains paused on exact RUN-156-003 during migration, preserving candidate
      d66faa95c8c03e1fe2d5f4c4c36b44b7fc9bc364 and existing failure/continuation evidence; no
      RUN-156-004 is created by migration verification.
  - id: AC8
    condition: >
      The complete repository-owned worker certification suite passes on the migrated source tree
      and git diff --check passes without invoking TASK-156 or any live RUN/FIX/REPAIR.

verification:
  required:
    - 'python -m pytest tests/aios_bridge/test_aios_worker_control_surface.py -q'
    - 'git diff --check'
