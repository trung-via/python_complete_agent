non_goals:
  - Retry, authorize, schedule, or perform authenticated Affiliate access, public-PDP capture,
    browser/CDP operation, scraper/API call, search, enrichment, Wave 0/1/2, or any live acquisition.
  - Infer or establish affiliate eligibility, commission, estimated commission, account eligibility,
    platform error, product rejection, product quality, audience fit, competition, demand trend,
    or negative economics.
  - Fill quality_constraints or risk_constraints for a market test that is not being authorized.
  - Construct or mutate P7.4 evidence profile, P7.5 VOI plan/disposition, P7.6 market-test evidence,
    P7.7 winner validation, Product Truth, canonical product identity, ranking, score, recommendation,
    causal attribution, or outcome proof.
  - Execute or authorize market test, spend, traffic, content publication, outreach, affiliate
    participation, pricing/inventory mutation, or any commerce action.
  - Select a replacement product, alternative channel, new pilot, P8.4, TASK-270, post-P8 domain,
    or any other successor inside TASK-269.
  - Treat NO_TEST_AUTHORIZED_NOW as permanent STOP, product/listing rejection, or evidence that
    future fresh evidence/context could not support a different Human decision.
  - Rewrite immutable TASK-227 through TASK-268 history or reinterpret the historical
    real_pilot_executed field.
  - Modify production Python, Governance Foundation, AIOS adoption/conformance/pin, Runtime,
    Reviewer, Publisher, workflow bindings, or executor policy.

