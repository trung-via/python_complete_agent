  - id: AC2
    condition: >
      Closure does not imply product/listing rejection, affiliate ineligibility, negative economics,
      permanent stop, or future impossibility; affiliate economics and readiness uncertainties remain explicit.
  - id: AC3
    condition: >
      TASK-268 blocked-access reconciliation, no-retry state, public-PDP independence, and existing
      point-in-time evidence boundaries are preserved without acquisition or fabricated evidence.
  - id: AC4
    condition: >
      Explicit closure state distinguishes a completed real decision process from unexecuted market/action paths:
      real_decision_case_closed true while market_test_authorized/executed, commerce_action_executed,
      spend_executed, outcome_evidence_generated, P7.6 real market-test path, and P7.7 real winner path are false.
