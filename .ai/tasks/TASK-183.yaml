task_id: TASK-183
revision: 1

goal: >
  Explicitly migrate Python Agent's repository-owned AIOS worker from the exact
  currently pinned AIOS-renew source candidate
  883974be6ec5922ae57021b50a48c84a0014dbfa to the exact reviewed and published
  TASK-090 source candidate 08e4a612377ac82be36061286a34138ea53ab0d1 so
  downstream Python Agent can consume TASK-089 `CONTINUE_IMPLEMENTATION` recovery
  semantics and TASK-090 safe-publication compatibility for the preserved
  TASK-182 / RUN-182-001 lineage. Preserve the thin worker, Unified State/Human
  Surface authority, executor-specific Human surfaces, exact dependency provenance,
  review-before-publication boundary, and one-operation CONTINUE model. This TASK
  migrates and certifies the execution substrate only; it does not itself continue,
  implement, review, or publish TASK-182.

problem: >
  Python Agent TASK-182 failed at RUN-182-001 during implementation-time live Shopee
  capture before any repository mutation because the required Human CAPTCHA
  prerequisite had not yet been satisfied. The canonical failure is clean,
  repairable, transportable, has changed_files=[], failed_head_sha equal to the
  original TASK-182 base fa6aa4a6b686530c951dcb7aadb22e26655504fc, and establishes
  no product/code defect. Human has now solved the CAPTCHA, but Python Agent still
  pins AIOS-renew 883974be6ec5922ae57021b50a48c84a0014dbfa, whose REPAIR vocabulary
  cannot safely resume unfinished pre-verification implementation requiring mutation
  without misclassifying it as CODE_FIX or discarding lineage with a fresh PRIMARY.
  Upstream AIOS-renew TASK-089 introduced exactly one mutation-authorizing REPAIR
  action, `CONTINUE_IMPLEMENTATION`, for this boundary, and TASK-090 made safe
  publication compatible with that lineage. Python Agent must adopt the exact
  reviewed TASK-090 source candidate before authoring or executing the downstream
  continuation.

assumptions:
  - >
    Canonical python_complete_agent main at TASK-183 authoring is
    fa6aa4a6b686530c951dcb7aadb22e26655504fc. TASK-182 revision 1 is authored there,
    while RUN-182-001 is the active canonical failure and no TASK-182 implementation
    source candidate or semantic review exists.
  - >
    The authoritative downstream AIOS dependency immediately before this migration is
    exactly `aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@883974be6ec5922ae57021b50a48c84a0014dbfa`.
    Current/future AIOS-renew main is never inferred as downstream authority.
  - >
    Upstream TASK-089 is published at source candidate
    bb57147eac92475789d7809ed445d56535d5a009 and introduces the bounded REPAIR action
    `CONTINUE_IMPLEMENTATION` for unfinished pre-verification work requiring mutation
    after a new external/Human reason permits another attempt, while preserving exact
    failed-run lineage, one explicit Executor, Runtime-owned completion/verification,
    and no retry/reroute.
  - >
    Upstream TASK-090 source candidate
    08e4a612377ac82be36061286a34138ea53ab0d1 is the reviewed and published candidate
    that preserves TASK-089 semantics and extends safe publication to recognize valid
    CONTINUE_IMPLEMENTATION lineage. REVIEW-090-001 is PRIMARY PASS for that exact
    source candidate. The later AIOS-renew main roadmap commit
    51114be70fb672ed890ce22964eca4abf85019e7 is not the migration target.
  - >
    TASK-179 remains the downstream authority for exact immutable AIOS dependency
    migration, dedicated `.git/aios/worker-runtime` bootstrap/provenance validation,
    thin launcher behavior, CONTINUE/STATUS translation, and worker-control regression
    structure. This TASK extends that authority only to the new exact target and
    adopted REPAIR semantic vocabulary.
  - >
    Human has reported the Shopee CAPTCHA prerequisite for TASK-182 is now satisfied.
    That Human fact justifies later Brain authorization of one downstream continuation;
    neither this migration nor Runtime may probe CAPTCHA/session state or infer the
    semantic repair action from diagnostic prose.

scope:
  inspect:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-renew-worker.md
    - .github/workflows/aios-auto-publish.yml
    - tests/aios_bridge/test_aios_worker_control_surface.py
    - tests/aios_bridge/test_aios_auto_publish_workflow.py
    - .ai/tasks/TASK-179.yaml
    - .ai/tasks/TASK-182.yaml
    - .ai/transport/failure.json
  modify:
    - .agents/skills/aios-worker/requirements-aios-renew.txt
    - .agents/skills/aios-worker/scripts/aios_worker.py
    - .agents/skills/aios-worker/SKILL.md
    - .agents/workflows/aios-renew-worker.md
    - docs/AIOS_UNIFIED_WORKER_WORKFLOW.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - tests/aios_bridge/test_aios_worker_control_surface.py

non_goals:
  - Modify AIOS-renew itself, follow a floating AIOS branch/tag/main, or migrate beyond
    exact reviewed source candidate 08e4a612377ac82be36061286a34138ea53ab0d1.
  - Modify TASK-182, RUN-182-001 FAILURE/artifact lineage, its failed_head_sha, live
    evidence methodology, Shopee queries, browser profile, cookies, CAPTCHA state,
    Product Intelligence source/tests, or Phase 7 roadmap in this migration.
  - Author or execute the TASK-182 CONTINUE_IMPLEMENTATION REPAIR, invoke its live capture,
    create its baseline fixture, or claim TASK-182 has resumed or passed.
  - Reimplement, copy, approximate, parse, or infer TASK-089/TASK-090 Runtime,
    publication, correction-preflight, Unified State, or prerequisite semantics inside
    Python Agent launcher/workers/tests.
  - Add a new Human command such as RESUME. Normal lifecycle remains `CONTINUE TASK-N`;
    RUN/FIX/REPAIR remain compatibility/debug surfaces.
  - Change executor selection, model defaults, timeout/watchdog behavior, lease semantics,
    retry/fallback/reroute behavior, recursive continuation, or worker surface separation.
  - Treat CONTINUE_IMPLEMENTATION as CODE_FIX or NO_CHANGE, broaden either legacy action,
    or allow Brain/worker/Runtime to infer external-prerequisite state from error text.
  - Modify `.github/workflows/aios-auto-publish.yml` or
    `tests/aios_bridge/test_aios_auto_publish_workflow.py`; they must continue consuming
    the checked-in immutable requirements source without owning a duplicate pin.
  - Push, merge, publish, or mutate main from Executor implementation execution.

constraints:
  hard:
    - >
      Change the only active downstream dependency pin to exactly
      `aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@08e4a612377ac82be36061286a34138ea53ab0d1`
      and change launcher `AUTHORITATIVE_COMMIT` to the same exact SHA. No floating ref,
      duplicate source, TASK-090 review-decision commit, later roadmap commit, or AIOS main
      is authoritative.
    - >
      Preserve TASK-179 dedicated runtime/provenance behavior. Any runtime installed from
      immediate predecessor 883974be6ec5922ae57021b50a48c84a0014dbfa, older commit,
      alternate source, incomplete install, or unverifiable PEP 610 provenance must be
      rejected and atomically rebuilt; only repository `trung-via/AIOS-renew` at exact
      commit 08e4a612377ac82be36061286a34138ea53ab0d1 is authoritative after migration.
    - >
      Keep the shared launcher thin. Apart from replacing its exact immutable authority
      constant, do not change TASK/RUN parsing, bootstrap mechanics, command mapping,
      CONTINUE/STATUS pass-through, RUN/FIX/REPAIR summary behavior, executor selection,
      retry policy, or lifecycle logic.
    - >
      Adopt TASK-089/TASK-090 behavior only through the pinned AIOS distribution. Python
      Agent must not add a local CONTINUE_IMPLEMENTATION parser/dispatcher/state machine.
      The Human still invokes normal `CONTINUE TASK-N`; Unified State and canonical REPAIR
      authorization inside the pinned kernel remain the sole next-action/execution authority.
    - >
      Reconcile `docs/CHATGPT_PROJECT_CONTRACT.md` Brain REPAIR preflight with the adopted
      three-action semantics without weakening existing rules: `NO_CHANGE` remains only for
      eligible completed unchanged continuation requiring zero mutation; `CODE_FIX` remains
      only for an established defect requiring repository correction; and
      `CONTINUE_IMPLEMENTATION` is only for an admitted repairable pre-verification failed RUN
      where original implementation is unfinished, no product/code defect is asserted,
      remaining authorized work requires mutation, and Human/Brain has a new reason to
      attempt continuation after an external/Human non-defect prerequisite changed. Preserve
      RUNTIME_OR_LINEAGE_DEFECT fail-closed escalation when none is safe.
    - >
      The contract must state that CONTINUE_IMPLEMENTATION preserves exact failed RUN,
      TASK revision, failed_head_sha/root lineage and requires a non-empty explicit
      modification scope plus one explicit Executor; it is one separately authorized
      continuation, not automatic retry, fresh PRIMARY, fallback, or reroute. Brain authors
      the semantic choice; Runtime validates structure and must not probe the prerequisite.
    - >
      Active worker documentation may describe the newly adopted kernel capability but must
      preserve one-operation CONTINUE/STATUS, physical Codex/Antigravity separation, thin
      delegation, no downstream state selection, and explicit RUN/FIX/REPAIR compatibility
      surfaces. Do not expose raw internal AIOS CLI as the normal Human workflow.
    - >
      Worker-control regressions must bind the requirements file and launcher constant to
      exact target 08e4a612377ac82be36061286a34138ea53ab0d1, classify immediate predecessor
      883974be6ec5922ae57021b50a48c84a0014dbfa as stale provenance, and preserve existing
      deterministic bootstrap, exact source+commit provenance, action routing,
      one-invocation, executor separation, and no-retry/reroute coverage.
    - >
      `.github/workflows/aios-auto-publish.yml` and
      `tests/aios_bridge/test_aios_auto_publish_workflow.py` remain unchanged. Safe
      publication compatibility is consumed only because the exact pinned distribution now
      includes TASK-090.
    - >
      Historical TASK-179/TASK-182 contracts and RUN-182-001 immutable transport/failure
      artifacts remain historical truth and must not be rewritten for the new pin.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      Checked-in requirements and launcher provenance bind exactly to AIOS-renew
      08e4a612377ac82be36061286a34138ea53ab0d1 with no floating/duplicate runtime authority,
      and predecessor 883974be6ec5922ae57021b50a48c84a0014dbfa is stale after migration.
  - id: AC2
    condition: >
      Deterministic bootstrap/provenance regressions prove authoritative target reuse and
      reject/rebuild predecessor, older, alternate-source, incomplete, or unverifiable
      runtimes to the exact target without creating a second runtime authority.
  - id: AC3
    condition: >
      Existing CONTINUE, STATUS, RUN, FIX, and REPAIR worker behavior remains structurally
      unchanged: one pinned kernel invocation, exact selector validation, surface-bound
      executor identity, canonical PASS summaries where applicable, and no retry/fallback/
      reroute/recursive lifecycle call. No downstream CONTINUE_IMPLEMENTATION state machine
      or parser is introduced.
  - id: AC4
    condition: >
      `docs/CHATGPT_PROJECT_CONTRACT.md` precisely adopts CONTINUE_IMPLEMENTATION alongside
      existing NO_CHANGE/CODE_FIX/RUNTIME_OR_LINEAGE_DEFECT classification, including exact
      unfinished-pre-verification, no-established-defect, mutation-required,
      Human/Brain-new-reason, explicit-scope/executor, lineage-preservation, and no-prerequisite-
      probing semantics.
  - id: AC5
    condition: >
      Active Codex/Antigravity skill/workflow and unified-worker documentation consistently
      identify 08e4a612377ac82be36061286a34138ea53ab0d1 as current downstream authority and
      describe TASK-089/TASK-090 adoption without moving semantic selection or Runtime/
      publication implementation into the worker layer.
  - id: AC6
    condition: >
      TASK-182, RUN-182-001 immutable lineage, Product Intelligence code/tests, Phase 7
      roadmap, auto-publication workflow/test, and unrelated repository surfaces remain
      unchanged. This migration makes no claim that TASK-182 has resumed, passed, been
      reviewed, or been published.
  - id: AC7
    condition: >
      Focused worker-control plus existing auto-publication-boundary regressions and
      `git diff --check` pass with no unresolved items and no changed file outside the seven
      authorized migration files.

