task_id: TASK-164
revision: 2

goal: >
  Begin P6.1 Retrieval-Quality Evaluation by adding one pure deterministic evaluation
  authority over the existing TASK-122 lexical retrieval and TASK-129 grounded-answer
  structures. TASK-164 measures explicit Human-authored benchmark labels without changing
  retrieval, query planning, RAG context, answer semantics, ranking, canonical knowledge,
  or product truth. It closes only P6.1a Evaluation Contract; a separate P6.1b successor
  will execute this frozen evaluator against real acquired marketplace evidence.

problem: >
  Published TASK-163 closed P6.0 live real-evidence certification, so the canonical order is
  now CERTIFY -> EVALUATE -> IMPROVE. TASK-122 already owns lexical normalization, matching,
  witnesses, hit ordering, and limits; TASK-123 owns grounded context and citation addressing;
  TASK-129 owns structural grounded-answer/citation validity; TASK-134 owns natural-question
  query planning; TASK-135 owns persistent grounded-QA composition. No authority currently
  compares TASK-122 outputs with explicit benchmark relevance labels or quantifies whether
  an already-valid GroundedAnswer cites benchmark-relevant retrieved variants. TASK-164 adds
  only deterministic evaluation values and exact metrics over those existing public outputs.

assumptions:
  - >
    Canonical product baseline before TASK-164 authoring is
    fa2a49326be28422484db4a37c932681210d8060, the published TASK-163 source candidate.
  - >
    TASK-163 has canonical Runtime PASS through RUN-163-002 and PRIMARY semantic PASS
    through REVIEW-163-002; therefore P6.0b and P6.0 are CLOSED and P6.1 is current.
  - >
    The authoritative AIOS dependency is exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@32ace104c5cfaa1b7affbaa40157872b1f85147f.
  - >
    TASK-121 remains canonical evidence-profile projection authority. TASK-122 remains the
    sole lexical retrieval authority. TASK-123/TASK-124 remain grounded-context/addressing
    authority. TASK-129 remains grounded-answer structural authority and does not prove
    semantic entailment. TASK-134 remains query-planning authority. TASK-135 remains
    persistent grounded-QA startup/composition authority.
  - >
    Human-authored relevant_variant_ids are benchmark annotations only. They are not
    canonical product truth, entity identity, M2 business ranking, recommendation, approval,
    or retained evidence mutation.
  - >
    P6.1 is deliberately split: TASK-164 closes only P6.1a Evaluation Contract. P6.1b will
    define and execute the reviewed real-evidence benchmark corpus. P6.2 remains forbidden
    until P6.1b empirical evidence justifies a specific improvement.

