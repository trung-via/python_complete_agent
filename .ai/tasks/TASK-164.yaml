  inspect:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md
    - docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md
    - .ai/tasks/TASK-121.yaml
    - .ai/tasks/TASK-122.yaml
    - .ai/tasks/TASK-123.yaml
    - .ai/tasks/TASK-129.yaml
    - .ai/tasks/TASK-134.yaml
    - .ai/tasks/TASK-135.yaml
    - .ai/tasks/TASK-163.yaml
    - src/product_intelligence/canonical_profile.py
    - src/product_intelligence/canonical_retrieval.py
    - src/product_intelligence/canonical_rag_context.py
    - src/product_intelligence/grounded_answer.py
    - src/product_intelligence/grounded_query_planning.py
    - src/product_intelligence/persistent_grounded_qa.py
    - src/product_intelligence/__init__.py
    - tests/product_intelligence/test_canonical_retrieval.py
    - tests/product_intelligence/test_canonical_rag_context.py
    - tests/product_intelligence/test_grounded_answer.py
  modify:
    - src/product_intelligence/retrieval_quality_evaluation.py
    - src/product_intelligence/__init__.py
    - tests/product_intelligence/test_retrieval_quality_evaluation.py
    - docs/PHASE_6_P6_1_RETRIEVAL_QUALITY_EVALUATION.md
    - docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md
    - docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md

non_goals:
  - Modify TASK-121 canonical profile construction or retained evidence.
  - Modify TASK-122 normalization, searchable fields, all-term semantics, match classes,
    witness selection, ordering, limits, public hit types, or implementation.
  - Modify TASK-123/TASK-124 context construction, addressing, packing, rendering,
    truncation, evidence whitelist, or retrieval delegation.
  - Modify TASK-129 statuses, structural citation rules, answer text, limitations, or its
    explicit no-semantic-entailment boundary.
  - Modify TASK-134 query planning or TASK-135 persistent composition.
  - Add semantic/vector retrieval, embeddings, BM25/FTS/TF-IDF, fuzzy matching, synonyms,
    reranking, query expansion, LLM scoring, or retrieval fallback.
  - Add or modify M2 scoring/ranking/approval/queue semantics.
  - Add product-truth reconciliation, preferred/latest/majority fact selection, identity
    migration, admission, or autonomous approval.
  - Acquire live marketplace evidence, open browser/CDP, read manifests, load SQLite, scan
    files, use Drive, invoke a provider/model, or perform network I/O. P6.1b owns real
    benchmark execution; existing tasks retain acquisition/persistence/provider authority.
  - Persist benchmark results, add evaluation databases/indexes, dashboards, HTTP/CLI,
    telemetry, background jobs, caches, or mutable global state.
  - Define expected natural-language answer wording, grade prose, claim factual correctness,
    detect hallucination, or infer semantic entailment from citation presence.

constraints:
  hard:
    - >
      Add exactly one implementation module
      src/product_intelligence/retrieval_quality_evaluation.py. Expose exactly these new
      public names from that module and src/product_intelligence/__init__.py:
      RetrievalQualityEvaluationError, RetrievalBenchmarkCase,
      RetrievalCaseEvaluation, RetrievalQualityReport, GroundedCitationFidelity,
      evaluate_lexical_retrieval_quality, and
      evaluate_grounded_answer_citation_fidelity. Import dependencies through private aliases
      so the actual module namespace leaks no additional non-underscore public names.
    - >
      RetrievalBenchmarkCase must be frozen and contain exactly four fields: case_id,
      question, retrieval_query, relevant_variant_ids. case_id must be an exact nonblank
      single-line str of at most 128 UTF-8 bytes. question must be an exact nonblank str of
      at most 4096 UTF-8 bytes. retrieval_query must be an exact str and must be passed
      unchanged to TASK-122; TASK-164 performs no local normalization, tokenization, planning,
      expansion, stemming, or interpretation. relevant_variant_ids must be an exact non-empty
      tuple of unique exact nonblank str values, preserved in caller order.
    - >
      Benchmark relevance is explicit Human evaluation input only. TASK-164 may compare exact
      profile.variant_id strings with relevant_variant_ids solely for scoring. It must not
      infer benchmark relevance from evidence, marketplace, score, recency, confidence,
      retrieval witnesses, answer text, or query text, and must never write labels into
      canonical state.
    - >
      evaluate_lexical_retrieval_quality(profiles, cases, *, limit=10) must materialize the
      supplied profiles iterable exactly once and cases iterable exactly once. cases must be
      a non-empty tuple of exact RetrievalBenchmarkCase values after materialization;
      duplicate case_id values fail with RetrievalQualityEvaluationError. limit must be an
      exact int with bool rejected and lie in TASK-122's inclusive range 1..100.
    - >
      On a successful evaluation, invoke retrieve_canonical_variant_profiles exactly once per
      benchmark case with the same exact materialized corpus, query=case.retrieval_query, and
      limit=limit. Do not call TASK-122 private helpers, inspect searchable fields, reproduce
      normalization/matching, accept precomputed hits, or add another retrieval route.
      CanonicalProfileRetrievalError and any TASK-122 corpus/query failure must propagate
      unchanged rather than be collapsed into RetrievalQualityEvaluationError.
    - >
      Only after TASK-122 has successfully validated/delegated the corpus may TASK-164 inspect
      exact profile.variant_id values for benchmark binding. Every relevant_variant_id in every
      case must correspond to one variant_id in that validated corpus; absent gold IDs fail
      closed with RetrievalQualityEvaluationError. Opaque IDs are labels only and must never
      become searchable text or an additional retrieval/ranking signal.
    - >
      RetrievalCaseEvaluation must be frozen and contain exactly eight fields: case, limit,
      hits, true_positive_variant_ids, false_positive_variant_ids,
      false_negative_variant_ids, precision, recall. case is the exact supplied
      RetrievalBenchmarkCase object; limit is the exact evaluator limit; hits is the exact
      tuple returned by TASK-122. True positives and false positives preserve exact TASK-122
      hit order. False negatives preserve exact case.relevant_variant_ids order.
    - >
      precision and recall must be fractions.Fraction values, never floats. Per-case precision
      is TP / retrieved_count; if retrieved_count is zero, precision is exactly Fraction(0, 1).
      Recall is TP / relevant_count, whose denominator is always non-zero. TASK-164 introduces
      no F1, NDCG, MRR, semantic score, confidence, graded relevance, weighted relevance, or
      business metric.
    - >
      RetrievalQualityReport must be frozen and contain exactly seven fields: limit,
      case_evaluations, true_positive_count, false_positive_count, false_negative_count,
      micro_precision, micro_recall. case_evaluations preserve caller case order. Counts are
      exact sums across cases. micro_precision is total TP / (TP + FP), or Fraction(0, 1)
      when no hits were retrieved. micro_recall is total TP / (TP + FN). Use exact Fraction
      arithmetic only; add no macro averaging, thresholds, weighting, or benchmark ranking.
    - >
      evaluate_grounded_answer_citation_fidelity(case_evaluation, answer) accepts exact
      RetrievalCaseEvaluation and exact GroundedAnswer values only. It must fail closed with
      RetrievalQualityEvaluationError unless answer.context.question equals
      case_evaluation.case.question exactly, answer.context.retrieval_query equals
      case_evaluation.case.retrieval_query exactly, answer.context.max_hits equals
      case_evaluation.limit exactly, and the ordered tuple of context_hit.hit values is
      value-equal to case_evaluation.hits. It must not rerun retrieval or rebuild context.
    - >
      Citation fidelity is structural benchmark relevance only. Derive leaf addresses only
      from the exact public CanonicalRagContext structure using existing TASK-123/TASK-129
      addressing: witness leaves are <hit citation_id>-W001... in exact witness order and
      retained supplemental leaves use each block.citation_id. Map every answer leaf citation
      to its parent hit's exact profile.variant_id. A leaf is benchmark-relevant iff that ID
      is in case.relevant_variant_ids. Valid hit-header Hxxx citations are excluded from the
      fidelity denominator because TASK-129 does not treat them as leaf grounding.
    - >
      GroundedCitationFidelity must be frozen and contain exactly six fields:
      case_evaluation, answer, leaf_citation_ids, relevant_leaf_citation_ids,
      irrelevant_leaf_citation_ids, fidelity. answer is the exact supplied GroundedAnswer.
      All citation tuples preserve answer.citation_ids order after the required filtering.
      fidelity is Fraction(relevant_leaf_count, leaf_count) when at least one leaf exists and
      None when there are zero leaf citations.
    - >
      TASK-164 must never interpret answer.answer_text or source evidence text, grade semantic
      entailment, infer factual correctness, reopen omitted evidence, parse rendered RAG JSON,
      fabricate citation blocks, or accept a citation not already structurally valid under
      the exact GroundedAnswer.
    - >
      Successful evaluation is pure deterministic in-memory computation over caller-supplied
      values plus exact TASK-122 delegation. It performs zero TASK-134 query planning,
      provider/model invocation, prompt/answer generation, SQLite/filesystem/network/browser/
      Drive work, environment reads, clock/random/UUID, subprocess, queue, cache, admission,
      M2 ranking/scoring, evidence mutation, or product-truth reconciliation.
    - >
      Do not modify canonical_profile.py, canonical_retrieval.py,
      canonical_rag_context.py, grounded_answer.py, grounded_query_planning.py,
      persistent_grounded_qa.py, ranking/scoring, canonical catalog modules, ProductSourcePack
      models/serialization, or any prior authority. TASK-164 evaluates public values only.
    - >
      Add docs/PHASE_6_P6_1_RETRIEVAL_QUALITY_EVALUATION.md defining P6.1a and explicitly
      separating benchmark relevance from canonical product truth, M2 business ranking,
      TASK-122 retrieval semantics, and semantic entailment. Update both canonical roadmaps
      to record TASK-163/P6.0 CLOSED, P6.1 CURRENT, TASK-164 as the P6.1a evaluation-contract
      gate, P6.1b NEXT for real acquired marketplace evidence benchmark execution using this
      evaluator, and P6.2 FUTURE/blocked until P6.1b empirical evidence justifies a specific
      retrieval improvement.
    - >
      Focused tests must cover exact module/public API, immutability and field shape, invalid
      cases/labels/limit, duplicate case IDs, once-per-case TASK-122 delegation with one
      materialized corpus, unchanged TASK-122 error propagation, absent gold-ID rejection,
      hit-order TP/FP, Human-order FN, zero-hit precision, exact Fraction metrics, micro
      aggregation, case-order preservation, corpus-permutation determinism inherited from
      TASK-122, context/question/query/limit/hit mismatch rejection, witness/supplemental/
      hit-header citation classification, relevant/irrelevant citation order, zero-leaf
      fidelity=None, no answer-text interpretation, repeated determinism, and no forbidden
      model/I/O/retrieval-reimplementation behavior.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      TASK-164 adds exactly the bounded evaluation error, benchmark case, case/report/fidelity
      immutable values, and two evaluator functions, with no new retrieval, planner, provider,
      persistence, ranking, semantic-search, or truth-resolution API.
  - id: AC2
    condition: >
      RetrievalBenchmarkCase strictly validates bounded exact case/question/query values and
      non-empty unique Human relevant_variant_ids while preserving accepted strings/order and
      assigning no canonical truth semantics to labels.
  - id: AC3
    condition: >
      Lexical evaluation materializes inputs once, rejects invalid/duplicate cases and invalid
      limit, delegates exactly once per case to TASK-122 with exact corpus/query/limit,
      propagates TASK-122 failures unchanged, and never reimplements retrieval.
  - id: AC4
    condition: >
      Gold IDs bind only to the validated corpus; each case result retains exact case, limit,
      and TASK-122 hits, preserves hit order for TP/FP and Human label order for FN, and adds
      no relevance source beyond explicit benchmark membership.
  - id: AC5
    condition: >
      Per-case and micro precision/recall use exact Fraction arithmetic with specified zero-hit
      behavior, exact aggregate counts, exact caller case order, and no extra metric policy.
  - id: AC6
    condition: >
      Citation evaluation requires exact question/query/limit and value-equal TASK-122 hit
      continuity between case evaluation and GroundedAnswer context; unrelated contexts fail
      closed and evaluation never reruns retrieval/context construction.
  - id: AC7
    condition: >
      Fidelity maps only already-valid leaf citations to parent hit variants, excludes hit
      headers from its denominator, preserves answer citation order, returns exact relevant/
      irrelevant leaf tuples, exact Fraction when leaves exist, and None when none exist.
  - id: AC8
    condition: >
      TASK-164 never grades answer wording or semantic entailment and keeps Human benchmark
      relevance distinct from canonical product truth, M2 ranking/approval, TASK-122 retrieval
      semantics, and TASK-129 structural grounding.
  - id: AC9
    condition: >
      Successful evaluation performs no model/provider/query-planning, persistence/filesystem/
      SQLite/network/browser/Drive, environment, clock/random/UUID, subprocess, admission,
      ranking/scoring, evidence mutation, or semantic/vector retrieval work, and predecessor
      implementation modules remain unchanged.
  - id: AC10
    condition: >
      Focused regressions pass and canonical roadmaps record P6.0 CLOSED after TASK-163,
      P6.1 CURRENT, TASK-164 as P6.1a, P6.1b as next real-evidence benchmark execution,
      and P6.2 blocked until reviewed empirical P6.1b evidence exists.

verification:
  required:
    - '$env:PYTHONPATH = ".;src"; python -m pytest tests/product_intelligence/test_canonical_retrieval.py tests/product_intelligence/test_canonical_rag_context.py tests/product_intelligence/test_grounded_answer.py tests/product_intelligence/test_retrieval_quality_evaluation.py -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - 'git diff --check; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
