non_goals:
  - Execute the selected TikTok PDP, open a real browser, call a real CDP endpoint, or acquire live evidence during TASK-233 engineering or verification.
  - Modify TikTokPdpCollector, ProductCandidateSnapshot, SignalEvidence, SnapshotNormalizer, canonical identity/catalog, scoring, ranking, recommendation, approval, persistence, P7.3-P7.7, or P8.0 semantics.
  - Modify BrowserManager, BrowserSession, PlaywrightBrowserManager, PlaywrightBrowserSession, CDP lifecycle, browser profile ownership, login behavior, or session binding semantics.
  - Modify or generalize src/product_intelligence/live_capture.py, Shopee capture, TikTokDiscoveryAdapter, ProductSourcePack, TikTokSourceExtractor, TikTokScrapeTool, Drive, media capture, downloader, or source-pack semantics.
  - Add search, similar-listing discovery, batch capture, multiple listing inputs, scheduler, queue, watcher, recurring observation, automatic retry, auto-resume, proxy, stealth, evasion, CAPTCHA solver, or credential/session capture.
  - Access TikTok Affiliate UI, affiliate eligibility, commission, estimated commission, creator/video/similar-listing metrics, inventory expansion, Wave 2, velocity, trend, forecast, audience fit, or competition saturation.
  - Persist cookies, tokens, credentials, raw HTML, browser-profile paths, CDP endpoint values, private messages, or unsafe screenshots into repository or live-pilot artifacts.
  - Freeze or ingest the live output into canonical repository evidence, create P7.4/P7.5 state, authorize TEST_READY, market test, spend, traffic, content publication, price/inventory mutation, winner judgment, or commerce action.
  - Automatically execute a live capture immediately after TASK-233 publication.

constraints:
  hard:
    - >
      Classification is exactly ONE_SHOT_LIVE_PUBLIC_PDP_PILOT_ENABLEMENT_AND_AUTHORIZATION.
      Human authorization is listing-specific and operation-specific. Engineering publication
      enables the Human-operated carrier but does not itself perform the live operation.
    - >
      Create src/product_intelligence/tiktok_pdp_live_pilot.py as orchestration only. It must not
      own marketplace semantics, parsing, browser lifecycle, evidence truth, ranking, approval or
      persistence. It may instantiate the existing PlaywrightBrowserManager with an explicit
      operator-supplied CDP endpoint, borrow one BrowserSession through the manager, invoke the
      already-published TikTokPdpCollector exactly once, and write one bounded safe result artifact
      under an explicit external job root.
    - >
      The operation target is exactly the selected listing source ID 1731381331718341815 and exact
      stable URL https://shop.tiktok.com/vn/pdp/den-led-cam-bien-chuyen-dong-3-che-do-sang-sac-usb-c/1731381331718341815.
      The operation carrier must not accept an arbitrary product URL, source ID, query, batch,
      platform or listing override. Hard-coding these values is permitted only in this
      operation-specific authorization carrier and must not alter the reusable collector/parser.
    - >
      Add one Human-facing CLI command under src/product_intelligence/cli.py for this exact live
      pilot. It must require an explicit external --job-root and explicit operator-owned
      --cdp-endpoint. It must not accept query/search/product/source overrides, credentials,
      cookies, browser-profile paths, affiliate parameters, retry counts, or automation cadence.
    - >
      The CDP endpoint is operator input only and must never be written verbatim into the live
      artifact, roadmap, logs emitted by the carrier, deterministic fixtures, or repository
      state. If binding provenance is useful, persist only an opaque digest produced by existing
      browser/session authority where safely available.
    - >
      The carrier must use an explicit operation timestamp generated at invocation and pass a
      timezone-aware observed_at to TikTokPdpCollector. Tests must inject deterministic time;
      engineering verification must not depend on wall clock.
    - >
      A successful invocation may serialize only one safe bounded document containing operation
      status, exact context/source identity, safe requested/observed URL binding, observation time,
      the existing ProductCandidateSnapshot V1 fields, and transport-only binding basis. It must
      not serialize raw HTML, cookies, headers, tokens, credentials, browser profile paths,
      arbitrary page text, screenshots, media, Affiliate values, or fields outside TASK-231 V1.
    - >
      The external job root must be explicit, must resolve outside the Git repository, and the
      operation artifact must be created fail-closed without silently overwriting an existing
      capture. A fresh live authorization represents at most one attempted exact-listing
      operation; no automatic retry or second capture may occur inside one invocation.
    - >
      CAPTCHA/security challenge, login wall, unavailable page, access block, navigation/evaluation
      failure, identity mismatch/conflict/unverifiability, or missing required title must produce
      a bounded non-success outcome with zero snapshot fields promoted as evidence. The carrier
      must not automatically solve, retry, resume, rebind, refresh, proxy, stealth, evade or bypass.
      If Human intervention resolves a challenge, any later second live attempt requires a fresh
      Human/Brain authorization.
    - >
      The carrier must not call session.close(), manager.close_session(), manager.close_all(), or
      otherwise terminate the Human-owned browser. Browser/session lifetime remains under existing
      browser authority and Human/operator control.
    - >
      A successful one-shot capture remains source evidence for Human review only. It must not be
      auto-normalized into SignalEvidence, persisted into canonical Product Intelligence state,
      scored, ranked, approved, converted to trend/velocity, used to construct P7.4/P7.5, or
      interpreted as TEST_READY, recommendation, decision, market-test evidence or Product Truth.
    - >
      Deterministic tests must use fake manager/session/collector/time/filesystem boundaries only.
      No test may access TikTok, external network, real Playwright/CDP, browser profiles,
      credentials, provider/LLM, Drive or wall clock.
    - >
      Tests must prove: exact target is fixed and cannot be overridden; exactly one collector
      invocation occurs; caller-supplied CDP endpoint reaches browser manager but is absent from
      persisted output; job root inside repository fails closed; existing artifact is not
      overwritten; successful output contains only the bounded safe schema; challenge/login,
      identity failure and extraction failure create no successful snapshot; no automatic retry
      occurs; Human-owned browser is never closed; observed_at is timezone-aware; and no Affiliate,
      Product Source, scoring/ranking/approval or canonical persistence dependency is introduced.
    - >
      Add docs/PHASE_8_PUBLIC_TIKTOK_PDP_LIVE_PILOT_AUTHORIZATION.md recording the Human approval,
      exact target, one-attempt limit, operator ownership, safe-artifact contract, challenge stop,
      zero automatic retry, no Affiliate dependency, source-evidence-only meaning and post-capture
      Human review gate.
    - >
      Update both canonical roadmaps and .ai/roadmap-state.yaml only publication-gated. Preserve
      TASK-228 through TASK-232 history and exact TASK-232 source
      cf68d388c740cca66194bc04dafbb12e86cf8049. On exact reviewed TASK-233 publication record:
      live_public_pdp_acquisition_authority ONE_SHOT_EXACT_LISTING_ONLY; authorized_source_id
      1731381331718341815; authorized_capture_attempts 1; capture_execution_owner HUMAN_OPERATOR;
      automatic_live_pilot false; automated_public_pdp_acquisition_authority NONE;
      market_test_or_action_authority NONE; real_pilot_executed false; live_evidence_acquired
      false; next_milestone null; pending_commitments empty; and handoff exactly
      HUMAN_OPERATOR_ONE_SHOT_PUBLIC_PDP_CAPTURE_EXECUTION.
    - >
      Do not mark real_pilot_executed or live_evidence_acquired true merely because authorization
      or carrier implementation is published. Those values may change only after a later
      observed live operation and explicit Human/Brain review.
    - >
      Extend governance regression additively to prove one-shot listing-specific authorization,
      fixed target, one-attempt limit, no automatic progression, operator-owned browser/session,
      public-PDP/Affiliate separation, source-evidence-only semantics, external artifact boundary,
      null NEXT and exact Human-operator handoff.
    - >
      Modify only the nine authorized paths. Produce one candidate and one ResultPackage.
      Runtime owns deterministic verification; Executor must not perform the live capture,
      publish, or start a successor.

acceptance:
  - id: AC1
    condition: >
      One narrow Human-operated TikTok PDP live-pilot carrier exists and only orchestrates existing
      browser/session authority plus the published TikTokPdpCollector; it introduces no duplicate
      marketplace, parser, evidence, Product Source, Affiliate, ranking, approval or persistence owner.
  - id: AC2
    condition: >
      The live-pilot target is fixed to context p8-pilot-001-led-motion-tiktok-vn, source ID
      1731381331718341815 and the exact stable URL, with no arbitrary target/search/batch override
      and at most one attempted capture per Human authorization/invocation.
  - id: AC3
    condition: >
      The Human-facing CLI requires only explicit external job root and operator-owned CDP endpoint,
      never persists the endpoint value, does not own or close the Human browser, and exposes no
      credential, retry, scheduler, Affiliate or generic crawler controls.
  - id: AC4
    condition: >
      Success writes one exclusive safe external artifact containing only bounded operation,
      exact-binding and ProductCandidateSnapshot V1 data; challenge/login/access/identity/extraction
      failures fail closed without a successful snapshot and without automatic retry/resume.
  - id: AC5
    condition: >
      Deterministic offline tests prove fixed target, one invocation, external-root enforcement,
      exclusive artifact creation, CDP secrecy, browser non-closure, timezone-aware observation,
      challenge/identity/extraction failure handling, no retry and absence of forbidden dependencies.
  - id: AC6
    condition: >
      The authorization document and governance regression preserve SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY,
      EVIDENCE_IS_NOT_PRODUCT_TRUTH, SNAPSHOT_IS_NOT_TREND, public-PDP/Affiliate separation, source-evidence-only
      meaning and the mandatory Human review gate after any successful live capture.
  - id: AC7
    condition: >
      On exact reviewed TASK-233 publication, roadmap state records one-shot exact-listing live
      acquisition authority with one authorized attempt, Human operator execution ownership,
      automatic/automated acquisition still disabled, no live evidence yet, no real pilot yet,
      null next milestone, empty pending commitments and exact handoff
      HUMAN_OPERATOR_ONE_SHOT_PUBLIC_PDP_CAPTURE_EXECUTION.
  - id: AC8
    condition: >
      Exactly the nine authorized paths change; focused pytest and git diff --check pass with zero
      unresolved items, producing one candidate eligible for independent PRIMARY semantic review
      and exact safe publication without executing TikTok live.

