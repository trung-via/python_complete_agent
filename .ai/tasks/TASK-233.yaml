task_id: TASK-233
revision: 1

goal: >
  Canonicalize the Human-approved one-shot live public TikTok PDP pilot authorization for the
  selected P8 listing and implement only the missing Human-operated invocation carrier needed to
  execute that one bounded live capture after publication. Reuse the exact reviewed
  TikTokPdpCollector, canonical parser, and existing Playwright browser/session authority. Do not
  execute TikTok live inside this task, do not broaden collection scope, and do not authorize
  recurring acquisition, Affiliate access, market testing, ranking, approval, recommendation,
  or commerce action.

problem: >
  TASK-232 is published exactly at cf68d388c740cca66194bc04dafbb12e86cf8049 and the canonical
  roadmap hands control to HUMAN_BRAIN_LIVE_PUBLIC_PDP_PILOT_AUTHORIZATION. The Human has now
  explicitly approved proceeding to one live public-PDP pilot for the already-selected listing
  source ID 1731381331718341815. The reusable collector capability exists and is independently
  reviewed/published, but repository inspection shows TikTokPdpCollector is referenced only by
  offline tests and has no production Human-facing invocation path. The existing generic
  Product Intelligence capture runner is Shopee-specific and must not be reinterpreted as the
  TikTok PDP pilot carrier. Therefore the smallest correct next step is to add one narrow
  Human-operated TikTok PDP live-pilot carrier plus CLI entrypoint and to record the exact
  one-shot authorization, without performing the live marketplace operation during deterministic
  engineering execution.

assumptions:
  - >-
    Canonical main at authoring is cf68d388c740cca66194bc04dafbb12e86cf8049.
  - >-
    TASK-232 is published, implementation_exists is true, and the exact handoff is HUMAN_BRAIN_LIVE_PUBLIC_PDP_PILOT_AUTHORIZATION.
  - >-
    The Human has explicitly authorized one bounded live public-PDP pilot for context p8-pilot-001-led-motion-tiktok-vn.
  - >-
    The authorized external source ID is 1731381331718341815 and the exact stable listing reference is https://shop.tiktok.com/vn/pdp/den-led-cam-bien-chuyen-dong-3-che-do-sang-sac-usb-c/1731381331718341815.
  - >-
    TikTokPdpCollector remains the sole bounded exact-PDP collection capability under Product Intelligence and ProductCandidateSnapshot remains the canonical observation contract.
  - >-
    src/product_intelligence/adapters/tiktok_parsing.py remains the one canonical TikTok parser authority.
  - >-
    PlaywrightBrowserManager and BrowserSession remain browser/session lifecycle authorities; the Human/operator owns the already-running Chrome/CDP login/session context.
  - >-
    The existing src/product_intelligence/live_capture.py runner is Shopee-specific and must not be reused or generalized for this TikTok PDP pilot.
  - >-
    P8.2 requires live artifacts to remain outside repository planning state, forbids automated CAPTCHA solving/retry/proxy/stealth/evasion, and requires Human review before any later deterministic freeze/replay.
  - >-
    Public PDP V1 is independent from authenticated TikTok Affiliate eligibility/economics.
  - >-
    SNAPSHOT_IS_NOT_TREND, SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY, EVIDENCE_IS_NOT_PRODUCT_TRUTH, CAPABILITY_IS_NOT_AUTHORITY, and ONE_CAPABILITY_ONE_AUTHORITY remain mandatory.
  - >-
    Human-owned market-test inputs such as budget, duration, audience, contribution-margin threshold, exposure limits, success/failure criteria and risk acceptance remain unset and are not required merely to perform this bounded evidence-capture pilot.

