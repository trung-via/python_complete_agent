task_id: TASK-136
revision: 1

goal: >
  Close Phase 6 M4 by certifying the already-implemented grounded Product Intelligence
  application vertical slice from persisted canonical knowledge and explicit persisted
  source evidence through deterministic query planning, canonical RAG context,
  provider-neutral grounded invocation, and validated GroundedAnswer. TASK-136 is a
  phase-completion/certification task only: it must add no new Product Intelligence
  runtime behavior, public API, model/provider semantics, retrieval semantics, storage,
  discovery, or answer authority.

problem: >
  The Phase 6 M4 roadmap established in TASK-129 explicitly deferred six capabilities:
  deterministic prompt packaging, generic LLMProvider invocation, grounded QA service,
  retrieval-query planning, restart-capable persistent application orchestration, and
  end-to-end vertical-slice certification. TASK-131 through TASK-135 now implement the
  first five while preserving M2/M3 authorities, and TASK-135 already contains an offline
  deterministic persisted-knowledge-to-GroundedAnswer vertical slice using a fake
  provider. What remains is not another application service or semantic layer; it is the
  one-time phase-transition certification and durable completion record proving that the
  existing authorities compose successfully and that the full Product Intelligence
  regression suite remains healthy.

assumptions:
  - >
    Canonical Python Agent main before TASK-136 authoring is
    76fcd88f31019a306c6daaa98ae37f6a3fd4e09b, whose parent
    7b9b2a1c09c86da734191063029a17296cd6eaf5 is the published TASK-135 source
    candidate and whose only additional delta hardens ChatGPT Brain REPAIR policy.
  - >
    The authoritative AIOS dependency remains exactly
    aios-renew @ git+https://github.com/trung-via/AIOS-renew.git@67db82bf19d63f25721d06aabb82d850db8b78d4.
  - >
    TASK-129 owns GroundedAnswer structure/validation; TASK-131 owns deterministic
    provider-neutral prompt packaging; TASK-132 owns exactly-one generic provider
    invocation and response parsing; TASK-133 owns context-to-answer composition;
    TASK-134 owns deterministic natural-question-to-retrieval_query planning; TASK-135
    owns persisted startup/composition over the complete canonical variant corpus.
  - >
    TASK-120/121/122/123/124/125 remain the M3 persistence, profile, lexical retrieval,
    grounded-context, packing, and typed source-evidence rehydration authorities.
  - >
    TASK-130 is repository publication/control-plane wiring only and owns no M4 Product
    Intelligence semantics.
  - >
    The existing tests/product_intelligence/test_persistent_grounded_qa.py already proves
    the offline persisted catalog + explicit source manifests + deterministic fake
    provider path and therefore should be certified rather than duplicated by another
    parallel vertical-slice implementation.

scope:
  inspect:
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - docs/PHASE_6_M3_COMPLETION.md
    - docs/PHASE_6_M4_GROUNDED_ANSWER.md
    - docs/PHASE_6_M4_GROUNDED_PROMPT.md
    - docs/PHASE_6_M4_GROUNDED_INVOCATION.md
    - docs/PHASE_6_M4_GROUNDED_QA.md
    - docs/PHASE_6_M4_QUERY_PLANNING.md
    - docs/PHASE_6_M4_PERSISTENT_GROUNDED_QA.md
    - .ai/tasks/TASK-129.yaml
    - .ai/tasks/TASK-130.yaml
    - .ai/tasks/TASK-131.yaml
    - .ai/tasks/TASK-132.yaml
    - .ai/tasks/TASK-133.yaml
    - .ai/tasks/TASK-134.yaml
    - .ai/tasks/TASK-135.yaml
    - src/product_intelligence/grounded_answer.py
    - src/product_intelligence/grounded_prompt.py
    - src/product_intelligence/grounded_invocation.py
    - src/product_intelligence/grounded_qa.py
    - src/product_intelligence/grounded_query_planning.py
    - src/product_intelligence/persistent_grounded_qa.py
    - tests/product_intelligence/test_persistent_grounded_qa.py

  modify:
    - docs/PHASE_6_M4_COMPLETION.md
    - docs/PHASE_6_M4_GROUNDED_ANSWER.md
    - docs/PHASE_6_M4_PERSISTENT_GROUNDED_QA.md

non_goals:
  - Modify any src/ Product Intelligence, product_source, provider, AgentController,
    scraper, browser, Drive, worker, AIOS, or runtime implementation file.
  - Add or modify any public Python API, data class, enum, exception, provider protocol,
    service class, application entry point, CLI, HTTP endpoint, queue, background worker,
    cache, registry, or persistence format.
  - Add another vertical-slice test that duplicates the already-existing TASK-135
    persisted grounded QA integration path merely to increase test count.
  - Modify TASK-120 through TASK-135 semantic authority, signatures, ordering, validation,
    retrieval, context, prompt, invocation, answer, startup, or publication behavior.
  - Add provider-specific live API integration, credentials, network calls, live-provider
    certification, model selection, retry/fallback/reroute, tool execution, or AgentLoop
    behavior.
  - Add automatic manifest discovery, filesystem scanning/globbing, Drive enumeration,
    source-pack registry/indexing, marketplace collection, browser work, or media work.
  - Add embeddings/vector search, BM25/FTS, reranking, semantic retrieval, query expansion,
    product ranking/recommendation, autonomous approval, product-truth reconciliation,
    preferred/latest/majority evidence selection, identity evolution, or migrations.
  - Claim semantic entailment, factual correctness, completeness, hallucination freedom,
    prompt-injection immunity, product truth, or recommendation/approval authority.
  - Invent or name a post-M4 milestone as canonical architecture. The next capability
    boundary must be designed separately after M4 is canonically closed.

constraints:
  hard:
    - >
      TASK-136 is documentation-and-certification only. The committed TASK delta after
      execution may modify exactly the three documentation paths in scope.modify and no
      product/test/runtime/worker file. Do not create a new implementation module or test
      file.
    - >
      Add docs/PHASE_6_M4_COMPLETION.md as the single M4 completion record. It must define
      M4 as complete only when the canonical TASK-136 Runtime verification result is PASS
      and the candidate receives semantic review PASS; documentation alone must not claim
      completion independently of runtime evidence.
    - >
      The completion record must identify the exact completed application boundary as:
      persisted TASK-120 canonical SQLite catalog + caller-supplied explicit TASK-125
      Product Source Pack manifests + natural-language question + injected generic
      LLMProvider -> TASK-135 persistent composition -> TASK-121 profile corpus ->
      TASK-134 retrieval_query planning -> TASK-123/TASK-124 canonical grounded context ->
      TASK-131 prompt package -> TASK-132 exactly-one provider invocation/parsing ->
      TASK-129 validated GroundedAnswer, with TASK-133 owning the context-to-answer
      composition between prompt/invocation/answer authorities.
    - >
      The M4 authority map must list TASK-129, TASK-131, TASK-132, TASK-133, TASK-134, and
      TASK-135 with one bounded owner each. It must explicitly classify TASK-130 as
      publication/control-plane support with zero Product Intelligence semantic
      authority, and preserve all M2/M3 authorities unchanged.
    - >
      The completion record must state that TASK-135's existing deterministic fake-provider
      restart integration is the M4 vertical-slice subject. Do not claim live provider
      certification: the certification proves the application/provider protocol
      composition offline, not any external provider account, network availability,
      model quality, or provider-specific behavior.
    - >
      Phase-level certification must run the focused existing
      tests/product_intelligence/test_persistent_grounded_qa.py regression plus the
      complete tests/product_intelligence suite exactly once on the final TASK-136
      candidate, in addition to git diff integrity. This is a one-time M4 phase-transition
      health gate and must not become a requirement to rerun the full subsystem suite for
      every future narrow FIX/REPAIR.
    - >
      docs/PHASE_6_M4_GROUNDED_ANSWER.md must replace its original deferred-M4 list with a
      durable milestone status map showing that TASK-131 prompt packaging, TASK-132
      provider invocation, TASK-133 grounded QA composition, TASK-134 query planning,
      TASK-135 persistent application startup, and TASK-136 M4 vertical-slice
      certification close the originally deferred M4 roadmap. Do not rewrite the
      authority or GroundedAnswer semantics established by TASK-129.
    - >
      docs/PHASE_6_M4_PERSISTENT_GROUNDED_QA.md must clarify that TASK-135 remains the
      runtime persistent-application authority while TASK-136 adds no runtime behavior and
      only certifies/records M4 closure. Do not shift persistent startup or composition
      ownership into the completion document/task.
    - >
      Post-M4 deferred capabilities must be clearly separated from M4 blockers. At minimum
      retain as deferred: live-provider certification/network credentials, automatic
      manifest/filesystem/Drive discovery, HTTP/API/CLI presentation, background serving,
      caches/registries, semantic/vector retrieval, product-truth reconciliation,
      preferred/latest/majority selection, semantic entailment/factual-truth guarantees,
      autonomous recommendation/approval, identity evolution, and migrations.
    - >
      Completion documentation must not fabricate future canonical RUN IDs, RESULT IDs,
      evidence IDs, source-candidate SHAs, or test counts that are not knowable before
      Runtime execution. It may record the exact required verification commands and state
      that immutable command results live in canonical AIOS RESULT/EVIDENCE lineage.
      Semantic review must verify those actual artifacts after execution.
    - >
      The completion record must not invent Phase 6 M5 or any other post-M4 architecture
      name. It must state that the next Product Intelligence boundary is intentionally
      undecided until a fresh post-M4 Brain audit establishes one owner and roadmap.
    - Do not push from Executor execution.

acceptance:
  - id: AC1
    condition: >
      docs/PHASE_6_M4_COMPLETION.md exists and defines Phase 6 M4 completion as contingent
      on TASK-136 canonical Runtime PASS plus semantic review PASS, without adding runtime
      behavior or fabricating future evidence identifiers/results.
  - id: AC2
    condition: >
      The completion record accurately describes the persisted-knowledge-to-GroundedAnswer
      vertical slice and preserves the sole authorities of TASK-120/121/122/123/124/125,
      TASK-129, TASK-131/132/133/134/135 while classifying TASK-130 only as publication
      support.
  - id: AC3
    condition: >
      M4 documentation records the original TASK-129 deferred roadmap as satisfied by
      TASK-131 through TASK-136 and no longer leaves end-to-end vertical-slice
      certification ambiguously open after TASK-136 PASS.
  - id: AC4
    condition: >
      TASK-135 remains the sole persistent grounded-QA runtime composition authority;
      TASK-136 introduces no source module, public API, test duplicate, persistence,
      retrieval, provider, prompt, answer, or startup semantics.
  - id: AC5
    condition: >
      Completion documentation explicitly limits certification to deterministic offline
      fake-provider protocol composition and does not claim live-provider/model/network
      certification or semantic/factual truth guarantees.
  - id: AC6
    condition: >
      Post-M4 deferred capabilities are documented as separate future work rather than
      unfinished M4 blockers, and no Phase 6 M5 or other future semantic authority is
      invented by TASK-136.
  - id: AC7
    condition: >
      The existing TASK-135 persistent grounded-QA focused regression passes on the final
      TASK-136 documentation candidate without any product/test code changes.
  - id: AC8
    condition: >
      The complete tests/product_intelligence suite passes exactly once on the final
      TASK-136 candidate as the M4 phase-transition health gate; this does not establish a
      new full-suite requirement for future narrow corrections.
  - id: AC9
    condition: >
      git diff --check passes and the committed TASK-136 execution delta contains only
      docs/PHASE_6_M4_COMPLETION.md, docs/PHASE_6_M4_GROUNDED_ANSWER.md, and
      docs/PHASE_6_M4_PERSISTENT_GROUNDED_QA.md.

verification:
  required:
    - '$env:PYTHONPATH = ".;src"; python -m pytest tests/product_intelligence/test_persistent_grounded_qa.py -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - '$env:PYTHONPATH = ".;src"; python -m pytest tests/product_intelligence -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - 'git diff --check; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
