task_id: TASK-199
revision: 1

goal: >
  Establish the canonical Python Agent Product Contract as the durable WHAT layer
  beneath the Constitution and above phase/architecture/task documentation. The
  contract must translate the published Intelligence philosophy into stable
  product/domain promises: Python Agent reduces decision-relevant uncertainty by
  preserving the chain from attributable observation and evidence through
  knowledge state, falsifiable hypotheses, auditable intelligence, authorized
  decision/action, outcomes, and learning. It must preserve current M2/M3/M4/P6/P7
  semantic owners rather than becoming a second detailed authority.

problem: >
  Python Agent now has a canonical Manifesto (WHY) and Constitution (highest
  enforceable governance), while the Brain-owned roadmap identifies
  PYTHON_AGENT_PRODUCT_CONTRACT as the unique NEXT Governance Foundation
  milestone. Existing Product Intelligence documentation already owns detailed
  semantics for discovery/scoring/ranking/Human approval, source evidence,
  canonical identity, catalog/persistence, retrieval/RAG context, grounded
  answers, product-truth reconciliation, and evidence-quality measurement.
  The missing layer is a durable product contract that states WHAT Python Agent
  promises across those capabilities and future composable Commerce Intelligence.
  The first Product Contract draft over-emphasized evidence/identity/truth/retrieval
  boundaries and under-specified the Manifesto's central Intelligence loop:
  Knowledge State -> Hypothesis -> Intelligence -> Decision -> Action -> Outcome
  -> Learning. This TASK must close that gap without copying Manifesto philosophy
  verbatim, inventing new runtime behavior, or stealing ownership from lower
  canonical domain authorities.

assumptions:
  - >
    Canonical python_complete_agent main at TASK authoring is
    1e60bf2bc0e3d180922770dab078b097dd59dfab.
  - >
    docs/PYTHON_AGENT_MANIFESTO.md is canonical published WHY. Its durable loop is
    Observation/Signal -> Evidence -> Knowledge State -> Hypothesis -> Intelligence
    -> Decision -> Action -> Outcome -> Learning.
  - >
    docs/PYTHON_AGENT_CONSTITUTION.md is canonical highest enforceable governance
    and Product Contract is subordinate to it.
  - >
    .ai/roadmap-state.yaml records PYTHON_AGENT_GOVERNANCE_FOUNDATION as the sole
    ACTIVE track and PYTHON_AGENT_PRODUCT_CONTRACT as the unique NEXT milestone;
    CHATGPT_PROJECT_CONTRACT_RECONCILIATION remains NOT_DONE.
  - >
    TASK-198 recovery is complete and the sole active downstream AIOS authority is
    exactly a3b723b49cd65677f548c5694a52a6fc006a9e2a. This TASK does not migrate
    or otherwise alter AIOS authority.
  - >
    Existing lower semantic owners remain authoritative. M2 owns current
    discovery/scoring/ranking/advisory recommendation and Human approval. M3 owns
    canonical family/variant identity, catalog/persistence, evidence-preserving
    profiles, lexical retrieval, and grounded-context construction. M4 owns
    structurally grounded-answer contracts/composition without factual-truth or
    approval authority. P6.3 owns the current bounded Human-governed descriptive
    truth-reconciliation foundation. P7 evaluation/measurement authorities measure
    evidence coverage/quality without selecting winners or authorizing enrichment.
  - >
    The Product Contract owns durable product/domain promises and architecture
    boundaries only. It translates Manifesto WHY into product WHAT; it does not
    become a second detailed owner for existing algorithms, schemas, persistence,
    runtime, publication, or task-local semantics.

scope:
  inspect:
    - docs/PYTHON_AGENT_MANIFESTO.md
    - docs/PYTHON_AGENT_CONSTITUTION.md
    - docs/CHATGPT_PROJECT_CONTRACT.md
    - .ai/roadmap-state.yaml
    - .ai/aios-adoption-state.yaml
    - .ai/tasks/TASK-194.yaml
    - .ai/tasks/TASK-196.yaml
    - .ai/tasks/TASK-197.yaml
    - .ai/tasks/TASK-198.yaml
    - docs/PHASE_6_M2_PRODUCT_INTELLIGENCE.md
    - docs/PHASE_6_M3_COMPLETION.md
    - docs/PHASE_6_M4_GROUNDED_ANSWER.md
    - docs/PHASE_6_P6_3_PRODUCT_TRUTH_RECONCILIATION.md
    - docs/PHASE_7_P7_0_WINNING_PRODUCT_EVIDENCE_QUALITY.md
    - docs/PHASE_7_P7_1_REAL_EVIDENCE_COVERAGE_BASELINE.md
    - docs/POST_M4_PRODUCT_INTELLIGENCE_ROADMAP.md
    - docs/POST_P5_P6_QUALITY_SCALE_ROADMAP.md
    - tests/governance/test_python_agent_manifesto.py
    - tests/governance/test_python_agent_constitution.py

  modify:
    - docs/PYTHON_AGENT_PRODUCT_CONTRACT.md
    - tests/governance/test_python_agent_product_contract.py

non_goals:
  - >
    Modify Python Agent production source, Product Intelligence behavior, scoring
    weights/formulas, ranking logic, approval semantics, identity algorithms,
    catalog codecs, SQLite behavior, retrieval matching, RAG packing, grounded
    answer schemas, product-truth reconciliation algorithms, evidence collectors,
    P7 evaluators, or any current domain implementation.
  - >
    Modify docs/PYTHON_AGENT_MANIFESTO.md, docs/PYTHON_AGENT_CONSTITUTION.md,
    docs/CHATGPT_PROJECT_CONTRACT.md, any phase/roadmap document,
    .ai/roadmap-state.yaml, .ai/aios-adoption-state.yaml, TASK contracts, worker
    surfaces, Brain ingress, publication workflow, or the AIOS dependency pin.
  - >
    Create a second evidence, identity, product-truth, ranking, approval,
    persistence, retrieval, RAG-context, grounded-answer, measurement, decision,
    action, publication, or governance authority.
  - >
    Define a production Hypothesis store, Intelligence engine, decision engine,
    outcome database, learning service, calibration algorithm, Value-of-Information
    formula, policy optimizer, or feedback-loop runtime. This TASK defines durable
    product boundaries only.
  - >
    Freeze exact marketplaces, providers, models, databases, browser transports,
    score weights, thresholds, confidence formulas, filenames, TASK IDs, or AIOS
    versions as permanent product architecture.
  - >
    Claim that Product Contract publication implements Media Intelligence,
    Distribution Intelligence, Commerce Operations Intelligence, broad
    cross-platform coverage, autonomous optimization, semantic/vector retrieval,
    identity evolution, automated review, background serving, closed-loop
    optimization, or any other currently unimplemented capability.
  - >
    Advance the Brain-owned roadmap to ChatGPT Project Contract reconciliation.
    Product Contract completion requires reviewed source publication followed by a
    fresh Brain reconciliation.
  - >
    Add a governance runtime, policy engine, daemon, automatic roadmap advancement,
    autonomous approval, retry, reroute, or new Human/worker command.
  - >
    Push, publish, merge, or mutate canonical main from Executor implementation.

constraints:
  hard:
    - >
      Create exactly one canonical document at
      docs/PYTHON_AGENT_PRODUCT_CONTRACT.md and one structural regression at
      tests/governance/test_python_agent_product_contract.py. No other file may
      change.
    - >
      The Product Contract must explicitly preserve the four-layer Governance
      Foundation: Manifesto = WHY; Constitution = highest enforceable governance;
      Product Contract = WHAT; ChatGPT Project Contract = HOW. It is subordinate
      to the Constitution and must not reinterpret constitutional roles,
      delegation validity, precedence, amendment, or enforcement mechanics.
    - >
      The Product Contract must translate rather than copy the Manifesto. Its job
      is to state the durable product invariants required so that implementation
      cannot collapse Observation/Evidence, Knowledge State, Hypothesis,
      Intelligence, Decision, Action, Outcome, and Learning into one opaque layer.
    - >
      Define exactly ten ordered top-level product articles with these identifiers
      and titles:
      PC1 PRODUCT_IDENTITY_SCOPE_AND_NORTH_STAR;
      PC2 OBSERVATION_EVIDENCE_UNCERTAINTY_AND_TIME;
      PC3 KNOWLEDGE_IDENTITY_PERSISTENCE_AND_TRUTH_BOUNDARIES;
      PC4 HYPOTHESIS_INTELLIGENCE_AND_DISCONFIRMATION;
      PC5 DISCOVERY_SCORING_RANKING_RECOMMENDATION_AND_APPROVAL;
      PC6 RETRIEVAL_CONTEXT_GROUNDED_ANSWERS_AND_TRUTH;
      PC7 DECISION_QUALITY_VALUE_OF_INFORMATION_AND_CALIBRATION;
      PC8 AUTHORIZED_ACTION_OUTCOME_LEARNING_AND_BOUNDED_AUTOMATION;
      PC9 COMPOSABLE_COMMERCE_INTELLIGENCE_AND_SUBSTRATE_NEUTRALITY;
      PC10 CAPABILITY_HONESTY_EVOLUTION_AND_NON_CLAIMS.
    - >
      PC1 must define Python Agent as the product, Product Intelligence as the
      current trustworthy foundation, and composable Commerce Intelligence as the
      long-term direction. The durable product objective is reduction of
      decision-relevant uncertainty, not maximization of data volume, automation,
      score, model usage, or autonomy. AIOS, models, providers, browsers, runtimes,
      executors, and deployment tooling remain subordinate substrates rather than
      product architecture authority.
    - >
      PC2 must preserve Observation/Signal and Evidence as distinct conceptual
      layers. Product claims begin from attributable evidence carrying provenance
      and time. Missing, stale, conflicting, ambiguous, unavailable, and
      time-sensitive states remain explicit. Absence must not silently become zero,
      false, or certain; one snapshot must not silently become a trend. Observed,
      derived, inferred, estimated, modeled, and predicted claims must remain
      distinguishable at the product boundary without redefining current evidence
      schemas.
    - >
      PC3 must state that Evidence is not Knowledge and preserve a Knowledge State
      capable, in principle, of representing known, unknown, conflicting,
      ambiguous, unavailable, and stale states. It must also preserve source
      evidence, source identity, canonical family/variant identity, catalog
      integrity, representation/rehydration, persistence, evidence-profile, and
      product-truth responsibilities as distinct boundaries. Source listing
      identity, repeated evidence, retrieval hit, or model agreement must never
      silently become canonical family/variant identity or canonical product truth.
      Detailed mechanics remain owned by existing lower canonical authorities.
    - >
      PC4 must introduce no new implementation authority but must establish the
      durable distinction Hypothesis is not Truth. Opportunity, winner, trend,
      audience, creative, future-demand, or similar forward-looking interpretations
      are falsifiable hypotheses unless separately admitted as another semantic
      type. Hypotheses may be supported, contradicted, remain unknown, or become
      stale. Intelligence must preserve material counter-evidence and evidence that
      could falsify or materially change a favored conclusion rather than
      structurally rewarding confirmation-only reasoning.
    - >
      PC4 must define Intelligence at the product boundary as decision-relevant
      meaning developed from admitted evidence/knowledge, explicit hypotheses or
      interpretations where applicable, alternatives, uncertainty, assumptions or
      policy/context, and the decision question being informed. Knowledge is not
      Intelligence; a fluent summary, score, prediction, or model output is not
      Intelligence merely because it is generated.
    - >
      PC5 must preserve discovery, scoring, ranking, recommendation, and approval
      separation. Scores, confidence values, decision bands, shortlists,
      predictions, or recommendations are advisory instruments only. They never
      become canonical approval/admission or Human/legitimately delegated decision
      by implication. Current Human approval authorities remain intact; future
      delegated approval/action requires Constitution-compliant delegation plus an
      explicit later domain authority.
    - >
      PC6 must preserve retrieval relevance, business ranking, identity, grounded
      context, grounded-answer structure, semantic entailment, factual/product
      truth, and approval as distinct layers. Retrieval is not ranking; context is
      not truth; citation or structural grounding does not alone prove semantic
      entailment or objective factual correctness. A grounded answer may expose
      insufficient or conflicting evidence. Model output must never silently
      mutate canonical evidence, identity, product truth, approval, or action.
    - >
      PC7 must state that decision quality is judged ex ante against the evidence,
      alternatives, uncertainty, assumptions, trade-offs, and reasoning available
      at decision time. Intelligence should preserve material alternatives and
      sensitivity to changed assumptions where they could change a decision.
      Metric maximization, score maximization, confidence, benchmark results, or
      later outcomes are not substitutes for decision quality.
    - >
      PC7 must encode Value-of-Information as a durable product boundary without
      prescribing a formula: missing data or technical collectability alone does
      not authorize enrichment. Deeper or more expensive evidence acquisition must
      be justified by expected decision value relative to cost, latency, access
      risk, fragility, and opportunity cost. Measurement identifies uncertainty;
      it does not automatically select the next collector or roadmap item.
    - >
      PC7 must preserve calibrated auditable intelligence. Important conclusions
      must retain inspectable evidence/provenance, uncertainty, assumptions or
      policy/context, and reasoning boundaries. Deterministic claims must remain
      reproducible from explicit inputs/policy/time. Probabilistic confidence is a
      claim, not certainty; when exposed, its semantics must be inspectable and it
      must remain eligible for calibration against later outcomes without
      requiring a particular calibration algorithm.
    - >
      PC8 must define Decision and Action boundaries without duplicating the
      Constitution: Intelligence and Recommendation remain advisory until an
      authorized Human or legitimately delegated decision boundary commits to a
      decision, and action executes only an authorized decision inside its scope.
      Automation cannot invent or widen its own mandate, approval, action, or
      canonical mutation authority.
    - >
      PC8 must define Outcome and Learning boundaries. Outcomes become new
      attributable evidence; they do not retroactively prove that the prior
      decision process, hypothesis, recommendation, score, or methodology was
      correct or incorrect. Learning may update hypotheses, policy, calibration,
      future intelligence, and future decisions while preserving the historical
      evidence, assumptions, decision context, action, and outcome that existed at
      the time. Learning must not rewrite history.
    - >
      PC9 must define Product Intelligence as the canonical foundation over which
      future Media Intelligence, Distribution Intelligence, and Commerce Operations
      Intelligence may compose through explicit interfaces and owners. Composition
      may return downstream actions/outcomes as new attributable observations or
      evidence through admitted feedback paths, but feedback must never directly
      overwrite prior evidence history, canonical identity, product truth,
      ranking, approval, or decision authority. Substrate/provider/model/runtime
      replacement must not change product semantics by itself.
    - >
      PC10 must enforce capability honesty. Implemented, published, certified,
      measured, proposed, deferred, blocked, experimental, and aspirational states
      are not interchangeable. Bounded certification on one cohort, marketplace,
      listing, provider, model, or runtime path must not be generalized into a
      universal quality/capability claim. New product semantics require an explicit
      owner and authorized product change; deferred capabilities remain
      unimplemented until separately admitted.
    - >
      The Product Contract must contain an explicit anti-duplication statement:
      it establishes durable invariants and promises but does not become a second
      detailed authority for existing M2/M3/M4/P6/P7 algorithms, schemas,
      task-local semantics, persistence mechanics, provider behavior, evidence
      acquisition, runtime/lifecycle mechanics, review, or publication.
    - >
      Include these exact durable boundary labels in semantically appropriate
      articles:
      EVIDENCE_IS_NOT_KNOWLEDGE;
      EVIDENCE_IS_NOT_PRODUCT_TRUTH;
      SOURCE_IDENTITY_IS_NOT_CANONICAL_IDENTITY;
      KNOWLEDGE_IS_NOT_INTELLIGENCE;
      HYPOTHESIS_IS_NOT_TRUTH;
      INTELLIGENCE_IS_NOT_DECISION;
      PREDICTION_IS_NOT_TRUTH;
      SCORE_IS_NOT_APPROVAL;
      RETRIEVAL_IS_NOT_RANKING;
      CONTEXT_IS_NOT_TRUTH;
      RECOMMENDATION_IS_NOT_DECISION;
      CONFIDENCE_IS_NOT_CERTAINTY;
      SNAPSHOT_IS_NOT_TREND;
      AUTOMATION_IS_NOT_INTELLIGENCE;
      MEASUREMENT_IS_NOT_AUTHORITY;
      OUTCOME_IS_NOT_RETROACTIVE_PROOF;
      CERTIFICATION_IS_BOUNDED.
      Labels summarize durable boundaries and do not themselves create a new
      semantic authority.
    - >
      The structural regression must verify UTF-8 without BOM, LF line endings,
      exact PC1-PC10 order/titles, the four governance-layer labels, and one
      occurrence of each required durable boundary label. It must not import
      production modules, encode TASK IDs or current AIOS pins, pin current score
      weights/thresholds/formulas, duplicate article prose, infer current/future
      feature completion, or become a second semantic policy engine.
    - >
      Verification must be deterministic and offline with no GitHub/network,
      marketplace/browser/CDP, provider/LLM, Drive, environment, clock,
      random/UUID, or mutable external-state dependency.
    - Do not push from Executor implementation execution.

acceptance:
  - id: AC1
    condition: >
      The Product Contract exists with exact PC1-PC10 structure, preserves the
      four Governance Foundation layers, and states the durable product objective
      as reducing decision-relevant uncertainty rather than maximizing data,
      scores, automation, models, or autonomy.
  - id: AC2
    condition: >
      Observation/Evidence, Knowledge State, identity, persistence, and Product
      Truth remain distinct; uncertainty/time/missingness/conflict remain explicit;
      source identity or evidence cannot silently become canonical identity or
      truth; detailed current mechanics remain with lower owners.
  - id: AC3
    condition: >
      Hypothesis and Intelligence are represented as distinct product layers:
      hypotheses remain falsifiable and disconfirmable, and Intelligence is
      decision-relevant meaning over evidence/knowledge, hypotheses where
      applicable, alternatives, uncertainty, assumptions/context, and the decision
      question rather than a synonym for score, prediction, model output, or
      summary.
  - id: AC4
    condition: >
      Discovery/scoring/ranking/prediction/recommendation remain advisory and
      distinct from decision/approval/admission; retrieval/context/grounded-answer
      structure remain distinct from business ranking, identity, entailment,
      factual/product truth, and approval.
  - id: AC5
    condition: >
      Decision quality is ex-ante and preserves material alternatives, trade-offs,
      assumptions, sensitivity, and uncertainty; measurement and Value-of-
      Information do not automatically authorize enrichment, roadmap changes,
      thresholds, winners, or approval.
  - id: AC6
    condition: >
      Probabilistic confidence remains a claim rather than certainty; important
      intelligence remains auditable; confidence can be calibrated against later
      outcomes without requiring or introducing a new calibration implementation.
  - id: AC7
    condition: >
      Authorized Action, Outcome, and Learning are distinct: automation cannot
      widen mandate; outcome becomes new evidence rather than retroactive proof;
      learning may update future hypotheses/policy/calibration/decisions while
      preserving historical evidence and decision context.
  - id: AC8
    condition: >
      Product Intelligence remains the current canonical foundation; future Media,
      Distribution, and Commerce Operations Intelligence may compose only through
      explicit owners/interfaces and admitted feedback paths without shadow
      authority or direct upstream truth/history overwrite.
  - id: AC9
    condition: >
      Capability-honesty and bounded-certification rules prevent measured,
      certified, experimental, blocked, deferred, proposed, or aspirational states
      from being presented as universally implemented/proven capability.
  - id: AC10
    condition: >
      Only docs/PYTHON_AGENT_PRODUCT_CONTRACT.md and
      tests/governance/test_python_agent_product_contract.py change; focused
      deterministic verification and git diff --check pass with zero unresolved
      items.

verification:
  required:
    - 'python -m pytest tests/governance/test_python_agent_product_contract.py -q'
    - 'git diff --check'
