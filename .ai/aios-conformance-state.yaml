schema_version: 1
kind: aios_downstream_conformance_certification
project: Python Agent

authority:
  owner: BRAIN_REVIEW
  purpose: PUBLICATION_GATED_DOWNSTREAM_CERTIFICATION
  runtime_truth_store: false
  evidence_store: false
  grants_lifecycle_authority: false

certification:
  task_id: TASK-207
  task_revision: 8
  downstream_pin: edd7d8d92d54900c56442bbfcddb8648ec4d2e09
  status: CERTIFIED_ON_REVIEWED_SOURCE_PUBLICATION
  effective_only_when:
    semantic_review: PASS
    review_mode: PRIMARY
    published_source: EXACT_REVIEWED_CANDIDATE
    canonical_main_equals_reviewed_candidate: true
  before_gate: NOT_EFFECTIVE
  boundary: >-
    Runtime PASS and Reviewer PASS do not by themselves make this certification effective.
    The safe Publisher must publish exactly the TASK-207 revision-8 reviewed source candidate,
    and canonical main must equal that candidate.

